[kernel]
op = "merge_decode_gemm_crop_eq_gemm"
formats = ["e2"]
[params]
s0_numel = {type="int", min=128, max=256, multiple_of=128, default=128}
s1_tokens = {type="int", min=128, max=256, multiple_of=128, default=128}
s1_vocab = {type="int", min=1, max=8194, default=9}
s2_bias = {type="bool", default=false}
s2_k = {type="int", min=1, max=8194, default=9}
s2_m = {type="int", min=128, max=256, multiple_of=128, default=128}
s2_n = {type="int", min=128, max=1024, multiple_of=128, default=128}
s3_numel = {type="int", min=128, max=256, multiple_of=128, default=128}
s3_sel = {type="int", min=1, max=1, default=1}
s4_tokens = {type="int", min=128, max=256, multiple_of=128, default=128}
s4_vocab = {type="int", min=1, max=1, default=1}
s5_bias = {type="bool", default=false}
s5_k = {type="int", min=1, max=1, default=1}
s5_m = {type="int", min=128, max=256, multiple_of=128, default=128}
s5_n = {type="int", min=128, max=1024, multiple_of=128, default=128}
sharp = {type="float", default=65536.0}
[inputs]
in0 = {shape=[1,"s0_numel"], range=[0,7]}
w = {shape=["s2_k","s2_n"], range=[-2,2]}
v = {shape=[1,"s5_n"], range=[-2,2]}
[scratch]
ones = {shape=[128], fill=1}
work = {shape=[2,128]}
selectors = {shape=["s1_tokens // 128","ke",128]}
[outputs]
out0 = {shape=[1,"s2_m","s2_n"]}
out1 = {shape=[1,"s5_m","s5_n"]}
[derived]
qf = "case_qf"
ke = "min(s1_vocab,9)"
[abi]
in0 = "CR2"
w = "CR4"
v = "CR5"
ones = "CR6"
work = "CR7"
selectors = "CR8"
out0 = "CR9"
out1 = "CR10"
qf = "CR11"
sharp = "CR12"
[golden]
tolerance = {e2="EXACT"}
[cases.default]
[cases.short]
s1_vocab = 3
s2_k = 3
[cases.wide]
s0_numel = 256
s1_tokens = 256
s2_m = 256
s2_n = 1024
s3_numel = 256
s4_tokens = 256
s5_m = 256
s5_n = 1024
