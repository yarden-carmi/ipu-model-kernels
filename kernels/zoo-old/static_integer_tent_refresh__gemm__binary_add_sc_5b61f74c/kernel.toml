[kernel]
op="tent_embeddings_layernorm"
formats=["e2"]
[params]
s0_tokens={type="int",min=128,max=256,multiple_of=128,default=128}
s0_vocab={type="int",min=8,max=250002,default=8}
s1_bias={type="bool",default=false}
s1_k={type="int",min=8,max=250002,default=8}
s1_m={type="int",min=128,max=256,multiple_of=128,default=128}
s1_n={type="int",min=1024,max=1024,default=1024}
s2_broadcast={type="str",choices=["scalar"],default="scalar"}
s2_inner={type="int",min=0,max=0,default=0}
s2_numel={type="int",min=128,max=256,multiple_of=128,default=128}
s2_op={type="str",choices=["add"],default="add"}
s3_numel={type="int",min=128,max=256,multiple_of=128,default=128}
s4_tokens={type="int",min=128,max=256,multiple_of=128,default=128}
s4_vocab={type="int",min=9,max=514,default=9}
s5_bias={type="bool",default=false}
s5_k={type="int",min=9,max=514,default=9}
s5_m={type="int",min=128,max=256,multiple_of=128,default=128}
s5_n={type="int",min=1024,max=1024,default=1024}
s6_numel={type="int",min=128,max=256,multiple_of=128,default=128}
s6_sel={type="int",min=1,max=1,default=1}
s7_tokens={type="int",min=128,max=256,multiple_of=128,default=128}
s7_vocab={type="int",min=1,max=1,default=1}
s8_bias={type="bool",default=false}
s8_k={type="int",min=1,max=1,default=1}
s8_m={type="int",min=128,max=256,multiple_of=128,default=128}
s8_n={type="int",min=1024,max=1024,default=1024}
s9_broadcast={type="str",choices=["none"],default="none"}
s9_inner={type="int",min=0,max=0,default=0}
s9_numel={type="int",min=131072,max=262144,multiple_of=128,default=131072}
s9_op={type="str",choices=["add"],default="add"}
s10_broadcast={type="str",choices=["none"],default="none"}
s10_inner={type="int",min=0,max=0,default=0}
s10_numel={type="int",min=131072,max=262144,multiple_of=128,default=131072}
s10_op={type="str",choices=["add"],default="add"}
s11_channels={type="int",min=1024,max=1024,default=1024}
s11_eps={type="float",default=0.00001}
s11_kind={type="str",choices=["layernorm"],default="layernorm"}
s11_rows={type="int",min=128,max=256,multiple_of=128,default=128}
sharp={type="float",default=65536.0}
half={type="float",default=0.5}
[inputs]
in0={shape=[1,"s0_tokens"],range=[0,7]}
in1={shape=[1,"s4_tokens"],range=[-2,7]}
w0={shape=["s1_k","s1_n"],range=[-2,2]}
w1={shape=["s5_k","s5_n"],range=[-2,2]}
v={shape=[1,"s8_n"],range=[-2,2]}
gamma={shape=["s11_channels"],range=[-2,2]}
beta={shape=["s11_channels"],range=[-2,2]}
[outputs]
out0={shape=[1,"s11_rows","s11_channels"]}
[scratch]
ones={shape=[128],fill=1}
work={shape=["3*s11_rows*8+17*(s0_tokens//128)+40",128]}
epsilon={shape=[128],fill="s11_eps"}
invrow={shape=[128],fill="1 / s11_channels"}
[derived]
qf="case_qf"
[abi]
in0="CR2"
in1="CR3"
w0="CR4"
w1="CR5"
v="CR6"
gamma="CR7"
beta="CR8"
out0="CR9"
work="CR10"
ones="CR11"
sharp="CR12"
half="CR13"
qf="CR14"
invrow="LR14"
epsilon="LR15"
[golden]
tolerance={e2="NX8_STEP"}
[cases.default]
[cases.wide]
s0_tokens=256
s1_m=256
s2_numel=256
s3_numel=256
s4_tokens=256
s5_m=256
s6_numel=256
s7_tokens=256
s8_m=256
s9_numel=262144
s10_numel=262144
s11_rows=256
