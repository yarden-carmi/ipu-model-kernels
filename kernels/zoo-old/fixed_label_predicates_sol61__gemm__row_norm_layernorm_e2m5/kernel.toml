[kernel]
op="fixed_label_predicates_sol61__gemm__row_norm"
formats=["e2"]
[params]
s0_tokens={type="int",min=128,max=256,multiple_of=128,default=128}
s0_vocab={type="int",min=8,max=30522,default=8}
s1_k={type="int",min=8,max=30522,default=8}
s1_m={type="int",min=128,max=256,multiple_of=128,default=128}
s1_n={type="int",min=128,max=768,multiple_of=128,default=128}
s2_channels={type="int",min=128,max=768,multiple_of=128,default=128}
s2_rows={type="int",min=128,max=256,multiple_of=128,default=128}
s2_eps={type="float",min=0.0,max=1.0,default=1e-12}
s2_kind={type="str",choices=["layernorm"],default="layernorm"}
sharp={type="float",default=1024.0}
half={type="float",default=0.5}
[inputs]
in0={shape=[1,"s0_tokens"],range=[0,7]}
w={shape=["s1_k","s1_n"],range=[-1,1]}
add0={shape=[1,"s1_m","s1_n"],range=[-1,1]}
add1={shape=[1,"s1_m","s1_n"],range=[-1,1]}
gamma={shape=["s2_channels"],range=[-2,2]}
beta={shape=["s2_channels"],range=[-2,2]}
[outputs]
out0={shape=[1,"s2_rows","s2_channels"]}
[scratch]
mem={shape=["40 + s0_tokens//128*8 + 3*s1_m*s1_n//128",128],fill=1}
crow={shape=[128],fill="1/s2_channels"}
epsilon={shape=[128],fill="s2_eps"}
[derived]
qf="case_qf"
crowaddr="base(crow)"
epsaddr="base(epsilon)"
[abi]
in0="CR2"
w="CR3"
add0="CR4"
add1="CR5"
gamma="CR6"
beta="CR7"
out0="CR8"
mem="CR9"
qf="CR10"
sharp="CR11"
half="CR12"
crowaddr="LR15"
epsaddr="LR14"
[golden]
tolerance={e2="NX8_STEP"}
[cases.default]
[cases.wide]
s0_tokens=256
s1_m=256
s2_rows=256
s1_n=768
s2_channels=768
