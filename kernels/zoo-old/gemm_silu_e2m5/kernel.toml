[kernel]
op = "gemm_silu"
formats = ["e2"]

[params.m]
type = "int"
min = 1
max = 16384
multiple_of = 1
default = 64

[params.k]
type = "int"
min = 16
max = 240
multiple_of = 16
default = 16

[params.n]
type = "int"
min = 64
max = 1024
multiple_of = 32
default = 64

[params.bias]
type = "bool"
default = true

[derived]
qf = "case_qf"
nb = "ceil(n / 128)"
dsn = "ds(max(min(n - (nb - 1) * 128, 128), 0))"
rows_in = "max(ceil(m * k / 128), 722)"
stride = "rows_in * 128 / m"
qstep = "stride // 128"
sstep = "stride % 128"
c128 = "128"

[inputs.in0]
shape = ["rows_in", 128]
range = [-2.0, 2.0]

[inputs.w]
shape = ["k", "nb * 128"]
range = [-2.0, 2.0]

[inputs.bias_vec]
shape = ["nb", 128]
range = [-1.0, 1.0]

[inputs.lut]
shape = [5, 128]
range = [0.0, 1.0]

[outputs.out0]
shape = ["m", "nb * 128"]

[abi]
in0 = "CR2"
w = "CR3"
bias_vec = "CR4"
lut = "CR5"
out0 = "CR6"
qf = "CR7"
qstep = "CR8"
sstep = "CR9"
m = "CR10"
dsn = "CR11"
nb = "CR12"
c128 = "CR13"

[golden]
tolerance = { e2 = "NX8_STEP" }

[cases.default]
m = 2
k = 64
n = 256

[cases.call1]
m = 2
k = 128
n = 512

[cases.call2]
m = 2
k = 128
n = 768

[cases.call3]
m = 2
k = 160
n = 960

[cases.nobias]
m = 2
k = 96
n = 128
bias = false
