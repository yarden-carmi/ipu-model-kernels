[kernel]
op = "gemm"
formats = ["e2"]

[params.m]
type = "int"
min = 1
max = 16384
default = 1

[params.k]
type = "int"
min = 4
max = 5120
default = 128

[params.n]
type = "int"
min = 1
max = 50264
default = 128

[params.bias]
type = "bool"
default = false

[derived]
qf = "case_qf"
K = "ceil(k / 128)"
NB = "ceil(n / 128)"
c128 = "128"
full_blocks = "k // 128"
tail = "ds(n - (NB - 1) * 128)"

[inputs.in0]
shape = ["m * K", 128]
range = [-2.0, 2.0]

[inputs.w]
shape = ["K * 128 * NB", 128]
range = [-2.0, 2.0]

[inputs.b]
shape = ["NB * 128"]
range = [-2.0, 2.0]
when = "bias"

[outputs.out0]
shape = ["m * NB", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
K = "CR7"
NB = "CR8"
qf = "CR9"
tail = "CR10"
c128 = "CR11"
full_blocks = "CR12"

[golden]
tolerance = { e2 = "NX8_STEP" }

[cases.default]
m = 1
k = 128
n = 128
bias = true

[cases.tail]
m = 2
k = 256
n = 200
bias = false

[cases.k64]
m = 2
k = 64
n = 32
bias = true

[cases.large_k]
m = 2
k = 5120
n = 320
bias = true

[cases.k960]
m = 2
k = 960
n = 320
bias = true
