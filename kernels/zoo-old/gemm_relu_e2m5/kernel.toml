[kernel]
op = "gemm_relu"
formats = ["e2"]

[params.m]
type = "int"
min = 1
max = 16384
default = 2
[params.k]
type = "int"
min = 128
max = 1024
multiple_of = 128
default = 128
[params.n]
type = "int"
min = 128
max = 4096
multiple_of = 128
default = 256
[params.bias]
type = "bool"
default = true

[inputs.in0]
shape = [1, "m", "k"]
range = [-2, 2]
[inputs.w]
shape = ["k * NB", 128]
range = [-2, 2]
[inputs.b]
shape = ["n"]
range = [-2, 2]
when = "bias"
[outputs.out0]
shape = [1, "m", "n"]

[derived]
qf = "case_qf"
K = "k / 128"
NB = "n / 128"
c128 = "128"
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
qf = "CR9"
K = "CR7"
NB = "CR8"
c128 = "CR11"
[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
m = 3
k = 512
n = 256
bias = false
[cases.no_bias]
m = 2
k = 128
n = 128
bias = false
[cases.wide]
m = 2
k = 128
n = 256
bias = true
