[kernel]
op = "gemm_relu"
formats = ["e1"]
[params.m]
type = "int"
min = 1
max = 1024
default = 2
[params.k]
type = "int"
min = 128
max = 1024
multiple_of = 128
default = 128
[params.n]
type = "int"
min = 128
max = 4096
multiple_of = 128
default = 256
[params.bias]
type = "bool"
default = false
[derived]
qf = "case_qf"
K = "k / 128"
NB = "n / 128"
c128 = "128"
[inputs.in0]
shape = [1, "m", "k"]
range = [-1, 1]
[inputs.w]
shape = ["k", "n"]
range = [-1, 1]
[inputs.bias_vec]
shape = ["n"]
range = [-1, 1]
when = "bias"
[outputs.out0]
shape = [1, "m", "n"]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
bias_vec = "CR5"
m = "CR6"
K = "CR7"
NB = "CR8"
qf = "CR9"
c128 = "CR11"
[golden]
tolerance = { e1 = "NX8_STEP" }
[cases.default]
m = 2
k = 128
n = 256
bias = false
[cases.multiblock]
m = 3
k = 512
n = 256
bias = false
[cases.bias]
m = 2
k = 256
n = 128
bias = true
