[kernel]
op="fixed_hat_decode_gemm"
formats=["e2"]
[params]
s0_tokens={type="int",min=128,max=256,multiple_of=128,default=128}
s0_vocab={type="int",min=8,max=151669,default=8}
s1_bias={type="bool",default=false}
s1_k={type="int",min=8,max=151669,default=8}
s1_m={type="int",min=128,max=256,multiple_of=128,default=128}
s1_n={type="int",min=128,max=1024,multiple_of=128,default=128}
[inputs]
in0={shape=[1,"s0_tokens"],range=[0,7]}
w={shape=["s1_k","s1_n"],range=[-2,2]}
b={shape=["s1_n"],range=[-2,2],when="s1_bias"}
[outputs]
out0={shape=[1,"s1_m","s1_n"]}
[scratch]
ones={shape=[128],fill=1}
work={shape=[2,128]}
selectors={shape=["s0_tokens//128",8,128]}
[derived]
qf="case_qf"
valid="ds(128)"
blocks="s0_tokens//128"
nb="s1_n//128"
[abi]
in0="CR2"
w="CR3"
out0="CR4"
ones="CR5"
work="CR6"
selectors="CR7"
blocks="CR8"
nb="CR9"
b="CR10"
qf="CR14"
valid="CR15"
[golden]
tolerance={e2="NX8_STEP"}
[cases.default]
[cases.wide]
s0_tokens=256
s1_m=256
s1_n=1024
s0_vocab=17
s1_k=17
