[kernel]
op = "pool2d"
formats = ["e3"]

[params.channels]
type = "int"
min = 1
max = 128
default = 64
[params.h]
type = "int"
min = 2
max = 113
default = 8
[params.w]
type = "int"
min = 2
max = 113
default = 8
[params.k]
type = "int"
choices = [2]
default = 2
[params.padding]
type = "int"
choices = [0]
default = 0
[params.stride]
type = "int"
choices = [1]
default = 1
[params.kind]
type = "str"
choices = ["max"]
default = "max"

[derived]
qf = "case_qf"
ds_channels = "ds(channels)"
oh = "h - 1"
ow = "w - 1"

[inputs.in0]
shape = [1, "h", "w", 128]
range = [-10, 10]
[outputs.out0]
shape = [1, "oh", "ow", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf = "CR4"
ds_channels = "CR5"
w = "CR6"
oh = "CR7"
ow = "CR8"

[golden]
tolerance = { e3 = "EXACT" }
[cases.default]
[cases.small]
h = 3
w = 3
channels = 7
[cases.rect]
h = 5
w = 3
channels = 32
[cases.full_lanes]
h = 4
w = 4
channels = 128
