[kernel]
op="static_label_equal_n17b__gemm"
formats=["e2"]
[params]
s0_tokens={type="int",min=1,max=1,default=1}
s0_vocab={type="int",min=1,max=1001,default=8}
s1_bias={type="bool",default=false}
s1_k={type="int",min=1,max=1001,default=8}
s1_m={type="int",min=1,max=1,default=1}
s1_n={type="int",min=128,max=1152,multiple_of=128,default=128}
sharp={type="float",default=1048576.0}
five={type="float",default=5.0}
six={type="float",default=6.0}
sharp32={type="float",default=33554432.0}
[inputs]
in0={shape=[1],range=[-2,10]}
w={shape=["s1_k","s1_n"],range=[-1,1]}
b={shape=["s1_n"],range=[-1,1],when="s1_bias"}
[outputs]
out0={shape=[1,"s1_n"]}
[scratch]
ones={shape=[128],fill=1}
work={shape=["s0_vocab + 3",128]}
[derived]
qf="case_qf"
vocab="s0_vocab"
chunks="s1_n // 128"
limit="s0_vocab + 1"
[abi]
in0="CR2"
w="CR3"
out0="CR4"
sharp32="CR5"
limit="CR6"
ones="CR7"
work="CR8"
sharp="CR9"
five="CR10"
six="CR11"
vocab="CR12"
chunks="CR13"
qf="CR14"
b="LR15"
[cases.default]
[cases.singleton]
s0_vocab=1
s1_k=1
[cases.bias]
s1_bias=true
s1_n=256
[cases.real_vocab]
s0_vocab=1001
s1_k=1001
s1_n=1152
[golden]
tolerance={e2="EXACT"}
