[kernel]
op = "table_mean_rows"
formats = ["e2"]

[params.channels]
type = "int"
min = 128
max = 4096
multiple_of = 128
default = 768

[params.rows]
type = "int"
min = 1
max = 65536
default = 256

[inputs.in0]
shape = [1, "ceil(rows / 128) * 128"]
range = [0, 50256]

[inputs.mean]
shape = [1, "channels"]
range = [-1, 1]

[outputs.out0]
shape = [1, "rows", "channels"]

[derived]
qf = "case_qf"
blocks = "channels // 128"

[abi]
in0 = "CR2"
mean = "CR3"
out0 = "CR4"
qf = "CR5"
blocks = "CR6"
rows = "CR7"

[golden]
tolerance = { e2 = "EXACT" }

[cases.default]
rows = 3
channels = 256

[cases.single]
rows = 1
channels = 128

[cases.wide]
rows = 5
channels = 768
