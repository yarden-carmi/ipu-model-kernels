[kernel]
op="binary_merge_selector_gemms"
formats=["e2"]
[params]
s0_broadcast={type="str",choices=["scalar"],default="scalar"}
s0_inner={type="int",min=0,max=0,default=0}
s0_numel={type="int",min=128,max=256,multiple_of=128,default=128}
s0_op={type="str",choices=["add"],default="add"}
s1_numel={type="int",min=128,max=256,multiple_of=128,default=128}
s2_tokens={type="int",min=128,max=256,multiple_of=128,default=128}
s2_vocab={type="int",min=2,max=514,default=17}
s3_k={type="int",min=2,max=514,default=17}
s3_m={type="int",min=128,max=256,multiple_of=128,default=128}
s3_n={type="int",min=128,max=768,multiple_of=128,default=128}
s4_numel={type="int",min=128,max=256,multiple_of=128,default=128}
s4_sel={type="int",min=1,max=1,default=1}
s5_tokens={type="int",min=128,max=256,multiple_of=128,default=128}
s5_vocab={type="int",min=1,max=1,default=1}
s6_bias={type="bool",default=false}
s6_k={type="int",min=1,max=1,default=1}
s6_m={type="int",min=128,max=256,multiple_of=128,default=128}
s6_n={type="int",min=128,max=768,multiple_of=128,default=128}
sharp={type="float",default=65536.0}
thirtytwo={type="float",default=32.0}
[inputs]
in0={shape=[1,"s0_numel"],range=[0,513]}
w={shape=["s3_k","s3_n"],range=[-2,2]}
v={shape=[1,"s6_n"],range=[-2,2]}
[outputs]
out0={shape=[1,"s3_m","s3_n"]}
out1={shape=[1,"s6_m","s6_n"]}
[scratch]
mem={shape=["4 + (s2_tokens // 128) * s2_vocab",128]}
ones={shape=[128],fill=1}
[derived]
qf="case_qf"
valid="ds(128)"
vocab="s2_vocab"
blocks="s2_tokens // 128"
channels="s3_n // 128"
[abi]
in0="CR2"
w="CR3"
v="CR5"
mem="CR6"
ones="CR7"
qf="CR8"
sharp="CR9"
thirtytwo="CR10"
vocab="CR11"
blocks="CR12"
channels="CR13"
out0="CR14"
valid="CR15"
out1="LR14"
[golden]
tolerance={e2="EXACT"}
[cases.default]
[cases.merge]
s2_vocab=514
s3_k=514
