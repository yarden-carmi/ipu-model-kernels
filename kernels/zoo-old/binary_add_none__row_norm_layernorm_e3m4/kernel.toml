[kernel]
op = "binary_add_none__row_norm_layernorm"
formats = ["e3"]

[params.s0_broadcast]
type = "str"
choices = ["none"]
default = "none"

[params.s0_inner]
type = "int"
min = 0
max = 0
default = 0

[params.s0_numel]
type = "int"
min = 128
max = 263168
multiple_of = 128
default = 98304

[params.s0_op]
type = "str"
choices = ["add"]
default = "add"

[params.s1_channels]
type = "int"
min = 128
max = 768
multiple_of = 128
default = 384

[params.s1_eps]
type = "float"
min = 0
max = 1
default = 1e-12

[params.s1_kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"

[params.s1_rows]
type = "int"
min = 1
max = 257
default = 256

[params.half]
type = "float"
min = 0.5
max = 0.5
default = 0.5

[derived]
qf = "case_qf"
K = "s1_channels // 128"
M = "s1_rows * K"

[inputs.in0]
shape = [1, "s1_rows", "s1_channels"]
range = [-2, 2]

[inputs.in1]
shape = ["s0_numel"]
range = [-2, 2]

[inputs.gamma]
shape = ["s1_channels"]
range = [-2, 2]

[inputs.beta]
shape = ["s1_channels"]
range = [-2, 2]

[scratch.crow]
shape = [128]
fill = "1 / s1_channels"

[scratch.crowC]
shape = [128]
fill = "s1_channels"

[scratch.epsilon]
shape = [128]
fill = "s1_eps"

[scratch.tmp]
shape = [28, 128]

[outputs.out0]
shape = [1, "s1_rows", "s1_channels"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
gamma = "CR5"
beta = "CR6"
crow = "CR7"
crowC = "CR8"
epsilon = "CR9"
tmp = "CR10"
qf = "CR11"
half = "CR12"
K = "CR13"
M = "CR14"

[golden]
tolerance = { e3 = "NX8_STEP" }

[cases.default]
s1_rows = 2
s0_numel = 768

[cases.r3]
s1_rows = 3
s0_numel = 1152

[cases.r5]
s1_rows = 5
s0_numel = 1920
