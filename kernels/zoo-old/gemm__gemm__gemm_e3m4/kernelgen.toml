notes = "Three e3m4 GEMMs. out0 and out2 have channels along lanes; out1 has matrix rows along lanes, with zero tail padding. Middle-stage weights retain natural n,k order for dot-product reductions into individual accumulator slots. Final stage gathers each input scalar from that row-lane layout. Bias rows are packed stage0/stage1/stage2. Intermediate rounding follows each output's physical rows."
