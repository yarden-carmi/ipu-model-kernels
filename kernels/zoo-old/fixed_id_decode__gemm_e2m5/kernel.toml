[kernel]
op = "fixed_id_decode__gemm"
formats = ["e2"]

[params.s0_tokens]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128

[params.s0_vocab]
type = "int"
min = 1
max = 30522
default = 9

[params.s1_bias]
type = "bool"
default = false

[params.s1_k]
type = "int"
min = 1
max = 30522
default = 9

[params.s1_m]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128

[params.s1_n]
type = "int"
min = 128
max = 1024
multiple_of = 128
default = 128

[params.sharp]
type = "float"
default = 1024.0

[params.six]
type = "float"
default = 6.0

[params.neg1]
type = "float"
default = -1.0

[derived]
qf = "case_qf"
ntb = "s0_tokens // 128"
nb = "s1_n // 128"
ke = "min(s0_vocab, 8)"
scrrows = "(3 * ke + 2) * ntb"

[inputs.in0]
shape = [1, "s0_tokens"]
range = [0.0, 7.0]

[inputs.weights]
shape = ["s1_k", "s1_n"]
range = [-1.0, 1.0]

[inputs.add0]
shape = [1, "s1_m", "s1_n"]
range = [-1.0, 1.0]

[inputs.add1]
shape = [1, "s1_m", "s1_n"]
range = [-1.0, 1.0]

[inputs.bias]
shape = ["s1_n"]
range = [-1.0, 1.0]
when = "s1_bias"

[outputs.out0]
shape = [1, "s1_m", "s1_n"]

[scratch.ones]
shape = [1, 128]
fill = 1

[scratch.scr]
shape = ["scrrows", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
scr = "CR5"
add0 = "CR6"
add1 = "CR7"
qf = "CR8"
sharp = "CR9"
six = "CR10"
neg1 = "CR11"
bias = "CR12"
ones = "CR13"

[golden]
tolerance = { e2 = "NX8_STEP" }

[cases.default]
s0_tokens = 128
s0_vocab = 9
s1_k = 9
s1_m = 128
s1_n = 128
s1_bias = false

[cases.two_blocks]
s0_tokens = 256
s0_vocab = 20
s1_k = 20
s1_m = 256
s1_n = 256

[cases.short_vocab]
s0_tokens = 128
s0_vocab = 3
s1_k = 3
s1_m = 128
s1_n = 128

[cases.with_bias]
s0_tokens = 128
s0_vocab = 9
s1_k = 9
s1_m = 128
s1_n = 256
s1_bias = true

[cases.big]
s0_tokens = 256
s0_vocab = 30522
s1_k = 30522
s1_m = 256
s1_n = 768
