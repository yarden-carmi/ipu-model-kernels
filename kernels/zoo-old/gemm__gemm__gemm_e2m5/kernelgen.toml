notes = "Three GEMMs with optional biases, arbitrary row counts, and full 128-lane K/N tiles. All outputs have N along lanes. All weights are transposed offline to K,N; biases pack stage 0, 1, 2 vectors. Each intermediate is stored and rounded in its required layout before the next GEMM. The preceding scalar multiply is already folded into stage 0 constants by the home computation. Chain dimensions must agree."
