[kernel]
op = "binary_add"
formats = ["e3"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"

[params.const]
type = "float"
min = -448.0
max = 448.0
default = 1.0

[params.inner]
type = "int"
min = 0
max = 1
default = 0

[params.numel]
type = "int"
min = 1
max = 655360
default = 98304

[params.op]
type = "str"
choices = ["add"]
default = "add"

[derived]
qf = "case_qf"
rows = "ceil(numel / 128)"
full = "numel // 128"
ds_tail = "ds(max(numel % 128, 1))"
in1_rows = "98304 // 128"

[inputs.in0]
shape = ["numel"]
range = [-448.0, 448.0]

[inputs.in1]
shape = [98304]
range = [-448.0, 448.0]

[outputs.out0]
shape = ["numel"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf = "CR5"
full = "CR6"
rows = "CR7"
ds_tail = "CR8"
in1_rows = "CR9"

[golden]
tolerance = { e3 = "EXACT" }

[cases.default]
