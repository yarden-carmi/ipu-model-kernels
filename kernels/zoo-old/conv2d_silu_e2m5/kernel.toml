[kernel]
op = "conv2d_silu"
formats = ["e2"]
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 1536
default = 3
[params.cout]
type = "int"
min = 1
max = 1536
default = 4
[params.groups]
type = "int"
min = 1
max = 1536
default = 1
[params.h]
type = "int"
min = 1
max = 128
default = 4
[params.w]
type = "int"
min = 1
max = 128
default = 4
[params.kh]
type = "int"
min = 1
max = 3
default = 3
[params.kw]
type = "int"
min = 1
max = 3
default = 3
[params.padding]
type = "int"
min = 0
max = 1
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 1
[derived]
qf = "case_qf"
nbi = "ceil(cin / 128)"
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
dsout0 = "ds(ho)"
wrows = "cout * kh * kw * ceil(cin / (groups * 128))"
dsci = "ds(min(cin // groups,128))"
[inputs.in0]
shape = ["h * w * nbi",128]
range = [-2.0,2.0]
[inputs.weights]
shape = ["wrows",128]
range = [-1.0,1.0]
[inputs.bias_vec]
shape = ["cout",128]
range = [-1.0,1.0]
[inputs.lut]
shape = [5,128]
range = [0.0,1.0]
[outputs.out0]
shape = ["cout * wo",128]
[scratch.clean]
shape = ["max(wrows,(h+2*padding)*(w+2*padding)*nbi)",128]
[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
bias_vec = "CR5"
lut = "CR6"
qf = "CR7"
cout = "CR8"
h = "CR9"
w = "CR10"
ho = "CR11"
wrows = "CR12"
dsout0 = "CR15"
clean = "CR13"
dsci = "CR14"
[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
[cases.dw]
cin = 512
cout = 512
groups = 512
h = 3
w = 3
[cases.strided]
cin = 48
cout = 8
padding = 0
stride = 2
h = 5
w = 5
