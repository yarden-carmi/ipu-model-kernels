[kernel]
op="tent_gemm_layernorm"
formats=["e2"]
[params]
s0_tokens={type="int",min=128,max=256,multiple_of=128,default=128}
s0_vocab={type="int",min=8,max=50257,default=8}
s1_bias={type="bool",default=false}
s1_k={type="int",min=8,max=50257,default=8}
s1_m={type="int",min=128,max=256,multiple_of=128,default=128}
s1_n={type="int",min=128,max=768,multiple_of=128,default=128}
s2_channels={type="int",min=128,max=768,multiple_of=128,default=128}
s2_rows={type="int",min=128,max=256,multiple_of=128,default=128}
s2_kind={type="str",choices=["layernorm"],default="layernorm"}
s2_eps={type="float",min=0,max=1,default=0.00001}
[inputs]
in0={shape=[1,"s0_tokens"],range=[0,7]}
w={shape=["s1_k","s1_n"],range=[-2,2]}
add={shape=[1,"s1_m","s1_n"],range=[-2,2]}
gamma={shape=["s2_channels"],range=[-2,2]}
beta={shape=["s2_channels"],range=[-2,2]}
[outputs]
out0={shape=[1,"s1_m","s1_n"]}
out1={shape=[1,"s2_rows","s2_channels"]}
[scratch]
ones={shape=[128],fill=1}
work={shape=[2,128]}
selectors={shape=["s0_tokens//128",8,128]}
tmp={shape=[32,128]}
epsilon={shape=[128],fill="s2_eps"}
recip={shape=[128],fill="1 / s2_channels"}
count={shape=[128],fill="s2_channels"}
half={shape=[128],fill=0.5}
[derived]
qf="case_qf"
valid="ds(128)"
constants="base(recip)"
counts="base(count)"
halves="base(half)"
[abi]
in0="CR2"
w="CR3"
out0="CR4"
ones="CR5"
work="CR6"
selectors="CR7"
add="CR8"
gamma="CR9"
beta="CR10"
tmp="CR11"
epsilon="CR12"
out1="CR13"
qf="CR14"
valid="CR15"
constants="LR14"
counts="LR13"
halves="LR12"
[golden]
tolerance={e2="NX8_STEP"}
[cases.default]
[cases.wide]
s0_tokens=256
s1_m=256
s1_n=768
s2_channels=768
s2_rows=256
