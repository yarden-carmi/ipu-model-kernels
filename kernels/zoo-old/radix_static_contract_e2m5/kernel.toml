[kernel]
op = "radix_static_contract"
formats = ["e2"]
[params.tokens]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128
[params.vocab]
type = "int"
min = 1
max = 250002
default = 9
[params.dim]
type = "int"
min = 128
max = 768
multiple_of = 128
default = 128
[params.sharp]
type = "float"
default = 1024.0
[derived]
qf = "case_qf"
valid = "ds(128)"
ke = "min(vocab, 8)"
[inputs.in0]
shape = [1, "tokens"]
range = [0, 7]
[inputs.table]
shape = ["vocab", "dim"]
range = [-2, 2]
[outputs.out0]
shape = [1, "tokens", "dim"]
[scratch.ones]
shape = [128]
fill = 1
[scratch.work]
shape = [3, 128]
[scratch.selectors]
shape = ["tokens // 128", "ke", 128]
[abi]
in0 = "CR2"
table = "CR3"
ones = "CR4"
work = "CR5"
selectors = "CR6"
out0 = "CR7"
sharp = "CR8"
qf = "CR9"
valid = "CR15"
[golden]
tolerance = { e2 = "EXACT" }
[cases.default]
[cases.two_blocks]
tokens = 256
vocab = 20
dim = 256
[cases.short_vocab]
vocab = 3
