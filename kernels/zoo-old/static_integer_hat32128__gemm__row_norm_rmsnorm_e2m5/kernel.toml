[kernel]
op = "static_integer_hat32128__gemm__row_norm_rmsnorm"
formats = ["e2"]
[params.s0_tokens]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128
[params.s0_vocab]
type = "int"
min = 8
max = 32128
default = 9
[params.s1_m]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128
[params.s1_k]
type = "int"
min = 8
max = 32128
default = 9
[params.s1_n]
type = "int"
min = 128
max = 512
multiple_of = 128
default = 128
[params.s1_bias]
type = "bool"
default = false
[params.s2_channels]
type = "int"
min = 128
max = 512
multiple_of = 128
default = 128
[params.s2_rows]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128
[params.s2_kind]
type = "str"
choices = ["rmsnorm"]
default = "rmsnorm"
[params.s2_eps]
type = "float"
default = 0.000001
[params.sharp]
type = "float"
default = 1024.0
[derived]
qf = "case_qf"
valid = "ds(128)"
ntb = "s0_tokens // 128"
ke = "min(s0_vocab, 8)"
[inputs.in0]
shape = [1, "s0_tokens"]
range = [0, 7]
[inputs.w]
shape = ["s1_k", "s1_n"]
range = [-2, 2]
[inputs.gamma]
shape = ["s2_channels"]
range = [-2, 2]
[outputs.out0]
shape = [1, "s2_rows", "s2_channels"]
[scratch.ones]
shape = [128]
fill = 1
[scratch.work]
shape = [2, 128]
[scratch.selectors]
shape = ["ntb", "ke", 128]
[scratch.gemm]
shape = ["s1_m", "s1_n"]
[scratch.tmp]
shape = [8, 128]
[scratch.recip]
shape = [128]
fill = "1 / s2_channels"
[scratch.epsilon]
shape = [128]
fill = "s2_eps"
[abi]
in0 = "CR2"
w = "CR3"
ones = "CR4"
work = "CR5"
selectors = "CR6"
gemm = "CR7"
sharp = "CR8"
gamma = "CR9"
out0 = "CR10"
tmp = "CR11"
recip = "CR12"
epsilon = "CR13"
qf = "CR14"
valid = "CR15"
[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
[cases.two_blocks]
s0_tokens = 256
s1_m = 256
s2_rows = 256
