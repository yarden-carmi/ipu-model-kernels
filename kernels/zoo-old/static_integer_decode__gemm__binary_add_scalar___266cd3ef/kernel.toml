[derived]
qf = "case_qf + 65536 * ds(128)"
[inputs.in0]
shape = [1,"s0_tokens"]
range = [0,7]
[inputs.in1]
shape = [1,128]
range = [1,1]
[inputs.w1]
shape = ["s1_k","s1_n"]
range = [-2,2]
[inputs.w5]
shape = ["s5_k","s5_n"]
range = [-2,2]
[inputs.table]
shape = [1,"s7_dim"]
range = [-2,2]
[inputs.gamma]
shape = ["s10_channels"]
range = [-2,2]
[inputs.beta]
shape = ["s10_channels"]
range = [-2,2]
[scratch.work]
shape = ["40 + s5_m * s5_n // 128",128]
fill = 1
[scratch.pos]
shape = ["s4_vocab + 1",128]
[scratch.c]
shape = [128]
fill = "1 / s10_channels"
[scratch.epsilon]
shape = [128]
fill = "s10_eps"
[outputs.out0]
shape = [1,"s10_rows","s10_channels"]
[abi]
in0 = "CR2"
in1 = "CR3"
w1 = "CR4"
w5 = "CR5"
