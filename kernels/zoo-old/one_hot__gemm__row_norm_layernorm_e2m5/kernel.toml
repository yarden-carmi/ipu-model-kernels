[kernel]
op = "one_hot__gemm__row_norm_layernorm"
formats = ["e2"]
[params.s0_tokens]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128
[params.s0_vocab]
type = "int"
min = 8
max = 30522
default = 8
[params.s1_m]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128
[params.s1_k]
type = "int"
min = 8
max = 30522
default = 8
[params.s1_n]
type = "int"
min = 128
max = 768
multiple_of = 128
default = 128
[params.s1_bias]
type = "bool"
default = false
[params.s2_rows]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128
[params.s2_channels]
type = "int"
min = 128
max = 768
multiple_of = 128
default = 128
[params.s2_eps]
type = "float"
default = 1e-12
[params.s2_kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.sharp]
type = "float"
default = 1024.0
[params.half]
type = "float"
default = 0.5
[derived]
qf = "case_qf"
[inputs.in0]
shape = [1, "s0_tokens"]
range = [0, 7]
[inputs.w]
shape = ["s1_k", "s1_n"]
range = [-2, 2]
[inputs.gamma]
shape = ["s2_channels"]
range = [-2, 2]
[inputs.beta]
shape = ["s2_channels"]
range = [-2, 2]
[scratch.work]
shape = [64, 128]
fill = 1
[scratch.selectors]
shape = ["s0_tokens // 128", 8, 128]
[scratch.x]
shape = ["s0_tokens", "s1_n"]
[scratch.c]
shape = [128]
fill = "1 / s2_channels"
[scratch.epsilon]
shape = [128]
fill = "s2_eps"
[outputs.out0]
shape = [1, "s2_rows", "s2_channels"]
[abi]
in0 = "CR2"
w = "CR3"
half = "CR4"
work = "CR5"
selectors = "CR6"
out0 = "CR7"
sharp = "CR8"
qf = "CR9"
x = "CR10"
gamma = "CR11"
beta = "CR12"
c = "CR13"
epsilon = "CR14"
[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
[cases.wide]
s1_n = 768
s2_channels = 768
