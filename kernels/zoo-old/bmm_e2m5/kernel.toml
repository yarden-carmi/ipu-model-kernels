[kernel]
op = "bmm"
formats = ["e2"]
[params.b]
type = "int"
min = 2
max = 8
multiple_of = 2
default = 2
[params.k]
type = "int"
min = 1
max = 1500
default = 5
[params.m]
type = "int"
min = 1
max = 1500
default = 2
[params.n]
type = "int"
min = 64
max = 64
default = 64
[inputs.in0]
shape = [1, "b", "m", "kc * 128"]
range = [-2, 2]
[params.maskval]
type = "float"
default = -0.2421875
[scratch.masks]
shape = [2, 128]
fill = 1
[inputs.in1]
shape = [1, "b", "k", 128]
range = [-2, 2]
[outputs.out0]
shape = [1, "m", "b * n"]
[derived]
qf = "case_qf"
kc = "ceil(k / 128)"
tail = "k - (kc - 1) * 128"
full = "128"
one = "ds(8)"
astride = "m * kc"
mstride = "m * kc"
dsfull = "ds(128)"
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
k = "CR6"
maskval = "CR7"
kc = "CR8"
tail = "CR9"
full = "CR10"
one = "CR11"
astride = "CR12"
dsfull = "CR13"
qf = "CR14"
masks = "CR15"
[golden]
tolerance = { e2 = "EXACT" }
[cases.default]
b = 2
m = 2
k = 5
n = 64
[cases.chunks]
b = 2
m = 1
k = 130
n = 64
[cases.batches]
b = 8
m = 2
k = 3
n = 64
[cases.single]
b = 2
m = 1
k = 1
n = 64
