w0 = "CR3"
lut = "CR4"
c128 = "CR5"
pad = "CR6"
qf = "CR7"
w1 = "CR8"
ds1 = "CR9"
out1 = "CR10"
s2_h = "CR11"
s2_w = "CR12"
wpr = "CR13"
ds0 = "CR14"
in1 = "LR13"
out0 = "LR15"
dsk = "CR2"
