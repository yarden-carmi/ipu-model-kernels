max = 128
default = 16
[params.s1_m]
type = "int"
min = 1
max = 4096
default = 6
[params.s1_n]
type = "int"
min = 1
max = 256
default = 64
[params.s2_bias]
type = "bool"
default = true
[params.s2_cin]
type = "int"
min = 1
max = 256
default = 64
[params.s2_cout]
type = "int"
min = 1
max = 256
default = 64
[params.s2_groups]
type = "int"
min = 1
max = 256
default = 64
[params.s2_h]
type = "int"
min = 1
max = 64
default = 2
[params.s2_w]
type = "int"
min = 1
max = 64
default = 3
[params.s2_kh]
type = "int"
min = 3
