[kernel]
op = "unary_cos"
formats = ["e1"]

[params.fn]
type = "str"
choices = ["cos"]
default = "cos"

[params.numel]
type = "int"
min = 1
max = 65536
default = 160

[derived]
qf = "case_qf"
rows = "ceil(numel / 128)"
full = "numel // 128"
ds_tail = "ds(max(numel % 128, 1))"

[inputs.in0]
shape = [256]
range = [-448.0, 448.0]

[inputs.lut]
shape = [256]
range = [0.0, 1.0]

[outputs.out0]
shape = ["numel"]

[abi]
in0 = "CR2"
out0 = "CR3"
lut = "CR4"
qf = "CR5"
rows = "CR6"
full = "CR7"
ds_tail = "CR8"

[golden]
tolerance = { e1 = "NX8_STEP" }

[cases.default]
