[kernel]
op = "binary_mul_scalar"
formats = ["e3"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"

[params.const]
type = "int"
min = 1
max = 1
default = 1

[params.inner]
type = "int"
min = 0
max = 0
default = 0

[params.numel]
type = "int"
min = 128
max = 1048576
multiple_of = 128
default = 128

[params.op]
type = "str"
choices = ["mul"]
default = "mul"

[derived]
qf = "case_qf"
rows = "numel / 128"
valid = "ds(128)"

[inputs.in0]
shape = [1, 1, "numel / 128", 128]
range = [-2.0, 2.0]

[inputs.operand]
shape = [1]
range = [-2.0, 2.0]

[outputs.out0]
shape = [1, 1, "numel / 128", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf = "CR4"
operand = "CR5"
rows = "CR6"
valid = "CR15"

[golden]
tolerance = { e3 = "EXACT" }

[cases.default]
numel = 128

[cases.multiple_rows]
numel = 896
