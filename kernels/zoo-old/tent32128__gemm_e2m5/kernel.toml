[kernel]
op = "tent32128__gemm_e2m5"
formats = ["e2"]
[params]
s0_tokens = {type="int", min=128, max=256, multiple_of=128, default=128}
s0_vocab = {type="int", min=1, max=32128, default=9}
s1_m = {type="int", min=128, max=256, multiple_of=128, default=128}
s1_k = {type="int", min=1, max=32128, default=9}
s1_n = {type="int", min=128, max=512, multiple_of=128, default=128}
s1_bias = {type="bool", default=false}
negative = {type="float", default=-1.0}
[inputs]
in0 = {shape=[1,"s0_tokens"], range=[0,7]}
w = {shape=["s1_k","s1_n"], range=[-2,2]}
[scratch]
ones = {shape=[128], fill=1}
tmp = {shape=[128]}
sel = {shape=["s0_tokens // 128","ke",128]}
[outputs]
out0 = {shape=[1,"s1_m","s1_n"]}
[derived]
qf = "case_qf"
ke = "min(s0_vocab, 8)"
valid = "ds(128)"
[abi]
in0 = "CR2"
w = "CR3"
ones = "CR4"
tmp = "CR5"
sel = "CR6"
out0 = "CR7"
qf = "CR8"
negative = "CR9"
valid = "CR15"
[golden]
tolerance = {e2="NX8_STEP"}
[cases.default]
[cases.wide]
s0_tokens = 256
s1_m = 256
s1_n = 512
s0_vocab = 20
s1_k = 20
[cases.short]
s0_vocab = 3
s1_k = 3
