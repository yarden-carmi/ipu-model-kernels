[kernel]
op = "conv2d_relu"
formats = ["e1"]
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 256
default = 3
[params.cout]
type = "int"
min = 1
max = 256
default = 16
[params.groups]
type = "int"
min = 1
max = 256
default = 1
[params.h]
type = "int"
min = 1
max = 1024
default = 4
[params.w]
type = "int"
min = 1
max = 1024
default = 4
[params.kh]
type = "int"
min = 1
max = 7
default = 3
[params.kw]
type = "int"
min = 1
max = 7
default = 3
[params.padding]
type = "int"
min = 0
max = 3
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 2
[derived]
qf = "case_qf"
nbi = "ceil(cin / 128)"
nbo = "ceil(cout / 128)"
cing = "cin // groups"
wp = "w + 2 * padding"
wpr = "wp * nbi"
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
wrows = "kh * kw * cing * nbo"
pad_rows = "(h + 2 * padding) * wp * nbi"
out_rows = "ho * wo * nbo"
dsout0 = "ds(min(cout, 128))"
[inputs.in0]
shape = ["h * w * nbi", 128]
range = [-2.0, 2.0]
[inputs.weights]
shape = ["wrows + nbo", 128]
range = [-1.0, 1.0]
[inputs.bias_vec]
shape = ["nbo", 128]
range = [-1.0, 1.0]
[scratch.pad]
shape = ["pad_rows", 128]
[outputs.out0]
shape = ["out_rows", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
bias_vec = "CR5"
qf = "CR7"
pad = "CR8"
h = "CR9"
w = "CR10"
ho = "CR11"
wo = "CR12"
wpr = "CR13"
dsout0 = "CR14"
[golden]
tolerance = { e1 = "NX8_STEP" }
[cases.default]
cin = 64
cout = 64
groups = 1
h = 16
w = 16
stride = 1
[cases.call0]
cin = 16
cout = 16
groups = 16
h = 112
w = 112
stride = 2
[cases.call2]
cin = 72
cout = 72
groups = 72
h = 56
w = 56
stride = 2
[cases.call3]
cin = 88
cout = 88
groups = 88
h = 28
w = 28
stride = 1
[cases.call4]
cin = 32
cout = 32
groups = 1
h = 224
w = 224
stride = 1
