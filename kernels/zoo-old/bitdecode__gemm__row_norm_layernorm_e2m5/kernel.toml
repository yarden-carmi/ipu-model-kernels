[kernel]
op = "bitdecode__gemm__row_norm_layernorm"
formats = ["e2"]
[params]
s0_tokens = {type="int", min=128, max=256, multiple_of=128, default=128}
s0_vocab = {type="int", min=8, max=30522, default=9}
s1_m = {type="int", min=128, max=256, multiple_of=128, default=128}
s1_k = {type="int", min=8, max=30522, default=9}
s1_n = {type="int", min=128, max=1024, multiple_of=128, default=128}
s1_bias = {type="bool", choices=[false], default=false}
s2_rows = {type="int", min=128, max=256, multiple_of=128, default=128}
s2_channels = {type="int", min=128, max=1024, multiple_of=128, default=128}
s2_kind = {type="str", choices=["layernorm"], default="layernorm"}
s2_eps = {type="float", min=0.0, max=1.0, default=1e-12}
compare_scale = {type="float", default=1048576.0}
eight = {type="float", default=8.0}
five = {type="float", default=5.0}
half = {type="float", default=0.5}
[derived]
qf = "case_qf"
tb = "ceil(s0_tokens / 128)"
nb = "s1_n // 128"
memrows = "34 + tb * s0_vocab + 3 * s1_m * nb + 40"
crowaddr = "base(crow)"
epsaddr = "base(epsilon)"
[inputs]
in0 = {shape=[1,"s0_tokens"], range=[0,7]}
weights = {shape=["s1_k","s1_n"], range=[-1,1]}
add0 = {shape=[1,"s1_m","s1_n"], range=[-1,1]}
add1 = {shape=[1,"s1_m","s1_n"], range=[-1,1]}
gamma = {shape=["s2_channels"], range=[-2,2]}
beta = {shape=["s2_channels"], range=[-2,2]}
[scratch]
mem = {shape=["memrows",128], fill=1}
crow = {shape=[128], fill="1 / s2_channels"}
epsilon = {shape=[128], fill="s2_eps"}
[outputs]
out0 = {shape=[1,"s2_rows","s2_channels"]}
[abi]
in0 = "CR2"
weights = "CR3"
add0 = "CR4"
add1 = "CR5"
gamma = "CR6"
beta = "CR7"
out0 = "CR8"
mem = "CR9"
qf = "CR10"
compare_scale = "CR11"
eight = "CR12"
five = "CR13"
half = "CR14"
crowaddr = "LR15"
epsaddr = "LR14"
[golden]
tolerance = {e2="NX8_STEP"}
[cases.default]
[cases.wide]
s0_tokens = 256
s1_m = 256
s2_rows = 256
s1_n = 1024
s2_channels = 1024
s0_vocab = 20
s1_k = 20
