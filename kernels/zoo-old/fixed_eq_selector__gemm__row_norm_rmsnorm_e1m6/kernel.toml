[kernel]
op = "fixed_eq_selector__gemm__row_norm"
formats = ["e1"]
[params.s0_tokens]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128
[params.s0_vocab]
type = "int"
min = 1
max = 32128
default = 9
[params.s1_m]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128
[params.s1_k]
type = "int"
min = 1
max = 32128
default = 9
[params.s1_n]
type = "int"
min = 128
max = 512
multiple_of = 128
default = 512
[params.s1_bias]
type = "bool"
default = false
[params.s2_channels]
type = "int"
min = 128
max = 512
multiple_of = 128
default = 512
[params.s2_rows]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128
[params.s2_kind]
type = "str"
choices = ["rmsnorm"]
default = "rmsnorm"
[params.s2_eps]
type = "float"
default = 0.000001
[params.sharp]
type = "float"
default = 1024.0
[derived]
qf = "case_qf"
ntb = "s0_tokens // 128"
ke = "min(s0_vocab, 8)"
K = "s2_channels // 128"
M = "s2_rows * K"
valid = "ds(128)"
[inputs.in0]
shape = [1, "s0_tokens"]
range = [0.0, 7.0]
[inputs.w]
shape = ["s1_k", "s1_n"]
range = [-2.0, 2.0]
[inputs.gamma]
shape = ["s2_channels"]
range = [-2.0, 2.0]
[scratch.ones]
shape = [1, 128]
fill = 1.0
[scratch.work]
shape = [8, 128]
[scratch.selectors]
shape = ["ntb", "ke", 128]
[scratch.intermediate]
shape = [1, "s1_m", "s1_n"]
[scratch.recip]
shape = [128]
fill = "1 / s2_channels"
[scratch.epsilon]
shape = [128]
fill = "s2_eps"
[outputs.out0]
shape = [1, "s2_rows", "s2_channels"]
[abi]
in0 = "CR2"
w = "CR3"
ones = "CR4"
work = "CR5"
selectors = "CR6"
intermediate = "CR7"
sharp = "CR8"
qf = "CR9"
gamma = "CR10"
recip = "CR11"
epsilon = "CR12"
out0 = "CR13"
M = "CR14"
K = "LR15"
valid = "CR15"
[golden]
tolerance = { e1 = "NX8_STEP" }
[cases.default]
[cases.short_vocab]
s0_vocab = 3
s1_k = 3
s1_n = 128
s2_channels = 128
[cases.two_blocks]
s0_tokens = 256
s1_m = 256
s2_rows = 256
s0_vocab = 20
s1_k = 20
s1_n = 256
s2_channels = 256
