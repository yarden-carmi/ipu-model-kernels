scalar="CR3"
w="CR4"
v="CR5"
ones="CR6"
work="CR7"
sel="CR8"
out0="CR9"
out1="CR10"
qf="CR11"
sharp="CR13"
flag="CR14"
valid="CR15"
[golden]
tolerance={e2="NX8_STEP"}
[cases.default]
[cases.wide]
s0_numel=256
s1_numel=256
s2_tokens=256
s3_m=256
