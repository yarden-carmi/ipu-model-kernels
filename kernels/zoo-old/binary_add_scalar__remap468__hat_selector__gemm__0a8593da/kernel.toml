[scratch]
ones={shape=[128],fill=1}
work={shape=[2,128]}
sel={shape=["s2_tokens // 128",9,128]}
flag={shape=[128]}
[outputs]
out0={shape=[1,"s3_m","s3_n"]}
out1={shape=[1,"s6_m","s6_n"]}
[derived]
qf="case_qf"
valid="ds(128)"
[abi]
