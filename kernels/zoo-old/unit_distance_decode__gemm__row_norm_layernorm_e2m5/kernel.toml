[kernel]
op = "unit_distance_decode__gemm__row_norm_layernorm_e2m5"
formats = ["e2"]
[params]
s0_tokens = {type="int", min=128, max=256, multiple_of=128, default=128}
s0_vocab = {type="int", min=1, max=50264, default=9}
s1_m = {type="int", min=128, max=256, multiple_of=128, default=128}
s1_k = {type="int", min=1, max=50264, default=9}
s1_n = {type="int", min=128, max=1024, multiple_of=128, default=128}
s1_bias = {type="bool", default=false}
s2_channels = {type="int", min=128, max=1024, multiple_of=128, default=128}
s2_rows = {type="int", min=128, max=256, multiple_of=128, default=128}
s2_eps = {type="float", min=0, max=1, default=0.00001}
s2_kind = {type="str", choices=["layernorm"], default="layernorm"}
negative = {type="float", default=-1.0}
half = {type="float", default=0.5}
[inputs]
in0 = {shape=[1,"s0_tokens"], range=[0,7]}
w = {shape=["s1_k","s1_n"], range=[-2,2]}
add = {shape=["s1_m","s1_n"], range=[-0.5,0.5]}
gamma = {shape=["s2_channels"], range=[-2,2]}
beta = {shape=["s2_channels"], range=[-2,2]}
[scratch]
ones = {shape=[128], fill=1}
tmp = {shape=[32,128], fill=0.5}
sel = {shape=["s0_tokens // 128","ke",128]}
x = {shape=[2,"s1_m","s1_n"]}
recip = {shape=[128], fill="1 / s2_channels"}
epsilon = {shape=[128], fill="s2_eps"}
[outputs]
out0 = {shape=[1,"s2_rows","s2_channels"]}
[derived]
qf = "case_qf"
ke = "min(s0_vocab, 8)"
valid = "ds(128)"
[abi]
in0 = "CR2"
w = "CR3"
ones = "CR4"
tmp = "CR5"
sel = "CR6"
x = "CR7"
qf = "CR8"
negative = "CR9"
add = "CR10"
gamma = "CR11"
beta = "CR12"
recip = "CR13"
epsilon = "CR14"
valid = "CR15"
out0 = "LR15"
[golden]
tolerance = {e2="NX8_STEP"}
[cases.default]
[cases.wide]
s0_tokens=256
s1_m=256
s2_rows=256
s1_n=1024
s2_channels=1024
s0_vocab=20
s1_k=20
[cases.short]
s0_vocab=3
s1_k=3
