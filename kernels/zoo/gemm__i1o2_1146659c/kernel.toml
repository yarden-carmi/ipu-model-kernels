[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 16384
default = 64
[params.n]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 16384
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 16384
default = 8
[derived]
chunks = "ceil(k / 128)"
pack = "1 + min(1, 64 // out0_d2) * (1 - out0_d3 % 2)"
tiles = "ceil(out0_d2 * pack / 128)"
pitch = "in0_d3 * chunks"
in_batch = "in0_d2 * pitch"
batches = "in0_d0"
height = "out0_d2"
lanes = "128"
full = "ds(128)"
tail = "ds(out0_d2 * pack - 128 * (tiles - 1))"
wr = "n * (2 + 2 * chunks)"

[inputs.in0]
shape = ["in0_d0 * in_batch", 128]
range = [-2, 2]
[inputs.w]
shape = ["wr", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d3 * tiles // pack", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
chunks = "CR8"
pitch = "CR9"
height = "CR10"
batches = "CR11"
lanes = "CR12"
in_batch = "CR13"
n = "CR14"
tail = "CR15"

[cases.default]
