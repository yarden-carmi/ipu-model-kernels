[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 16
[params.cout]
type = "int"
min = 1
max = 128
default = 16
[params.groups]
type = "int"
min = 1
max = 128
default = 16
[params.h]
type = "int"
min = 3
max = 224
default = 16
[params.w]
type = "int"
min = 3
max = 224
default = 16
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 16
[params.in0_d2]
type = "int"
min = 3
max = 224
default = 16
[params.in0_d3]
type = "int"
min = 3
max = 224
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d2]
type = "int"
min = 2
max = 224
default = 8
[params.out0_d3]
type = "int"
min = 2
max = 224
default = 8

[derived]
tail = "ds(out0_d1)"
depthwise = "min(1, groups // max(cin, cout))"
tap_rows = "2 * (depthwise + (1 - depthwise) * cin)"
weight_rows = "2 + 9 * tap_rows"
output_rows = "out0_d0 * out0_d2 * out0_d3"
line_step = "stride * in0_d3"
batch_step = "in0_d2 * in0_d3"
last_x = "out0_d3 - 1"
last_y = "out0_d2 - 1"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", 128]
range = [-2, 2]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tail = "CR7"
output_rows = "CR8"
line_step = "CR9"
batch_step = "CR10"
last_x = "CR11"
last_y = "CR12"
cin = "CR13"
tap_rows = "CR14"

[cases.default]
