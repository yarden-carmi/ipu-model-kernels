[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 128
[params.cout]
type = "int"
min = 1
default = 256
[params.groups]
type = "int"
min = 1
default = 1
[params.h]
type = "int"
min = 7
default = 28
[params.w]
type = "int"
min = 7
default = 28
[params.kh]
type = "int"
choices = [3, 7]
default = 3
[params.kw]
type = "int"
choices = [3, 7]
default = 3
[params.padding]
type = "int"
choices = [1, 3]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 128
[params.in0_d2]
type = "int"
min = 7
default = 28
[params.in0_d3]
type = "int"
min = 7
default = 28
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 256
[params.out0_d2]
type = "int"
min = 1
default = 14
[params.out0_d3]
type = "int"
min = 1
default = 14

[derived]
blocks = "ceil(out0_d1 / 128)"
ds_pair = "ds(128) + 65536 * ds((out0_d1 - 1) % 128 + 1)"
weight_rows = "2 * blocks * (1 + kh * kw * cin)"
output_rows = "out0_d0 * out0_d2 * out0_d3 * blocks"
batch_step = "in0_d2 * in0_d3"
end_x = "out0_d3 * stride - padding"
end_y = "out0_d2 * stride - padding"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", 128]
range = [-2, 2]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", "128 * blocks"]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
ds_pair = "CR7"
output_rows = "CR8"
weight_rows = "CR9"
batch_step = "CR10"
end_x = "CR11"
end_y = "CR12"
in0_d3 = "CR13"
in0_d2 = "CR14"
cin = "CR15"

[cases.default]
