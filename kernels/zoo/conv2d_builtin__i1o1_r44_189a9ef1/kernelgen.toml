chain = ["conv2d"]
chain_in = ["in0"]
chain_out = ["out0"]
notes = "Depthwise 3x3 convolution with channels along the lanes. Read input rows in place and omit out-of-bounds taps. Stream the two weight parts through two cyclic slots, keep both bias parts resident, and prefetch the first tap of the next interior pixel. Apply activation in the store."
[layout.in0]
lanes = 1
rows = [0, 2, 3]
[view.in0]
kind = "whole"
[layout.out0]
lanes = 1
rows = [0, 2, 3]
