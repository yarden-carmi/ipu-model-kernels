[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=32767, default=16}
k = {type="int", min=1, max=32767, default=64}
m = {type="int", min=1, max=32767, default=64}
n = {type="int", min=1, max=32767, default=48}
in0_d0 = {type="int", min=1, max=32767, default=4}
in0_d1 = {type="int", min=1, max=32767, default=4}
in0_d2 = {type="int", min=1, max=32767, default=64}
in0_d3 = {type="int", min=1, max=32767, default=64}
in1_d0 = {type="int", min=1, max=32767, default=4}
in1_d1 = {type="int", min=1, max=32767, default=64}
in1_d2 = {type="int", min=1, max=32767, default=576}
out0_d0 = {type="int", min=1, max=32767, default=4}
out0_d1 = {type="int", min=1, max=32767, default=4}
out0_d2 = {type="int", min=1, max=32767, default=64}
out0_d3 = {type="int", min=1, max=32767, default=48}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "a_tiles*128"]
range = [0, 1]

[inputs.in1]
shape = ["in1_d0", "rhs_rows", 128]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]

[derived]
a_tiles = "ceil(in0_d2/128)"
pair_rows = "ceil(2*in1_d1/128)"
rhs_rows = "ceil(in1_d2/2)*pair_rows"
view_start = "in1_d2-in0_d1*n"
start_row = "(view_start//2)*pair_rows"
rhs_group_step = "rhs_rows*min(in1_d0-1,1)"
a_head_step = "a_tiles*in0_d3"
groups = "b//in0_d1"
m_tiles = "m+a_tiles*65536"
k_limit = "k+128*65536"
n_heads = "n+in0_d1*65536"
odd_start = "in1_d1//128+(in1_d1%128)*65536"
pair_info = "pair_rows+(view_start%2)*65536"
ds = "ds(128)+65536*ds((m-1)%128+1)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
m_tiles = "CR8"
k_limit = "CR9"
n_heads = "CR10"
rhs_group_step = "CR11"
a_head_step = "CR12"
ds = "CR13"
odd_start = "CR14"
pair_info = "CR15"
start_row = "LR1"
groups = "LR11"

[cases.default]
