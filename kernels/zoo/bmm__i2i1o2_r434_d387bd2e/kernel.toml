[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=2147483647, default=12}
k = {type="int", min=1, max=64, default=50}
m = {type="int", min=1, max=32767, default=50}
n = {type="int", min=1, max=32767, default=64}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=12}
in0_d2 = {type="int", min=1, max=32767, default=50}
in0_d3 = {type="int", min=1, max=64, default=50}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=64, default=50}
in1_d2 = {type="int", min=1, max=2147483647, default=768}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=12}
out0_d2 = {type="int", min=1, max=32767, default=50}
out0_d3 = {type="int", min=1, max=32767, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "a_tiles*128"]
range = [0, 1]

[inputs.in1]
shape = ["in1_d0", "rhs_rows", 128]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]

[derived]
a_tiles = "ceil(in0_d2/128)"
rhs_rows = "ceil(in1_d2/2)"
rhs_group_step = "rhs_rows*min(in1_d0-1,1)"
a_head_step = "a_tiles*in0_d3"
groups = "b//in0_d1"
m_and_tiles = "m+a_tiles*65536"
k_and_pitch = "k+in1_d1*65536"
ds = "ds(128)+65536*ds((m-1)%128+1)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
m_and_tiles = "CR8"
k_and_pitch = "CR9"
n = "CR10"
in0_d1 = "CR11"
rhs_group_step = "CR12"
a_head_step = "CR13"
ds = "CR14"
groups = "LR11"

[cases.default]
