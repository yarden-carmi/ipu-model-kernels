[kernel]
op = "row_norm"
formats = ["e2"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 136
max = 256
multiple_of = 8
default = 240
[params.rows]
type = "int"
min = 4
max = 8128
multiple_of = 4
default = 64
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-5
[params.in0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 2032
default = 16
[params.in0_d2]
type = "int"
min = 136
max = 256
multiple_of = 8
default = 240
[params.out0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 2032
default = 16
[params.out0_d2]
type = "int"
min = 136
max = 256
multiple_of = 8
default = 240

[derived]
M = "2 * rows"
ds_pair = "ds(128) + 65536 * ds(channels - 128)"
half = "1277440"
src_indices = "50462976"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / 128)", 128]
range = [-2.0, 2.0]
[inputs.gamma]
shape = [6, 128]
[inputs.beta]
shape = [6, 128]
[inputs.stats]
shape = [4, 128]
[scratch.tmp]
shape = [36, 128]
[scratch.gathered]
shape = ["2 * M", 128]
[scratch.normalized]
shape = ["3 * M", 128]
[outputs.out0]
shape = ["ceil(out0_d1 * out0_d2 / 8)", 128]

[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
stats = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
src_indices = "CR10"
normalized = "CR11"
qf_stats = "CR12"
half = "CR13"
ds_pair = "CR14"
gathered = "CR15"
M = "LR13"

[cases.default]
