[kernel]
op = "row_norm"
formats = ["e2"]
[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 8
max = 4096
default = 144
[params.rows]
type = "int"
min = 1
max = 16384
default = 1024
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-5
[params.in0_d0]
type = "int"
min = 1
max = 16
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 144
[params.out0_d0]
type = "int"
min = 1
max = 16
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.out0_d2]
type = "int"
min = 8
max = 4096
default = 144

[derived]
chunks = "ceil(in0_d2 / 128)"
gather = "chunks + 65536 * ds(8 * out0_d0)"
stride = "ceil(out0_d1 / 128)"
channel_stride = "channels + 65536 * stride"
size = "out0_d0 * out0_d2 * stride"
ds_pair = "ds(out0_d1 - (stride - 1) * 128) + 65536 * ds(128)"
token_dims = "in0_d1 + 65536 * in0_d0"
view_step = "((rows - rows % in0_d2) / in0_d2) * chunks + 65536 * (rows % in0_d2)"
work_qf = "qf(1, 6, 8, 0) + 65536 * qf(1, 5, 8, 0)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * chunks", 128]
range = [-2.0, 2.0]
[inputs.affine]
shape = ["10 * channels", 128]
[inputs.stats]
shape = [11, 128]
[scratch.tmp]
shape = ["40 + 4 * channels", 128]
[scratch.transposed]
shape = ["8 * size", 128]
[outputs.out0]
shape = ["out0_d1 * ceil(out0_d2 / 8)", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
affine = "CR4"
stats = "CR5"
tmp = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
work_qf = "CR9"
ds_pair = "CR10"
channel_stride = "CR11"
transposed = "CR12"
gather = "CR13"
token_dims = "CR14"
view_step = "CR15"
stride = "LR8"
size = "LR9"

[cases.default]
