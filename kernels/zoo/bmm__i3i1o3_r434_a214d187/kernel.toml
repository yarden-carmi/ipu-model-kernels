[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=16, default=16}
k = {type="int", min=1, max=512, default=256}
m = {type="int", min=1, max=512, default=256}
n = {type="int", min=1, max=512, default=36}
in0_d0 = {type="int", min=1, max=4, default=4}
in0_d1 = {type="int", min=1, max=16, default=4}
in0_d2 = {type="int", min=1, max=512, default=256}
in0_d3 = {type="int", min=1, max=512, default=256}
in1_d0 = {type="int", min=1, max=4, default=4}
in1_d1 = {type="int", min=1, max=512, default=256}
in1_d2 = {type="int", min=1, max=1024, default=432}
out0_d0 = {type="int", min=1, max=4, default=4}
out0_d1 = {type="int", min=1, max=16, default=4}
out0_d2 = {type="int", min=1, max=512, default=256}
out0_d3 = {type="int", min=1, max=512, default=36}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ak*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "bk*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[derived]
ak = "ceil(in0_d3/128)"
bk = "ceil(in1_d1/128)"
kcm1 = "ceil(k/128)-1"
dsk = "ds((k-1)%128+1)"
bgap = "(in1_d2-out0_d1*n)*bk"
output_ds = "ds(128)+65536*ds((n-1)%128+1)"
agap = "(in0_d2-m)*ak"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
n = "CR7"
ak = "CR8"
bk = "CR9"
output_ds = "CR10"
qf_in0 = "CR11"
dsk = "CR12"
qf_out0 = "CR13"
kcm1 = "CR14"
bgap = "CR15"
out0_d1 = "LR14"
agap = "LR15"

[cases.default]
