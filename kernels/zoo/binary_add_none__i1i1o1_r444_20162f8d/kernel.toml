[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 65536 }
in0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in0_d1 = { type = "int", min = 1, max = 64, default = 64 }
in0_d2 = { type = "int", min = 1, max = 16777216, default = 32 }
in0_d3 = { type = "int", min = 1, max = 16777216, default = 32 }
in1_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in1_d1 = { type = "int", min = 1, max = 64, default = 64 }
in1_d2 = { type = "int", min = 1, max = 16777216, default = 32 }
in1_d3 = { type = "int", min = 1, max = 16777216, default = 32 }
out0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
out0_d1 = { type = "int", min = 1, max = 64, default = 64 }
out0_d2 = { type = "int", min = 1, max = 16777216, default = 32 }
out0_d3 = { type = "int", min = 1, max = 16777216, default = 32 }

[derived]
rows = "out0_d0 * out0_d2 * out0_d3"
pairs = "rows // 2"
packed_rows = "ceil(in1_d0 * in1_d2 * in1_d3 / 2)"
active = "ds(out0_d1)"
r1_start = "128"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", 128]
range = [-2, 2]
[inputs.in1]
shape = ["packed_rows", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
pairs = "CR8"
rows = "CR9"
active = "CR10"
in1_d1 = "CR11"
r1_start = "CR12"

[cases.default]
