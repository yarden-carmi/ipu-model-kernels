[kernel]
op = "binary_add"
formats = ["e2", "e3"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 15360
[params.in0_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 16384
multiple_of = 8
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 16384
multiple_of = 16
default = 240
[params.in1_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 16
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 240
[params.out0_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 240

[derived]
plane = "out0_d0 * out0_d1"
width = "ceil(plane / 128)"
tail = "ds(plane - (width - 1) * 128)"
last_row = "width * out0_d2 - 1"
full = "width - 1"

[inputs.in0]
shape = ["in0_d0", "ceil(in0_d1 * in0_d2 / 128)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d2", "ceil(in1_d0 * in1_d1 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d2", "width", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
last_row = "CR8"
full = "CR9"
tail = "CR10"

[cases.default]
