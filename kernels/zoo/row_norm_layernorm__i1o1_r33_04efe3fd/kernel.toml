[kernel]
op = "row_norm"
formats = ["e2"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 1
max = 4096
default = 384
[params.rows]
type = "int"
min = 1
max = 65536
default = 1829
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-12
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 1829
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 384
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 1829
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 384

[derived]
stride = "(in0_d1 + 127) // 128"
size = "in0_d0 * in0_d2 * stride"
ds_pair = "ds((in0_d1 - 1) % 128 + 1) + 65536 * ds(128)"

[inputs.in0]
shape = ["size", 128]
[inputs.affine]
shape = ["16 * channels", 128]
[inputs.stats]
shape = [18, 128]
[scratch.tmp]
shape = ["64 + 8 * channels + 8 * ceil(channels / 8)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * ((out0_d1 + 127) // 128)", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
affine = "CR4"
stats = "CR5"
tmp = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
qf_stats = "CR9"
ds_pair = "CR10"
channels = "CR11"
qf_affine = "CR12"
stride = "LR8"
size = "LR9"

[cases.default]
