[kernel]
op = "row_norm"
formats = ["e2"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 1
max = 4096
default = 768
[params.rows]
type = "int"
min = 1
max = 65536
default = 256
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-12
[params.in0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 768
[params.out0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 768
[derived]
stride = "(in0_d1 + 127) // 128"
out_stride = "(out0_d1 + 127) // 128"
size = "in0_d0 * in0_d2 * stride"
ds_pair = "ds(in0_d1 - (stride - 1) * 128) + 65536 * ds(128)"

[inputs.in0]
shape = ["size", 128]
[inputs.affine]
shape = ["6 * channels", 128]
[inputs.stats]
shape = [5, 128]
[scratch.tmp]
shape = ["32 + 3 * channels", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out_stride", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
affine = "CR4"
stats = "CR5"
tmp = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
qf_stats = "CR9"
ds_pair = "CR10"
channels = "CR11"
stride = "LR8"
size = "LR9"

[cases.default]
