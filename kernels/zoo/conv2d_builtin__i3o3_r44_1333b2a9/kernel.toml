[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params]
act_out0 = {type = "str", choices = ["relu"], default = "relu"}
bias = {type = "bool", default = true}
cin = {type = "int", min = 1, max = 512, default = 64}
cout = {type = "int", min = 1, max = 512, default = 64}
groups = {type = "int", choices = [1], default = 1}
h = {type = "int", min = 1, max = 224, default = 56}
w = {type = "int", min = 1, max = 224, default = 56}
kh = {type = "int", min = 1, max = 7, default = 3}
kw = {type = "int", min = 1, max = 7, default = 3}
padding = {type = "int", min = 0, max = 3, default = 1}
stride = {type = "int", choices = [1, 2], default = 1}
in0_d0 = {type = "int", min = 1, default = 1}
in0_d1 = {type = "int", min = 1, max = 512, default = 64}
in0_d2 = {type = "int", min = 1, max = 224, default = 56}
in0_d3 = {type = "int", min = 1, max = 224, default = 56}
out0_d0 = {type = "int", min = 1, default = 1}
out0_d1 = {type = "int", min = 1, max = 512, default = 64}
out0_d2 = {type = "int", min = 2, max = 230, multiple_of = 2, default = 56}
out0_d3 = {type = "int", min = 1, max = 128, default = 56}

[derived]
input_lines = "in0_d0 * in0_d1 * in0_d2"
chunks = "ceil(in0_d3 / 128)"
pack = "max(1, min(2, 128 // out0_d3))"
out_rows = "out0_d0 * out0_d1 * out0_d2 // pack"
weight_rows = "1 + 3 * cout * cin"
parts = "1 + min(1, (stride - 1) * (chunks - 1) * (2 - pack))"
scratch_rows = "input_lines * kw * parts"
plane = "in0_d2 * kw * parts"
batch_pitch = "plane * in0_d1"
full = "ds(128)"
line_ds = "ds(out0_d3) + 65536 * ds((in0_d3 - 1) % 128 + 1)"
packed_ds = "ds(out0_d3 * pack)"
dst_lo = "50462976"
dst_hi = "117835012"
src_lo = "100925952"
src_hi = "235670024"
end_y = "out0_d2 * stride - padding"

[inputs.in0]
shape = ["input_lines", "chunks", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out_rows", 128]
[scratch.windows]
shape = ["scratch_rows * pack + 1", 128]

[abi]
in0 = "CR2"
weights = "CR3"
windows = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
line_ds = "CR9"
packed_ds = "CR10"
in0_d2 = "CR11"
plane = "CR12"
batch_pitch = "CR13"
weight_rows = "CR14"
scratch_rows = "CR15"
dst_lo = "LR0"
dst_hi = "LR1"
src_lo = "LR2"
src_hi = "LR3"

[cases.default]
