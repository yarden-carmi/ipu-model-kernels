[kernel]
op = "gemm_table"
formats = ["e2", "e3"]

[params.k]
type = "int"
min = 1
max = 4096
default = 192
[params.n]
type = "int"
min = 1
max = 4096
default = 384
[params.m]
type = "int"
min = 1
max = 4096
default = 256
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["gelu_tanh", "silu"]
default = "gelu_tanh"
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 192
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 384
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 8
[params.in1_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 65535
default = 160
[params.in1_d2]
type = "int"
min = 1
max = 65535
default = 8
[params.in1_d3]
type = "int"
min = 1
max = 65535
default = 8

[derived]
ir = "in0_d0 * in0_d1 * ceil(in0_d2 / 128)"
out_rows = "out0_d0 * out0_d1 * out0_d2 * ceil(out0_d3 / 128)"
tiles = "ceil(n / 128)"
stride = "(m // in0_d2) * ceil(in0_d2 / 128)"
coeff_rows = "n * (2 + 2 * k)"
full = "ds(128)"
width_ds = "ds(out0_d3)"
full_count = "128"
height = "out0_d2"
input_rows = "k * out0_d2"
output_start = "n * out0_d2 - 1"

[inputs.in0]
shape = ["ir", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d2 * in1_d3 * ceil(in1_d1 / 128)", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.tmp]
shape = ["input_rows", 128]
[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
coeff = "CR4"
lut = "CR5"
tmp = "CR6"
out0 = "CR7"
qf_in0 = "CR8"
qf_in1 = "CR9"
qf_out0 = "CR10"
full = "CR11"
width_ds = "CR12"
in0_d2 = "CR13"
height = "CR14"
tiles = "LR15"
full_count = "CR15"
input_rows = "LR8"
output_start = "LR9"

[cases.default]
