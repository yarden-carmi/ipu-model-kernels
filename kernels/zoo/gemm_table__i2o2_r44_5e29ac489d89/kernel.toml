[kernel]
op = "gemm_table"
formats = ["e2", "e3"]

[params.k]
type = "int"
min = 1
max = 4096
default = 160
[params.n]
type = "int"
min = 1
max = 4096
default = 640
[params.m]
type = "int"
min = 1
max = 65535
default = 256
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["gelu_tanh", "silu"]
default = "silu"
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 160
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 4096
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 640
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 4096
default = 8

[derived]
blocks = "in0_d3"
batch_rows = "in0_d1 * blocks"
ir = "in0_d0 * batch_rows"
out_rows = "out0_d0 * out0_d1 * out0_d3"
chunks = "3 * ceil(k / 32)"
groups = "ceil(k / 32) - 1"
coeff_rows = "n * (chunks + 3)"
full = "ds(128)"
tail = "ds(out0_d2)"

[inputs.in0]
shape = ["ir", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
lut = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
batch_rows = "CR8"
blocks = "CR9"
n = "CR10"
full = "CR11"
tail = "CR12"
in0_d0 = "CR13"
chunks = "CR14"
groups = "CR15"

[cases.default]
