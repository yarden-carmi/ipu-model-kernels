[kernel]
op = "row_softmax"
formats = ["e1", "e2"]

[params.n]
type = "int"
min = 1
max = 128
default = 50
[params.rows]
type = "int"
min = 1
default = 600
[params.in0_d0]
type = "int"
default = 1
[params.in0_d1]
type = "int"
default = 12
[params.in0_d2]
type = "int"
default = 50
[params.in0_d3]
type = "int"
default = 50
[params.out0_d0]
type = "int"
default = 1
[params.out0_d1]
type = "int"
default = 12
[params.out0_d2]
type = "int"
default = 50
[params.out0_d3]
type = "int"
default = 50

[derived]
pack = "1 + 64 // in0_d3"
packed_end = "256 + pack * in0_d3"
full = "ds(128)"
active = "ds(n)"
scratch_qf = "312 * 65536 + 56"

[inputs.in0]
shape = ["ceil(in0_d0 * in0_d1 * in0_d2 / pack)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3 / 128)", 128]
[scratch.tmp]
shape = [11, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
scratch_qf = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
rows = "CR8"
qf_out0 = "CR10"
n = "CR12"
packed_end = "CR13"
active = "CR14"
full = "CR15"

[cases.default]
