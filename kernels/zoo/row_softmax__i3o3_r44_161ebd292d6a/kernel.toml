[kernel]
op = "row_softmax"
formats = ["e2"]

[params.n]
type = "int"
min = 1
max = 128
default = 64
[params.rows]
type = "int"
min = 1
default = 512
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 8
[params.in0_d2]
type = "int"
min = 1
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 8
[params.out0_d2]
type = "int"
min = 1
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 64

[derived]
pack = "1 + 64 // in0_d3"
packed_end = "384 + pack * in0_d3"
full = "ds(128)"
active = "ds(n)"
single = "ds(1)"
work_qf = "40"

[inputs.in0]
shape = ["ceil(in0_d0 * in0_d1 * in0_d2 / pack)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", 128]
[scratch.tmp]
shape = [8, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
tmp = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
work_qf = "CR7"
full = "CR8"
active = "CR9"
single = "CR10"
rows = "CR11"
n = "CR12"
packed_end = "CR13"

[cases.default]
