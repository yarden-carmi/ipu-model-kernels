kind = "exact"
method = "exact"
task = "binary_sub_row"
hw_clean = true
host_steps = []
chain_in = "a"
chain_out = "y"
unsupported = [
  "{\"broadcast\": \"none\", \"inner\": 0, \"numel\": 4096, \"op\": \"sub\"}: b's row pointer would have to advance with a's; this kernel holds one broadcast row resident for the whole call (its `broadcast` takes only \"row\").",
  "{\"broadcast\": \"col\", \"inner\": 64, \"numel\": 4096, \"op\": \"sub\"}: one scalar per row of a, repeated along its row, would be MULT.RC.VE with a per-row element index; the multiply stage selects one element with an LR the render would have to recompute per row, declared out.",
  "{\"broadcast\": \"scalar\", \"inner\": 1, \"numel\": 4096, \"op\": \"sub\"}: a scalar b is MULT.RC.VE against the resident row's element 0; declared out with the other broadcast modes.",
  "{\"broadcast\": \"row\", \"inner\": 129, \"numel\": 4096, \"op\": \"sub\"}: above the declared inner maximum (128). The broadcast row is one XMEM row the kernel loads once; more values would need its pointer to cycle over several rows while a's runs on (no non-power-of-two wrap in the LR stage).",
  "{\"broadcast\": \"row\", \"inner\": 64, \"numel\": 4096, \"op\": \"div\"}: no exact reciprocal: the AaQ stage's `reciprocal` is a hardware approximation and its result lands in an 8-bit block row before the multiply that uses it, so a quotient would carry an error the kernel's `exact` kind does not allow.",
  "{\"broadcast\": \"row\", \"inner\": 64, \"numel\": 4096, \"op\": \"min\"}: the accumulator has ADD, MAX and SUB only, so min needs a negation, and the AaQ stage's activation set holds none; ACC.MAX of the two negated operands would have to be negated again, a row round trip through XMEM.",
  "{\"broadcast\": \"row\", \"inner\": 64, \"numel\": 262272, \"op\": \"sub\"}: above the declared numel maximum (262144 = 2048 rows of a and y).",
]
notes = """One parameterised program for every (op, inner, numel): y = a (op) b with
broadcast = row -- b is one row of `inner` values (1..128, lanes past `inner` zero) that
every row of a combines with, so the kernel loads b once into R1 and its pointer never
moves; a and y are the chip's activation layout (row i holds elements 128i..128i+127,
lanes past numel zero), so the kernel reads the rows the previous kernel wrote and leaves
rows the next one reads. add/sub/max are two words per row of a: word A multiplies the
resident b row by the CR constant 1.0 and initialises R_ACC (ACC.SUB.FIRST lands -b in
R_ACC for sub, ACC.MAX.FIRST seeds max), word B multiplies the a row resident in R0 by
1.0, accumulates and stores the row with ACTIVATE.QUANTIZE identity; each word loads the
a row the next word multiplies. `mul` is one product per row (MULT.RC.VV of the cyclic a
row against the resident b row) so its word carries the store and the next a load. The
shape reaches the program through CRs only and the row loop is dynamic, so the whole call
is one launch: the surveyed t5-small call (sub, inner 64, numel 4096, 32 rows) is 65
words. The last row of a call is short and is emitted straight-line with its own DS half,
as is the row before it, which keeps the one-row-ahead loads inside the regions; a
store's DS names exactly the live lanes, so lanes past numel are written 0. Every LR the
program reads is set by it, R_ACC is initialised by the .FIRST accumulate of every row
and R_MASK is loaded from its own scratch row, so it runs after another kernel as well as
from reset. Limits: op add|sub|mul|max, broadcast row, inner 1..128, numel 1..262144;
none/col/scalar broadcast and div/min are in `unsupported`, each for a stated reason;
there is no FP32 variant -- dynamic is the chip's NX8 type. Accuracy: the products and
the accumulator adds are exact in FP32 and only the store rounds, so the golden (float64,
quantized row by row like the store) matches at max |err| 0, tolerance NX8_STEP 1 ulp."""
