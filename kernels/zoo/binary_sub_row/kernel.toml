# binary_sub_row: y = a (op) b elementwise with b broadcast as a row.
#
#   op        : add | sub | mul | max
#   broadcast : row   -- b is one row of `inner` values, every row of a
#                        combines with it (a bias)
#
# `col` (one scalar per row of a), `scalar` and `none` are out of this kernel's
# domain, and `div`/`min` too: no exact reciprocal in the AaQ stage and no min
# in the accumulator. `inner` takes 1..128: the broadcast row is one XMEM row
# the kernel loads once, and larger `inner` values would need its row pointer
# to cycle over several rows.
#
# Every tensor is the layout every activation on the chip uses: a and y are
# rows 0 .. ceil(numel/128)-1 of their regions, row i holding features
# 128i..128i+127, lanes past numel zero; b is one row of `inner` values, lanes
# past `inner` zero. The kernel reads what the previous kernel wrote and
# leaves what the next one reads, with no repack between them.
#
# Dataflow, per 128-lane row of a: an operand in XMEM costs a LOAD and a word
# has one LOAD and one MULT slot, and a subtract needs two multiplies (the
# only way into R_ACC is MULT_RES), so add/sub/max are two words per row: word
# A multiplies the resident b row by the CR constant 1.0 and initialises the
# accumulator (ACC.SUB.FIRST lands -b in R_ACC for sub), word B multiplies the
# a row resident in R0 by 1.0, accumulates and stores the row; each word loads
# the a row the next word multiplies. `mul` is one product per row (the
# resident b row against the cyclic a row) so its word carries the store and
# the next a load.
#
# XMEM: a and y are ceil(numel/128) rows each, b one row and the mask row the
# only scratch, so the largest surveyed call (4096 elements) takes 65 rows.

[kernel]
op = "binary"
formats = ["dynamic"]

[params]
op = { type = "str", choices = ["add", "sub", "mul", "max"], default = "sub" }
numel = { type = "int", min = 1, max = 262144 }          # elements of a and of y
inner = { type = "int", min = 1, max = 128 }             # b's row length: the one broadcast row
broadcast = { type = "str", choices = ["row"], default = "row" }

[derived]
qf = "case_qf"                                  # CR14: the case's QF half
rows = "ceil(numel / 128)"                      # a's and y's rows: the loop's trips
tail = "numel - 128 * (rows - 1)"               # the last row's active lanes
ds = "halves(ds(128), ds(tail))"                # CR15: full row / last row
slot1 = "128"                                   # CR12: R1's element offset in Ra
bound = "rows - ceil((128 - tail) / 127) - 1"   # CR13: the row loop's bound


[inputs.a]
shape = ["numel"]
range = [-1, 1]

[inputs.b]
shape = ["inner"]                               # the one broadcast row
range = [-1, 1]

[outputs.y]
shape = ["numel"]

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"                     # LD.MASK: every lane active, whatever a previous kernel left

[abi]
a = "CR2"
b = "CR3"
y = "CR4"
maskr = "CR5"
slot1 = "CR12"
bound = "CR13"
qf = "CR14"
ds = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: only the store rounds; the golden is quantized the same way, so the
# kernel's own datapath is exact products and exact accumulator adds.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 1, why = "the store's row quantization, measured exact; one step of margin for a row scale that moves" } }

[cases.default]                                 # google-t5/t5-small: x3 per forward
op = "sub"
broadcast = "row"
inner = 64
numel = 4096

[cases.add]
op = "add"
broadcast = "row"
inner = 64
numel = 4096

[cases.max]
op = "max"
broadcast = "row"
inner = 64
numel = 1000

[cases.mul]                                     # the one-word loop
op = "mul"
broadcast = "row"
inner = 64
numel = 1000

[cases.one]                                     # the narrowest call: one lane, one row
op = "sub"
broadcast = "row"
inner = 1
numel = 1

[cases.tile]                                    # exactly one 128-lane row
op = "sub"
broadcast = "row"
inner = 64
numel = 128

[cases.tail]                                    # one row and a lane, full-width row
op = "sub"
broadcast = "row"
inner = 128
numel = 129

[cases.two_rows]                                # the loop's shortest trip
op = "sub"
broadcast = "row"
inner = 100
numel = 200

[cases.sweep]                                   # the structure of the calls, scaled down
op = ["add", "sub", "mul", "max"]
inner = [1, 64, 128]
numel = [1, 2, 5, 127, 128, 129, 255, 1000]
