[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.m]
type = "int"
min = 1
max = 65536
default = 257
[params.k]
type = "int"
min = 1
max = 16384
default = 1536
[params.n]
type = "int"
min = 1
max = 16384
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 1536
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 384

[derived]
tiles = "ceil(out0_d2 / 128)"
rows = "out0_d0 * out0_d1"
chunks = "ceil(in0_d2 / 128)"
end = "(k - 1) % 128"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
width = "128"
full_end = "127"
p = "24 + 44 * min(1, k // 512)"
pair_end = "p - 1"
packed_rows = "tiles * (k + 1 + (chunks - 1) * p + min(p, end + 1))"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * chunks", 128]
range = [-2, 2]
[inputs.w]
shape = ["packed_rows", 128]
[outputs.out0]
shape = ["rows * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
chunks = "CR10"
end = "CR11"
width = "CR12"
full_end = "CR13"
rows = "CR14"
pair_end = "LR14"

[cases.default]
m = 2
k = 129
n = 135
in0_d1 = 2
in0_d2 = 129
out0_d1 = 2
out0_d2 = 135
