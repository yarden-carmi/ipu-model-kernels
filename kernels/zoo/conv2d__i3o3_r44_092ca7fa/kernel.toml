[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.groups]
type = "int"
choices = [1]
default = 1
[params.cin]
type = "int"
min = 1
max = 1024
default = 64
[params.cout]
type = "int"
min = 1
max = 1024
default = 64
[params.h]
type = "int"
min = 1
max = 512
default = 64
[params.w]
type = "int"
min = 1
max = 128
default = 64
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1024
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 512
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 1024
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 512
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 64

[derived]
candidate = "128 // out0_d3"
pack = "1 + (candidate - 1) * (1 - min(1, out0_d2 % candidate))"
tiles = "out0_d0 * out0_d2 // pack"
panel = "ceil(9 * cin / 128)"
weight_rows = "cout * (1 + panel)"
input_rows = "in0_d0 * in0_d2 * cin"
batch_span = "in0_d2 * cin"
full = "ds(128)"
packed = "ds(pack * out0_d3)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[inputs.masks]
shape = ["1 + 3 * pack", 128]
range = [0, 1]
[scratch.patches]
shape = ["tiles * 9 * cin", 128]
[scratch.parity]
shape = ["(stride - 1) * 2 * input_rows + 1", 128]
[outputs.out0]
shape = ["cout * tiles", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
masks = "CR5"
patches = "CR6"
parity = "CR7"
qf_in0 = "CR8"
qf_out0 = "CR9"
full = "CR10"
packed = "CR11"
cin = "CR12"
in0_d2 = "CR13"
weight_rows = "CR14"
batch_span = "CR15"
in0_d0 = "LR15"
input_rows = "LR14"

[cases.default]
