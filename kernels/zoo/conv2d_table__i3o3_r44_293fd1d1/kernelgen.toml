chain = ["conv2d"]
chain_in = ["in0"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [0, 2, 1]

[view.in0]
kind = "whole"

[layout.out0]
lanes = 3
rows = [0, 2, 1]
pack = "1 + (stride - 1) * (1 - cout % 2) * (1 // (1 + cin - groups)) * (1 // (1 + cout - groups)) * (1 // (1 + max(w - 128, 128 - w)))"

[lut.out0]
range_mode = 2
range_exp = 40
