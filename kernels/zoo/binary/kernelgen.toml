notes = """One memory row of 128 per pass. The operand is selected by `broadcast`: in1's row (none),
the constant `const` or its reciprocal (scalar, via a MULT constant CR), a row vector of `inner`
elements repeated with a nested loop (row), or one element per `inner`-element row (col, element
r of the column vector broadcast with a ones row in R_CYCLIC; for inner=320 the straddling row is
fixed with a zeros row in slot 1, the second scalar in slot 2 and a window read at 192). The last
partial row of a numel not divisible by 128 is stored with the ds half `dst`."""
