[kernel]
op = "binary"
formats = ["e1", "e2", "e3", "e4", "e5", "e6"]

[params.numel]
type = "int"
min = 128
max = 33554432

[params.inner]
type = "int"
choices = [0, 320, 640, 1152, 1280]
default = 0

[params.op]
type = "str"
choices = ["add", "mul"]
default = "add"

[params.broadcast]
type = "str"
choices = ["none", "scalar", "row", "col"]
default = "none"

[params.const]
type = "float"
default = 1.0

[params.reciprocal]
type = "bool"
default = false

[inputs.in0]
shape = ["ceil(numel / 128)", 128]
range = [-4, 4]

[inputs.in1]
shape = ["ceil(numel / 128)", 128]
range = [-4, 4]

[outputs.out0]
shape = ["ceil(numel / 128)", 128]

[scratch.ones]
shape = [1, 128]
fill = 1.0

[scratch.zeros]
shape = [1, 128]
fill = 0.0

[scratch.sb]
shape = ["numel // 640 + 1", 128]
fill = 0.0

[derived]
rf = "numel // 128"
rfm1 = "(numel // 128) - 1"
dst = "ds(numel % 128)"
qf = "case_qf"
g = "inner // 128"
ds = "ds(128)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf = "CR5"
rf = "CR6"
rfm1 = "CR7"
dst = "CR8"
ones = "CR9"
zeros = "CR10"
sb = "CR11"
const = "CR12"
g = "CR14"
ds = "CR15"

[golden]
tolerance = { e1 = "EXACT", e2 = "EXACT", e3 = "EXACT", e4 = "EXACT", e5 = "EXACT", e6 = "EXACT" }

[cases.default]
numel = 512

[cases.none_mul]
numel = 1024
op = "mul"

[cases.scalar_mul]
numel = 160
broadcast = "scalar"
op = "mul"

[cases.scalar_mul_tail16]
numel = 272
broadcast = "scalar"
op = "mul"

[cases.scalar_add]
numel = 384
broadcast = "scalar"
op = "add"

[cases.scalar_recip]
numel = 128
broadcast = "scalar"
op = "mul"
reciprocal = true

[cases.row_mul]
broadcast = "row"
inner = 1152
numel = 2304
op = "mul"

[cases.row_add]
broadcast = "row"
inner = 1152
numel = 3456
op = "add"

[cases.col640]
broadcast = "col"
inner = 640
numel = 1920
op = "add"

[cases.col1280]
broadcast = "col"
inner = 1280
numel = 2560
op = "add"

[cases.col320]
broadcast = "col"
inner = 320
numel = 1920
op = "add"
