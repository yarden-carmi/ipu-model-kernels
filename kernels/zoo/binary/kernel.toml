[kernel]
op = "binary_mul_scalar"
formats = ["e3"]

[params.numel]
type = "int"
min = 1
max = 4194304
multiple_of = 1

[params.const]
type = "float"
default = 1.0

[params.op]
type = "str"
choices = ["mul"]
default = "mul"

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"

[params.inner]
type = "int"
choices = [0]
default = 0

[inputs.a]
shape = ["numel"]
range = [-4, 4]

[outputs.y]
shape = ["numel"]

[derived]
rows = "ceil(numel / 128)"
rows_m1 = "ceil(numel / 128) - 1"
rows_m2 = "ceil(numel / 128) - 2"
last = "numel - 128 * (ceil(numel / 128) - 1)"
qf = "case_qf"
ds = "ds(128)"
ds_last = "ds(last)"

[abi]
a = "CR2"
y = "CR3"
const = "CR4"
qf = "CR5"
ds = "CR15"
ds_last = "CR14"
rows = "CR7"
rows_m1 = "CR6"
rows_m2 = "CR8"

[golden]
tolerance = { e3 = "EXACT" }

[cases.default]
numel = 160
const = 1.0

[cases.sizes]
numel = [128, 129, 160, 256, 384, 1024]
