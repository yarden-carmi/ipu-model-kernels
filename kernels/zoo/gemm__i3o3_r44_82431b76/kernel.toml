[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 64
[params.n]
type = "int"
min = 1
max = 65536
default = 32
[params.m]
type = "int"
min = 1
max = 65536
default = 16384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 32
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 128

[derived]
ip = "min(in0_d2, 128 // in0_d3)"
op = "min(out0_d2, 128 // out0_d3)"
pack = "1 + (ip - 1) * (1 - min(1, in0_d2 % ip))"
out_pack = "1 + (op - 1) * (1 - min(1, out0_d2 % op))"
pitch = "ceil(in0_d2 / pack)"
batch_pitch = "in0_d1 * pitch"
lanes = "ds(pack * in0_d3)"
full = "ds(128)"
second = "128"
small = "1 - min(1, max(in0_d2 * in0_d3 - 64, 64 - in0_d2 * in0_d3) + k % 2 + in0_d0 - 1 + max(0, k - 1024))"
chunks = "ceil(k / 128)"
repeat = "(k - 1) // 32"
coeff_rows = "small * 2 * chunks + (1 - small) * 2 * ceil(k / 32)"
panel_start = "64 * chunks"
pair_src = "1073741824"
pair_dst = "16777216"
active = "ds((k - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0 * batch_pitch", 128]
[inputs.coeff]
shape = ["n * (coeff_rows + 2)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / out_pack)", 128]
[scratch.panel]
shape = ["small * (panel_start + k // 2) + 1", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
qf_coeff = "CR7"
n = "CR8"
lanes = "CR9"
full = "CR10"
second = "CR11"
in0_d0 = "CR12"
panel = "CR13"
repeat = "CR14"
active = "CR15"
batch_pitch = "LR15"
pitch = "LR4"
pair_src = "LR6"
pair_dst = "LR14"
panel_start = "LR5"

[cases.default]
