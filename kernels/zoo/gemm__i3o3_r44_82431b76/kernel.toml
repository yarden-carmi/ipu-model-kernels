[kernel]
op = "gemm"
formats = ["e1", "e2"]
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 64
[params.n]
type = "int"
min = 1
max = 65536
default = 32
[params.m]
type = "int"
min = 1
max = 65536
default = 16384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 32
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 128
[derived]
ic = "min(in0_d2, 128 // in0_d3)"
oc = "min(out0_d2, 128 // out0_d3)"
pack = "1 + (ic - 1) * (1 - min(1, in0_d2 % ic))"
out_pack = "1 + (oc - 1) * (1 - min(1, out0_d2 % oc))"
pitch = "ceil(in0_d2 / pack)"
batch_pitch = "in0_d1 * pitch"
active = "ds(pack * in0_d3)"
full = "ds(128)"
blocks = "(k - 1) // (32 + 64 * min(1, max(0, k - 255)) * min(1, max(0, in0_d2 * in0_d3 - 1024)))"
tiny = "1 - min(1, max(in0_d2 * in0_d3 - 64, 64 - in0_d2 * in0_d3) + k % 2 + max(0, k - 1024))"
chunks = "ceil(k / 128)"
panel_start = "64 * chunks"
second = "128 + tiny * (1073741824 - 128)"
pair_dest = "16777216"
tail = "ds(tiny * ((k - 1) % 128 + 1) + (1 - tiny) * (((in0_d2 - 1) % pack + 1) * in0_d3))"
[inputs.in0]
shape = ["in0_d0 * batch_pitch", 128]
[inputs.coeff]
shape = ["n * (2 + (1 - tiny) * 2 * (blocks + 1) + tiny * (chunks + 1))", 128]
when = "bias"
[inputs.coeff_unbiased]
shape = ["n * ((1 - tiny) * 2 * (blocks + 1) + tiny * chunks)", 128]
when = "not bias"
[scratch.panel]
shape = ["1 + tiny * (panel_start + k // 2)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / out_pack)", 128]
[abi]
in0 = "CR2"
coeff = "CR3"
coeff_unbiased = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
panel = "CR7"
n = "CR8"
in0_d0 = "CR9"
second = "CR10"
blocks = "CR11"
active = "CR12"
full = "CR13"
pair_dest = "CR14"
tail = "CR15"
pitch = "LR4"
panel_start = "LR5"
batch_pitch = "LR15"
[cases.default]
