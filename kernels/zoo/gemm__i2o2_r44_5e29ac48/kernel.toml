[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 64
[params.m]
type = "int"
min = 1
max = 65536
default = 4096
[params.n]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 64

[derived]
spatial = "in0_d3 * ceil(in0_d2 / 128)"
batchstride = "in0_d1 * spatial"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
blocks = "ceil(out0_d2 / 128)"
last = "k - 2"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * spatial", 128]
[inputs.w]
shape = ["n * (1 + k * min(1, max(0, k - 127)))", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d3 * blocks", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
spatial = "CR9"
batchstride = "CR10"
k = "CR11"
n = "CR12"
blocks = "CR13"
out0_d0 = "CR14"
last = "CR15"

[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}
[cases.default]
