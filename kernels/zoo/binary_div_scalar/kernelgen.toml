unsupported = [
  "{\"broadcast\": \"none\", \"inner\": 0, \"numel\": 4096, \"op\": \"div\"}: elementwise division would need a per-lane exact reciprocal: the AaQ stage's `reciprocal` is a hardware approximation whose result lands in an 8-bit block row before the multiply that uses it, so a quotient would carry a per-lane error the kernel's `exact` kind does not allow. The scalar case is different: the one correction e = (1 - b*r)*r is computed once per call with exact products and an exact subtract, so the residual is ~2^-13 of 1/b.",
  "{\"broadcast\": \"row\", \"inner\": 240, \"numel\": 4096, \"op\": \"div\"}: a per-row reciprocal has the same block-row quantization problem as the elementwise one, and a per-row correction would cost a row round trip through XMEM per row of a.",
  "{\"broadcast\": \"none\", \"inner\": 0, \"numel\": 4096, \"op\": \"add\"}: this kernel renders div by a scalar only; the other ops belong to binary_add_none.",
  "{\"broadcast\": \"scalar\", \"inner\": 0, \"numel\": 4096, \"op\": \"mul\"}: same -- mul by a scalar belongs to binary_add_none's family, not this one.",
  "{\"broadcast\": \"scalar\", \"inner\": 0, \"numel\": 0, \"op\": \"div\"}: an empty call: numel starts at 1.",
  "{\"broadcast\": \"scalar\", \"inner\": 0, \"numel\": 262272, \"op\": \"div\"}: above the declared numel maximum (262144 = 2048 rows); a, y and the five scratch rows take 2*2049+6 = 4104 of the 16384 addressable NX8 rows, so the maximum is a size choice, not a limit of the program.",
]
notes = """One parameterised program for every numel: y = a / b with b the one scalar of
its row (lane 0), broadcast over all rows. a and y are the chip's activation layout
with one entity (row i holds elements 128i..128i+127, lanes past numel zero), so the
kernel reads the rows the previous kernel wrote and leaves rows the next one reads;
b is one row whose lane 0 the host prepared offline. The shape reaches the program
only through CRs and the row loop is dynamic, so a whole call is one launch: 65536
elements is 512 iterations of the same two words. Dataflow: the only way into R_ACC
is a multiply result and the only route from R_ACC back into a multiply is a store
and a load, which in NX8 quantizes to the row's grid -- so 1/b cannot be carried at
full precision through a register, and the quotient is split once per call:
y = a*(r + e) with r the ACTIVATE.QUANTIZE reciprocal of the broadcast scalar (all
128 lanes of one row the same value, so its own quantization costs at most one step
of r) and e = (1 - b*r)*r the correction. b*r is an exact product, 1 - b*r an exact
FP32 subtract (b*r is within [0.5, 2] of 1, so Sterbenz makes it exact), the product
with the resident r is exact, and both factors are stored with the one-lane DS half
so they keep ~2^-7 of their own magnitude: the residual 1 - b*(r+e) is ~2^-13 of
1/b. The exact ones row the subtract is seeded from is built by ACTIVATE.QUANTIZE
exp2 of 0 (exp2(0) = 1, one distinct value, stored exactly) -- no packed constant
row, so nothing in the folder depends on the element format. Each row is then two
exact products a*r + a*e (MULT.RC.VE against R0[0] and R1[0], the cyclic a row
loaded one word ahead, rule 2) and one accumulator add, and the output row's own
quantization is the only error the golden sees -- measured max 1 step, tolerance
NX8_STEP/1. The last row is emitted straight-line, so no word loads a row past a's
region. Every LR the program reads is set by it, R_ACC is initialised by the
ACC.ADD.FIRST of every row and R_MASK is loaded from its own scratch row, so it
runs after another kernel as well as from reset (the verifier's chain run). Cost:
16 prologue words once per call, two words per row; 4096 elements in 34 cycles,
65536 in 1050. Domain: numel 1..262144, op div, broadcast scalar with inner 0
(elementwise/row div are in `unsupported`, each for a stated reason); b's generator
range [0.25, 4] keeps the reciprocal finite -- the program itself is
scale-invariant, only b = 0 (an infinity, not a value) is out. There is no FP32
variant: dynamic is the chip's NX8 type and the program is format-transparent."""
