[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
act_out0 = { type = "str", choices = ["relu"], default = "relu" }
numel = { type = "int", min = 1, default = 200704 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 64 }
in0_d2 = { type = "int", min = 1, default = 56 }
in0_d3 = { type = "int", min = 1, max = 128, default = 56 }
in1_d0 = { type = "int", min = 1, default = 1 }
in1_d1 = { type = "int", min = 1, default = 64 }
in1_d2 = { type = "int", min = 1, default = 56 }
in1_d3 = { type = "int", min = 1, max = 128, default = 56 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 64 }
out0_d2 = { type = "int", min = 1, default = 56 }
out0_d3 = { type = "int", min = 1, max = 128, default = 56 }

[derived]
lanes = "128"
chunks = "ceil(out0_d1 / 128)"
planes = "out0_d0 * out0_d2"
plane_stride = "out0_d3 * chunks"
last_slot_prev = "out0_d3 - 2"
ds_pair = "ds(1) + 65536 * ds(out0_d3)"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "128 * ceil(in0_d1 / 128)"]
range = [-2, 2]

[inputs.in1]
shape = ["in1_d0", "in1_d2", "in1_d3", "128 * ceil(in1_d1 / 128)"]
range = [-2, 2]

[outputs.out0]
shape = ["planes", "out0_d1", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
chunks = "CR8"
plane_stride = "CR9"
last_slot_prev = "CR10"
out0_d1 = "CR11"
ds_pair = "CR12"
planes = "CR13"
lanes = "CR14"

[cases.default]
