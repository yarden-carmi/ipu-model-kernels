[kernel]
op = "gemm_binary_add"
formats = ["e1", "e2", "e3"]

[params.s0_bias]
type = "bool"
default = true
[params.s0_m]
type = "int"
min = 1
max = 65536
default = 256
[params.s0_k]
type = "int"
min = 1
max = 256
default = 256
[params.s0_n]
type = "int"
min = 1
max = 16384
default = 64
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 1
max = 1073741824
default = 98304
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 64
[params.in1_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 65536
default = 64
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 64
[params.in1_d3]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 64

[derived]
tiles = "ceil(out0_d2 * out0_d3 / 128)"
stride = "in0_d0 * ceil(in0_d2 * in0_d3 / 128)"
groups = "(s0_k - 1) // (16 - 14 * min(1, s0_k % 64))"
sum_rows = "(2 * (s0_k // 16) * (1 - min(1, s0_k % 64)) + 4 * min(1, s0_k % 64)) * stride"
even0 = "(s0_k + 3) // 4"
even2 = "(s0_k + 1) // 4"
full = "ds(128)"
tail = "ds((out0_d2 * out0_d3 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d1 * stride", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 * in1_d3 / 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["s0_n * (2 + (s0_k // 16) * (1 - min(1, s0_k % 64)) + (2 + (s0_k + 1) // 2) * min(1, s0_k % 64))", 128]
[scratch.sums]
shape = ["sum_rows", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * tiles", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
full = "CR9"
tail = "CR10"
tiles = "CR11"
stride = "CR12"
groups = "CR13"
sums = "CR14"
out0_d0 = "CR15"
s0_n = "LR8"
even0 = "LR12"
even2 = "LR13"

[cases.default]
