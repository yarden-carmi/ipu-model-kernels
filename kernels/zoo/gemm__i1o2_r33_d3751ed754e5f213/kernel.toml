[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 16384
default = 128
[params.m]
type = "int"
min = 1
max = 16384
default = 256
[params.n]
type = "int"
min = 1
max = 16384
default = 768
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 768

[derived]
pitch = "ceil(in0_d1 / 128)"
tiles = "ceil(out0_d2 / 128)"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
batch_stride = "in0_d2 * pitch"
dot_path = "1 - min(1, max(k - 128, 128 - k))"
packed_path = "1 - min(1, max(512 - k, k - 1024, k % 128, 0))"
transpose_path = "dot_path + packed_path"
batch_arg = "transpose_path * base(transposed) + (1 - transpose_path) * batch_stride"
span = "packed_path * batch_stride + (1 - packed_path) * 128"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * pitch", 128]
range = [-2, 2]
[inputs.w]
shape = ["14 * transpose_path + packed_path + tiles * (k + 1) * (2 - dot_path)", 128]
range = [-1, 1]
[scratch.transposed]
shape = ["max(1, 256 * transpose_path + k * packed_path)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
pitch = "CR10"
in0_d0 = "CR11"
in0_d1 = "CR12"
k = "CR13"
span = "CR14"
batch_arg = "CR15"

[cases.default]
