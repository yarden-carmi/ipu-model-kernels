[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["hardswish"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 64
[params.cout]
type = "int"
min = 1
max = 640
default = 64
[params.groups]
type = "int"
min = 2
max = 640
default = 64
[params.h]
type = "int"
min = 1
max = 256
default = 14
[params.w]
type = "int"
min = 5
max = 64
default = 14
[params.kh]
type = "int"
choices = [5]
default = 5
[params.kw]
type = "int"
choices = [5]
default = 5
[params.padding]
type = "int"
choices = [2]
default = 2
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 64
default = 14
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 258
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 64
default = 14

[derived]
ix = "ceil(in0_d3 / 128)"
dw = "min(1, groups - 1)"
ip = "1"
op = "1"
ni = "ceil(cin / ip)"
no = "ceil(cout / op)"
wide = "min(1, op - 1)"
row = "dw * stride + (1 - dw) * (3 - 2 * wide)"
plane = "(in0_d2 + 4) * row"
channel_end = "cin * plane - row"
weight_rows = "(52 + 26 * (stride - 1)) * no"
ds128 = "ds(128)"
ds_width = "ds(min(w, 128))"
ds_out = "ds(min(128, op * out0_d3))"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "ni", "ix", 128]
range = [-2, 2]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.pad]
shape = ["(dw * no + (1 - dw) * (cin + 1)) * plane + 2", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "no", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
pad = "CR6"
no = "CR7"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
ds_width = "CR12"
ds_out = "CR13"
plane = "CR14"
channel_end = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
