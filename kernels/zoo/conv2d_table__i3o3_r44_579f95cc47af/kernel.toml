[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["hardswish"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 144
[params.cout]
type = "int"
min = 1
max = 640
default = 144
[params.groups]
type = "int"
min = 1
max = 640
default = 144
[params.h]
type = "int"
min = 1
max = 256
default = 14
[params.w]
type = "int"
min = 1
max = 128
default = 14
[params.kh]
type = "int"
choices = [1, 3, 5]
default = 5
[params.kw]
type = "int"
choices = [1, 3, 5]
default = 5
[params.padding]
type = "int"
choices = [0, 1, 2]
default = 2
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 144
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 14
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 144
[params.out0_d2]
type = "int"
min = 1
max = 260
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 14

[derived]
gcin = "cin // groups"
gcout = "cout // groups"
ds_out = "ds(out0_d3)"
ds128 = "ds(128)"
ds_in = "ds(in0_d3)"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d1", 128]
range = [-2, 2]
[inputs.weights]
shape = ["cout * (3 + 3 * gcin)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.zero]
shape = ["1 + in0_d1 * in0_d2", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d1", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
zero = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
ds_out = "CR11"
in0_d1 = "CR12"
in0_d2 = "CR13"
out0_d2 = "CR14"
ds_in = "CR15"
groups = "LR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
