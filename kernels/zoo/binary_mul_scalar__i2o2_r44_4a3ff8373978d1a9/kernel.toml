[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["scalar"], default = "scalar" }
const = { type = "int", min = 1, max = 1, default = 1 }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["mul"], default = "mul" }
numel = { type = "int", min = 1, max = 2147483647, default = 32768 }
in0_d0 = { type = "int", min = 1, max = 2147483647, default = 1 }
in0_d1 = { type = "int", min = 1, max = 2147483647, default = 8 }
in0_d2 = { type = "int", min = 1, max = 2147483647, default = 64 }
in0_d3 = { type = "int", min = 1, max = 2147483647, default = 64 }
out0_d0 = { type = "int", min = 1, max = 2147483647, default = 1 }
out0_d1 = { type = "int", min = 1, max = 2147483647, default = 8 }
out0_d2 = { type = "int", min = 1, max = 2147483647, default = 64 }
out0_d3 = { type = "int", min = 1, max = 2147483647, default = 64 }

[inputs.in0]
shape = ["groups * chunks", 128]
range = [-2.0, 2.0]

[outputs.out0]
shape = ["out0_d0 * out0_d3 * out0_d1 * ceil(out0_d2 / 128)", 128]

[scratch.scalar]
shape = [1, 128]

[derived]
groups = "in0_d0 * in0_d3 * in0_d1"
chunks = "ceil(in0_d2 / 128)"
full_chunks = "chunks - 1"
rows = "groups * chunks"
remainder = "out0_d2 % 128"
ds_pair = "ds((out0_d2 - 1) % 128 + 1) + ds(128) * 65536"
fp_lo = "0x43010000"
fp_hi = "0x43012d41"
nx_scale = "0x00017c35"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
groups = "CR6"
full_chunks = "CR7"
ds_pair = "CR8"
scalar = "CR9"
fp_hi = "CR10"
fp_lo = "CR11"
nx_scale = "CR12"
rows = "CR13"
remainder = "CR14"

[cases.default]
