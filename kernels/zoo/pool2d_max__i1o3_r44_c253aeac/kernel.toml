[kernel]
op = "pool2d"
formats = ["e1"]

[params.channels]
type = "int"
min = 1
max = 128
default = 64

[params.h]
type = "int"
min = 1
max = 4096
default = 112

[params.w]
type = "int"
min = 1
max = 4096
default = 112

[params.k]
type = "int"
min = 1
max = 4096
default = 3

[params.kind]
type = "str"
choices = ["max"]
default = "max"

[params.padding]
type = "int"
min = 0
max = 2048
default = 1

[params.stride]
type = "int"
min = 1
max = 4096
default = 2

[params.in0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 128
default = 64

[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 112

[params.in0_d3]
type = "int"
min = 1
max = 4096
default = 112

[params.out0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64

[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 56

[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d1", 128]

[scratch.strip]
shape = ["out0_d3", 128]

[derived]
vertical_step = "stride * in0_d3"
batch_jump = "in0_d2 * in0_d3 - (out0_d2 - 1) * vertical_step"
initial_row = "-padding * in0_d3"
full = "ds(128) + 65536 * out0_d2"
valid = "ds(out0_d3) + 65536 * ds(1)"

[abi]
in0 = "CR2"
out0 = "CR3"
strip = "CR4"
in0_d3 = "CR5"
in0_d2 = "CR6"
out0_d3 = "CR7"
stride = "CR8"
vertical_step = "CR9"
k = "CR10"
padding = "CR11"
valid = "CR12"
full = "CR13"
qf_in0 = "CR14"
qf_out0 = "CR15"
out0_d0 = "LR1"
out0_d1 = "LR7"
initial_row = "LR4"
batch_jump = "LR9"

[cases.default]
