[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 786432
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 256

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d3", "ceil(in0_d2 / 128) * 128"]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["groups", "chunks * 128"]

[derived]
groups = "out0_d0 * out0_d1 * out0_d3"
chunks = "ceil(out0_d2 / 128)"
ds_pair = "ds((out0_d2 - 1) % 128 + 1) + 65536 * ds(128)"
# The FP32 difference is 1/8; both words decode to unsigned NX8 zero.
fp_base = "0x43010080"
fp_scale = "0x43012080"
# Unsigned e1 with scale zero and 16/128; negligible as FP32.
nx_scale = "0x00017f90"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
groups = "CR6"
chunks = "CR7"
ds_pair = "CR8"
fp_base = "CR9"
fp_scale = "CR10"
nx_scale = "CR11"

[cases.default]
