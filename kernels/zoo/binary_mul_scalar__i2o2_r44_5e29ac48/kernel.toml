[kernel]
op = "binary_mul_scalar"
formats = ["e2", "e4"]
[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 460992
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 196
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 196
[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d3", "ceil(in0_d2 / 128) * 128"]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["in0_d0 * in0_d1 * in0_d3", "ceil(in0_d2 / 128) * 128"]
[inputs.operand]
shape = [1]
range = [0.125, 0.125]
[derived]
chunks = "ceil(in0_d2 / 128)"
groups = "in0_d0 * in0_d1 * in0_d3"
full = "ds(128)"
tail = "ds((in0_d2 - 1) % 128 + 1)"
[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
groups = "CR6"
chunks = "CR7"
full = "CR8"
tail = "CR9"
operand = "CR10"
[golden]
tolerance = { e2 = "EXACT", e4 = "EXACT" }
[cases.default]
