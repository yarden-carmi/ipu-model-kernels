[kernel]
op = "binary_mul_scalar"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 786432
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 256
[inputs.in0]
shape = ["groups", "chunks * 128"]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d3", "ceil(out0_d2 / 128) * 128"]

[derived]
groups = "in0_d0 * in0_d1 * in0_d3"
chunks = "ceil(in0_d2 / 128)"
ds_pair = "ds((in0_d2 - 1) % 128 + 1) + ds(128) * 65536"
# 2896 / 16384 approximates 1/sqrt(32). The FP32 differences
# contribute 45/256 + 16/16384 and decode as zero in NX8.
fp_hi_base = "0x43010080"
fp_hi = "fp_hi_base + 45 * 256"
fp_lo_base = "0x40010080"
fp_lo = "fp_lo_base + 16 * 256"
# NX8 contributes 22/128 + 80/16384; these words are subnormal in FP32.
nx_hi = "0x00017f96"
nx_lo = "0x000178d0"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
groups = "CR6"
chunks = "CR7"
ds_pair = "CR8"
fp_hi_base = "CR9"
fp_hi = "CR10"
fp_lo_base = "CR11"
fp_lo = "CR12"
nx_hi = "CR13"
nx_lo = "CR14"

[cases.default]
