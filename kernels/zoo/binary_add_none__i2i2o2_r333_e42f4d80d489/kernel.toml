[kernel]
op = "binary_add_none"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 196608 }
in0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in0_d1 = { type = "int", min = 1, max = 16777216, default = 256 }
in0_d2 = { type = "int", min = 1, max = 16777216, default = 768 }
in1_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in1_d1 = { type = "int", min = 1, max = 16777216, default = 256 }
in1_d2 = { type = "int", min = 1, max = 16777216, default = 768 }
out0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
out0_d1 = { type = "int", min = 1, max = 16777216, default = 256 }
out0_d2 = { type = "int", min = 1, max = 16777216, default = 768 }

[derived]
chunks = "ceil(out0_d2 / 128)"
rows = "out0_d0 * out0_d1 * chunks"
last_chunk = "chunks - 1"
tail = "ds(out0_d2 - last_chunk * 128)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / 128)", 128]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 / 128)", 128]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
rows = "CR8"
last_chunk = "CR9"
tail = "CR10"

[cases.default]
