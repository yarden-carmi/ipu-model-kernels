[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65535
default = 128
[params.m]
type = "int"
min = 1
max = 65535
default = 256
[params.n]
type = "int"
min = 1
max = 65535
default = 512
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 128
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 512
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 16

[derived]
pack_limit = "min(in0_d2, 128 // in0_d3)"
pack = "1 + (pack_limit - 1) * (1 - min(1, in0_d2 % pack_limit))"
pixels = "pack * in0_d3"
plane = "in0_d2 // pack"
groups = "in0_d0 * plane"
batch_skip = "(k - 1) * plane"
blocks = "ceil(n / 128)"
full_ds = "ds(128)"
tail_ds = "ds(n - 128 * (blocks - 1))"
src_lo = "50462976"
src_hi = "117835012"
packed = "(1 - min(1, k % 16)) * (1 - min(1, pixels % 8))"
split_taps = "12 + 4 * (1 - min(1, max(0, n - 64))) - 4 * (1 - min(1, max(0, 160 - k))) * min(1, max(0, n - 64)) - (1 - min(1, max(0, k - 32) + max(0, 32 - k))) * min(1, max(0, n - 64)) * (1 - min(1, max(0, n - 128)))"
short_bias = "(1 - min(1, max(0, k - 32) + max(0, 32 - k))) * min(1, max(0, n - 64)) * (1 - min(1, max(0, n - 128))) * packed"
narrow_pair = "min(1, max(0, 65 - n)) * min(1, max(0, 65 - k)) * (1 - k % 2)"

[inputs.in0]
shape = ["groups * k", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["blocks * (2 * (k + 1) - narrow_pair * k - packed * (k // 16) * (16 - split_taps) - short_bias)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["m * blocks", 128]

[scratch.panel]
shape = ["ceil(k / 16)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
k = "CR8"
plane = "CR9"
pixels = "CR10"
panel = "CR11"
full_ds = "CR12"
tail_ds = "CR13"
blocks = "CR14"
batch_skip = "CR15"
groups = "LR10"
src_lo = "LR14"
src_hi = "LR15"

[cases.default]
