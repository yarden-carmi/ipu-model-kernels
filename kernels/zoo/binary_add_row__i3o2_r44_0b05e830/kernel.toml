[kernel]
op = "binary_add_row"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["row"]
default = "row"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 1
max = 2147483647
default = 4096
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 32768
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 8
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 2147483647
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 8
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 64

[derived]
ic = "ceil(in0_d3 / 128)"
plane_rows = "in0_d2 * ic"
oc = "ceil(out0_d2 / 128)"
tail = "(out0_d2 - 1) % 128 + 1"
ds_pair = "ds(128) * 65536 + ds(tail)"
rows = "out0_d0 * out0_d3 * out0_d1 * oc"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * plane_rows", 128]
range = [-2, 2]
[inputs.operand]
shape = ["rows", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
operand = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
qf_operand = "CR7"
ic = "CR8"
plane_rows = "CR9"
oc = "CR10"
tail = "CR11"
ds_pair = "CR12"
out0_d1 = "CR13"
out0_d3 = "CR14"
rows = "CR15"

[cases.default]
