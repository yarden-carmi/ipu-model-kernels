[kernel]
op = "quarter_grid_average"
formats = ["e1"]

[params.h]
type = "int"
default = 66
min = 4
max = 4096
[params.w]
type = "int"
default = 66
min = 4
max = 258
[params.in0_d0]
type = "int"
default = 1
min = 1
max = 64
[params.in0_d1]
type = "int"
default = 64
min = 1
max = 128
[params.in0_d2]
type = "int"
default = 66
min = 4
max = 4096
[params.in0_d3]
type = "int"
default = 66
min = 4
max = 258
[params.out0_d0]
type = "int"
default = 1
min = 1
max = 64
[params.out0_d1]
type = "int"
default = 64
min = 1
max = 128
[params.out0_d2]
type = "int"
default = 32
min = 1
max = 2048
[params.out0_d3]
type = "int"
default = 32
min = 1
max = 128

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", 128]
range = [-1.0, 1.0]
[outputs.out0]
shape = ["out0_d1", "out0_d0", "(out0_d2 * out0_d3 + 127) // 128 + 1", 128]
[scratch.pooled]
shape = ["spatial", 128]

[derived]
active = "128"
spatial = "out0_d2 * out0_d3"
batch_skip = "h * w - 2 * w * out0_d2"
batch_end = "h * w * out0_d0"
input_ds = "ds(in0_d1)"
output_ds = "ds(128)"
zero_ds = "ds(0)"
last_ds = "ds((spatial - 1) % 128 + 1)"
weight = "19 * 65536 + 123 * 256"
weight_fp32 = "123 * 8388608"

[abi]
in0 = "CR2"
out0 = "CR3"
pooled = "CR4"
w = "CR5"
out0_d3 = "CR6"
out0_d2 = "CR7"
out0_d1 = "CR8"
weight_fp32 = "CR9"
last_ds = "CR10"
input_ds = "CR11"
zero_ds = "CR12"
qf_in0 = "CR13"
qf_out0 = "CR14"
weight = "CR15"
batch_end = "LR12"
spatial = "LR13"
active = "LR14"
batch_skip = "LR15"

[cases.default]
