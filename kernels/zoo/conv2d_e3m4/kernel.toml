[kernel]
op = "conv2d"
formats = ["e3"]
[params.bias]
type = "bool"
default = false
[params.cin]
type = "int"
min = 1
max = 1024
default = 4
[params.cout]
type = "int"
min = 1
max = 1024
default = 4
[params.groups]
type = "int"
min = 1
max = 1024
default = 4
[params.h]
type = "int"
min = 1
max = 56
default = 5
[params.w]
type = "int"
min = 1
max = 56
default = 5
[params.kh]
type = "int"
min = 1
max = 5
default = 3
[params.kw]
type = "int"
min = 1
max = 5
default = 3
[params.padding]
type = "int"
min = 0
max = 2
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 2
[derived]
qf = "case_qf"
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
dsout = "ds(wo)"
wrows = "cout * kh * kw"
[inputs.in0]
shape = ["h", "w", "ceil(cin / 128) * 128"]
range = [-2.0, 2.0]
[inputs.weights]
shape = ["cout * kh * kw", 128]
[outputs.out0]
shape = ["cout", "ho", 128]
[scratch.clean]
shape = ["cout * kh * kw", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
qf = "CR5"
dsout = "CR6"
h = "CR7"
w = "CR8"
ho = "CR9"
wo = "CR10"
cout = "CR11"
clean = "CR12"
wrows = "CR13"
[golden]
tolerance = { e3 = "NX8_STEP" }
[cases.default]
cin = 4
cout = 4
groups = 4
[cases.five]
cin = 3
cout = 3
groups = 3
kh = 5
kw = 5
padding = 2
stride = 1
[cases.blocks]
cin = 130
cout = 130
groups = 130
h = 3
w = 3
