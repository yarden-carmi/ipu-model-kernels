[kernel]
op = "binary_mul_scalar"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 128
max = 128
default = 128
[params.op]
type = "str"
choices = ["mul"]
default = "mul"

[inputs.in0]
shape = [2304, 128]
range = [-2.0, 2.0]
[inputs.operand]
shape = [1]
range = [-2.0, 2.0]
[outputs.out0]
shape = [1, 128]

[derived]
qf = "case_qf"
[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf = "CR5"
[golden]
tolerance = { e2 = "EXACT" }
[cases.default]
numel = 128
