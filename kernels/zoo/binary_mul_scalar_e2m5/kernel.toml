[kernel]
op = "binary_mul_scalar"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"

[params.const]
type = "int"
min = 1
max = 1
default = 1

[params.inner]
type = "int"
min = 0
max = 0
default = 0

[params.numel]
type = "int"
min = 4096
max = 1310720
multiple_of = 4096
default = 4096

[params.op]
type = "str"
choices = ["mul"]
default = "mul"

[params.reciprocal]
type = "bool"
default = true

[inputs.in0]
shape = [4096, "K", 128]
range = [-2.0, 2.0]

[inputs.operand]
shape = [1]
range = [-2.0, 2.0]

[outputs.out0]
shape = [4096, "K", 128]

[derived]
qf = "case_qf"
K = "(numel + 524287) // 524288"
dim1 = "numel // 4096"
rows = "4096 * K"
tail = "ds(dim1 - (K - 1) * 128)"
valid = "ds(128)"

[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf = "CR5"
rows = "CR6"
tail = "CR7"
valid = "CR15"

[golden]
tolerance = { e2 = "EXACT" }

[cases.default]
numel = 524288
[cases.small_two]
numel = 532480
[cases.full]
numel = 1310720
[cases.half]
numel = 655360