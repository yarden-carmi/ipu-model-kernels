[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 9408 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, max = 128, default = 48 }
in0_d2 = { type = "int", min = 1, default = 14 }
in0_d3 = { type = "int", min = 1, max = 128, default = 14 }
in1_d0 = { type = "int", min = 1, default = 1 }
in1_d1 = { type = "int", min = 1, max = 128, default = 48 }
in1_d2 = { type = "int", min = 1, default = 14 }
in1_d3 = { type = "int", min = 1, max = 128, default = 14 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, max = 128, default = 48 }
out0_d2 = { type = "int", min = 1, default = 14 }
out0_d3 = { type = "int", min = 1, max = 128, default = 14 }

[derived]
rows = "out0_d0 * out0_d2 * out0_d3"
channel_prev = "out0_d1 - 2"
batch_skip = "(out0_d1 - 1) * out0_d2"
ds_pair = "ds(1) + 65536 * ds(out0_d1)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]

[inputs.in1]
shape = ["in1_d0", "in1_d1", "in1_d2", 128]

[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
out0_d2 = "CR8"
out0_d3 = "CR9"
channel_prev = "CR10"
rows = "CR11"
ds_pair = "CR12"
batch_skip = "CR13"

[cases.default]
