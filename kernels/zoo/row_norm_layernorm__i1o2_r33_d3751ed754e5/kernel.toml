[kernel]
op = "row_norm"
formats = ["e2", "e3"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 128
max = 4096
multiple_of = 128
default = 768
[params.rows]
type = "int"
min = 8
max = 4096
multiple_of = 8
default = 256
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-12
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 8
max = 4096
multiple_of = 8
default = 256
[params.in0_d2]
type = "int"
min = 128
max = 4096
multiple_of = 128
default = 768
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 8
max = 4096
multiple_of = 8
default = 256
[params.out0_d2]
type = "int"
min = 128
max = 4096
multiple_of = 128
default = 768

[derived]
K = "channels // 128"
stride = "(in0_d1 + 127) // 128"
tiles = "in0_d1 // 8"
end = "rows * K"
one = "ds(1)"
slo = "50462976"
shi = "117835012"
dlo = "403703808"
dhi = "942680096"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * stride", 128]
[inputs.coeff]
shape = ["5 + 6 * K", 128]
[scratch.tmp]
shape = ["32 + 10 * K + end", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * (out0_d2 // 128)", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
coeff = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
qf_coeff = "CR8"
one = "CR9"
slo = "CR10"
shi = "CR11"
dlo = "CR12"
dhi = "CR13"
K = "CR14"
stride = "LR6"
tiles = "LR11"
end = "LR12"

[cases.default]
