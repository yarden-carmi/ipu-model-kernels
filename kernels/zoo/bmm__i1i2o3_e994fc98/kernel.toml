[kernel]
op = "bmm"
formats = ["e2", "e4"]
[params.b]
type = "int"
min = 1
max = 256
default = 12
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 4096
default = 196
[params.n]
type = "int"
min = 1
max = 4096
default = 196
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 196
[params.in1_d2]
type = "int"
min = 1
max = 1048576
default = 768
[inputs.in0]
shape = ["b*k*ceil(in0_d1/128)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["n*ceil(in1_d2/128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["b*m*ceil(n/128)", 128]
[scratch.tmp]
shape = ["b*n*ceil(m/128)", 128]
[derived]
dsfull = "ds(128) + 65536*ds((m-1)%128+1)"
arows = "ceil(in1_d2/128)"
nchunks = "ceil(in0_d1/128)"
dstail = "ds((n-1)%128+1)"
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
k = "CR6"
n = "CR7"
nchunks = "CR8"
arows = "CR9"
dsfull = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
tmp = "CR14"
dstail = "CR15"
m = "LR15"
[cases.default]
b = 12
k = 64
m = 196
n = 196
