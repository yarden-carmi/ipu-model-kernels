[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 786432
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 256

[inputs.in0]
shape = ["rows", 128]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2 * ceil(out0_d3 / 128)", 128]

[derived]
groups = "in0_d0 * in0_d1 * in0_d2"
chunks = "ceil(in0_d3 / 128)"
rows = "groups * chunks"
last = "(in0_d3 - 1) % 128 + 1"
full_lanes = "128"
ds_pair = "ds(last) + ds(128) * 65536"
# These coefficients decode as zero in NX8; their FP32 difference is 1/8.
fp_base = "0x43010080"
fp_top = "fp_base + 8192"
# NX8 coefficient for 1/8, also zero in the FP32 execution path.
nx_scale = "0x00017c00"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
groups = "CR6"
chunks = "CR7"
ds_pair = "CR8"
fp_base = "CR9"
fp_top = "CR10"
nx_scale = "CR11"
last = "CR12"
full_lanes = "CR13"
rows = "CR14"

[cases.default]
