[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 30000
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 12
[params.in0_d2]
type = "int"
min = 1
default = 50
[params.in0_d3]
type = "int"
min = 33
default = 50
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 12
[params.out0_d2]
type = "int"
min = 1
default = 50
[params.out0_d3]
type = "int"
min = 33
default = 50

[derived]
groups = "in0_d0 * in0_d1 * in0_d2"
chunks = "ceil(in0_d3 / 128)"
pack = "1 + 64 // out0_d3"
output_rows = "ceil(out0_d0 * out0_d1 * out0_d2 / pack) * ceil(pack * out0_d3 / 128)"
pair_shift = "128 - in0_d3"
ds_single = "ds((out0_d3 - 1) % 128 + 1) + ds(128) * 65536"
ds_pair = "ds(min(128, 2 * out0_d3))"
scale = "0x00017c00"
fp_hi = "0x43012000"
fp_lo = "0x43010000"

[inputs.in0]
shape = ["groups * chunks", 128]
range = [-2, 2]
[outputs.out0]
shape = ["output_rows", 128]
[scratch.scalar]
shape = [1, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
groups = "CR6"
chunks = "CR7"
pack = "CR8"
pair_shift = "CR9"
ds_single = "CR10"
ds_pair = "CR11"
scale = "CR12"
scalar = "CR13"
fp_hi = "CR14"
fp_lo = "CR15"

[cases.default]
