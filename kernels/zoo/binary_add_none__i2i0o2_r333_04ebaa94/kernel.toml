[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 49152
[params.in0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.in0_d1]
type = "int"
min = 4
max = 256
multiple_of = 4
default = 64
[params.in0_d2]
type = "int"
min = 16
max = 256
multiple_of = 16
default = 192
[params.in1_d0]
type = "int"
min = 4
max = 4
default = 4
[params.in1_d1]
type = "int"
min = 4
max = 256
multiple_of = 4
default = 64
[params.in1_d2]
type = "int"
min = 16
max = 256
multiple_of = 16
default = 192
[params.out0_d0]
