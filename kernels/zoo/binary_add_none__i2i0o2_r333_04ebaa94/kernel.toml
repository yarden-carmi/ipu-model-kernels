[derived]
width = "ceil(out0_d2 / 128)"
in_width = "ceil(in0_d2 / 128)"
valid = "out0_d2 - (width - 1) * 128"
tail = "ds(valid) + 65536 * (out0_d2 // 16)"
span = "ceil(in1_d0 * in1_d1 / 128)"
seq_lo = "50462976"
seq_hi = "117835012"
stride_seq_lo = "403703808"
stride_seq_hi = "942680096"
scratch_format = "312 + 65536 * 328"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in_width * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d2", "span * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "width * 128"]

[scratch.tiles]
shape = ["2 + ceil(out0_d2 / 16)", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
