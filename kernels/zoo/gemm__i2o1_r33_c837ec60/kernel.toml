[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 768
[params.m]
type = "int"
min = 1
max = 65536
default = 50
[params.n]
type = "int"
min = 1
max = 65536
default = 768
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 50
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 768
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 64
default = 50
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 768

[derived]
input_blocks = "ceil(in0_d2 / 128)"
blocks = "ceil(k / 128)"
width = "out0_d1"
full = "ds(128)"
single = "ds(1)"
packed_ds = "ds(2 * width)"
tail_ds = "ds(width)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * input_blocks", 128]
range = [-2, 2]
[inputs.w]
shape = ["n * blocks", 128]
range = [-1, 1]
[inputs.b]
shape = ["n", 128]
range = [-1, 1]
when = "bias"
[outputs.out0]
shape = ["out0_d0 * ceil(out0_d2 / 2)", 128]

[abi]
in0 = "CR2"
w = "CR3"
b = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
blocks = "CR8"
input_blocks = "CR9"
width = "CR10"
n = "CR11"
packed_ds = "CR12"
tail_ds = "CR13"
single = "CR14"
full = "CR15"
out0_d0 = "LR15"

[cases.default]
