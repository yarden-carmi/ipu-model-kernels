[kernel]
op = "row_softmax"
formats = ["e2"]
[params.n]
type = "int"
min = 1
max = 4096
multiple_of = 1
default = 256
[params.rows]
type = "int"
min = 1
max = 8192
default = 4
[derived]
batch_stride = "in0_d3 * ceil(in0_d2 / 128)"
input_tiles = "ceil(in0_d2 / 128)"
batch_count = "in0_d0 * in0_d1"
K = "ceil(n / 128)"
M = "rows * K"
active = "ds(128)"
part = "ds(min(128, n - (K - 1) * 128))"
[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "ceil(in0_d2 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", "K", 128]
[scratch.exps]
shape = ["K", 128]
[scratch.tmp]
shape = [19, 128]
fill = 1
[scratch.transposed]
shape = ["rows", "K", 128]
[params.in0_d0]
type = "int"
min = 1
max = 8192
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 8192
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 8192
default = 197
[params.in0_d3]
type = "int"
min = 1
max = 4096
default = 197
[abi]
batch_count = "LR15"
in0_d2 = "LR1"
batch_stride = "CR4"
input_tiles = "CR12"
n = "CR13"
in0 = "CR2"
out0 = "CR3"
tmp = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR10"
transposed = "CR11"
K = "CR7"
M = "CR8"
exps = "CR9"
part = "CR14"
active = "CR15"
[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
n = 197
rows = 2364
