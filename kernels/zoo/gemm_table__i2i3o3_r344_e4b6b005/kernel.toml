[kernel]
op = "gemm_table"
formats = ["e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 16
multiple_of = 16
max = 16384
default = 240
[params.m]
type = "int"
min = 1
max = 16384
default = 64
[params.n]
type = "int"
min = 1
max = 16384
default = 160
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 4
[params.in0_d1]
type = "int"
min = 8
multiple_of = 8
max = 16384
default = 16
[params.in0_d2]
type = "int"
min = 16
multiple_of = 16
max = 16384
default = 240
[params.in1_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 160
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 8
[params.in1_d3]
type = "int"
min = 1
max = 128
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 2
max = 32768
default = 320
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 8

[derived]
groups = "k // 16"
width = "out0_d3"
active = "ds(width)"
full = "ds(128)"
span = "129 - width"
skip_rows = "in1_d0 * in1_d1 * in1_d2"

[inputs.in0]
shape = ["in0_d0 * (in0_d1 * in0_d2 // 128)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["skip_rows * ceil(in1_d3 / 128)", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * (2 + 4 * groups)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2 * ceil(width / 128)", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
coeff = "CR4"
lut = "CR5"
out0 = "CR6"
qf_in0 = "CR7"
qf_in1 = "CR8"
qf_out0 = "CR9"
active = "CR10"
full = "CR11"
skip_rows = "CR12"
span = "CR13"
n = "CR14"
out0_d2 = "CR15"

[cases.default]
