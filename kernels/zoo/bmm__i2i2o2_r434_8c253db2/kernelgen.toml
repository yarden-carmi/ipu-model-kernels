chain = ["bmm"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

# M lanes permit a direct outer-product accumulation, without a scratch transpose.
[layout.in0]
lanes = 2
rows = [0, 1, 3]

[view.in0]
kind = "whole"

[layout.in1]
lanes = 2
rows = [0, 1]

[view.in1]
kind = "heads"

[layout.out0]
lanes = 2
rows = [0, 1, 3]
