[kernel]
op = "gemm_table"
formats = ["e2", "e3"]

[params.k]
type = "int"
min = 1
max = 4096
default = 192
[params.n]
type = "int"
min = 1
max = 4096
default = 384
[params.m]
type = "int"
min = 64
max = 65535
multiple_of = 64
default = 256
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["gelu_tanh", "silu"]
default = "gelu_tanh"
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65535
multiple_of = 16
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 4096
multiple_of = 8
default = 192
[params.in1_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 65535
default = 128
[params.in1_d2]
type = "int"
min = 1
max = 65535
default = 16
[params.in1_d3]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 384
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 16

[derived]
activation_rows = "in0_d0 * ceil(in0_d1 * in0_d2 / 128)"
in1_rows = "in1_d0 * in1_d1 * ceil(in1_d2 / (128 // in1_d3))"
out_rows = "out0_d0 * out0_d1 * ceil(out0_d2 / (128 // out0_d3))"
tiles = "ceil(m / 128)"
groups = "k // 16"
coeff_rows = "n * (2 + 2 * ceil(k / 16))"
full = "ds(128)"
tail = "ds(1 + (m - 1) % 128)"

[inputs.in0]
shape = ["activation_rows", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
coeff = "CR4"
lut = "CR5"
tiles = "CR6"
out0 = "CR7"
qf_in0 = "CR8"
qf_in1 = "CR9"
qf_out0 = "CR10"
full = "CR11"
tail = "CR12"
n = "CR13"
groups = "CR14"
activation_rows = "CR15"

[cases.default]
