[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=32767, default=12}
# Whole, aligned heads per XMEM row: neither operand crosses a row.
k = {type="int", choices=[16,32,64,128], default=64}
m = {type="int", min=1, max=32767, default=256}
n = {type="int", min=1, max=32767, default=256}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=32767, default=256}
in0_d2 = {type="int", min=1, max=65535, default=2304}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=12}
out0_d2 = {type="int", min=1, max=32767, default=256}
out0_d3 = {type="int", min=1, max=32767, default=256}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "stride*128"]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[scratch.rotated]
shape = [128]

[derived]
stride = "ceil(in0_d2/128)"
group_rows = "in0_d1*stride"
key_rows = "(out0_d1*k)//128"
key_lane = "(out0_d1*k)%128"
head_info = "out0_d1+65536*key_lane"
ds_full = "ds(128)+65536*ds(k)"
ds_tail = "ds((n-1)%128+1)"
sizes = "m+65536*n"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
stride = "CR6"
group_rows = "CR7"
key_rows = "CR8"
head_info = "CR9"
ds_full = "CR10"
ds_tail = "CR11"
rotated = "CR12"
k = "CR13"
sizes = "CR14"
out0_d0 = "LR13"

[cases.default]
