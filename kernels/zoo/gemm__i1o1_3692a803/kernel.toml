[kernel]
op = "gemm"
formats = ["e2", "e3"]
[params.m]
type = "int"
min = 1
max = 65536
default = 2
[params.k]
type = "int"
min = 1
max = 65536
default = 129
[params.n]
type = "int"
min = 1
max = 65536
default = 130
[params.bias]
type = "bool"
default = false
[derived]
K = "ceil(k / 128)"
NB = "ceil(n / 128)"
c128 = "128"
c31 = "31"
[inputs.in0]
shape = ["m", "k"]
range = [-2, 2]
[inputs.w]
shape = ["K * 128 * NB", 128]
range = [-2, 2]
[inputs.b]
shape = ["NB", 128]
range = [-2, 2]
when = "bias"
[outputs.out0]
shape = ["m", "n"]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
K = "CR7"
NB = "CR8"
qf_in0 = "CR9"
qf_out0 = "CR10"
c128 = "CR11"
c31 = "CR12"
[golden]
tolerance = { e2 = "NX8_STEP", e3 = "NX8_STEP" }
[cases.default]
m = 2
k = 129
n = 130
bias = false
