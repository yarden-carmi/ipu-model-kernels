[kernel]
op = "curvature_selector"
formats = ["e2"]
[params.tokens]
type = "int"
min = 1
max = 256
default = 256
[params.vocab]
type = "int"
min = 1
max = 30522
default = 30522
[inputs.in0]
shape = [1, "ceil(tokens / 128) * 128"]
[inputs.thresholds]
shape = [2, 4, "ceil(vocab / 128)", 128]
[inputs.sixth]
shape = [128]
[inputs.big]
shape = [128]
[outputs.out0]
shape = ["tokens", "ceil(vocab / 128) * 128"]
[scratch.steps]
shape = [3, 128]
[derived]
chunks = "ceil(vocab / 128)"
ds = "ds(128)"
tail = "ds((vocab - 1) % 128 + 1)"
[abi]
in0 = "CR2"
thresholds = "CR3"
out0 = "CR4"
steps = "CR5"
qf_in0 = "CR6"
qf_thresholds = "CR7"
qf_steps = "CR8"
qf_out0 = "CR9"
chunks = "LR10"
qf_big = "CR10"
big = "CR11"
sixth = "CR12"
qf_sixth = "CR14"
tail = "CR13"
ds = "CR15"
tokens = "LR8"
[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
tokens = 256
vocab = 30522
