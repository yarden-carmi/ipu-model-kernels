[kernel]
op = "xor_or_fold_selector"
formats = ["e2"]
[params.tokens]
type = "int"
min = 1
max = 256
default = 256
[params.vocab]
type = "int"
min = 128
max = 32128
multiple_of = 128
default = 32128
[inputs.in0]
shape = [1, "tokens"]
range = [0, 31]
[inputs.ramp]
shape = [3, "vocab"]
range = [0, 1]
[inputs.ones]
shape = [128]
range = [1, 1]
[outputs.out0]
shape = ["tokens", "vocab"]
[scratch.tmp]
shape = [2, 128]
[derived]
chunks = "vocab // 128"
mid = "base(ramp) + chunks"
low = "base(ramp) + 2 * chunks"
[abi]
in0 = "CR2"
ramp = "CR3"
mid = "CR4"
low = "CR5"
ones = "CR6"
out0 = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
qf_ramp = "CR10"
qf_out0 = "CR11"
qf_ones = "CR12"
chunks = "CR13"
tokens = "CR14"
[cases.default]
tokens = 256
vocab = 32128
