[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]
[params.act_out0]
type = "str"
choices = ["hardswish"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 1024
default = 288
[params.cout]
type = "int"
min = 1
max = 1024
default = 288
[params.groups]
type = "int"
min = 1
max = 1024
default = 288
[params.h]
type = "int"
min = 1
max = 256
default = 14
[params.w]
type = "int"
min = 1
max = 256
default = 14
[params.kh]
type = "int"
choices = [3, 5]
default = 5
[params.kw]
type = "int"
choices = [3, 5]
default = 5
[params.padding]
type = "int"
choices = [1, 2]
default = 2
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1024
default = 288
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 14
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 1024
default = 288
[params.out0_d2]
type = "int"
min = 1
max = 256
default = 7
[params.out0_d3]
type = "int"
min = 1
max = 256
default = 7
[derived]
chunks = "ceil(in0_d1 / 128)"
ds128 = "ds(128)"
weight_block = "2 * (1 + kh * kw * (1 + (cin - 1) * (1 - min(1, groups - 1))))"
window_jump = "in0_d3 + 2 * padding - kw"
[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "chunks", 128]
range = [-2, 2]
[inputs.weights]
shape = ["chunks * weight_block", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", "ceil(out0_d1 / 128)", 128]
[scratch.pad]
shape = ["(in0_d2 + 2 * padding) * (in0_d3 + 2 * padding)", 128]
[abi]
in0 = "CR2"
weights = "CR3"
lut = "CR4"
out0 = "CR5"
pad = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
weight_block = "CR11"
window_jump = "CR12"
out0_d2 = "CR13"
[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
