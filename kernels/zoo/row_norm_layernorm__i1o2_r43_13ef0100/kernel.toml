[kernel]
op = "row_norm"
formats = ["e1", "e2"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 1
max = 4096
default = 144
[params.rows]
type = "int"
min = 1
max = 4096
default = 1024
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-5
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 144
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 4096
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 4096
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 144
[derived]
half = "1277440"
K = "ceil(channels / 128)"
input_K = "ceil(in0_d1 / 128)"
stride = "out0_d0 * K"
M = "rows * K"
rem = "channels - 128 * (K - 1)"
chunk = "K + 65536 * rem"
tail = "ds(rem) + 65536 * ds(128)"
group = "out0_d1 * K"
stage = "32 + 3 * K"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * input_K", 128]
[inputs.gamma]
shape = ["3 * K", 128]
[inputs.beta]
shape = ["3 * K", 128]
[inputs.crow]
shape = [3, 128]
[inputs.pack_data]
shape = ["1 + 2 * group", 128]
[scratch.tmp]
shape = ["stage + 3 * M", 128]
[outputs.out0]
shape = ["out0_d0 * ceil(out0_d1 * out0_d2 / 128)", 128]

[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
crow = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
chunk = "CR10"
M = "CR11"
pack_data = "CR12"
half = "CR13"
tail = "CR14"
group = "CR15"
stride = "LR13"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
