[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=1073676289, default=6}
k = {type="int", min=1, max=32767, default=257}
m = {type="int", min=1, max=32767, default=257}
n = {type="int", min=1, max=32767, default=64}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=32767, default=6}
in0_d2 = {type="int", min=1, max=32767, default=257}
in0_d3 = {type="int", min=1, max=32767, default=257}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=32767, default=257}
in1_d2 = {type="int", min=1, max=4194176, default=384}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=6}
out0_d2 = {type="int", min=1, max=32767, default=257}
out0_d3 = {type="int", min=1, max=32767, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "ac*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "bc*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]
[derived]
ac = "ceil(in0_d2/128)"
bc = "ceil(in1_d2/128)"
strides = "ac + 65536*bc"
md = "ds(128) + 65536*ds((m-1)%128+1)"
mn = "m + 65536*n"
heads = "out0_d1 + 65536*out0_d0"
group_jump = "in1_d1*bc*min(in1_d0-1,1)-(out0_d1*n)//128"
ahead = "in0_d3*ac*min(in0_d1-1,1)"
agroup = "in0_d1*in0_d3*ac*min(in0_d0-1,1)-out0_d1*ahead"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
k = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
md = "CR9"
agroup = "CR10"
mn = "CR11"
strides = "CR12"
heads = "CR13"
group_jump = "CR14"
ahead = "CR15"

[cases.default]
