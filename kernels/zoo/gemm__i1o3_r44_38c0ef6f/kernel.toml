[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 88
[params.m]
type = "int"
min = 1
max = 2147483647
default = 784
[params.n]
type = "int"
min = 1
max = 4096
default = 24
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 88
[params.in0_d2]
type = "int"
min = 1
default = 28
[params.in0_d3]
type = "int"
min = 1
default = 28
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 24
[params.out0_d2]
type = "int"
min = 1
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 28

[derived]
candidate = "min(out0_d2, 128 // out0_d3)"
pack = "1 + (candidate - 1) * (1 - min(1, out0_d2 % candidate))"
pixels = "pack * out0_d3"
tiles = "out0_d2 // pack"
chunks = "ceil(k / 128)"
channel_rows = "ceil(in0_d1 / 128)"
tile_rows = "pixels * channel_rows"
batch_rows = "in0_d2 * in0_d3 * channel_rows"
active = "ds(pixels)"
full = "ds(128)"

[inputs.in0]
shape = ["in0_d0 * batch_rows", 128]
range = [-2, 2]
[inputs.w]
shape = ["n * (2 * chunks + 2)", 128]
range = [-1, 1]
when = "bias"
[inputs.w_unbiased]
shape = ["n * 2 * chunks", 128]
range = [-1, 1]
when = "not bias"
[outputs.out0]
shape = ["out0_d0 * out0_d1 * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
w_unbiased = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
active = "CR7"
full = "CR8"
in0_d0 = "CR9"
n = "CR10"
tiles = "CR11"
chunks = "CR12"
pixels = "CR13"
tile_rows = "CR14"
batch_rows = "CR15"
channel_rows = "LR15"

[cases.default]
