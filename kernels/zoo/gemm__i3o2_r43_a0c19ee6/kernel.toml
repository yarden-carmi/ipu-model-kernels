[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 768
[params.m]
type = "int"
min = 1
max = 65536
default = 256
[params.n]
type = "int"
min = 1
max = 65536
default = 768
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 2
max = 65536
multiple_of = 2
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 64
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 768

[derived]
tiles = "ceil(out0_d2 / 128)"
rows = "out0_d0 * out0_d1"
groups = "in0_d1 // 2"
group_last = "2 * in0_d3 - 1"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * groups", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * (k + 1) * 2 + 1", 128]
range = [-1, 1]
[outputs.out0]
shape = ["rows * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
rows = "CR10"
groups = "CR11"
group_last = "CR12"

[cases.default]
k = 8
m = 4
n = 3
in0_d1 = 2
in0_d2 = 4
in0_d3 = 4
out0_d1 = 4
out0_d2 = 3
