[kernel]
op = "reflected_corner_contract"
formats = ["e2"]
[params]
oh = {type="int", min=2, max=8192, default=16}
ow = {type="int", min=4, max=8192, default=16}
in0_d0 = {type="int", min=1, max=65536, default=1}
in0_d1 = {type="int", min=1, max=64, default=64}
in0_d2 = {type="int", min=1, max=4096, default=8}
in0_d3 = {type="int", min=2, max=4096, multiple_of=2, default=8}
out0_d0 = {type="int", min=1, max=65536, default=1}
out0_d1 = {type="int", min=1, max=64, default=64}
out0_d2 = {type="int", min=2, max=8192, default=16}
out0_d3 = {type="int", min=4, max=8192, default=16}
[derived]
pitch = "in0_d3 // 2"
active = "ds(out0_d1) + ds(128)*65536"
full = "ds(128)"
k9 = "0x137e02"
k3 = "0x137c08"
k1 = "0x137b00"
f9 = "0x3f100000"
f3 = "0x3e400000"
f1 = "0x3d800000"
[inputs.in0]
shape = ["in0_d0", "in0_d2", "pitch", 128]
range = [-2, 2]
[outputs.out0]
shape = ["ceil(out0_d0*out0_d1*out0_d2/8)", "ceil(out0_d3*8/128)*128"]
[scratch.tmp]
shape = ["out0_d0*out0_d2*out0_d3", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
active = "CR6"
in0_d0 = "LR14"
in0_d1 = "LR15"
in0_d2 = "CR8"
pitch = "CR9"
k9 = "CR10"
k3 = "CR11"
k1 = "CR12"
f9 = "CR13"
f3 = "CR14"
f1 = "CR15"
tmp = "CR7"
out0_d3 = "LR12"
[cases.default]
