[kernel]
op = "reflected_corner_contract"
formats = ["e2"]

[params]
oh = { type = "int", min = 8, max = 8192, multiple_of = 8, default = 16 }
ow = { type = "int", min = 4, max = 16, multiple_of = 4, default = 16 }
in0_d0 = { type = "int", min = 1, max = 65536, default = 1 }
in0_d1 = { type = "int", min = 1, max = 64, default = 64 }
in0_d2 = { type = "int", min = 4, max = 4096, multiple_of = 4, default = 8 }
in0_d3 = { type = "int", min = 2, max = 8, multiple_of = 2, default = 8 }
out0_d0 = { type = "int", min = 1, max = 65536, default = 1 }
out0_d1 = { type = "int", min = 1, max = 64, default = 64 }
out0_d2 = { type = "int", min = 8, max = 8192, multiple_of = 8, default = 16 }
out0_d3 = { type = "int", min = 4, max = 16, multiple_of = 4, default = 16 }

[derived]
pitch = "in0_d3 // 2"
scalar_ds = "ds(1) + in0_d2 * 65536"
pack_lanes = "8 * ow"
packed = "ds(pack_lanes) + in0_d1 * 65536"
input_rows = "in0_d0 * in0_d2 * pitch"
k9 = "0x137e02"
k3 = "0x137c08"
k1 = "0x137b00"
f9 = "0x3f100000"
f3 = "0x3e400000"
f1 = "0x3d800000"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "pitch", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2 // 8", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
scalar_ds = "CR6"
input_rows = "CR7"
packed = "CR8"
k9 = "CR9"
k3 = "CR10"
k1 = "CR11"
f9 = "CR12"
f3 = "CR13"
f1 = "CR14"
pitch = "CR15"
pack_lanes = "LR14"

[cases.default]
