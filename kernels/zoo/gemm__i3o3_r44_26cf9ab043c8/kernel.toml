[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 2147483647
default = 256
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d2]
type = "int"
min = 1
default = 16
[params.in0_d3]
type = "int"
min = 1
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
default = 16
[params.out0_d3]
type = "int"
min = 1
default = 16
[derived]
full = "ds(128)"
ic = "min(in0_d2, max(1, 128 // in0_d3))"
oc = "min(out0_d2, max(1, 128 // out0_d3))"
ip = "1 + (ic - 1) * (1 - min(1, in0_d2 % ic))"
op = "1 + (oc - 1) * (1 - min(1, out0_d2 % oc))"
pitch = "ceil(in0_d2 / ip) * ceil(ip * in0_d3 / 128)"
out_pitch = "ceil(out0_d2 / op) * ceil(op * out0_d3 / 128)"
batch_stride = "k * pitch"
tiny = "1 - min(1, max(in0_d2 * in0_d3 - 64, 64 - in0_d2 * in0_d3) + k % 2 + max(0, k - 1024))"
chunks = "ceil(k / 128)"
panel_start = "64 * chunks"
separate = "min(1, max(0, in0_d2 * in0_d3 - 1024))"
long = "separate * min(1, max(0, k - 255)) * (1 - min(1, k % 128)) * (1 - min(1, max(0, in0_d3 - 128)) * min(1, in0_d3 % 128))"
weights = "n * ((1 - tiny) * ((1 - long) * (2 + separate) * ceil(k / 32) + long * (3 * chunks + 1)) + tiny * (chunks + 1))"
active = "ds(min(128, ip * in0_d3))"
tail = "ds((ip * in0_d3 - 1) % 128 + 1)"
dot_tail = "tiny * ds((k - 1) % 128 + 1) + (1 - tiny) * ceil(ip * in0_d3 / 128)"
second = "(1 - tiny) * 128 + tiny * 1073741824"
blocks = "(1 - tiny) * ((1 - long) * ((k - 1) // 32) + long * (chunks - 1)) + tiny * 16777216"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * pitch", 128]
range = [-2, 2]
[inputs.w]
shape = ["weights + 2 * n", 128]
range = [-1, 1]
when = "bias"
[inputs.w_unbiased]
shape = ["weights", 128]
range = [-1, 1]
when = "not bias"
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out_pitch", 128]
[scratch.panel]
shape = ["1 + tiny * (panel_start + k // 2) + long * pitch", 128]

[abi]
in0 = "CR2"
w = "CR3"
w_unbiased = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
n = "CR8"
in0_d0 = "CR9"
second = "CR10"
blocks = "CR11"
active = "CR12"
panel = "CR13"
tail = "CR14"
dot_tail = "CR15"
pitch = "LR4"
batch_stride = "LR15"
panel_start = "LR5"

[cases.default]
