[kernel]
op = "row_norm"
formats = ["e2"]
[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 129
max = 256
multiple_of = 16
default = 240
[params.rows]
type = "int"
min = 64
max = 1024
multiple_of = 64
default = 64
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-5
[params.in0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 256
default = 16
[params.in0_d2]
type = "int"
min = 129
max = 256
default = 240
[params.out0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 256
default = 16
[params.out0_d2]
type = "int"
min = 129
max = 256
default = 240

[derived]
ds1 = "ds(1) + 65536 * qf(1, 1, 8, 0)"
c128 = "128 + (1 - min(1, rows % 8 + channels % 16)) * (50462976 - 128)"
cC = "channels + (1 - min(1, rows % 8 + channels % 16)) * (117835012 - channels)"
dsl = "ds(channels - 128)"
pack_dest = "555745536"
[inputs.in0]
shape = ["in0_d0 * (in0_d1 * 2 + min(1, max(0, in0_d2 - 144)) * ((in0_d1 * in0_d2 + 127) // 128 - in0_d1 * 2))", 128]
range = [-2.0, 2.0]
[inputs.gamma]
shape = [4, 128]
[inputs.beta]
shape = ["2 + 2 * min(1, max(0, channels - 144))", 128]
[inputs.crow]
shape = ["2 + min(1, max(0, channels - 144))", 128]
[scratch.tmp]
shape = ["40 + 2 * rows + (rows // 8) * (channels // 16)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * 2", 128]
[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
crow = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
c128 = "CR10"
cC = "CR11"
pack_dest = "CR12"
ds1 = "CR13"
dsl = "CR14"
[golden]
tolerance = { e2 = "NX8_STEP" }

[cases.default]
