chain = ["row_norm"]
chain_in = ["in0"]
chain_out = ["out0"]

[layout.in0]
lanes = 2
rows = [0, 1]
pack = "1 + (d1 - 1) * min(1, max(0, d2 - 144))"
[view.in0]
kind = "other"
[prefer.in0]
lanes = 2
rows = [0, 1]
pack = "d1"
[layout.out0]
lanes = 2
rows = [0, 1]

[format.gamma]
format = "e1"
[format.beta]
format = "e1"
