[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 1024
default = 384
[params.cout]
type = "int"
min = 1
max = 1024
default = 384
[params.groups]
type = "int"
min = 1
max = 1
default = 1
[params.h]
type = "int"
min = 1
max = 128
default = 16
[params.w]
type = "int"
min = 1
max = 128
default = 16
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1024
default = 384
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 1024
default = 384
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 16

[derived]
full = "ds(128)"
width = "ds(out0_d2)"
weight_rows = "1 + 9 * in0_d1"
last_channel = "in0_d1 - 1"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2", 128]
range = [-2, 2]
[inputs.onehot]
shape = ["in0_d2", 128]
range = [0, 1]
[inputs.weights]
shape = ["out0_d1", "weight_rows", 128]
range = [-1, 1]
[scratch.transpose]
shape = ["in0_d1 * in0_d3", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d3 * out0_d1", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
in0_d1 = "CR7"
in0_d3 = "CR8"
out0_d1 = "CR9"
full = "CR10"
width = "CR11"
weight_rows = "CR12"
last_channel = "CR13"
transpose = "CR14"
onehot = "CR15"
in0_d2 = "LR9"

[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}

[cases.default]
