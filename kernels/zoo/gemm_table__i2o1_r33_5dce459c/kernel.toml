[kernel]
op = "gemm_table"
formats = ["e2"]
[params.m]
type = "int"
min = 1
max = 16384
default = 256
[params.n]
type = "int"
min = 1
max = 16384
default = 3072
[params.k]
type = "int"
min = 1
max = 16384
default = 768
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["gelu_tanh"]
default = "gelu_tanh"
[params.in0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 768
[params.out0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 3072
[derived]
ik = "ceil(in0_d2 / 128)"
tiles = "ceil(out0_d1 / 128)"
tail = "ds((out0_d1 - 1) % 128 + 1)"
full = "ds(128)"
wk = "ceil((k + 1) / 128) * 128"
[inputs.in0]
shape = ["in0_d0", "in0_d1", "ik * 128"]
range = [-2, 2]
[inputs.w]
shape = ["n", "wk"]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.panel]
shape = ["tiles", "k", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "tiles * 128"]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
panel = "CR5"
lut = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
ik = "CR9"
k = "CR10"
in0_d1 = "CR11"
n = "CR12"
in0_d0 = "CR13"
full = "CR14"
tail = "CR15"
[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
