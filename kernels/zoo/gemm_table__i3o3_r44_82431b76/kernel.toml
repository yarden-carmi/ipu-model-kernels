[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 16
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 65536
default = 16384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 128

[derived]
pack = "1 + (min(in0_d2, 128 // in0_d3) - 1) * (1 - min(1, in0_d2 % min(in0_d2, 128 // in0_d3)))"
height = "in0_d2 // pack"
stripes = "in0_d0 * height"
batch_skip = "(k - 1) * height"
small = "1 - min(1, max(0, k - 16))"
tight = "min(1, max(0, k - 17)) * (1 - min(1, max(0, k - 32))) * (1 - k % 2)"
cache_slot = "128 * tight + 384 * (1 - tight)"
compensated = "1 - small"
groups = "tight * ((k - 2) // 2) + (1 - tight) * (small * min((k + 3) // 4, (k - 1) // 2) + compensated * (k // 4 + min(1, max(0, k - 64)) * ((k - 1) // 2 - k // 4)))"
paired = "k - 2 * groups"
cache_start = "height * (2 * tight + small * (paired + 2)) + (1 - tight) * compensated * groups"
full_blocks = "(paired - 1) // 32"
active = "ds(out0_d3 * pack)"
tail_blocks = "max(0, groups - 1) // 32"

[inputs.in0]
shape = ["stripes * in0_d1", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * (tight * 4 + (1 - tight) * (2 * (1 + full_blocks) + small * groups + compensated * 2 * (tail_blocks + min(1, groups)) + 2 * min(1, max(0, k - 32)))) + 1", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["n * stripes", 128]

[scratch.sums]
shape = ["max(1, groups)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
n = "CR8"
height = "CR9"
cache_slot = "CR10"
stripes = "CR11"
active = "CR12"
sums = "CR13"
cache_start = "CR14"
batch_skip = "CR15"

[cases.default]
