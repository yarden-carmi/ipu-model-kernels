[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["hardswish"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 240
[params.cout]
type = "int"
min = 1
max = 640
default = 240
[params.groups]
type = "int"
min = 1
max = 640
default = 240
[params.h]
type = "int"
min = 1
max = 256
default = 14
[params.w]
type = "int"
min = 1
max = 256
default = 14
[params.kh]
type = "int"
choices = [1, 3, 5]
default = 5
[params.kw]
type = "int"
choices = [1, 3, 5]
default = 5
[params.padding]
type = "int"
min = 0
max = 2
default = 2
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 240
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 14
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 240
[params.out0_d2]
type = "int"
min = 1
max = 260
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 14

[derived]
chunks = "ceil(in0_d1 / 128)"
gcin = "cin // groups"
plane = "(in0_d2 + 2 * padding) * kw"
group_plane = "plane * gcin"
residual_offset = "plane * cin"
row_step = "in0_d3 * chunks"
ds128 = "ds(128)"
ds_out = "ds(out0_d3)"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "chunks", 128]
range = [-2, 2]
[inputs.weights]
shape = ["3 * cout * (1 + gcin)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.taps]
shape = ["2 * residual_offset", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
taps = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
ds_out = "CR11"
row_step = "CR12"
plane = "CR13"
group_plane = "CR14"
residual_offset = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
