[kernel]
op = "row_norm"
formats = ["e2"]
[params.kind]
type = "str"
choices = ["rmsnorm"]
default = "rmsnorm"
[params.channels]
type = "int"
min = 128
max = 65536
multiple_of = 128
default = 512
[params.rows]
type = "int"
min = 1
max = 1048576
multiple_of = 1
default = 4
[params.eps]
type = "float"
default = 0.000001
[derived]
qf = "qf_in0"
K = "channels // 128"
M = "rows * K"
valid = "ds(128)"
[inputs.in0]
shape = ["rows", "K", 128]
range = [-2.0, 2.0]
[inputs.gamma]
shape = ["channels"]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["rows", "K", 128]
[scratch.tmp]
shape = [8, 128]
[inputs.recip]
shape = [128]
range = [0.001, 0.001]
[inputs.epsilon]
shape = [128]
range = [0.000001, 0.000001]
[abi]
in0 = "CR2"
gamma = "CR3"
out0 = "CR4"
tmp = "CR5"
recip = "CR6"
epsilon = "CR7"
K = "CR8"
M = "CR9"
qf_in0 = "CR14"
qf = "CR11"
qf_out0 = "CR10"
valid = "CR15"
[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
channels = 512
rows = 4
[cases.widths]
channels = [128, 768, 2048]
rows = 2
