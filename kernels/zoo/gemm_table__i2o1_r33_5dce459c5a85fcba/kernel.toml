[kernel]
op = "gemm_table"
formats = ["e3"]

[params.m]
type = "int"
min = 1
max = 16384
default = 256
[params.k]
type = "int"
min = 1
max = 16384
default = 768
[params.n]
type = "int"
min = 1
max = 16384
default = 3072
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["gelu", "quick_gelu"]
default = "gelu"
[params.in0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 768
[params.out0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 3072

[derived]
K = "ceil(k / 128)"
kp = "128 * K"
tiles = "ceil(out0_d1 / 128)"
padded_m = "128 * tiles"
tail = "ds((out0_d1 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2"]
[inputs.w]
shape = ["n", "kp"]
[inputs.b]
shape = ["n", 128]
when = "bias"
[inputs.lut]
shape = [5, 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "padded_m"]



[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
in0_d1 = "CR6"
K = "CR7"
n = "CR8"
qf_in0 = "CR9"
lut = "CR10"
in0_d0 = "CR11"
qf_out0 = "CR12"
tail = "CR13"

[golden]
tolerance = { e3 = "NX8_STEP" }

[cases.default]
m = 129
k = 130
n = 3
in0_d1 = 129
in0_d2 = 130
out0_d1 = 129
out0_d2 = 3
