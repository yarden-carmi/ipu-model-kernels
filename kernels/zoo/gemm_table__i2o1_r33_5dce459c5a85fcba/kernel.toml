[kernel]
op = "gemm_table"
formats = ["e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 256
default = 144
[params.m]
type = "int"
min = 1
max = 65535
default = 1024
[params.n]
type = "int"
min = 1
max = 65535
default = 288
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 144
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 288

[derived]
blocks = "ceil(k / 128)"
tiles = "ceil(out0_d1 / 128)"
tail_count = "(out0_d1 - 1) % 128"
full_count = "127"
full_ds = "ds(128)"
tail_ds = "ds(tail_count + 1)"
one_ds = "ds(1)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["n * blocks", 128]
range = [-1, 1]
[inputs.b]
shape = ["n", 128]
range = [-1, 1]
when = "bias"
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
b = "CR4"
lut = "CR5"
out0 = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
full_ds = "CR9"
tail_ds = "CR10"
one_ds = "CR11"
full_count = "CR12"
tail_count = "CR13"
tiles = "CR14"
n = "CR15"
out0_d0 = "LR15"

[cases.default]
