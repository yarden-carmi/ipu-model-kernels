[kernel]
op = "binary_mul_scalar"
formats = ["e2", "e4"]
[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 465708
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 197
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 197
[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d3", "ceil(in0_d2 / 128) * 128"]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["in0_d0 * in0_d1 * in0_d2", "ceil(in0_d3 / 128) * 128"]
[scratch.tmp]
shape = [1, 128]
[derived]
ic = "ceil(in0_d2 / 128)"
oc = "ceil(in0_d3 / 128)"
h = "in0_d2"
w = "in0_d3"
planes = "in0_d0 * in0_d1"
plane_rows = "in0_d3 * ic"
full = "ds(128)"
tail = "ds((in0_d3 - 1) % 128 + 1)"
[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
ic = "CR6"
oc = "CR7"
h = "CR8"
w = "CR9"
planes = "CR10"
plane_rows = "CR11"
full = "CR12"
tail = "CR13"
tmp = "CR14"
[golden]
tolerance = { e2 = "EXACT", e4 = "EXACT" }
[cases.default]
