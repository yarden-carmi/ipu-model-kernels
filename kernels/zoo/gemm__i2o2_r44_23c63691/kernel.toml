[kernel]
op = "gemm"
formats = ["e1", "e2"]
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 256
[params.m]
type = "int"
min = 1
max = 65536
default = 1024
[params.n]
type = "int"
min = 1
max = 65536
default = 96
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 96
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 32
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 32
[derived]
spatial = "in0_d0 * ceil(in0_d3 / 2) * ceil(in0_d2 * 2 / 128)"
wrows = "3 * (ceil(k / 128) + 1)"
full = "ds(128)"
limit = "125"
valid = "ds(min(128, out0_d2 * 2))"
plane_count = "3"
chunks = "k // 128"
[inputs.in0]
shape = ["in0_d1 * spatial", 128]
[inputs.w]
shape = ["n * wrows", 128]
[outputs.out0]
shape = ["out0_d1 * out0_d0 * ceil(out0_d3 / 2) * ceil(out0_d2 * 2 / 128)", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
spatial = "CR7"
wrows = "CR8"
n = "CR9"
full = "CR10"
k = "CR11"
limit = "CR12"
valid = "CR13"
plane_count = "CR14"
chunks = "CR15"
[cases.default]
