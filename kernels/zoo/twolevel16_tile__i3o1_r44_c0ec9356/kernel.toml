[kernel]
op = "twolevel16_tile"
formats = ["e2"]

[params.cin]
type = "int"
min = 16
multiple_of = 16
default = 96
[params.cout]
type = "int"
min = 1
max = 128
default = 96
[params.h]
type = "int"
min = 1
default = 16
[params.w]
type = "int"
min = 1
max = 128
default = 16
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 16
multiple_of = 16
default = 96
[params.in0_d2]
type = "int"
min = 1
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 96
[params.out0_d2]
type = "int"
min = 2
default = 32
[params.out0_d3]
type = "int"
min = 2
default = 32

[inputs.in0]
shape = ["ceil(in0_d0 * in0_d1 * in0_d2 / pack)", 128]
range = [-1, 1]
[inputs.coeff]
shape = ["4 * phase_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3", 128]

[derived]
pack = "max(1, (128 // in0_d3) * (1 - min(1, in0_d2 % (128 // in0_d3))))"
phase_rows = "2 * (cin + 1)"
lane_limit = "pack * in0_d3"
channel_rows = "in0_d2 // pack"
batch_skip = "(in0_d1 - 1) * channel_rows"
total_y = "in0_d0 * h"
valid = "ds(out0_d1)"

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
valid = "CR7"
channel_rows = "CR8"
phase_rows = "CR9"
out0_d3 = "CR10"
w = "CR11"
h = "CR12"
batch_skip = "CR13"
lane_limit = "CR14"
total_y = "CR15"

[cases.default]
