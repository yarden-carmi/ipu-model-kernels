[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params]
act_out0 = {type="str", choices=["hardswish"], default="hardswish"}
bias = {type="bool", default=true}
cin = {type="int", min=1, max=640, default=240}
cout = {type="int", min=1, max=640, default=240}
groups = {type="int", min=1, max=640, default=240}
h = {type="int", min=1, max=28, default=14}
w = {type="int", min=1, max=28, default=14}
kh = {type="int", choices=[5], default=5}
kw = {type="int", choices=[5], default=5}
padding = {type="int", choices=[2], default=2}
stride = {type="int", choices=[1,2], default=1}
in0_d0 = {type="int", choices=[1], default=1}
in0_d1 = {type="int", min=1, max=640, default=240}
in0_d2 = {type="int", min=1, max=28, default=14}
in0_d3 = {type="int", min=1, max=28, default=14}
out0_d0 = {type="int", choices=[1], default=1}
out0_d1 = {type="int", min=1, max=640, default=240}
out0_d2 = {type="int", min=1, max=14, default=14}
out0_d3 = {type="int", min=1, max=28, default=14}

[derived]
pack = "128 // out0_d2"
tiles = "ceil(out0_d3 / pack)"
stagecols = "in0_d3 + 2 * padding + pack * stride"
stageplane = "stagecols * kh * 2"
wplane = "2 + 2 * pack * kh * kw"
ds128 = "ds(128)"
tail = "ds((1 + (out0_d3 - 1) % pack) * out0_d2)"
outds = "ds(pack * out0_d2)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [-2,2]
[inputs.weights]
shape = ["cout * wplane",128]
range = [-1,1]
[inputs.lut]
shape = [5,128]
range = [0,0]
[scratch.stage]
shape = ["cin * stageplane",128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "tiles",128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
stage = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
tail = "CR11"
stageplane = "CR12"
wplane = "CR13"
outds = "CR14"

[golden]
tolerance = {e1="NX8_STEP", e2="NX8_STEP"}
[cases.default]
