[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["scalar"], default = "scalar" }
const = { type = "int", min = 1, max = 1, default = 1 }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["mul"], default = "mul" }
numel = { type = "int", min = 1, max = 2147483647, default = 50176 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 1 }
in0_d2 = { type = "int", min = 1, default = 224 }
in0_d3 = { type = "int", min = 1, default = 224 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 1 }
out0_d2 = { type = "int", min = 1, default = 224 }
out0_d3 = { type = "int", min = 1, default = 224 }

[derived]
chunks = "ceil(in0_d2 * in0_d3 / 128)"
rows = "in0_d0 * in0_d1 * chunks"
last_chunk = "chunks - 1"
last_row = "rows - 1"
ds_pair = "ds((out0_d2 * out0_d3 - 1) % 128 + 1) + 65536 * ds(128)"

[inputs.in0]
shape = ["rows", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 * out0_d3 / 128)", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
ds_pair = "CR6"
last_chunk = "CR7"
last_row = "CR8"

[cases.default]
