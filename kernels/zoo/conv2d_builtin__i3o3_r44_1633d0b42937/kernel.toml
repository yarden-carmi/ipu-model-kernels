[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 88
[params.cout]
type = "int"
min = 1
max = 128
default = 88
[params.groups]
type = "int"
min = 1
max = 128
default = 88
[params.h]
type = "int"
min = 1
max = 256
default = 28
[params.w]
type = "int"
min = 1
max = 128
default = 28
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 88
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 28
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 88
[params.out0_d2]
type = "int"
min = 1
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 28

[derived]
input_rows = "in0_d0 * in0_d2 * in0_d1"
output_rows = "out0_d0 * out0_d2 * out0_d1"
last_y = "in0_d2 - 1"
ds_width = "ds(out0_d3)"
ds_input = "ds(in0_d3)"
weight_rows = "30 * out0_d1"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
[outputs.out0]
shape = ["output_rows", 128]
[scratch.line]
shape = [1, 128]
[scratch.clean]
shape = ["3 * input_rows + 1", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
line = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
ds_width = "CR8"
ds_input = "CR9"
in0_d2 = "CR10"
clean = "CR11"
last_y = "CR12"
out0_d3 = "CR13"
out0_d1 = "CR14"
input_rows = "CR15"

[cases.default]
