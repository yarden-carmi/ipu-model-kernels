[kernel]
op = "gemm_table"
formats = ["e2"]

[params.m]
type = "int"
min = 16
max = 16384
multiple_of = 16
default = 64
[params.k]
type = "int"
min = 16
max = 16384
multiple_of = 16
default = 240
[params.n]
type = "int"
min = 1
max = 16384
default = 160
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.in0_d0]
type = "int"
min = 1
max = 16
default = 4
[params.in0_d1]
type = "int"
min = 8
max = 16384
multiple_of = 8
default = 16
[params.in0_d2]
type = "int"
min = 16
max = 16384
multiple_of = 16
default = 240
[params.in1_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 160
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 8
[params.in1_d3]
type = "int"
min = 1
max = 16384
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 2
max = 32768
default = 320
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 16384
default = 8

[derived]
blocks = "ceil(out0_d1 / 128) - n // 128"
copy_width = "ceil(in1_d1 / 128)"
out_width = "ceil(out0_d1 / 128)"
full = "ds(128)"
mi = "m"
mixed = "1 - min(1, ((k // in0_d0) % 8 - 4) * ((k // in0_d0) % 8 - 4))"
ki = "mixed * (k // in0_d0 // 4) + (1 - mixed) * (k // in0_d0)"
w_rows = "2 * k - mixed * (k // 4 - 1)"
copy_tail = "ds((n - 1) % 128 + 1)"

[inputs.in0]
shape = ["ceil(in0_d1 * in0_d2 / 8)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d2 * in1_d3 * copy_width", 128]
range = [-2, 2]
[inputs.w]
shape = ["blocks", "w_rows", 128]
range = [-1, 1]
[inputs.b]
shape = ["blocks", 2, 128]
range = [-1, 1]
when = "bias"
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.copy]
shape = [1, 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * out_width", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
w = "CR5"
b = "CR6"
lut = "CR7"
copy = "CR8"
qf_in0 = "CR9"
qf_in1 = "CR10"
qf_out0 = "CR11"
full = "CR12"
mi = "CR13"
ki = "CR14"
copy_tail = "CR15"

[cases.default]

[golden]
tolerance = { e2 = "NX8_STEP" }
