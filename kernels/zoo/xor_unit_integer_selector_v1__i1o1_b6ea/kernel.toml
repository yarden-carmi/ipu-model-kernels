[kernel]
op = "xor_unit_integer_selector_v1"
formats = ["e2"]
[params.tokens]
type = "int"
min = 1
max = 256
default = 256
[params.vocab]
type = "int"
min = 128
max = 32128
multiple_of = 128
default = 32128
[inputs.in0]
shape = [1, "tokens"]
range = [0, 255]
[inputs.digits]
shape = ["3 * (vocab // 128) + 1", 128]
range = [0, 1]
[outputs.out0]
shape = ["tokens", "vocab"]
[scratch.difference]
shape = [128]
[derived]
chunks = "vocab // 128"
ones = "3 * (vocab // 128)"
[abi]
in0 = "CR2"
out0 = "CR3"
digits = "CR4"
difference = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
qf_digits = "CR8"
qf_difference = "CR9"
chunks = "CR10"
tokens = "CR11"
ones = "CR14"
[cases.default]
tokens = 256
vocab = 32128
