[kernel]
op = "binary_add"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
numel = { type = "int", min = 1, max = 16777216, default = 49152 }
in0_d0 = { type = "int", min = 1, max = 128, default = 4 }
in0_d1 = { type = "int", min = 1, max = 32767, default = 64 }
in0_d2 = { type = "int", min = 1, max = 16384, default = 192 }
in1_d0 = { type = "int", min = 1, max = 128, default = 4 }
in1_d1 = { type = "int", min = 1, max = 32767, default = 64 }
in1_d2 = { type = "int", min = 1, max = 16384, default = 192 }
out0_d0 = { type = "int", min = 1, max = 128, default = 4 }
out0_d1 = { type = "int", min = 1, max = 32767, default = 64 }
out0_d2 = { type = "int", min = 1, max = 16384, default = 192 }

[derived]
blocks = "ceil(out0_d2 / 128)"
tail = "out0_d2 - (blocks - 1) * 128"
tail_config = "tail + 65536 * ds(tail)"
plane = "in0_d1 * in0_d2"
plane_step = "out0_d0 * out0_d1"

[inputs.in0]
shape = ["in0_d1", "in0_d2", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "ceil(in1_d2 / 128) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "blocks * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
out0_d0 = "CR8"
out0_d1 = "CR9"
blocks = "CR10"
tail_config = "CR11"
plane = "CR12"
plane_step = "CR13"

[cases.default]
