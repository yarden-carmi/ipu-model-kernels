[kernel]
op = "twolevel16_tile"
formats = ["e2"]

[params.cin]
type = "int"
min = 16
multiple_of = 16
default = 96
[params.cout]
type = "int"
min = 1
default = 96
[params.h]
type = "int"
min = 1
default = 16
[params.w]
type = "int"
min = 1
max = 32
default = 16
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 16
multiple_of = 16
default = 96
[params.in0_d2]
type = "int"
min = 1
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 32
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 96
[params.out0_d2]
type = "int"
min = 2
default = 32
[params.out0_d3]
type = "int"
min = 2
max = 64
default = 32

[inputs.in0]
shape = ["total_input_rows // pack", 128]
range = [-1, 1]
[inputs.coeff]
shape = ["coeff_end", 128]
range = [-1, 1]
[scratch.duplicated]
shape = ["total_input_rows", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2 // 2", 128]

[derived]
pack = "max(1, (128 // in0_d3) * (1 - min(1, in0_d2 % (128 // in0_d3))))"
packed_width = "pack * in0_d3"
channel_rows = "2 * (cin + 1)"
batch_rows = "in0_d1 * in0_d2"
total_input_rows = "in0_d0 * batch_rows"
coeff_end = "out0_d1 * channel_rows"
valid = "ds(2 * out0_d3)"
src_lo = "50462976"
src_hi = "117835012"
dst_lo = "100925952"
dst_hi = "235670024"
bottom_lo = "dst_lo + out0_d3 * 16843009"
bottom_hi = "dst_hi + out0_d3 * 16843009"

[abi]
in0 = "CR2"
coeff = "CR3"
duplicated = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
valid = "CR8"
packed_width = "CR9"
in0_d3 = "CR10"
total_input_rows = "CR11"
in0_d2 = "CR12"
channel_rows = "CR13"
batch_rows = "CR14"
coeff_end = "CR15"
bottom_lo = "LR10"
bottom_hi = "LR11"
src_lo = "LR12"
src_hi = "LR13"
dst_lo = "LR14"
dst_hi = "LR15"

[cases.default]
