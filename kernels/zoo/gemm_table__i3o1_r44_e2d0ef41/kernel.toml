[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 32
[params.m]
type = "int"
min = 1
max = 65536
default = 16384
[params.n]
type = "int"
min = 1
max = 4096
default = 128
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 32
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 128
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 128

[derived]
spatial_rows = "in0_d0 * in0_d2"
blocks = "ceil(out0_d1 / 128)"
full = "ds(128)"
tail = "ds(out0_d1 - 128 * (blocks - 1))"
coeff_rows = "2 * blocks * (k + 1)"

[inputs.in0]
shape = ["in0_d1 * spatial_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * blocks", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
lut = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
spatial_rows = "CR8"
in0_d3 = "CR9"
blocks = "CR10"
k = "CR11"
full = "CR12"
tail = "CR13"

[cases.default]
