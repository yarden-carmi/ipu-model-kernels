chain = ["row_norm"]
chain_in = ["in0"]
chain_out = ["out0"]
notes = "Preserves the producer's stored layout and materializes the strided view in scratch. A common input scale of 2^5 prevents additional rounding during view gathering. Folded affine constants use three residual pieces; statistics and inverse-square-root refinement use residual pairs."

[layout.in0]
shape = [1, 256, 1024]
lanes = 2
rows = [0, 1]

[view.in0]
kind = "other"

[layout.out0]
shape = [1, 256, 1024]
lanes = 2
rows = [0, 1]

[format.in0]
format = "e3"
scale = 5
