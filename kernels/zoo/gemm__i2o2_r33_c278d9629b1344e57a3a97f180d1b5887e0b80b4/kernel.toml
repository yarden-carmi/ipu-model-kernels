[kernel]
op = "gemm"
formats = ["e2", "e3"]
[params.bias]
type = "bool"
default = true
[params.m]
type = "int"
min = 1
max = 65536
default = 2
[params.k]
type = "int"
min = 1
max = 16384
default = 129
[params.n]
type = "int"
min = 1
max = 16384
default = 135
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 2
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 129
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 2
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 135
[derived]
tiles = "ceil(out0_d2 / 128)"
rows = "out0_d0 * out0_d1"
chunks = "ceil(in0_d2 / 128)"
end = "(k - 1) % 128"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
full_end = "127"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * chunks", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * (k + 1)", 128]
[outputs.out0]
shape = ["rows * tiles", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
chunks = "CR10"
end = "CR11"
full_end = "CR13"
rows = "CR14"
[cases.default]
