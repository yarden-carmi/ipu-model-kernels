[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 16384
default = 384
[params.m]
type = "int"
min = 128
max = 65536
multiple_of = 128
default = 256
[params.n]
type = "int"
min = 1
max = 16384
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d2]
type = "int"
min = 128
max = 16384
multiple_of = 128
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 384
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d3]
type = "int"
choices = [1, 2, 4, 8, 16, 32, 64, 128]
default = 16

[derived]
chunks = "ceil(k / 128)"
last = "(k - 1) % 128"
spatial = "m // 128"
site_rows = "out0_d0 * spatial"
batch_stride = "k * spatial"
planes = "6"
coeff_stride = "planes * (chunks + 1)"
full = "ds(128)"
full_last = "127"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * (in0_d2 // 128)", 128]
[inputs.coeff]
shape = ["n * coeff_stride", 128]
[outputs.out0]
shape = ["out0_d1 * out0_d0 * ceil(out0_d2 / (128 // out0_d3))", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
chunks = "CR8"
last = "CR9"
spatial = "CR10"
batch_stride = "CR11"
out0_d0 = "CR12"
n = "CR13"
planes = "CR14"
coeff_stride = "CR15"
full_last = "LR14"

[cases.default]
