[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 3
[params.cout]
type = "int"
min = 1
max = 640
default = 16
[params.groups]
type = "int"
min = 1
max = 640
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 256
[params.w]
type = "int"
min = 1
max = 256
default = 256
[params.kh]
type = "int"
min = 1
max = 5
default = 3
[params.kw]
type = "int"
min = 1
max = 5
default = 3
[params.padding]
type = "int"
min = 1
max = 2
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 2
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 3
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 256
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 260
default = 128
[params.out0_d3]
type = "int"
min = 2
max = 260
multiple_of = 2
default = 128

[derived]
ic = "ceil(in0_d1 / 128)"
oc = "ceil(out0_d1 / 128)"
pack = "1 + min(1, 64 // out0_d1)"
dw = "1 - min(1, max(cin - groups, groups - cin, cout - groups, groups - cout))"
pc = "dw + (1 - dw) * ic"
weight_block = "2 + 2 * kh * kw * (dw + (1 - dw) * cin)"
ds128 = "ds(128)"
ds_out = "ds(min(128, out0_d1 * pack))"
ds_tail = "ds((pack - 1) * min(128, in0_d1) + (2 - pack) * (1 + (out0_d1 - 1) % 128))"
window_jump = "(in0_d3 + 2 * padding - kw) * pc"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "ic", 128]
range = [-2, 2]
[inputs.weights]
shape = ["oc * weight_block", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.pad]
shape = ["(in0_d2 + 2 * padding) * (in0_d3 + 2 * padding) * pc", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3 // pack", "oc", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
pad = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
ds_out = "CR11"
window_jump = "CR12"
out0_d2 = "CR13"
weight_block = "CR14"
ds_tail = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
