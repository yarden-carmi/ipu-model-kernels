[kernel]
op = "binary_add"
formats = ["e3"]
[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 262144
[params.in0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in0_d2]
type = "int"
min = 128
max = 16384
multiple_of = 128
default = 1024
[params.in1_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in1_d2]
type = "int"
min = 128
max = 16384
multiple_of = 128
default = 1024
[params.out0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.out0_d2]
type = "int"
min = 128
max = 16384
multiple_of = 128
default = 1024
[derived]
step_row = "in0_d1 // 128"
step_lane = "in0_d1 % 128"
width_rows = "in0_d2 // 128"
batch_rows = "in0_d1 * width_rows"
limit = "128"
[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "in1_d2"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2"]
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
step_row = "CR8"
step_lane = "CR9"
width_rows = "CR10"
in0_d1 = "CR11"
in0_d0 = "CR12"
batch_rows = "CR13"
limit = "CR14"
[cases.default]
[golden]
tolerance = { e3 = "EXACT" }
