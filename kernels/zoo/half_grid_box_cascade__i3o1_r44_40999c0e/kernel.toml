[kernel]
op = "half_grid_box_cascade"
formats = ["e2"]

[params.channels]
type = "int"
default = 64
[params.oh]
type = "int"
default = 64
[params.ow]
type = "int"
default = 64
[params.in0_d0]
type = "int"
default = 1
[params.in0_d1]
type = "int"
default = 64
[params.in0_d2]
type = "int"
default = 32
[params.in0_d3]
type = "int"
default = 32
[params.out0_d0]
type = "int"
default = 1
[params.out0_d1]
type = "int"
default = 64
[params.out0_d2]
type = "int"
default = 64
[params.out0_d3]
type = "int"
default = 64

[inputs.in0]
shape = ["in0_d0 * in0_d1 * (in0_d2 // 4)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3", 128]

[derived]
valid = "ds(out0_d1)"
one = "ds(1)"
packed_height = "in0_d2 // 4"
last_channel = "channels - 1"
w9 = "19 * 65536 + 126 * 256 + 2"
w3 = "19 * 65536 + 124 * 256 + 8"
w1 = "19 * 65536 + 123 * 256"
f9 = "126 * 8388608 + 1048576"
f3 = "124 * 8388608 + 4194304"
f1 = "123 * 8388608"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
valid = "CR6"
one = "CR9"
in0_d3 = "CR7"
in0_d2 = "CR8"
last_channel = "LR15"
w9 = "CR13"
w3 = "CR14"
w1 = "CR15"
f9 = "CR11"
f3 = "CR12"
f1 = "CR10"

[cases.default]
