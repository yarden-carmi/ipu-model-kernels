[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
numel = { type = "int", min = 1, default = 262144 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 64 }
in0_d2 = { type = "int", min = 1, default = 64 }
in0_d3 = { type = "int", min = 1, max = 64, default = 64 }
in1_d0 = { type = "int", min = 1, default = 1 }
in1_d1 = { type = "int", min = 1, default = 64 }
in1_d2 = { type = "int", min = 1, default = 64 }
in1_d3 = { type = "int", min = 1, max = 64, default = 64 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 64 }
out0_d2 = { type = "int", min = 1, default = 64 }
out0_d3 = { type = "int", min = 1, max = 64, default = 64 }

[derived]
rows = "out0_d0 * out0_d1 * ceil(out0_d2 / 2)"
last = "rows - 1"
active = "ds(out0_d3 * 2)"

[inputs.in0]
shape = ["in0_d1", "in0_d0", "ceil(in0_d2 / 2)", 128]
[inputs.in1]
shape = ["in1_d1", "in1_d0", "ceil(in1_d2 / 2)", 128]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
rows = "CR8"
active = "CR9"
last = "CR10"

[cases.default]
