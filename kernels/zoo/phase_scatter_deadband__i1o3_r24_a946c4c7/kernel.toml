[kernel]
op = "phase_scatter_deadband"
formats = ["e2"]

[params]
cout = {type="int", min=1, default=96}
h = {type="int", min=1, default=16}
w = {type="int", min=1, default=16}
kh = {type="int", min=1, default=2}
kw = {type="int", min=1, default=2}
in0_d0 = {type="int", min=1, default=256}
in0_d1 = {type="int", min=1, default=384}
out0_d0 = {type="int", min=1, default=1}
out0_d1 = {type="int", min=1, default=96}
out0_d2 = {type="int", min=1, default=32}
out0_d3 = {type="int", min=1, default=32}

[derived]
inrows = "in0_d0 * ceil(in0_d1 / 128)"
outrows = "out0_d0 * out0_d2 * out0_d1 * ceil(out0_d3 / 128)"
chunks = "ceil(in0_d1 / 128)"
active = "ds(out0_d3)"
pair = "16777216"
groupsize = "128 / (kh * kw)"
ystep = "w * ceil(in0_d1 / 128)"
totaly = "out0_d0 * out0_d2"

[inputs.in0]
shape = ["inrows", 128]
[outputs.out0]
shape = ["outrows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
chunks = "CR6"
active = "CR7"
pair = "CR8"
groupsize = "CR9"
ystep = "CR10"
totaly = "CR11"
cout = "CR12"
w = "CR13"
kh = "CR14"

[cases.default]
