[kernel]
op = "gemm"
formats = ["e1", "e2", "e3"]
[params.bias]
type = "bool"
default = true
[params.m]
type = "int"
min = 1
max = 16384
default = 64
[params.k]
type = "int"
min = 1
max = 16384
default = 480
[params.n]
type = "int"
min = 1
max = 16384
default = 240
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 480
[params.out0_d0]
type = "int"
min = 1
max = 16384
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 16

[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 240

[derived]
chunks = "ceil(in0_d2 / 128)"
tiles = "ceil(out0_d2 / 128)"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
rows = "out0_d0 * out0_d1"
tail_end = "(k - 1) % 128"
full_end = "127"
width = "128"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * chunks", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * (k + 1) * 3", 128]
range = [-1, 1]
[outputs.out0]
shape = ["rows * tiles", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
rows = "CR10"
chunks = "CR11"
tail_end = "CR12"
width = "CR13"
full_end = "CR14"
[cases.default]
