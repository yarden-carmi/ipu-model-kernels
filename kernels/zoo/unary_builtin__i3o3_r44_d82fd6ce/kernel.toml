[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
default = 16384

[params.in0_d2]
type = "int"
default = 16

[params.in0_d3]
type = "int"
default = 16
max = 128

[params.in0_d0]
type = "int"
default = 1

[params.in0_d1]
type = "int"
default = 64

[derived]
capacity = "max(1, 128 // in0_d3)"
pack = "1 + (capacity - 1) * (1 - min(1, in0_d2 % capacity))"
in_rows = "numel // (pack * in0_d3)"
out_rows = "numel // in0_d3"
pack_last = "pack - 1"
group_last = "in0_d2 // pack - 1"
batch_last = "in0_d0 - 1"
channel_last = "in0_d1 - 1"
batch_stride = "in0_d2 * in0_d1"
active = "ds(min(128, in0_d3))"

[inputs.in0]
shape = ["in_rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
active = "CR6"
in0_d1 = "CR7"
in0_d3 = "CR8"
pack_last = "CR9"
group_last = "CR10"
batch_last = "CR11"
batch_stride = "CR12"
channel_last = "CR13"

[cases.default]
