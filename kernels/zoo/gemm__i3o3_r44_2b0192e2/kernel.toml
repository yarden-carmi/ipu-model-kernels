[kernel]
op = "gemm"
formats = ["e1", "e2"]
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 120
[params.m]
type = "int"
min = 1
max = 65536
default = 196
[params.n]
type = "int"
min = 1
max = 65536
default = 48
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 120
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 14
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 48
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 14
[derived]
tiles = "ceil(in0_d2 / min(in0_d2, 128 // in0_d3))"
groups = "ceil(k / 16)"
active = "ds(min(out0_d2, 128 // out0_d3) * out0_d3)"
full = "ds(128)"
tail = "ds(((out0_d2 - 1) % min(out0_d2, 128 // out0_d3) + 1) * out0_d3)"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * tiles", 128]
[inputs.coeff]
shape = ["n * (2 + 2 * groups)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * tiles", 128]
[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
active = "CR8"
full = "CR9"
tail = "CR10"
n = "CR11"
[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}
[cases.default]
