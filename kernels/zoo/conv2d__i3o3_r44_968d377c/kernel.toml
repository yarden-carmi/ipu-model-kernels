[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 1024
default = 384
[params.cout]
type = "int"
min = 1
max = 1024
default = 384
[params.groups]
type = "int"
min = 1
max = 1
default = 1
[params.h]
type = "int"
min = 8
max = 512
multiple_of = 8
default = 16
[params.w]
type = "int"
min = 16
max = 128
multiple_of = 16
default = 16
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1024
default = 384
[params.in0_d2]
type = "int"
min = 8
max = 512
multiple_of = 8
default = 16
[params.in0_d3]
type = "int"
min = 16
max = 128
multiple_of = 16
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 1024
default = 384
[params.out0_d2]
type = "int"
min = 8
max = 512
multiple_of = 8
default = 16
[params.out0_d3]
type = "int"
choices = [16, 32, 64, 128]
default = 16

[derived]
pack = "min(2, 128 // out0_d3)"
tiles = "out0_d2 // pack"
weight_rows = "out0_d1 * (1 + ceil(9 * in0_d1 / 128))"
input_rows = "in0_d2 * in0_d1"
full = "ds(128)"
width = "ds(pack * out0_d3)"
y_end = "out0_d2"
panels = "9 * in0_d1 // 128"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[inputs.masks]
shape = ["1 + 3 * pack", 128]
range = [0, 1]
[scratch.patches]
shape = ["9 * in0_d1", 128]
[outputs.out0]
shape = ["out0_d1 * tiles", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
masks = "CR5"
patches = "CR6"
qf_in0 = "CR8"
qf_out0 = "CR9"
full = "CR10"
width = "CR11"
in0_d1 = "CR12"
in0_d2 = "CR13"
weight_rows = "CR14"
y_end = "CR15"
tiles = "LR15"

[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}

[cases.default]
