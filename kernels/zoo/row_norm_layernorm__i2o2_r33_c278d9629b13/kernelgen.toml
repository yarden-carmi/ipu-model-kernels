chain = ["row_norm"]
chain_in = ["in0"]
chain_out = ["out0"]

[layout.in0]
lanes = 2
rows = [0, 1]
[prefer.in0]
lanes = 1
rows = [0, 2]
[view.in0]
kind = "whole"
[layout.out0]
lanes = 2
rows = [0, 1]

# These are residual components, not single-byte overrides of the model parameters.
[format.gamma]
format = "e1"
[format.beta]
format = "e1"
[format.crow]
format = "e1"
[format.epsilon]
format = "e1"
