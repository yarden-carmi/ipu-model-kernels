[kernel]
op = "gemm_binary_add"
formats = ["e1", "e2", "e3"]

[params.s0_bias]
type = "bool"
default = true
[params.s0_m]
type = "int"
min = 1
max = 65536
default = 256
[params.s0_k]
type = "int"
min = 1
max = 16384
default = 1536
[params.s0_n]
type = "int"
min = 1
max = 16384
default = 384
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 1
max = 1073741824
default = 98304
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 1536
[params.in1_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 384

[derived]
rows = "out0_d0 * out0_d1"
chunks = "ceil(in0_d2 / 128)"
full = "ds(128)"
scalar = "ds(1)"
packed = "min(1, max(0, out0_d2 - 144))"
group = "1 + packed * (out0_d1 - 1)"
tail = "ds((out0_d2 * group - 1) % 128 + 1)"
phase = "128 / (1 + (1 - min(1, s0_n % 2)) + 2 * (1 - min(1, s0_n % 4)) + 4 * (1 - min(1, s0_n % 8)) + 8 * (1 - min(1, s0_n % 16)) + 16 * (1 - min(1, s0_n % 32)) + 32 * (1 - min(1, s0_n % 64)) + 64 * (1 - min(1, s0_n % 128)))"
period = "1 + packed * (min(phase, out0_d1) - 1)"
weight_end = "(period + ceil(period * s0_n / 128) - 1) * (s0_k + 1)"
weight_last = "weight_end - 1"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * chunks", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * ceil(in1_d1 * in1_d2 / 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["weight_end", 128]
[outputs.out0]
shape = ["rows / group * ceil(out0_d2 * group / 128)", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
full = "CR9"
scalar = "CR10"
chunks = "CR11"
s0_n = "CR12"
rows = "CR13"
weight_last = "CR14"
tail = "CR15"

[cases.default]
