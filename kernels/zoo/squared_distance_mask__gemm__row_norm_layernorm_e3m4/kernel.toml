[kernel]
op = "squared_distance_mask__gemm__row_norm_layernorm_e3m4"
formats = ["e3"]
[params]
s0_tokens = {type="int",min=128,max=256,multiple_of=128,default=128}
s0_vocab = {type="int",min=1,max=30522,default=8}
s1_m = {type="int",min=128,max=256,multiple_of=128,default=128}
s1_k = {type="int",min=1,max=30522,default=8}
s1_n = {type="int",min=128,max=384,multiple_of=128,default=384}
s1_bias = {type="bool",default=false}
s2_channels = {type="int",min=128,max=384,multiple_of=128,default=384}
s2_rows = {type="int",min=128,max=256,multiple_of=128,default=128}
s2_kind = {type="str",choices=["layernorm"],default="layernorm"}
s2_eps = {type="float",min=0.0,max=1.0,default=1e-12}
half = {type="float",default=0.5}
[inputs]
in0 = {shape=[1,"s0_tokens"],range=[0,7]}
w = {shape=["s1_k","s1_n"],range=[-2,2]}
add = {shape=["s1_m","s1_n"],range=[-1,1]}
gamma = {shape=["s2_channels"],range=[-2,2]}
beta = {shape=["s2_channels"],range=[-2,2]}
[scratch]
ones = {shape=[128],fill=1}
sel = {shape=["s0_tokens // 128","active_vocab",2,128]}
x = {shape=[2,"s1_m","s1_n"]}
tmp = {shape=[32,128]}
recip = {shape=[128],fill="1 / s2_channels"}
channels = {shape=[128],fill="s2_channels"}
epsilon = {shape=[128],fill="s2_eps"}
[outputs]
out0 = {shape=[1,"s2_rows","s2_channels"]}
[derived]
active_vocab = "min(s0_vocab, 8)"
qf = "case_qf + ds(128) * 65536"
[abi]
in0 = "CR2"
w = "CR3"
channels = "CR4"
add = "CR5"
gamma = "CR6"
beta = "CR7"
ones = "CR8"
sel = "CR9"
x = "CR10"
tmp = "CR11"
recip = "CR12"
out0 = "CR13"
qf = "CR14"
half = "CR15"
active_vocab = "LR12"
s2_rows = "LR10"
epsilon = "LR14"
[golden]
tolerance = {e3="NX8_STEP"}
[cases.default]
[cases.one]
s0_vocab = 1
s1_k = 1
[cases.c128]
s1_n = 128
s2_channels = 128
s0_vocab = 257
s1_k = 257
[cases.c256]
s1_n = 256
s2_channels = 256
s0_tokens = 256
s1_m = 256
s2_rows = 256
