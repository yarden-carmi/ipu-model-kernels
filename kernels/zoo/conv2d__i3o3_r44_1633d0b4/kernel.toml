[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params]
bias = {type = "bool", default = false}
groups = {type = "int", choices = [1], default = 1}
cin = {type = "int", min = 1, max = 1024, default = 384}
cout = {type = "int", min = 1, max = 1024, default = 64}
h = {type = "int", min = 1, max = 512, default = 8}
w = {type = "int", min = 1, max = 128, default = 8}
kh = {type = "int", choices = [3], default = 3}
kw = {type = "int", choices = [3], default = 3}
padding = {type = "int", choices = [1], default = 1}
stride = {type = "int", choices = [1, 2], default = 1}
in0_d0 = {type = "int", choices = [1], default = 1}
in0_d1 = {type = "int", min = 1, max = 1024, default = 384}
in0_d2 = {type = "int", min = 1, max = 512, default = 8}
in0_d3 = {type = "int", min = 1, max = 128, default = 8}
out0_d0 = {type = "int", choices = [1], default = 1}
out0_d1 = {type = "int", min = 1, max = 1024, default = 64}
out0_d2 = {type = "int", min = 1, max = 512, default = 8}
out0_d3 = {type = "int", min = 1, max = 128, default = 8}

[derived]
candidate = "min(out0_d2, 128 // out0_d3)"
pack = "1"
weight_rows = "cout * (1 + ceil(9 * cin / 128))"
input_rows = "in0_d2 * in0_d1"
full = "ds(128)"
packed = "ds(pack * out0_d3)"
width = "ds(out0_d3)"
tile_end = "out0_d2 * stride"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[inputs.masks]
shape = ["1 + 3 * pack", 128]
range = [0, 1]
[scratch.patches]
shape = ["9 * cin + 1", 128]
[scratch.parity]
shape = ["(stride - 1) * 2 * input_rows + 1", 128]
[outputs.out0]
shape = ["out0_d2 * out0_d1", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
masks = "CR5"
patches = "CR6"
parity = "CR7"
qf_in0 = "CR8"
qf_out0 = "CR9"
full = "CR10"
packed = "CR11"
cin = "CR12"
in0_d2 = "CR13"
weight_rows = "CR14"
input_rows = "LR14"
width = "CR15"
cout = "LR15"

[cases.default]
