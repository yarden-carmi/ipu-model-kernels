[kernel]
op = "binary_add"
formats = ["e2", "e3", "e4"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 16777216
default = 49152
[params.in0_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 192
[params.in1_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 192
[params.out0_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 192

[derived]
width = "ceil(in0_d2 / 128)"
blocks = "ceil(out0_d1 / 128)"
tail_count = "out0_d1 - (blocks - 1) * 128"
tail = "ds(tail_count) + 65536 * tail_count"
width_and_lanes = "width + 65536 * 128"
plane = "out0_d0 * out0_d1"
plane_rows = "(plane // in0_d2) * width"
plane_cols = "plane % in0_d2"
batch_jump = "(out0_d2 - 1) * blocks"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "width * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "ceil(in1_d1 / 128) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "blocks * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
width_and_lanes = "CR8"
in0_d2 = "CR9"
tail = "CR10"
blocks = "CR11"
out0_d0 = "CR12"
plane_cols = "CR13"
batch_jump = "CR14"
plane_rows = "LR1"
out0_d2 = "LR14"

[cases.default]
