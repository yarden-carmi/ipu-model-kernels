[kernel]
op = "binary_add"
formats = ["e2", "e3"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 49152

[params.in0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 192
[params.in1_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 192
[params.out0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 192
[derived]
active = "ds(out0_d0)"
slab = "in0_d1 * in0_d2"
