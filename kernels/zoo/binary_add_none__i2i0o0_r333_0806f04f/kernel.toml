[inputs.in1]
shape = ["in1_d1", "in1_d2", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d1", "out0_d2", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
