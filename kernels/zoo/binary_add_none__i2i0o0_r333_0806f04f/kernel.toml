[kernel]
op = "binary_add"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 147456 }
in0_d0 = { type = "int", min = 1, max = 128, default = 4 }
in0_d1 = { type = "int", min = 8, max = 16384, multiple_of = 8, default = 256 }
in0_d2 = { type = "int", min = 16, max = 16384, multiple_of = 16, default = 144 }
in1_d0 = { type = "int", min = 1, max = 128, default = 4 }
in1_d1 = { type = "int", min = 1, max = 16384, default = 256 }
in1_d2 = { type = "int", min = 1, max = 16384, default = 144 }
out0_d0 = { type = "int", min = 1, max = 128, default = 4 }
out0_d1 = { type = "int", min = 1, max = 16384, default = 256 }
out0_d2 = { type = "int", min = 1, max = 16384, default = 144 }

[derived]
stride = "out0_d0 * out0_d1"
step_row = "stride // 128"
step_lane = "stride % 128"
last_lane = "128 - out0_d0"
ds_out = "ds(out0_d0)"

[inputs.in0]
shape = ["in0_d0", "in0_d1 * in0_d2 // 128", 128]
range = [-2, 2]

[inputs.in1]
shape = ["in1_d1", "in1_d2", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out0_d1", "out0_d2", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
step_row = "CR8"
step_lane = "CR9"
out0_d0 = "CR10"
out0_d1 = "CR11"
out0_d2 = "CR12"
ds_out = "CR13"
last_lane = "CR14"

[cases.default]
