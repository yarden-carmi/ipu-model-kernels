[kernel]
op = "row_norm"
formats = ["e2"]
[params.kind]
type = "str"
choices = ["layernorm"]
[params.channels]
type = "int"
min = 128
max = 1152
multiple_of = 128
[params.rows]
type = "int"
min = 1
max = 4096
[params.eps]
type = "float"
min = 0.0
max = 1.0
[derived]
half = "1277440"
K = "channels // 128"
M = "rows * channels // 128"
[inputs.in0]
shape = ["M", 128]
range = [-2.0, 2.0]
[inputs.gamma]
shape = ["K * 3", 128]
[inputs.beta]
shape = ["K * 3", 128]
[inputs.crow]
shape = [2, 128]
[inputs.epsilon]
shape = [128]
[scratch.tmp]
shape = [28, 128]
[outputs.out0]
shape = ["M", 128]
[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
crow = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
K = "CR10"
M = "CR11"
epsilon = "CR12"
half = "CR13"
[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
kind = "layernorm"
channels = 768
rows = 197
eps = 1e-12
