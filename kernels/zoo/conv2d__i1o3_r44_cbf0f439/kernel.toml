[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = false
[params.groups]
type = "int"
choices = [1]
default = 1
[params.cin]
type = "int"
min = 1
max = 1024
default = 48
[params.cout]
type = "int"
min = 1
max = 2048
default = 64
[params.h]
type = "int"
min = 1
max = 1024
default = 64
[params.w]
type = "int"
min = 1
max = 256
default = 64
[params.kh]
type = "int"
min = 1
max = 32
default = 3
[params.kw]
type = "int"
min = 1
max = 32
default = 3
[params.padding]
type = "int"
min = 0
max = 16
default = 1
[params.stride]
type = "int"
min = 1
max = 32
default = 1

[derived]
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
candidate = "max(1, 128 // wo)"
pack = "1 + (candidate - 1) * (1 - min(1, ho % candidate))"
segments = "ceil(wo / 128)"
chunks = "ceil(cin / 128)"
span = "1 + kh * kw * chunks"
weight_end = "cout * span"
input_step = "stride * chunks"
packed = "ds(min(128, wo * pack))"
tail = "ds((wo - 1) % 128 + 1)"
full = "ds(128)"
ystop = "ho * stride - padding"
xstop = "wo * stride - padding"
ytap_step = "w * chunks"
yout_step = "stride * w * chunks"

[inputs.in0]
shape = ["h", "w", "chunks", 128]
range = [-2, 2]
[inputs.weights]
shape = ["cout", "span", 128]
range = [-1, 1]
[outputs.out0]
shape = ["cout", "ho // pack", "segments", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
packed = "CR7"
tail = "CR8"
full = "CR9"
h = "CR10"
w = "CR11"
ystop = "CR12"
xstop = "CR13"
ytap_step = "CR14"
yout_step = "CR15"
weight_end = "LR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
