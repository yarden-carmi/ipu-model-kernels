[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 128
[params.cout]
type = "int"
min = 1
max = 512
default = 128
[params.groups]
type = "int"
min = 1
max = 512
default = 128
[params.h]
type = "int"
min = 3
max = 256
default = 8
[params.w]
type = "int"
min = 3
max = 256
default = 8
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 1
[params.in1_d0]
type = "int"
choices = [1]
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 512
default = 128
[params.in1_d2]
type = "int"
min = 3
max = 256
default = 8
[params.in1_d3]
type = "int"
min = 3
max = 256
default = 8
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 512
default = 128
[params.out0_d2]
type = "int"
min = 2
max = 256
default = 8
[params.out0_d3]
type = "int"
min = 2
max = 256
default = 8

[derived]
ic = "ceil(in1_d1 / 128)"
oc = "ceil(out0_d1 / 128)"
ds128 = "ds(128)"
orows = "3 + 16 * cin"
wrows = "(1 // groups) * (oc * orows) + (1 - 1 // groups) * (20 * oc + 1)"
padrows = "(in1_d2 + 2) * (in1_d3 + 2) * ic"
wic = "in1_d3 * ic"

[inputs.in0]
shape = ["in1_d0", "in1_d2", "in1_d3", "ic", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "in1_d3", "ic", 128]
range = [-2, 2]
[inputs.weights]
shape = ["wrows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.pad]
shape = ["padrows", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", "oc", 128]

[abi]
in1 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
pad = "CR6"
qf_in1 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
in0 = "CR11"
oc = "CR12"
orows = "CR13"
padrows = "CR14"
wic = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
[cases.dense]
groups = 1
cin = 16
cout = 16
h = 8
w = 8
stride = 1
in1_d1 = 16
in1_d2 = 8
in1_d3 = 8
out0_d1 = 16
out0_d2 = 8
out0_d3 = 8
formats = ["e2"]
