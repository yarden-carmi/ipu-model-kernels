[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["hardswish"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 40
[params.m]
type = "int"
min = 1
max = 65535
default = 196
[params.n]
type = "int"
min = 1
max = 4096
default = 240
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 40
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 14
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 240
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 14

[derived]
chunks = "ceil(in0_d1 / 128)"
pack = "128 // out0_d3"
blocks = "ceil(n / pack)"
stripes = "out0_d0 * out0_d2"
stripe_step = "out0_d3 * chunks"
full_ds = "ds(pack * out0_d3)"
tail_ds = "ds((1 + (n - 1) % pack) * out0_d3)"
# Groups are in reverse byte order so a short scatter uses trailing bytes.
dest_lo = "out0_d3 * (min(pack - 1, 7) + 256 * min(pack - 1, 6) + 65536 * min(pack - 1, 5) + 16777216 * min(pack - 1, 4))"
dest_hi = "out0_d3 * (min(pack - 1, 3) + 256 * min(pack - 1, 2) + 65536 * min(pack - 1, 1))"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * chunks", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["blocks * 2 * (k + 1)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["stripes * blocks", 128]
[scratch.panel]
shape = ["k", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
panel = "CR8"
k = "CR9"
blocks = "CR10"
full_ds = "CR11"
tail_ds = "CR12"
stripe_step = "CR13"
dest_lo = "CR14"
dest_hi = "CR15"
stripes = "LR13"

[cases.default]
