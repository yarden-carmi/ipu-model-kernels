[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.m]
type = "int"
min = 1
max = 65536
default = 64
[params.k]
type = "int"
min = 1
max = 4096
default = 160
[params.n]
type = "int"
min = 1
max = 4096
default = 640
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.in0_d0]
type = "int"
min = 1
max = 4
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 160
[params.in0_d2]
type = "int"
min = 1
max = 512
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 4
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 640
[params.out0_d2]
type = "int"
min = 1
max = 512
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 8

[derived]
pack = "128 // out0_d3"
blocks = "ceil(n / pack)"
stripes = "in0_d0 * in0_d2"
chunks = "ceil(k / 128)"
full = "ds(pack * out0_d3)"
tail = "ds(((n - 1) % pack + 1) * out0_d3)"
dot_full = "ds(128)"
dot_tail = "ds((k - 1) % 128 + 1)"

[inputs.in0]
shape = ["stripes", "in0_d3", "ceil(in0_d1 / 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["blocks * pack", "chunks", 2, 128]
range = [-1, 1]
[inputs.b]
shape = ["blocks", 2, 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d2", "blocks", 128]

[abi]
in0 = "CR2"
w = "CR3"
b = "CR4"
dot_full = "CR5"
lut = "CR6"
out0 = "CR7"
qf_in0 = "CR8"
qf_out0 = "CR9"
full = "CR10"
tail = "CR11"
stripes = "CR12"
pack = "CR13"
blocks = "CR14"
dot_tail = "CR15"

[cases.default]
