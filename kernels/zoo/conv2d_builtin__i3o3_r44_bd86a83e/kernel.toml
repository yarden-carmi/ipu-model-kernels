[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params]
act_out0 = {type = "str", choices = ["relu"], default = "relu"}
bias = {type = "bool", default = true}
groups = {type = "int", choices = [1], default = 1}
kh = {type = "int", choices = [3], default = 3}
kw = {type = "int", choices = [3], default = 3}
padding = {type = "int", choices = [1], default = 1}
stride = {type = "int", choices = [1], default = 1}
cin = {type = "int", min = 1, default = 64}
cout = {type = "int", min = 1, default = 64}
h = {type = "int", min = 1, default = 16}
w = {type = "int", min = 1, default = 16}
in0_d0 = {type = "int", min = 1, default = 1}
in0_d1 = {type = "int", min = 1, default = 64}
in0_d2 = {type = "int", min = 1, default = 16}
in0_d3 = {type = "int", min = 1, default = 16}
out0_d0 = {type = "int", min = 1, default = 1}
out0_d1 = {type = "int", min = 1, default = 64}
out0_d2 = {type = "int", min = 1, default = 16}
out0_d3 = {type = "int", min = 1, default = 16}

[derived]
chunks = "ceil(in0_d3 / 128)"
pitch = "in0_d2 * chunks"
batch_pitch = "pitch * in0_d1"
input_rows = "in0_d0 * batch_pitch"
weight_rows = "1 + 2 * in0_d1 * out0_d1"
full = "ds(128)"
tail = "ds((out0_d3 - 1) % 128 + 1)"
last_y = "in0_d2 - 1"
last_input_row = "input_rows - 1"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d1", "out0_d0", "out0_d2", "chunks", 128]
[scratch.clean]
shape = ["input_rows", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
last_y = "CR9"
pitch = "CR10"
batch_pitch = "CR11"
weight_rows = "CR12"
last_input_row = "CR13"
chunks = "CR14"
clean = "CR15"
qf_weights = "LR15"

[cases.default]
