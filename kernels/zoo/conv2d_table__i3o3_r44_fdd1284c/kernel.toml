[kernel]
op = "conv2d_table"
formats = ["e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 96
[params.cout]
type = "int"
min = 1
max = 640
default = 96
[params.groups]
type = "int"
min = 1
max = 640
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 32
[params.w]
type = "int"
choices = [8, 16, 32, 64, 128]
default = 32
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 96
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 32
[params.in0_d3]
type = "int"
choices = [8, 16, 32, 64, 128]
default = 32
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 96
[params.out0_d2]
type = "int"
min = 1
max = 256
default = 32
[params.out0_d3]
type = "int"
choices = [8, 16, 32, 64, 128]
default = 32

[derived]
ip = "128 // in0_d3"
op = "128 // out0_d3"
packs = "ceil(in0_d2 / ip)"
outpacks = "ceil(out0_d2 / op)"
plane = "9 * packs"
gcin = "cin // groups"
groupstep = "plane * gcin"
ds128 = "ds(128)"
tail = "ds((1 + (out0_d2 - 1) % op) * out0_d3)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "packs", 128]
range = [-2, 2]
[inputs.weights]
shape = ["3 + cout * (2 + 2 * gcin)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.guard]
shape = ["1 + cin * (packs + 1)", 128]
[scratch.patch]
shape = ["cin * plane", 128]
[outputs.out0]
shape = ["out0_d1", "out0_d0", "outpacks", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
guard = "CR6"
patch = "CR7"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
tail = "CR12"
plane = "CR13"
gcin = "CR14"
groupstep = "CR15"

[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
