[kernel]
op = "multiplicity_pool_resize"
formats = ["e2"]

[params.in0_d0]
type = "int"
default = 1
[params.in0_d1]
type = "int"
default = 64
[params.in0_d2]
type = "int"
default = 64
[params.in0_d3]
type = "int"
default = 64
[params.out0_d0]
type = "int"
default = 1
[params.out0_d1]
type = "int"
default = 64
[params.out0_d2]
type = "int"
default = 128
[params.out0_d3]
type = "int"
default = 128
[params.oh]
type = "int"
default = 128
[params.ow]
type = "int"
default = 128

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2 * in0_d3 // 128", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", "out0_d3"]
[scratch.routed]
shape = ["2 * in0_d0 * in0_d1 * in0_d2", 128]

[derived]
nx = "min(1, case_qf)"
center = "(1 - nx) * 0x3e900000 + nx * 0x017d10"
side = "(1 - nx) * 0x3dc00000 + nx * 0x017b40"
corner = "(1 - nx) * 0x3d000000 + nx * 0x017a00"
route_scale = "(1 - nx) * 0x40000000 + nx * 0x018000"
ds_full = "ds(128)"
packed_rows = "in0_d0 * in0_d1 * in0_d2 * in0_d3 // 128"
planes = "in0_d0 * in0_d1"
last_y = "in0_d2 - 1"
center_lo = "0x01010000"
center_hi = "0x03030202"
side_lo = "0x02000100"
side_hi = "0x04020301"
dst_lo = "0x03020100"
last_fix = "0x01000000"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
routed = "CR6"
center = "CR7"
side = "CR8"
corner = "CR9"
ds_full = "CR10"
center_lo = "CR11"
center_hi = "CR12"
side_lo = "CR13"
side_hi = "CR14"
route_scale = "CR15"
dst_lo = "LR10"
packed_rows = "LR12"
planes = "LR13"
last_y = "LR14"
last_fix = "LR15"

[cases.default]
