[kernel]
op = "binary_add_none"
formats = ["e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
numel = { type = "int", min = 1, max = 16777216, default = 49152 }
in0_d0 = { type = "int", min = 1, max = 4096, default = 4 }
in0_d1 = { type = "int", min = 1, max = 16384, default = 64 }
in0_d2 = { type = "int", min = 1, max = 4096, default = 192 }
in1_d0 = { type = "int", min = 1, max = 4096, default = 4 }
in1_d1 = { type = "int", min = 1, max = 16384, default = 64 }
in1_d2 = { type = "int", min = 1, max = 4096, default = 192 }
out0_d0 = { type = "int", min = 1, max = 4096, default = 4 }
out0_d1 = { type = "int", min = 1, max = 16384, default = 64 }
out0_d2 = { type = "int", min = 1, max = 4096, default = 192 }

[derived]
pack = "1 + (in0_d1 - 1) * min(1, max(0, in0_d2 - 144))"
packed = "pack * in0_d2"
aligned = "1 - min(1, packed % 128)"
span = "aligned * 128 + (1 - aligned) * packed"
width = "ceil(span / 128)"
step_rows = "(out0_d0 * out0_d1 // span) * width"
step_lane = "out0_d0 * out0_d1 % span"
tail = "ds((out0_d2 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0", "in0_d1 // pack", "ceil(packed / 128) * 128"]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "ceil(in1_d2 / 128) * 128"]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "ceil(out0_d2 / 128) * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
out0_d0 = "CR8"
out0_d1 = "CR9"
out0_d2 = "CR10"
step_rows = "CR11"
step_lane = "CR12"
span = "CR13"
width = "LR15"
tail = "CR14"

[cases.default]
