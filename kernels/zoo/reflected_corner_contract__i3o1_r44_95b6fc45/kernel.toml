[kernel]
op = "reflected_corner_contract"
formats = ["e2"]

[params]
oh = { type = "int", min = 2, max = 32, default = 16 }
ow = { type = "int", min = 2, max = 32, default = 16 }
in0_d0 = { type = "int", min = 1, max = 65536, default = 1 }
in0_d1 = { type = "int", min = 1, max = 128, default = 64 }
in0_d2 = { type = "int", min = 1, max = 16, default = 8 }
in0_d3 = { type = "int", min = 1, max = 8, default = 8 }
out0_d0 = { type = "int", min = 1, max = 65536, default = 1 }
out0_d1 = { type = "int", min = 1, max = 128, default = 64 }
out0_d2 = { type = "int", min = 2, max = 32, default = 16 }
out0_d3 = { type = "int", min = 2, max = 32, default = 16 }

[derived]
active = "ds(out0_d1)"
k9 = "0x137e02"
k3 = "0x137c08"
k1 = "0x137b00"
f9 = "0x3f100000"
f3 = "0x3e400000"
f1 = "0x3d800000"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2 / 16)", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", 128]

[scratch.route]
shape = [385, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
route = "CR6"
active = "CR7"
in0_d2 = "CR8"
in0_d3 = "CR9"
in0_d1 = "LR15"
in0_d0 = "LR13"
k9 = "CR10"
k3 = "CR11"
k1 = "CR12"
f9 = "CR13"
f3 = "CR14"
f1 = "CR15"

[cases.default]
