# reduce_rows_mean: y[r] = sum / mean / max of x[r, 0:n], one parameterised
# program for every (kind, rows, n).
#
#   sum    y[r] = sum_j x[r, j]
#   mean   y[r] = (sum_j x[r, j]) / n
#   max    y[r] = max_j x[r, j]
#
# (for j in 0 .. n-1, the n values of entity r as its rows hold them).
#
# x is the layout every activation on the chip uses: entity r holds its n
# values in ceil(n / 128) consecutive rows (row r * chunks + c holds values
# 128c .. 128c + 127, lanes past n zero), so the kernel reads what the previous
# kernel wrote. y holds one value per entity, in lane 0 of its own row -- the
# shape a horizontal reduction lands on: AGG writes one R_ACC lane and
# ACTIVATE.QUANTIZE stores a row whose DS names one active lane (whose scale
# therefore comes from that lane alone, and whose other lanes are written 0 for
# whatever kernel reads y next).
#
# Dataflow, one word per x row: MULT of the row resident in R_CYCLIC slot 0 by
# 1.0 (sum, max) or by the resident 1/n row (mean), AGG.SUM / AGG.MAX into
# R_ACC lane 0, and at the row's last chunk the store. The only way into R_ACC
# is a multiply result and a word has one LOAD, one MULT and one ACC slot, so
# the row's chunk and its reduction share one word with the next chunk's load
# riding in it: chunks words per row, nothing else (a 640 x 64 mean is 645
# cycles). `chunks` is known when the call is rendered, so the chunk loop is
# unrolled and only the row loop is dynamic: the whole call is one launch and
# `rows` is the only dimension the host tiles.
#
# The mean multiplies each element by the resident 1/n row and reduces the
# products, so the sum is never stored and never re-read: what is quantized is
# one 8-bit constant per product (2^-6 relative at worst), not the row's sum.
# The sum and the max multiply by the exact CR constant 1.0 and their
# accumulator is FP32.
#
# XMEM: x takes rows * ceil(n / 128) rows, y rows, and the two scratch rows
# (1/n and the lane mask) are the rest: 3072 * 4 + 3072 + 2 = 15362 of the
# 16384 addressable NX8 rows at the declared corners. There is no FP32 variant:
# FP32 addresses 4096 rows only, and dynamic is the chip's NX8 type.

[kernel]
op = "reduce_rows"
formats = ["dynamic"]

[params]
kind = { type = "str", choices = ["sum", "mean", "max"], default = "mean" }
rows = { type = "int", min = 1, max = 3072 }    # entities: the axis the host tiles
n    = { type = "int", min = 1, max = 512 }     # the reduction axis, 128 lanes per chunk

[derived]
qf   = "case_qf"                                  # CR14: the case's QF half
tail = "n - 128 * (ceil(n / 128) - 1)"             # the last chunk's active lanes
ds   = "halves(ds(128), ds(tail))"                 # CR15: full chunk / last chunk
ds1  = "halves(ds(1), 128)"                        # CR13: the store's one active lane
bound = "max((rows - 1) * ceil(n / 128) - 1, 0)"    # CR12: the row loop's bound (its branch reads the pre-INC row it multiplies, so the loop runs rows - 1 groups)

[inputs.x]
shape = ["rows", "n"]
range = [-1, 1]

[outputs.y]
shape = ["rows", 1]

[scratch.invn]
shape = [1, 128]
fill = "1 / n"                                     # the mean's resident scalar row

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"                        # LD.MASK: every lane active, whatever a previous kernel left

[abi]
x     = "CR2"
y     = "CR3"
invn  = "CR4"
maskr = "CR5"
bound = "CR12"
ds1   = "CR13"
qf    = "CR14"
ds    = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: only the store rounds -- the golden is quantized the same way, so what is
# left is the mean's 8-bit 1/n constant (2^-6 relative at worst, a factor common
# to the row that its own scale cannot cancel) and the FP32 accumulation order of
# a sum of up to 512 terms. Measured max |err| on every case: under one step of
# the output row's grid; two of margin.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 2, why = "the store's row quantization: measured 0 steps of the golden row's grid for sum and max over the whole domain and at most 1 for the mean, whose 1/n is one 8-bit element (a factor common to the row, at worst 2^-6 relative); 2 of margin" } }

[cases.default]                    # mobilevit_s cvnets_in1k's global pooling: x1 per forward
kind = "mean"
rows = 640
n = 64

[cases.mean_small]
kind = "mean"
rows = 17
n = 100

[cases.sum_small]
kind = "sum"
rows = 33
n = 64

[cases.max_small]
kind = "max"
rows = 33
n = 64

[cases.one]                        # the narrowest call: one row, one lane
kind = "mean"
rows = 1
n = 1

[cases.one_row_max]                # one row, a whole chunk
kind = "max"
rows = 1
n = 128

[cases.tile]                       # exactly one 128-lane chunk per row
kind = "sum"
rows = 8
n = 128

[cases.two_chunks]                 # two full chunks, no tail
kind = "mean"
rows = 6
n = 256

[cases.tail]                       # a short last chunk
kind = "mean"
rows = 8
n = 129

[cases.group_boundary]             # one full 128-row group plus a row
kind = "max"
rows = 129
n = 64

[cases.wide]                       # four chunks and a tail, the widest reduction
kind = "sum"
rows = 5
n = 511

[cases.mean_256]                   # the pooling width the surveyed models use, many rows
kind = "mean"
rows = 1024
n = 256
tier = "nightly"

[cases.sweep]                      # the structure of the calls, scaled down
kind = ["sum", "mean", "max"]
rows = [1, 2, 127, 128, 129, 300]
n = [1, 2, 63, 64, 127, 128, 129, 200, 256, 384, 512]
tier = "nightly"
