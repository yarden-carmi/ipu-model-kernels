[kernel]
op = "gemm__binary_add_none__row_norm_layernorm"
formats = ["e2"]
[params.s0_bias]
type = "bool"
default = true
[params.s0_k]
type = "int"
min = 1
max = 2048
default = 384
[params.s0_m]
type = "int"
min = 8
max = 1024
multiple_of = 8
default = 256
[params.s0_n]
type = "int"
min = 144
max = 256
multiple_of = 16
default = 192
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 1152
max = 262144
default = 49152
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"
[params.s2_channels]
type = "int"
min = 144
max = 256
multiple_of = 16
default = 192
[params.s2_eps]
type = "float"
min = 0.0
max = 1.0
default = 0.00001
[params.s2_kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.s2_rows]
type = "int"
min = 8
max = 1024
multiple_of = 8
default = 256
[params.in0_d0]
type = "int"
min = 1
max = 4
default = 4
[params.in0_d1]
type = "int"
min = 8
max = 1024
multiple_of = 8
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 2048
default = 384
[params.in1_d0]
type = "int"
min = 1
max = 4
default = 4
[params.in1_d1]
type = "int"
min = 8
max = 1024
multiple_of = 8
default = 64
[params.in1_d2]
type = "int"
min = 144
max = 256
multiple_of = 16
default = 192
[params.out0_d0]
type = "int"
min = 1
max = 4
default = 4
[params.out0_d1]
type = "int"
min = 8
max = 1024
multiple_of = 8
default = 64
[params.out0_d2]
type = "int"
min = 144
max = 256
multiple_of = 16
default = 192

[derived]
chunks = "ceil(in0_d2 / 128)"
tail = "ds(s2_channels - 128)"
mask_count = "16 + s2_channels // 16 - 2 * (8 - ceil((s2_channels % 32) / 32) - 2 * ceil((s2_channels % 64) / 64) - 4 * ceil((s2_channels % 128) / 128))"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * chunks", 128]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * in1_d2 / 128", 128]
[inputs.w]
shape = ["4 * (s0_k + 1)", 128]
[inputs.affine]
shape = [12, 128]
[inputs.crow]
shape = [6, 128]
[inputs.masks]
shape = ["mask_count", 128]
[scratch.tmp]
shape = ["40 + 10 * s2_rows", 128]
[outputs.out0]
shape = ["out0_d0 * ceil(out0_d1 * out0_d2 / 128)", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
affine = "CR5"
crow = "CR6"
masks = "CR7"
tmp = "CR8"
out0 = "CR9"
qf_in0 = "CR10"
qf_in1 = "CR11"
qf_out0 = "CR12"
tail = "CR13"

[cases.default]
