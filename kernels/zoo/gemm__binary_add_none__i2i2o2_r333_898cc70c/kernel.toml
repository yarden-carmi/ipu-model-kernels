[kernel]
op = "gemm_binary_add"
formats = ["e2"]

[params.s0_bias]
type = "bool"
default = true
[params.s0_m]
type = "int"
min = 16
max = 32768
multiple_of = 16
default = 64
[params.s0_k]
type = "int"
min = 1
max = 512
default = 480
[params.s0_n]
type = "int"
min = 8
max = 16384
multiple_of = 8
default = 240
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 128
max = 536870912
default = 15360
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"
[params.in0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in0_d1]
type = "int"
min = 16
max = 32768
multiple_of = 16
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 512
default = 480
[params.in1_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in1_d1]
type = "int"
min = 16
max = 32768
multiple_of = 16
default = 16
[params.in1_d2]
type = "int"
min = 8
max = 16384
multiple_of = 8
default = 240
[params.out0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.out0_d1]
type = "int"
min = 16
max = 32768
multiple_of = 16
default = 16
[params.out0_d2]
type = "int"
min = 8
max = 16384
multiple_of = 8
default = 240

[derived]
chunks = "ceil(in0_d2 / 128)"
bias_start = "s0_n * chunks"
bias_end = "bias_start + s0_n // 8"
full = "ds(128)"
one = "ds(1)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * chunks", 128]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * in1_d2 // 128", 128]
[inputs.w]
shape = ["bias_end", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2 // 128", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
full = "CR9"
one = "CR10"
s0_n = "CR11"
out0_d1 = "CR12"
out0_d0 = "CR13"
bias_start = "CR14"
bias_end = "CR15"

[cases.default]
