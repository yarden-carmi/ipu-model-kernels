[kernel]
op = "binary_mul_scalar"
formats = ["e2", "e3"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 49152
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.in0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 32768
default = 576
[params.out0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 4
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 48

[inputs.in0]
shape = ["in0_d1 * in0_d2", "ceil(in0_d0 / 128) * 128"]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", "ceil(out0_d3 / 128) * 128"]

[derived]
tail = "ds(out0_d3)"
# Integer Newton iteration for sqrt(D) in Q24, from the upper bound 16.
rad = "out0_d3 * 16777216 * 16777216"
r0 = "268435456"
r1 = "(r0 + rad // r0) // 2"
r2 = "(r1 + rad // r1) // 2"
r3 = "(r2 + rad // r2) // 2"
r4 = "(r3 + rad // r3) // 2"
r5 = "(r4 + rad // r4) // 2"
r6 = "(r5 + rad // r5) // 2"
r7 = "(r6 + rad // r6) // 2"
r8 = "(r7 + rad // r7) // 2"
shift = "min(1, out0_d3 - 1) + min(1, max(0, out0_d3 - 4)) + min(1, max(0, out0_d3 - 16)) + min(1, max(0, out0_d3 - 64))"
factor = "1 + min(1, out0_d3 - 1) + 2 * min(1, max(0, out0_d3 - 4)) + 4 * min(1, max(0, out0_d3 - 16)) + 8 * min(1, max(0, out0_d3 - 64))"
scale_fp32 = "8388608 * (126 - shift) + (8388608 * 16777216 * factor + r8 // 2) // r8"
scale_nx8 = "65536 + 256 * (127 - shift) + min(127, (128 * 16777216 * factor + r8 // 2) // r8 - 128)"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
tail = "CR6"
scale_fp32 = "CR7"
scale_nx8 = "CR8"
in0_d2 = "CR9"
out0_d0 = "CR10"
out0_d1 = "CR11"
out0_d2 = "CR12"
out0_d3 = "CR13"

[cases.default]
