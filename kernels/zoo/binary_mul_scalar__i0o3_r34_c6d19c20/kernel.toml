[kernel]
op = "binary_mul_scalar"
formats = ["e2", "e3"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 15360
[params.in0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 720
[params.out0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 4
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 60

[inputs.in0]
shape = ["in0_d1 * in0_d2", 128]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", 128]
[scratch.gathered]
shape = [1, 128]
[scratch.scalar]
shape = [1, 128]

[derived]
tail = "ds(out0_d3)"
fp_base = "0x4b010080"
fp_top = "fp_base + out0_d3"
head_width = "0x18600 + out0_d3 + 128 * (1 - out0_d3 // 128) - 128 * (out0_d3 // 128)"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
gathered = "CR6"
tail = "CR7"
fp_top = "CR8"
fp_base = "CR9"
head_width = "CR10"
scalar = "LR13"
out0_d0 = "CR11"
out0_d1 = "CR12"
out0_d2 = "CR13"
out0_d3 = "CR14"
in0_d2 = "CR15"

[cases.default]
