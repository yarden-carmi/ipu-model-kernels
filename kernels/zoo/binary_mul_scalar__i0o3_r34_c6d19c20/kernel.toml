[kernel]
op = "binary_mul_scalar"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["scalar"], default = "scalar" }
const = { type = "int", min = 1, max = 1, default = 1 }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["mul"], default = "mul" }
numel = { type = "int", min = 1, default = 15360 }
in0_d0 = { type = "int", min = 1, max = 128, default = 4 }
in0_d1 = { type = "int", min = 1, default = 16 }
in0_d2 = { type = "int", min = 1, default = 720 }
out0_d0 = { type = "int", min = 1, max = 128, default = 4 }
out0_d1 = { type = "int", min = 1, default = 4 }
out0_d2 = { type = "int", min = 1, default = 16 }
out0_d3 = { type = "int", min = 1, max = 128, default = 60 }

[derived]
input_rows = "in0_d1 * in0_d2"
output_rows = "out0_d0 * out0_d1 * out0_d2"
token_skip = "in0_d2 - out0_d3"
lane_step = "16777216"
ds_pair = "ds(out0_d3) + 65536 * ds(128)"
fp_base = "0x4b010080"
fp_top = "fp_base + out0_d3"
head_width = "0x18600 + out0_d3 + 128 * (1 - out0_d3 // 128) - 128 * (out0_d3 // 128)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]

[outputs.out0]
shape = ["output_rows", 128]

[scratch.scalar]
shape = [1, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
ds_pair = "CR6"
scalar = "CR7"
fp_top = "CR8"
fp_base = "CR9"
head_width = "CR10"
out0_d3 = "CR11"
token_skip = "CR12"
out0_d1 = "CR13"
out0_d2 = "CR14"
lane_step = "CR15"
out0_d0 = "LR15"

[cases.default]
