[kernel]
op = "conv2d"
formats = ["e2", "e3"]
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 3
[params.cout]
type = "int"
min = 128
max = 1152
multiple_of = 128
default = 128
[params.groups]
type = "int"
min = 1
max = 1
default = 1
[params.h]
type = "int"
min = 1
max = 1024
default = 4
[params.w]
type = "int"
min = 1
max = 1024
default = 4
[params.kh]
type = "int"
min = 1
max = 32
default = 2
[params.kw]
type = "int"
min = 1
max = 32
default = 2
[params.padding]
type = "int"
min = 0
max = 0
default = 0
[params.stride]
type = "int"
min = 1
max = 32
default = 2
[derived]
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
blocks = "cout // 128"
full = "ds(128)"
xrows = "(w + 127) // 128"
rowstride = "cin * xrows"
yadvance = "stride * rowstride"
lanes = "128"
[inputs.in0]
shape = ["h", "cin", "xrows", 128]
range = [-2, 2]
[inputs.weights]
shape = ["blocks", "2 + kh * kw * cin", 128]
range = [-1, 1]
[outputs.out0]
shape = [1, "ho * wo + 1", "cout"]
[inputs.cls]
shape = ["blocks", 128]
[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
cls = "CR7"
blocks = "CR8"
wo = "CR9"
lanes = "CR10"
xrows = "CR11"
rowstride = "CR12"
yadvance = "CR13"
kh = "CR14"
full = "CR15"
[cases.default]
[cases.patch16]
h = 16
w = 32
kh = 16
kw = 16
stride = 16
cout = 384
[golden]
tolerance = { e3 = "NX8_STEP" }
