[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["hardswish"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 40
[params.m]
type = "int"
min = 1
max = 65536
default = 196
[params.n]
type = "int"
min = 1
max = 4096
default = 240
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 40
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 14
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 240
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 14

[derived]
chunks = "ceil(k / 128)"
pack = "128 // out0_d3"
groups = "ceil(n / pack)"
stripes = "out0_d0 * out0_d2"
stripe_rows = "out0_d3 * chunks"
active = "ds(pack * out0_d3)"
full = "ds(128)"

[inputs.in0]
shape = ["m * chunks", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["2 * (groups + n * chunks)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["stripes * groups", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
active = "CR8"
full = "CR9"
chunks = "CR10"
stripe_rows = "CR11"
stripes = "CR12"
out0_d3 = "CR13"
n = "CR14"
pack = "CR15"

[cases.default]
