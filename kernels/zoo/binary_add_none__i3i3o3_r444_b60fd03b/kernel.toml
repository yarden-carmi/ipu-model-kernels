[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 147456
[params.in0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 144
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 16384
default = 32
[params.in1_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 144
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 32
[params.in1_d3]
type = "int"
min = 1
max = 16384
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 144
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 32
[params.out0_d3]
type = "int"
min = 1
max = 16384
default = 32

[derived]
blocks = "ceil(out0_d0 * out0_d2 * out0_d3 / 128)"
full_limit = "blocks - 2"
channel_limit = "out0_d1 - 1"
rows = "out0_d1 * blocks - 1"
fast_limit = "rows - 1"
minus_one = "-1"
tail = "ds((out0_d0 * out0_d2 * out0_d3 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d1", "ceil(in0_d0 * in0_d2 * in0_d3 / 128) * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d1", "ceil(in1_d0 * in1_d2 * in1_d3 / 128) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d1", "blocks * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
rows = "CR8"
blocks = "CR9"
tail = "CR10"
channel_limit = "CR11"
full_limit = "CR12"
fast_limit = "CR13"
minus_one = "CR14"

[cases.default]
