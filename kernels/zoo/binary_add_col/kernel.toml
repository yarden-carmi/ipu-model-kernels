# binary_add_col: y = a (op) b, broadcast = col, one parameterised program.
#
#   op        : add | sub | mul | max
#   broadcast : col    -- b holds `inner` values, one per row of a, each
#                         repeated along its row: a is [inner, numel / inner]
#                         (entities = rows of a, e.g. a per-channel NCHW
#                         scale) and y[r][j] = a[r][j] op b[r]
#   inner     : 1..1048576 -- the rows of a; b's values are packed
#                         ceil(inner / 128) rows and reloaded per run of
#                         128 rows of a (the scalar element r % 128 of R0
#                         must stay in range)
#
# The call this kernel serves (facebook/sam-vit-base, x12 per forward) is
# broadcast = col, op = add, inner = 823200, numel = 11524800 -- 823200 rows
# of 14 lanes, b streamed over 6432 rows. add/sub/mul/max come with the same
# datapath and are declared with it. `div` and `min` are out: the AaQ stage
# has no exact reciprocal and the accumulator no min (see kernelgen.toml's
# `unsupported`).
#
# Every tensor is the layout every activation on the chip uses: an entity
# holds its features in ceil(F/128) consecutive rows, lanes past F zero.
# Here an entity is one row of a and holds numel / inner features, so the
# domain needs numel / inner <= 128 (one memory row per entity -- the DS
# half refuses more): a and y are [inner, numel / inner], row r holding
# entity r's features in lanes 0..numel/inner-1, and b is `inner` values in
# ceil(inner / 128) rows, one per row of a. The kernel reads what the
# previous kernel wrote and leaves what the next one reads, with no repack
# between them; the host tiles only `numel`.
#
# Dataflow, per row r: y[r] = a[r] op b[r] is two products (the only way
# into R_ACC is MULT_RES), so a row is two words for add/sub/max -- word A
# multiplies the a row resident in R_CYCLIC by the CR constant 1.0 and
# initialises the accumulator, word B broadcasts b[r] (MULT.RC.VE of the
# resident ones row, the scalar element of the resident b row R0 selected by
# LR3 = r % 128), accumulates it and stores the row; word A carries the load
# of the row the next word A multiplies. `mul` is one product, so its row is
# ONE word: load the next a row, multiply the resident one by b[r],
# ACC.ADD.FIRST and store. The rows of a are grouped in runs of 128 (the
# lanes of one b row): each run opens with a prologue word that loads the
# run's b row into R0, and LR3 -- the scalar index into R0 -- doubles as the
# run's lane counter, starting at -1. The last row of the whole call is
# emitted straight-line (nothing ever loads row `inner`). The shape reaches
# the program only through CRs and every loop is dynamic, so a whole call is
# one launch.
#
# The domain needs `inner` to divide `numel` (a row holds numel / inner
# features): the quotient in `ds` refuses a non-whole division, and a row
# longer than 128 lanes an invalid DS, when the case is planned.

[kernel]
op = "binary"
formats = ["dynamic"]

[params]
op = { type = "str", choices = ["add", "sub", "mul", "max"], default = "add" }
numel = { type = "int", min = 1, max = 134217728 }        # elements of a and of y (inner x rowlen, rowlen <= 128)
inner = { type = "int", min = 1, max = 1048576 }          # the rows of a: b's values, streamed per run of 128
broadcast = { type = "str", choices = ["col"], default = "col" }

[derived]
rowlen = "numel / inner"          # a row's features (refuses a non-whole division, and ds() a length > 128)
gf = "ceil(inner / 128) - 1"      # the full runs of 128 rows (each opens with one b row load)
tail = "inner - 128 * gf"         # the last run's rows: 1..128
tm2 = "tail - 2"                  # the short run's BNE bound, add/sub/max (unused when tail < 2)
tm3 = "tail - 3"                  # the short run's BNE bound, mul (BNE reads the old LR3)
f127 = "127"                      # the full run's BNE bound, add/sub/max
f126 = "126"                      # the full run's BNE bound, mul
slot128 = "128"                   # the a rows' R_CYCLIC slot
qf = "case_qf"                    # CR14: the case's QF half
ds = "halves(ds(numel / inner), 0)"  # CR15: every row names its live lanes

[inputs.a]
shape = ["inner", "numel / inner"]
range = [-1, 1]

[inputs.b]
shape = ["inner"]                 # one value per row of a
range = [-1, 1]

[outputs.y]
shape = ["inner", "numel / inner"]

[scratch.ones]
shape = [1, 128]
fill = 1.0                        # the resident ones row: MULT.RC.VE's vector for the b broadcast

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"       # LD.MASK: every lane active, whatever a previous kernel left

[abi]
a = "CR2"
b = "CR3"
y = "CR4"
ones = "CR5"
maskr = "CR6"
tm2 = "CR8"
tm3 = "CR10"
f127 = "CR11"
f126 = "CR7"
slot128 = "CR12"
gf = "CR13"
qf = "CR14"
ds = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: only the store rounds; the golden is quantized the same way, so the
# kernel's own datapath is exact products and an exact accumulator op.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 1, why = "the store's row quantization, measured exact; one step of margin for a row scale that moves" } }

[cases.default]                                   # facebook/sam-vit-base's shape, scaled to sub's 14 lanes
op = "add"
broadcast = "col"
inner = 14
numel = 196

[cases.one]                                       # the narrowest call: one lane, one row
op = "add"
broadcast = "col"
inner = 1
numel = 1

[cases.one_wide]                                  # one row of 128 lanes
op = "add"
broadcast = "col"
inner = 1
numel = 128

[cases.one_run]                                   # one run: 128 rows, the loop's shortest full trip
op = "add"
broadcast = "col"
inner = 128
numel = 1792

[cases.two_runs]                                  # the run loop's shortest trip, then a full tail
op = "add"
broadcast = "col"
inner = 256
numel = 3584

[cases.short_tail]                                # a run of 150 rows: 1 full run + 22
op = "add"
broadcast = "col"
inner = 150
numel = 2100

[cases.tail_one]                                  # inner = 128k + 1: the tail run holds one row
op = "add"
broadcast = "col"
inner = 129
numel = 1806

[cases.sub]
op = "sub"
broadcast = "col"
inner = 14
numel = 196

[cases.mul]                                       # the one-word row loop
op = "mul"
broadcast = "col"
inner = 300
numel = 4200

[cases.max]
op = "max"
broadcast = "col"
inner = 300
numel = 4200

[cases.sweep_inner1]                              # rowlen sweeps with inner = 1
op = ["add", "sub", "mul", "max"]
broadcast = "col"
inner = 1
numel = [1, 2, 128]

[cases.sweep_inner2]                              # a two-value b
op = ["add", "sub", "mul", "max"]
broadcast = "col"
inner = 2
numel = [2, 256]

[cases.sweep_inner127]                            # a run one short of full
op = ["add", "sub", "mul", "max"]
broadcast = "col"
inner = 127
numel = [127, 254]

[cases.sweep_inner128]                            # exactly one full run
op = ["add", "sub", "mul", "max"]
broadcast = "col"
inner = 128
numel = [128, 256]

[cases.sweep_inner129]                            # one full run plus a one-row tail
op = ["add", "sub", "mul", "max"]
broadcast = "col"
inner = 129
numel = [129, 258]

[cases.sweep_inner130]
op = ["add", "sub", "mul", "max"]
broadcast = "col"
inner = 130
numel = [130, 260]

[cases.sweep_inner300]                            # several full runs, the mul bound case
op = ["add", "sub", "mul", "max"]
broadcast = "col"
inner = 300
numel = [300, 600, 4200]

[cases.sam]                                       # facebook/sam-vit-base, x12 per forward
op = "add"
broadcast = "col"
inner = 823200
numel = 11524800
tier = "nightly"
