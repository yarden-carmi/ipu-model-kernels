[kernel]
op = "bmm__row_softmax"
formats = ["e2", "e3"]

[params]
s0_b = {type="int", min=1, max=512, default=16}
s0_k = {type="int", min=1, max=128, default=48}
s0_m = {type="int", min=1, max=1024, default=64}
s0_n = {type="int", min=1, max=4096, default=64}
s1_n = {type="int", min=1, max=4096, default=64}
s1_rows = {type="int", min=1, max=524288, default=1024}
in0_d0 = {type="int", min=1, max=512, default=4}
in0_d1 = {type="int", min=1, max=512, default=4}
in0_d2 = {type="int", min=1, max=1024, default=64}
in0_d3 = {type="int", min=1, max=128, default=48}
in1_d0 = {type="int", min=1, max=512, default=4}
in1_d1 = {type="int", min=1, max=4096, default=64}
in1_d2 = {type="int", min=1, max=8192, default=576}
out0_d0 = {type="int", min=1, max=512, default=4}
out0_d1 = {type="int", min=1, max=512, default=4}
out0_d2 = {type="int", min=1, max=1024, default=64}
out0_d3 = {type="int", min=1, max=4096, default=64}

[derived]
chunks = "ceil(s1_n/128)"
bstep = "s0_k*chunks"
bgap = "(in1_d2-s0_k*out0_d1)*chunks"
bstart = "((in1_d2-s0_k*out0_d1)//2)*chunks"
bend = "bstart+out0_d1*bstep"
bgroup = "in1_d2*chunks"
agap = "s0_m*in0_d1-1"
gaps = "bgap+65536*agap"
last = "chunks-1"
klast = "s0_k-1"
width = "ds(128)+65536*ds((s1_n-1)%128+1)"
one = "in0_d1+65536*ds(1)"
workq = "280+65536*24"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ceil(in0_d3/128)*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "ceil(in1_d1/128)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]
[scratch.score]
shape = ["4*chunks", 128]
[scratch.temp]
shape = [13, 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
score = "CR5"
gaps = "CR6"
temp = "CR7"
qf_in0 = "CR8"
qf_in1 = "CR9"
qf_out0 = "CR10"
width = "CR11"
one = "CR12"
workq = "CR13"
chunks = "CR14"
klast = "CR15"
bgroup = "LR15"
bstep = "LR14"
last = "LR13"
s0_m = "LR12"
s1_rows = "LR11"
bend = "LR10"
bstart = "LR5"

[cases.default]
