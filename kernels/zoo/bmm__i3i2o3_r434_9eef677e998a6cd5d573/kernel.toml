[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=65535, default=12}
k = {type="int", min=1, max=65535, default=256}
m = {type="int", min=1, max=65535, default=256}
n = {type="int", min=1, max=65535, default=64}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=12}
in0_d2 = {type="int", min=1, max=65535, default=256}
in0_d3 = {type="int", min=1, max=65535, default=256}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=65535, default=256}
in1_d2 = {type="int", min=1, max=8388480, default=2304}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=12}
out0_d2 = {type="int", min=1, max=65535, default=256}
out0_d3 = {type="int", min=1, max=65535, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "arows*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "brows*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[scratch.panel]
shape = ["128 + ceil((in0_d1*n + (in1_d2-in0_d1*n)%128)/64)*64*ceil(k/128) + k", 128]

[derived]
arows = "ceil(in0_d3/128)"
brows = "ceil(in1_d2/128)"
stride = "brows + arows*65536"
ds = "ds(128) + ds((n-1)%128+1)*65536"
mh = "m + in0_d1*65536"
group_rows = "in1_d1*brows"
all_group_rows = "in1_d0*group_rows"
head_offset = "in1_d2-in0_d1*n"
vbase = "base(in1)+head_offset//128"
head_lane = "head_offset%128"
seg_end = "ceil((in0_d1*n+head_offset%128)/64)*64-64"
k_ds = "k + ds(min(k,128))*65536"

[abi]
in0 = "CR2"
vbase = "CR3"
out0 = "CR4"
all_group_rows = "CR5"
k_ds = "CR6"
n = "CR7"
mh = "CR8"
stride = "CR9"
ds = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
group_rows = "CR14"
panel = "CR15"
head_lane = "LR3"
seg_end = "LR14"

[cases.default]
