[kernel]
op = "bmm"
formats = ["e2"]

[params.b]
type = "int"
min = 1
max = 16
default = 1
[params.k]
type = "int"
min = 1
max = 256
default = 64
[params.m]
type = "int"
min = 1
max = 256
default = 2
[params.n]
type = "int"
min = 1
max = 256
default = 50

[inputs.in0]
shape = ["b", "m", "kchunks", 128]
range = [-2, 2]
[inputs.in1]
shape = ["b", "kchunks", "n", 128]
range = [-2, 2]
[outputs.out0]
shape = ["b", "m", "nchunks", 128]

[derived]
qf = "case_qf"
kchunks = "ceil(k / 128)"
nchunks = "ceil(n / 128)"
kd0 = "ds(min(k, 128))"
kd1 = "ds(min(max(k - 128, 1), 128))"
kdout0 = "ds(min(n, 128))"
kdout1 = "ds(min(max(n - 128, 1), 128))"
w0 = "min(n, 128)"
w1 = "min(max(n - 128, 1), 128)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
n = "CR7"
kchunks = "CR8"
kd0 = "CR9"
kd1 = "CR10"
w0 = "CR11"
w1 = "CR15"
kdout0 = "CR12"
kdout1 = "CR13"
qf = "CR14"

[golden]
tolerance = { e2 = "EXACT" }

[cases.default]
b = 1
m = 2
k = 64
n = 50
[cases.batched]
b = 2
m = 3
k = 50
n = 64
[cases.full_k]
b = 1
m = 1
k = 256
n = 1
[cases.wide_n]
b = 2
m = 2
k = 32
n = 200
[cases.wide_n_full_k]
b = 1
m = 2
k = 256
n = 256
