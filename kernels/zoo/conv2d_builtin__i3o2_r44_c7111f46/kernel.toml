[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
choices = [true]
default = true
[params.cin]
type = "int"
min = 1
max = 256
default = 16
[params.cout]
type = "int"
min = 1
max = 256
default = 16
[params.groups]
type = "int"
min = 1
max = 256
default = 16
[params.h]
type = "int"
min = 3
max = 128
default = 112
[params.w]
type = "int"
min = 3
max = 128
default = 112
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 256
default = 16
[params.in0_d2]
type = "int"
min = 3
max = 128
default = 112
[params.in0_d3]
type = "int"
min = 3
max = 128
default = 112
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 256
default = 16
[params.out0_d2]
type = "int"
min = 2
max = 128
default = 56
[params.out0_d3]
type = "int"
min = 2
max = 128
default = 56

[derived]
candidate = "max(1, out0_d3 // ceil(out0_d3 / min(out0_d3, 128 // out0_d2)))"
pack = "1 + (candidate - 1) * (1 - min(1, out0_d3 % candidate))"
full = "ds(128)"
wide = "ds(in0_d3)"
packed = "ds(pack * out0_d2)"
input_rows = "in0_d1 * in0_d0 * in0_d2"
plane_step = "out0_d0 * out0_d2"
stage_rows = "out0_d1 * plane_step"
weight_end = "30 * out0_d1"
weight_rows = "weight_end + 2"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * (out0_d3 // pack)", 128]
[scratch.high]
shape = ["stage_rows", 128]
[scratch.low]
shape = ["stage_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
high = "CR5"
low = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
full = "CR10"
wide = "CR11"
packed = "CR12"
in0_d2 = "CR13"
plane_step = "CR14"
out0_d0 = "CR15"
weight_end = "LR14"

[cases.default]
