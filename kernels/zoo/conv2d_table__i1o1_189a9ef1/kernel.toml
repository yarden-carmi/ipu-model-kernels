[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]
[params.act_out0]
type = "str"
choices = ["hardswish", "silu"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
choices = [64, 96, 120, 128]
default = 64
[params.cout]
type = "int"
choices = [64, 96, 120, 128]
default = 64
[params.groups]
type = "int"
choices = [64, 96, 120, 128]
default = 64
[params.h]
type = "int"
min = 5
max = 128
default = 8
[params.w]
type = "int"
min = 5
max = 128
default = 8
[params.kh]
type = "int"
choices = [3, 5]
default = 5
[params.kw]
type = "int"
choices = [3, 5]
default = 5
[params.padding]
type = "int"
choices = [1, 2]
default = 2
[params.stride]
type = "int"
min = 1
max = 2
default = 2
[derived]
hp = "h + 2 * padding"
wp = "w + 2 * padding"
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
dsc = "ds(cout)"
dsi = "ds(cin)"
[inputs.in0]
shape = ["h", "w", 128]
range = [-2, 2]
[inputs.weights]
shape = ["2 * (kh * kw + 1)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.pad]
shape = ["hp * wp", 128]
[outputs.out0]
shape = ["ho", "wo", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
pad = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
dsc = "CR10"
dsi = "CR11"
[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
h = 8
w = 8
cin = 64
cout = 64
groups = 64
stride = 2
formats = ["e2"]
[cases.k3]
h = 8
w = 8
cin = 96
cout = 96
groups = 96
kh = 3
kw = 3
padding = 1
stride = 1
formats = ["e2"]
