[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 1
max = 2147483647
default = 16384

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
default = 64

[params.in0_d2]
type = "int"
min = 1
default = 16

[params.in0_d3]
type = "int"
min = 1
default = 16

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
default = 64

[params.out0_d2]
type = "int"
min = 1
default = 16

[params.out0_d3]
type = "int"
min = 1
default = 16

[derived]
tiles = "ceil(in0_d1 / 128)"
input_rows = "in0_d0 * in0_d2 * in0_d3 * tiles"
output_rows = "out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)"
last_row = "input_rows - 1"
last_tile = "tiles - 1"
active = "ds(128)"
tail_active = "ds(1 + (in0_d1 - 1) % 128)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
last_row = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
active = "CR7"
last_tile = "CR8"
tail_active = "CR9"

[cases.default]
