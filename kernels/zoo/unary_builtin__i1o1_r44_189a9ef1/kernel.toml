[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 1
max = 2147483647
default = 4096

[params.in0_d1]
type = "int"
min = 1
max = 128
default = 64

[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64

[derived]
input_rows = "numel // in0_d1"
output_rows = "numel // out0_d1"
last_row = "input_rows - 1"
penultimate = "max(0, input_rows - 2)"
active = "ds(in0_d1)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
last_row = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
active = "CR7"
penultimate = "CR8"

[cases.default]
