chain = ["conv2d"]
chain_in = ["in0"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [0, 2, 1]
pack = "1 + (1 - min(1, max(cin - groups, cout - groups))) * (max(1, 128 // w) - 1)"

[prefer.in0]
lanes = 3
rows = [0, 2, 1]
pack = "1 + (1 - min(1, max(cin - groups, cout - groups))) * (max(1, 128 // w) - 1)"

[view.in0]
kind = "whole"

[layout.out0]
lanes = 3
rows = [0, 2, 1]
pack = "max(1, 128 // w * (2 - stride), (1 - min(1, max(cin - groups, cout - groups))) * (128 // w) * stride)"

[lut.out0]
range_mode = 2
range_exp = 40
