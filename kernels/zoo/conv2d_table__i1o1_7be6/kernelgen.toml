chain = ["conv2d"]
chain_in = ["in0"]
chain_out = ["out0"]
notes = "Channel-lane convolution with zero padded scratch and fused GELU store."
[layout.in0]
shape = [1, "cin", "w"]
lanes = 1
rows = [0, 2]
[view.in0]
kind = "whole"
[layout.out0]
shape = [1, "cout", "(w + 2 * padding - kw) // stride + 1"]
lanes = 1
rows = [0, 2]
[lut.out0]
range_mode = 0
range_exp = 40
