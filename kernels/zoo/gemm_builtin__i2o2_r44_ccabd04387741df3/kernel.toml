[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 32
[params.m]
type = "int"
min = 1
max = 2147483647
default = 50176
[params.n]
type = "int"
min = 1
max = 4096
default = 1
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 32
[params.in0_d2]
type = "int"
min = 1
max = 32640
default = 224
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 224
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 1
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 224
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 224

[derived]
tiles = "ceil(in0_d2 / 128)"
out_tiles = "ceil(out0_d2 / 128)"
row_stride = "in0_d1 * tiles"
chunks = "ceil(k / 128)"
full_ds = "ds(128) + 65536 * ds(min(128, 64 + out0_d2))"
tail_ds = "ds(out0_d2 - (out_tiles - 1) * 128)"
idx_lo = "50462976"
idx_hi = "117835012"

[inputs.in0]
shape = ["in0_d0 * in0_d3 * row_stride", 128]
[inputs.w]
shape = ["2 * n * (1 + chunks)", 128]
[inputs.zero]
shape = [1, 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d3 * out_tiles", 128]
[scratch.shifted]
shape = ["ceil(in0_d3 / 2) * in0_d1 * tiles", 128]
[scratch.tmp]
shape = [1, 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full_ds = "CR7"
idx_lo = "CR8"
idx_hi = "CR9"
out0_d0 = "LR2"
row_stride = "CR10"
n = "CR11"
tmp = "CR12"
shifted = "CR13"
zero = "CR14"
tail_ds = "CR15"

[cases.default]
