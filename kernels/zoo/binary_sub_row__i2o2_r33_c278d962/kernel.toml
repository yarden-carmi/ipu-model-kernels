[kernel]
op = "binary_sub_row"
formats = ["e1"]

[params.broadcast]
type = "str"
choices = ["row"]
default = "row"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 1
max = 128
default = 2
[params.op]
type = "str"
choices = ["sub"]
default = "sub"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 2048
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 2
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 512
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 2
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 2
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 512
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 2

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / 128) * 128"]
range = [-2.0, 2.0]
[inputs.c0]
shape = [1, 128]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / 128) * 128"]

[derived]
rows = "in0_d0 * in0_d1"
ds = "ds(inner)"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
c0 = "CR6"
rows = "CR7"
ds = "CR8"

[cases.default]
