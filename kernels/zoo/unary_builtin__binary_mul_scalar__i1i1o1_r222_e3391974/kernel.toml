[params.s0_numel]
type = "int"
default = 1
[params.s0_operand]
type = "int"
default = 1
[params.s1_broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.s1_inner]
type = "int"
default = 0
[params.s1_numel]
type = "int"
default = 512
[params.s1_op]
