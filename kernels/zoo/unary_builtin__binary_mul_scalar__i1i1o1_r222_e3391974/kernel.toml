[kernel]
op = "unary_builtin__binary_mul_scalar"
formats = ["e2"]

[params.act_s0]
type = "str"
choices = ["reciprocal"]
default = "reciprocal"
[params.s0_numel]
type = "int"
default = 1
[params.s0_operand]
type = "int"
default = 1
[params.s1_broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.s1_inner]
type = "int"
default = 0
[params.s1_numel]
type = "int"
default = 512
[params.s1_op]
type = "str"
choices = ["mul"]
default = "mul"
[params.in0_d0]
type = "int"
default = 1
[params.in0_d1]
type = "int"
default = 512
[params.in1_d0]
type = "int"
default = 1
[params.in1_d1]
type = "int"
default = 1
[params.out0_d0]
type = "int"
default = 1
[params.out0_d1]
type = "int"
default = 512

[derived]
chunks = "ceil(in0_d1 / 128)"
rows = "in0_d0 * chunks"
loop = "rows + chunks * 65536"
loop_or_two = "0x40018000 * (1 - min(1, max(0, rows - 8))) + loop * min(1, max(0, rows - 8))"
full = "ds(128) + ds(s0_numel) * 65536"
tail = "ds((out0_d1 - 1) % 128 + 1)"
factor = "0x43118700"
neg_inv = "0xc2118680 + 256 * min(1, max(0, rows - 8))"
base_cap = "0x6211c500"
neg_cap = "0xfb11f6bf"

[inputs.in0]
shape = ["rows", 128]
[inputs.in1]
shape = ["in1_d0", "ceil(in1_d1 / 128)", 128]
[outputs.out0]
shape = ["out0_d0", "ceil(out0_d1 / 128)", 128]
[scratch.s0]
shape = [9, 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
s0 = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
full = "CR9"
tail = "CR10"
neg_inv = "CR11"
base_cap = "CR13"
loop_or_two = "CR12"
factor = "CR14"
neg_cap = "CR15"

[cases.default]
