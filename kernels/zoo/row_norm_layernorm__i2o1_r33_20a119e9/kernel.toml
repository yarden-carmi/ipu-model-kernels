[kernel]
op = "row_norm"
formats = ["e2"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 1
max = 4096
default = 144
[params.rows]
type = "int"
min = 1
max = 8192
default = 1024
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-5
[params.in0_d0]
type = "int"
min = 1
max = 8192
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 8192
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 144
[params.out0_d0]
type = "int"
min = 1
max = 8192
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 8192
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 144

[derived]
K = "ceil(channels / 128)"
view_config = "K + 65536 * in0_d1"
M = "rows * K"
ds_pair = "ds(128) + 65536 * ds((channels - 1) % 128 + 1)"
half = "1277440"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / 128)", 128]
range = [-2.0, 2.0]
[inputs.gamma]
shape = ["3 * K", 128]
[inputs.beta]
shape = ["3 * K", 128]
[inputs.stats]
shape = [4, 128]
[scratch.tmp]
shape = ["32 + 2 * K", 128]
[scratch.normalized]
shape = ["3 * M", 128]
[scratch.gathered]
shape = ["2 * M", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
stats = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
view_config = "CR10"
normalized = "CR11"
qf_stats = "CR12"
half = "CR13"
ds_pair = "CR14"
gathered = "CR15"
M = "LR13"
out0_d1 = "LR12"
out0_d2 = "LR14"

[cases.default]
