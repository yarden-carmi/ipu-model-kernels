[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params]
act_out0 = {type="str", choices=["hardswish"], default="hardswish"}
bias = {type="bool", default=true}
cin = {type="int", min=1, max=640, default=8}
cout = {type="int", min=1, max=640, default=8}
groups = {type="int", min=1, max=640, default=8}
h = {type="int", min=1, max=3000, default=8}
w = {type="int", min=1, max=256, default=8}
kh = {type="int", min=1, max=5, default=3}
kw = {type="int", min=1, max=5, default=3}
padding = {type="int", min=0, max=2, default=1}
stride = {type="int", min=1, max=2, default=1}
in0_d0 = {type="int", choices=[1], default=1}
in0_d1 = {type="int", min=1, max=640, default=8}
in0_d2 = {type="int", min=1, max=3000, default=8}
in0_d3 = {type="int", min=1, max=256, default=8}
out0_d0 = {type="int", choices=[1], default=1}
out0_d1 = {type="int", min=1, max=640, default=8}
out0_d2 = {type="int", min=1, max=3004, default=8}
out0_d3 = {type="int", min=1, max=128, default=8}

[derived]
ic = "ceil(in0_d1 / 128)"
pack = "min(2, 128 // out0_d3)"
oh = "ceil(out0_d2 / pack)"
wp = "in0_d3 + 2 * padding"
hp = "in0_d2 + 2 * padding"
pitch = "ic * wp"
stencil_h = "(oh - 1) * pack * stride + kh"
parts = "1 + min(1, cin // groups - 1)"
plane = "stencil_h * kw * parts"
group_plane = "plane * (cin // groups)"
weight_rows = "3 * (1 + (cin // groups) * kh * kw)"
ds_full = "ds(128)"
ds_out = "ds(pack * out0_d3) + 65536 * ds((1 + (out0_d2 - 1) % pack) * out0_d3)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * ic", 128]
range = [-2, 2]
[inputs.weights]
shape = ["cout * weight_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.padded]
shape = ["(hp + stride) * pitch", 128]
[scratch.stencil]
shape = ["cin * plane", 128]
[outputs.out0]
shape = ["out0_d0 * cout * oh", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
padded = "CR6"
stencil = "CR7"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds_full = "CR11"
ds_out = "CR12"
pitch = "CR13"
plane = "CR14"
group_plane = "CR15"

[golden]
tolerance = {e1="NX8_STEP", e2="NX8_STEP"}

[cases.default]
