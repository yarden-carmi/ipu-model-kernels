[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
numel = { type = "int", min = 1, max = 16777216, default = 18816 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 24 }
in0_d2 = { type = "int", min = 1, default = 28 }
in0_d3 = { type = "int", min = 1, max = 128, default = 28 }
in1_d0 = { type = "int", min = 1, default = 1 }
in1_d1 = { type = "int", min = 1, default = 24 }
in1_d2 = { type = "int", min = 1, default = 28 }
in1_d3 = { type = "int", min = 1, max = 128, default = 28 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 24 }
out0_d2 = { type = "int", min = 1, default = 28 }
out0_d3 = { type = "int", min = 1, max = 128, default = 28 }

[derived]
p0 = "min(in0_d2, 128 // in0_d3)"
p1 = "min(in1_d2, 128 // in1_d3)"
packed_end = "p0 * in0_d3"
batch_stride = "out0_d1 * out0_d2"
width_ds = "ds(out0_d3)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / p0)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 / p1)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * batch_stride", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
out0_d1 = "CR8"
out0_d2 = "CR9"
out0_d3 = "CR10"
packed_end = "CR11"
batch_stride = "CR12"
width_ds = "CR13"
out0_d0 = "LR15"

[cases.default]
