# binary_div_col: y = a / b, broadcast = col, one parameterised program.
#
#   op        : div      (the only op this program renders)
#   broadcast : col     -- b holds `inner` values, one per row of a, each
#                        dividing its row: a is [inner, numel / inner]
#                        (entities = rows of a, e.g. a per-channel NCHW
#                        scale) and y[r][j] = a[r][j] / b[r]
#   inner     : 1..1048576 -- the rows of a; b's values are packed
#                         ceil(inner / 128) rows and reloaded per run of
#                         128 rows of a (the scalar element r % 128 of a
#                         resident register must stay in range)
#
# The call this kernel serves (facebook/detr-resnet-50, x1 per forward) is
# broadcast = col, op = div, inner = 16, numel = 256 -- 16 rows of 16 lanes,
# one b row. A division is a multiply by a reciprocal, and the reciprocal is
# split once per b row -- r = the AaQ `reciprocal` of the row, corrected by
# one exact Newton step e (binary_div_row's split) -- so the datapath is
# exact products and exact accumulator adds and only the stores round.
#
# Every tensor is the layout every activation on the chip uses: an entity
# holds its features in ceil(F/128) consecutive rows, lanes past F zero.
# Here an entity is one row of a and holds numel / inner features, so the
# domain needs numel / inner <= 128 (one memory row per entity -- the DS
# half refuses more): a and y are [inner, numel / inner], row r holding
# entity r's features in lanes 0..numel/inner-1, and b is `inner` values in
# ceil(inner / 128) rows, one per row of a. The kernel reads what the
# previous kernel wrote and leaves what the next one reads, with no repack
# between them; the host tiles only `numel`.
#
# The domain needs `inner` to divide `numel` (a row holds numel / inner
# features): the quotient in `rowlen` refuses a non-whole division, and a
# row longer than 128 lanes an invalid DS, when the case is planned.

[kernel]
op = "binary"
formats = ["dynamic"]

[params]
op = { type = "str", choices = ["div"], default = "div" }
numel = { type = "int", min = 1, max = 134217728 }        # elements of a and of y (inner x rowlen, rowlen <= 128)
inner = { type = "int", min = 1, max = 1048576 }          # the rows of a: b's values, streamed per run of 128
broadcast = { type = "str", choices = ["col"], default = "col" }

[derived]
rowlen = "numel / inner"             # a row's features (refuses a non-whole division, and ds() a length > 128)
gf = "ceil(inner / 128) - 1"         # the full runs of 128 rows (each opens with the split of its b row)
tail = "inner - 128 * gf"            # the last run's rows: 1..128
tm2 = "tail - 2"                     # the short run's BNE bound (unused when tail < 2)
f127 = "127"                         # the full run's BNE bound
dsr = "halves(ds(numel / inner), 0)" # CR13: every a/y row names its live lanes
dsf = "halves(ds(128), ds(tail))"    # CR15: the split's DS, full run .L / last run .H
qf = "case_qf"                       # CR14: the case's QF half

[inputs.a]
shape = ["inner", "numel / inner"]
range = [-1, 1]

[inputs.b]
shape = ["inner"]                    # one value per row of a
range = [0.25, 4]                    # away from 0: 1/0 is an infinity, not a value

[outputs.y]
shape = ["inner", "numel / inner"]

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"          # LD.MASK: every lane active, whatever a previous kernel left

[scratch.twos]
shape = [1, 128]
fill = 2.0                           # seeds R_ACC for the subtraction (resident in cyclic slot 256)

[scratch.rcp]
shape = [1, 128]                     # r = 1/b, the AaQ reciprocal, one b row at a time

[scratch.u]
shape = [1, 128]                     # u = 2 - b*r, one b row at a time

[scratch.e]
shape = [1, 128]                    # e = r*u - r: the tight correction row

[abi]
a = "CR2"
b = "CR3"
y = "CR4"
maskr = "CR5"
rcp = "CR6"
u = "CR7"
e = "CR8"
twos = "CR9"
f127 = "CR10"
tm2 = "CR11"
gf = "CR12"
dsr = "CR13"
qf = "CR14"
dsf = "CR15"

[golden]
reference = "reference.py:reference"
# The split is exact Newton for the resident r: r + e = (1/b)(1 - eps^2) with
# eps = b*r - 1, whatever r's own store did, and e's row is tight (its scale
# is max|r*(1-b*r)|, ~b*(one step of r's row), a few percent of a lane's
# magnitude), so its store costs ~2^-8 of a lane's magnitude. The measured
# distance over the sweep is at most a step of the output row's grid; the
# tolerance holds margin.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 3, why = "the three NX8 round trips of the split (rcp corrected by Newton, e tight); measured at most a step over the sweep, margin for a row scale that moves" } }

[cases.default]                                  # facebook/detr-resnet-50, x1 per forward
op = "div"
broadcast = "col"
inner = 16
numel = 256

[cases.one]                                      # the narrowest call: one lane, one row
op = "div"
broadcast = "col"
inner = 1
numel = 1

[cases.one_wide]                                 # one row of a, 128 lanes
op = "div"
broadcast = "col"
inner = 1
numel = 128

[cases.two_rows]                                 # two rows, tail loop's shortest trip
op = "div"
broadcast = "col"
inner = 2
numel = 32

[cases.one_run]                                  # exactly one full run (gf = 0, tail = 128)
op = "div"
broadcast = "col"
inner = 128
numel = 16384

[cases.two_runs]                                 # the run loop's shortest trip, then a full tail
op = "div"
broadcast = "col"
inner = 256
numel = 3584

[cases.tail_one]                                 # inner = 128k + 1: the tail run holds one row
op = "div"
broadcast = "col"
inner = 129
numel = 1806

[cases.short_tail]                               # a run of 150 rows: 1 full run + 22
op = "div"
broadcast = "col"
inner = 150
numel = 2100

[cases.wide_rowlen]                              # many rows, 128-lane rows of a
op = "div"
broadcast = "col"
inner = 256
numel = 32768

[cases.big]                                      # a real-scale call: 4096 rows of 128 lanes
op = "div"
broadcast = "col"
inner = 4096
numel = 524288
tier = "nightly"

[cases.sweep_small]                              # the structure of the calls, scaled down
op = "div"
broadcast = "col"
inner = [1, 2, 16]
numel = [16, 32, 128]

[cases.sweep_runs_127]                           # run boundaries at inner = 127
op = "div"
broadcast = "col"
inner = 127
numel = [127, 254, 16256]

[cases.sweep_runs_128]                           # exactly one full run
op = "div"
broadcast = "col"
inner = 128
numel = [128, 256, 16384]

[cases.sweep_runs_129]                           # inner = 128 + 1: a one-row tail
op = "div"
broadcast = "col"
inner = 129
numel = [129, 258, 1806, 16512]

[cases.sweep_runs_255]                           # a full run one short
op = "div"
broadcast = "col"
inner = 255
numel = [255, 510, 12240, 32640]

[cases.sweep_runs_256]                           # two full runs
op = "div"
broadcast = "col"
inner = 256
numel = [256, 512, 32768]

[cases.sweep_rowlen]                             # rowlen sweeps at a fixed inner
op = "div"
broadcast = "col"
inner = 16
numel = [16, 32, 256, 2048]
