kind = "approximation"
method = "newton-reciprocal"
task = "binary_div_col"
hw_clean = true                       # no emulator-only instruction; stores are ACTIVATE.QUANTIZE
host_steps = []
chain_in = "a"
chain_out = "y"
unsupported = [
  "{\"broadcast\": \"col\", \"inner\": 16, \"numel\": 256, \"op\": \"min\"}: the accumulator has ADD, MAX and SUB only, and the AaQ activation set (identity, relu, relu6, reciprocal, rsqrt, exp2, generic) holds no min; ACC.MAX of the negated operands would have to be negated again, which costs a row round trip through XMEM per row of a.",
  "{\"broadcast\": \"none\", \"inner\": 0, \"numel\": 256, \"op\": \"div\"}: elementwise division would need a per-lane exact reciprocal: the AaQ `reciprocal` result lands in an 8-bit block row before the multiply that uses it, so a quotient would carry a per-lane error (binary_add_none's `unsupported` says the same). This kernel's column broadcast keeps the split one lane wide per row of a, which the correction holds.",
  "{\"broadcast\": \"row\", \"inner\": 16, \"numel\": 256, \"op\": \"div\"}: a row-broadcast division is binary_div_row's task (b's values repeat along a row, a different residency).",
  "{\"broadcast\": \"scalar\", \"inner\": 1, \"numel\": 256, \"op\": \"div\"}: a scalar b is binary_div_scalar's task (its split is one lane wide for the whole call).",
  "{\"broadcast\": \"col\", \"inner\": 16, \"numel\": 256, \"op\": \"add\"}: this kernel renders div by a column only; the add/sub/mul/max col calls are binary_add_col's (its `unsupported` holds div, whose split it lacks).",
  "{\"broadcast\": \"col\", \"inner\": 823199, \"numel\": 11524800, \"op\": \"div\"}: `inner` must divide `numel` (a's rows are numel / inner): the division in `rowlen` is not whole and the case is refused when planned.",
  "{\"broadcast\": \"col\", \"inner\": 823200, \"numel\": 105369600, \"op\": \"div\"}: a row of a holds numel / inner features, and a memory row is 128 lanes: the DS half refuses a row longer than 128, so numel / inner <= 128.",
  "{\"broadcast\": \"col\", \"inner\": 16, \"numel\": 0, \"op\": \"div\"}: an empty call: numel starts at 1.",
]
notes = """One parameterised program for every (numel, inner) with broadcast = col:
y[r][j] = a[r][j] / b[r]. An entity is one row of a -- b holds `inner` values, one per
row, so a and y are [inner, numel / inner], one memory row per entity holding its
numel / inner features (lanes past that zero; ds() refuses a row longer than 128, and
the whole quotient refuses an inner that does not divide numel) -- the layout every
activation on the chip uses, so the kernel reads the previous kernel's rows and leaves
rows the next one reads with no repack; the host tiles only `numel`. A division is a
multiply by a reciprocal; the reciprocal cannot be carried at full precision through a
register (the only route from R_ACC into a multiply is a store and a load, which in
NX8 quantizes to the row's grid), so it is split once per b row -- exactly
binary_div_row's split: r = the ACTIVATE.QUANTIZE reciprocal of the run's b row
(resident in R1), u = 2 - b*r from an exact product and an exact subtract seeded by a
stored 2s row (a power of two, held exactly, resident in R_CYCLIC slot 256), and
e = r*u - r, computed in the accumulator (ACC.SUB against an exact MULT.VE of resident
r by the CR constant 1.0) and stored tight -- e's row scale is max|r*(1-b*r)|, at most
b*(one step of r's row), a few percent of a lane's magnitude, so e's store costs
~2^-8 of a lane instead of the ~2^-5 a full-magnitude s = r*u row would. Because the
split is exact Newton for the RESIDENT r, r + e = (1/b)(1 - eps^2) with eps = b*r - 1
whatever r's own store did: r's quantization costs nothing and the residual is eps^2.
The rows of a are grouped in runs of 128 (the lanes of one b row): each run opens with
the split prologue (12 words), then every row of a is two words -- word A multiplies
the a row resident in R_CYCLIC slot 128 by the scalar r (element LR5 = LR3 + 128 of
R1) and initialises R_ACC; word B multiplies the SAME row by the scalar e (element
LR3 of R0), accumulates, stores it (ACTIVATE.QUANTIZE identity) and loads the NEXT
a row into slot 128 -- the load retires after word B's MULT has read the slot, so
word B always multiplies the row it stores and nothing waits; the run loop branches
on LR3 (the lane counter, starting -1) against the bound LR10 and the run loop on
LR4 against CRgf, and the
last row of the whole call
is emitted straight-line, so nothing ever loads row `inner`. The last run's prologue
names only its `tail` live lanes in the DS, so b's padding lanes never reach the
reciprocal. Every LR the program reads is set by it and R_MASK is loaded from its own
scratch row, so it runs after another kernel as well as from reset (the verifier's
chain run). Accuracy: the residual is eps^2 of the AaQ reciprocal's step plus e's
tight store, measured at
most 3 steps of the output row's grid over the sweep (tolerance NX8_STEP 3); the
golden is a/b in float64, quantized row by row like the store. The must-cover call
(detr-resnet-50, inner 16, numel 256: 16 rows of 16 lanes, one b row) is one launch,
12 prologue words + 2*15 body words + 2, about 56 cycles. Limits: op div, broadcast
col, inner 1..1048576 dividing `numel` with numel / inner <= 128 (so numel is at most
134217728); min and the other broadcasts are in `unsupported`, each for a stated
reason. b's generator range [0.25, 4] keeps the reciprocal finite -- the program
itself is scale-invariant, only b = 0 (an infinity, not a value) is out."""
