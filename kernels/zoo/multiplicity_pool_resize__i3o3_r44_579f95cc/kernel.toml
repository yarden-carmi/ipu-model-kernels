[kernel]
op = "multiplicity_pool_resize"
formats = ["e2"]

[params.in0_d0]
type = "int"
default = 1
[params.in0_d1]
type = "int"
default = 64
[params.in0_d2]
type = "int"
default = 64
[params.in0_d3]
type = "int"
default = 64
[params.out0_d0]
type = "int"
default = 1
[params.out0_d1]
type = "int"
default = 64
[params.out0_d2]
type = "int"
default = 128
[params.out0_d3]
type = "int"
default = 128
[params.oh]
type = "int"
default = 128
[params.ow]
type = "int"
default = 128

[inputs.in0]
shape = ["input_rows", 128]
[outputs.out0]
shape = ["out0_d0", "oh", "out0_d1", 128]
[scratch.routed]
shape = ["2 * input_rows", 128]

[derived]
input_rows = "in0_d0 * in0_d2 * in0_d1"
last_y = "in0_d2 - 1"
nx = "min(1, case_qf)"
center = "(1 - nx) * 0x3d100000 + nx * 0x017a10"
side = "(1 - nx) * 0x3c400000 + nx * 0x017840"
corner = "(1 - nx) * 0x3b800000 + nx * 0x017700"
route_scale = "(1 - nx) * 0x41800000 + nx * 0x018300"
ds_out = "ds(ow)"
src_center = "0x01010000"
src_neighbor = "0x06040503"
dst_seed = "0x03020100"

[abi]
in0 = "CR2"
out0 = "CR3"
routed = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
center = "CR7"
side = "CR8"
corner = "CR9"
ds_out = "CR10"
input_rows = "CR11"
last_y = "LR12"
route_scale = "CR12"
src_center = "CR13"
src_neighbor = "CR14"
dst_seed = "CR15"

[cases.default]
