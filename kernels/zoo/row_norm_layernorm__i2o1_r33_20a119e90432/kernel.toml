[kernel]
op = "row_norm"
formats = ["e2"]
[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 1
max = 4096
default = 144
[params.rows]
type = "int"
min = 1
max = 65536
default = 1024
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 0.00001
[params.in0_d0]
type = "int"
min = 1
default = 4
[params.in0_d1]
type = "int"
min = 1
default = 256
[params.in0_d2]
type = "int"
min = 1
default = 144
[params.out0_d0]
type = "int"
min = 1
default = 4
[params.out0_d1]
type = "int"
min = 1
default = 256
[params.out0_d2]
type = "int"
min = 1
default = 144
[derived]
chunks = "ceil(channels / 128)"
tiles = "ceil(out0_d1 / 128)"
scalar_tail = "ds(1) + 65536 * ds((out0_d1 - 1) % 128 + 1)"
step = "3 * chunks"
step_tail = "step + 65536 * ds((channels - 1) % 128 + 1)"
batchstep = "out0_d1 * step"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / 128)", 128]
[inputs.weights]
shape = ["6 * chunks", 128]
[inputs.stats]
shape = [8, 128]
[scratch.tmp]
shape = ["32 + 3 * chunks * (rows + 1)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * tiles", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
tmp = "CR4"
weights = "CR5"
stats = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
qf_weights = "CR9"
qf_stats = "CR10"
scalar_tail = "CR11"
chunks = "CR12"
rows = "CR13"
step_tail = "CR14"
[cases.default]
