[kernel]
op = "gemm_binary_add"
formats = ["e2"]

[params.s0_bias]
type = "bool"
default = true
[params.s0_k]
type = "int"
min = 1
max = 8192
default = 384
[params.s0_m]
type = "int"
min = 1
max = 2080800
default = 256
[params.s0_n]
type = "int"
min = 1
max = 4096
default = 384
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 1
max = 8522956800
default = 98304
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"
[params.in0_d0]
type = "int"
min = 1
max = 255
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 8192
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 8192
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 32
[params.in1_d0]
type = "int"
min = 1
max = 255
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 8192
default = 256
[params.in1_d2]
type = "int"
min = 1
max = 4096
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 255
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 8192
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 384

[derived]
blocks = "ceil(in1_d1 / 128)"
tiles = "ceil(out0_d2 / 128)"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
last_lane = "in0_d3 - 1"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d2 * blocks", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * (s0_k + 1) * 6", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * tiles", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
full = "CR9"
tail = "CR10"
blocks = "CR11"
tiles = "CR12"
s0_k = "CR13"
last_lane = "CR14"
out0_d1 = "CR15"

[cases.default]
