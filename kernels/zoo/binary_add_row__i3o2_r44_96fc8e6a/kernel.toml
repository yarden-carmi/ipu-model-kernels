[kernel]
op = "binary_add_row"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["row"], default = "row" }
const = { type = "int", min = 1, max = 1, default = 1 }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 1, default = 4096 }
numel = { type = "int", min = 1, default = 32768 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 8 }
in0_d2 = { type = "int", min = 1, max = 128, default = 64 }
in0_d3 = { type = "int", min = 1, max = 128, default = 64 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 8 }
out0_d2 = { type = "int", min = 1, max = 128, default = 64 }
out0_d3 = { type = "int", min = 1, max = 128, default = 64 }

[derived]
pack = "1 + 64 // in0_d3"
input_rows = "(in0_d0 * in0_d1 * in0_d2 + pack - 1) // pack"
output_rows = "out0_d0 * out0_d1 * out0_d3"
bias_rows = "out0_d3 + (output_rows - out0_d3) * min(1, out0_d2 * out0_d3 % inner)"
width_pack = "in0_d3 + 65536 * pack"
height = "out0_d2"
ds_pair = "ds(1) + 65536 * ds(out0_d2)"
batch_gap = "(out0_d3 - 1) * out0_d1"

[inputs.in0]
shape = ["input_rows", 128]
[inputs.operand]
shape = ["bias_rows", 128]
[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_operand = "CR6"
qf_out0 = "CR7"
width_pack = "CR8"
height = "CR9"
ds_pair = "CR10"
out0_d0 = "CR11"
out0_d1 = "CR12"
batch_gap = "CR13"
bias_rows = "CR14"

[cases.default]
