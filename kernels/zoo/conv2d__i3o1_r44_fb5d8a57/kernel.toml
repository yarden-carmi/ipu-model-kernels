[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 64
[params.cout]
type = "int"
min = 1
max = 128
default = 64
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 2
max = 512
default = 56
[params.w]
type = "int"
min = 2
max = 127
default = 56
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [0, 1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 64
[params.in0_d2]
type = "int"
min = 2
max = 512
default = 56
[params.in0_d3]
type = "int"
min = 2
max = 127
default = 56
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 512
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 127
default = 56

[derived]
full = "ds(128)"
tail = "ds(out0_d1)"
plane_rows = "in0_d1 * in0_d2"
tap_rows = "9 * in0_d1"
y_end = "out0_d2 * stride - padding"
x_end = "out0_d3 * stride"
zero_row = "3 + 3 * tap_rows"

[inputs.in0]
shape = ["in0_d0 * plane_rows", 128]
range = [-1, 1]
[inputs.weights]
shape = ["zero_row + 1", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
in0_d2 = "CR9"
in0_d1 = "CR10"
tap_rows = "CR11"
plane_rows = "CR12"
y_end = "CR13"
x_end = "CR14"
in0_d3 = "CR15"
zero_row = "LR14"
out0_d0 = "LR3"

[cases.default]
