chain = ["binary"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [0, 2, 1]

[view.in0]
kind = "whole"

[layout.in1]
lanes = 1
rows = [0, 2, 3]

[view.in1]
kind = "whole"

# Match the activation input so each product can be stored without a transpose.
[layout.out0]
lanes = 3
rows = [0, 2, 1]
