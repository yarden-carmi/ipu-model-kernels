[kernel]
op = "binary_mul_col"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["col"], default = "col" }
op = { type = "str", choices = ["mul"], default = "mul" }
inner = { type = "int", default = 144 }
numel = { type = "int", default = 28224 }
in0_d0 = { type = "int", default = 1 }
in0_d1 = { type = "int", default = 144 }
in0_d2 = { type = "int", default = 14 }
in0_d3 = { type = "int", default = 14 }
in1_d0 = { type = "int", default = 1 }
in1_d1 = { type = "int", default = 144 }
in1_d2 = { type = "int", default = 1 }
in1_d3 = { type = "int", default = 1 }
out0_d0 = { type = "int", default = 1 }
out0_d1 = { type = "int", default = 144 }
out0_d2 = { type = "int", default = 14 }
out0_d3 = { type = "int", default = 14 }

[derived]
valid = "ds(in0_d3)"
last_y = "in0_d2 - 1"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d1", 128]
range = [-2, 2]
[inputs.in1]
shape = ["(inner + 127) // 128", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d1", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
inner = "CR8"
last_y = "CR9"
valid = "CR15"

[cases.default]
