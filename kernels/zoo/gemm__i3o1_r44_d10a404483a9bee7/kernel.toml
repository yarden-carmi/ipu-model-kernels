[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
default = 128
[params.m]
type = "int"
min = 1
default = 4096
[params.n]
type = "int"
min = 1
default = 64
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 128
[params.in0_d2]
type = "int"
min = 1
default = 64
[params.in0_d3]
type = "int"
min = 1
default = 64
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 64
[params.out0_d2]
type = "int"
min = 1
default = 64
[params.out0_d3]
type = "int"
min = 1
default = 64

[derived]
careful = "min(1, max(0, n - 64)) * min(1, max(0, 128 - n))"
span = "8 + 8 * careful"
blocks = "(k - 1) // span"
weight_rows = "2 * k - (1 - careful) * (3 * (k // 8) + min(3, (k % 8) // 2)) - careful * (5 * (k // 16) + (k % 16) // 3)"
chunks = "ceil(in0_d3 / 128)"
input_width = "in0_d3"
stripe_step = "in0_d1 * chunks - chunks + 1"
pack = "1 + min(1, 64 // out0_d1)"
tiles = "ceil(out0_d1 * pack / 128)"
points = "out0_d0 * out0_d2 * out0_d3"
groups = "ceil(points / pack)"
full = "ds(128)"
valid = "(out0_d1 * pack - 1) % 128 + 1"
tail = "ds(valid)"
last_items = "(points - 1) % pack + 1"
last_ds = "ds((out0_d1 * last_items - 1) % 128 + 1)"
items = "min(points, pack)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d1 * chunks", 128]
range = [-2, 2]
[inputs.w]
shape = ["weight_rows * tiles * items", 128]
range = [-1, 1]
[inputs.b]
shape = ["2 * tiles", 128]
range = [-1, 1]
[outputs.out0]
shape = ["groups * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
b = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
tail = "CR9"
last_ds = "CR10"
chunks = "CR11"
tiles = "CR12"
pack = "CR13"
input_width = "CR14"
blocks = "CR15"
points = "LR5"
stripe_step = "LR13"

[cases.default]
