[kernel]
op = "gemm"
formats = ["e1"]
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 128
default = 72
[params.m]
type = "int"
min = 1
max = 65536
default = 784
[params.n]
type = "int"
min = 1
max = 65536
default = 24
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 72
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 28
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 24
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 28
[derived]
channels = "out0_d1"
group_size = "min(128, 3 * out0_d3)"
groups = "ceil(out0_d2 / 3)"
last_size = "min(128, ((out0_d2 - 1) % 3 + 1) * out0_d3)"
full = "ds(128)"
group_ds = "ds(min(128, 3 * out0_d3))"
last_ds = "ds(min(128, ((out0_d2 - 1) % 3 + 1) * out0_d3))"
second_size = "max(0, 3 * out0_d3 - 128)"
last_second_size = "max(0, ((out0_d2 - 1) % 3 + 1) * out0_d3 - 128)"
second_ds = "ds(max(1, min(128, 3 * out0_d3 - 128)))"
last_second_ds = "ds(max(0, min(128, ((out0_d2 - 1) % 3 + 1) * out0_d3 - 128)))"
[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * ceil(in0_d1 / 128)", 128]
[inputs.w]
shape = ["n * 5", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * groups * ceil(3 * out0_d3 / 128)", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
channels = "CR7"
group_size = "CR8"
groups = "CR9"
last_size = "CR10"
full = "CR11"
group_ds = "CR12"
last_ds = "CR13"
second_ds = "CR14"
last_second_ds = "CR15"
[golden]
tolerance = {e1 = "NX8_STEP"}
[cases.default]
