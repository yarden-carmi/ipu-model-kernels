[kernel]
op = "row_norm"
formats = ["e2"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 1
max = 4096
default = 144
[params.rows]
type = "int"
min = 1
max = 65536
default = 1024
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-5
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 144
[params.in0_d2]
type = "int"
min = 1
default = 32
[params.in0_d3]
type = "int"
min = 1
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 144

[derived]
K = "ceil(channels / 128)"
tiles = "ceil(out0_d1 / 128)"
ds_c = "ds(channels - (K - 1) * 128) + 65536 * ds(128)"
ds_t = "ds(out0_d1 - (tiles - 1) * 128) + 65536 * tiles"
step = "out0_d0 * K"
chunkinfo = "K + 65536 * channels"
half = "1277440"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * ceil(in0_d1 / 128)", 128]
[inputs.affine]
shape = ["6 * K", 128]
[inputs.stats]
shape = [5, 128]
[scratch.tmp]
shape = ["32 + 2 * K", 128]
[scratch.tile]
shape = ["256 * K", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * tiles", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
affine = "CR6"
stats = "CR7"
qf_affine = "CR8"
tmp = "CR9"
tile = "CR10"
ds_c = "CR11"
ds_t = "CR12"
chunkinfo = "CR13"
step = "CR14"
half = "CR15"
out0_d1 = "LR15"

[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
