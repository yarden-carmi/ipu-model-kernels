[kernel]
op = "gemm_builtin"
formats = ["e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 16
[params.n]
type = "int"
min = 1
max = 4096
default = 72
[params.m]
type = "int"
min = 1
max = 1048576
default = 3136
[params.in0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 72
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[derived]
full = "ds(128)"
vertical = "ds(out0_d2)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d1", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * 3 * (k + 1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d3", 128]
[scratch.strips]
shape = ["3 * in0_d3 * k", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
strips = "CR5"
qf_in0 = "CR6"
qf_coeff = "CR7"
qf_out0 = "CR8"
k = "CR9"
n = "CR10"
in0_d3 = "CR11"
in0_d2 = "CR12"
in0_d0 = "CR13"
full = "CR14"
vertical = "CR15"

[cases.default]
