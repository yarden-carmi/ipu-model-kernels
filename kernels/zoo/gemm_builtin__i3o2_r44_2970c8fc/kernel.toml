[kernel]
op = "gemm"
formats = ["e1", "e2"]
[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 16
[params.m]
type = "int"
min = 1
max = 2147483647
default = 3136
[params.n]
type = "int"
min = 1
max = 4096
default = 72
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 72
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56
[derived]
tiles = "ceil(in0_d3 / 128)"
row_stride = "in0_d1 * tiles"
chunks = "ceil(k / 128)"
full_ds = "ds(128)"
tail_ds = "ds(out0_d3 - (ceil(out0_d3 / 128) - 1) * 128)"
y_tail = "ds(out0_d2 - (ceil(out0_d2 / 128) - 1) * 128)"
tmp_pitch = "4 * n * tiles"
tmp_batch = "out0_d2 * tmp_pitch"
[inputs.in0]
shape = ["in0_d0 * in0_d2 * row_stride", 128]
[inputs.w]
shape = ["4 * n * (1 + chunks)", 128]
[scratch.tmp]
shape = ["out0_d0 * out0_d2 * tmp_pitch", 128]
[scratch.trans]
shape = [8, 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d3 * ceil(out0_d2 / 128)", 128]
[abi]
in0 = "CR2"
w = "CR3"
tmp = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full_ds = "CR7"
tiles = "CR8"
in0_d2 = "CR9"
row_stride = "CR10"
n = "CR11"
trans = "CR12"
out0 = "CR13"
tmp_pitch = "CR14"
y_tail = "CR15"
[cases.default]
