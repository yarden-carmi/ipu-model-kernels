# unary_log: y = log(x) elementwise over numel elements, one parameterised program.
#
#   fn    : log (the only function this program realises)
#   numel : elements of x and of y
#
# The input range is [0.5, 2]: the program's range reduction is an affine
# substitution with dyadic constants, u = x - 1.25, so |u| <= 0.75 and a
# degree-3 Chebyshev monomial of u reaches the output grid with room to spare.
# Wider ranges would need a higher degree -- one more XMEM power row and one
# more constant CR per degree, and the chip has exactly fourteen CRs to give.
# The host tiles nothing but numel.
#
# Hardware-clean NX8 (formats = ["dynamic"]): every store is an
# ACTIVATE.QUANTIZE (identity or the prologue's exp2(0) ones row), the
# accumulators are FP32, and no emulator-only instruction appears.
#
# Dataflow, per 128-lane row (14 words):
#
#   u  = x - 1.25              MULT.VE by CR1 (1.0) seeded with ACC.ADD.FIRST,
#                              then the constant via MULT.EE off R1[0] = 1.0
#                              (R1 is the program's own exp2(0) ones row, so
#                              the host prepares no constant) and an identity
#                              store -- the one NX8 round trip the substitution
#                              needs.
#   u2 = u * u                 MULT.RC.VS on the cyclic window, identity store.
#   u3 = u2 * u                MULT.RC.VV of the reloaded u2 against R0 = u.
#   y  = b0 + b1 u + b2 u2 + b3 u3
#                              four ACC words: b0 and the powers enter through
#                              MULT_RES only, so the sum is seeded with b0
#                              (MULT.EE off the ones row) after the ladder has
#                              finished with R_ACC, then b3 u3, b2 u2 and b1 u
#                              are accumulated and the row is stored.
#
# The multiplier's only inputs are the LOAD-filled stages, so every serial
# dependence (u, u2, u3) is one NX8 row round trip; the polynomial's sums stay
# in FP32 registers. The coefficients are the dyadic roundings of the exact
# degree-3 minimax monomials (7 significant bits each, the MULT constant's
# width); reference.py computes the same polynomial with the same constants in
# float64, so the kernel's own residual against the golden is the row
# round-trips and the FP32 accumulation, measured in output-row steps below.
#
# XMEM: x, y, u, u2 and u3 are one row per 128 elements plus the ones row and
# the mask row: 5*rows + 2 <= 16384 addressable NX8 rows, hence the numel
# maximum of 419328 (3276 rows). There is no FP32 variant: it addresses 4096
# rows only, and dynamic is the chip's type.

[kernel]
op = "unary"
formats = ["dynamic"]

[params]
fn    = { type = "str", choices = ["log"], default = "log" }
numel = { type = "int", min = 1, max = 419328 }   # 3276 rows: 5*rows + 2 XMEM rows
# The program's constants: dyadic fractions, so the NX8 MULT constant (7
# significant bits with its own scale and type) holds them exactly. b0..b3 are
# the dyadic roundings of the degree-3 minimax monomials of u = x - 1.25 over
# [0.5, 2] (truncation 8.5e-3, under one step of the output row's grid).
c  = { type = "float", choices = [-1.25], default = -1.25 }          # the substitution's offset
b0 = { type = "float", choices = [0.228515625], default = 0.228515625 }
b1 = { type = "float", choices = [0.7890625], default = 0.7890625 }
b2 = { type = "float", choices = [-0.39453125], default = -0.39453125 }
b3 = { type = "float", choices = [0.234375], default = 0.234375 }

[derived]
rows  = "ceil(numel / 128)"                       # x's, y's and every intermediate's rows
tail  = "numel - 128 * (rows - 1)"                # the last row's live lanes
qf    = "case_qf"                                 # CR14: the case's QF half
ds    = "halves(ds(128), ds(tail))"               # CR15: full row / last row

[inputs.x]
shape = ["numel"]
range = { nx8 = [0.5, 2] }                        # u = x - 1.25 stays in [-0.75, 0.75]

[outputs.y]
shape = ["numel"]

[scratch.u]
shape = ["rows", 128]                             # x - 1.25

[scratch.p2]
shape = ["rows", 128]                             # u^2

[scratch.p3]
shape = ["rows", 128]                             # u^3

[scratch.one]
shape = [1, 128]                                  # exp2(0): the ones row every constant add broadcasts from

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"                       # LD.MASK: every lane active, whatever a previous kernel left

[abi]
x     = "CR2"
u     = "CR3"
p2    = "CR4"
p3    = "CR5"
one   = "CR6"
y     = "CR7"
maskr = "CR8"
c     = "CR9"
b0    = "CR10"
b1    = "CR11"
b2    = "CR12"
b3    = "CR13"
qf    = "CR14"
ds    = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: the golden is the same polynomial with the same dyadic constants in
# float64; the kernel's residual is its four NX8 row round-trips (u, u2, u3 and
# the output store) plus the FP32 accumulation, each a fraction of the output
# row's grid step.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 6, why = "4 NX8 row round-trips (u, u2, u3 and the output store), each quantized against its own row's largest lane; measured in steps over every case" } }

[cases.default]                                   # google-t5/t5-small, x3 per forward
fn = "log"
numel = 4096

[cases.log_65536]                                 # google-t5/t5-small, x3 per forward
fn = "log"
numel = 65536

[cases.one]                                       # the narrowest call: one lane, one row
fn = "log"
numel = 1

[cases.tile]                                      # exactly one 128-lane row
fn = "log"
numel = 128

[cases.tail]                                      # one row and a lane
fn = "log"
numel = 129

[cases.two_rows]                                  # straight-line bodies, no loop
fn = "log"
numel = 200

[cases.sweep]                                     # the structure of the calls, scaled down
fn = "log"
numel = [1, 2, 5, 127, 128, 129, 130, 255, 256, 257, 1000, 4096]
