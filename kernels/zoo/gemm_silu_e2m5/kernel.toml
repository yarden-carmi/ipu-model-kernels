[kernel]
op = "gemm_silu"
formats = ["e2"]

[params.m]
type = "int"
min = 64
max = 16384
multiple_of = 64
default = 64

[params.k]
type = "int"
min = 16
max = 240
multiple_of = 16
default = 16

[params.n]
type = "int"
min = 64
max = 640
multiple_of = 32
default = 64

[params.bias]
type = "bool"
default = true

[derived]
qf = "case_qf"
kp = "ceil(k / 128)"
nb = "ceil(n / 128)"
dsn = "ds(max(min(n - (nb - 1) * 128, 128), 0))"
dsk0 = "ds(max(min(k, 128), 0))"
dsk1 = "ds(max(min(k - 128, 128), 0))"

[inputs.in0]
shape = ["m", "kp * 128"]
range = [-2.0, 2.0]

[inputs.w]
shape = ["kp * nb", 128]
range = [-2.0, 2.0]

[inputs.bias_vec]
shape = ["nb", 128]
range = [-1.0, 1.0]

[inputs.lut]
shape = [5, 128]
range = [0.0, 1.0]

[outputs.out0]
shape = ["m", "nb * 128"]

[abi]
in0 = "CR2"
w = "CR3"
bias_vec = "CR4"
lut = "CR5"
out0 = "CR6"
qf = "CR7"
dsk1 = "CR8"
dsk0 = "CR9"
m = "CR10"
dsn = "CR11"

[golden]
tolerance = { e2 = "NX8_STEP" }

[cases.default]

[cases.small]
m = 128
k = 144
n = 288

[cases.wide_n]
m = 64
k = 160
n = 640

[cases.wide_k]
m = 64
k = 240
n = 96

[cases.nobias]
m = 128
k = 96
n = 128
bias = false
