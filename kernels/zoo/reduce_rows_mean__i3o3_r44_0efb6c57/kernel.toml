[kernel]
op = "reduce_rows_mean"
formats = ["e1"]

[params.kind]
type = "str"
choices = ["mean"]
default = "mean"
[params.n]
type = "int"
min = 1
max = 65536
default = 3136
[params.rows]
type = "int"
min = 1
max = 16384
default = 16
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 16
[params.out0_d2]
type = "int"
choices = [1]
default = 1
[params.out0_d3]
type = "int"
choices = [1]
default = 1

[derived]
capacity = "128 // in0_d3"
candidate = "min(in0_d2, capacity)"
fallback = "min(1, in0_d2 % candidate)"
pack = "1 + (candidate - 1) * (1 - fallback) + (1 - in0_d2 % 2) * fallback * min(1, 64 // in0_d3)"
spatial = "in0_d2 // pack"
lanes = "in0_d3 * pack"
active = "ds(lanes)"
full = "ds(128)"
width = "ds(8)"
body = "n - n % 8"
one = "ds(1)"
# Round the normalized reciprocal into a scalar mantissa with a separate scale.
shift = "min(1, (n-1)//1) + min(1, (n-1)//2) + min(1, (n-1)//4) + min(1, (n-1)//8) + min(1, (n-1)//16) + min(1, (n-1)//32) + min(1, (n-1)//64) + min(1, (n-1)//128) + min(1, (n-1)//256) + min(1, (n-1)//512) + min(1, (n-1)//1024) + min(1, (n-1)//2048) + min(1, (n-1)//4096) + min(1, (n-1)//8192) + min(1, (n-1)//16384) + min(1, (n-1)//32768)"
factor = "1 + min(1, (n-1)//1) + 2*min(1, (n-1)//2) + 4*min(1, (n-1)//4) + 8*min(1, (n-1)//8) + 16*min(1, (n-1)//16) + 32*min(1, (n-1)//32) + 64*min(1, (n-1)//64) + 128*min(1, (n-1)//128) + 256*min(1, (n-1)//256) + 512*min(1, (n-1)//512) + 1024*min(1, (n-1)//1024) + 2048*min(1, (n-1)//2048) + 4096*min(1, (n-1)//4096) + 8192*min(1, (n-1)//8192) + 16384*min(1, (n-1)//16384) + 32768*min(1, (n-1)//32768)"
inv = "65536 + 256 * (127 - shift) + min(127, (256 * factor + n) // (2 * n) - 128)"
inv_fp32 = "8388608 * (127 - shift) + (8388608 * factor + n // 2) // n - 8388608"

[inputs.in0]
shape = ["rows * spatial", 128]
[outputs.out0]
shape = ["rows", 128]
[scratch.tmp]
shape = [1, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
spatial = "CR6"
active = "CR7"
rows = "CR8"
inv = "CR9"
inv_fp32 = "CR10"
tmp = "CR11"
lanes = "CR12"
full = "CR13"
width = "CR14"
body = "LR10"
one = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP" }

[cases.default]
