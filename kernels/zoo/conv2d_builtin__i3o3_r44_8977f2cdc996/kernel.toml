[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
choices = [true]
default = true
[params.groups]
type = "int"
choices = [1]
default = 1
[params.cin]
type = "int"
min = 1
max = 512
default = 64
[params.cout]
type = "int"
min = 1
max = 512
default = 32
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 1
max = 512
default = 64
[params.w]
type = "int"
min = 1
max = 256
default = 64
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 64
[params.out0_d1]
type = "int"
min = 1
max = 512
default = 32
[params.in0_d2]
type = "int"
min = 1
max = 512
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 512
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 256
default = 64

[derived]
candidate = "max(1, 128 // in0_d3)"
pack = "1 + (candidate - 1) * (1 - min(1, in0_d2 % candidate))"
chunks = "ceil(in0_d3 / 128)"
tiles = "in0_d2 // pack * chunks"
input_rows = "cin * tiles"
taps = "(9 + 6 * min(1, pack - 1 + chunks - 1)) * cin"
weight_rows = "cout * (2 + 2 * ceil(taps / 128))"
full = "ds(128)"
tail = "ds((pack * in0_d3 - 1) % 128 + 1)"
parts = "2"
panels = "taps // 128"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[inputs.masks]
shape = ["1 + chunks * (taps // cin)", 128]
range = [0, 1]
[scratch.patches]
shape = ["taps", 128]
[outputs.out0]
shape = ["cout * tiles", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
masks = "CR5"
patches = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
full = "CR9"
tail = "CR10"
tiles = "CR11"
input_rows = "CR12"
weight_rows = "CR13"
parts = "CR14"
panels = "CR15"

[cases.default]
