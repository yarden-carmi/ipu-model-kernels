[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 50176
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 224
[params.in0_d3]
type = "int"
min = 1
max = 2147483647
default = 224
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 224
[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 224

[derived]
chunks = "ceil(in0_d1 / 128)"
groups = "in0_d0 * in0_d2 * in0_d3"
out_rows = "out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)"
ds_pair = "ds((out0_d1 - 1) % 128 + 1) + ds(128) * 65536"

[inputs.in0]
shape = ["groups * chunks", 128]
range = [0, 2]
[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
chunks = "CR6"
groups = "CR7"
ds_pair = "CR8"

[cases.default]
