[kernel]
op = "gemm_table"
formats = ["e1"]

[params.act_out0]
type = "str"
choices = ["hardswish", "silu", "hardsigmoid"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 96
[params.m]
type = "int"
min = 1
max = 65535
default = 49
[params.n]
type = "int"
min = 1
max = 4096
default = 576
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 96
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 7
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 7
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 576
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 7
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 7

[derived]
chunks = "(k + 127) // 128"
pack = "1 + (128 // out0_d3 - 1) * (1 - min(1, n % (128 // out0_d3)))"
tiles = "n // pack"
coeff_rows = "1 + tiles * (2 + 2 * k)"
full = "ds(128)"
active = "ds(pack * out0_d3)"
lines = "m // out0_d3"
negative_width = "0 - out0_d3"
zero_slot = "384"
tap_groups = "((k - 1) % 128) // 8"
full_groups = "16"
full_chunks = "chunks - 1"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * ((in0_d1 + 127) // 128)", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * tiles", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
active = "CR9"
chunks = "CR10"
negative_width = "CR11"
tiles = "CR12"
lines = "CR13"
tap_groups = "CR14"
full_chunks = "CR15"
zero_slot = "LR15"
full_groups = "LR14"

[cases.default]
