[kernel]
op = "bmm"
formats = ["e2"]

[params.b]
type = "int"
min = 1
max = 256
default = 8
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 4096
default = 64
[params.n]
type = "int"
min = 1
max = 128
default = 64
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 512
[params.in1_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 128
default = 64
[params.in1_d2]
type = "int"
min = 1
max = 65536
default = 512
[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "in1_d2"]
range = [-2, 2]
[scratch.trans]
shape = ["b*k", 128]
[outputs.out0]
shape = [1, "b", "m", "n"]

[derived]
arows = "ceil(in0_d2/128)"
brows = "ceil(in1_d2/128)"
total = "b*k"
dsfull = "ds(128)"
dsout = "ds(n)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
k = "CR6"
m = "CR7"
n = "CR8"
arows = "CR9"
dsout = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
dsfull = "CR14"
trans = "CR15"
brows = "LR4"
total = "LR10"

[cases.default]
