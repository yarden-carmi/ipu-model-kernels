[kernel]
op = "bmm"
formats = ["e3"]

[params]
b = {type="int", min=1, max=2147483647, default=12}
# Each head must fit inside a single input row without crossing its boundary.
k = {type="int", choices=[1,2,4,8,16,32,64,128], default=64}
m = {type="int", min=1, max=32767, default=50}
n = {type="int", min=1, max=32767, default=50}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=32767, default=50}
in0_d2 = {type="int", min=1, max=4194176, default=768}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=32767, default=50}
in1_d2 = {type="int", min=1, max=4194176, default=768}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=12}
out0_d2 = {type="int", min=1, max=32767, default=50}
out0_d3 = {type="int", min=1, max=32767, default=50}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "a_stride*128"]
range = [-1, 1]

[inputs.in1]
shape = ["in1_d0", "in1_d1", "b_stride*128"]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[scratch.rotated]
shape = [128]

[derived]
a_stride = "ceil(in0_d2/128)"
b_stride = "ceil(in1_d2/128)"
strides = "a_stride+65536*b_stride"
sizes = "m+65536*n"
heads = "k+65536*out0_d1"
a_gap = "in0_d1*a_stride-(out0_d1*k)//128"
b_gap = "in1_d1*b_stride-(out0_d1*k)//128"
ds_main = "ds(128)+65536*ds(k)"
ds_tail = "ds((n-1)%128+1)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
strides = "CR8"
sizes = "CR9"
heads = "CR10"
a_gap = "CR11"
b_gap = "CR12"
ds_main = "CR13"
ds_tail = "CR14"
rotated = "CR15"
out0_d0 = "LR13"

[cases.default]
