[kernel]
op = "bmm"
formats = ["e2", "e3"]
[params]
b = {type="int", min=1, max=512, default=12}
k = {type="int", choices=[1,2,4,8,16,32,64,128], default=64}
m = {type="int", min=1, max=2048, default=50}
n = {type="int", min=1, max=2048, default=50}
in0_d0 = {type="int", min=1, max=1, default=1}
in0_d1 = {type="int", min=1, max=2048, default=50}
in0_d2 = {type="int", min=1, max=65536, default=768}
in1_d0 = {type="int", min=1, max=1, default=1}
in1_d1 = {type="int", min=1, max=2048, default=50}
in1_d2 = {type="int", min=1, max=65536, default=768}
out0_d0 = {type="int", min=1, max=1, default=1}
out0_d1 = {type="int", min=1, max=512, default=12}
out0_d2 = {type="int", min=1, max=2048, default=50}
out0_d3 = {type="int", min=1, max=2048, default=50}
[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2/128)*128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "ceil(in1_d2/128)*128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]
[scratch.rotated]
shape = ["n+1", 128]
[scratch.transpose]
shape = [384, 128]
[derived]
arows = "ceil(in0_d2/128)"
brows = "ceil(in1_d2/128)"
strides = "arows+65536*brows"
sizes = "m+65536*n"
heads = "k+65536*b"
ds_main = "ds(128)+65536*ds(k)"
ds_tail = "ds((n-1)%128+1)"
fast = "(k//64)*(1-k//128)*((n//128)*128//n)*(1-b%2)"
tiles = "n//128"
tile_step = "128*brows"
halfb = "b//2"
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
strides = "CR8"
sizes = "CR9"
heads = "CR10"
transpose = "CR11"
tiles = "CR12"
ds_main = "CR13"
ds_tail = "CR14"
rotated = "CR15"
fast = "LR0"
tile_step = "LR1"
halfb = "LR2"
[cases.default]
b = 12
