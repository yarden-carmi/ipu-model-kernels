[kernel]
op = "binary_add_none"
formats = ["e1"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
const = { type = "int", min = 1, max = 1, default = 1 }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 576000 }
in0_d0 = { type = "int", min = 1, max = 4096, default = 1 }
in0_d1 = { type = "int", min = 1, max = 16384, default = 384 }
in0_d2 = { type = "int", min = 1, max = 16384, default = 1500 }
out0_d0 = { type = "int", min = 1, max = 4096, default = 1 }
out0_d1 = { type = "int", min = 1, max = 16384, default = 1500 }
out0_d2 = { type = "int", min = 1, max = 16384, default = 384 }

[derived]
ic = "ceil(in0_d1 / 128)"
oc = "ceil(out0_d1 / 128)"
rows = "out0_d0 * out0_d2 * oc"
one = "ds(1)"
tail = "ds(out0_d1 - (oc - 1) * 128)"
blockstride = "ic * 128"
batchstride = "ic * in0_d2"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "ic * 128"]
[inputs.constant]
shape = ["out0_d0", "out0_d2", "oc * 128"]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "oc * 128"]

[abi]
in0 = "CR2"
constant = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_constant = "CR6"
qf_out0 = "CR7"
rows = "CR8"
one = "CR9"
tail = "CR10"
out0_d1 = "CR11"
out0_d2 = "CR12"
blockstride = "CR13"
batchstride = "CR14"

[cases.default]
