[kernel]
op = "conv2d"
formats = ["e2"]
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 3
[params.cout]
type = "int"
min = 1
max = 2048
default = 128
[params.groups]
type = "int"
min = 1
max = 1
default = 1
[params.h]
type = "int"
min = 1
max = 1024
default = 4
[params.w]
type = "int"
min = 1
max = 1024
default = 4
[params.kh]
type = "int"
min = 1
max = 16
default = 2
[params.kw]
type = "int"
min = 1
max = 16
default = 2
[params.padding]
type = "int"
min = 0
max = 16
default = 0
[params.stride]
type = "int"
min = 1
max = 16
default = 2
[derived]
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
blocks = "ceil(cout / 128)"
full = "ds(128)"
endrows = "ho * wo * blocks"
valid = "ds((cout - 1) % 128 + 1)"
[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2 / 128) * 128"]
range = [-2, 2]
[inputs.weights]
shape = ["blocks", "1 + kh * kw * cin", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", "ceil(out0_d1 / 128) * 128"]
[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
cin = "CR7"
valid = "CR12"
blocks = "CR8"
h = "CR9"
w = "CR10"
endrows = "CR11"
full = "CR15"
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1048576
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 3
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2048
default = 128
[params.out0_d2]
type = "int"
min = 1
max = 1024
default = 2
[params.out0_d3]
type = "int"
min = 1
max = 1024
default = 2
[cases.default]
[cases.patch16]
h = 16
w = 32
kh = 16
kw = 16
stride = 16
cout = 384
[golden]
tolerance = { e2 = "NX8_STEP" }
