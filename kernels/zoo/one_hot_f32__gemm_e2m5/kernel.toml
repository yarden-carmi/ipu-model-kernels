[kernel]
op = "one_hot_gemm"
formats = ["e2"]

[params.s0_tokens]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 256

[params.s0_vocab]
type = "int"
min = 1
max = 151669
default = 151669

[params.s1_bias]
type = "bool"
default = false

[params.s1_k]
type = "int"
min = 1
max = 151669
default = 151669

[params.s1_m]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 256

[params.s1_n]
type = "int"
min = 128
max = 1024
multiple_of = 128
default = 1024

[params.sharp]
type = "float"
default = 1024.0

[params.neg1]
type = "float"
default = -1.0

[params.six]
type = "float"
default = 6.0

[derived]
qf = "case_qf"
ntb = "s1_m // 128"
nb = "s1_n // 128"
ke = "min(s0_vocab, 8)"
nscr = "(3 * ke + 2) * ntb"

[inputs.in0]
shape = [1, "s1_m"]
range = [0.0, 7.0]

[inputs.w]
shape = ["s0_vocab", "s1_n"]
range = [-2.0, 2.0]

[inputs.ones]
shape = [1, 128]
range = [1.0, 1.0]

[scratch.scr]
shape = ["nscr", 128]

[outputs.out0]
shape = [1, "s1_m", "s1_n"]

[abi]
in0 = "CR2"
w = "CR3"
ones = "CR4"
scr = "CR5"
out0 = "CR6"
qf = "CR7"
sharp = "CR8"
neg1 = "CR9"
six = "CR10"

[golden]
tolerance = { e2 = "NX8_STEP" }

[cases.default]
s0_tokens = 128
s0_vocab = 9
s1_k = 9
s1_m = 128
s1_n = 128

[cases.small]
s0_tokens = 128
s0_vocab = 9
s1_k = 9
s1_m = 128
s1_n = 128

[cases.two_channels]
s0_tokens = 128
s0_vocab = 8
s1_k = 8
s1_m = 128
s1_n = 256
