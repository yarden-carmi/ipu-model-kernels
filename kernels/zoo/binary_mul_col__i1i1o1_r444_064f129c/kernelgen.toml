chain = ["binary"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]
notes = "Per-channel scale of a channel-lane tensor: per block of 128 channels the scale row sits in R_CYCLIC, then each row of the tensor is loaded, multiplied lane-wise and stored in one pipelined word."
[layout.in0]
lanes = 1
rows = [0, 2, 3]
[view.in0]
kind = "whole"
[layout.in1]
lanes = 1
rows = [0, 2, 3]
[view.in1]
kind = "whole"
[layout.out0]
lanes = 1
rows = [0, 2, 3]
