chain = ["binary"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

# Match the output lane order to avoid an in-kernel spatial/channel transpose.
[layout.in0]
lanes = 1
rows = [0, 2, 3]
[view.in0]
kind = "whole"

[layout.in1]
lanes = 1
rows = [0, 2, 3]
[view.in1]
kind = "whole"

[layout.out0]
lanes = 1
rows = [0, 2, 3]
