[kernel]
op = "binary_mul_col"
formats = ["e1"]

[params.broadcast]
type = "str"
choices = ["col"]
default = "col"
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.inner]
type = "int"
min = 1
max = 16384
default = 16
[params.numel]
type = "int"
min = 1
max = 16777216
default = 192

[derived]
spatial_rows = "numel // inner"
rows_minus_one = "spatial_rows - 1"
blocks = "ceil(inner / 128)"
last_block = "blocks - 1"
full_size = "ds(128)"
tail_size = "ds(inner - 128 * last_block)"

[inputs.in0]
shape = ["spatial_rows", "blocks * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["blocks", 128]
range = [-2, 2]
[outputs.out0]
shape = ["spatial_rows", "blocks * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
blocks = "CR7"
last_block = "CR8"
rows_minus_one = "CR9"
qf_in1 = "CR10"
full_size = "CR15"
tail_size = "CR14"

[cases.default]
numel = 192
