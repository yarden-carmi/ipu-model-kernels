[kernel]
op = "binary_mul_col"
formats = ["e1"]

[params.broadcast]
type = "str"
choices = ["col"]
default = "col"
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.inner]
type = "int"
default = 576
[params.numel]
type = "int"
default = 28224
[params.in0_d2]
type = "int"
default = 7
[params.in0_d3]
type = "int"
default = 7

[derived]
plane = "in0_d2 * in0_d3"
blocks = "(inner + 127) // 128"
last_block = "blocks - 1"
last_pixel = "plane - 1"
prefetch_end = "plane - 2"
valid = "ds(128)"
last_valid = "ds((inner - 1) % 128 + 1)"

[inputs.in0]
shape = ["plane * blocks", 128]
range = [-2, 2]
[inputs.in1]
shape = ["(inner + 127) // 128", 128]
range = [-2, 2]
[outputs.out0]
shape = ["plane * blocks", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
blocks = "CR8"
plane = "CR9"
last_valid = "CR11"
last_block = "CR10"
last_pixel = "CR12"
prefetch_end = "CR13"
valid = "CR15"

[cases.default]
numel = 28224
