formats = ["e1", "e2"]
chain = ["conv2d"]
chain_in = ["in0"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [0, 1, 2]
[view.in0]
kind = "whole"

[layout.out0]
lanes = 3
rows = [1, 0, 2]
pack = "d2"
pad = "(-d2 * d3) % 128 + 128 * (1 - min(1, ceil(d2 * d3 / 128) % 2))"

[lut.out0]
range_mode = 2
range_exp = 40
