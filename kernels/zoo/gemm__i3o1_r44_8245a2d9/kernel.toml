[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 16
[params.n]
type = "int"
min = 1
max = 65536
default = 16
[params.m]
type = "int"
min = 1
max = 65536
default = 3136
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[derived]
capacity = "128 // in0_d3"
pack = "1 + (capacity - 1) * (1 - min(1, in0_d2 % capacity))"
pitch = "ceil(in0_d2 / pack)"
batch_skip = "(in0_d1 - 1) * pitch + 1"
packed_width = "pack * in0_d3"
tiles = "ceil(n / 128)"
full_tiles = "tiles - 1"
last = "ds((n - 1) % 128 + 1)"
full = "ds(128)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * pitch", 128]
[inputs.coeff]
shape = ["tiles * (2 * k + 1) + 1", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
qf_coeff = "CR7"
k = "CR8"
pitch = "CR9"
in0_d2 = "CR10"
packed_width = "CR11"
full_tiles = "CR12"
in0_d3 = "CR13"
last = "CR14"
full = "CR15"
batch_skip = "LR14"
in0_d0 = "LR15"

[cases.default]
