[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 16
[params.n]
type = "int"
min = 1
max = 4096
default = 16
[params.m]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 8

[derived]
blocks = "ceil(n / 128)"
last = "blocks - 1"
full_ds = "ds(128)"
tail_ds = "ds(n - 128 * last)"
stripes = "in0_d0 * in0_d2"

[inputs.in0]
shape = ["stripes * in0_d1", 128]
[inputs.coeff]
shape = ["blocks * 2 * (k + 1)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
k = "CR7"
stripes = "CR8"
in0_d1 = "CR9"
in0_d3 = "CR10"
last = "CR11"
full_ds = "CR12"
tail_ds = "CR13"

[cases.default]
