[kernel]
op = "binary_sub_scalar"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["sub"]
default = "sub"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 1024
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 512
[params.in0_d3]
type = "int"
min = 1
max = 2147483647
default = 2
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 512
[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 2

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d3 * ceil(in0_d2 / 128)", 128]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d3 * ceil(out0_d2 / 128)", 128]
[scratch.one]
shape = [1, 128]

[derived]
chunks = "ceil(in0_d2 / 128)"
groups = "in0_d0 * in0_d1 * in0_d3"
last_group = "groups - 1"
last_chunk = "chunks - 1"
last = "(in0_d2 - 1) % 128 + 1"
ds_pair = "ds(last) + ds(128) * 65536"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
chunks = "CR6"
groups = "CR7"
ds_pair = "CR8"
one = "CR9"
last_group = "CR10"
last_chunk = "CR11"

[cases.default]
