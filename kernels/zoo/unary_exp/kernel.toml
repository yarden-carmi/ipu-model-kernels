# unary: y = fn(x) elementwise over numel elements, tiled into 128-lane rows.
#
# One parameterised program for every (fn, numel): the rows are a dynamic loop
# whose bound is a CR, so a whole call is one launch and the host tiles nothing
# but numel. The layout is the plain activation layout -- row r of the tensor
# holds lanes 128r .. 128r+127, lanes past numel zero -- and y is written back
# exactly as x was read, so this kernel's output is the next kernel's input.
#
# Hardware-clean NX8 (formats = ["dynamic"]): every store is an ACTIVATE.QUANTIZE
# (exp2 and identity), no emulator-only instruction appears.
#
# fn = exp. The AaQ's exp2 rejects a positive argument, so the exponent
# argument is shifted below zero first and the shift is paid back with exact
# dyadic MULT constants:
#
#   e = exp2((x - 8) log2 e)   the AaQ exp2 store, on a row whose argument is
#                              <= 0 in every lane (x <= 8, the declared range;
#                              x = 8 gives exactly 0)
#   y = e * exp(8)             two MULT.RC.VE against the exp(8) terms, one
#                              identity store
#
# log2 e enters as the sum of two dyadic terms (one MULT.RC.VE each) and -8
# log2 e as two more (one MULT.EE each against the ones row -- the row is the
# program's own exp2(0) store -- since a constant term must come from Ra to
# avoid scaling with x), because one NX8 MULT constant (8 bits with its own
# scale and type) holds at most 7 significant bits. exp(8) is two terms,
# 2976 + 4.9375. The argument is exactly (x - 8) (c1 + c2), so the only errors
# are log2 e's 7e-6 truncation (a relative error of 8e-5 on y at worst) and
# the two 8-bit row round trips (e and the output store), see the tolerance.
#
# Cost: 7 words per row (4 + 3), 6 of which multiply.
#
# Memory: 3 rows per 128 lanes (x, e, y) plus the ones and mask rows:
# 3*rows + 2 <= 16384 addressable NX8 rows, hence the numel maximum of 698880
# (5460 rows). There is no FP32 variant: dynamic is the chip's NX8 type, and
# FP32 addresses 4096 rows only.
#
# The input range's top is 2, not the 8 the shift would allow, because the chip
# chains: the next launch of this very kernel reads this one's y = exp(x) as
# its x, and its exp2 argument (y - 8) log2 e must stay <= 0, i.e. y <= 8, i.e.
# x <= ln 8 = 2.079. Declared 2 (exp(2) = 7.39, a 7% margin under 8); a first
# run at the range top lands the second run's argument at -0.89.

[kernel]
op = "unary"
formats = ["dynamic"]

[params]
fn    = { type = "str", choices = ["exp"], default = "exp" }
numel = { type = "int", min = 1, max = 698880 }  # 5460 rows: 3*rows + 2 XMEM rows
# The program's constants: exact dyadic fractions, so the NX8 MULT constant (8
# bits with its own scale and type) holds them exactly. Sum to log2 e, 8 log2 e
# and exp(8); see the .asm header for the decomposition.
c1 = { type = "float", choices = [1.4375], default = 1.4375 }                      # log2 e, first term
c2 = { type = "float", choices = [0.00518798828125], default = 0.00518798828125 }  # log2 e, second
o1 = { type = "float", choices = [-11.5], default = -11.5 }                        # -8 log2 e, first
o2 = { type = "float", choices = [-0.04150390625], default = -0.04150390625 }      # -8 log2 e, second
d1 = { type = "float", choices = [2976.0], default = 2976.0 }                      # exp(8), first term
d2 = { type = "float", choices = [4.9375], default = 4.9375 }                      # exp(8), second

[derived]
rows  = "ceil(numel / 128)"                        # x's, e's and y's rows: the loop's trips
tail  = "numel - 128 * (rows - 1)"                 # the last row's live lanes
bound = "max(rows - 2 - ceil((128 - tail) / 127), 0)"  # the row loop's bound (trips - 1)
qf    = "case_qf"                                  # CR14: the case's QF half
ds    = "halves(ds(128), ds(tail))"                # CR15: full row / last row

[inputs.x]
shape = ["numel"]
range = { nx8 = [-8, 2] }         # exp2's argument is x log2 e - 8 log2 e <= 0 (x <= 8);
                                  # the top is 2, not 8, because a chained call's input is
                                  # the previous call's y = exp(x): exp(2) = 7.39 <= 8 keeps
                                  # the second launch's exp2 argument <= 0 too

[outputs.y]
shape = ["numel"]

[scratch.e]
shape = ["rows", 128]             # exp2((x - 8) log2 e), one row per row

[scratch.one]
shape = [1, 128]                  # exp2(0): the ones row the -8 log2 e terms broadcast from

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"       # LD.MASK: every lane active, whatever a previous kernel left

[abi]
x     = "CR2"
e     = "CR3"                     # exp2((x - 8) log2 e)
y     = "CR4"
one   = "CR5"                     # the ones row: MULT.EE broadcasts its element 0
c1    = "CR6"                     # log2 e, first term
c2    = "CR7"                     # log2 e, second
o1    = "CR8"                     # -8 log2 e, first
o2    = "CR9"                     # -8 log2 e, second
d1    = "CR10"                    # exp(8), first term
d2    = "CR11"                    # exp(8), second
bound = "CR12"                    # the row loop's bound: trips - 1
maskr = "CR13"                    # the mask row's base: every lane active
qf    = "CR14"
ds    = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: e is rounded to an 8-bit row, and the output store rounds y against its
# own row's largest lane, so a lane far below its row's top lane can sit a
# couple of steps off; measured max 2 steps.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 3, why = "2 NX8 row round-trips (e and the output store), each quantized against its own row's largest lane; measured max 2 steps" } }

[cases.default]                                # clip-vit-base-patch32's exp, x1 per forward
fn = "exp"
numel = 1

[cases.tile]                                   # exactly one 128-lane row
fn = "exp"
numel = 128

[cases.tail]                                   # one row and a lane
fn = "exp"
numel = 129

[cases.two_rows]                               # the loop's shortest trip
fn = "exp"
numel = 200

[cases.thousand]
fn = "exp"
numel = 1000

[cases.big]                                    # many rows, still cheap to emulate
fn = "exp"
numel = 30720

[cases.sweep]                                  # the structure of the calls
fn = "exp"
numel = [1, 2, 127, 128, 129, 255, 256, 1000, 4096]
