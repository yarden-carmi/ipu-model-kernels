unsupported = [
  "{\"fn\": \"relu\", \"numel\": 15360}: the AaQ has relu itself but this program's passes build exp; the relu-family kernels (unary_silu) cover the one-word fns.",
  "{\"fn\": \"gelu\", \"numel\": 15360}: the erf form has no hardware path (no erf activation, and the LUT's range is far too small); gelu_tanh is unary_silu's, to ~1e-3.",
  "{\"fn\": \"sigmoid\", \"numel\": 15360}: 1/(1+exp(-x)) needs the ones row and the reciprocal pass of unary_silu, not this kernel's two passes.",
  "{\"fn\": \"tanh\", \"numel\": 15360}: no tanh in the hardware AaQ list (only the emulator's ACTIVATE.EXACT has it).",
  "{\"fn\": \"rsqrt\", \"numel\": 15360}: the AaQ has rsqrt itself; one word per row, but not this program's exp passes -- a separate kernel would cover it.",
  "{\"fn\": \"silu\", \"numel\": 15360}: covered by unary_silu's four-pass program, which this kernel's two-pass exp shape does not render.",
