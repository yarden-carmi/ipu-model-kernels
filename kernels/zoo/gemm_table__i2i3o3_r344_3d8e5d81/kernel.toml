[kernel]
op = "gemm_table"
formats = ["e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 16
multiple_of = 16
max = 16384
default = 192
[params.m]
type = "int"
min = 64
multiple_of = 64
max = 16384
default = 256
[params.n]
type = "int"
min = 1
max = 16384
default = 128
[params.in0_d0]
type = "int"
default = 4
[params.in0_d1]
type = "int"
default = 64
[params.in0_d2]
type = "int"
default = 192
[params.in1_d0]
type = "int"
choices = [1]
default = 1
[params.in1_d1]
type = "int"
default = 128
[params.in1_d2]
type = "int"
default = 16
[params.in1_d3]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
default = 256
[params.out0_d2]
type = "int"
default = 16
[params.out0_d3]
type = "int"
choices = [1, 2, 4, 8, 16, 32, 64]
default = 16

[derived]
groups = "k // 16"
width = "ds(out0_d3)"
height = "out0_d2"
pitch = "out0_d1"
advance = "2 + 2 * groups"

[inputs.in0]
shape = ["in0_d0 * ceil(in0_d1 * in0_d2 / 128)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * in1_d2", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * advance", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
coeff = "CR4"
lut = "CR5"
out0 = "CR6"
qf_in0 = "CR7"
qf_in1 = "CR8"
qf_out0 = "CR9"
width = "CR10"
height = "CR11"
pitch = "CR12"
n = "CR13"
groups = "CR14"
advance = "CR15"

[golden]
tolerance = { e2 = "NX8_STEP" }

[cases.default]
