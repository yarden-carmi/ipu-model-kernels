[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 16
[params.m]
type = "int"
min = 1
max = 65536
default = 3136
[params.n]
type = "int"
min = 1
max = 128
default = 16
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[derived]
ip = "1 + (1 - in0_d2 % 2) * min(1, 64 // in0_d3)"
op = "1 + (1 - out0_d3 % 2) * min(1, 64 // out0_d1)"
pitch = "in0_d2 // ip"
batch_pitch = "in0_d1 * pitch"
panel_width = "ip * in0_d3"
full = "ds(128)"
active = "ds(op * out0_d1)"

[inputs.in0]
shape = ["in0_d0 * batch_pitch", 128]
[inputs.coeff]
shape = ["2 + 2 * k * op", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * ceil(out0_d3 / op)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
k = "CR7"
pitch = "CR8"
panel_width = "CR9"
full = "CR10"
active = "CR11"
batch_pitch = "CR12"
in0_d0 = "LR15"

[cases.default]
