[kernel]
op = "row_norm"
formats = ["e2"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 128
max = 128
default = 128
[params.rows]
type = "int"
min = 128
max = 65536
multiple_of = 128
default = 256
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-5
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.in0_d2]
type = "int"
min = 1
default = 128
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 128
[derived]
K = "(channels + 127) // 128"
M = "rows * K"
tail = "ds(channels - (K - 1) * 128) + 65536 * ds(128)"
step = "out0_d0 * K"
channel_count = "channels"
row_count = "rows"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ((in0_d2 + 127) // 128)", 128]
[inputs.gamma]
shape = ["2 * K", 128]
[inputs.beta]
shape = ["2 * K", 128]
[inputs.crow]
shape = [2, 128]
[inputs.epsilon]
shape = [128]
[scratch.tmp]
shape = ["32 + 2 * K", 128]
[scratch.staged]
shape = ["2 * rows * K + 1", 128]
[outputs.out0]
shape = ["out0_d2 * ((out0_d0 * out0_d1 + 127) // 128)", 128]

[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
crow = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
K = "CR10"
M = "CR11"
epsilon = "CR12"
tail = "CR14"
qf_gamma = "CR15"
step = "LR13"
staged = "CR13"
channel_count = "LR12"
row_count = "LR15"

[golden]
tolerance = { e2 = "NX8_STEP" }

[cases.default]
