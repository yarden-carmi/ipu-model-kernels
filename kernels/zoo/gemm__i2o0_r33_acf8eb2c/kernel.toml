[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 16384
default = 288
[params.m]
type = "int"
min = 1
max = 65536
default = 1024
[params.n]
type = "int"
min = 1
max = 16384
default = 144
[params.in0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 288
[params.out0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 144

[derived]
chunks = "ceil(k / 128)"
batch_stride = "in0_d1 * chunks"
weight_stride = "chunks + 1"
full = "ds(128)"
one = "ds(1)"
tail = "ds((k - 1) % 128 + 1)"
out_ds = "ds(out0_d0)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * chunks", 128]
[inputs.w]
shape = ["n * weight_stride", 128]
[outputs.out0]
shape = ["out0_d2 * out0_d1", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
one = "CR8"
tail = "CR9"
out_ds = "CR10"
batch_stride = "CR11"
weight_stride = "CR12"
out0_d0 = "CR13"
out0_d1 = "CR14"
n = "CR15"

[cases.default]
