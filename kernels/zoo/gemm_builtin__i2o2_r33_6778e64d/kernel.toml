[kernel]
op = "gemm"
formats = ["e1", "e2"]
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.k]
type = "int"
min = 1
max = 4096
default = 384
[params.m]
type = "int"
min = 1
max = 65536
default = 100
[params.n]
type = "int"
min = 1
max = 4096
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 1829
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 100
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 384
[derived]
ichunks = "ceil(in0_d2 / 128)"
ochunks = "ceil(n / 128)"
start = "(in0_d1 - m) * ichunks"
full = "ds(128)"
tail = "ds(n - (ochunks - 1) * 128)"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * ichunks", 128]
[inputs.coeff]
shape = ["ochunks * 2 * (k + 1)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / 128)", 128]
[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
start = "CR9"
ichunks = "CR10"
ochunks = "CR11"
m = "CR12"
k = "CR13"
[cases.default]
