[kernel]
op = "row_norm"
formats = ["e2"]
[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 144
max = 256
multiple_of = 16
default = 240
[params.rows]
type = "int"
min = 32
max = 8192
multiple_of = 32
default = 64
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-5
[params.in0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.in0_d1]
type = "int"
min = 8
max = 2048
multiple_of = 8
default = 16
[params.in0_d2]
type = "int"
min = 144
max = 256
multiple_of = 16
default = 240
[params.out0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.out0_d1]
type = "int"
min = 8
max = 2048
multiple_of = 8
default = 16
[params.out0_d2]
type = "int"
min = 144
max = 256
multiple_of = 16
default = 240

[derived]
ds1 = "ds(1) + 65536 * qf(1, 1, 8, 0)"
seq = "50462976"
seq_hi = "117835012"
dsl = "ds(channels - 128)"
[inputs.in0]
shape = ["2 * in0_d0 * in0_d1", 128]
range = [-2.0, 2.0]
[inputs.gamma]
shape = [4, 128]
[inputs.beta]
shape = [4, 128]
[inputs.crow]
shape = [2, 128]
[inputs.epsilon]
shape = [1, 128]
[scratch.tmp]
shape = ["40 + 8 * rows", 128]
[outputs.out0]
shape = ["out0_d0 * (out0_d1 * out0_d2 // 128)", 128]
[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
crow = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
seq = "CR10"
seq_hi = "CR11"
epsilon = "CR12"
ds1 = "CR13"
dsl = "CR14"
[golden]
tolerance = { e2 = "NX8_STEP" }

