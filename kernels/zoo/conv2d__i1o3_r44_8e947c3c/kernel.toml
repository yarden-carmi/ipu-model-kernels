[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 512
[params.cout]
type = "int"
min = 1
max = 1024
default = 256
[params.groups]
type = "int"
min = 1
max = 1
default = 1
[params.h]
type = "int"
min = 1
max = 512
default = 7
[params.w]
type = "int"
min = 1
max = 128
default = 7
[params.kh]
type = "int"
min = 1
max = 3
default = 3
[params.kw]
type = "int"
min = 1
max = 3
default = 3
[params.padding]
type = "int"
min = 0
max = 1
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 1
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 512
[params.in0_d2]
type = "int"
min = 1
max = 512
default = 7
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 7
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 1024
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 514
default = 7
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 7

[derived]
cb = "ceil(in0_d1 / 128)"
pack = "min(out0_d2, 128 // out0_d3)"
row_ds = "ds(pack * out0_d3)"
tail_ds = "ds((out0_d2 - (ceil(out0_d2 / pack) - 1) * pack) * out0_d3)"
full = "ds(128)"
ends = "out0_d3 * stride - padding + 65536 * (out0_d2 * stride - padding)"
input_hw = "in0_d3 + 65536 * in0_d2"
out_channels = "out0_d1"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * cb", 128]
range = [-2, 2]
[inputs.weights]
shape = ["out0_d1", "2 + 2 * kh * kw * cb", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / pack)", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
input_hw = "CR7"
ends = "CR8"
pack = "CR9"
row_ds = "CR10"
tail_ds = "CR11"
full = "CR12"
out_channels = "CR13"

[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}

[cases.default]
