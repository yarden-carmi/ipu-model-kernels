[kernel]
op = "round_fp16"
formats = ["e2"]
[params]
numel = { type = "int", min = 1, max = 16777216, default = 12288 }
in0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in0_d1 = { type = "int", min = 1, max = 128, default = 48 }
in0_d2 = { type = "int", min = 1, max = 16777216, default = 16 }
in0_d3 = { type = "int", min = 1, max = 128, default = 16 }
out0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
out0_d1 = { type = "int", min = 1, max = 128, default = 48 }
out0_d2 = { type = "int", min = 1, max = 16777216, default = 16 }
out0_d3 = { type = "int", min = 1, max = 128, default = 16 }
[derived]
full = "ds(128) + 65536 * ds(out0_d3)"
zero_sign_scale = "18 * 65536 + 23 * 256"
overflow_limit = "18 * 65536 + 143 * 256 + 31"
overflow_gain = "18 * 65536 + 252 * 256 + 10"
[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", 128]
[scratch.bias]
shape = [1, 128]
[scratch.half]
shape = [1, 128]
[scratch.positive]
shape = [1, 128]
[scratch.negative]
shape = [1, 128]
[scratch.tmp]
shape = [1, 128]
[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
full = "CR6"
bias = "CR7"
half = "CR8"
zero_sign_scale = "CR9"
overflow_limit = "CR10"
overflow_gain = "CR11"
positive = "CR12"
negative = "CR13"
tmp = "CR14"
in0_d1 = "CR15"
in0_d2 = "LR14"
in0_d3 = "LR15"
in0_d0 = "LR1"
[cases.default]
