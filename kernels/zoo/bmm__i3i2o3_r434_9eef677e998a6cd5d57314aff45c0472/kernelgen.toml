chain = ["bmm"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [0, 1, 2]

# Preserve the fork's fixed scale for the softmax probabilities.
[format.in0]
format = "e3"
scale = 0

[layout.in1]
lanes = 2
rows = [0, 1]

[view.in1]
kind = "heads"

[layout.out0]
lanes = 3
rows = [0, 1, 2]
