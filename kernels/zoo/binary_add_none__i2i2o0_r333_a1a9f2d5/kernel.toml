[kernel]
op = "binary_add"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 15360 }
in0_d0 = { type = "int", min = 4, max = 4, default = 4 }
in0_d1 = { type = "int", min = 16, max = 256, multiple_of = 16, default = 16 }
in0_d2 = { type = "int", min = 144, max = 256, multiple_of = 16, default = 240 }
in1_d0 = { type = "int", min = 4, max = 4, default = 4 }
in1_d1 = { type = "int", min = 16, max = 256, multiple_of = 16, default = 16 }
in1_d2 = { type = "int", min = 144, max = 256, multiple_of = 16, default = 240 }
out0_d0 = { type = "int", min = 4, max = 4, default = 4 }
out0_d1 = { type = "int", min = 16, max = 256, multiple_of = 16, default = 16 }
out0_d2 = { type = "int", min = 144, max = 256, multiple_of = 16, default = 240 }

[derived]
ds_pair = "ds(1) + 65536 * ds(128)"
cols = "in0_d2"
channels = "in0_d1"
step = "4 * in0_d1"
batchstep = "2 * in0_d1"
rows = "out0_d2 * 2 * ceil(out0_d1 / 64)"
tail = "ds(4 * ((out0_d1 - 1) % 32 + 1)) + 65536 * ds(0)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * 2", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * 2", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
ds_pair = "CR8"
cols = "CR9"
channels = "CR10"
step = "CR11"
batchstep = "CR12"
rows = "CR13"
tail = "CR14"

[cases.default]
