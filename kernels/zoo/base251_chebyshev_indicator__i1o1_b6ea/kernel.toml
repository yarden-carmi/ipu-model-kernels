[kernel]
# Quotient/remainder equality is integer equality.
op = "base251_chebyshev_indicator"
formats = ["e2", "s0e1w8"]
[params.tokens]
type = "int"
min = 1
max = 256
default = 256
[params.vocab]
type = "int"
min = 1
max = 250002
default = 250002
[inputs.in0]
shape = [1, "tokens"]
range = [0, 255]
[inputs.digits]
shape = ["4 * min(ceil(vocab / 128), 2)", 128]
range = [0, 1]
[inputs.controls]
shape = [12, 128]
[outputs.out0]
shape = ["tokens", "ceil(vocab / 128) * 128"]
[scratch.difference]
shape = [3,128]
[derived]
chunks = "ceil(vocab / 128)"
last = "ceil(vocab / 128) - 1"
tail = "ds(vocab - (ceil(vocab / 128) - 1) * 128)"
digit_chunks = "min(ceil(vocab / 128), 2)"
[abi]
in0 = "CR2"
out0 = "CR3"
digits = "CR4"
difference = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
qf_digits = "CR8"
qf_difference = "CR9"
chunks = "CR10"
tokens = "CR11"
tail = "CR12"
controls = "CR13"
qf_controls = "CR14"
[cases.default]
tokens = 256
vocab = 250002
[golden]
tolerance = { e2 = "EXACT" }
