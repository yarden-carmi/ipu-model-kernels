[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 64
[params.cout]
type = "int"
min = 1
max = 128
default = 64
[params.groups]
type = "int"
min = 1
max = 128
default = 1
[params.h]
type = "int"
min = 3
max = 224
default = 8
[params.w]
type = "int"
min = 3
max = 224
default = 8
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1

[derived]
packed = "1 - min(1, max(cin - 32, 32 - cin) + w % 4)"
pack = "1 + 3 * packed"
blocks = "1 + packed"
tap_rows = "2 * (packed * cout + (1 - packed) * cin)"
panel_end = "packed * (cout - 2) + (1 - packed) * (((cin - 1) // 16) * 16)"
x_end = "w - packed"
y_end = "packed * (w // 4) + (1 - packed) * h"
dot_width = "ds(96)"
weight_rows = "packed * (3 + 6 * cout) + (1 - packed) * (2 + kh * kw * tap_rows)"
full = "halves(ds(128), ds(96))"
tail = "ds(cout)"

[inputs.in0]
shape = ["in0_d0", "h", "w // pack", 128]
range = [-2, 2]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["in0_d0", "h", "w", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
in0_d0 = "LR10"
tail = "CR7"
blocks = "CR8"
h = "CR9"
w = "CR10"
panel_end = "CR11"
tap_rows = "CR12"
x_end = "CR13"
y_end = "CR14"
full = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]

[cases.packed]
cin = 32
cout = 32
