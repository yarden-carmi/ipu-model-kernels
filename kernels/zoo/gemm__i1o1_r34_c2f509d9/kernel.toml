[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 384
[params.m]
type = "int"
min = 1
max = 65536
default = 256
[params.n]
type = "int"
min = 1
max = 4096
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 384
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 16

[derived]
pitch = "ceil(in0_d1 / 128)"
span = "pitch * in0_d2"
batch_span = "span * in0_d0"
step = "(m % in0_d2) * pitch"
quot = "(m // in0_d2) % 128"
block_step = "m // (128 * in0_d2)"
tiles = "ceil(out0_d1 / 128)"
full = "ds(128)"
tail = "ds((out0_d1 - 1) % 128 + 1)"
spatial = "out0_d2 * out0_d3"

[inputs.in0]
shape = ["batch_span", 128]
range = [-2, 2]
[inputs.w]
shape = ["2 * tiles * (k + 1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * spatial * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
pitch = "CR10"
span = "CR11"
step = "CR12"
quot = "CR13"
k = "CR14"
spatial = "CR15"
out0_d0 = "LR15"
block_step = "LR14"
batch_span = "LR13"

[cases.default]
