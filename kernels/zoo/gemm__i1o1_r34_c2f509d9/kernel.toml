[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 384
[params.m]
type = "int"
min = 1
max = 65536
default = 256
[params.n]
type = "int"
min = 1
max = 65536
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 384
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 16
[derived]
chunks = "ceil(in0_d1 / 128)"
row_step = "(m % in0_d2) * chunks"
lane_step = "m // in0_d2"
row_span = "in0_d2 * chunks"
tiles = "ceil(n / 128)"
tile_pitch = "2 * (k + 1)"
full = "ds(128)"
tail = "ds((n - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * chunks", 128]
[inputs.coeff]
shape = ["tiles * tile_pitch", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
k = "CR7"
m = "CR8"
tiles = "CR9"
in0_d1 = "CR10"
full = "CR11"
tail = "CR12"
row_span = "CR13"
row_step = "CR14"
lane_step = "CR15"
out0_d0 = "LR13"
chunks = "LR14"

[cases.default]
