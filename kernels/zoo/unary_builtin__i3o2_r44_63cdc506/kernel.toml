[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 2
max = 2147483647
default = 262144

[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 64

[params.in0_d2]
type = "int"
min = 2
max = 128
multiple_of = 2
default = 64

[params.in0_d3]
type = "int"
min = 1
max = 64
default = 64

[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 64

[params.out0_d2]
type = "int"
min = 2
max = 128
multiple_of = 2
default = 64

[params.out0_d3]
type = "int"
min = 1
max = 64
default = 64

[derived]
input_rows = "in0_d0 * in0_d1 * in0_d2 // 2"
output_rows = "out0_d0 * out0_d3 * out0_d1"
input_batch_step = "in0_d2 // 2"
input_channel_step = "in0_d0 * input_batch_step"
output_batch_step = "out0_d3 * out0_d1"
last_pair = "in0_d2 - 2"
last_column = "in0_d3 - 1"
single = "ds(1)"
output_active = "ds(out0_d2)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
single = "CR6"
output_active = "CR7"
in0_d0 = "CR8"
in0_d3 = "CR9"
out0_d1 = "CR10"
last_pair = "CR11"
last_column = "CR12"
input_batch_step = "CR13"
input_channel_step = "CR14"
output_batch_step = "CR15"

[cases.default]
