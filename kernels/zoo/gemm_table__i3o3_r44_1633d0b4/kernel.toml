[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu", "hardsigmoid", "hardswish"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65535
default = 8
[params.m]
type = "int"
min = 1
max = 65535
default = 1
[params.n]
type = "int"
min = 1
max = 65535
default = 16
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 8
[params.in0_d2]
type = "int"
min = 1
max = 32768
default = 1
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 1
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 32768
default = 1
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 1

[derived]
batch_skip = "(k - 1) * in0_d2"
full_blocks = "(k - 1) // 32"
active = "ds(out0_d3)"
row_lanes = "128"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * (4 + 2 * full_blocks)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
n = "CR8"
in0_d2 = "CR9"
in0_d0 = "CR10"
active = "CR11"
row_lanes = "CR12"
full_blocks = "CR13"
batch_skip = "CR14"

[cases.default]
