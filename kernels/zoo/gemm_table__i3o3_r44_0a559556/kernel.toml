[kernel]
op = "gemm_table"
formats = ["e1"]

[params.k]
type = "int"
min = 1
max = 4096
default = 40
[params.n]
type = "int"
min = 1
max = 4096
default = 240
[params.m]
type = "int"
min = 1
max = 65535
default = 196
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["hardswish"]
default = "hardswish"
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 40
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 14
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 240
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 14

[derived]
pack_in = "128 // in0_d3"
pack_out = "128 // out0_d3"
blocks = "ceil(in0_d2 / pack_in)"
batch_rows = "in0_d1 * blocks"
ir = "in0_d0 * batch_rows"
out_rows = "out0_d0 * out0_d1 * ceil(out0_d2 / pack_out)"
chunks = "ceil(k / 128)"
groups = "chunks - 1"
coeff_rows = "n * (chunks + 1)"
full = "ds(pack_out * out0_d3)"
tail = "ds((out0_d2 - pack_out * (ceil(out0_d2 / pack_out) - 1)) * out0_d3)"

[inputs.in0]
shape = ["ir", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
lut = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
batch_rows = "CR8"
blocks = "CR9"
n = "CR10"
full = "CR11"
tail = "CR12"
in0_d0 = "CR13"
chunks = "CR14"
groups = "CR15"

[cases.default]
