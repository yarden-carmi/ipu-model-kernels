[kernel]
op = "bmm__binary_mul_scalar__row_softmax"
formats = ["e3"]

[params]
s0_b = {type="int", min=1, max=1024, default=12}
s0_k = {type="int", min=32, max=64, multiple_of=32, default=64}
s0_m = {type="int", min=1, max=65535, default=50}
s0_n = {type="int", min=1, max=4096, default=50}
s1_broadcast = {type="str", choices=["scalar"], default="scalar"}
s1_const = {type="int", min=1, max=1, default=1}
s1_inner = {type="int", min=0, max=0, default=0}
s1_numel = {type="int", min=1, max=2147483647, default=30000}
s1_op = {type="str", choices=["mul"], default="mul"}
s2_n = {type="int", min=1, max=4096, default=50}
s2_rows = {type="int", min=1, max=2147483647, default=600}
in0_d0 = {type="int", min=1, max=1, default=1}
in0_d1 = {type="int", min=1, max=65535, default=50}
in0_d2 = {type="int", min=32, max=65536, multiple_of=32, default=768}
in1_d0 = {type="int", min=1, max=1, default=1}
in1_d1 = {type="int", min=1, max=4096, default=50}
in1_d2 = {type="int", min=32, max=65536, multiple_of=32, default=768}
out0_d0 = {type="int", min=1, max=1, default=1}
out0_d1 = {type="int", min=1, max=1024, default=12}
out0_d2 = {type="int", min=1, max=65535, default=50}
out0_d3 = {type="int", min=1, max=4096, default=50}

[derived]
astride = "ceil(in0_d2/128)"
bstride = "ceil(in1_d2/128)"
tiles = "ceil(s2_n/128)"
ds_pair = "ds(128)+65536*ds((s2_n-1)%128+1)"
dot_ds = "ds(s0_k)"
work_qf = "328+65536*56"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "astride", 128]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "bstride", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)", 128]
[scratch.work]
shape = ["16+4*tiles", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
work = "CR5"
ds_pair = "CR6"
work_qf = "CR7"
tiles = "CR8"
astride = "CR9"
s0_m = "CR10"
bstride = "CR11"
qf_in0 = "CR12"
qf_in1 = "CR13"
qf_out0 = "CR14"
dot_ds = "CR15"
s0_b = "LR14"
s0_k = "LR13"
s0_n = "LR12"

[cases.default]
