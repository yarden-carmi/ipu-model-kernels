[kernel]
op = "gemm__binary_add_none"
formats = ["e1"]
[params]
s0_bias = {type="bool", default=true}
s0_k = {type="int", min=1, max=4096, default=240}
s0_m = {type="int", min=1, max=65536, default=196}
s0_n = {type="int", min=1, max=128, default=40}
s1_broadcast = {type="str", choices=["none"], default="none"}
s1_inner = {type="int", min=0, max=0, default=0}
s1_numel = {type="int", min=1, max=8388608, default=7840}
s1_op = {type="str", choices=["add"], default="add"}
in0_d0 = {type="int", min=1, max=256, default=1}
in0_d1 = {type="int", min=1, max=4096, default=240}
in0_d2 = {type="int", min=1, max=4096, default=14}
in0_d3 = {type="int", min=1, max=128, default=14}
in1_d0 = {type="int", min=1, max=256, default=1}
in1_d1 = {type="int", min=1, max=128, default=40}
in1_d2 = {type="int", min=1, max=4096, default=14}
in1_d3 = {type="int", min=1, max=128, default=14}
out0_d0 = {type="int", min=1, max=256, default=1}
out0_d1 = {type="int", min=1, max=128, default=40}
out0_d2 = {type="int", min=1, max=4096, default=14}
out0_d3 = {type="int", min=1, max=128, default=14}
[derived]
chunks = "ceil(in0_d1 / 128)"
pixels = "in0_d0 * in0_d2 * in0_d3"
groups = "ceil(out0_d0 * out0_d2 / (128 // out0_d3))"
full = "ds(128)"
valid = "ds(out0_d1)"
group_size = "(128 // out0_d3) * out0_d3"
scalar = "ds(1)"
correction = "base(tmp) + pixels"
[inputs.in0]
shape = ["pixels * chunks", 128]
[inputs.in1]
shape = ["in1_d0 * in1_d2 * in1_d3", 128]
[inputs.w]
shape = ["2 + 2 * s0_k", 128]
[outputs.out0]
shape = ["out0_d1 * groups", 128]
[scratch.tmp]
shape = ["2 * pixels", 128]
[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR5"
tmp = "CR6"
qf_in0 = "CR7"
qf_in1 = "CR8"
qf_out0 = "CR9"
pixels = "CR10"
chunks = "CR11"
full = "CR12"
valid = "CR13"
group_size = "LR15"
s0_n = "LR14"
scalar = "CR14"
correction = "CR15"
[cases.default]
