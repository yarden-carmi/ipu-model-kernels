[kernel]
op = "row_norm"
formats = ["e3"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 128
max = 4096
multiple_of = 128
default = 512
[params.rows]
type = "int"
min = 1
max = 4096
default = 64
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 0.00001
[params.in0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d2]
type = "int"
min = 128
max = 4096
multiple_of = 128
default = 512
[params.out0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 128
max = 4096
multiple_of = 128
default = 512

[derived]
half = "1277440"
K = "channels // 128"
M = "rows * K"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * (in0_d2 // 128)", 128]
[inputs.gamma]
shape = ["3 * K", 128]
[inputs.beta]
shape = ["3 * K", 128]
[inputs.crow]
shape = [3, 128]
[inputs.epsilon]
shape = [128]
[scratch.tmp]
shape = ["32 + 2 * K", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * (out0_d2 // 128)", 128]

[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
crow = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
K = "CR10"
M = "CR11"
epsilon = "CR12"
half = "CR13"

[golden]
tolerance = { e3 = "NX8_STEP" }

[cases.default]
