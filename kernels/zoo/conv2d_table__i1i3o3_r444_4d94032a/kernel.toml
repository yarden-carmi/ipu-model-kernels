[kernel]
op = "conv2d_table"
formats = ["e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 16
[params.cout]
type = "int"
min = 1
max = 512
default = 16
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 3
max = 256
default = 8
[params.w]
type = "int"
choices = [4, 8, 16, 32, 64]
default = 8
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 16
[params.in0_d2]
type = "int"
min = 3
max = 256
default = 8
[params.in0_d3]
type = "int"
min = 3
max = 256
default = 8
[params.in1_d0]
type = "int"
choices = [1]
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 512
default = 16
[params.in1_d2]
type = "int"
min = 3
max = 256
default = 8
[params.in1_d3]
type = "int"
choices = [4, 8, 16, 32, 64]
default = 8
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 512
default = 16
[params.out0_d2]
type = "int"
min = 2
max = 256
default = 8
[params.out0_d3]
type = "int"
choices = [4, 8, 16, 32, 64]
default = 8

[derived]
i0c = "ceil(in0_d1 / 128)"
ds128 = "ds(128)"
ds_tail = "ds(1 + (out0_d2 * out0_d3 - 1) % 128)"
tiles = "ceil(in1_d2 / (128 // in1_d3))"
tstep = "9 * cin"
block = "14"
small = "1 - min(1, (h * w) // 65)"
wrows = "(1 - small) * (2 + cout * (4 + ceil(cin / block))) + small * ceil(cout / 2) * (4 + 18 * ceil(cin / 2))"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "i0c", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "tiles", 128]
range = [-2, 2]
[inputs.weights]
shape = ["wrows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "tiles", 128]
[scratch.pad]
shape = ["max(4 + tiles * tstep, cin + 4)", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
weights = "CR4"
lut = "CR5"
out0 = "CR6"
qf_in0 = "CR7"
qf_in1 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
tiles = "CR12"
tstep = "CR13"
ds_tail = "CR14"
pad = "CR15"

[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
