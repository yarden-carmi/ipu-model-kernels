[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 128
[params.cout]
type = "int"
min = 1
max = 512
default = 128
[params.groups]
type = "int"
min = 1
max = 512
default = 128
[params.h]
type = "int"
min = 3
max = 256
default = 8
[params.w]
type = "int"
choices = [4, 8, 16, 32, 64, 128]
default = 8
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 128
[params.in0_d2]
type = "int"
min = 3
max = 256
default = 8
[params.in0_d3]
type = "int"
min = 3
max = 256
default = 8
[params.in1_d0]
type = "int"
choices = [1]
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 512
default = 128
[params.in1_d2]
type = "int"
min = 3
max = 256
default = 8
[params.in1_d3]
type = "int"
choices = [4, 8, 16, 32, 64, 128]
default = 8
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 512
default = 128
[params.out0_d2]
type = "int"
min = 2
max = 256
default = 8
[params.out0_d3]
type = "int"
choices = [4, 8, 16, 32, 64, 128]
default = 8

[derived]
ic = "ceil(in0_d1 / 128)"
ds128 = "ds(128)"
ds_tail = "ds(1 + (out0_d2 * out0_d3 - 1) % 128)"
tiles = "ceil(in1_d2 / (128 // in1_d3))"
gcin = "cin // groups"
gstep = "9 * gcin"
tstep = "9 * cin"
small = "1 - min(1, (h * w) // 65)"
block = "3 + 10 * min(1, (h * w) // 512)"
wrows = "2 + (1 - small) * cout * (2 + 2 * ceil(gcin / block)) + small * (1 + groups * ceil((cout // groups) / 2) * (4 + 17 * gcin))"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "ic", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "tiles", 128]
range = [-2, 2]
[inputs.weights]
shape = ["wrows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.pad]
shape = ["max(2 + tiles * tstep, cin + 1)", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "tiles", 128]

[abi]
in1 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
pad = "CR6"
qf_in1 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
in0 = "CR11"
tiles = "CR12"
gstep = "CR13"
tstep = "CR14"
ds_tail = "CR15"
qf_in0 = "LR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
