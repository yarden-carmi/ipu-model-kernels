[kernel]
op = "row_norm"
formats = ["e2"]
[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 1
max = 4096
default = 768
[params.rows]
type = "int"
min = 1
max = 4096
default = 1
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 0.00001
[params.in0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 50
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 768
[params.out0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 768
[derived]
K = "ceil(channels / 128)"
blocks = "ceil(in0_d1 / 128)"
stride = "in0_d2 * blocks"
tail = "ds((channels - 1) % 128 + 1)"
half = "1277440"
center = "32 + 2 * K"
gather_span = "channels * blocks"
[inputs.in0]
shape = ["in0_d0 * stride", 128]
[inputs.gamma]
shape = ["3 * K", 128]
[inputs.beta]
shape = ["3 * K", 128]
[inputs.crow]
shape = [3, 128]
[inputs.epsilon]
shape = [128]
[scratch.tmp]
shape = ["32 + 4 * K", 128]
[outputs.out0]
shape = ["out0_d0 * ceil(out0_d1 / 128)", 128]
[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
tail = "CR6"
crow = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
K = "CR10"
qf_gamma = "CR11"
epsilon = "CR12"
half = "CR13"
qf_out0 = "CR14"
stride = "LR12"
rows = "LR13"
center = "LR14"
gather_span = "LR15"
[cases.default]
