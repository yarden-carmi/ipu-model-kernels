[kernel]
op = "row_norm"
formats = ["e2"]

[params]
kind = { type = "str", choices = ["layernorm"], default = "layernorm" }
channels = { type = "int", min = 1, max = 4096, default = 768 }
rows = { type = "int", min = 1, default = 1 }
eps = { type = "float", min = 0.0, max = 1.0, default = 1e-5 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, max = 32640, default = 50 }
in0_d2 = { type = "int", min = 1, default = 768 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 768 }

[derived]
K = "(channels + 127) // 128"
W = "(in0_d1 + 127) // 128"
M = "rows * K"
batch_step = "in0_d2 * W"
tail = "ds(channels - (K - 1) * 128) + 65536 * ds(128)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * W", 128]
[inputs.gamma]
shape = ["2 * K", 128]
[inputs.beta]
shape = ["2 * K", 128]
[inputs.crow]
shape = [2, 128]
[inputs.epsilon]
shape = [3, 128]
[scratch.tmp]
shape = ["96 + K", 128]
[outputs.out0]
shape = ["out0_d0 * ((out0_d1 + 127) // 128)", 128]

[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
crow = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
K = "CR10"
M = "CR11"
epsilon = "CR12"
batch_step = "CR13"
tail = "CR14"
qf_gamma = "CR15"

[golden]
tolerance = { e2 = "NX8_STEP" }

[cases.default]
