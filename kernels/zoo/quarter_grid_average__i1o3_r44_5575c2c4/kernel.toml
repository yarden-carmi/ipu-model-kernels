[kernel]
op = "quarter_grid_average"
formats = ["e1"]

[params.h]
type = "int"
min = 4
max = 4096
default = 66
[params.w]
type = "int"
min = 4
max = 4096
default = 66
[params.in0_d0]
type = "int"
min = 1
max = 64
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.in0_d2]
type = "int"
min = 4
max = 4096
default = 66
[params.in0_d3]
type = "int"
min = 4
max = 4096
default = 66
[params.out0_d0]
type = "int"
min = 1
max = 64
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 2048
default = 32
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 32

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", 128]
range = [-1.0, 1.0]
[outputs.out0]
shape = ["ceil(out0_d1 * out0_d0 * out0_d2 / (128 // out0_d3))", 128]
[scratch.tmp]
shape = ["out0_d0 * out0_d2 * out0_d3", 128]

[derived]
input_image = "h * w"
vertical_step = "2 * w"
valid = "ds(128)"
weight = "19 * 65536 + 123 * 256"
weight_fp32 = "123 * 8388608"
spatial = "out0_d2 * out0_d3"
total = "out0_d1 * out0_d0 * out0_d2 * out0_d3"

[abi]
in0 = "CR2"
out0 = "CR3"
w = "CR4"
out0_d3 = "CR5"
out0_d2 = "CR6"
out0_d0 = "CR7"
vertical_step = "CR8"
valid = "CR9"
qf_in0 = "CR10"
qf_out0 = "CR11"
weight = "CR12"
weight_fp32 = "CR13"
tmp = "CR14"
spatial = "CR15"
input_image = "LR15"

[cases.default]
