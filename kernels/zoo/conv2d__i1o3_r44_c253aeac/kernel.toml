[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 64
[params.cout]
type = "int"
min = 1
max = 2048
default = 64
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 1
max = 512
default = 32
[params.w]
type = "int"
min = 1
max = 256
default = 32
[params.kh]
type = "int"
min = 1
max = 32
default = 3
[params.kw]
type = "int"
min = 1
max = 32
default = 3
[params.padding]
type = "int"
choices = [0, 1]
default = 1
[params.stride]
type = "int"
min = 1
max = 32
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 512
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 32
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2048
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 512
default = 32
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 32

[derived]
ic = "ceil(in0_d1 / 128)"
weight_block = "3 * (1 + kh * kw * ic)"
ds128 = "ds(128)"
dstail = "ds(out0_d3)"
pitch = "stride * (in0_d3 + 2 * padding) * ic"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "ic", 128]
range = [-2, 2]
[inputs.weights]
shape = ["cout * weight_block", 128]
range = [-1, 1]
[scratch.pad]
shape = ["(in0_d2 + 2 * padding) * (in0_d3 + 2 * padding) * ic", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d1", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
pad = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
cout = "CR11"
out0_d2 = "CR12"
pitch = "CR13"
weight_block = "CR14"
dstail = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
