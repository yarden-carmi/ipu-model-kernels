[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.groups]
type = "int"
choices = [1]
default = 1
[params.cin]
type = "int"
min = 1
max = 896
default = 64
[params.cout]
type = "int"
min = 1
max = 2048
default = 64
[params.h]
type = "int"
min = 1
max = 1024
default = 64
[params.w]
type = "int"
min = 1
max = 1024
default = 64
[params.kh]
type = "int"
min = 1
max = 32
default = 3
[params.kw]
type = "int"
min = 1
max = 32
default = 3
[params.padding]
type = "int"
min = 0
max = 16
default = 1
[params.stride]
type = "int"
min = 1
max = 32
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 896
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 1024
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 1024
default = 64
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2048
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 1056
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 1056
default = 64

[derived]
wo = "out0_d3"
segments = "ceil(wo / 128)"
chunks = "ceil(in0_d1 / 128)"
span = "1 + kh * kw * chunks"
weight_end = "out0_d1 * span"
input_step = "stride * chunks"
tail = "ds((wo - 1) % 128 + 1)"
full = "ds(128)"
ystop = "out0_d2 * stride - padding"
xstop = "wo * stride - padding"
ytap_step = "in0_d3 * chunks"
yout_step = "stride * ytap_step"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "chunks", 128]
range = [-2, 2]
[inputs.weights]
shape = ["out0_d1", "span", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d1", "segments", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tail = "CR8"
full = "CR9"
h = "CR10"
w = "CR11"
ystop = "CR12"
xstop = "CR13"
ytap_step = "CR14"
yout_step = "CR15"
weight_end = "LR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
