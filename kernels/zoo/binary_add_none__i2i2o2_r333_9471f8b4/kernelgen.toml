chain = ["binary"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

[layout.in0]
lanes = 2
rows = [0, 1]
pack = "1 + (d1 - 1) * (1 - min(1, (d1 * d2) % 128))"
[view.in0]
kind = "other"

[prefer.in0]
lanes = 2
rows = [0, 1]
pack = "1 + (d1 - 1) * (1 - min(1, (d1 * d2) % 128))"

[layout.in1]
lanes = 2
rows = [0, 1]
[view.in1]
kind = "whole"

[layout.out0]
lanes = 2
rows = [0, 1]
