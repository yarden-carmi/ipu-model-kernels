[kernel]
op = "binary_add_row"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["row"]
default = "row"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 64
max = 2147483647
multiple_of = 64
default = 4096
[params.numel]
type = "int"
min = 64
max = 2147483647
multiple_of = 64
default = 32768
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 8
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d3]
type = "int"
choices = [64, 128, 256, 512]
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 8
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d3]
type = "int"
choices = [64, 128, 256, 512]
default = 64

[derived]
width = "min(in0_d3, 128)"
rows = "out0_d0 * out0_d1 * out0_d2 * ((out0_d3 + 127) // 128)"
input_rows = "(numel + 127) // 128"
period = "inner // width"
store_ds = "ds(width)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]
[inputs.operand]
shape = ["period", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_operand = "CR6"
qf_out0 = "CR7"
rows = "CR8"
period = "CR9"
store_ds = "CR10"

[cases.default]
