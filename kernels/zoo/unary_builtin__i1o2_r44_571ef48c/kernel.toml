[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 2
max = 2147483647
default = 262144

[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 64
default = 64

[params.in0_d2]
type = "int"
min = 1
max = 128
default = 64

[params.in0_d3]
type = "int"
min = 2
max = 2147483646
multiple_of = 2
default = 64

[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 64
default = 64

[params.out0_d2]
type = "int"
min = 1
max = 128
default = 64

[params.out0_d3]
type = "int"
min = 2
max = 2147483646
multiple_of = 2
default = 64

[derived]
pairs = "in0_d3 // 2"
batch_stride = "in0_d2 * pairs"
input_rows = "in0_d0 * batch_stride"
output_rows = "out0_d0 * out0_d3 * out0_d1"
packed_lanes = "2 * in0_d1"
penultimate_height = "in0_d2 - 2"
single = "ds(1)"
output_active = "ds(out0_d2)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
single = "CR6"
output_active = "CR7"
in0_d0 = "CR8"
pairs = "CR9"
batch_stride = "CR10"
packed_lanes = "CR11"
penultimate_height = "CR12"

[cases.default]
