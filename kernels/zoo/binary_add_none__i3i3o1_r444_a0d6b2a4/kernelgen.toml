chain = ["binary"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [1, 0, 2]
pack = "1 + (1 - d2 % 2) * min(1, 128 // d3 - 1)"
[view.in0]
kind = "whole"

[layout.in1]
lanes = 3
rows = [0, 1, 2]
[view.in1]
kind = "whole"

[layout.out0]
lanes = 1
rows = [0, 2, 3]

[prefer.in0]
lanes = 1
rows = [0, 2, 3]
[prefer.in1]
lanes = 1
rows = [0, 2, 3]
