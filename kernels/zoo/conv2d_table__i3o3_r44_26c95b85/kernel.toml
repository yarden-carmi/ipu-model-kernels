[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 3
[params.cout]
type = "int"
min = 1
max = 640
default = 16
[params.groups]
type = "int"
min = 1
max = 640
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 256
[params.w]
type = "int"
min = 1
max = 256
default = 256
[params.kh]
type = "int"
choices = [1, 3, 5]
default = 3
[params.kw]
type = "int"
choices = [3, 5]
default = 3
[params.padding]
type = "int"
choices = [1, 2]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 3
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 256
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 260
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 256
default = 128

[derived]
ix = "ceil(in0_d3 / 128)"
ox = "ceil(out0_d3 / 128)"
full_pack = "min(8, max(1, 128 // out0_d3))"
pack = "1 + (full_pack - 1) * (1 - min(1, out0_d2 % full_pack))"
tiles = "ceil(out0_d2 / pack)"
extra = "stride * (pack - 1)"
gcin = "cin // groups"
compact = "(1 - min(1, groups - 1)) * min(1, gcin - 1) * (1 - min(1, max(kh - 3, 3 - kh, kw - 3, 3 - kw, stride - 1, padding - 1, in0_d3 - 32, 32 - in0_d3, out0_d3 - 32, 32 - out0_d3, 4 - pack)))"
plane = "(in0_d2 + 2 * padding + extra) * (kw - 2 * compact) * ox"
 pipe = "(1 - min(1, groups - 1)) * min(1, gcin - 1)"
group_plane = "plane * gcin"
 weights_end = "cout * (2 + (2 + 5 * compact) * gcin + compact * (gcin // 4)) - 1"
ds128 = "ds(128) + 65536 * ds(pack * out0_d3 - 128 * (ox - 1))"
# The high half describes four valid 32-lane partitions for the tap masks.
ds_in = "ds(out0_d3 - 128 * (ox - 1)) + (4 * 4096 + 2 * 256 + 32) * 65536 * compact"
weight_base = "base(weights) * (1 - compact) + base(compact_weights) * compact"
unused_weights = "base(weights) * compact + base(compact_weights) * (1 - compact)"
packed_qf = "4360"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ix", 128]
range = [-2, 2]
[inputs.weights]
shape = ["1 + (weights_end + 2 * pipe) * (1 - compact)", 128]
range = [-1, 1]
[inputs.compact_weights]
shape = ["1 + (weights_end + 2 * pipe) * compact", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.shifted]
shape = ["1 + (cin + pipe) * plane", 128]
[scratch.packed]
shape = ["1 + (cin + pipe) * plane * min(1, pack - 1)", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "tiles", "ox", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weight_base = "CR4"
lut = "CR5"
shifted = "CR6"
packed = "CR7"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
ds_in = "CR12"
packed_qf = "CR13"
plane = "CR14"
weights_end = "CR15"
group_plane = "LR15"
unused_weights = "LR8"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
