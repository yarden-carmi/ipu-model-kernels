[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.m]
type = "int"
min = 1
max = 65536
default = 257
[params.k]
type = "int"
min = 1
max = 16384
default = 1536
[params.n]
type = "int"
min = 1
max = 16384
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 1536
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 384

[derived]
blocks = "ceil(in0_d1 / 128)"
batches = "in0_d0"
batch_stride = "in0_d2 * blocks"
weight_rows = "ceil(k / 128)"
groups = "weight_rows - 1"
last_bound = "(k - 1) % 128 - 1"
full = "ds(128)"
tail = "ds((out0_d1 - 1) % 128 + 1)"

[inputs.in0]
shape = ["batches * batch_stride", 128]
range = [-2, 2]
[inputs.w]
shape = ["n * weight_rows", 128]
[inputs.b]
shape = ["n", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
b = "CR7"
full = "CR8"
tail = "CR9"
blocks = "CR10"
last_bound = "CR11"
groups = "CR12"
n = "CR13"
batches = "CR14"
batch_stride = "CR15"

[cases.default]
m = 2
k = 129
n = 135
in0_d1 = 2
in0_d2 = 129
out0_d1 = 2
out0_d2 = 135
