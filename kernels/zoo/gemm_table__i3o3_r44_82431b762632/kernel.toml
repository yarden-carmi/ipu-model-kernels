[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65535
default = 128
[params.m]
type = "int"
min = 1
max = 65535
default = 256
[params.n]
type = "int"
min = 1
max = 65535
default = 512
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 128
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 512
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 16

[derived]
pack_limit = "min(in0_d2, 128 // in0_d3)"
pack = "1 + (pack_limit - 1) * (1 - min(1, in0_d2 % pack_limit))"
pixels = "pack * in0_d3"
plane = "in0_d2 // pack"
groups = "in0_d0 * plane"
batch_skip = "(k - 1) * plane"
out_skip = "(n - 1) * plane"
active = "ds(pixels)"
full_blocks = "(k - 1) // 32"
shared = "min(1, k // 96) * min(1, max(0, 128 - k)) * (1 - min(1, k % 32))"
sum_blocks = "k // 32"

[inputs.in0]
shape = ["groups * k", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * (4 + 2 * full_blocks)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["groups * n", 128]

[scratch.sums]
shape = ["1 + shared * (groups * k - 1)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
n = "CR8"
plane = "CR9"
out_skip = "CR10"
sums = "CR11"
active = "CR12"
full_blocks = "CR14"
batch_skip = "CR15"
groups = "LR10"
sum_blocks = "LR15"

[cases.default]
