[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 16
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 65536
default = 16384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 128

[derived]
pack = "1 + (min(in0_d2, 128 // in0_d3) - 1) * (1 - min(1, in0_d2 % min(in0_d2, 128 // in0_d3)))"
height = "in0_d2 // pack"
stripes = "in0_d0 * height"
stripe_end = "((in0_d0 - 1) * k + 1) * height"
batch_skip = "(k - 1) * height"
output_skip = "(n - 1) * height"
full_blocks = "(k - 1) // 32"
shared = "(1 - k % 2) * min(1, k // 33)"
pairs = "k // 2"
active = "ds(in0_d3 * pack)"

[inputs.in0]
shape = ["stripes * in0_d1", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["2 * n * (2 + full_blocks)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["n * stripes", 128]

[scratch.sums]
shape = ["1 + shared * (stripes * k - 1)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
n = "CR8"
height = "CR9"
output_skip = "CR10"
stripe_end = "CR11"
active = "CR12"
batch_skip = "CR13"
full_blocks = "CR14"
sums = "CR15"
pairs = "LR9"

[cases.default]
