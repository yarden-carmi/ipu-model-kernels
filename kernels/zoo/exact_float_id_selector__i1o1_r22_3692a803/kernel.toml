[kernel]
op = "exact_float_id_selector"
formats = ["e2"]
[params.tokens]
type = "int"
min = 1
max = 256
default = 256
[params.vocab]
type = "int"
min = 1
max = 262144
default = 151669
[inputs.in0]
shape = [1, "tokens"]
[inputs.ramp]
shape = ["ceil(vocab / 128)", 3, 128]
[inputs.ones]
shape = [1, 128]
range = [1, 1]
[outputs.out0]
shape = ["tokens", "ceil(vocab / 128) * 128"]
[scratch.delta]
shape = [1, 128]
[scratch.flag]
shape = [1, 128]
[derived]
chunks = "ceil(vocab / 128)"
input_start = "128"
last = "halves(ds(128), ds((vocab - 1) % 128 + 1))"
[abi]
in0 = "CR2"
out0 = "CR3"
ramp = "CR4"
ones = "CR5"
delta = "CR6"
flag = "CR7"
qf_in0 = "CR8"
qf_out0 = "CR9"
qf_delta = "CR10"
qf_flag = "CR11"
qf_ramp = "CR12"
qf_ones = "CR13"
last = "CR15"
chunks = "LR10"
tokens = "LR11"
input_start = "LR7"
[cases.default]
tokens = 256
vocab = 151669
