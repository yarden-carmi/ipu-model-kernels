[kernel]
op = "bmm"
formats = ["e2"]

[params.b]
type = "int"
min = 1
max = 4096
default = 12
[params.k]
type = "int"
min = 1
max = 4096
default = 32
[params.m]
type = "int"
min = 1
max = 4096
default = 256
[params.n]
type = "int"
min = 1
max = 4096
default = 256
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 256
[params.in0_d2]
type = "int"
min = 1
default = 384
[params.in1_d0]
type = "int"
min = 1
default = 1
[params.in1_d1]
type = "int"
min = 1
default = 256
[params.in1_d2]
type = "int"
min = 1
default = 384
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 12
[params.out0_d2]
type = "int"
min = 1
default = 256
[params.out0_d3]
type = "int"
min = 1
default = 256
[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "in1_d2"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "out0_d3"]

[derived]
dsout = "ds(128) + 65536*ds((n-1)%128+1)"
arows = "ceil(in0_d2/128)"
brows = "ceil(in1_d1/128)"
nchunks = "ceil(n/128)"
agap = "(in0_d1-m)*arows - ((out0_d1-1)*k)//128"
bgap = "(in1_d2-out0_d1*k)*brows"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
k = "CR6"
m = "CR7"
nchunks = "CR8"
arows = "CR9"
dsout = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
brows = "CR14"
out0_d1 = "CR15"
agap = "LR13"
bgap = "LR14"

[cases.default]
