[kernel]
op = "bmm"
formats = ["e2"]
[params]
b = {type="int", min=1, max=65535, default=6}
k = {type="int", choices=[2, 4, 8, 16, 32, 64, 128], default=64}
m = {type="int", min=1, max=65535, default=257}
n = {type="int", min=1, max=65535, default=257}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=257}
in0_d2 = {type="int", min=1, max=65535, default=384}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=65535, default=257}
in1_d2 = {type="int", min=1, max=65535, default=384}
out0_d0 = {type="int", min=1, max=1, default=1}
out0_d1 = {type="int", min=1, max=65535, default=6}
out0_d2 = {type="int", min=1, max=65535, default=257}
out0_d3 = {type="int", min=1, max=65535, default=257}
[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2/128)*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "ceil(in1_d1/128)*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]
[derived]
ds = "ds((n-1)%128+1)+65536*ceil(n/128)"
stride = "ceil(in0_d2/128)+65536*(k*ceil(in1_d1/128))"
heads = "out0_d1"
full = "ds(128)+65536*(128-k)"
middle = "k-2"
bstep = "ceil(in1_d1/128)"
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR7"
qf_in1 = "CR8"
qf_out0 = "CR9"
ds = "CR10"
stride = "CR11"
m = "CR12"
n = "CR13"
heads = "CR14"
full = "CR15"
middle = "LR12"
k = "CR5"
bstep = "LR13"
[cases.default]
m = 3
n = 4
in0_d1 = 3
in1_d1 = 4
out0_d2 = 3
out0_d3 = 4
