[kernel]
op = "conv2d_builtin"
formats = ["e1"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 3
[params.cout]
type = "int"
min = 1
max = 128
default = 64
[params.groups]
type = "int"
min = 1
max = 128
default = 1
[params.h]
type = "int"
min = 7
max = 224
default = 224
[params.w]
type = "int"
min = 7
max = 224
default = 224
[params.kh]
type = "int"
choices = [3, 7]
default = 7
[params.kw]
type = "int"
choices = [3, 7]
default = 7
[params.padding]
type = "int"
choices = [1, 3]
default = 3
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 3
[params.in0_d2]
type = "int"
min = 7
max = 224
default = 224
[params.in0_d3]
type = "int"
min = 7
max = 224
default = 224
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 228
default = 112
[params.out0_d3]
type = "int"
min = 1
max = 228
default = 112

[derived]
tail = "ds(out0_d1)"
depthwise = "min(1, groups // max(cin, cout))"
tap_rows = "2 * (depthwise + (1 - depthwise) * cin)"
output_rows = "out0_d0 * out0_d2 * out0_d3"
line_step = "stride * in0_d3"
batch_step = "in0_d2 * in0_d3"
end_x = "out0_d3 * stride - padding"
end_y = "out0_d2 * stride - padding"
kernel_row_weights = "kw * tap_rows"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", 128]
range = [-2, 2]
[inputs.weights]
shape = ["2 + kh * kernel_row_weights", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tail = "CR7"
output_rows = "CR8"
line_step = "CR9"
batch_step = "CR10"
end_x = "CR11"
end_y = "CR12"
cin = "CR13"
tap_rows = "CR14"
in0_d2 = "CR15"
in0_d3 = "LR15"

[cases.default]
