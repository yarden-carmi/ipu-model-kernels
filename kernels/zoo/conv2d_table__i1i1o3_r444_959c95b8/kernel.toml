[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 16
[params.cout]
type = "int"
min = 16
max = 512
multiple_of = 16
default = 16
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 8
[params.w]
type = "int"
choices = [8, 16, 32, 64, 128]
default = 8
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 8
[params.in1_d0]
type = "int"
choices = [1]
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 512
default = 16
[params.in1_d2]
type = "int"
min = 1
max = 256
default = 8
[params.in1_d3]
type = "int"
choices = [8, 16, 32, 64, 128]
default = 8
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 16
max = 512
multiple_of = 16
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 256
default = 8
[params.out0_d3]
type = "int"
choices = [8, 16, 32, 64, 128]
default = 8

[derived]
i0c = "ceil(in0_d1 / 128)"
ic = "ceil(in1_d1 / 128)"
ds128 = "ds(128)"
pack = "128 // out0_d3"
tiles = "out0_d1 // pack"
wblock = "27 * ic"
wrows = "cout * wblock + 2 * tiles"
rowstep = "in1_d3 * ic"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "i0c", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "in1_d3", "ic", 128]
range = [-2, 2]
[inputs.weights]
shape = ["wrows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "tiles", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
weights = "CR4"
lut = "CR5"
out0 = "CR6"
qf_in0 = "CR7"
qf_in1 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
wblock = "CR12"
tiles = "CR13"
rowstep = "CR14"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
