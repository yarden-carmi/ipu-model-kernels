[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["hardsigmoid", "hardswish"]
default = "hardsigmoid"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65535
default = 8
[params.m]
type = "int"
min = 1
max = 65535
default = 1
[params.n]
type = "int"
min = 1
max = 65535
default = 16
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 8
[params.in0_d2]
type = "int"
min = 1
max = 32768
default = 1
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 1
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 32768
default = 1
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 1

[derived]
stripes = "in0_d0 * in0_d2"
batch_skip = "(k - 1) * in0_d2"
blocks = "ceil(n / 128)"
full_ds = "ds(128)"
tail_ds = "ds(n - 128 * (blocks - 1))"
src_lo = "50462976"
src_hi = "117835012"
split_taps = "16 - 8 * min(1, max(0, k - 96))"
shared = "min(1, max(0, k - 16)) * min(1, max(0, 97 - k))"
packed = "(1 - min(1, k % 16)) * (1 - min(1, in0_d3 % 8))"
narrow_pair = "min(1, max(0, 65 - n)) * min(1, max(0, 65 - k)) * (1 - k % 2)"
narrow_direct = "min(1, max(0, 65 - n)) * min(1, max(0, 33 - k))"

[inputs.in0]
shape = ["stripes * k", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["blocks * (2 + 2 * k - narrow_pair * k - (1 - max(narrow_pair, narrow_direct)) * packed * (16 - split_taps + 8 * shared) * (k // 16))", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["m * blocks", 128]

[scratch.panel]
shape = ["ceil(k / 16) + shared * (k + ceil(k / 16))", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
k = "CR8"
in0_d2 = "CR9"
in0_d3 = "CR10"
stripes = "LR10"
panel = "CR11"
src_lo = "LR14"
src_hi = "LR15"
full_ds = "CR12"
tail_ds = "CR13"
blocks = "CR14"
batch_skip = "CR15"

[cases.default]
