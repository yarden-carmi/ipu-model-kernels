[kernel]
op = "row_softmax"
formats = ["e1", "e2", "e3"]

[params]
n = {type = "int", min = 1, max = 4096, default = 50}
rows = {type = "int", min = 1, default = 600}
in0_d0 = {type = "int", min = 1, default = 1}
in0_d1 = {type = "int", min = 1, default = 12}
in0_d2 = {type = "int", min = 1, default = 50}
in0_d3 = {type = "int", min = 1, default = 50}
out0_d0 = {type = "int", min = 1, default = 1}
out0_d1 = {type = "int", min = 1, default = 12}
out0_d2 = {type = "int", min = 1, default = 50}
out0_d3 = {type = "int", min = 1, default = 50}

[derived]
pack = "1 + 64 // in0_d3"
K = "ceil(n / 128)"
M = "rows * K"
full = "ds(128)"
tail = "ds(n - (K - 1) * 128)"
scratch_qf = "312 * 65536 + 40"
shift_step = "n * (pack - 1) // max(1, pack - 1)"
shift_end = "128 + shift_step * pack"

[inputs.in0]
shape = ["ceil(in0_d0 * in0_d1 * in0_d2 / pack)", "ceil(in0_d3 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3 / 128)", 128]
[scratch.tmp]
shape = [11, 128]
[scratch.roots]
shape = ["K", 128]
[scratch.exps]
shape = ["K", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
scratch_qf = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
K = "CR7"
M = "CR8"
exps = "CR9"
qf_out0 = "CR10"
roots = "CR11"
shift_end = "CR12"
shift_step = "CR13"
tail = "CR14"
full = "CR15"

[cases.default]
