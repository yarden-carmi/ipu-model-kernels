[kernel]
op = "phase_pixel_shuffle"
formats = ["e2"]

[params]
channels = {type="int", min=1, default=48}
s = {type="int", min=1, max=8, default=4}
in0_d0 = {type="int", min=1, default=1}
in0_d1 = {type="int", min=1, default=768}
in0_d2 = {type="int", min=1, default=16}
in0_d3 = {type="int", min=1, default=16}
out0_d0 = {type="int", min=1, default=1}
out0_d1 = {type="int", min=1, default=48}
out0_d2 = {type="int", min=1, default=64}
out0_d3 = {type="int", min=1, max=128, default=64}

[derived]
active = "ds(out0_d3)"
input_rows = "ceil(in0_d1 / 128)"
spatial_rows = "in0_d0 * in0_d2"
spatial_step = "in0_d3 * ceil(in0_d1 / 128)"
limit = "128"
src_lo = "max(0, s - 8) + max(0, s - 7) * 256 + max(0, s - 6) * 65536 + max(0, s - 5) * 16777216"
src_hi = "max(0, s - 4) + max(0, s - 3) * 256 + max(0, s - 2) * 65536 + max(0, s - 1) * 16777216"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "ceil(in0_d1 / 128) * 128"]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d1", "ceil(out0_d3 / 128) * 128"]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
active = "CR6"
input_rows = "CR7"
spatial_rows = "CR8"
spatial_step = "CR9"
limit = "CR10"
channels = "CR11"
in0_d3 = "CR12"
src_lo = "CR13"
src_hi = "CR14"

[cases.default]
