[kernel]
op = "pool2d"
formats = ["e1"]

[params.channels]
type = "int"
min = 1
max = 4096
default = 64

[params.h]
type = "int"
min = 1
max = 4096
default = 112

[params.w]
type = "int"
min = 1
max = 128
default = 112

[params.k]
type = "int"
min = 1
max = 128
default = 3

[params.kind]
type = "str"
choices = ["max"]
default = "max"

[params.padding]
type = "int"
min = 0
max = 64
default = 1

[params.stride]
type = "int"
min = 1
max = 4096
default = 2

[params.in0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64

[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 112

[params.in0_d3]
type = "int"
min = 1
max = 128
default = 112

[params.out0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64

[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 56

[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", 128]

[derived]
output_rows = "out0_d0 * out0_d1 * out0_d2"
window_lanes = "ds(k)"
one_lane = "ds(1)"
output_lanes = "ds(out0_d3)"

[abi]
in0 = "CR2"
out0 = "CR3"
in0_d2 = "CR4"
in0_d3 = "CR5"
out0_d2 = "CR6"
out0_d3 = "CR7"
k = "CR8"
stride = "CR9"
padding = "CR10"
window_lanes = "CR11"
one_lane = "CR12"
output_lanes = "CR13"
qf_in0 = "CR14"
qf_out0 = "CR15"
output_rows = "LR2"

[cases.default]
