[kernel]
op = "pool2d"
formats = ["e1"]

[params.channels]
type = "int"
min = 1
max = 4096
default = 64

[params.h]
type = "int"
min = 1
max = 4096
default = 112

[params.w]
type = "int"
min = 1
max = 128
default = 112

[params.k]
type = "int"
min = 1
max = 128
default = 3

[params.kind]
type = "str"
choices = ["max"]
default = "max"

[params.padding]
type = "int"
min = 0
max = 64
default = 1

[params.stride]
type = "int"
min = 1
max = 128
default = 2

[params.in0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64

[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 112

[params.in0_d3]
type = "int"
min = 1
max = 128
default = 112

[params.out0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64

[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 56

[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", 128]

[derived]
planes = "out0_d0 * out0_d1"
ds_window = "ds(k)"
ds_one = "ds(1)"
ds_out = "ds(out0_d3)"
interior_begin = "min(out0_d3, ceil(padding / stride))"
interior_end = "max(interior_begin, min(out0_d3, (in0_d3 + padding - k) // stride + 1))"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
k = "CR6"
in0_d2 = "CR7"
in0_d3 = "CR8"
out0_d2 = "CR9"
out0_d3 = "CR10"
stride = "CR11"
padding = "CR12"
ds_window = "CR13"
ds_one = "CR14"
ds_out = "CR15"
planes = "LR15"
interior_begin = "LR13"
interior_end = "LR14"

[cases.default]
