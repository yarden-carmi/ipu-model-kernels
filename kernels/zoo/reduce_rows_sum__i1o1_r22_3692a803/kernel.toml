[kernel]
op = "reduce_rows"
formats = ["e3"]

[params.kind]
type = "str"
choices = ["sum"]
default = "sum"
[params.n]
type = "int"
min = 1
max = 65535
default = 512
[params.rows]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 512
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 1
default = 1

[derived]
padded = "128 * ceil(in0_d1 / 128)"
before_last = "ceil(n / 128) - 1"
before_penultimate = "before_last - 1"
last_row = "rows - 1"
advance = "ceil(in0_d1 / 128) - before_last"
full = "ds(128)"
tail = "ds(n - 128 * (ceil(n / 128) - 1))"
scalar = "ds(1)"

[inputs.in0]
shape = ["in0_d0", "padded"]
[outputs.out0]
shape = ["out0_d0", "128 * out0_d1"]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
last_row = "CR6"
before_last = "CR7"
full = "CR8"
tail = "CR9"
scalar = "CR10"
advance = "CR11"
before_penultimate = "CR12"

[cases.default]
