[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu", "relu6"]
default = "relu"
[params.bias]
type = "bool"
choices = [true]
default = true
[params.cin]
type = "int"
min = 1
max = 256
default = 16
[params.cout]
type = "int"
min = 1
max = 256
default = 16
[params.groups]
type = "int"
min = 1
max = 256
default = 16
[params.h]
type = "int"
min = 3
max = 256
default = 112
[params.w]
type = "int"
min = 3
max = 128
default = 112
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 256
default = 16
[params.in0_d2]
type = "int"
min = 3
max = 256
default = 112
[params.in0_d3]
type = "int"
min = 3
max = 128
default = 112
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 256
default = 16
[params.out0_d2]
type = "int"
min = 2
max = 256
default = 56
[params.out0_d3]
type = "int"
min = 2
max = 128
default = 56

[derived]
candidate = "128 // out0_d3"
pack = "1 + (candidate - 1) * (1 - min(1, out0_d2 % candidate))"
full = "ds(128)"
packed = "ds(pack * out0_d3)"
decimated = "ds(out0_d3)"
channel_rows = "in0_d0 * in0_d2"
input_rows = "in0_d1 * channel_rows"
weight_span = "30 * pack"
weight_rows = "out0_d1 * weight_span"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["ceil(out0_d1 * out0_d0 * out0_d2 / pack)", 128]
[scratch.parity]
shape = ["2 * input_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
parity = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
packed = "CR9"
out0_d3 = "CR10"
in0_d2 = "CR11"
pack = "CR12"
in0_d0 = "CR13"
weight_span = "CR14"
decimated = "CR15"
weight_rows = "LR5"
input_rows = "LR7"

[cases.default]
