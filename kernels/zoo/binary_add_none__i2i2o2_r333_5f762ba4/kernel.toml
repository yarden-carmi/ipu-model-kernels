[kernel]
op = "binary_add"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 64, max = 1048576, default = 147456 }
in0_d0 = { type = "int", min = 4, max = 4, default = 4 }
in0_d1 = { type = "int", min = 2, max = 1024, multiple_of = 2, default = 256 }
in0_d2 = { type = "int", min = 8, max = 256, multiple_of = 8, default = 144 }
in1_d0 = { type = "int", min = 4, max = 4, default = 4 }
in1_d1 = { type = "int", min = 2, max = 1024, multiple_of = 2, default = 256 }
in1_d2 = { type = "int", min = 8, max = 256, multiple_of = 8, default = 144 }
out0_d0 = { type = "int", min = 4, max = 4, default = 4 }
out0_d1 = { type = "int", min = 16, max = 1024, multiple_of = 16, default = 256 }
out0_d2 = { type = "int", min = 128, max = 256, multiple_of = 8, default = 144 }

[derived]
width = "ceil(out0_d2 / 128)"
tail = "ds((out0_d2 - 1) % 128 + 1) + 65536 * 344"
seq_lo = "50462976"
seq_hi = "117835012"
stride_lo = "403703808"
stride_hi = "942680096"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2 / 128) * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "ceil(in1_d2 / 128) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * ceil(out0_d1 * out0_d2 / 128)", 128]
[scratch.tiles]
shape = ["3 * (out0_d2 // 8) + 2", 128]
[scratch.sums]
shape = ["out0_d0 * out0_d1 * width * 3 + 1", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR13"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
tiles = "CR8"
seq_lo = "CR9"
seq_hi = "CR10"
stride_lo = "CR11"
stride_hi = "CR12"
tail = "CR14"
sums = "CR4"

[cases.default]
