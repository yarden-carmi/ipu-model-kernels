[kernel]
op = "gemm_table"
formats = ["e2"]

[params.k]
type = "int"
min = 1
max = 4096
default = 144
[params.n]
type = "int"
min = 1
max = 4096
default = 288
[params.m]
type = "int"
min = 1
max = 65535
default = 1024
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 144
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 288

[derived]
I = "ceil(in0_d2 / 128)"
O = "ceil(out0_d2 / 128)"
D = "m * k / (in0_d0 * in0_d1 * in0_d2)"
E = "m * n / (out0_d0 * out0_d1 * out0_d2)"
S = "I * D"
T = "O * E"
IR = "in0_d0 * in0_d1 * S"
OR = "out0_d0 * out0_d1 * T"
K = "ceil(k / 128)"
tail = "ds(out0_d2 - 128 * (O - 1))"
full = "ds(128)"
W = "max(2 - D, 0) * O * (k + 1) + min(D - 1, 1) * 3 * n * (K + 1)"

[inputs.in0]
shape = ["IR", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["W", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["OR", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
k = "CR8"
O = "CR9"
S = "CR10"
OR = "CR11"
K = "CR12"
n = "CR13"
tail = "CR14"
full = "CR15"

[cases.default]
