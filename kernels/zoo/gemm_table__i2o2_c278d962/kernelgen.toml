chain = ["gemm", "quick_gelu"]
chain_in = ["in0"]
chain_out = ["out0"]
notes = "Input and output dimension 2 occupies lanes, row order [0,1]. Folded transposed weights supply output-lane vectors; quick GELU is fused into the quantizing store through the LUT. K blocks are walked by a loop so any k to 1024 fits."
[layout.in0]
lanes = 2
rows = [0, 1]
[view.in0]
kind = "whole"
[layout.out0]
lanes = 2
rows = [0, 1]
[lut.out0]
range_mode = 0
range_exp = 36
