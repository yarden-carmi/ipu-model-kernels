[kernel]
op = "sparse_tile16_project"
formats = ["e2"]

[params.cin]
type = "int"
min = 48
max = 128
multiple_of = 48
default = 96
[params.cout]
type = "int"
min = 1
max = 128
default = 96
[params.kh]
type = "int"
min = 1
default = 2
[params.kw]
type = "int"
min = 1
default = 2
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 96
[params.in0_d2]
type = "int"
min = 1
default = 16
[params.in0_d3]
type = "int"
min = 1
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 96
[params.out0_d2]
type = "int"
min = 1
default = 32
[params.out0_d3]
type = "int"
min = 1
default = 32

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3", 128]
range = [-1, 1]
[inputs.weights]
shape = ["kh * kw * (cin + 1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3", 128]

[derived]
dsout = "ds(out0_d1)"
height = "in0_d0 * in0_d2"
sitejump = "(kh - 1) * out0_d3"
phasejump = "out0_d3 - kw"
weights_end = "kh * kw * (cin + 1)"

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
qf_weights = "CR7"
dsout = "CR8"
cin = "CR9"
height = "CR10"
in0_d3 = "CR11"
kw = "CR12"
sitejump = "CR13"
phasejump = "CR14"
weights_end = "CR15"

[cases.default]
