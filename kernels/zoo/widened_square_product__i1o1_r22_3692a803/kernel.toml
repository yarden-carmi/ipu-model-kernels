[kernel]
op = "widened_square_product"
formats = ["e3"]

[params.numel]
type = "int"
min = 1
default = 512

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
default = 512

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
default = 512

[inputs.in0]
shape = ["in0_d0", "128 * ceil(in0_d1 / 128)"]

[outputs.out0]
shape = ["out0_d0", "128 * ceil(out0_d1 / 128)"]

[derived]
rows = "in0_d0 * ceil(in0_d1 / 128)"

[abi]
in0 = "CR2"
out0 = "CR3"
rows = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"

[cases.default]
