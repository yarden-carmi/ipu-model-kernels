[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.m]
type = "int"
min = 1
max = 65536
default = 4
[params.k]
type = "int"
min = 1
max = 16384
default = 129
[params.n]
type = "int"
min = 1
max = 16384
default = 144
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 2
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 2
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 129
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 2
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 2
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 144

[derived]
chunks = "ceil(in0_d2 / 128)"
last = "(k - 1) % 128 - 1"
full = "ds(128)"
tail = "ds((out0_d1 * out0_d2 - 1) % 128 + 1)"
period = "1 + min(1, n % 128) + 2 * min(1, n % 64) + 4 * min(1, n % 32) + 8 * min(1, n % 16) + 16 * min(1, n % 8) + 32 * min(1, n % 4) + 64 * min(1, n % 2)"
prefix = "min(period, out0_d1)"
fragments = "prefix + ceil(prefix * n / 128) - 1"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * chunks", 128]
range = [-2, 2]
[inputs.w]
shape = ["fragments * 2 * (k + 1)", 128]
[outputs.out0]
shape = ["out0_d0 * ceil(out0_d1 * out0_d2 / 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
chunks = "CR7"
last = "CR8"
full = "CR9"
tail = "CR10"
period = "CR11"
out0_d1 = "CR12"
out0_d2 = "CR13"
out0_d0 = "LR13"

[cases.default]
