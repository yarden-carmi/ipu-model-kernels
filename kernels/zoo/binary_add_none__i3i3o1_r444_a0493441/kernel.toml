[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
numel = { type = "int", min = 1, max = 16777216, default = 18816 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, max = 128, default = 24 }
in0_d2 = { type = "int", min = 1, default = 28 }
in0_d3 = { type = "int", min = 1, max = 128, default = 28 }
in1_d0 = { type = "int", min = 1, default = 1 }
in1_d1 = { type = "int", min = 1, max = 128, default = 24 }
in1_d2 = { type = "int", min = 1, default = 28 }
in1_d3 = { type = "int", min = 1, max = 128, default = 28 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, max = 128, default = 24 }
out0_d2 = { type = "int", min = 1, default = 28 }
out0_d3 = { type = "int", min = 1, max = 128, default = 28 }

[derived]
p0 = "min(in0_d2, 128 // in0_d3)"
p1 = "min(in1_d2, 128 // in1_d3)"
stride0 = "ceil(in0_d2 / p0)"
stride1 = "ceil(in1_d2 / p1)"
packed_width = "p0 * in0_d3"
batch_stride = "in0_d1 * stride0"
spatial = "out0_d2 * out0_d3"
pixels = "out0_d0 * spatial"
pack_out = "1 + min(1, 64 // out0_d1)"
single = "ds(1)"
full = "ds(pack_out * out0_d1)"
tail = "ds(out0_d1)"

[inputs.in0]
shape = ["in0_d0 * batch_stride", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * stride1", 128]
range = [-2, 2]
[outputs.out0]
shape = ["ceil(pixels / pack_out)", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
stride0 = "CR8"
packed_width = "CR9"
out0_d1 = "CR10"
pack_out = "CR11"
single = "CR12"
full = "CR13"
tail = "CR14"
pixels = "LR11"
batch_stride = "LR14"
spatial = "LR15"

[cases.default]
