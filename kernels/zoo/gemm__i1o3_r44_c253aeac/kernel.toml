[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 256
[params.n]
type = "int"
min = 1
max = 4096
default = 96
[params.m]
type = "int"
min = 1
max = 65536
default = 1024
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 96
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 32
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 32

[derived]
chunks = "ceil(k / 128)"
input_chunks = "ceil(in0_d1 / 128)"
scanlines = "out0_d0 * out0_d2"
input_stride = "out0_d3 * input_chunks"
width = "ds(out0_d3)"
full = "ds(128)"
dot_ds = "ds(min(k, 128))"
coeff_stride = "2 * (1 + chunks)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * input_chunks", 128]
[inputs.coeff]
shape = ["n * coeff_stride", 128]
[outputs.out0]
shape = ["scanlines * out0_d1", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
width = "CR8"
dot_ds = "CR9"
input_chunks = "CR10"
input_stride = "CR11"
scanlines = "CR12"
coeff_stride = "CR13"
out0_d1 = "CR14"
chunks = "CR15"

[cases.default]
