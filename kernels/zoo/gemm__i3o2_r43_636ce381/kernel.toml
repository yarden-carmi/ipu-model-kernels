[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.m]
type = "int"
min = 1
max = 65536
default = 50
[params.k]
type = "int"
min = 1
max = 16384
default = 768
[params.n]
type = "int"
min = 1
max = 16384
default = 768
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 50
[params.in0_d3]
type = "int"
min = 1
max = 16384
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 50
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 768

[derived]
chunks = "ceil(k / 128)"
tiles = "ceil(out0_d2 / 128)"
rows = "out0_d0 * out0_d1"
last = "(k - 1) % 128"
width = "128"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
pack_max = "max(1, 128 // in0_d3)"
pack = "1 + (pack_max - 1) * (1 - min(1, in0_d2 % pack_max + 128 % in0_d3))"
block_width = "in0_d3 * pack"
block_rows = "ceil(block_width / 128)"
block_last_row = "block_rows - 1"
block_last_lane = "(block_width - 1) % 128"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * (in0_d2 // pack) * block_rows", 128]
[inputs.w]
shape = ["tiles * 2 * (k + 1)", 128]
[outputs.out0]
shape = ["rows * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
chunks = "CR7"
tiles = "CR8"
rows = "CR9"
last = "CR10"
width = "CR11"
full = "CR12"
tail = "CR13"
block_last_row = "CR14"
block_last_lane = "CR15"
k = "LR14"

[cases.default]

[cases.padded]
m = 2
k = 132
n = 129
in0_d1 = 1
in0_d2 = 2
in0_d3 = 132
out0_d1 = 2
out0_d2 = 129
