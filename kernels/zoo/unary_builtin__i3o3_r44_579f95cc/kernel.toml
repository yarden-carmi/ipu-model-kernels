[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
default = 65536

[params.in0_d0]
type = "int"
default = 1
[params.in0_d1]
type = "int"
default = 64
[params.in0_d2]
type = "int"
default = 32
[params.in0_d3]
type = "int"
default = 32
[params.out0_d0]
type = "int"
default = 1
[params.out0_d1]
type = "int"
default = 64
[params.out0_d2]
type = "int"
default = 32
[params.out0_d3]
type = "int"
default = 32

[derived]
in_rows = "in0_d0 * in0_d1 * in0_d2"
out_rows = "out0_d0 * out0_d1 * out0_d2"
active = "ds(out0_d3)"

[inputs.in0]
shape = ["in_rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
active = "CR6"
out_rows = "CR7"

[cases.default]
