[kernel]
op = "gemm_table"
formats = ["e2"]
[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.m]
type = "int"
min = 1
max = 16384
default = 5
[params.k]
type = "int"
min = 1
max = 128
default = 16
[params.n]
type = "int"
min = 1
max = 128
default = 64
[derived]
km1 = "k - 1"
dsn = "ds(n)"
[inputs.in0]
shape = ["m", 128]
range = [-2, 2]
[inputs.w]
shape = ["2 * k + 3", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["m", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
w = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
m = "CR8"
km1 = "CR9"
dsn = "CR10"
[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
m = 5
k = 16
n = 64
