[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params]
act_out0 = { type = "str", choices = ["relu"], default = "relu" }
numel = { type = "int", min = 1, default = 65536 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 64 }
in0_d2 = { type = "int", min = 1, default = 32 }
in0_d3 = { type = "int", min = 1, max = 128, default = 32 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 64 }
out0_d2 = { type = "int", min = 1, default = 32 }
out0_d3 = { type = "int", min = 1, max = 128, default = 32 }

[derived]
in_pack = "1 + min(1, 64 // in0_d3)"
out_pack = "1 + min(1, 64 // out0_d3)"
in_plane = "ceil(in0_d2 / in_pack)"
out_plane = "ceil(out0_d2 / out_pack)"
in_rows = "in0_d0 * in0_d1 * in_plane"
out_rows = "out0_d0 * out0_d1 * out_plane"
full_rows = "out_plane - 1"
active = "ds(out0_d3 * out_pack)"
tail_active = "ds(out0_d3 * (out0_d2 - full_rows * out_pack))"

[inputs.in0]
shape = ["in_rows", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
out_rows = "CR6"
full_rows = "CR7"
active = "CR8"
tail_active = "CR9"

[cases.default]
