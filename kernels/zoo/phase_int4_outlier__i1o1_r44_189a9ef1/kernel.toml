[kernel]
op = "phase_int4_outlier"
formats = ["e2"]

[params.cin]
type = "int"
min = 1
max = 64
default = 48
[params.cout]
type = "int"
min = 1
max = 128
default = 48
[params.kh]
type = "int"
min = 1
default = 4
[params.kw]
type = "int"
min = 1
default = 4
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 48
[params.in0_d2]
type = "int"
min = 1
default = 16
[params.in0_d3]
type = "int"
min = 1
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 48
[params.out0_d2]
type = "int"
min = 1
default = 64
[params.out0_d3]
type = "int"
min = 1
default = 64
[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3", "128 * ceil(in0_d1 / 128)"]
range = [-1, 1]
[inputs.helpers]
shape = [4, 128]
range = [-1, 1]
[inputs.weights]
shape = ["kh * kw * (3 * cin + 4)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3", "128 * ceil(out0_d1 / 128)"]
[scratch.tmp]
shape = [9, 128]

[derived]
sites = "in0_d0 * in0_d2 * in0_d3"
qi = "qf(1, 2, 8, 0) + 65536 * ds(1)"
di = "ds(cin)"
do = "ds(cout)"
row_gap = "out0_d3 - kw"
last_channel = "cin - 1"

[abi]
in0 = "CR2"
out0 = "CR3"
helpers = "CR4"
weights = "CR5"
tmp = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
qi = "CR9"
di = "CR10"
do = "CR11"
cin = "CR12"
in0_d3 = "CR13"
last_channel = "CR14"
row_gap = "CR15"
sites = "LR13"
kw = "LR14"
kh = "LR15"

[cases.default]
