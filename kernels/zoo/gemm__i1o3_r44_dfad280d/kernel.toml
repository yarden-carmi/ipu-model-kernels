[kernel]
op = "gemm"
formats = ["e1", "e2"]
[params]
bias = {type = "bool", default = true}
k = {type = "int", min = 1, max = 128, default = 64}
m = {type = "int", min = 1, max = 65536, default = 1024}
n = {type = "int", min = 1, max = 65536, default = 64}
in0_d0 = {type = "int", min = 1, max = 1, default = 1}
in0_d1 = {type = "int", min = 1, max = 128, default = 64}
in0_d2 = {type = "int", min = 2, max = 64, multiple_of = 2, default = 32}
in0_d3 = {type = "int", min = 32, max = 64, multiple_of = 32, default = 32}
out0_d0 = {type = "int", min = 1, max = 1, default = 1}
out0_d1 = {type = "int", min = 1, max = 65536, default = 64}
out0_d2 = {type = "int", min = 2, max = 64, multiple_of = 2, default = 32}
out0_d3 = {type = "int", min = 32, max = 64, multiple_of = 32, default = 32}
[derived]
width = "ceil(in0_d2 / 2)"
full = "ds(2 * out0_d3)"
kds = "ds(k)"
pixels = "2 * out0_d3"
last = "2 * out0_d3 - 2"
minusone = "-1"
[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3", 128]
[inputs.w]
shape = ["n * 3", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / 2)", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
n = "CR7"
full = "CR8"
width = "CR10"
kds = "CR13"
minusone = "CR14"
pixels = "CR15"
last = "CR12"
[cases.default]
