[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=32767, default=8}
k = {type="int", min=1, max=32767, default=64}
m = {type="int", min=2, max=128, multiple_of=2, default=64}
n = {type="int", min=1, max=64, default=64}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=2, max=128, multiple_of=2, default=64}
in0_d2 = {type="int", min=1, max=65535, default=512}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=64, default=64}
in1_d2 = {type="int", min=1, max=65535, default=512}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=8}
out0_d2 = {type="int", min=2, max=128, multiple_of=2, default=64}
out0_d3 = {type="int", min=1, max=64, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d2", 128]
range = [-1, 1]

[inputs.in1]
shape = ["in1_d0", "in1_d2", 128]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2//2", 128]

[scratch.merge]
shape = [1, 128]

[derived]
widths = "ds(n) + ds(2*n)*65536"
heads_unit = "out0_d1 + ds(1)*65536"
apitch = "in0_d2*min(1,in0_d0-1)"
bpitch = "in1_d2*min(1,in1_d0-1)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
k = "CR8"
m = "CR9"
heads_unit = "CR10"
out0_d0 = "CR11"
apitch = "CR12"
bpitch = "CR13"
widths = "CR14"
merge = "CR15"
n = "LR15"

[cases.default]
