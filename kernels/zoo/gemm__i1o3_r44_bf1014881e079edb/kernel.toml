[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 1048576
default = 16384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 128

[derived]
chunks = "ceil(k / 128)"
pixel_stride = "ceil(in0_d1 / 128)"
batch_stride = "in0_d2 * in0_d3 * pixel_stride"
tiles = "ceil(out0_d3 / 128)"
full = "ds(128)"
tail = "ds(1 + (out0_d3 - 1) % 128)"
coeff_stride = "2 * (1 + chunks)"

[inputs.in0]
shape = ["in0_d0 * batch_stride", 128]
[inputs.coeff]
shape = ["n * coeff_stride", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2 * tiles", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
pixel_stride = "CR9"
batch_stride = "CR10"
tiles = "CR11"
coeff_stride = "CR12"
out0_d2 = "CR13"
out0_d1 = "CR14"
out0_d0 = "LR14"
chunks = "LR15"

[cases.default]
