[kernel]
op = "bmm"
formats = ["e3"]

[params]
b = {type="int", min=1, max=65535, default=8}
k = {type="int", min=1, max=128, default=64}
m = {type="int", min=1, max=65535, default=64}
n = {type="int", min=1, max=128, default=64}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=8}
in0_d2 = {type="int", min=1, max=65535, default=64}
in0_d3 = {type="int", min=1, max=128, default=64}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=65535, default=64}
in1_d2 = {type="int", min=1, max=8388480, default=512}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=8}
out0_d2 = {type="int", min=1, max=65535, default=64}
out0_d3 = {type="int", min=1, max=128, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [0, 1]

[inputs.in1]
shape = ["in1_d0", "in1_d1", "brows*128"]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", 128]

[derived]
brows = "ceil(in1_d2/128)"
group_rows = "in1_d1*brows"
total_rows = "in1_d0*group_rows"
offset = "in1_d2-in0_d1*n"
vbase = "base(in1)+offset//128"
head_lane = "offset%128"
widths = "k + n*65536"
counts = "m + in0_d1*65536"
ds = "ds(128) + ds(n)*65536"

[abi]
in0 = "CR2"
vbase = "CR3"
out0 = "CR4"
brows = "CR5"
group_rows = "CR6"
total_rows = "CR7"
head_lane = "CR8"
widths = "CR9"
counts = "CR10"
ds = "CR11"
qf_in0 = "CR12"
qf_in1 = "CR13"
qf_out0 = "CR14"

[cases.default]
