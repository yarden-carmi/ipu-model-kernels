[kernel]
op = "conv2d_table"
formats = ["e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 256
[params.cout]
type = "int"
min = 1
max = 512
default = 128
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 3
max = 256
default = 16
[params.w]
type = "int"
min = 3
max = 128
default = 16
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 256
[params.in0_d2]
type = "int"
min = 3
max = 256
default = 16
[params.in0_d3]
type = "int"
min = 3
max = 128
default = 16
[params.in1_d0]
type = "int"
choices = [1]
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 512
default = 256
[params.in1_d2]
type = "int"
min = 3
max = 256
default = 16
[params.in1_d3]
type = "int"
min = 3
max = 128
default = 16
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 512
default = 128
[params.out0_d2]
type = "int"
min = 2
max = 256
default = 16
[params.out0_d3]
type = "int"
min = 2
max = 128
default = 16

[derived]
ic = "ceil(in1_d1 / 128)"
oc = "ceil(out0_d1 / 128)"
orows = "3 + 18 * cin"
ds128 = "ds(128)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "in1_d3", "ic", 128]
range = [-2, 2]
[inputs.weights]
shape = ["oc * orows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", "oc", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
weights = "CR4"
lut = "CR5"
out0 = "CR6"
qf_in0 = "CR7"
qf_in1 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
oc = "CR12"
orows = "CR13"

[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
formats = ["e2"]
