chain = ["gemm"]
chain_in = ["in0"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [0, 1, 2]
pack = "1 + (1 - min(1, d2 % 2 + max(0, d3 - 64) + k % (2 * d3)))"

[prefer.in0]
lanes = 3
rows = [0, 1, 2]
pack = "1 + (1 - min(1, d2 % 2 + max(0, d3 - 64) + k % (2 * d3)))"

[view.in0]
kind = "merge"

[format.w]
format = "e1"

[layout.out0]
lanes = 0
rows = [2, 1]
pack = "d1"
