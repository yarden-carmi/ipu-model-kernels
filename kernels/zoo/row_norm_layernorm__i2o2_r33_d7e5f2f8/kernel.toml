[kernel]
op = "row_norm"
formats = ["e2"]
[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 129
max = 256
multiple_of = 16
default = 240
[params.rows]
type = "int"
min = 64
max = 1024
multiple_of = 64
default = 64
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-5
[params.in0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.in0_d1]
type = "int"
min = 16
max = 256
multiple_of = 16
default = 16
[params.in0_d2]
type = "int"
min = 129
max = 256
multiple_of = 16
default = 240
[params.out0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.out0_d1]
type = "int"
min = 16
max = 256
multiple_of = 16
default = 16
[params.out0_d2]
type = "int"
min = 129
max = 256
multiple_of = 16
default = 240

[derived]
half_row = "64"
c128 = "50462976"
cC = "117835012"
dsl = "ds(channels - 128)"
[inputs.in0]
shape = ["(in0_d1 * in0_d2 + 127) // 128 * in0_d0", 128]
range = [-2.0, 2.0]
[inputs.gamma]
shape = [6, 128]
[inputs.beta]
shape = [6, 128]
[inputs.crow]
shape = [3, 128]
[inputs.epsilon]
shape = [128]
[scratch.tmp]
shape = ["40 + 2 * rows + (rows // 8) * (channels // 16)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * 2", 128]
[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
crow = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
c128 = "CR10"
cC = "CR11"
epsilon = "CR12"
half_row = "CR13"
dsl = "CR14"
[golden]
tolerance = { e2 = "NX8_STEP" }

[cases.default]
