[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params]
act_out0 = { type = "str", choices = ["relu"], default = "relu" }
numel = { type = "int", min = 1, default = 65536 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 64 }
in0_d2 = { type = "int", min = 1, default = 32 }
in0_d3 = { type = "int", min = 1, max = 128, default = 32 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 64 }
out0_d2 = { type = "int", min = 1, default = 32 }
out0_d3 = { type = "int", min = 1, max = 128, default = 32 }

[derived]
w = "in0_d3"
h = "in0_d2"
capacity = "128 // w"
pack = "1 + (capacity - 1) * max(1 - min(1, h % capacity), 1 - min(1, max(h * w - 64, 64 - h * w) + 128 % w)) - (1 - min(1, max(w - 32, 32 - w) + h % 4))"
plane_rows = "ceil(h / pack)"
full_rows = "plane_rows - 1"
rows = "in0_d0 * in0_d1 * plane_rows"
last_row = "rows - 1"
active = "ds(w * pack)"
tail = "ds(w * (h - full_rows * pack))"

[inputs.in0]
shape = ["rows", 128]
range = [-2, 2]

[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
last_row = "CR6"
full_rows = "CR7"
active = "CR8"
tail = "CR9"

[cases.default]
