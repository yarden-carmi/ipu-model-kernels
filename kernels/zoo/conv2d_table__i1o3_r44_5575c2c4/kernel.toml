[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]
[params]
act_out0 = {type="str", choices=["hardswish"], default="hardswish"}
bias = {type="bool", default=true}
cin = {type="int", min=1, max=640, default=144}
cout = {type="int", min=1, max=640, default=144}
groups = {type="int", min=1, max=640, default=144}
h = {type="int", min=5, max=28, default=14}
w = {type="int", min=5, max=28, default=14}
kh = {type="int", choices=[5], default=5}
kw = {type="int", choices=[5], default=5}
padding = {type="int", choices=[2], default=2}
stride = {type="int", choices=[1,2], default=1}
in0_d0 = {type="int", choices=[1], default=1}
in0_d1 = {type="int", min=1, max=640, default=144}
in0_d2 = {type="int", min=5, max=28, default=14}
in0_d3 = {type="int", min=5, max=28, default=14}
out0_d0 = {type="int", choices=[1], default=1}
out0_d1 = {type="int", min=1, max=640, default=144}
out0_d2 = {type="int", min=1, max=28, default=14}
out0_d3 = {type="int", min=1, max=28, default=14}
[derived]
ic = "ceil(in0_d1 / 128)"
oc = "ceil(out0_d1 / 128)"
ds128 = "ds(128)"
pack = "128 // out0_d3"
ds_out = "ds(pack * out0_d3)"
ds_last = "ds((1 + (out0_d2 - 1) % pack) * out0_d3)"
window_jump = "in0_d3 + 2 * padding - kw"
weight_block = "3 * (1 + kh * kw)"
area = "out0_d2 * out0_d3"
[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "ic", 128]
range = [-2, 2]
[inputs.weights]
shape = ["oc * weight_block", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.pad]
shape = ["(in0_d2 + 2 * padding) * (in0_d3 + 2 * padding) + 16", 128]
[scratch.tmp]
shape = ["out0_d2 * out0_d3 * oc + oc", 128]
[scratch.residual]
shape = ["5 * out0_d2 * out0_d3 * oc + oc", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "ceil(out0_d2 / pack)", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
pad = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
tmp = "CR11"
window_jump = "CR12"
ds_out = "CR13"
ds_last = "CR14"
residual = "CR15"
[golden]
tolerance = {e1="NX8_STEP", e2="NX8_STEP"}
[cases.default]
