[kernel]
op = "row_norm"
formats = ["e2"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 1
max = 4096
default = 768
[params.rows]
type = "int"
min = 1
max = 65536
default = 256
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-12
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 768
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 768

[derived]
stride = "ceil(in0_d1 / 128)"
K = "ceil(channels / 128)"
size = "rows * K"
batch = "in0_d2 * stride"
tail = "ds(channels - 128 * (K - 1)) + 65536 * ds(128)"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "stride * 128"]
range = [-2.0, 2.0]
[inputs.affine]
shape = ["6 * K", 128]
[inputs.stats]
shape = [6, 128]
[scratch.tmp]
shape = [32, 128]
[scratch.center_hi]
shape = ["3 * K", 128]
[scratch.trans]
shape = ["3 * size", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "ceil(out0_d2 / 128) * 128"]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
affine = "CR6"
stats = "CR7"
tmp = "CR8"
stride = "CR9"
size = "CR10"
channels = "CR11"
tail = "CR12"
trans = "CR13"
center_hi = "CR14"
qf_affine = "CR15"
batch = "LR13"
in0_d1 = "LR14"
K = "LR15"

[cases.default]
