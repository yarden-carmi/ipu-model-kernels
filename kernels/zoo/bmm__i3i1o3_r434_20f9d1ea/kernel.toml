[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=32767, default=12}
k = {type="int", min=1, max=128, default=50}
m = {type="int", min=2, max=32766, multiple_of=2, default=50}
n = {type="int", min=1, max=64, default=64}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=32767, default=12}
in0_d2 = {type="int", min=2, max=32766, multiple_of=2, default=50}
in0_d3 = {type="int", min=1, max=128, default=50}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=128, default=50}
in1_d2 = {type="int", min=1, max=4194176, default=768}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=12}
out0_d2 = {type="int", min=2, max=32766, multiple_of=2, default=50}
out0_d3 = {type="int", min=1, max=64, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [0, 1]

[inputs.in1]
shape = ["in1_d0", "in1_d2", 128]
range = [-1, 1]

[outputs.out0]
shape = ["ceil(out0_d0*out0_d1*out0_d2/2)", 128]

[derived]
widths = "ds(k)+65536*ds(2*n)"
gap = "in1_d2-out0_d1*n"
groups = "b//out0_d1"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
widths = "CR9"
m = "CR10"
n = "CR11"
out0_d1 = "CR12"
gap = "CR13"
groups = "LR15"

[cases.default]
