[cases.mv128]                                          # {cin cout groups} 128 at 128x128
# The widest surveyed call: x is 16384 rows of FP32 and y 4096 more, 20492 rows
# of the 1048576 the FP32 window addresses -- and the reason this kernel is not
# NX8, whose programs address 16384 rows in total.
h = 128
w = 128
cin = 128
cout = 128
groups = 128
tier = "nightly"

