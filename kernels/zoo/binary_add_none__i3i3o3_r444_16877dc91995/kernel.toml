[kernel]
op = "binary_add"
formats = ["e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 16384 }
in0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in0_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
in0_d2 = { type = "int", min = 1, max = 16777216, default = 16 }
in0_d3 = { type = "int", min = 1, max = 128, default = 16 }
in1_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in1_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
in1_d2 = { type = "int", min = 1, max = 16777216, default = 16 }
in1_d3 = { type = "int", min = 1, max = 128, default = 16 }
out0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
out0_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
out0_d2 = { type = "int", min = 1, max = 16777216, default = 16 }
out0_d3 = { type = "int", min = 1, max = 128, default = 16 }

[derived]
pack0 = "128 // in0_d3"
pack1 = "128 // in1_d3"
packout = "128 // out0_d3"
planes = "out0_d0 * out0_d1"
pitch = "ceil(out0_d2 / packout)"
full = "ds(packout * out0_d3)"
tail = "ds(((out0_d2 - 1) % packout + 1) * out0_d3)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / pack0)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 / pack1)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["planes * pitch", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
pitch = "CR8"
full = "CR9"
tail = "CR10"
planes = "LR3"

[cases.default]
