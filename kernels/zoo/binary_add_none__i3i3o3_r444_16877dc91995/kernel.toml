[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 147456
[params.in0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 144
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 32
[params.in1_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 144
[params.in1_d3]
type = "int"
min = 1
max = 128
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 144
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 32

[derived]
blocks = "ceil(out0_d2 / (128 // out0_d3))"
channels = "out0_d0 * out0_d1 - 1"
full = "ds((128 // out0_d3) * out0_d3)"
tail = "ds(((out0_d2 - 1) % (128 // out0_d3) + 1) * out0_d3)"
before_tail = "blocks - 1"
full_end = "blocks - 2"

[inputs.in0]
shape = ["in0_d1", "in0_d0", "ceil(in0_d2 / (128 // in0_d3)) * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d1", "in1_d0", "ceil(in1_d2 / (128 // in1_d3)) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d1", "out0_d0", "blocks * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
channels = "CR8"
before_tail = "CR9"
tail = "CR10"
full = "CR11"
full_end = "CR12"

[cases.default]
