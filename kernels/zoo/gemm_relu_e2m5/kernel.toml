[kernel]
op = "gemm_relu"
formats = ["e2"]

[params.m]
type = "int"
min = 1
max = 16384
default = 2
[params.k]
type = "int"
min = 4
max = 128
default = 16
[params.n]
type = "int"
min = 1
max = 128
default = 72
[params.bias]
type = "bool"
default = true

[inputs.in0]
shape = ["m", 128]
range = [-2, 2]
[inputs.w]
shape = ["k", 128]
range = [-2, 2]
[inputs.b]
shape = [128]
range = [-2, 2]
when = "bias"
[outputs.out0]
shape = ["m", 128]

[derived]
qf = "case_qf"
tail = "ds(n)"
c128 = "128"
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
qf = "CR9"
tail = "CR10"
c128 = "CR11"
[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
m = 3
k = 16
n = 72
bias = true
[cases.no_bias]
m = 2
k = 4
n = 128
bias = false
[cases.wide]
m = 2
k = 128
n = 17
bias = true
