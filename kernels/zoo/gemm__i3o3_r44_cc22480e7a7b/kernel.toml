[kernel]
op = "gemm"
formats = ["e1"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 120
[params.m]
type = "int"
min = 1
default = 196
[params.n]
type = "int"
min = 1
default = 48
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 120
[params.in0_d2]
type = "int"
min = 1
default = 14
[params.in0_d3]
type = "int"
min = 1
default = 14
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 48
[params.out0_d2]
type = "int"
min = 1
default = 14
[params.out0_d3]
type = "int"
min = 1
default = 14
[derived]
ip = "min(in0_d2, max(1, 128 // in0_d3))"
op = "min(out0_d2, max(1, 128 // out0_d3))"
pitch = "ceil(in0_d2 / ip) * ceil(ip * in0_d3 / 128)"
opitch = "ceil(out0_d2 / op) * ceil(op * out0_d3 / 128)"
chunks = "ceil(k / 128)"
wr = "2 + 2 * chunks"
batchstride = "k * pitch"
chunkstride = "128 * pitch"
full = "ds(128)"
active = "ds(min(128, op * out0_d3))"
tail = "ds(min(128, ((out0_d2 - 1) % op + 1) * out0_d3))"
lastrow = "pitch - 1"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * pitch", 128]
[inputs.w]
shape = ["n * wr", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * opitch", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
pitch = "CR7"
n = "CR8"
full = "CR9"
wr = "CR10"
batchstride = "CR11"
in0_d0 = "CR12"
chunkstride = "CR13"
active = "CR14"
tail = "CR15"
lastrow = "LR15"
[cases.default]
