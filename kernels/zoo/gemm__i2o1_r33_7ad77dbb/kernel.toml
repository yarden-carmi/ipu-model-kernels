[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 192
[params.m]
type = "int"
min = 1
max = 65536
default = 256
[params.n]
type = "int"
min = 1
max = 65536
default = 576
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 192
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 576

[derived]
blocks = "ceil(k / 128)"
input_blocks = "ceil(in0_d2 / 128)"
pack = "1 + min(1, 64 // out0_d1) * (1 - out0_d2 % 2)"
out_ds = "ds(pack * out0_d1)"
full = "ds(128)"
single = "ds(1)"
batch_stride = "out0_d1 * input_blocks"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * input_blocks", 128]
range = [-2, 2]
[inputs.w]
shape = ["n * blocks", 128]
range = [-1, 1]
[inputs.b]
shape = ["n", 128]
range = [-1, 1]
when = "bias"
[outputs.out0]
shape = ["out0_d0 * out0_d2 // pack", 128]

[abi]
in0 = "CR2"
w = "CR3"
b = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
blocks = "CR8"
out0_d0 = "CR9"
out0_d1 = "CR10"
out0_d2 = "CR11"
out_ds = "CR12"
full = "CR13"
single = "CR14"
pack = "CR15"
input_blocks = "LR14"
batch_stride = "LR15"

[cases.default]
