[kernel]
op = "gemm"
formats = ["e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 768
[params.m]
type = "int"
min = 1
max = 65536
default = 50
[params.n]
type = "int"
min = 1
max = 4096
default = 768
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 50
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 50
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 768
[derived]
tiles = "ceil(out0_d2 / 128)"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
rows = "out0_d0 * out0_d1"
last_lane = "in0_d3 - 1"
slot = "128"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * (k + 1) * 6", 128]
range = [-1, 1]
[outputs.out0]
shape = ["rows * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
last_lane = "CR10"
rows = "CR11"
k = "CR12"
slot = "CR13"

[golden]
tolerance = {e3 = "NX8_STEP"}
[cases.default]
