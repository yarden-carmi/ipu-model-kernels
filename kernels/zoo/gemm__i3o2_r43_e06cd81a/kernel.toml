[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 768
[params.m]
type = "int"
min = 1
max = 65536
default = 256
[params.n]
type = "int"
min = 1
max = 65536
default = 768
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 768

[derived]
tiles = "ceil(n / 128)"
full = "ds(128)"
tail = "ds((n - 1) % 128 + 1)"
rows = "out0_d0 * out0_d1"
last_lane = "in0_d3 - 1"
slot = "128"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2", 128]
[inputs.w]
shape = ["tiles * (k + 1) * 3 + 1", 128]
[outputs.out0]
shape = ["rows * ceil(out0_d2 / 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
last_lane = "CR10"
rows = "CR11"
k = "CR12"
slot = "CR13"

[golden]
tolerance = {e2 = "NX8_STEP", e3 = "NX8_STEP"}

[cases.default]
k = 19
m = 3
n = 131
in0_d0 = 1
in0_d1 = 1
in0_d2 = 3
in0_d3 = 19
out0_d0 = 1
out0_d1 = 3
out0_d2 = 131
