[kernel]
op = "gemm_binary_add"
formats = ["e2"]

[params.s0_bias]
type = "bool"
default = true
[params.s0_k]
type = "int"
min = 2
max = 8192
default = 144
[params.s0_m]
type = "int"
min = 1
max = 4096
default = 1024
[params.s0_n]
type = "int"
min = 4
max = 768
default = 144
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 1
max = 3145728
default = 147456
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"
[params.in0_d0]
type = "int"
min = 1
max = 4
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 64
default = 4
[params.in0_d2]
type = "int"
min = 1
max = 1024
default = 256
[params.in0_d3]
type = "int"
min = 2
max = 128
default = 36
[params.in1_d0]
type = "int"
min = 1
max = 4
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 1024
default = 256
[params.in1_d2]
type = "int"
min = 4
max = 768
default = 144
[params.out0_d0]
type = "int"
min = 1
max = 4
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 1024
default = 256
[params.out0_d2]
type = "int"
min = 4
max = 768
default = 144

[derived]
tiles = "ceil(out0_d2 / 128)"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
last_lane = "in0_d3 - 1"
slot = "128"
stepq = "ceil((s0_m - (s0_m % in1_d2)) / in1_d2) * ceil(in1_d2 / 128)"
weight_stride = "5 * (s0_k + 1)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 / 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * (s0_k + 1) * 5 + 1", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * tiles", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
full = "CR9"
tail = "CR10"
slot = "CR11"
in1_d2 = "CR12"
stepq = "CR13"
weight_stride = "CR14"
last_lane = "CR15"

[cases.default]
