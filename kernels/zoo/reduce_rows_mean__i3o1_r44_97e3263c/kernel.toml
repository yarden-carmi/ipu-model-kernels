[kernel]
op = "reduce_rows_mean"
formats = ["e1"]

[params.kind]
type = "str"
choices = ["mean"]
default = "mean"
[params.n]
type = "int"
min = 1
max = 65536
default = 196
[params.rows]
type = "int"
min = 1
max = 16384
default = 96
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 96
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 14
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 96
[params.out0_d2]
type = "int"
choices = [1]
default = 1
[params.out0_d3]
type = "int"
choices = [1]
default = 1

[derived]
pack = "max(1, 2 * (64 // in0_d3))"
row_step = "in0_d1 // pack"
lane_step = "(in0_d1 % pack) * in0_d3"
packed_width = "pack * in0_d3"
widths = "65536 * in0_d3 + packed_width"
active = "ds(in0_d3)"
tiles = "ceil(out0_d1 / 128)"
full = "ds(128)"
tail = "ds(out0_d1 - 128 * (tiles - 1))"
# Normalize the reciprocal to [1, 2) before encoding the CR scalar.
shift = "min(1, (n-1)//1) + min(1, (n-1)//2) + min(1, (n-1)//4) + min(1, (n-1)//8) + min(1, (n-1)//16) + min(1, (n-1)//32) + min(1, (n-1)//64) + min(1, (n-1)//128) + min(1, (n-1)//256) + min(1, (n-1)//512) + min(1, (n-1)//1024) + min(1, (n-1)//2048) + min(1, (n-1)//4096) + min(1, (n-1)//8192) + min(1, (n-1)//16384) + min(1, (n-1)//32768)"
factor = "1 + min(1, (n-1)//1) + 2*min(1, (n-1)//2) + 4*min(1, (n-1)//4) + 8*min(1, (n-1)//8) + 16*min(1, (n-1)//16) + 32*min(1, (n-1)//32) + 64*min(1, (n-1)//64) + 128*min(1, (n-1)//128) + 256*min(1, (n-1)//256) + 512*min(1, (n-1)//512) + 1024*min(1, (n-1)//1024) + 2048*min(1, (n-1)//2048) + 4096*min(1, (n-1)//4096) + 8192*min(1, (n-1)//8192) + 16384*min(1, (n-1)//16384) + 32768*min(1, (n-1)//32768)"
inv = "65536 + 256 * (127 - shift) + min(127, (256 * factor + n) // (2 * n) - 128)"
inv_fp32 = "8388608 * (127 - shift) + (8388608 * factor + n // 2) // n - 8388608"

[inputs.in0]
shape = ["ceil(in0_d1 * in0_d2 / pack)", 128]
[outputs.out0]
shape = ["tiles", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
row_step = "CR6"
lane_step = "CR7"
widths = "CR8"
in0_d2 = "CR9"
out0_d1 = "CR10"
active = "CR11"
full = "CR12"
tail = "CR13"
inv = "CR14"
inv_fp32 = "CR15"

[cases.default]
