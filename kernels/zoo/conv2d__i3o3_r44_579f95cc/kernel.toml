[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.groups]
type = "int"
choices = [1]
default = 1
[params.cin]
type = "int"
min = 1
max = 1024
default = 64
[params.cout]
type = "int"
min = 1
max = 2048
default = 16
[params.h]
type = "int"
min = 1
max = 1024
default = 128
[params.w]
type = "int"
min = 1
max = 128
default = 128
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1024
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 1024
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2048
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 1024
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 128

[derived]
input_rows = "in0_d0 * in0_d1 * in0_d2"
output_rows = "out0_d0 * out0_d1 * out0_d2"
taps = "9 * cin"
panels = "taps // 128"
weight_rows = "cout * (1 + 2 * ceil(taps / 128))"
full = "ds(128)"
width = "ds(out0_d3)"
step = "stride * in0_d1"
mask_rows = "4 - stride + (1 - stride)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[inputs.masks]
shape = ["mask_rows", 128]
range = [0, 1]
[scratch.patches]
shape = ["taps", 128]
[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
masks = "CR5"
patches = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
full = "CR9"
width = "CR10"
in0_d1 = "CR11"
weight_rows = "CR12"
output_rows = "CR13"
step = "CR14"
input_rows = "CR15"

[cases.default]
