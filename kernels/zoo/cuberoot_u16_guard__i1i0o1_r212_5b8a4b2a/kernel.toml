[kernel]
op = "cuberoot_u16_guard"
formats = ["e3"]

[params.numel]
type = "int"
min = 1
default = 512

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
default = 512

[params.in1_d0]
type = "int"
min = 1
default = 1

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
default = 512

[inputs.in0]
shape = ["in0_d0", "ceil(in0_d1 / 128) * 128"]

[inputs.in1]
shape = ["ceil(in1_d0 / 128) * 128"]

[outputs.out0]
shape = ["out0_d0", "chunks * 128"]

[derived]
groups = "out0_d0"
chunks = "ceil(out0_d1 / 128)"
tail = "ds((out0_d1 - 1) % 128 + 1)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
groups = "CR8"
chunks = "CR9"
tail = "CR10"

[cases.default]
