[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 16
[params.m]
type = "int"
min = 1
max = 65535
default = 16384
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 128

[derived]
batch_rows = "in0_d3 * in0_d1"
coeff_rows = "5 * ceil((k + 1) / 128)"
last_lane = "127"
row_width = "128"
out_ds = "ds(out0_d2)"

[inputs.in0]
shape = ["in0_d0 * batch_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d3", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
lut = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
out_ds = "CR8"
k = "CR9"
in0_d3 = "CR10"
n = "CR11"
in0_d0 = "CR12"
last_lane = "CR13"
row_width = "CR14"
coeff_rows = "CR15"
batch_rows = "LR13"

[cases.default]
