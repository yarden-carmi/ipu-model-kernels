[kernel]
op = "gemm"
formats = ["e1", "e2"]
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 256
[params.m]
type = "int"
min = 1
max = 65536
default = 1024
[params.n]
type = "int"
min = 1
max = 4096
default = 96
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 96
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 32
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 32

[derived]
spatial = "in0_d2 * in0_d3"
small = "1 - min(1, max(spatial - 64, 64 - spatial) + k % 2 + n % 2 + 128 % in0_d3 + in0_d0 - 1)"
ic = "max(1, 128 // in0_d3)"
oc = "max(1, 128 // out0_d3)"
ip = "1 + (ic - 1) * max(1 - min(1, in0_d2 % ic), 1 - min(1, max(spatial - 64, 64 - spatial) + 128 % in0_d3)) - (1 - min(1, max(in0_d3 - 32, 32 - in0_d3) + in0_d2 % 4 + max(0, k - 96)))"
op = "1 + (oc - 1) * max(1 - min(1, out0_d2 % oc), 1 - min(1, max(out0_d2 * out0_d3 - 64, 64 - out0_d2 * out0_d3) + 128 % out0_d3)) - (1 - min(1, max(out0_d3 - 32, 32 - out0_d3) + out0_d2 % 4 + max(0, k - 96)))"
pitch = "ceil(in0_d2 / ip) * ceil(ip * in0_d3 / 128)"
spatial_rows = "in0_d0 * pitch"
active = "ds(small * ((k - 1) % 128 + 1) + (1 - small) * min(128, ip * in0_d3))"
blocks = "ceil(k / 32)"
sw_rows = "n * (2 + 2 * blocks)"
chunks = "ceil(k / 128)"
full = "ds(128)"
lanes128 = "128"
pair_src = "1073741824"
pair_dst = "16777216"
pair_spatial = "small * 1073741824 + (1 - small) * k * pitch"
packed_start = "64 * chunks"
half = "ds(64)"
spatial_tail = "ds(max(1, min(128, (in0_d2 - 1) % ip * in0_d3 + in0_d3)))"
weight_rows = "small * n * (3 + chunks) + (1 - small) * sw_rows"
unbiased_rows = "small * n * (3 + chunks) + (1 - small) * sw_rows"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * pitch", 128]
range = [-2, 2]
[inputs.w]
shape = ["weight_rows", 128]
range = [-1, 1]
when = "bias"
[inputs.w_unbiased]
shape = ["unbiased_rows", 128]
range = [-1, 1]
when = "not bias"
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / op) * ceil(op * out0_d3 / 128)", 128]

[scratch.panel]
shape = ["small * (packed_start + k // 2) + 1", 128]

[abi]
in0 = "CR2"
w = "CR3"
w_unbiased = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
chunks = "CR7"
n = "CR8"
full = "CR9"
lanes128 = "CR12"
active = "CR13"
pair_src = "LR6"
pair_dst = "LR14"
pair_spatial = "LR15"
panel = "CR14"
pitch = "LR4"
half = "CR15"
packed_start = "LR5"
spatial_tail = "CR11"

[cases.default]
