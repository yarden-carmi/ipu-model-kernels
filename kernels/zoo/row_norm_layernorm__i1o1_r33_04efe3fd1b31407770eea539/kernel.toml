[kernel]
op = "row_norm"
formats = ["e2"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 1
max = 4096
default = 384
[params.rows]
type = "int"
min = 1
max = 4096
default = 256
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-12
[params.in0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 384

[derived]
tiles = "ceil(in0_d1 / 128)"
last_tile = "tiles - 1"
batch_stride = "in0_d2 * tiles"
end = "in0_d0 * batch_stride"
tail = "ds((in0_d1 - 1) % 128 + 1)"
ds_pair = "tail + 65536 * ds(128)"
half = "1277440"

[inputs.in0]
shape = ["end", 128]
range = [-2.0, 2.0]
[inputs.gamma]
shape = ["5 * channels", 128]
[inputs.beta]
shape = ["5 * channels", 128]
[inputs.crow]
shape = [5, 128]
[inputs.epsilon]
shape = [5, 128]
[scratch.tmp]
shape = [40, 128]
[scratch.centered]
shape = ["4 * channels", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
crow = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
channels = "CR10"
tiles = "LR13"
batch_stride = "LR4"
last_tile = "LR7"
end = "LR14"
epsilon = "CR12"
half = "CR13"
ds_pair = "CR14"
qf_crow = "CR15"
centered = "CR11"

[cases.default]
