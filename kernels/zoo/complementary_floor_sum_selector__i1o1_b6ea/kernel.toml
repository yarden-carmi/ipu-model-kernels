[kernel]
op = "complementary_floor_sum_selector"
formats = ["e2", "s0e1w8"]
[params.tokens]
type = "int"
min = 1
max = 256
default = 256
[params.vocab]
type = "int"
min = 1
max = 50265
default = 50265
[inputs.in0]
shape = [1, "tokens"]
range = [0, 50264]
[inputs.indices]
shape = ["ceil(vocab / 128) * 8", 128]
range = [0, 50264]
[inputs.ones]
shape = [2, 128]
range = [1, 33554432]
[outputs.out0]
shape = ["tokens", "ceil(vocab / 128) * 128"]
[scratch.diff]
shape = [2, 128]
[derived]
chunks = "ceil(vocab / 128)"
last = "ds((vocab - 1) % 128 + 1)"
[abi]
in0 = "CR2"
indices = "CR3"
out0 = "CR4"
diff = "CR5"
qf_in0 = "CR6"
qf_indices = "CR7"
qf_out0 = "CR8"
qf_diff = "CR9"
tokens = "CR10"
chunks = "CR11"
last = "CR12"
ones = "CR13"
qf_ones = "CR14"
[cases.default]
[golden]
tolerance = { e2 = "EXACT", s0e1w8 = "EXACT" }
