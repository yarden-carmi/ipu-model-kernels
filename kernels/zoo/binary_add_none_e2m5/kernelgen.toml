chain_out = ["out0"]
notes = """
binary add, broadcast "none", op "add", numel elements (multiple of 128).
in0 arrives as stored (flat rows of 128). out0 keeps dimension 2 along the
128 lanes and dimensions 0,1 in row order, which is the same flat row-major
packing, so the add is row-wise. The second operand is the constant tensor
computed at home (declared here as input in1, shape [numel]); when a case
gives a nonzero scalar const (call 0: const=1), the kernel adds that scalar
broadcast instead, which is numerically identical to adding a row of ones.
Both addends cross the multiplier as x1.0 identity products into R_ACC
(scalar path multiplies ones x const from R_CYCLIC). Loads read their LR
offset at end of cycle, so the row counter is never incremented in the same
word as a load.
"""
