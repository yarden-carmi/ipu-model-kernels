[kernel]
op = "binary_add_none"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"

[params.const]
type = "float"
default = 0.0

[params.inner]
type = "int"
min = 0
max = 4096
default = 0

[params.numel]
type = "int"
min = 128
max = 262144
multiple_of = 128
default = 196608

[params.op]
type = "str"
choices = ["add"]
default = "add"

[inputs.in0]
shape = ["numel"]
range = [-2, 2]

[inputs.in1]
shape = ["numel"]
range = [-2, 2]

[outputs.out0]
shape = ["numel"]

[scratch.ones]
shape = [128]
fill = 1

[derived]
qf = "case_qf"
ds = "ds(128)"
rows = "numel // 128"
ra_r1 = "128"

[abi]
in0 = "CR2"
in1 = "CR3"
const = "CR4"
out0 = "CR5"
ones = "CR6"
rows = "CR7"
ra_r1 = "CR8"
qf = "CR14"
ds = "CR15"

[golden]
tolerance = { e2 = "EXACT" }

[cases.default]
const = 0.0
numel = 196608

[cases.scalar]
const = 1.0
numel = 15360

[cases.small]
const = 0.0
numel = 15360

[cases.max]
const = 0.0
numel = 262144

[cases.mid]
const = 0.0
numel = 147456
