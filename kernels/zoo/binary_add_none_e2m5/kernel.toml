[kernel]
op = "binary_add_none"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"

[params.op]
type = "str"
choices = ["add"]
default = "add"

[params.const]
type = "float"
min = -64
max = 64
default = 1

[params.inner]
type = "int"
min = 0
max = 0
default = 0

[params.numel]
type = "int"
min = 1
max = 33554432
default = 160

[inputs.in0]
shape = ["ceil(numel / 128)", 128]
range = [-2, 2]

[inputs.in1]
shape = ["ceil(numel / 128)", 128]
range = [-2, 2]

[outputs.out0]
shape = ["ceil(numel / 128)", 128]

[derived]
rows = "ceil(numel / 128)"
qf = "case_qf"
ds_full = "ds(128)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
rows = "CR6"
qf = "CR14"
ds_full = "CR15"

[cases.default]
broadcast = "none"
op = "add"
inner = 0
numel = 160

[golden]
tolerance = { e2 = "NX8_STEP" }
