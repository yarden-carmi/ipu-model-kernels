[kernel]
op = "conv2d_builtin"
formats = ["e1"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 64
[params.cout]
type = "int"
min = 1
max = 512
default = 64
[params.groups]
type = "int"
min = 1
max = 512
default = 1
[params.h]
type = "int"
min = 1
max = 255
default = 56
[params.w]
type = "int"
min = 1
max = 256
default = 56
[params.kh]
type = "int"
min = 1
max = 7
default = 3
[params.kw]
type = "int"
min = 1
max = 7
default = 3
[params.padding]
type = "int"
min = 0
max = 3
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 255
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 56
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 512
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 255
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[derived]
chunks = "ceil(in0_d3 / 128)"
pack = "1 + min(1, 128 // (2 * out0_d3)) * (1 - out0_d2 % 2)"
plane = "(in0_d2 + 2 * padding) * kw * chunks"
next_plane = "0 - plane - kh * kw * chunks"
group_plane = "plane * (cin // groups)"
weight_rows = "1 + 3 * cout * (cin // groups)"
full = "ds(128)"
width = "ds(out0_d3)"
active = "ds(pack * out0_d3)"
tap_end = "kh * kw"
in_tail = "ds((in0_d3 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "chunks", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[scratch.windows]
shape = ["1 + in0_d1 * plane", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2 // pack", 128]

[abi]
in0 = "CR2"
weights = "CR3"
windows = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
width = "CR9"
active = "CR10"
next_plane = "CR11"
group_plane = "CR12"
weight_rows = "CR13"
tap_end = "CR14"
in_tail = "CR15"
in0_d0 = "LR15"

[cases.default]
