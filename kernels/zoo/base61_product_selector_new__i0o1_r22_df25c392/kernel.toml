[kernel]
op = "base61_product_selector_new"
formats = ["e2"]
[params.tokens]
type = "int"
min = 1
default = 256
[params.vocab]
type = "int"
min = 1
default = 30522
[inputs.in0]
shape = ["tokens", 128]
[inputs.hi]
shape = [2, "ceil(vocab / 128)", 128]
[inputs.lo]
shape = ["4 * ceil(vocab / 128) + 1", 128]
[outputs.out0]
shape = ["tokens * ceil(vocab / 128)", 128]
[scratch.tmp]
shape = [3, 128]
[derived]
chunks = "ceil(vocab / 128)"
gain = "constant(0, 147, 1, 1)"
gain32 = "1233125376"
idx = "128"
tail = "ds((vocab - 1) % 128 + 1)"
last = "ceil(vocab / 128) - 1"
[abi]
in0 = "CR2"
hi = "CR3"
lo = "CR4"
out0 = "CR5"
tmp = "CR6"
qf_in0 = "CR7"
qf_hi = "CR8"
qf_lo = "CR9"
qf_out0 = "CR10"
gain = "CR11"
gain32 = "CR12"
tail = "CR13"
last = "LR15"
tokens = "LR10"
chunks = "LR11"
idx = "LR12"
[cases.default]
[golden]
tolerance = { nx8 = "EXACT" }
