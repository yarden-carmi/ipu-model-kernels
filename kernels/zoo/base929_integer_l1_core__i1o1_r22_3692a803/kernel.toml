[kernel]
op = "base929_integer_l1_core"
formats = ["e2"]
[params.tokens]
type = "int"
min = 1
default = 256
[params.vocab]
type = "int"
min = 1
default = 50264
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 256
[params.out0_d0]
type = "int"
min = 1
default = 256
[params.out0_d1]
type = "int"
min = 1
default = 50264
[inputs.in0]
shape = ["in0_d0", "ceil(in0_d1 / 128) * 128"]
range = [0, 50000]
[inputs.digits]
shape = [3, "ceil(vocab / 128)", 128]
range = [0, 31]
[inputs.ones]
shape = [128]
range = [1, 1]
[outputs.out0]
shape = ["out0_d0", "ceil(out0_d1 / 128) * 128"]
[scratch.delta]
shape = [128]
[derived]
chunks = "ceil(vocab / 128)"
last_ds = "ds((vocab - 1) % 128 + 1)"
sq_qf = "qf(1, 6, 8, 0)"
[abi]
in0 = "CR2"
out0 = "CR3"
digits = "CR4"
ones = "CR5"
delta = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
qf_digits = "CR9"
qf_ones = "CR10"
sq_qf = "CR11"
chunks = "CR12"
tokens = "CR13"
last_ds = "CR14"
[cases.default]
[golden]
tolerance = { nx8 = "EXACT" }
