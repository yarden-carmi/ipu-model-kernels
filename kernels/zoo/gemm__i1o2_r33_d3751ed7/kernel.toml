[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 16384
default = 192
[params.m]
type = "int"
min = 1
max = 16384
default = 256
[params.n]
type = "int"
min = 1
max = 16384
default = 576
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 192
[params.out0_d0]
type = "int"
min = 1
max = 16384
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 576

[derived]
pitch = "ceil(in0_d1 / 128)"
tiles = "ceil(out0_d2 / 128)"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
width = "128"
batch_stride = "in0_d2 * pitch"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * ceil(in0_d1 / 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * (k + 1) * 4", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
pitch = "CR10"
in0_d0 = "CR11"
in0_d1 = "CR12"
k = "CR13"
width = "CR14"
batch_stride = "CR15"

[cases.default]
