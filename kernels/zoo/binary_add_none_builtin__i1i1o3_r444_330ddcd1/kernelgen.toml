chain = ["binary"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

[layout.in0]
lanes = 1
rows = [0, 2, 3]
[view.in0]
kind = "whole"
[prefer.in0]
lanes = 3
rows = [1, 0, 2]
pack = "d2"

[layout.in1]
lanes = 1
rows = [0, 2, 3]
[view.in1]
kind = "whole"
[prefer.in1]
lanes = 3
rows = [1, 0, 2]
pack = "d2"

[layout.out0]
lanes = 3
rows = [1, 0, 2]
pack = "d2"
