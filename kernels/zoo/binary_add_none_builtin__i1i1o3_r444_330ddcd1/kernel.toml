[kernel]
op = "binary_add"
formats = ["e1", "e2"]
[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
act_out0 = { type = "str", choices = ["relu"], default = "relu" }
numel = { type = "int", min = 1, max = 16777216, default = 200704 }
in0_d0 = { type = "int", min = 1, max = 1, default = 1 }
in0_d1 = { type = "int", min = 1, max = 128, default = 64 }
in0_d2 = { type = "int", min = 1, max = 224, default = 56 }
in0_d3 = { type = "int", min = 1, max = 224, default = 56 }
in1_d0 = { type = "int", min = 1, max = 1, default = 1 }
in1_d1 = { type = "int", min = 1, max = 128, default = 64 }
in1_d2 = { type = "int", min = 1, max = 224, default = 56 }
in1_d3 = { type = "int", min = 1, max = 224, default = 56 }
out0_d0 = { type = "int", min = 1, max = 1, default = 1 }
out0_d1 = { type = "int", min = 1, max = 128, default = 64 }
out0_d2 = { type = "int", min = 1, max = 224, default = 56 }
out0_d3 = { type = "int", min = 1, max = 224, default = 56 }
[derived]
spatial = "out0_d2 * out0_d3"
chunks = "ceil(spatial / 128)"
full = "ds(128)"
tail = "ds((spatial - 1) % 128 + 1)"
last = "chunks - 1"
full_count = "128"
[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "ceil(in0_d1 / 128)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "in1_d3", "ceil(in1_d1 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d1", "out0_d0", "chunks", 128]
[scratch.tmp]
shape = [128, 128]
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
spatial = "CR9"
chunks = "CR10"
full = "CR11"
tail = "CR12"
last = "CR13"
out0_d1 = "CR14"
full_count = "CR15"
[cases.default]
