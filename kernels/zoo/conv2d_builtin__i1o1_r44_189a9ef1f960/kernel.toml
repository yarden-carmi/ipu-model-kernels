[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 64
[params.cout]
type = "int"
min = 1
max = 256
default = 64
[params.groups]
type = "int"
min = 1
max = 128
default = 1
[params.h]
type = "int"
min = 1
max = 250
default = 8
[params.w]
type = "int"
min = 1
max = 250
default = 8
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1

[derived]
ho = "(h - 1) // stride + 1"
wo = "(w - 1) // stride + 1"
blocks = "ceil(cout / 128)"
tap_rows = "cin"
panel_end = "((cin - 1) // 24) * 24"
x_end = "wo * stride"
y_end = "ho * stride"
last_y = "h - 1"
last_x = "w - 1"
full = "ds(128)"
tail = "ds((cout - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0", "h", "w", 128]
range = [-2, 2]
[inputs.weights]
shape = ["blocks", "1 + kh * kw * tap_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["in0_d0", "ho", "wo", "blocks * 128"]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
in0_d0 = "LR10"
tail = "CR7"
blocks = "CR8"
last_y = "CR9"
last_x = "CR10"
panel_end = "CR11"
tap_rows = "CR12"
x_end = "CR13"
y_end = "CR14"
full = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
