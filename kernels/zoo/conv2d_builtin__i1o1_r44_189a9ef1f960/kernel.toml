[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 64
default = 64
[params.cout]
type = "int"
min = 1
max = 128
default = 32
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 3
default = 64
[params.w]
type = "int"
min = 3
default = 64
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 64
default = 64
[params.in0_d2]
type = "int"
min = 3
default = 64
[params.in0_d3]
type = "int"
min = 3
default = 64
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 32
[params.out0_d2]
type = "int"
min = 1
default = 64
[params.out0_d3]
type = "int"
min = 1
default = 64

[derived]
pixels = "in0_d2 * in0_d3"
last_pixel = "pixels - 1"
last_x = "out0_d3 - 1"
last_y = "out0_d2 - 1"
width = "in0_d3"
dot_end = "cout - 2"
full = "ds(128) + 65536 * 15 * cout"
ds_out = "ds(cout) + 65536 * 18 * cout"
offsets = "20 * cout + 65536 * 23 * cout"
top_middle = "2 * cout"
top_right = "5 * cout"
middle_left = "7 * cout"
middle = "10 * cout"

[inputs.in0]
shape = ["pixels", 128]
range = [-2, 2]
[inputs.weights]
shape = ["25 * cout + 2", 128]
range = [-1, 1]
[scratch.staged]
shape = ["pixels", 128]
[outputs.out0]
shape = ["out0_d2 * out0_d3", 128]

[abi]
in0 = "CR2"
weights = "CR3"
staged = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
ds_out = "CR9"
last_x = "CR10"
last_y = "CR11"
width = "CR12"
dot_end = "CR13"
last_pixel = "CR14"
offsets = "CR15"
top_middle = "LR9"
top_right = "LR10"
middle_left = "LR13"
middle = "LR14"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
