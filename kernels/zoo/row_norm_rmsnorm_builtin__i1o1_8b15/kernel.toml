[kernel]
op = "row_norm"
formats = ["e3"]
[params.kind]
type = "str"
choices = ["rmsnorm"]
[params.channels]
type = "int"
min = 112
max = 112
[params.rows]
type = "int"
min = 3584
max = 3584
[params.act_out0]
type = "str"
choices = ["relu"]
[derived]
count = "channels * channels + channels * 65536"
valid = "ds(rows // channels)"
[inputs.in0]
shape = ["channels * channels", 128]
[inputs.scale]
shape = [128]
[inputs.bias]
shape = [128]
[inputs.scale_lo]
shape = [2, 128]
[inputs.bias_lo]
shape = [2, 128]
[outputs.out0]
shape = ["(channels + 1) * (channels + 1)", 128]
[abi]
in0 = "CR2"
scale = "CR3"
bias = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_scale = "CR7"
qf_bias = "CR8"
qf_out0 = "CR9"
count = "CR10"
valid = "CR15"
scale_lo = "CR11"
bias_lo = "CR12"
qf_scale_lo = "CR13"
qf_bias_lo = "CR14"
[golden]
tolerance = { e3 = "NX8_STEP" }
[cases.default]
channels = 112
rows = 3584
kind = "rmsnorm"
