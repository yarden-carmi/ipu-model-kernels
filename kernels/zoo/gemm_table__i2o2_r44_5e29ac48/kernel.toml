[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 16
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 65536
default = 16384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 128

[derived]
width = "in0_d3"
stripes = "in0_d0 * width"
batch_skip = "(k - 1) * width"
output_skip = "(n - 1) * width"
full_blocks = "(k - 1) // 8"
active = "ds(out0_d2)"
lane_bias = "127"

[inputs.in0]
shape = ["stripes * in0_d1", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * (8 + 4 * full_blocks)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d3", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
n = "CR8"
width = "CR9"
output_skip = "CR10"
stripes = "CR11"
active = "CR12"
lane_bias = "CR13"
full_blocks = "CR14"
batch_skip = "CR15"

[cases.default]
