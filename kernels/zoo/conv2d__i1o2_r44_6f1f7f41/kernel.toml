[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 1024
default = 384
[params.cout]
type = "int"
min = 1
max = 1024
default = 384
[params.groups]
type = "int"
min = 1
max = 1
default = 1
[params.h]
type = "int"
min = 1
max = 128
default = 16
[params.w]
type = "int"
min = 1
max = 512
default = 16
[params.kh]
type = "int"
min = 1
max = 3
default = 3
[params.kw]
type = "int"
min = 1
max = 3
default = 3
[params.padding]
type = "int"
min = 0
max = 1
default = 1
[params.stride]
type = "int"
min = 1
max = 32
default = 2
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1024
default = 384
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 512
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 1024
default = 384
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 130
default = 8

[derived]
blocks = "ceil(in0_d1 / 128)"
full = "ds(128)"
one = "ds(1)"
outds = "ds(out0_d2)"
xend = "out0_d3 * stride - padding"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * blocks", 128]
range = [-2, 2]
[inputs.weights]
shape = ["out0_d1", "2 * (1 + kh * kw * blocks)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d3", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
in0_d2 = "CR7"
in0_d3 = "CR8"
full = "CR9"
one = "CR10"
outds = "CR11"
xend = "CR12"
out0_d2 = "CR13"
out0_d1 = "CR14"

[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}

[cases.default]
