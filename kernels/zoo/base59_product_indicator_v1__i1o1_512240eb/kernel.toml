[kernel]
op = "base59_product_indicator_v1"
formats = ["e2"]
[params.tokens]
type = "int"
min = 1
default = 256
[params.vocab]
type = "int"
min = 1
default = 50257
[inputs.in0]
shape = [1, "ceil(tokens / 128) * 128"]
range = [0, 255]
[inputs.digits]
shape = ["4 * ceil(vocab / 128) + 1", 128]
range = [0, 1]
[outputs.out0]
shape = ["tokens", "ceil(vocab / 128) * 128"]
[scratch.difference]
shape = [2, 128]
[inputs.factors]
shape = [2, 128]
range = [0, 1]
[derived]
chunks = "ceil(vocab / 128)"
last = "ceil(vocab / 128) - 1"
tail = "ds(vocab - (ceil(vocab / 128) - 1) * 128)"
ones = "3 * ceil(vocab / 128)"
[abi]
in0 = "CR2"
out0 = "CR3"
digits = "CR4"
difference = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
qf_digits = "CR8"
qf_difference = "CR9"
chunks = "LR11"
tokens = "CR11"
tail = "CR12"
last = "LR12"
ones = "CR14"
factors = "CR10"
qf_factors = "CR13"
[golden]
tolerance = { e2 = "EXACT" }
[cases.default]
tokens = 256
vocab = 50257
