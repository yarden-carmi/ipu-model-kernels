[kernel]
op = "row_softmax"
formats = ["e1", "e2"]

[params]
n = { type = "int", min = 1, max = 4096, default = 256 }
rows = { type = "int", min = 1, default = 3072 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 12 }
in0_d2 = { type = "int", min = 1, default = 256 }
in0_d3 = { type = "int", min = 1, default = 256 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 12 }
out0_d2 = { type = "int", min = 1, default = 256 }
out0_d3 = { type = "int", min = 1, default = 256 }

[derived]
K = "ceil(in0_d2 / 128)"
M = "in0_d0 * in0_d1 * in0_d3 * K"
active = "ds(128)"
part = "ds(in0_d2 - (K - 1) * 128)"
batchstride = "in0_d3 * K"
scratch_formats = "312 * 65536 + 56"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "ceil(in0_d2 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2 / 128)", 128]
[scratch.tmp]
shape = [16, 128]
[scratch.roots]
shape = ["n", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
batchstride = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
K = "CR7"
M = "CR8"
scratch_formats = "CR9"
qf_out0 = "CR10"
roots = "CR11"
part = "CR14"
active = "CR15"
n = "LR15"

[cases.default]
