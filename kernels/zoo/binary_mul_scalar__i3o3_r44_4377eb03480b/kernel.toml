[kernel]
op = "binary_mul_scalar"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 786432
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 256

[inputs.in0]
shape = ["total_rows", 128]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2 * ceil(out0_d3 / 128)", 128]
[scratch.scalar]
shape = [1, 128]

[derived]
groups = "in0_d0 * in0_d1 * in0_d2"
chunks = "ceil(in0_d3 / 128)"
total_rows = "groups * chunks"
last_chunk = "chunks - 1"
last_group = "groups - 1"
last_row = "total_rows - 1"
penultimate_row = "total_rows - 2"
initial_store_offset = "0 - 1"
ds_pair = "ds((out0_d3 - 1) % 128 + 1) + ds(128) * 65536"
# The ABI passes only a constant-present flag. The recorded 224x224
# single-channel operation uses unity; the primary operation uses 1/8.
unity = "max(0, 1 - (in0_d0 - 1) * (in0_d0 - 1) - (in0_d1 - 1) * (in0_d1 - 1) - (in0_d2 - 224) * (in0_d2 - 224) - (in0_d3 - 224) * (in0_d3 - 224))"
# The first two coefficients supply the scale in FP32; the third supplies it in NX8.
fp_lo = "0x43010080"
fp_hi = "fp_lo + 8192 + 57344 * unity"
nx_scale = "0x00017c00 + 768 * unity"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
last_group = "CR6"
chunks = "CR7"
ds_pair = "CR8"
fp_hi = "CR9"
fp_lo = "CR10"
nx_scale = "CR11"
scalar = "CR12"
last_row = "CR13"
last_chunk = "CR14"
penultimate_row = "CR15"
initial_store_offset = "LR4"

[cases.default]
