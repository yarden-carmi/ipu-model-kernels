[kernel]
op = "row_norm"
formats = ["e2"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 1
max = 4096
default = 192
[params.rows]
type = "int"
min = 1
max = 65536
default = 256
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 0.00001
[params.in0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 192
[params.out0_d0]
type = "int"
min = 1
default = 4
[params.out0_d1]
type = "int"
min = 1
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 192

[derived]
K = "(channels + 127) // 128"
M = "rows * K"
tail = "ds((channels - 1) % 128 + 1) + 65536 * ds(128)"
half = "1277440"
plane_tiles = "ceil(in0_d0 * in0_d1 / 128)"
channel_span = "channels * plane_tiles"

[inputs.in0]
shape = ["in0_d2 * plane_tiles", 128]
[inputs.gamma]
shape = ["3 * K", 128]
[inputs.beta]
shape = ["3 * K", 128]
[inputs.crow]
shape = [4, 128]
[scratch.tmp]
shape = ["32 + 2 * K", 128]
[scratch.gathered]
shape = ["K", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / 128)", 128]

[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
crow = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
channel_span = "CR10"
M = "CR11"
gathered = "CR12"
half = "CR13"
tail = "CR14"
qf_gamma = "CR15"

[cases.default]
