[kernel]
op = "row_norm"
formats = ["e2"]
[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 128
max = 256
default = 144
[params.rows]
type = "int"
min = 1
max = 65536
default = 1024
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 0.00001
[params.in0_d0]
type = "int"
min = 1
max = 16
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 1024
default = 256
[params.in0_d2]
type = "int"
min = 128
max = 256
default = 144
[params.out0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 256
default = 144
[derived]
K = "(channels + 127) // 128"
M = "rows * K"
ds_pair = "ds(channels - 128 * (K - 1)) + 65536 * ds(128)"
half = "1277440"
channel_stride = "(in0_d0 * in0_d1 + 127) // 128"
plane = "in0_d0 * in0_d1"
plane_pair = "plane + 65536 * (plane - 1)"
span = "in0_d2 * channel_stride"
delta = "(plane % in0_d2) * channel_stride"
[inputs.in0]
shape = ["in0_d2 * channel_stride", 128]
[inputs.gamma]
shape = ["3 * K", 128]
[inputs.beta]
shape = ["3 * K", 128]
[inputs.scalars]
shape = [4, 128]
[scratch.tmp]
shape = [24, 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ((out0_d2 + 127) // 128)", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
gamma = "CR6"
beta = "CR7"
scalars = "CR8"
tmp = "CR9"
qf_gamma = "CR10"
ds_pair = "CR11"
plane_pair = "CR12"
span = "CR13"
M = "CR14"
half = "CR15"
in0_d0 = "LR14"
delta = "LR13"
[cases.default]
