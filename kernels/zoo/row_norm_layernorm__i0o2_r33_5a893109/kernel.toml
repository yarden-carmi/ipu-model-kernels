[kernel]
op = "row_norm"
formats = ["e2"]

[params]
kind = { type = "str", choices = ["layernorm"], default = "layernorm" }
channels = { type = "int", min = 129, max = 256, default = 192 }
rows = { type = "int", min = 1, max = 16384, default = 256 }
eps = { type = "float", min = 0.0, max = 1.0, default = 1e-5 }
in0_d0 = { type = "int", min = 1, max = 4, default = 4 }
in0_d1 = { type = "int", min = 1, max = 4096, default = 64 }
in0_d2 = { type = "int", min = 129, max = 256, default = 192 }
out0_d0 = { type = "int", min = 1, max = 4, default = 4 }
out0_d1 = { type = "int", min = 1, max = 4096, default = 64 }
out0_d2 = { type = "int", min = 129, max = 256, default = 192 }

[derived]
limits = "ds(channels - 128) + 65536 * ds(1)"
width = "ceil(in0_d0 * in0_d1 / 128)"
cwidth = "in0_d2 * width"

[inputs.in0]
shape = ["in0_d2 * width", 128]
[inputs.gamma]
shape = [4, 128]
[inputs.beta]
shape = [4, 128]
[inputs.crow]
shape = [2, 128]
[inputs.epsilon]
shape = [2, 128]
[scratch.tmp]
shape = ["16 + 4 * rows", 128]
[outputs.out0]
shape = ["2 * out0_d0 * out0_d1", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
tmp = "CR4"
gamma = "CR5"
beta = "CR6"
crow = "CR7"
epsilon = "CR8"
qf_in0 = "CR9"
qf_out0 = "CR10"
qf_gamma = "CR11"
limits = "CR12"
in0_d2 = "CR13"
cwidth = "CR14"

[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
