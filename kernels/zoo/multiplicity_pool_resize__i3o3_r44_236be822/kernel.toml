[kernel]
op = "multiplicity_pool_resize"
formats = ["e2"]

[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 64
[params.in0_d2]
type = "int"
min = 2
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 64
default = 64
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 64
[params.out0_d2]
type = "int"
min = 1
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 128
[params.oh]
type = "int"
min = 1
default = 128
[params.ow]
type = "int"
min = 1
max = 128
default = 128

[inputs.in0]
shape = ["in0_d1", "in0_d0", "ceil(in0_d2 / 2)", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d1", 128]
[scratch.routed]
shape = ["end", 128]

[derived]
nx = "min(1, qf_in0)"
center = "(1 - nx) * 0x3f100000 + nx * 0x017610"
side = "(1 - nx) * 0x3e400000 + nx * 0x017440"
corner = "(1 - nx) * 0x3d800000 + nx * 0x017300"
ds_out = "ds(ow)"
end = "2 * in0_d1 * in0_d0 * in0_d2"
last_y = "in0_d2 - 1"
groups = "ceil(in0_d3 / 4)"
edge_src = "(in0_d3 - 1) * 0x01000000"
edge_dst = "(ow - 1) * 0x01000000"
center_lo = "0x01010000"
center_hi = "0x03030202"
other_lo = "0x02000100"
other_hi = "0x04020301"
dest_lo = "0x03020100"
dest_hi = "0x07060504"
upscale = "(1 - nx) * 0x3f800000 + nx * 0x018700"

[abi]
in0 = "CR2"
out0 = "CR3"
routed = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
center = "CR7"
side = "CR8"
corner = "CR9"
ds_out = "CR10"
end = "CR11"
last_y = "CR12"
upscale = "CR13"
edge_src = "CR14"
edge_dst = "CR15"
center_lo = "LR10"
center_hi = "LR11"
other_lo = "LR12"
other_hi = "LR13"
dest_lo = "LR14"
dest_hi = "LR15"
groups = "LR6"

[cases.default]
