[kernel]
op = "gemm_table"
formats = ["e2"]

[params]
act_out0 = {type = "str", choices = ["silu"], default = "silu"}
bias = {type = "bool", default = true}
m = {type = "int", min = 1, max = 65535, default = 64}
k = {type = "int", min = 1, max = 4096, default = 240}
n = {type = "int", min = 1, max = 4096, default = 480}
in0_d0 = {type = "int", min = 1, max = 128, default = 4}
in0_d1 = {type = "int", min = 1, max = 65535, default = 16}
in0_d2 = {type = "int", min = 1, max = 4096, default = 240}
out0_d0 = {type = "int", min = 1, max = 128, default = 4}
out0_d1 = {type = "int", min = 1, max = 65535, default = 16}
out0_d2 = {type = "int", min = 1, max = 4096, default = 480}

[derived]
stride = "(in0_d0 * in0_d1 + 127) // 128"
tiles = "(n + 127) // 128"
ds_pair = "ds(128) + 65536 * ds((n - 1) % 128 + 1)"
lanes = "128"

[inputs.in0]
shape = ["in0_d2 * stride", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * k", 128]
range = [-1, 1]
[inputs.b]
shape = ["tiles", 128]
range = [-1, 1]
when = "bias"
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ((out0_d2 + 127) // 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
stride = "CR6"
m = "CR7"
tiles = "CR8"
k = "CR9"
qf_in0 = "CR10"
qf_out0 = "CR11"
lanes = "CR12"
in0_d0 = "CR13"
lut = "CR14"
ds_pair = "CR15"
in0_d1 = "LR15"

[cases.default]
