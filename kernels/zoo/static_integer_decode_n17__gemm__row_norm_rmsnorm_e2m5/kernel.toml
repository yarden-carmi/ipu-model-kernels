[kernel]
op = "static_integer_decode_n17__gemm__row_norm"
formats = ["e2"]
[params]
s0_tokens = {type="int", min=128, max=256, multiple_of=128, default=128}
s0_vocab = {type="int", min=8, max=32128, default=9}
s1_bias = {type="bool", default=false}
s1_k = {type="int", min=8, max=32128, default=9}
s1_m = {type="int", min=128, max=256, multiple_of=128, default=128}
s1_n = {type="int", min=128, max=768, multiple_of=128, default=128}
s2_rows = {type="int", min=128, max=256, multiple_of=128, default=128}
s2_channels = {type="int", min=128, max=768, multiple_of=128, default=128}
s2_kind = {type="str", choices=["rmsnorm"], default="rmsnorm"}
s2_eps = {type="float", default=0.000001}
sharp = {type="float", default=65536.0}
margin = {type="float", default=256.0}
[inputs]
in0 = {shape=[1,"s0_tokens"], range=[0,7]}
w = {shape=["s1_k","s1_n"], range=[-2,2]}
gamma = {shape=["s2_channels"], range=[-2,2]}
[scratch]
ones = {shape=[128], fill=1}
mem = {shape=["12 + (s0_tokens // 128) * min(s0_vocab,8)",128]}
work = {shape=["s1_m","s1_n"]}
tmp = {shape=[8,128]}
recip = {shape=[128], fill="1 / s2_channels"}
epsilon = {shape=[128], fill="s2_eps"}
[outputs]
out0 = {shape=[1,"s1_m","s1_n"]}
[derived]
qf = "case_qf"
valid = "ds(128)"
blocks = "s0_tokens // 128"
nb = "s1_n // 128"
[abi]
in0 = "CR2"
w = "CR3"
gamma = "CR4"
ones = "CR5"
mem = "CR6"
out0 = "CR7"
sharp = "CR8"
margin = "CR9"
blocks = "CR10"
nb = "CR11"
work = "CR12"
tmp = "CR13"
qf = "CR14"
valid = "CR15"
recip = "LR14"
epsilon = "LR15"
[golden]
tolerance = {e2="NX8_STEP"}
[cases.default]
[cases.wide]
s0_tokens=256
s1_m=256
s2_rows=256
s1_n=768
s2_channels=768
