[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 786432
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 256

[inputs.in0]
shape = ["in0_d2 * ceil(in0_d0 * in0_d1 / 128)", 128]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["out0_d1 * out0_d3 * ceil(out0_d0 * out0_d2 / 128)", 128]
[scratch.scalar]
shape = [1, 128]

[derived]
ic = "ceil(out0_d0 * out0_d2 / 128)"
last = "(out0_d0 * out0_d2 - 1) % 128 + 1"
last_row = "out0_d1 * out0_d3 * ic - 1"
penultimate = "last_row - 1"
last_group = "out0_d1 * out0_d3 - 1"
last_chunk = "ic - 1"
ds_pair = "ds(last) + ds(128) * 65536"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
ic = "CR6"
last_row = "CR7"
penultimate = "CR8"
last_group = "CR9"
last_chunk = "CR10"
ds_pair = "CR11"
scalar = "CR12"
out0_d3 = "CR13"

[cases.default]
