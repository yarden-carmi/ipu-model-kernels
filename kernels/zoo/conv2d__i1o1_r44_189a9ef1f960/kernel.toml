[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 1024
default = 256
[params.cout]
type = "int"
min = 1
max = 1024
default = 256
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 1
max = 512
default = 14
[params.w]
type = "int"
min = 1
max = 128
default = 14
[params.kh]
type = "int"
min = 1
max = 3
default = 3
[params.kw]
type = "int"
min = 1
max = 3
default = 3
[params.padding]
type = "int"
min = 0
max = 1
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1024
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 512
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 14
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 1024
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 512
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 14

[derived]
blocks = "ceil(out0_d1 / 128)"
plane = "ceil(in0_d1 / 128)"
full = "ds(128)"
tail = "ds(out0_d1 - (blocks - 1) * 128)"
ends = "out0_d3 * stride - padding + 65536 * (out0_d2 * stride - padding)"
input_hw = "in0_d3 + 65536 * in0_d2"
skip_y = "2 * in0_d1"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * plane", 128]
range = [-1, 1]
[inputs.weights]
shape = ["blocks", "2 * (1 + kh * kw * in0_d1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * blocks", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
in0_d1 = "CR7"
blocks = "CR8"
plane = "CR9"
full = "CR10"
tail = "CR11"
ends = "CR12"
input_hw = "CR13"
skip_y = "CR14"

[cases.default]
[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}
