[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 64
[params.cout]
type = "int"
min = 1
max = 128
default = 64
[params.groups]
type = "int"
min = 1
max = 128
default = 1
[params.h]
type = "int"
min = 1
max = 1024
default = 56
[params.w]
type = "int"
min = 1
max = 1024
default = 56
[params.kh]
type = "int"
min = 1
max = 32
default = 3
[params.kw]
type = "int"
min = 1
max = 32
default = 3
[params.padding]
type = "int"
min = 0
max = 16
default = 1
[params.stride]
type = "int"
min = 1
max = 32
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 1024
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 1024
default = 56
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 1056
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 1056
default = 56

[derived]
tail = "ds(out0_d1)"
full = "ds(128) + 65536 * ((cin + 65534) % 65536)"
hw = "in0_d2 + 65536 * in0_d3"
line_step = "stride * in0_d3"
batch_step = "in0_d2 * in0_d3"
output_rows = "out0_d0 * out0_d2 * out0_d3"
xend = "out0_d3 * stride - padding"
yend = "out0_d2 * stride - padding"
skip_rows = "2 * cin + 65536 * 2 * kw * cin"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3", 128]
range = [-2, 2]
[inputs.weights]
shape = ["2 + kh * kw * 2 * cin", 128]
range = [-1, 1]
[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tail = "CR7"
full = "CR8"
hw = "CR9"
line_step = "CR10"
batch_step = "CR11"
output_rows = "CR12"
xend = "CR13"
yend = "CR14"
skip_rows = "CR15"

[cases.default]
