# unary_abs: y = |x| elementwise over numel elements, one parameterised program.
#
#   fn    : abs -- the only signature this kernel takes (the general unary's
#           other functions live in their own zoo kernels)
#   numel : the elements of x and of y, the only dimension the host tiles
#
# The layout is the plain activation layout -- entity e holds its features in
# ceil(F/128) consecutive rows, row e*ceil(F/128)+c holding features 128c ..
# 128c+127, lanes past F zero. Here F is numel and the whole tensor is one
# entity, so x and y are rows 0 .. ceil(numel/128)-1 of their regions and y is
# exactly x's shape -- the kernel reads what the previous kernel wrote and
# leaves what the next one reads, with no repack between them.
#
# Hardware-clean NX8 (formats = ["dynamic"]): the only store is the output's
# ACTIVATE.QUANTIZE identity. The datapath has no absolute value, but the
# accumulator has MAX and a negate: ACC.SUB.FIRST of x*1.0 puts -x in R_ACC and
# ACC.MAX of the same product maxes it with +x, so |x| = max(-x, x) in two words
# per row, both running the multiplier, and no intermediate row -- the only
# rounding is the output store, which the golden applies to the same row, so the
# result is exact on the row's grid.
#
# XMEM: x and y are ceil(numel/128) rows each and the mask row is the only
# scratch, so the largest call takes 2*8191 + 1 = 16383 of the 16384 addressable
# NX8 rows. There is no FP32 variant: it addresses 4096 rows only, and dynamic
# is the chip's type.

[kernel]
op = "unary"
formats = ["dynamic"]

[params]
fn = { type = "str", choices = ["abs"], default = "abs" }
numel = { type = "int", min = 1, max = 1048448 }  # 8191 rows: 2*rows + 1 XMEM rows

[derived]
rows = "ceil(numel / 128)"        # x's and y's rows: the loop's trips + 1
tail = "numel - 128 * (rows - 1)" # the last row's active lanes
bound = "max(rows - 2, 0)"        # CR5: the row loop's bound (the last row is straight-line)
qf = "case_qf"                    # CR14: the case's QF half
ds = "halves(ds(128), ds(tail))"  # CR15: full row / last row

[inputs.x]
shape = ["numel"]
range = [-1, 1]

[outputs.y]
shape = ["numel"]

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"       # LD.MASK: every lane active, whatever a previous kernel left

[abi]
x = "CR2"
y = "CR3"
maskr = "CR4"
bound = "CR5"
qf = "CR14"
ds = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: the datapath is exact in FP32 (max(-x, x) = |x|) and only the store
# rounds, which the golden applies to the same row.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 1, why = "the store's row quantization, measured exact; one step of margin for a row scale that moves" } }

[cases.default]                                   # google-t5/t5-small, x3 per forward
fn = "abs"
numel = 65536

[cases.one]                                       # the narrowest call: one lane, one row
fn = "abs"
numel = 1

[cases.tile]                                      # exactly one 128-lane row
fn = "abs"
numel = 128

[cases.tail]                                      # one row and a lane
fn = "abs"
numel = 129

[cases.two_rows]                                  # the loop's shortest trip
fn = "abs"
numel = 200

[cases.sweep]                                     # the structure of the calls, scaled down
fn = "abs"
numel = [1, 2, 5, 127, 128, 129, 130, 255, 256, 257, 1000, 4096, 5000]
