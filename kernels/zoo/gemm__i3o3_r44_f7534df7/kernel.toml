[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 256
[params.m]
type = "int"
min = 64
max = 65536
choices = [64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536]
default = 1024
[params.n]
type = "int"
min = 1
max = 65536
default = 96
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 65536
choices = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536]
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 128
choices = [1, 2, 4, 8, 16, 32, 64, 128]
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 96
[params.out0_d2]
type = "int"
min = 1
max = 65536
choices = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536]
default = 32
[params.out0_d3]
type = "int"
min = 1
max = 128
choices = [1, 2, 4, 8, 16, 32, 64, 128]
default = 32

[derived]
tiles = "ceil(m / 128)"
groups = "n"
full = "ds(128)"
active = "ds(min(128, m))"
ipack = "1 + (max(1, 128 // in0_d3) - 1) * min(1, max(in0_d3 - 32, 32 - in0_d3))"
inrows = "in0_d0 * in0_d1 * ceil(in0_d2 / ipack) * ceil(in0_d3 / 128)"
outrows = "out0_d0 * out0_d1 * ceil(out0_d2 / max(1, 128 // out0_d3)) * ceil(out0_d3 / 128)"
coeffrows = "groups * (k + 1) * 2"
batchstep = "k * ceil(in0_d2 / ipack)"
coeffstep = "(k + 1) * 2"
step = "ceil(in0_d2 / ipack) - min(in0_d2, max(1, 128 // in0_d3))"

[inputs.in0]
shape = ["inrows", 128]
[inputs.w]
shape = ["coeffrows", 128]
[outputs.out0]
shape = ["outrows", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
groups = "CR9"
k = "CR10"
batchstep = "CR11"
coeffstep = "CR12"
in0_d0 = "CR13"
active = "CR14"
step = "CR15"

[cases.default]
