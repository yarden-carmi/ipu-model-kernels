[kernel]
op = "gemm_binary_add"
formats = ["e3"]

[params.s0_bias]
type = "bool"
default = true
[params.s0_k]
type = "int"
choices = [144, 192, 240]
default = 192
[params.s0_m]
type = "int"
min = 4
max = 1024
default = 16
[params.s0_n]
type = "int"
choices = [144, 192, 240]
default = 192
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 1
max = 1048576
default = 3072
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"
[params.in0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.in0_d1]
type = "int"
min = 4
max = 4
default = 4
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 4
[params.in0_d3]
type = "int"
choices = [36, 48, 60]
default = 48
[params.in1_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in1_d1]
type = "int"
choices = [144, 192, 240]
default = 192
[params.in1_d2]
type = "int"
min = 1
max = 32
default = 4
[params.in1_d3]
type = "int"
min = 1
max = 32
default = 4
[params.out0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 256
default = 4
[params.out0_d2]
type = "int"
choices = [144, 192, 240]
default = 192

[derived]
tiles = "ceil(out0_d2 / 128)"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
rows = "out0_d0 * out0_d1"
last_lane = "in0_d3 - 1"
slot = "128"
in1rows = "in1_d0 * in1_d2 * in1_d3 * ceil(in1_d1 / 128)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1rows", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * (s0_k + 1) * 6", 128]
range = [-1, 1]
[outputs.out0]
shape = ["rows * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
last_lane = "CR10"
rows = "CR11"
s0_k = "CR12"
slot = "CR13"
in1 = "CR14"
qf_in1 = "CR15"

[golden]
tolerance = {e3 = "NX8_STEP"}
[cases.default]
