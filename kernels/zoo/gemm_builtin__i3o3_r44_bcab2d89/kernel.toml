[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 24
[params.m]
type = "int"
min = 1
max = 2147483647
default = 784
[params.n]
type = "int"
min = 1
max = 4096
default = 88
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 24
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 28
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 88
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 28

[derived]
tiles = "ceil(in0_d2 * in0_d3 / 128)"
chunks = "ceil(k / 128)"
full_ds = "ds(128)"
tail_ds = "ds(out0_d2 * out0_d3 - (ceil(out0_d2 * out0_d3 / 128) - 1) * 128)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * tiles", 128]
[inputs.w]
shape = ["2 * n * (1 + chunks)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 * out0_d3 / 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full_ds = "CR7"
tiles = "CR8"
n = "CR11"
tail_ds = "CR15"

[cases.default]
