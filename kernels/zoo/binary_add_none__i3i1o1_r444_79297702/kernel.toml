[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 4096 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, max = 128, default = 64 }
in0_d2 = { type = "int", min = 2, multiple_of = 2, default = 8 }
in0_d3 = { type = "int", min = 1, max = 64, default = 8 }
in1_d0 = { type = "int", min = 1, default = 1 }
in1_d1 = { type = "int", min = 1, max = 128, default = 64 }
in1_d2 = { type = "int", min = 2, multiple_of = 2, default = 8 }
in1_d3 = { type = "int", min = 1, max = 64, default = 8 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, max = 128, default = 64 }
out0_d2 = { type = "int", min = 2, multiple_of = 2, default = 8 }
out0_d3 = { type = "int", min = 1, max = 64, default = 8 }

[derived]
channel_stride = "in0_d2 // 2"
batch_skip = "(in0_d1 - 1) * channel_stride"
spatial_lanes = "2 * in0_d3"
pixels = "out0_d0 * out0_d2 * out0_d3"
rhs_pixels = "in1_d0 * in1_d2 * in1_d3"
ds_channels = "ds(out0_d1)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * channel_stride", 128]
range = [-2, 2]
[inputs.in1]
shape = ["rhs_pixels", 128]
range = [-2, 2]
[outputs.out0]
shape = ["pixels", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
channel_stride = "CR8"
spatial_lanes = "CR9"
pixels = "CR10"
ds_channels = "CR11"
out0_d1 = "CR12"
batch_skip = "CR13"

[cases.default]
