[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=65535, default=12}
k = {type="int", min=1, max=65535, default=64}
m = {type="int", min=1, max=32767, default=256}
n = {type="int", min=1, max=65535, default=256}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=256}
in0_d2 = {type="int", min=1, max=65535, default=768}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=65535, default=256}
in1_d2 = {type="int", min=1, max=65535, default=768}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=32767, default=12}
out0_d2 = {type="int", min=1, max=65535, default=256}
out0_d3 = {type="int", min=1, max=65535, default=256}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "astride*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "bstride*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "bstride*128"]

[derived]
astride = "ceil(in0_d2/128)"
bstride = "ceil(in1_d1/128)"
agroup = "in0_d1*astride"
dso = "ds(128)+65536*ds((n-1)%128+1)"
rows_heads = "m+65536*out0_d1"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
k = "CR8"
rows_heads = "CR9"
astride = "CR11"
bstride = "CR12"
agroup = "CR13"
dso = "CR14"
out0_d0 = "LR5"

[cases.default]
