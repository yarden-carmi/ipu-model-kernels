[kernel]
op = "bmm"
formats = ["e1", "e2", "e3"]

[params]
b = {type="int", min=1, max=65535, default=12}
k = {type="int", min=1, max=65535, default=64}
m = {type="int", min=1, max=65535, default=50}
n = {type="int", min=1, max=65535, default=50}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=50}
in0_d2 = {type="int", min=1, max=2147483647, default=768}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=65535, default=50}
in1_d2 = {type="int", min=1, max=2147483647, default=768}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=12}
out0_d2 = {type="int", min=1, max=65535, default=50}
out0_d3 = {type="int", min=1, max=65535, default=50}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "arows*128"]
range = [-1, 1]

[inputs.in1]
shape = ["in1_d0", "in1_d2", "brows*128"]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[derived]
heads = "out0_d0*out0_d1"
arows = "ceil(in0_d2/128)"
brows = "ceil(in1_d1/128)"
agap = "in0_d1*arows-(out0_d1*k)//128"
bgap = "(in1_d2-out0_d1*k)*brows"
tiles = "ceil(n/128)"
ds = "ds(128) + ds((n-1)%128+1)*65536"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
heads = "CR5"
m = "CR6"
k = "CR7"
arows = "CR8"
ds = "CR9"
qf_in0 = "CR10"
qf_in1 = "CR11"
qf_out0 = "CR12"
brows = "CR13"
tiles = "CR14"
out0_d1 = "CR15"
agap = "LR14"
bgap = "LR13"

[cases.default]
