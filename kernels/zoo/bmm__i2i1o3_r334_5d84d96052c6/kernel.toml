[kernel]
op = "bmm"
formats = ["e1", "e2", "e3"]

[params]
b = {type="int", min=1, max=65535, default=12}
k = {type="int", choices=[1, 2, 4, 8, 16, 32, 64, 128], default=64}
m = {type="int", min=1, max=65535, default=50}
n = {type="int", min=1, max=128, default=50}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=50}
in0_d2 = {type="int", min=1, max=65535, default=768}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=128, default=50}
in1_d2 = {type="int", min=1, max=65535, default=768}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=12}
out0_d2 = {type="int", min=1, max=65535, default=50}
out0_d3 = {type="int", min=1, max=128, default=50}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "a_stride*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", 128]

[derived]
a_stride = "ceil(in0_d2/128)"
a_group = "min(1,in0_d0-1)*in0_d1*a_stride"
b_gap = "min(1,in1_d0-1)*in1_d2-out0_d1*k"
width = "ds(n)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
a_stride = "CR8"
a_group = "CR9"
b_gap = "CR10"
width = "CR11"
k = "CR12"
m = "CR13"
out0_d1 = "CR14"
out0_d0 = "LR0"

[cases.default]
