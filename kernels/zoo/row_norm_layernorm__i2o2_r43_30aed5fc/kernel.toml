[kernel]
op = "row_norm"
formats = ["e2"]
[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
choices = [144, 192, 240]
default = 144
[params.rows]
type = "int"
choices = [64, 256, 1024]
default = 64
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-5
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
choices = [144, 192, 240]
default = 144
[params.in0_d2]
type = "int"
choices = [8, 16, 32]
default = 8
[params.in0_d3]
type = "int"
choices = [8, 16, 32]
default = 8
[params.out0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.out0_d1]
type = "int"
choices = [16, 64, 256]
default = 16
[params.out0_d2]
type = "int"
choices = [144, 192, 240]
default = 144

[derived]
half = "1277440"
dsl = "ds(channels - 128)"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * (in0_d3 // 2)", 128]
range = [-2.0, 2.0]
[inputs.gamma]
shape = [6, 128]
[inputs.beta]
shape = [6, 128]
[inputs.crow]
shape = [3, 128]
[inputs.epsilon]
shape = [128]
[scratch.tmp]
shape = ["40 + 2 * rows", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * 2", 128]
[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
crow = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
epsilon = "CR12"
half = "CR13"
dsl = "CR14"
[golden]
tolerance = { e2 = "NX8_STEP" }

[cases.default]
