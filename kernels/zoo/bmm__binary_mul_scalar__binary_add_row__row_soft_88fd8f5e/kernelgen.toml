chain = ["bmm", "binary_mul_scalar", "binary_add_row", "row_softmax"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

[layout.in0]
lanes = 2
rows = [0, 1]
[view.in0]
kind = "heads"
[layout.in1]
lanes = 2
rows = [0, 1]
[view.in1]
kind = "heads"
[prefer.in1]
lanes = 2
rows = [0, 1]
pad = "ceil(d2 / s0_k) * 128 - d2"
[layout.out0]
lanes = 3
rows = [0, 1, 2]
