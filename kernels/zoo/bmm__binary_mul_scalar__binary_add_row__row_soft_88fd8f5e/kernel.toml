[kernel]
op = "bmm__binary_mul_scalar__binary_add_row__row_softmax"
formats = ["e2"]

[params]
s0_b = {type="int", min=1, default=8}
s0_k = {type="int", choices=[1,2,4,8,16,32,64,128], default=64}
s0_m = {type="int", min=1, default=64}
s0_n = {type="int", min=1, max=128, default=64}
s1_broadcast = {type="str", choices=["scalar"], default="scalar"}
s1_const = {type="int", choices=[1], default=1}
s1_inner = {type="int", min=0, default=0}
s1_numel = {type="int", min=1, default=32768}
s1_op = {type="str", choices=["mul"], default="mul"}
s2_broadcast = {type="str", choices=["row"], default="row"}
s2_const = {type="int", choices=[1], default=1}
s2_inner = {type="int", min=1, default=4096}
s2_numel = {type="int", min=1, default=32768}
s2_op = {type="str", choices=["add"], default="add"}
s3_n = {type="int", min=1, max=128, default=64}
s3_rows = {type="int", min=1, default=512}
in0_d0 = {type="int", min=1, default=1}
in0_d1 = {type="int", min=1, default=64}
in0_d2 = {type="int", min=1, default=512}
in1_d0 = {type="int", min=1, default=1}
in1_d1 = {type="int", min=1, default=64}
in1_d2 = {type="int", min=1, default=512}
out0_d0 = {type="int", min=1, default=1}
out0_d1 = {type="int", min=1, default=8}
out0_d2 = {type="int", min=1, default=64}
out0_d3 = {type="int", min=1, max=128, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2/128)*128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "ceil(in1_d2/128)*128"]
range = [-2, 2]
[inputs.operand]
shape = ["3+s2_inner//s3_n", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]
[scratch.packed]
shape = ["s0_b*s0_n", 128]
[scratch.tmp]
shape = [1, 128]
[scratch.converted]
shape = ["3+s2_inner//s3_n", 128]

[derived]
dot_and_row = "ds(s0_k) + 65536*ds(s3_n)"
single_and_work = "ds(1) + 65536*56"
arows = "ceil(in0_d2/128)"
brows = "ceil(in1_d2/128)"
operand_rows = "2+s2_inner//s3_n"

[abi]
in0 = "CR2"
in1 = "CR3"
operand = "CR4"
out0 = "CR5"
packed = "CR6"
tmp = "CR7"
qf_in0 = "CR8"
converted = "CR9"
qf_operand = "CR10"
qf_out0 = "CR11"
dot_and_row = "CR12"
single_and_work = "CR13"
s0_n = "CR14"
s0_k = "CR15"
s0_b = "LR3"
s0_m = "LR8"
arows = "LR15"
brows = "LR7"
operand_rows = "LR5"

[cases.default]
