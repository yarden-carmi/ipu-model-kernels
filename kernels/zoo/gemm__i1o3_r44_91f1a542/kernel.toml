[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 128
default = 64
[params.m]
type = "int"
min = 1
max = 65535
default = 256
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 16

[derived]
pack = "1 + (128 // out0_d3 - 1) * (1 - min(1, out0_d2 % (128 // out0_d3)))"
points = "pack * out0_d3"
groups = "out0_d0 * (out0_d2 // pack)"
input_rows = "in0_d0 * in0_d2 * in0_d3"
dot_ds = "ds(k)"
store_ds = "ds(points)"
last = "points - 1"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]
[inputs.w]
shape = ["4 * n", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d1 * groups", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
dot_ds = "CR7"
store_ds = "CR8"
groups = "CR9"
n = "CR10"
last = "CR11"

[cases.default]
