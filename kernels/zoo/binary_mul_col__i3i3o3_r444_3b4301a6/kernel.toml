[kernel]
op = "binary_mul_col"
formats = ["e1"]

[params]
broadcast = {type = "str", choices = ["col"], default = "col"}
op = {type = "str", choices = ["mul"], default = "mul"}
inner = {type = "int", min = 1, max = 16384, default = 16}
numel = {type = "int", min = 1, max = 16777216, default = 192}
in0_d0 = {type = "int", choices = [1], default = 1}
in0_d1 = {type = "int", min = 1, max = 16384, default = 16}
in0_d2 = {type = "int", min = 1, max = 65535, default = 3}
in0_d3 = {type = "int", min = 1, max = 65535, default = 4}
in1_d0 = {type = "int", choices = [1], default = 1}
in1_d1 = {type = "int", min = 1, max = 16384, default = 16}
in1_d2 = {type = "int", choices = [1], default = 1}
in1_d3 = {type = "int", choices = [1], default = 1}
out0_d0 = {type = "int", choices = [1], default = 1}
out0_d1 = {type = "int", min = 1, max = 16384, default = 16}
out0_d2 = {type = "int", min = 1, max = 65535, default = 3}
out0_d3 = {type = "int", min = 1, max = 65535, default = 4}

[derived]
plane = "numel // inner // in0_d3"
valid = "ds(in0_d3)"

[inputs.in0]
shape = ["inner * plane", 128]
range = [-2, 2]
[inputs.in1]
shape = ["inner", 128]
range = [-2, 2]
[outputs.out0]
shape = ["inner * plane", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
plane = "CR7"
qf_in1 = "CR10"
inner = "CR11"
valid = "CR15"

[cases.default]
numel = 192
