[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 16
[params.n]
type = "int"
min = 1
max = 4096
default = 16
[params.m]
type = "int"
min = 1
max = 65535
default = 3136
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[derived]
p = "min(in0_d2, 128 // in0_d3)"
pack = "1 + (p - 1) * (1 - min(1, in0_d2 % p)) + (1 - in0_d2 % 2) * min(1, in0_d2 % p) * min(1, 64 // in0_d3)"
tiles = "in0_d2 // pack"
skip = "(in0_d1 - 1) * tiles"
chunks = "ceil(k / 128)"
width = "ds(out0_d3)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * tiles", 128]
[inputs.w]
shape = ["2 * n * (1 + chunks)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
width = "CR7"
tiles = "CR8"
skip = "CR9"
pack = "CR10"
in0_d3 = "CR11"
n = "CR12"
in0_d0 = "CR13"
chunks = "CR14"

[cases.default]
