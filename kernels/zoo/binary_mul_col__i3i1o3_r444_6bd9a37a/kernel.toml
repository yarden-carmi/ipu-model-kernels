[kernel]
op = "binary_mul_col"
formats = ["e1"]

[params.broadcast]
type = "str"
choices = ["col"]
default = "col"
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.inner]
type = "int"
default = 96
[params.numel]
type = "int"
default = 18816
[params.in0_d2]
type = "int"
default = 14
[params.in0_d3]
type = "int"
default = 14
[derived]
pack = "128 // (8 * ((in0_d3 + 7) // 8))"
groups = "inner // pack"
rows = "in0_d2 * groups"
scale_rows = "(inner + 127) // 128"
valid = "ds(pack * in0_d3)"
skip = "(-in0_d3) % 8"
back = "0 - skip"
index_lo = "50462976"
index_hi = "117835012"
chunk_threshold = "9"

[inputs.in0]
shape = ["rows", 128]
range = [-2, 2]
[inputs.in1]
shape = ["scale_rows", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
groups = "CR8"
rows = "CR9"
in0_d3 = "CR10"
back = "CR11"
index_lo = "CR12"
index_hi = "CR13"
valid = "CR15"
skip = "LR12"
pack = "LR13"
chunk_threshold = "LR14"

[cases.default]
