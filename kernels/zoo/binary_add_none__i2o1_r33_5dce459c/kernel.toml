[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.const]
type = "float"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 16777216
default = 702336
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.in0_d0]
type = "int"
min = 1
max = 16777216
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16777216
default = 1829
[params.in0_d2]
type = "int"
min = 1
max = 16777216
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 16777216
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16777216
default = 1829
[params.out0_d2]
type = "int"
min = 1
max = 16777216
default = 384

[derived]
width = "ceil(in0_d2 / 128)"
batch_stride = "in0_d1 * width"
out_chunks = "ceil(out0_d1 / 128)"
tail = "ds(out0_d1 - (out_chunks - 1) * 128)"
one = "ds(1)"
input_end = "in0_d0 * batch_stride"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "width * 128"]
range = [-2, 2]
[inputs.operand]
shape = ["out0_d0", "out0_d2", "out_chunks * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out_chunks * 128"]

[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_operand = "CR6"
qf_out0 = "CR7"
width = "CR8"
batch_stride = "CR9"
in0_d1 = "CR10"
in0_d2 = "CR11"
tail = "CR12"
one = "CR13"
input_end = "CR14"

[golden]
tolerance = { e2 = "EXACT" }

[cases.default]
