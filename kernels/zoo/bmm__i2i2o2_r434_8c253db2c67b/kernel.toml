[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=65535, default=8}
k = {type="int", min=1, max=65535, default=64}
m = {type="int", min=1, max=128, default=64}
n = {type="int", min=1, max=65535, default=64}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=8}
in0_d2 = {type="int", min=1, max=128, default=64}
in0_d3 = {type="int", min=1, max=65535, default=64}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=65535, default=64}
in1_d2 = {type="int", min=1, max=65535, default=512}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=8}
out0_d2 = {type="int", min=1, max=128, default=64}
out0_d3 = {type="int", min=1, max=65535, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", 128]
range = [0, 1]

[inputs.in1]
shape = ["in1_d0", "in1_d1", "rhs_stride*128"]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", 128]

[derived]
rhs_stride = "ceil(in1_d2/128)"
rhs_group = "in1_d1*rhs_stride*min(in1_d0-1,1)"
groups = "b//out0_d1"
ds = "ds(m)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
k = "CR10"
n = "CR11"
out0_d1 = "CR12"
rhs_stride = "CR13"
rhs_group = "CR14"
ds = "CR15"
groups = "LR3"

[cases.default]
