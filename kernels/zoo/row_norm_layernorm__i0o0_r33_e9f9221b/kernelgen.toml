chain = ["row_norm"]
chain_in = ["in0"]
chain_out = ["out0"]

[layout.in0]
lanes = 0
rows = [2, 1]
pack = "d1"
[view.in0]
kind = "other"
[layout.out0]
lanes = 0
rows = [2, 1]
pack = "1 + (min(d1, max(1, 128 // d0)) - 1) * (1 - min(1, d1 % min(d1, max(1, 128 // d0))))"

[format.in0]
format = "e4"

[format.gamma]
format = "e6"
[format.beta]
format = "e6"
[format.crow]
format = "e6"
