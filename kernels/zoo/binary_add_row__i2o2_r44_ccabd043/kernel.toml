[kernel]
op = "binary_add_row"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["row"]
default = "row"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 1
default = 65536
[params.numel]
type = "int"
min = 1
default = 786432
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 12
[params.in0_d2]
type = "int"
min = 1
default = 256
[params.in0_d3]
type = "int"
min = 1
default = 256
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 12
[params.out0_d2]
type = "int"
min = 1
default = 256
[params.out0_d3]
type = "int"
min = 1
default = 256

[derived]
chunks = "ceil(in0_d2 / 128)"
full = "chunks - 1"
period = "in0_d3 * chunks"
batch_rows = "in0_d1 * period"
rows = "in0_d0 * batch_rows"
tail = "ds((out0_d2 - 1) % 128 + 1)"
heads = "in0_d1"

[inputs.in0]
shape = ["rows", 128]
range = [-2, 2]
[inputs.operand]
shape = ["in0_d3", "chunks * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_operand = "CR6"
qf_out0 = "CR7"
rows = "CR8"
period = "CR9"
tail = "CR10"
full = "CR11"
batch_rows = "CR12"
heads = "CR13"
chunks = "CR14"

[cases.default]
formats = ["e1", "e2"]
