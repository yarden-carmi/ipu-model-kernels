[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=1073676289, default=12}
k = {type="int", min=1, max=32767, default=50}
m = {type="int", min=1, max=32767, default=50}
n = {type="int", min=1, max=32767, default=64}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=32767, default=12}
in0_d2 = {type="int", min=1, max=32767, default=50}
in0_d3 = {type="int", min=1, max=32767, default=50}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=32767, default=50}
in1_d2 = {type="int", min=1, max=2147483647, default=768}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=12}
out0_d2 = {type="int", min=1, max=32767, default=50}
out0_d3 = {type="int", min=1, max=32767, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "ac*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "bc*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "mc*128"]
[derived]
ac = "ceil(in0_d2/128)"
bc = "ceil(in1_d1/128)"
mc = "ceil(out0_d2/128)"
groups = "b//out0_d1"
heads = "out0_d1"
two = "2"
correction = "(in1_d2*min(in1_d0-1,1)-out0_d1*n)*bc"
ds = "ds(128)+65536*ds((m-1)%128+1)"
stride = "bc+65536*ac"
a_head_rows = "in0_d3*ac"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
m = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
ds = "CR9"
stride = "CR10"
two = "CR11"
k = "CR12"
n = "CR13"
a_head_rows = "CR14"
heads = "CR15"
groups = "LR11"
correction = "LR1"

[cases.default]
