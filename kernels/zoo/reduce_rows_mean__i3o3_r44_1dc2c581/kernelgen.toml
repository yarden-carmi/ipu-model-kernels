chain = ["reduce_rows"]
chain_in = ["in0"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [0, 1, 2]
pack = "max(1, d2 * min(1, 128 // (d2 * d3)), 2 * (1 - min(1, d2 % 2)) * min(1, 64 // d3), 7 * (1 - min(1, d2 % 7)) * min(1, 18 // d3))"

[view.in0]
kind = "whole"

[layout.out0]
lanes = 3
rows = [0, 2, 1]
