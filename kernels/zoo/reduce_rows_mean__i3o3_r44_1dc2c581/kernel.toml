[kernel]
op = "reduce_rows_mean"
formats = ["e1", "e2", "s0e1w8"]

[params.kind]
type = "str"
choices = ["mean"]
default = "mean"
[params.n]
type = "int"
min = 1
max = 65535
default = 196
[params.rows]
type = "int"
min = 1
max = 65535
default = 240
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 240
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 14
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 240
[params.out0_d2]
type = "int"
choices = [1]
default = 1
[params.out0_d3]
type = "int"
choices = [1]
default = 1

[derived]
pack = "max(1, in0_d2 * min(1, 128 // (in0_d2 * in0_d3)), 2 * (1 - min(1, in0_d2 % 2)) * min(1, 64 // in0_d3), 7 * (1 - min(1, in0_d2 % 7)) * min(1, 18 // in0_d3))"
height = "in0_d2 // pack"
width = "in0_d3 * pack"
cb = "ceil(width / 128)"
single = "ds(1)"
full = "ds(128)"
tail_size = "width - 128 * (cb - 1)"
tail = "ds(tail_size)"
full_size = "128"
width_full = "cb - 1"
long_reduction = "min(1, (n - 1) // 256)"
# Encode a normalized reciprocal as a CR scalar.
shift = "min(1, (n-1)//1) + min(1, (n-1)//2) + min(1, (n-1)//4) + min(1, (n-1)//8) + min(1, (n-1)//16) + min(1, (n-1)//32) + min(1, (n-1)//64) + min(1, (n-1)//128) + min(1, (n-1)//256) + min(1, (n-1)//512) + min(1, (n-1)//1024) + min(1, (n-1)//2048) + min(1, (n-1)//4096) + min(1, (n-1)//8192) + min(1, (n-1)//16384) + min(1, (n-1)//32768)"
factor = "1 + min(1, (n-1)//1) + 2*min(1, (n-1)//2) + 4*min(1, (n-1)//4) + 8*min(1, (n-1)//8) + 16*min(1, (n-1)//16) + 32*min(1, (n-1)//32) + 64*min(1, (n-1)//64) + 128*min(1, (n-1)//128) + 256*min(1, (n-1)//256) + 512*min(1, (n-1)//512) + 1024*min(1, (n-1)//1024) + 2048*min(1, (n-1)//2048) + 4096*min(1, (n-1)//4096) + 8192*min(1, (n-1)//8192) + 16384*min(1, (n-1)//16384) + 32768*min(1, (n-1)//32768)"
mantissa = "(256 * factor + n) // (2 * n) - 128"
carry = "mantissa // 128"
inv = "65536 + 256 * (127 - shift + carry) + mantissa % 128"
inv_fp32 = "8388608 * (127 - shift) + (8388608 * factor + n // 2) // n - 8388608"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * height * cb", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d1", 128]
[scratch.partial]
shape = [1, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
height = "CR6"
width_full = "CR7"
rows = "CR8"
inv = "CR9"
inv_fp32 = "CR10"
full = "CR11"
tail = "CR12"
full_size = "LR6"
tail_size = "CR14"
partial = "CR13"
long_reduction = "LR10"
single = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP", s0e1w8 = "NX8_STEP" }

[cases.default]
