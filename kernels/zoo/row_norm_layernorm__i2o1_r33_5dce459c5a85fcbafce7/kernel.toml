[kernel]
op = "row_norm"
formats = ["e2"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 1
max = 4096
default = 128
[params.rows]
type = "int"
min = 1
max = 16384
default = 256
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-12
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 128

[derived]
K = "ceil(channels / 128)"
M = "rows * K"
tail = "ds((channels - 1) % 128 + 1) + 65536 * ds((out0_d1 - 1) % 128 + 1)"
work = "ds(128) + 65536 * qf(1, 4, 8, 0)"
half = "1277440"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / 128)", 128]
range = [-2.0, 2.0]
[inputs.gamma]
shape = ["3 * K", 128]
[inputs.beta]
shape = ["3 * K", 128]
[inputs.crow]
shape = [3, 128]
[inputs.epsilon]
shape = [128]
[scratch.tmp]
shape = ["32 + 2 * K", 128]
[scratch.normalized]
shape = ["3 * M + K", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
qf_out0 = "CR6"
crow = "CR7"
tmp = "CR8"
qf_in0 = "CR9"
K = "CR10"
normalized = "CR11"
epsilon = "CR12"
half = "CR13"
tail = "CR14"
work = "CR15"
out0_d1 = "LR12"
M = "LR13"
out0_d2 = "LR14"

[cases.default]
