[kernel]
op = "conv2d_builtin"
formats = ["e2"]

[params]
act_out0 = {type = "str", choices = ["relu"], default = "relu"}
bias = {type = "bool", default = true}
cin = {type = "int", min = 1, max = 512, default = 16}
cout = {type = "int", min = 1, max = 512, default = 16}
groups = {type = "int", min = 1, max = 512, default = 16}
h = {type = "int", min = 1, max = 255, default = 112}
w = {type = "int", min = 1, max = 128, default = 112}
kh = {type = "int", choices = [3], default = 3}
kw = {type = "int", choices = [3], default = 3}
padding = {type = "int", choices = [1], default = 1}
stride = {type = "int", choices = [1, 2], default = 2}
in0_d0 = {type = "int", choices = [1], default = 1}
in0_d1 = {type = "int", min = 1, max = 512, default = 16}
in0_d2 = {type = "int", min = 1, max = 255, default = 112}
in0_d3 = {type = "int", min = 1, max = 128, default = 112}
out0_d0 = {type = "int", choices = [1], default = 1}
out0_d1 = {type = "int", min = 1, max = 512, default = 16}
out0_d2 = {type = "int", min = 1, max = 255, default = 56}
out0_d3 = {type = "int", min = 1, max = 128, default = 56}

[derived]
full = "ds(128)"
width = "ds(out0_d3)"
right = "ds(max(1, (in0_d3 - 2) // stride + 1))"
plane = "3 * (in0_d2 + 2)"
next_plane = "plane - 9"
group_plane = "plane * (cin // groups)"
weight_rows = "1 + 3 * cout * (cin // groups)"
input_rows = "in0_d1 * in0_d2"

[inputs.in0]
shape = ["in0_d1", "in0_d0", "in0_d2", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
[scratch.windows]
shape = ["in0_d1 * plane", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
windows = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
width = "CR9"
right = "CR10"
next_plane = "CR11"
group_plane = "CR12"
weight_rows = "CR13"
input_rows = "CR14"
cin = "CR15"
qf_weights = "LR15"

[cases.default]
