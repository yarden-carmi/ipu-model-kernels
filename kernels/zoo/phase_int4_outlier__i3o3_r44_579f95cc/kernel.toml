[kernel]
op = "phase_int4_outlier"
formats = ["e2"]

[params.cin]
type = "int"
min = 1
max = 64
default = 48
[params.cout]
type = "int"
min = 1
max = 128
default = 48
[params.kh]
type = "int"
min = 1
default = 4
[params.kw]
type = "int"
min = 1
default = 4
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 48
[params.in0_d2]
type = "int"
min = 1
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 48
[params.out0_d2]
type = "int"
min = 1
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 64

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d1", 128]
range = [-1, 1]
[inputs.helpers]
shape = [5, 128]
range = [-1, 1]
[inputs.weights]
shape = ["kh * kw * (3 * cin + 4)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d1", 128]
[scratch.tmp]
shape = ["9 + in0_d0 * in0_d2 * in0_d3", 128]
[scratch.stage]
shape = ["out0_d0 * out0_d2 * out0_d3", 128]

[derived]
sites = "in0_d0 * in0_d2 * in0_d3"
qi = "qf(1, 2, 8, 0) + 65536 * ds(1)"
channels = "ds(cout) + 65536 * ds(cin)"
dot_bounds = "cin + 65536 * (cin - 1)"
output = "ds(out0_d3) + 65536 * out0_d1"
input_steps = "in0_d3 + 65536 * in0_d1"
row_gap = "out0_d3 - kw"

[abi]
in0 = "CR2"
out0 = "CR3"
helpers = "CR4"
weights = "CR5"
tmp = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
qi = "CR9"
stage = "CR10"
channels = "CR11"
dot_bounds = "CR12"
input_steps = "CR13"
output = "CR14"
row_gap = "CR15"
sites = "LR13"
kw = "LR14"
kh = "LR15"

[cases.default]
