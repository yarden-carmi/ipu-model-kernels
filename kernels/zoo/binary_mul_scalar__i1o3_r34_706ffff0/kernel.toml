[kernel]
op = "binary_mul_scalar"
formats = ["e2", "e3"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 15360
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 720
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 4
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 60
[derived]
chunks = "ceil(in0_d1 / 128)"
batch_stride = "in0_d2 * chunks"
head_stride = "out0_d3 * chunks"
ds_pair = "ds(out0_d3) + 65536 * ds(128)"
# These constants sum to the head width in either FP32 or NX8 mode.
fp_base = "0x4b010080"
fp_top = "fp_base + out0_d3"
head_width = "0x18600 + out0_d3 + 128 * (1 - out0_d3 // 128) - 128 * (out0_d3 // 128)"

[inputs.in0]
shape = ["in0_d0 * batch_stride", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", 128]
[scratch.scalar]
shape = [1, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
ds_pair = "CR6"
scalar = "CR7"
fp_top = "CR8"
fp_base = "CR9"
head_width = "CR10"
chunks = "CR11"
out0_d1 = "CR12"
out0_d2 = "CR13"
out0_d3 = "CR14"
batch_stride = "CR15"
out0_d0 = "LR14"
head_stride = "LR15"

[cases.default]
