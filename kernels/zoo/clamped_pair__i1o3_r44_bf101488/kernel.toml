[kernel]
op = "clamped_pair"
formats = ["e1"]

[params.axis]
type = "int"
choices = [-2, -1]
default = -1
[params.out]
type = "int"
min = 1
max = 256
default = 224
[params.in0_d0]
type = "int"
min = 1
max = 16
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 32
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 16
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 32
[params.out0_d2]
type = "int"
min = 1
max = 256
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 256
default = 224

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "chunks", 128]
[scratch.work]
shape = [33, 128]
[scratch.tmp]
shape = ["out0_d2", "out0_d3", 128]

[derived]
n = "(axis + 2) * in0_d3 + (-axis - 1) * in0_d2"
last = "n - 1"
den = "2 * out"
step = "2 * n"
inner = "(axis + 2) * in0_d2 + (-axis - 1) * in0_d3"
active = "ds(out0_d1)"
in_batch = "in0_d2 * in0_d3"
chunks = "ceil(out0_d3 / 128)"
full = "ds(128)"
tail = "ds(out0_d3 - 128 * (chunks - 1))"

[abi]
in0 = "CR2"
out0 = "CR3"
work = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
active = "CR7"
in_batch = "CR8"
tmp = "CR9"
full = "CR10"
last = "CR11"
den = "CR12"
step = "CR13"
inner = "CR14"
tail = "CR15"

[cases.default]
