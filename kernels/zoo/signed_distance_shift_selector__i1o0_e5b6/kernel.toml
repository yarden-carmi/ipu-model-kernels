[kernel]
op = "signed_distance_shift_selector"
formats = ["e2"]

[params.tokens]
type = "int"
min = 1
max = 256
default = 256
[params.vocab]
type = "int"
min = 1
max = 30522
default = 30522

[inputs.in0]
shape = ["ceil(tokens / 128)", 128]
[inputs.bounds]
shape = ["vocab", 3, 128]
[inputs.ones]
shape = [4, 128]
range = [1, 1]
[outputs.out0]
shape = ["vocab", "ceil(tokens / 128)", 128]
[scratch.tmp]
shape = [3, 128]

[derived]
chunks = "ceil(tokens / 128)"
last_ds = "ds((tokens - 1) % 128 + 1)"
full_ds = "ds(128)"
cyclic_slot = "256"
tmp_qf = "case_qf"
const_qf = "case_qf"
fp_slope = "1266679808"
nx_slope = "1218304"

[abi]
in0 = "CR2"
out0 = "CR3"
bounds = "CR4"
ones = "CR5"
tmp = "CR6"
qf_in0 = "CR7"
const_qf = "CR8"
fp_slope = "CR9"
nx_slope = "CR15"
tmp_qf = "CR10"
qf_out0 = "CR11"
full_ds = "CR14"
cyclic_slot = "LR9"
chunks = "CR12"
vocab = "CR13"

[cases.default]
tokens = 256
vocab = 30522
[golden]
tolerance = { e2 = "EXACT" }
