[kernel]
op = "bmm"
formats = ["e3"]

[params]
b = {type="int", min=1, max=65535, default=8}
k = {type="int", min=1, max=64, default=64}
m = {type="int", min=1, max=65535, default=64}
n = {type="int", min=1, max=128, default=64}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=8}
in0_d2 = {type="int", min=1, max=65535, default=64}
in0_d3 = {type="int", min=1, max=64, default=64}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=64, default=64}
in1_d2 = {type="int", min=1, max=65535, default=512}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=8}
out0_d2 = {type="int", min=1, max=65535, default=64}
out0_d3 = {type="int", min=1, max=128, default=64}

[derived]
packed_rows = "ceil(in1_d2/2)"
skip = "in1_d2-out0_d1*n"
start_row = "skip//2"
start_lane = "(skip%2)*in1_d1"
group_step = "packed_rows"
heads = "out0_d1"
groups = "out0_d0"
sizes = "n + m*65536"
lanes = "in1_d1 + start_lane*65536"
ds = "ds(k) + ds(n)*65536"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ceil(in0_d3/128)*128"]
range = [0, 1]

[inputs.in1]
shape = ["in1_d0", "packed_rows", 128]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
ds = "CR8"
sizes = "CR9"
lanes = "CR10"
heads = "CR11"
groups = "CR12"
group_step = "CR13"
start_row = "LR1"

[cases.default]
