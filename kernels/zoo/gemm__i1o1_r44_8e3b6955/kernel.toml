[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 128
default = 64
[params.m]
type = "int"
min = 2
multiple_of = 2
default = 256
[params.n]
type = "int"
min = 1
max = 64
default = 64
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.in0_d2]
type = "int"
min = 1
default = 16
[params.in0_d3]
type = "int"
min = 2
multiple_of = 2
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 64
default = 64
[params.out0_d2]
type = "int"
min = 1
default = 16
[params.out0_d3]
type = "int"
min = 2
multiple_of = 2
default = 16

[derived]
input_points = "in0_d0 * in0_d2 * in0_d3"
pairs = "out0_d0 * out0_d2 * out0_d3 // 2"
dot_ds = "ds(k)"
output_ds = "ds(2 * out0_d1)"
slot_size = "128"

[inputs.in0]
shape = ["input_points", 128]
range = [-2, 2]
[inputs.w]
shape = ["2 * (n + 1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["pairs", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
dot_ds = "CR7"
output_ds = "CR8"
pairs = "CR9"
n = "CR10"
slot_size = "CR11"

[cases.default]
