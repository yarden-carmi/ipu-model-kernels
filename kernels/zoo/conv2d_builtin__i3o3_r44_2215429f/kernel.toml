[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 72
[params.cout]
type = "int"
min = 1
max = 512
default = 72
[params.groups]
type = "int"
min = 1
max = 512
default = 72
[params.h]
type = "int"
min = 3
max = 256
default = 56
[params.w]
type = "int"
min = 1
max = 128
default = 56
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 72
[params.in0_d2]
type = "int"
min = 3
max = 256
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 512
default = 72
[params.out0_d2]
type = "int"
min = 1
max = 256
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 28

[derived]
pack = "1 + (max(1, 128 // in0_d3) - 1) * (1 - min(1, in0_d2 % max(1, 128 // in0_d3)))"
plane = "in0_d2 // pack"
last_y = "in0_d2 - 1"
group_span = "plane * (in0_d1 // groups)"
group_outputs = "out0_d1 // groups"
phase_end = "128 + pack * in0_d3"
interior = "max(0, out0_d3 - 1 - in0_d3 % 2)"
variants = "1 + min(1, interior) + (in0_d3 % 2) * min(1, out0_d3 - 1)"
tap_rows = "3 * (2 - stride + (stride - 1) * variants)"
stride1_rows = "9 * (2 - stride)"
stride2_rows = "tap_rows * (stride - 1)"
weight_rows = "out0_d1 * (3 + 3 * (stride1_rows + stride2_rows) * (in0_d1 // groups))"
full = "ds(128)"
tail = "ds(out0_d3)"
three = "ds(3)"

[inputs.in0]
shape = ["in0_d1", "plane", 128]
range = [-2, 2]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d1", "out0_d2", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
plane = "CR9"
last_y = "CR10"
group_span = "CR11"
weight_rows = "CR12"
phase_end = "CR13"
three = "CR14"
group_outputs = "CR15"

[cases.default]
