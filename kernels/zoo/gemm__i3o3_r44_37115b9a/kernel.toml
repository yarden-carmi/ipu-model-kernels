[kernel]
op = "gemm"
formats = ["e1", "e2"]
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 2147483647
default = 256
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d2]
type = "int"
min = 1
default = 16
[params.in0_d3]
type = "int"
min = 1
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
default = 16
[params.out0_d3]
type = "int"
min = 1
default = 16
[derived]
spatial = "in0_d2 * in0_d3"
small = "1 - min(1, max(spatial - 64, 64 - spatial) + k % 2 + 128 % in0_d3 + in0_d0 - 1)"
ic = "max(1, 128 // in0_d3)"
oc = "max(1, 128 // out0_d3)"
ip = "1 + (ic - 1) * max(1 - min(1, in0_d2 % ic), 1 - min(1, max(spatial - 64, 64 - spatial) + 128 % in0_d3))"
op = "1 + (oc - 1) * max(1 - min(1, out0_d2 % oc), 1 - min(1, max(out0_d2 * out0_d3 - 64, 64 - out0_d2 * out0_d3) + 128 % out0_d3))"
pitch = "ceil(in0_d2 / ip) * ceil(ip * in0_d3 / 128)"
batch_stride = "in0_d1 * pitch"
last_lanes = "ds(min(in0_d2, ip) * in0_d3 - 128 * ((min(in0_d2, ip) * in0_d3 - 1) // 128))"
full = "ds(128)"
lanes128 = "128"
chunks = "ceil(k / 128)"
inner = "small * chunks + (1 - small) * ceil(in0_d3 / 128)"
group = "32 + 64 * min(1, max(0, k - 255)) * min(1, max(0, spatial - 1024))"
weight_rows = "n * (small * (1 + chunks) + (1 - small) * 2 * ceil(k / group))"
active = "ds((k - 1) % 128 + 1)"
pair_src = "1073741824"
pair_dst = "16777216"
packed_start = "64 * chunks"
half = "ds(64)"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * pitch", 128]
range = [-2, 2]
[inputs.w]
shape = ["weight_rows + 2 * n", 128]
range = [-1, 1]
when = "bias"
[inputs.w_unbiased]
shape = ["weight_rows", 128]
range = [-1, 1]
when = "not bias"
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / op) * ceil(op * out0_d3 / 128)", 128]
[scratch.panel]
shape = ["small * (packed_start + k // 2) + 1", 128]
[abi]
in0 = "CR2"
w = "CR3"
w_unbiased = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
inner = "CR7"
n = "CR8"
full = "CR9"
last_lanes = "CR10"
in0_d0 = "CR11"
lanes128 = "CR12"
active = "CR13"
panel = "CR14"
half = "CR15"
pair_src = "LR6"
pair_dst = "LR14"
batch_stride = "LR15"
pitch = "LR4"
packed_start = "LR5"
[cases.default]
