[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 2147483647
default = 256
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d2]
type = "int"
min = 1
default = 16
[params.in0_d3]
type = "int"
min = 1
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
default = 16
[params.out0_d3]
type = "int"
min = 1
default = 16
[derived]
in_pack = "1 + (max(1, 128 // in0_d3) - 1) * (1 - min(1, in0_d2 % max(1, 128 // in0_d3)))"
out_pack = "1 + (max(1, 128 // out0_d3) - 1) * (1 - min(1, out0_d2 % max(1, 128 // out0_d3)))"
in_pitch = "(in0_d2 // in_pack) * ceil(in0_d3 * in_pack / 128)"
out_x = "ceil(out0_d3 * out_pack / 128)"
out_pitch = "(out0_d2 // out_pack) * out_x"
batch_stride = "in0_d1 * in_pitch"
batches = "in0_d0"
full = "ds(128)"
store_ds = "ds((out0_d3 * out_pack - 1) % 128 + 1)"
lanes = "128"
panels = "ceil(k / 128)"

[inputs.in0]
shape = ["in0_d0 * batch_stride", 128]
range = [-2, 2]
[inputs.w]
shape = ["2 * n * (panels + 1)", 128]
range = [-1, 1]
when = "bias"
[inputs.w_unbiased]
shape = ["2 * n * panels", 128]
range = [-1, 1]
when = "not bias"
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out_pitch", 128]

[abi]
in0 = "CR2"
w = "CR3"
w_unbiased = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
store_ds = "CR8"
batches = "CR9"
n = "CR10"
in_pitch = "CR11"
out_pitch = "CR12"
batch_stride = "CR13"
lanes = "CR14"
panels = "CR15"
out_x = "LR15"

[cases.default]
