chain = ["binary"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [0, 1, 2]
pack = "min(d2, 3, 128 // d3)"

[view.in0]
kind = "whole"

[layout.in1]
lanes = 1
rows = [0, 2, 3]

[view.in1]
kind = "whole"

[layout.out0]
lanes = 3
rows = [0, 1, 2]
pack = "min(d2, 3, 128 // d3)"
