[kernel]
op = "gemm_table"
formats = ["e2", "e3"]

[params.k]
type = "int"
min = 1
max = 4096
default = 192
[params.n]
type = "int"
min = 1
max = 4096
default = 384
[params.m]
type = "int"
min = 1
max = 65535
default = 256
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["gelu_tanh", "silu"]
default = "gelu_tanh"
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 192
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 384
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 128

[derived]
pack = "1 + (min(in0_d2, 128 // in0_d3) - 1) * (1 - min(1, in0_d2 % min(in0_d2, 128 // in0_d3)))"
blocks = "in0_d2 // pack"
pixels = "in0_d3 * pack"
groups = "in0_d0 * blocks"
skip = "(k - 1) * blocks"
oc = "ceil(n / 128)"
full = "ds(128)"
tail = "ds(n - (oc - 1) * 128)"
pair = "min(1, max(0, 65 - n)) * min(1, max(0, 65 - k)) * (1 - k % 2)"
panelized = "(1 - min(1, k % 16)) * (1 - min(1, pixels % 8))"
split = "11 * min(1, max(0, k - 32)) * min(1, max(0, 160 - k)) + (1 - min(1, max(k - 64, 64 - k)))"
center = "panelized * (1 - min(1, max(k - 32, 32 - k))) * (1 - min(1, max(0, n - 128))) * (1 - pair)"
stride = "k + 2 + center * 8 + (1 - pair) * (panelized * (k // 16 * split) + (1 - panelized) * k)"
src_lo = "50462976"
src_hi = "117835012"

[inputs.in0]
shape = ["groups * k", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["oc * stride", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["m * oc", 128]

[scratch.panel]
shape = ["ceil(k / 16) + center * 9", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
lut = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
k = "CR8"
blocks = "CR9"
pixels = "CR10"
panel = "CR11"
full = "CR12"
tail = "CR13"
oc = "CR14"
skip = "CR15"
groups = "LR10"
src_lo = "LR14"
src_hi = "LR15"

[cases.default]
