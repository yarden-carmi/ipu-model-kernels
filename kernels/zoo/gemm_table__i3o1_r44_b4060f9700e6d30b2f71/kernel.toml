[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 160
default = 64
[params.n]
type = "int"
min = 1
max = 4096
default = 256
[params.m]
type = "int"
min = 1
max = 65536
default = 4096
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 64
[derived]
pack = "1 + (min(in0_d2, 128 // in0_d3) - 1) * (1 - min(1, in0_d2 % min(in0_d2, 128 // in0_d3)))"
pixels = "pack * in0_d3"
pixel_end = "pixels - 1"
tap_loop_end = "max(0, k - 2)"
packed = "min(1, k // 32) * (1 - min(1, k % 16)) * (1 - min(1, pixels % 8))"
narrow_pair = "min(1, max(0, 65 - n)) * min(1, max(0, 65 - k)) * (1 - k % 2)"
grouped = "packed * (1 - min(1, max(k - 96, 96 - k)))"
src_lo = "packed * 50462976 + (1 - packed) * max(0, k - 2)"
src_hi = "packed * 117835012 + (1 - packed) * pixel_end"
plane = "in0_d2 // pack"
groups = "in0_d0 * plane"
batch_skip = "(k - 1) * plane"
blocks = "ceil(n / 128)"
full_ds = "ds(128)"
tail_ds = "ds(n - 128 * (blocks - 1))"
[inputs.in0]
shape = ["groups * k", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["blocks * (grouped * 122 + (1 - grouped) * (2 * (k + 1) - narrow_pair * k))", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["m * blocks", 128]
[scratch.panel]
shape = ["ceil(k / 16) + grouped * 26", 128]
[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
k = "CR8"
plane = "CR9"
pixels = "CR10"
panel = "CR11"
full_ds = "CR12"
tail_ds = "CR13"
blocks = "CR14"
batch_skip = "CR15"
groups = "LR10"
src_lo = "LR14"
src_hi = "LR15"
[cases.default]
