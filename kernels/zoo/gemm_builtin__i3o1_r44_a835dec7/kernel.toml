[kernel]
op = "gemm_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 16
[params.n]
type = "int"
min = 1
max = 4096
default = 72
[params.m]
type = "int"
min = 1
max = 65536
default = 3136
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 72
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 56

[derived]
tiles = "ceil(n / 128)"
full_tiles = "tiles - 1"
last = "ds((n - 1) % 128 + 1)"
full = "ds(128)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d1", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["tiles * (2 * k + 1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
qf_coeff = "CR7"
k = "CR8"
m = "CR9"
in0_d1 = "CR10"
in0_d3 = "CR11"
full_tiles = "CR12"
last = "CR14"
full = "CR15"

[cases.default]
