[kernel]
op = "multiplicity_pool_resize"
formats = ["e2"]

[params.in0_d0]
type = "int"
default = 1
[params.in0_d1]
type = "int"
default = 64
[params.in0_d2]
type = "int"
default = 64
[params.in0_d3]
type = "int"
default = 64
[params.out0_d0]
type = "int"
default = 1
[params.out0_d1]
type = "int"
default = 64
[params.out0_d2]
type = "int"
default = 128
[params.out0_d3]
type = "int"
default = 128
[params.oh]
type = "int"
default = 128
[params.ow]
type = "int"
default = 128

[inputs.in0]
shape = ["in0_d1", "in0_d0", "(in0_d2 + 1) // 2", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", 128]

[derived]
nx = "min(1, case_qf)"
center = "(1 - nx) * 0x3f100000 + nx * 0x017e10"
side = "(1 - nx) * 0x3e400000 + nx * 0x017c40"
corner = "(1 - nx) * 0x3d800000 + nx * 0x017b00"
channel_stride = "in0_d0 * ((in0_d2 + 1) // 2)"
last_channel = "in0_d1 - 1"
last_x = "in0_d3 - 1"
last_y = "in0_d2 - 1"
ds_one = "ds(1)"
ds_out = "ds(out0_d1)"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
center = "CR6"
side = "CR7"
corner = "CR8"
channel_stride = "CR9"
last_channel = "CR10"
last_x = "CR11"
last_y = "CR12"
ds_one = "CR13"
ds_out = "CR15"

[cases.default]
