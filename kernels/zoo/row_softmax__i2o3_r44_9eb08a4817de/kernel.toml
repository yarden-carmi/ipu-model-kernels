[kernel]
op = "row_softmax"
formats = ["e2"]

[params.n]
type = "int"
min = 1
max = 128
default = 50
[params.rows]
type = "int"
min = 1
default = 600
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 50
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 50
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 12
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 50
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 50

[derived]
full = "ds(128)"
active = "ds(n)"
single = "ds(1)"
work_qf = "24"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "ceil(in0_d2 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3 / 128)", 128]
[scratch.tmp]
shape = ["n + 8", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
tmp = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
work_qf = "CR7"
full = "CR8"
active = "CR9"
single = "CR10"
rows = "CR11"
n = "CR12"
in0_d2 = "CR13"

[cases.default]
