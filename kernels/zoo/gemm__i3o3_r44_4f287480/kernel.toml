[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params]
bias = {type = "bool", default = true}
k = {type = "int", min = 1, max = 65536, default = 128}
m = {type = "int", min = 1, max = 65536, default = 4096}
n = {type = "int", min = 1, max = 65536, default = 64}
in0_d0 = {type = "int", min = 1, max = 65536, default = 1}
in0_d1 = {type = "int", min = 1, max = 65536, default = 128}
in0_d2 = {type = "int", min = 1, max = 65536, default = 64}
in0_d3 = {type = "int", min = 1, max = 65536, default = 64}
out0_d0 = {type = "int", min = 1, max = 65536, default = 1}
out0_d1 = {type = "int", min = 1, max = 65536, default = 64}
out0_d2 = {type = "int", min = 1, max = 65536, default = 64}
out0_d3 = {type = "int", min = 1, max = 65536, default = 64}

[derived]
tiles = "ceil(out0_d2 * out0_d3 / 128)"
batch_step = "ceil(in0_d2 * in0_d3 / 128) + 1 - ceil(in0_d2 * in0_d3 / 128) % 2"
stride = "in0_d0 * batch_step"
full = "ds(128)"
tail = "ds((out0_d2 * out0_d3 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d1 * stride", 128]
[inputs.coeff]
shape = ["n * (2 + 2 * ceil(k / 128))", 128]
[outputs.out0]
shape = ["out0_d1 * out0_d0 * tiles", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
stride = "CR9"
tiles = "CR10"
out0_d0 = "CR11"
n = "CR12"
k = "CR13"
batch_step = "CR15"

[cases.default]
