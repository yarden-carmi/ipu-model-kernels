[kernel]
op = "conv2d"
formats = ["e3"]
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 3
[params.cout]
type = "int"
min = 1
max = 1152
default = 128
[params.groups]
type = "int"
min = 1
max = 1
default = 1
[params.h]
type = "int"
min = 1
max = 1024
default = 4
[params.w]
type = "int"
min = 1
max = 1024
default = 4
[params.kh]
type = "int"
min = 1
max = 16
default = 2
[params.kw]
type = "int"
min = 1
max = 16
default = 2
[params.padding]
type = "int"
min = 0
max = 16
default = 0
[params.stride]
type = "int"
min = 1
max = 16
default = 2
[derived]
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
blocks = "(cout + 127) // 128"
full = "ds(cout)"
[inputs.in0]
shape = ["h", "w", 128]
range = [-2, 2]
[inputs.weights]
shape = ["blocks", "1 + kh * kw * cin", 128]
range = [-1, 1]
[outputs.out0]
shape = ["ho", "wo", "blocks", 128]
[scratch.zero]
shape = [1, 128]
[abi]
in0 = "CR2"
zero = "CR12"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
blocks = "CR8"
h = "CR9"
w = "CR10"
full = "CR15"
[golden]
tolerance = { e3 = "NX8_STEP" }
[cases.default]
cin = 3
cout = 32
h = 224
w = 224
kh = 3
kw = 3
padding = 1
stride = 2
bias = false
