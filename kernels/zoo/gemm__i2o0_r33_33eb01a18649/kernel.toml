[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params]
bias = {type = "bool", default = true}
k = {type = "int", min = 1, max = 65536, default = 288}
m = {type = "int", min = 1, max = 65536, default = 1024}
n = {type = "int", min = 1, max = 65536, default = 144}
in0_d0 = {type = "int", min = 1, max = 128, default = 4}
in0_d1 = {type = "int", min = 1, max = 65536, default = 256}
in0_d2 = {type = "int", min = 1, max = 65536, default = 288}
out0_d0 = {type = "int", min = 1, max = 128, default = 4}
out0_d1 = {type = "int", min = 1, max = 65536, default = 256}
out0_d2 = {type = "int", min = 1, max = 65536, default = 144}

[derived]
chunks = "ceil(k / 128)"
batchstride = "in0_d1 * ceil(in0_d2 / 128)"
full = "ds(128)"
outds = "ds(out0_d0)"
minusone = "-1"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2 / 128) * 128"]
[inputs.w]
shape = ["n * (1 + ceil(k / 128))", 128]
[outputs.out0]
shape = ["out0_d1", "out0_d2", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
chunks = "CR7"
batchstride = "CR8"
full = "CR9"
outds = "CR10"
in0_d0 = "CR11"
out0_d1 = "CR12"
n = "CR13"
minusone = "CR14"

[golden]
tolerance = {e2 = "NX8_STEP", e3 = "NX8_STEP"}
[cases.default]
