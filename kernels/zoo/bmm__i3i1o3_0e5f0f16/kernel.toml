[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=512, default=16}
k = {type="int", min=1, max=1024, default=36}
m = {type="int", min=1, max=1024, default=256}
n = {type="int", min=1, max=1024, default=256}
in0_d0 = {type="int", min=1, max=512, default=4}
in0_d1 = {type="int", min=1, max=512, default=4}
in0_d2 = {type="int", min=1, max=1024, default=256}
in0_d3 = {type="int", min=1, max=1024, default=36}
in1_d0 = {type="int", min=1, max=512, default=4}
in1_d1 = {type="int", min=1, max=1024, default=256}
in1_d2 = {type="int", min=1, max=1572864, default=432}
out0_d0 = {type="int", min=1, max=512, default=4}
out0_d1 = {type="int", min=1, max=512, default=4}
out0_d2 = {type="int", min=1, max=1024, default=256}
out0_d3 = {type="int", min=1, max=1024, default=256}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "arows*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "ceil(in1_d1/128)*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[derived]
arows = "ceil(in0_d3/128)"
arowstride = "arows*in0_d1"
arewind = "(in0_d1-1)*arows"
nchunks = "ceil(n/128)"
bstride = "k*nchunks"
bgap = "(in1_d2-k*out0_d1)*nchunks"
bstart = "((in1_d2-k*out0_d1)//2)*nchunks"
ds = "ds(128) + ds((n-1)%128+1)*65536"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
k = "CR6"
m = "CR7"
bstride = "CR8"
arowstride = "CR9"
ds = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
nchunks = "CR14"
bgap = "CR15"
bstart = "LR2"
out0_d1 = "LR15"
arows = "LR14"
arewind = "LR13"

[cases.default]
