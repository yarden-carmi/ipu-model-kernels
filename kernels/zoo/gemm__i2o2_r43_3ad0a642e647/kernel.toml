[kernel]
op = "gemm"
formats = ["e1", "e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 16384
default = 384
[params.m]
type = "int"
min = 1
max = 16384
default = 256
[params.n]
type = "int"
min = 1
max = 16384
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 16384
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 384

[derived]
tiles = "ceil(out0_d2 / 128)"
rows = "out0_d0 * out0_d1"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
chunks = "ceil(in0_d2 / 128)"
head_stride = "in0_d3 * chunks"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / 128) * in0_d3", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * (k + 1) * 3", 128]
range = [-1, 1]
[outputs.out0]
shape = ["rows * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
rows = "CR10"
in0_d2 = "CR11"
in0_d3 = "CR12"
k = "CR13"
chunks = "CR14"
head_stride = "CR15"

[cases.default]
