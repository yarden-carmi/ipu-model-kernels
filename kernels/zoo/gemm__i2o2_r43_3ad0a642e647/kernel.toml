[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 384
[params.m]
type = "int"
min = 1
max = 65536
default = 257
[params.n]
type = "int"
min = 1
max = 65536
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 6
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 384

[derived]
tiles = "ceil(n / 128)"
chunks = "ceil(in0_d2 / 128)"
chunk_pad = "chunks - 1"
rewind = "in0_d3 * chunks"
rows = "out0_d0 * m"
full = "ds(128)"
tail = "ds((n - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d3 * chunks", 128]
range = [-2, 2]
[inputs.w]
shape = ["4 * tiles * (k + 1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_w = "CR6"
qf_out0 = "CR7"
k = "CR8"
tiles = "CR9"
full = "CR10"
tail = "CR11"
in0_d2 = "CR12"
in0_d3 = "CR13"
chunks = "CR14"
chunk_pad = "CR15"
rows = "LR10"
rewind = "LR14"

[cases.default]
