[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params]
act_out0 = {type = "str", choices = ["silu"], default = "silu"}
bias = {type = "bool", default = true}
cin = {type = "int", min = 1, max = 640, default = 384}
cout = {type = "int", min = 1, max = 640, default = 384}
groups = {type = "int", min = 1, max = 640, default = 384}
h = {type = "int", min = 1, max = 256, default = 32}
w = {type = "int", choices = [8, 16, 32, 64, 128, 256], default = 32}
kh = {type = "int", choices = [3], default = 3}
kw = {type = "int", choices = [3], default = 3}
padding = {type = "int", choices = [1], default = 1}
stride = {type = "int", choices = [1, 2], default = 2}
in0_d0 = {type = "int", choices = [1], default = 1}
in0_d1 = {type = "int", min = 1, max = 640, default = 384}
in0_d2 = {type = "int", min = 1, max = 256, default = 32}
in0_d3 = {type = "int", choices = [8, 16, 32, 64, 128, 256], default = 32}
out0_d0 = {type = "int", choices = [1], default = 1}
out0_d1 = {type = "int", min = 1, max = 640, default = 384}
out0_d2 = {type = "int", min = 1, max = 256, default = 16}
out0_d3 = {type = "int", choices = [4, 8, 16, 32, 64, 128, 256], default = 16}

[derived]
ir = "ceil(in0_d2 * in0_d3 / 128)"
spatial = "out0_d2 * out0_d3"
sr = "ceil(spatial / 128)"
oc = "ceil(out0_d1 / 128)"
gc = "cin // groups"
taps = "kh * kw"
plane = "ir + 10 * min(1, ir - 1)"
tiles = "ceil(w / 128)"
weight_tile = "3 + 3 * gc * taps"
full = "ds(128)"
channel_ds = "65536 * ds(1 + (cout - 1) % 128) + full"
work_desc = "65536 * 360 + full"
input_tail = "ds(1 + (in0_d2 * in0_d3 - 1) % 128)"
sr_last = "sr - 1"
gc_last = "gc - 1"

[inputs.in0]
shape = ["in0_d1 * ir", 128]
range = [-2, 2]
[inputs.weights]
shape = ["cout * tiles * weight_tile", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.guard]
shape = ["cin * (ir + 10)", 128]
[scratch.spatial_out]
shape = ["6 * cout * ir + 5", 128]
[outputs.out0]
shape = ["spatial * oc", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
guard = "CR6"
input_tail = "CR7"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
work_desc = "CR11"
channel_ds = "CR12"
spatial_out = "CR13"
gc_last = "CR14"
plane = "CR15"

[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}
[cases.default]
