[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=2147483647, default=6}
k = {type="int", min=1, max=32767, default=64}
m = {type="int", min=1, max=32767, default=257}
n = {type="int", min=1, max=32767, default=257}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=32767, default=257}
in0_d2 = {type="int", min=1, max=4194176, default=384}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=32767, default=257}
in1_d2 = {type="int", min=1, max=4194176, default=384}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=6}
out0_d2 = {type="int", min=1, max=32767, default=257}
out0_d3 = {type="int", min=1, max=32767, default=257}

[inputs.in0]
shape = ["in0_d0", "in0_d2", "a_stride*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "b_stride*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]

[derived]
a_stride = "ceil(in0_d1/128)"
b_stride = "ceil(in1_d2/128)"
strides = "a_stride+65536*b_stride"
a_group = "(in0_d2-out0_d1*k)*a_stride"
b_group = "in1_d1*b_stride-((out0_d1-1)*k)//128"
widths = "ds(128)+65536*ds((m-1)%128+1)"
tiles = "ceil(m/128)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
strides = "CR8"
widths = "CR9"
k = "CR10"
n = "CR11"
out0_d1 = "CR12"
tiles = "CR13"
a_group = "CR14"
b_group = "CR15"
out0_d0 = "LR4"

[cases.default]
