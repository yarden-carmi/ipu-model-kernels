chain = ["pool2d"]
chain_in = ["in0"]
chain_out = ["out0"]
notes = "Channels along lanes; skip padded border samples."
[layout.in0]
shape = [1, "channels", "h", "w"]
lanes = 1
rows = [0, 2, 3]
pad = "128 - channels"
[view.in0]
kind = "whole"
[layout.out0]
shape = [1, "channels", "(h + 2 * padding - k) // stride + 1", "(w + 2 * padding - k) // stride + 1"]
lanes = 1
rows = [0, 2, 3]
pad = "128 - channels"
