[kernel]
op = "pool2d"
formats = ["e3"]
[params.channels]
type = "int"
min = 1
max = 128
default = 64
[params.h]
type = "int"
min = 2
max = 112
default = 112
[params.w]
type = "int"
min = 2
max = 112
default = 112
[params.k]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [2]
default = 2
[params.kind]
type = "str"
choices = ["max"]
default = "max"
[derived]
ds_channels = "ds(channels)"
oh = "(h + 2 * padding - k) // stride + 1"
ow = "(w + 2 * padding - k) // stride + 1"
[inputs.in0]
shape = [1, "h", "w", 128]
range = [-10, 10]
[outputs.out0]
shape = [1, "oh", "ow", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
ds_channels = "CR5"
w = "CR6"
h = "CR9"
qf_out0 = "CR10"
[golden]
tolerance = { e3 = "EXACT" }
[cases.default]
