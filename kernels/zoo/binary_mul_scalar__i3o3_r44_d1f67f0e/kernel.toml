[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 30000
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 50
[params.in0_d3]
type = "int"
min = 1
max = 64
default = 50
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 50
[params.out0_d3]
type = "int"
min = 1
max = 64
default = 50

[inputs.in0]
shape = ["ceil(input_items / 2)", 128]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["output_items", 128]
[scratch.scalar]
shape = [1, 128]

[derived]
input_items = "in0_d0 * in0_d1 * in0_d2"
output_items = "out0_d0 * out0_d1 * out0_d2"
pair_count = "input_items // 2"
odd = "input_items % 2"
ds_pair = "ds(out0_d3) + 65536 * ds(128)"
fp_hi = "0x43012080"
fp_lo = "0x43010080"
nx_scale = "0x00017c00"
before_first = "0 - 1"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
ds_pair = "CR6"
fp_hi = "CR7"
fp_lo = "CR8"
nx_scale = "CR9"
scalar = "CR10"
pair_count = "CR11"
odd = "CR12"
in0_d3 = "LR3"
before_first = "LR2"

[cases.default]
