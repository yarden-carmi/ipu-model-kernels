[kernel]
op = "gemm_table"
formats = ["e3", "e2", "e1"]

[params.act_out0]
type = "str"
choices = ["gelu", "gelu_tanh", "quick_gelu"]
default = "gelu_tanh"
[params.bias]
type = "bool"
default = true
[params.m]
type = "int"
min = 1
max = 65535
default = 256
[params.k]
type = "int"
min = 1
max = 4096
default = 768
[params.n]
type = "int"
min = 1
max = 4096
default = 3072
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 768
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 3072

[derived]
chunks = "ceil(k / 128)"
tiles = "ceil(n / 128)"
rows = "in0_d0 * in0_d1"
tail_ds = "ds((n - 1) % 128 + 1)"
full_ds = "ds(128)"
full_bound = "125"
tail_bound = "(k - 1) % 128 - 2"

[inputs.in0]
shape = ["rows * ceil(in0_d2 / 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * k", 128]
range = [-1, 1]
[inputs.b]
shape = ["tiles", 128]
range = [-1, 1]
when = "bias"
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
full_bound = "CR6"
rows = "CR7"
tiles = "CR8"
chunks = "CR9"
qf_in0 = "CR10"
qf_out0 = "CR11"
tail_bound = "CR12"
tail_ds = "CR13"
lut = "CR14"
full_ds = "CR15"

[cases.default]
