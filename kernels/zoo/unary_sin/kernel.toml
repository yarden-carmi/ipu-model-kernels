# unary_sin: y = sin(x) elementwise over numel elements, one parameterised program.
#
#   fn    : sin (the only function this program realises)
#   numel : elements of x and of y
#
# The input range is [-pi/2, pi/2]: the program factorises x out -- s = x^2 and
# sin(x) = x * p(s), p the degree-4 polynomial in s whose remainder on this
# range is x^11/11! <= 3.3e-6, orders under the output row's NX8 grid step.
# Wider ranges need a range reduction the datapath cannot build (no floor, no
# compare, no data-driven addressing), so the declared range is the widest the
# polynomial covers. The host tiles nothing but numel.
#
# Hardware-clean NX8 (formats = ["dynamic"]): every store is an
# ACTIVATE.QUANTIZE (identity or the prologue's exp2(0) ones row), the
# accumulators are FP32, and no emulator-only instruction appears.
#
# Dataflow, per 128-lane row (18 words):
#
#   s  = x * x      MULT.RC.VS on the cyclic window, identity store.
#   p  = c4         MULT.EE off R0[0] = 1.0 (the ones row is the prologue's own
#                   exp2(0) store, so the host prepares no constant).
#   p  = p s + ck   one Horner step, c4 down to c0: the product is MULT.RC.VV
#                   (s in cyclic slot 1, p in R1), the constant enters as
#                   another MULT_RES (MULT.EE off the ones row; c0 is CR1) and
#                   the row is stored after the add -- the one NX8 round trip
#                   per step. Four steps: c3, c2, c1, then c0 with the store
#                   of p.
#   y  = x * p      MULT.RC.VV of the resident x row (cyclic slot 0, held all
#                   row) by p read back, stored -- sin's odd part.
#
# The coefficients are dyadic roundings of the Taylor terms of sin divided by
# the matching powers of two (the MULT constant's width); reference.py computes
# the same polynomial with the same constants in float64, so the kernel's
# residual against the golden is the row round-trips and the FP32 accumulation,
# measured in output-row steps below.
#
# XMEM: x, y and s are one row per 128 elements plus the ones row and the mask
# row; the intermediate p rows live in y's region (y is written only by the
# last store of each row), so a call takes 3*rows + 2 <= 16384 addressable NX8
# rows, hence the numel maximum of 698880 (5460 rows). There is no FP32
# variant: dynamic is the chip's NX8 type, and FP32 addresses 4096 rows only.

[kernel]
op = "unary"
formats = ["dynamic"]

[params]
fn    = { type = "str", choices = ["sin"], default = "sin" }
numel = { type = "int", min = 1, max = 698880 }   # 5460 rows: 3*rows + 2 XMEM rows
# The program's coefficients: dyadic roundings of sin's Taylor terms
# x^(2k+1)/(2k+1)! without the x factor (p's coefficients, 8-bit mantissas).
c4 = { type = "float", choices = [2.7418136596679688e-06], default = 2.7418136596679688e-06 }  # 1/362880 ~ 23/2^23
c3 = { type = "float", choices = [-0.0001983642578125], default = -0.0001983642578125 }        # -1/5040 ~ -26/2^17
c2 = { type = "float", choices = [0.00830078125], default = 0.00830078125 }                    # 1/120 ~ 17/2^11
c1 = { type = "float", choices = [-0.166015625], default = -0.166015625 }                      # -1/6 ~ -85/2^9

[derived]
rows  = "ceil(numel / 128)"                       # x's, y's and every intermediate's rows
tail  = "numel - 128 * (rows - 1)"                # the last row's live lanes
bound = "max(rows - ceil((128 - tail) / 127) - 1, 0)"  # CR12: the row loop's bound: the last row index that still loops (the straight-line rows are not in it)
slot1 = "128"                                     # CR11: cyclic slot 1, where s lives
qf    = "case_qf"                                 # CR14: the case's QF half
ds    = "halves(ds(128), ds(tail))"               # CR15: full row / last row

[inputs.x]
shape = ["numel"]
range = { nx8 = [-1.5707963705062866, 1.5707963705062866] }  # [-pi/2, pi/2]: s = x^2 <= pi^2/4, the polynomial's range

[outputs.y]
shape = ["numel"]

[scratch.s]
shape = ["rows", 128]                             # x^2

[scratch.one]
shape = [1, 128]                                  # exp2(0): the ones row every constant add broadcasts from

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"                       # LD.MASK: every lane active, whatever a previous kernel left

[abi]
x     = "CR2"
s     = "CR3"
one   = "CR4"
y     = "CR5"
maskr = "CR6"
c4    = "CR7"
c3    = "CR8"
c2    = "CR9"
c1    = "CR10"
slot1 = "CR11"
bound = "CR12"                                    # the row loop's bound: trips - 1
qf    = "CR14"
ds    = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: the golden (reference.py) runs the same polynomial with the same dyadic
# constants and models the kernel's every FP32 product/accumulate and NX8 row
# round trip, so the kernel's residual is the last rounding only.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 2, why = "the golden models the kernel's round trips; what is left is the output store's own quantization against a row scale the accumulation order can move by a step" } }

[cases.default]                                   # facebook/detr-resnet-50, the must-cover call
fn = "sin"
numel = 16384

[cases.sin_524288]                                # facebook/sam-vit-base, the largest call
fn = "sin"
numel = 524288
tier = "nightly"

[cases.one]                                       # the narrowest call: one lane, one row
fn = "sin"
numel = 1

[cases.tile]                                      # exactly one 128-lane row
fn = "sin"
numel = 128

[cases.tail]                                      # one row and a lane
fn = "sin"
numel = 129

[cases.two_rows]                                  # straight-line bodies, no loop
fn = "sin"
numel = 200

[cases.sd]                                        # stable-diffusion-v1-5's call
fn = "sin"
numel = 160

[cases.sweep]                                     # the structure of the calls, scaled down
fn = "sin"
numel = [1, 2, 5, 127, 128, 129, 130, 255, 256, 257, 1000, 4096]
