[kernel]
op = "binary_add_row"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["row"]
default = "row"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 1
max = 2147483647
default = 65536
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 786432
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 12
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 256

[derived]
ic = "ceil(in0_d2 / 128)"
oc = "ceil(out0_d3 / 128)"
plane_rows = "in0_d3 * ic"
planes = "in0_d0 * in0_d1"
tail = "ds((out0_d3 - 1) % 128 + 1)"

[inputs.in0]
shape = ["planes * in0_d3", "ic * 128"]
range = [-2, 2]
[inputs.operand]
shape = ["out0_d2", "oc * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", "oc * 128"]

[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_operand = "CR6"
qf_out0 = "CR7"
ic = "CR8"
plane_rows = "CR9"
planes = "CR10"
in0_d3 = "CR11"
in0_d2 = "CR12"
tail = "CR13"

[cases.default]
