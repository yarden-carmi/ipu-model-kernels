[kernel]
op = "half_grid_box_cascade"
formats = ["e2"]

[params.channels]
type = "int"
min = 1
max = 65535
default = 64
[params.oh]
type = "int"
min = 2
max = 65534
multiple_of = 2
default = 64
[params.ow]
type = "int"
min = 2
max = 64
multiple_of = 2
default = 64
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 32767
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 32
default = 32
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 64
[params.out0_d2]
type = "int"
min = 2
max = 65534
multiple_of = 2
default = 64
[params.out0_d3]
type = "int"
min = 2
max = 64
multiple_of = 2
default = 64

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2 // 2", 128]
[scratch.tile]
shape = [6, 128]

[derived]
width_ds = "ds(in0_d3)"
packed_ds = "ds(2 * out0_d3)"
rows = "out0_d0 * channels * oh // 2"
w9 = "19 * 65536 + 126 * 256 + 2"
w3 = "19 * 65536 + 124 * 256 + 8"
w1 = "19 * 65536 + 123 * 256"
f9 = "126 * 8388608 + 1048576"
f3 = "124 * 8388608 + 4194304"
f1 = "123 * 8388608"
# The trailing reshape mask entries select the low bytes of the pair.
src_lo = "50462976"
src_hi = "117835012"
dst_lo = "2 * src_lo"
dst_hi = "2 * src_hi"

[abi]
in0 = "CR2"
out0 = "CR3"
tile = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
width_ds = "CR7"
packed_ds = "CR8"
w9 = "CR9"
w3 = "CR10"
w1 = "CR11"
f9 = "CR12"
f3 = "CR13"
f1 = "CR14"
rows = "CR15"
src_lo = "LR12"
src_hi = "LR13"
dst_lo = "LR14"
dst_hi = "LR15"

[cases.default]
