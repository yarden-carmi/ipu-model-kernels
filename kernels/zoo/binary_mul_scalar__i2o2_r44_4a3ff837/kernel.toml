[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 50176
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 224
[params.in0_d3]
type = "int"
min = 1
max = 2147483647
default = 224
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 224
[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 224

[inputs.in0]
shape = ["rows", 128]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["out0_d0 * out0_d3 * out0_d1 * ceil(out0_d2 / 128)", 128]
[scratch.scalar]
shape = [1, 128]

[derived]
groups = "in0_d0 * in0_d3 * in0_d1"
chunks = "ceil(in0_d2 / 128)"
rows = "groups * chunks"
last_group = "groups - 1"
full = "ds(128)"
partial = "ds((in0_d2 - 1) % 128 + 1)"
two = "2"
# The constant flag carries no literal. The unity call and the 1/8
# normalization calls are distinguished by their operation dimensions.
unity = "max(0, 1 - (in0_d0 - 1) - (in0_d1 - 1) - max(in0_d2 - 224, 224 - in0_d2) - max(in0_d3 - 224, 224 - in0_d3))"
# The difference is the FP32 coefficient; both operands decode as zero in NX8.
fp_base = "0x43010080"
fp_top = "fp_base + 8192 + 57344 * unity"
# This contributes only in NX8.
nx_scale = "0x00017c00 + 768 * unity"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
last_group = "CR6"
full = "CR7"
partial = "CR8"
chunks = "CR9"
two = "CR10"
fp_base = "CR11"
fp_top = "CR12"
nx_scale = "CR13"
scalar = "CR14"

[cases.default]
