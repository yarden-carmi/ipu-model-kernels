[kernel]
op = "gemm_table"
formats = ["e2"]

[params.act_out0]
type = "str"
choices = ["gelu_tanh"]
default = "gelu_tanh"
[params.bias]
type = "bool"
default = true
[params.m]
type = "int"
min = 1
max = 65535
default = 256
[params.k]
type = "int"
min = 1
max = 4096
default = 768
[params.n]
type = "int"
min = 1
max = 4096
default = 3072
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 768
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 3072

[derived]
MB = "ceil(in0_d1 / 128)"
K = "ceil(k / 128)"
tail_ds = "ds((out0_d1 - 1) % 128 + 1)"
full_ds = "ds(128)"
full_bound = "126"
tail_bound = "(k - 1) % 128 - 1"
batch_rows = "in0_d2 * MB"

[inputs.in0]
shape = ["in0_d0 * batch_rows", 128]
range = [-2, 2]
[inputs.w]
shape = ["n * K", 128]
range = [-1, 1]
[inputs.b]
shape = ["n", 128]
range = [-1, 1]
when = "bias"
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
full_bound = "CR6"
n = "CR7"
MB = "CR8"
K = "CR9"
qf_in0 = "CR10"
qf_out0 = "CR11"
tail_bound = "CR12"
tail_ds = "CR13"
lut = "CR14"
full_ds = "CR15"
in0_d0 = "LR14"
batch_rows = "LR15"

[cases.default]
