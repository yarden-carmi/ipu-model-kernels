[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 16
[params.cout]
type = "int"
min = 1
max = 256
default = 16
[params.groups]
type = "int"
min = 1
max = 128
default = 16
[params.h]
type = "int"
min = 1
max = 128
default = 16
[params.w]
type = "int"
min = 1
max = 224
default = 16
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 224
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 256
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 224
default = 8

[derived]
input_rows = "in0_d0 * in0_d1 * in0_d3"
output_rows = "out0_d0 * out0_d1 * out0_d3"
channel_pitch = "in0_d3 * (2 * stride - 1)"
group_pitch = "channel_pitch * (cin // groups)"
oc_per_group = "cout // groups"
gather_right = "ds(max(1, out0_d2 - in0_d2 % 2))"
tail = "ds(out0_d2)"
weight_rows = "1 + 2 * cout * (cin // groups)"
last_weight = "weight_rows - 1"
last_input = "input_rows - 1"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", 128]
range = [-2, 2]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[scratch.sampled]
shape = ["3 * input_rows", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
sampled = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
gather_right = "CR8"
tail = "CR9"
output_rows = "CR10"
out0_d3 = "CR11"
last_weight = "CR12"
group_pitch = "CR13"
channel_pitch = "CR14"
oc_per_group = "CR15"
last_input = "LR15"

[cases.default]
