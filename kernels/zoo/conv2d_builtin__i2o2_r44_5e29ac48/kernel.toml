[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 16
[params.cout]
type = "int"
min = 1
max = 128
default = 16
[params.groups]
type = "int"
min = 1
max = 128
default = 16
[params.h]
type = "int"
min = 2
max = 128
default = 8
[params.w]
type = "int"
min = 2
max = 224
default = 8
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 16
[params.in0_d2]
type = "int"
min = 2
max = 128
default = 8
[params.in0_d3]
type = "int"
min = 2
max = 224
default = 8
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 224
default = 8

[derived]
full = "ds(out0_d2)"
input_rows = "in0_d0 * in0_d1 * in0_d3"
last_x = "in0_d3 - 1"
scratch_step = "3 * stride"
scratch_plane = "3 * in0_d3"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", 128]
range = [-2, 2]
[inputs.weights]
shape = ["3 * cout", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", 128]
[scratch.column]
shape = ["input_rows * 3", 128]

[abi]
in0 = "CR2"
weights = "CR3"
column = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
input_rows = "CR9"
last_x = "CR10"
in0_d3 = "CR11"
out0_d1 = "CR12"
out0_d3 = "CR13"
scratch_step = "CR14"
scratch_plane = "CR15"
in0_d0 = "LR15"

[cases.default]
