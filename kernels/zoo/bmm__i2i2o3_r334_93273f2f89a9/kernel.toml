[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, default=12}
k = {type="int", min=64, max=64, default=64}
m = {type="int", min=2, multiple_of=2, default=50}
n = {type="int", min=2, max=64, default=50}
in0_d0 = {type="int", min=1, default=1}
in0_d1 = {type="int", min=2, multiple_of=2, default=50}
in0_d2 = {type="int", min=128, multiple_of=128, default=768}
in1_d0 = {type="int", min=1, default=1}
in1_d1 = {type="int", min=2, default=50}
in1_d2 = {type="int", min=128, multiple_of=128, default=768}
out0_d0 = {type="int", min=1, default=1}
out0_d1 = {type="int", min=2, multiple_of=2, default=12}
out0_d2 = {type="int", min=2, multiple_of=2, default=50}
out0_d3 = {type="int", min=2, max=64, default=50}

[derived]
astride = "ceil(in0_d2/128)"
bstride = "ceil(in1_d2/128)"
strides = "astride+65536*bstride"
groups = "out0_d0"
group_a = "in0_d1*astride"
group_b = "in1_d1*bstride"
counts = "m+65536*n"
heads = "out0_d1"
widths = "ds(64)+65536*ds(2*n)"
col_limit = "n-2"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "astride*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "bstride*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2//2", 128]
[scratch.panel]
shape = ["m+n", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
panel = "CR8"
strides = "CR9"
counts = "CR10"
heads = "CR11"
widths = "CR12"
group_a = "CR13"
group_b = "CR14"
col_limit = "CR15"
groups = "LR15"

[cases.default]
