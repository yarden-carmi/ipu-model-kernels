chain = ["conv2d"]
chain_in = ["in0"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [0, 1, 2]
pack = "1 + (2 - stride) * (1 - min(1, max(2 * padding - kh + 1, kh - 1 - 2 * padding))) * (1 - min(1, max(2 * padding - kw + 1, kw - 1 - 2 * padding))) * min(1, 64 // d3) * (1 - d2 % 2)"

[view.in0]
kind = "whole"

[layout.out0]
lanes = 3
rows = [0, 1, 2]
pack = "1 + min(1, 64 // d3) * (1 - d2 % 2)"

[lut.out0]
range_mode = 2
range_exp = 40
