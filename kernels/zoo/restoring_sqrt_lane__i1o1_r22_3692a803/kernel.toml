[kernel]
op = "restoring_sqrt_lane"
formats = ["e1"]

[params.numel]
type = "int"
min = 1
default = 1

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
default = 1

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
default = 1

[inputs.in0]
shape = ["in0_d0 * ceil(in0_d1 / 128)", 128]
range = [0.25, 4.0]

[outputs.out0]
shape = ["out0_d0 * ceil(out0_d1 / 128)", 128]

[scratch.inv_root]
shape = [128]

[derived]
rows = "out0_d0 * ceil(out0_d1 / 128)"
chunks = "ceil(out0_d1 / 128)"
tail_ds = "ds((out0_d1 - 1) % 128 + 1)"

[abi]
in0 = "CR2"
out0 = "CR3"
inv_root = "CR4"
rows = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
chunks = "CR8"
tail_ds = "CR9"

[cases.default]
