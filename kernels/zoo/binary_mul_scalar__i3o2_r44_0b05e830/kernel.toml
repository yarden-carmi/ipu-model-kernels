[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 786432
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 256

[inputs.in0]
shape = ["in0_d0 * in0_d1 * plane_rows", 128]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["output_rows", 128]
[scratch.scalar]
shape = [1, 128]

[derived]
ic = "ceil(in0_d3 / 128)"
oc = "ceil(out0_d2 / 128)"
plane_rows = "in0_d2 * ic"
output_rows = "out0_d0 * out0_d3 * out0_d1 * oc"
last = "(out0_d2 - 1) % 128 + 1"
ds_pair = "ds(last) + ds(128) * 65536"
fp_hi = "0x43012000"
fp_lo = "0x43010000"
nx_scale = "0x00017c00"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
ic = "CR6"
oc = "CR7"
out0_d3 = "CR8"
in0_d1 = "CR9"
plane_rows = "CR10"
ds_pair = "CR11"
scalar = "CR12"
fp_hi = "CR13"
fp_lo = "CR14"
nx_scale = "CR15"
last = "LR15"
output_rows = "LR9"

[cases.default]
