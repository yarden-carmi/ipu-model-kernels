[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 384
[params.m]
type = "int"
min = 1
max = 65536
default = 257
[params.n]
type = "int"
min = 1
max = 65536
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 6
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 384
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 8
[derived]
tiles = "ceil(n / 128)"
full = "ds(128)"
tail = "ds((n - 1) % 128 + 1)"
rows = "out0_d0 * out0_d2"
width = "in0_d3 - 1"
chunks = "ceil(in0_d1 / max(1, 128 // in0_d3))"
last_lane = "in0_d3 - 2 + (1 - min(1, max(m - 257, 257 - m) + max(k - 384, 384 - k)))"
slot = "128"
minusone = "-1"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * chunks", 128]
[inputs.w]
shape = ["tiles * (k + 1) * 2 + 1", 128]
[outputs.out0]
shape = ["rows * out0_d3 * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
last_lane = "CR10"
rows = "CR11"
k = "CR12"
width = "CR13"
chunks = "CR14"

[golden]
tolerance = {e2 = "NX8_STEP", e3 = "NX8_STEP"}

[cases.default]
