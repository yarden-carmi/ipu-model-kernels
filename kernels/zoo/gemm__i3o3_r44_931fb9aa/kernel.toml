[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 128
default = 72
[params.m]
type = "int"
min = 1
max = 65536
default = 784
[params.n]
type = "int"
min = 1
max = 65536
default = 24
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 72
[params.in0_d2]
type = "int"
min = 2
max = 65536
multiple_of = 2
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 64
default = 28
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 24
[params.out0_d2]
type = "int"
min = 2
max = 65536
multiple_of = 2
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 64
default = 28

[derived]
groups = "ceil(in0_d2 / 2)"
batch_stride = "in0_d1 * groups"
valid = "ds(out0_d3 * 2)"
full = "ds(128)"
slot = "128"
last = "k - 2"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * groups", 128]
[inputs.w]
shape = ["n * 3", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / 2)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
groups = "CR7"
batch_stride = "CR8"
valid = "CR9"
full = "CR10"
k = "CR11"
n = "CR12"
in0_d0 = "CR13"
slot = "CR14"
last = "CR15"

[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}
[cases.default]
