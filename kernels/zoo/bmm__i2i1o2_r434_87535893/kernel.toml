[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=2147483647, default=6}
k = {type="int", min=1, max=32767, default=257}
m = {type="int", min=1, max=32767, default=257}
n = {type="int", min=1, max=32767, default=64}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=32767, default=6}
in0_d2 = {type="int", min=1, max=32767, default=257}
in0_d3 = {type="int", min=1, max=32767, default=257}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=32767, default=257}
in1_d2 = {type="int", min=1, max=2147483647, default=384}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=6}
out0_d2 = {type="int", min=1, max=32767, default=257}
out0_d3 = {type="int", min=1, max=32767, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d3", "in0_d1", "a_tiles*128"]
range = [0, 0.02]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "b_tiles*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]

[derived]
a_tiles = "ceil(in0_d2/128)"
b_tiles = "ceil(in1_d1/128)"
a_step = "in0_d1*a_tiles"
widths = "ds(128)+65536*ds((m-1)%128+1)"
tiles_heads = "ceil(m/128)+65536*out0_d1"
a_gap = "min(1,in0_d0-1)*in0_d3*a_step-out0_d1*a_tiles"
b_gap = "(min(1,in1_d0-1)*in1_d2-out0_d1*n)*b_tiles"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
a_step = "CR8"
b_tiles = "CR9"
widths = "CR10"
k = "CR11"
n = "CR12"
tiles_heads = "CR13"
a_gap = "CR14"
b_gap = "CR15"
out0_d0 = "LR4"
a_tiles = "LR15"

[cases.default]
