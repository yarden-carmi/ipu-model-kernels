[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.k]
type = "int"
min = 1
max = 4096
default = 24
[params.n]
type = "int"
min = 1
max = 4096
default = 88
[params.m]
type = "int"
min = 1
max = 65536
default = 784
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 24
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 28
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 88
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 28

[derived]
blocks = "ceil(n / 128)"
last = "blocks - 1"
full_ds = "ds(128)"
tail_ds = "ds(n - 128 * last)"
chunks = "ceil(in0_d1 / 128)"
in_rows = "in0_d0 * in0_d2 * in0_d3 * chunks"
full_chunks = "ceil(k / 128) - 1"
split = "min(1, m - 1) * max(0, 1 - (chunks - 1)) * max(0, 1 - (blocks - 1))"
coeff_parts = "1 + split"
full_stop = "125 * (1 - split) + (k - 2) * split"
tail_stop = "((k - 1) % 128 - 2) * (1 - split) + (in_rows - 1) * split"

[inputs.in0]
shape = ["in_rows", 128]
[inputs.coeff]
shape = ["blocks * coeff_parts * (k + 1)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
k = "CR7"
chunks = "CR8"
in_rows = "CR9"
full_chunks = "CR10"
last = "CR11"
full_ds = "CR12"
tail_ds = "CR13"
full_stop = "CR14"
tail_stop = "CR15"

[cases.default]
