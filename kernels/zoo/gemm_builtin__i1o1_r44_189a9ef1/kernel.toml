[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.k]
type = "int"
min = 1
max = 4096
default = 24
[params.n]
type = "int"
min = 1
max = 4096
default = 88
[params.m]
type = "int"
min = 1
max = 65536
default = 784
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 24
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 28
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 88
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 28

[derived]
blocks = "ceil(n / 128)"
last = "blocks - 1"
full_ds = "ds(128)"
tail_ds = "ds(n - 128 * last)"
chunks = "ceil(in0_d1 / 128)"
in_rows = "in0_d0 * in0_d2 * in0_d3 * chunks"
split = "k"
coeff_rows = "blocks * (k + 1 + split)"

[inputs.in0]
shape = ["in_rows", 128]
[inputs.coeff]
shape = ["coeff_rows", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
k = "CR7"
chunks = "CR8"
in_rows = "CR9"
last = "CR11"
full_ds = "CR12"
tail_ds = "CR13"

[cases.default]
