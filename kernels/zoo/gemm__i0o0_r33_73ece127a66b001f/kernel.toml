[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params]
bias = {type = "bool", default = true}
k = {type = "int", min = 1, max = 65536, default = 192}
m = {type = "int", min = 1, max = 65536, default = 256}
n = {type = "int", min = 1, max = 65536, default = 576}
in0_d0 = {type = "int", min = 1, max = 65536, default = 4}
in0_d1 = {type = "int", min = 1, max = 65536, default = 64}
in0_d2 = {type = "int", min = 1, max = 65536, default = 192}
out0_d0 = {type = "int", min = 1, max = 65536, default = 4}
out0_d1 = {type = "int", min = 1, max = 65536, default = 64}
out0_d2 = {type = "int", min = 1, max = 65536, default = 576}

[derived]
width = "ceil(m / 128)"
chunks = "(k - k % 128) / 128"
full = "ds(128)"
tail = "ds((m - 1) % 128 + 1)"
last_full = "125"
last_tail = "(k - 1) % 128 - 2"
minusone = "-1"

[inputs.in0]
shape = ["in0_d2", "ceil(in0_d0 * in0_d1 / 128) * 128"]
[inputs.w]
shape = ["n * (1 + ceil(k / 128))", 128]
[outputs.out0]
shape = ["out0_d2", "ceil(out0_d0 * out0_d1 / 128) * 128"]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
n = "CR7"
full = "CR8"
tail = "CR9"
width = "CR10"
chunks = "CR11"
last_full = "CR12"
last_tail = "CR13"
minusone = "CR14"

[golden]
tolerance = {e2 = "NX8_STEP", e3 = "NX8_STEP"}

[cases.default]
