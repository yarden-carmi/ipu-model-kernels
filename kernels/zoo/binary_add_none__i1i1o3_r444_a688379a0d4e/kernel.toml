[kernel]
op = "binary_add"
formats = ["e1", "e2", "e3"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 18816
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 24
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 16384
default = 28
[params.in1_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 24
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 28
[params.in1_d3]
type = "int"
min = 1
max = 16384
default = 28
[params.out0_d0]
type = "int"
