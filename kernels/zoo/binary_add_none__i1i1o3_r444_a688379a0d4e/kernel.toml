min = 1
max = 16384
default = 28

[derived]
channel_chunks = "ceil(in0_d1 / 128)"
batch_stride = "in0_d2 * in0_d3 * channel_chunks"
scalar_ds = "ds(1)"
full_ds = "ds(128)"
tail_ds = "ds((out0_d3 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0 * batch_stride", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d2 * in1_d3 * ceil(in1_d1 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2 * ceil(out0_d3 / 128)", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
out0_d0 = "CR8"
out0_d1 = "CR9"
out0_d2 = "CR10"
out0_d3 = "CR11"
scalar_ds = "CR12"
full_ds = "CR13"
tail_ds = "CR14"
channel_chunks = "LR12"
batch_stride = "LR13"

[cases.default]
