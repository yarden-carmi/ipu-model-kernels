[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 256
[params.m]
type = "int"
min = 1
default = 1024
[params.n]
type = "int"
min = 1
default = 96
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.in0_d2]
type = "int"
min = 1
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 32
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 96
[params.out0_d2]
type = "int"
min = 1
default = 32
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 32

[derived]
chunks = "ceil(k / 128)"
input_chunks = "ceil(in0_d1 / 128)"
scanlines = "out0_d0 * out0_d2"
full = "ds(128)"
width_ds = "ds(out0_d3)"
weight_stride = "2 * chunks + 2"
input_stride = "out0_d3 * input_chunks"
penultimate = "max(0, out0_d3 - 2)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * input_chunks", 128]
range = [-2, 2]
[inputs.w]
shape = ["n * weight_stride", 128]
range = [-1, 1]
when = "bias"
[inputs.w_unbiased]
shape = ["n * 2 * chunks", 128]
range = [-1, 1]
when = "not bias"
[outputs.out0]
shape = ["scanlines * out0_d1", 128]

[abi]
in0 = "CR2"
w = "CR3"
w_unbiased = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
width_ds = "CR8"
chunks = "CR9"
input_chunks = "CR10"
scanlines = "CR11"
n = "CR12"
penultimate = "CR13"
input_stride = "CR14"

[cases.default]
