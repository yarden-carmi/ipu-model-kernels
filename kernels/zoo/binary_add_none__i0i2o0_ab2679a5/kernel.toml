[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 147456
[params.in0_d0]
type = "int"
choices = [1, 4]
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in0_d2]
type = "int"
min = 4
max = 16384
multiple_of = 4
default = 144
[params.in1_d0]
type = "int"
choices = [1, 4]
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in1_d2]
type = "int"
min = 4
max = 16384
multiple_of = 4
default = 144
[params.out0_d0]
type = "int"
choices = [1, 4]
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.out0_d2]
type = "int"
min = 4
max = 16384
multiple_of = 4
default = 144
[derived]
in0_rows = "in0_d1 * in0_d2"
chunks = "ceil(in1_d2 / 128)"
plane1 = "in1_d1 * chunks"
view_step = "out0_d0 * out0_d1"
ds1 = "ds(1)"
active = "ds(out0_d0)"

[inputs.in0]
shape = ["in0_rows", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * plane1", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d1 * out0_d2", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
ds1 = "CR8"
active = "CR9"
in0_rows = "CR10"
plane1 = "CR11"
view_step = "CR12"
out0_d1 = "CR13"

[cases.default]
