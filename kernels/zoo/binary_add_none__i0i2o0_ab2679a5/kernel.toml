[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 16777216
default = 49152
[params.in0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 192
[params.in1_d0]
type = "int"
min = 1
max = 4
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 192
[params.out0_d0]
type = "int"
min = 1
max = 4
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 192

[derived]
one = "ds(1)"
active = "ds(out0_d0)"
plane = "in0_d1 * in0_d2"
gap = "(out0_d1 - 1) * out0_d0"
channel_rows = "in1_d1 * ceil(in1_d2 / 128)"

[inputs.in0]
shape = ["plane", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * channel_rows", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d1 * out0_d2", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
one = "CR8"
active = "CR9"
plane = "CR10"
gap = "CR11"
out0_d0 = "CR12"
out0_d1 = "CR13"
out0_d2 = "CR14"
channel_rows = "CR15"

[cases.default]
