[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 1
max = 2147483647
default = 4096

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
default = 64

[params.in0_d2]
type = "int"
min = 1
default = 8

[params.in0_d3]
type = "int"
min = 1
max = 128
default = 8

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
default = 64

[params.out0_d2]
type = "int"
min = 1
default = 8

[params.out0_d3]
type = "int"
min = 1
max = 128
default = 8

[derived]
batch_stride = "in0_d1 * in0_d2"
last_height = "in0_d2 - 1"
active_in = "ds(in0_d3)"
active_out = "ds(out0_d3)"

[inputs.in0]
shape = ["in0_d0 * batch_stride", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["out0_d1 * out0_d0 * out0_d2", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
active_in = "CR6"
active_out = "CR7"
in0_d0 = "CR8"
in0_d1 = "CR9"
batch_stride = "CR10"
last_height = "CR11"

[cases.default]
