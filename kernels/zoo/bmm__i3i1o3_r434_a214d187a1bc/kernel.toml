[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=2147483647, default=6}
k = {type="int", min=1, max=65535, default=1829}
m = {type="int", min=1, max=65535, default=1829}
n = {type="int", min=1, max=65535, default=64}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=6}
in0_d2 = {type="int", min=1, max=65535, default=1829}
in0_d3 = {type="int", min=1, max=65535, default=1829}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=65535, default=1829}
in1_d2 = {type="int", min=1, max=2147483647, default=384}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=6}
out0_d2 = {type="int", min=1, max=65535, default=1829}
out0_d3 = {type="int", min=1, max=65535, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "a_stride*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "b_stride*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[scratch.panel]
shape = [257,128]

[derived]
a_stride = "ceil(in0_d3/128)"
b_stride = "ceil(in1_d1/128)"
strides = "a_stride+65536*b_stride"
k_widths = "ds(128)+65536*ds((k-1)%128+1)"
widths = "k+65536*ds((n-1)%128+1)"
n_limits = "(n-2)%65536+65536*ds(1)"
rows_heads = "m+65536*out0_d1"
a_gap = "(min(1,in0_d0-1)*in0_d1*in0_d2-out0_d1*m)*a_stride"
b_gap = "(min(1,in1_d0-1)*in1_d2-out0_d1*n)*b_stride"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
strides = "CR8"
k_widths = "CR9"
widths = "CR10"
rows_heads = "CR11"
n_limits = "CR12"
a_gap = "CR13"
b_gap = "CR14"
panel = "CR15"
out0_d0 = "LR3"

[cases.default]
