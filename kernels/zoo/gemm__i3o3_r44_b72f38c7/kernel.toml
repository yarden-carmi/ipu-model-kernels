[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 2147483647
default = 256
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d2]
type = "int"
min = 1
default = 16
[params.in0_d3]
type = "int"
min = 1
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
default = 16
[params.out0_d3]
type = "int"
min = 1
default = 16
[derived]
spatial = "in0_d2 * in0_d3"
small = "1 - min(1, max(spatial - 64, 64 - spatial) + k % 2 + in0_d0 - 1)"
ic = "min(in0_d2, max(1, 128 // in0_d3))"
oc = "min(out0_d2, max(1, 128 // out0_d3))"
ip = "1 + (ic - 1) * (1 - min(1, in0_d2 % ic)) - (1 - min(1, max(in0_d3 - 32, 32 - in0_d3) + in0_d2 % 4 + max(0, k - 96)))"
op = "1 + (oc - 1) * (1 - min(1, out0_d2 % oc)) - (1 - min(1, max(out0_d3 - 32, 32 - out0_d3) + out0_d2 % 4 + max(0, k - 96)))"
pitch = "ceil(in0_d2 / ip) * ceil(ip * in0_d3 / 128)"
batch_pitch = "k * pitch"
batch = "in0_d0"
active = "ds(small * ((k - 1) % 128 + 1) + (1 - small) * min(128, ip * in0_d3))"
half_or_width = "small * ds(64) + (1 - small) * ceil(in0_d3 / 128)"
spatial_tail = "ds(((in0_d2 - 1) % ip + 1) * in0_d3 - 128 * ((in0_d3 - 1) // 128))"
full = "ds(128)"
lanes128 = "128"
chunks = "ceil(k / 128)"
chunk_or_tail = "small * chunks + (1 - small) * spatial_tail"
pairs = "k // 2"
blocks_before_tail = "(k - 1) // 32"
weight_rows = "n * (small * (3 + chunks) + (1 - small) * (4 + 2 * blocks_before_tail))"
packed_start = "64 * chunks"
pair_src = "1073741824"
pair_dst = "16777216"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * pitch", 128]
range = [-2, 2]
[inputs.w]
shape = ["weight_rows", 128]
range = [-1, 1]
when = "bias"
[inputs.w_unbiased]
shape = ["weight_rows", 128]
range = [-1, 1]
when = "not bias"
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / op) * ceil(op * out0_d3 / 128)", 128]
[scratch.panel]
shape = ["small * (packed_start + pairs) + 1", 128]

[abi]
in0 = "CR2"
w = "CR3"
w_unbiased = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
chunk_or_tail = "CR7"
n = "CR8"
full = "CR9"
blocks_before_tail = "CR10"
batch = "LR12"
lanes128 = "CR12"
active = "CR13"
panel = "CR14"
half_or_width = "CR15"
pitch = "LR4"
packed_start = "LR5"
pair_src = "LR6"
pair_dst = "LR14"
batch_pitch = "CR11"
pairs = "LR7"

[cases.default]
