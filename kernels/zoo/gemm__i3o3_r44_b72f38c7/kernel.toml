[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 2147483647
default = 256
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d2]
type = "int"
min = 1
default = 16
[params.in0_d3]
type = "int"
min = 1
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
default = 16
[params.out0_d3]
type = "int"
min = 1
default = 16
[derived]
spatial = "in0_d2 * in0_d3"
small = "1 - min(1, max(spatial - 64, 64 - spatial) + k % 2 + 128 % in0_d3 + in0_d0 - 1)"
ic = "min(in0_d2, max(1, 128 // in0_d3))"
oc = "min(out0_d2, max(1, 128 // out0_d3))"
pack3 = "1 - min(1, max(in0_d3 - 32, 32 - in0_d3) + in0_d2 % 4 + max(0, k - 96))"
ip = "1 + (ic - 1) * (1 - min(1, in0_d2 % ic)) - pack3"
op = "1 + (oc - 1) * (1 - min(1, out0_d2 % oc)) - pack3"
pitch = "ceil(in0_d2 / ip) * ceil(ip * in0_d3 / 128)"
out_pitch = "ceil(out0_d2 / op) * ceil(op * out0_d3 / 128)"
full = "ds(128)"
active = "ds(min(128, ip * in0_d3))"
scalar127 = "127 * (1 - small) + small * (k // 4)"
chunks = "ceil(k / 128)"
single_bias = "(1 - small) * (1 - min(1, max(0,k-64) + k % 32 + max(0,in0_d3-128) + pack3))"
weight_rows = "n * (small * (3 + chunks) + (1 - small) * (2 + 2 * ceil(k / 32)) - single_bias)"
packed_start = "64 * chunks"
pair_src = "1073741824 * min(1, k % 4) + 1614815232 * (1 - min(1, k % 4))"
pair_dst = "16777216 * min(1, k % 4) + 50462976 * (1 - min(1, k % 4))"
batch_stride = "k * pitch"
half = "ds(64)"
dot_tail = "ds(small * ((k - 1) % 128 + 1) + (1 - small) * ((in0_d3 - 1) % 128 + 1 + pack3 * 32 * max(0, in0_d2 % 3 - 1)))"
pairs = "k // 2"
loop_count = "small * chunks + (1 - small) * ((k - 1) // 32)"
width_rows = "(1 - small) * ceil(in0_d3 / 128) + small * (packed_start + k // 2)"
batches = "in0_d0"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * pitch", 128]
range = [-2, 2]
[inputs.w]
shape = ["weight_rows", 128]
range = [-1, 1]
when = "bias"
[inputs.w_unbiased]
shape = ["weight_rows + n * single_bias - n * small - 2 * n * (1 - small) * min(1, k % 32 + max(0, in0_d3 - 128) + pack3)", 128]
range = [-1, 1]
when = "not bias"
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out_pitch", 128]
[scratch.panel]
shape = ["1 + small * (packed_start + k)", 128]

[abi]
in0 = "CR2"
w = "CR3"
w_unbiased = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
loop_count = "CR7"
n = "CR8"
full = "CR9"
dot_tail = "CR11"
scalar127 = "CR12"
active = "CR13"
panel = "CR14"
half = "CR15"
pitch = "LR4"
packed_start = "LR5"
pair_src = "LR6"
pair_dst = "LR14"
batch_stride = "LR15"
pairs = "LR7"
width_rows = "CR10"
batches = "LR12"

[cases.default]
