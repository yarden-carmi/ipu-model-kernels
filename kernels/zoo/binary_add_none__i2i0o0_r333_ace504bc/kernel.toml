[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 262144
[params.in0_d0]
type = "int"
min = 1
max = 128
default = 2
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 512
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 256
[params.in1_d0]
type = "int"
min = 1
max = 128
default = 2
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 512
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 256
[params.out0_d0]
type = "int"
min = 1
max = 128
default = 2
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 512
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 256

[derived]
blocks = "ceil(out0_d1 / (128 // out0_d0))"
input_stride = "ceil(in0_d2 / 128)"
batch_stride = "in0_d1 * input_stride"
last_count = "out0_d1 - (blocks - 1) * (128 // out0_d0)"
tail = "ds(last_count * out0_d0)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2 / 128) * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d2", "ceil(in1_d1 / (128 // in1_d0)) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d2", "blocks * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
input_stride = "CR8"
batch_stride = "CR9"
blocks = "CR10"
tail = "CR11"
out0_d2 = "CR12"
last_count = "CR13"

[cases.default]
