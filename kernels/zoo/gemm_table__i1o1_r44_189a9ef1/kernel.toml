[kernel]
op = "gemm_table"
formats = ["e1"]

[params.act_out0]
type = "str"
choices = ["hardsigmoid"]
default = "hardsigmoid"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 8
[params.n]
type = "int"
min = 1
max = 4096
default = 16
[params.m]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 8
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 1

[derived]
ic = "ceil(in0_d1 / 128)"
oc = "ceil(out0_d1 / 128)"
full_chunks = "ic - 1"
full_blocks = "oc - 1"
tail = "in0_d1 - 128 * full_chunks"
valid = "ds(128)"
lastv = "ds(out0_d1 - 128 * full_blocks)"
rows = "in0_d0 * in0_d2 * in0_d3"

[inputs.in0]
shape = ["rows * ic", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["2 * oc * (k + 1)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * oc", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
rows = "CR7"
ic = "CR8"
full_chunks = "CR9"
full_blocks = "CR10"
tail = "CR11"
lut = "CR12"
valid = "CR13"
lastv = "CR14"

[cases.default]
