[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 32
[params.n]
type = "int"
min = 1
max = 4096
default = 128
[params.m]
type = "int"
min = 1
max = 65535
default = 64
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 32
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 128
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 8

[derived]
chunks = "ceil(k / 128)"
blocks = "ceil(n / 128)"
tail = "1 + (n - 1) % 128"
preceding = "(k - 1) // 128"
spatial = "min(1, m - 1)"
ktail = "1 + (k - 1) % 128"
large = "min(1, k // 128)"
correction = "4 * (ktail // 32 * (1 - large) + large * min(1, ktail // 4))"
before_last = "max(0, 8 * ((ktail - correction - 1) // 8) - 1)"
minus_one = "-1"
input_rows = "m * chunks"
coeff_rows = "blocks * ((1 + k) * (1 + spatial) - ((k // 4) - ((ktail // 4) - (max(0, ktail - correction) // 4))) * spatial)"
full_ds = "ds(128)"
tail_ds = "ds(tail)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["m * blocks", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full_ds = "CR8"
tail_ds = "CR9"
preceding = "CR10"
input_rows = "CR11"
chunks = "CR12"
blocks = "CR13"
before_last = "CR14"
minus_one = "CR15"

[cases.default]
