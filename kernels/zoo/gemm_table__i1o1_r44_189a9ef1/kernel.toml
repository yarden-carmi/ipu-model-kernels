[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 160
[params.m]
type = "int"
min = 1
max = 65535
default = 64
[params.n]
type = "int"
min = 1
max = 4096
default = 640
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 160
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 640
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 8

[derived]
chunks = "(k + 127) // 128"
blocks = "(n + 127) // 128"
input_rows = "m * chunks"
coeff_period = "2"
shared = "min(1, max(0, k - 16)) * (1 - min(1, k // 128))"
span = "3"
medium = "1 - min(1, k // 33)"
corrections = "(1 - medium) * (5 * (k // 16) + (k % 16) // 3) + medium * (8 * (k // 16) + k % 16 - 2 * (min(12, k % 16) // 3))"
coeff_rows = "blocks * (2 + k + shared * corrections + (1 - shared) * (k - (k + coeff_period - 1 - min(1, k // 129)) // coeff_period))"
scalar_base = "128 - span"
last_input = "input_rows - 1"
sum_ds = "ds(127)"
full_ds = "ds(128)"
tail_ds = "ds(1 + (n - 1) % 128)"
tail_groups = "((k - 1) % 128) // 32"
preceding = "chunks - 1"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["m * blocks", 128]
[scratch.sums]
shape = ["shared * input_rows + 1 - shared", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
chunks = "CR8"
blocks = "CR9"
input_rows = "CR10"
full_ds = "CR11"
tail_ds = "CR12"
tail_groups = "CR13"
preceding = "LR13"
sums = "CR14"
sum_ds = "CR15"
scalar_base = "LR12"
last_input = "LR14"

[cases.default]
