[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 256
default = 128
[params.m]
type = "int"
min = 1
max = 65535
default = 256
[params.n]
type = "int"
min = 1
max = 65535
default = 512
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 128
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 512
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 16

[derived]
blocks = "ceil(n / 128)"
block_count = "(k - 1) // 16"
split = "11 + min(1, max(0, k - 16)) - min(1, max(0, k - 96)) - min(1, max(0, k - 128))"
tail = "k - 16 * block_count"
coeff_rows = "2 + k + block_count * split + min(tail, split)"
active = "ds(min(n, 128))"

[inputs.in0]
shape = ["m * ceil(k / 128)", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["blocks * coeff_rows + 1", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["m * blocks", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
m = "CR8"
blocks = "CR9"
block_count = "CR10"
active = "CR12"

[cases.default]
