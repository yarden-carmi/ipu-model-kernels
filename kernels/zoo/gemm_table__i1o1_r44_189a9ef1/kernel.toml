[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 16
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 65536
default = 16384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 128

[derived]
blocks = "(n + 127) // 128"
chunks = "(k + 127) // 128"
preceding = "chunks - 1"
last_pixel = "(m - 1) * chunks"
splits = "9 + 15 * min(1, k // 17) - 2 * min(1, k // 65) - 6 * min(1, k // 129)"
shared = "1 - min(1, min(max(k - 64, 64 - k), max(k - 96, 96 - k)))"
coeff_rows = "blocks * (2 + k + shared * (k // 2) + (1 - shared) * ((k // 32) * splits + min(k % 32, splits)))"
sum_ds = "ds(max(1, min(k - 1, 127)))"
full = "ds(128)"
tail = "ds(1 + (n - 1) % 128)"

[inputs.in0]
shape = ["m * chunks", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["m * blocks", 128]

[scratch.sums]
shape = ["1 + shared * (m - 1)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
chunks = "CR8"
last_pixel = "CR9"
preceding = "CR10"
sums = "CR11"
full = "CR12"
tail = "CR13"
blocks = "CR14"
sum_ds = "CR15"

[cases.default]
