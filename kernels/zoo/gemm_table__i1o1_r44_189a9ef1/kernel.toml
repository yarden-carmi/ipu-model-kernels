[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65535
default = 16
[params.m]
type = "int"
min = 1
max = 65535
default = 16384
[params.n]
type = "int"
min = 1
max = 65535
default = 64
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 128

[derived]
chunks = "ceil(k / 128)"
input_rows = "in0_d0 * in0_d2 * in0_d3 * chunks"
preceding = "(k - 1) // 128"
group_limit = "max(0, 8 * (((k - 1) % 128) // 8) - 1)"
blocks = "ceil(n / 128)"
full_ds = "ds(128)"
tail_ds = "ds(n - 128 * (blocks - 1))"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["blocks * 2 * (k + 1)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
preceding = "CR8"
chunks = "CR9"
group_limit = "CR10"
input_rows = "CR11"
full_ds = "CR12"
tail_ds = "CR13"
blocks = "CR14"

[cases.default]
