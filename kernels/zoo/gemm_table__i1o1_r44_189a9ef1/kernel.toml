[kernel]
op = "gemm_table"
formats = ["e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 256
default = 16
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 65535
default = 16384
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 256
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 128

[derived]
k_last = "k - 2"
input_rows = "ceil(k / 128)"
m_last = "m - 1"
blocks = "ceil(n / 128)"
last = "blocks - 1"
full_ds = "ds(128)"
tail_ds = "ds(n - 128 * last)"

[inputs.in0]
shape = ["m * input_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["blocks * 2 * (k + 1)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["m * blocks", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
k_last = "CR8"
m_last = "CR9"
input_rows = "CR10"
last = "CR11"
full_ds = "CR12"
tail_ds = "CR13"

[cases.default]
