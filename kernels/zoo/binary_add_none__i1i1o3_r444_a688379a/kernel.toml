[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
numel = { type = "int", min = 1, default = 16384 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, max = 128, default = 64 }
in0_d2 = { type = "int", min = 1, default = 16 }
in0_d3 = { type = "int", min = 1, max = 128, default = 16 }
in1_d0 = { type = "int", min = 1, default = 1 }
in1_d1 = { type = "int", min = 1, max = 128, default = 64 }
in1_d2 = { type = "int", min = 1, default = 16 }
in1_d3 = { type = "int", min = 1, max = 128, default = 16 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, max = 128, default = 64 }
out0_d2 = { type = "int", min = 1, default = 16 }
out0_d3 = { type = "int", min = 1, max = 128, default = 16 }

[derived]
spatial = "out0_d2 * out0_d3"
output_rows = "out0_d0 * out0_d1 * out0_d2"
ds_pair = "ds(1) + 65536 * ds(out0_d3)"
last_x = "out0_d3 - 1"
last_channel = "out0_d1 - 1"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d2 * in1_d3", 128]
range = [-2, 2]
[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
spatial = "CR8"
last_channel = "CR9"
last_x = "CR10"
output_rows = "CR11"
ds_pair = "CR12"

[cases.default]
