[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.k]
type = "int"
min = 1
max = 4096
default = 24
[params.n]
type = "int"
min = 1
max = 4096
default = 88
[params.m]
type = "int"
min = 1
max = 65536
default = 784
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 24
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 28
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 88
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 28

[derived]
full_ds = "ds(128)"
width_ds = "ds(out0_d2)"
in_pack = "min(4, -ceil(-128 / in0_d2))"
input_groups = "ceil(in0_d1 / in_pack)"
in_rows = "in0_d0 * in0_d3 * input_groups"
out_rows = "out0_d0 * out0_d1 * out0_d3"
coeff_rows = "n * (2 + 3 * k)"

[inputs.in0]
shape = ["in_rows", 128]
[inputs.coeff]
shape = ["coeff_rows", 128]
[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
k = "CR7"
n = "CR8"
in0_d3 = "CR9"
full_ds = "CR10"
width_ds = "CR11"
input_groups = "CR12"

[cases.default]
