[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["scalar"], default = "scalar" }
const = { type = "int", min = 1, max = 1, default = 1 }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["mul"], default = "mul" }
numel = { type = "int", min = 1, max = 2147483647, default = 30000 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 12 }
in0_d2 = { type = "int", min = 2, multiple_of = 2, default = 50 }
in0_d3 = { type = "int", min = 1, max = 64, default = 50 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 12 }
out0_d2 = { type = "int", min = 2, multiple_of = 2, default = 50 }
out0_d3 = { type = "int", min = 1, max = 64, default = 50 }

[derived]
chunks = "ceil(in0_d2 / 128)"
plane_rows = "in0_d3 * chunks"
input_rows = "in0_d0 * in0_d1 * plane_rows"
pairs = "out0_d2 // 2"
ds_pair = "ds(2 * out0_d3) + 65536 * ds(128)"
dst_pair = "out0_d3 * 16777216"
src_pair = "16777216"
fp_lo = "0x43010080"
fp_hi = "fp_lo + 8192"
nx_scale = "0x00017c00"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out0_d0 * out0_d1 * pairs", 128]

[scratch.scalar]
shape = [1, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
scalar = "CR6"
ds_pair = "CR7"
fp_lo = "CR8"
fp_hi = "CR9"
nx_scale = "CR10"
chunks = "CR11"
plane_rows = "CR12"
pairs = "CR13"
dst_pair = "CR14"
src_pair = "CR15"
input_rows = "LR15"
out0_d3 = "LR14"

[cases.default]
