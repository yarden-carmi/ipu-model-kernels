[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["hardswish"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 144
[params.cout]
type = "int"
min = 1
max = 640
default = 144
[params.groups]
type = "int"
min = 1
max = 640
default = 144
[params.h]
type = "int"
min = 1
max = 256
default = 14
[params.w]
type = "int"
min = 1
max = 256
default = 14
[params.kh]
type = "int"
min = 1
max = 5
default = 5
[params.kw]
type = "int"
min = 1
max = 5
default = 5
[params.padding]
type = "int"
min = 0
max = 2
default = 2
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 144
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 14
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 144
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 260
default = 14

[derived]
iy = "ceil(in0_d2 / 128)"
plane = "(in0_d3 + 2 * padding) * kh"
group_plane = "plane * (cin // groups)"
weights_end = "cout * (3 + 3 * (cin // groups)) - 1"
ds128 = "ds(128)"
ds_in = "ds(1 + (in0_d2 - 1) % 128)"
ds_out = "ds(out0_d2)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "iy", 128]
range = [-2, 2]
[inputs.weights]
shape = ["weights_end + 1", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.shifted]
shape = ["1 + cin * plane", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
shifted = "CR6"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
ds_in = "CR12"
ds_out = "CR13"
plane = "CR14"
weights_end = "CR15"
group_plane = "LR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
