[kernel]
op = "conv2d_table"
formats = ["e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 16
[params.cout]
type = "int"
min = 1
max = 512
default = 16
[params.groups]
type = "int"
min = 1
max = 512
default = 1
[params.h]
type = "int"
min = 3
max = 256
default = 8
[params.w]
type = "int"
min = 3
max = 256
default = 8
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 16
[params.in0_d2]
type = "int"
min = 3
max = 256
default = 8
[params.in0_d3]
type = "int"
min = 3
max = 256
default = 8
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 512
default = 16
[params.out0_d2]
type = "int"
min = 2
max = 256
default = 8
[params.out0_d3]
type = "int"
min = 2
max = 256
default = 8

[derived]
iy = "ceil(in0_d2 / 128)"
oy = "ceil(out0_d2 / 128)"
full = "ds(128)"
tail = "ds(1 + (out0_d2 - 1) % 128)"
ic = "cin // groups"
iplane = "in0_d3 * iy"
spatial = "out0_d3 * oy"
group_rows = "9 * ic * spatial"
wrows = "2 + cout * (3 + 3 * ic)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "iy", 128]
range = [-2, 2]
[inputs.weights]
shape = ["wrows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "oy", 128]
[scratch.pad]
shape = ["1 + 9 * cin * spatial", 128]

[abi]
in0 = "CR2"
pad = "CR3"
weights = "CR4"
lut = "CR5"
out0 = "CR6"
qf_in0 = "CR7"
full = "CR8"
tail = "CR9"
qf_out0 = "CR10"
ic = "CR11"
iplane = "CR12"
spatial = "CR13"
group_rows = "CR14"
groups = "CR15"

[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
