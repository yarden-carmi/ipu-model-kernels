[kernel]
op = "binary_mul_scalar"
formats = ["e3"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"

[params.op]
type = "str"
choices = ["mul"]
default = "mul"

[params.const]
type = "float"
min = -64
max = 64
default = 1

[params.inner]
type = "int"
min = 0
max = 0
default = 0

[params.numel]
type = "int"
min = 1
max = 65536
default = 160

[inputs.in0]
shape = ["ceil(numel / 128)", 128]
range = [-4, 4]

[outputs.out0]
shape = ["ceil(numel / 128)", 128]

[derived]
rows = "ceil(numel / 128)"
qf = "case_qf"
ds_full = "ds(128)"

[abi]
in0 = "CR2"
out0 = "CR3"
const = "CR4"
rows = "CR5"
qf = "CR14"
ds_full = "CR15"

[cases.default]
broadcast = "scalar"
op = "mul"
const = 1
inner = 0
numel = 160

[golden]
tolerance = { e3 = "NX8_STEP" }
