[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.m]
type = "int"
min = 1
max = 65536
default = 257
[params.k]
type = "int"
min = 1
max = 16384
default = 1536
[params.n]
type = "int"
min = 1
max = 16384
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 1536
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 384

[derived]
token_tiles = "ceil(out0_d1 / 128)"
channels = "out0_d2"
batches = "out0_d0"
chunks = "ceil(k / 128)"
end = "(k - 1) % 128"
full = "ds(128)"
tail = "ds((out0_d1 - 1) % 128 + 1)"
full_end = "127"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * ceil(in0_d1 / 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["n * (chunks + 1)", 128]
[outputs.out0]
shape = ["batches * channels * token_tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
token_tiles = "CR7"
full = "CR8"
tail = "CR9"
chunks = "CR10"
end = "CR11"
channels = "CR12"
full_end = "CR13"
batches = "CR14"

[cases.default]
m = 2
k = 129
n = 135
in0_d1 = 2
in0_d2 = 129
out0_d1 = 2
out0_d2 = 135
