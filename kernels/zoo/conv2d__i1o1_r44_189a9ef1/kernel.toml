[kernel]
op = "conv2d"
formats = ["e2"]

[params.bias]
type = "bool"
default = false
[params.cin]
type = "int"
min = 1
max = 1024
default = 48
[params.cout]
type = "int"
min = 1
max = 1024
default = 64
[params.groups]
type = "int"
min = 1
max = 1
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 64
[params.w]
type = "int"
min = 1
max = 256
default = 64
[params.kh]
type = "int"
min = 1
max = 32
default = 3
[params.kw]
type = "int"
min = 1
max = 32
default = 3
[params.padding]
type = "int"
min = 0
max = 16
default = 1
[params.stride]
type = "int"
min = 1
max = 32
default = 1

[derived]
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
yend = "ho * stride - padding"
xend = "wo * stride - padding"
chunks = "ceil(cin / 128)"
blocks = "ceil(cout / 128)"
panel = "ceil(cin / 16) * 16"
tail = "ds(cout - (blocks - 1) * 128)"
full = "ds(128)"

[inputs.in0]
shape = ["h", "w", "chunks * 128"]
range = [-2, 2]
[inputs.weights]
shape = ["blocks", "1 + kh * kw * panel", 128]
range = [-1, 1]
[outputs.out0]
shape = ["ho", "wo", "blocks * 128"]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
blocks = "CR8"
h = "CR9"
w = "CR10"
panel = "CR11"
yend = "CR12"
xend = "CR13"
tail = "CR14"
full = "CR15"

[cases.default]
[golden]
tolerance = { e2 = "NX8_STEP" }
