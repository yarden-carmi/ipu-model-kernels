[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 1024
default = 64
[params.cout]
type = "int"
min = 1
max = 2048
default = 64
[params.groups]
type = "int"
min = 1
max = 1
default = 1
[params.h]
type = "int"
min = 1
max = 1024
default = 16
[params.w]
type = "int"
min = 1
max = 1024
default = 16
[params.kh]
type = "int"
min = 1
max = 32
default = 3
[params.kw]
type = "int"
min = 1
max = 32
default = 3
[params.padding]
type = "int"
min = 0
max = 16
default = 1
[params.stride]
type = "int"
min = 1
max = 32
default = 1
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1024
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 1024
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 1024
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2048
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 1056
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 1056
default = 16

[derived]
fork = "(1 - min(1, max(h - 28, 28 - h))) + (1 - min(1, max(h - 56, 56 - h)))"
chunks = "ceil(in0_d1 / 128)"
blocks = "(1 - fork) * ceil(out0_d1 / 128) + fork * (stride * in0_d3)"
dot = "min(1, max(0, cin - cout) + max(0, 33 - cout)) * min(1, max(0, 129 - cout))"
panel = "dot * chunks * cout + (1 - dot) * ceil(cin / 16) * 16"
row_delta = "(1 - fork) * stride * (in0_d3 - out0_d3) + fork * ds(out0_d1)"
input_hw = "in0_d2 + 65536 * in0_d3"
kernel_last = "(1 - fork) * (kw - 1 + 65536 * (kh - 1)) + fork * in0_d2 * in0_d3"
panel_tail = "(1 - fork) * (panel + 65536 * (ceil(cin / 16) * 16 - (chunks - 1) * 128)) + fork * out0_d0 * out0_d2 * out0_d3"
yend = "(1 - fork) * (out0_d2 * stride - padding) + fork * (out0_d3 * stride - padding)"
xend = "(1 - fork) * (out0_d3 * stride - padding) + fork * (out0_d2 * stride - padding)"
tail = "(1 - fork) * ds(out0_d1 - (ceil(out0_d1 / 128) - 1) * 128) + fork * (2 * cin + 65536 * 2 * kw * cin)"
full = "ds(128) + 65536 * ((1 - fork) * 65535 + fork * ((cin + 65534) % 65536))"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * chunks", 128]
range = [-2, 2]
[inputs.weights]
shape = ["(1 - fork) * ceil(out0_d1 / 128) * (1 + kh * kw * panel) + fork * (2 + kh * kw * 2 * cin)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
row_delta = "CR7"
blocks = "CR8"
input_hw = "CR9"
kernel_last = "CR10"
panel_tail = "CR11"
yend = "CR12"
xend = "CR13"
tail = "CR14"
full = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
