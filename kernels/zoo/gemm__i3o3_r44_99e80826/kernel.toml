[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 384
[params.m]
type = "int"
min = 1
max = 65536
default = 257
[params.n]
type = "int"
min = 1
max = 65536
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 6
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 384
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 28
[derived]
full = "ds(min(128, 4 * out0_d3))"
spatial = "in0_d0 * ceil(in0_d2 / 4)"
weights = "k + 1"

[inputs.in0]
shape = ["in0_d1 * in0_d0 * ceil(in0_d2 / 4)", 128]
[inputs.w]
shape = ["n * (k + 1) + 1", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / 4)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
spatial = "CR7"
full = "CR8"
n = "CR9"
weights = "CR10"
k = "CR12"

[golden]
tolerance = {e2 = "NX8_STEP", e3 = "NX8_STEP"}

[cases.default]
