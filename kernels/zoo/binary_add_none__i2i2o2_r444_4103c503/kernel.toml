[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 16777216
default = 16384
[params.in0_d0]
type = "int"
min = 1
max = 16777216
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16777216
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 64
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 16777216
default = 16
[params.in1_d0]
type = "int"
min = 1
max = 16777216
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 16777216
default = 64
[params.in1_d2]
type = "int"
min = 1
max = 64
default = 16
[params.in1_d3]
type = "int"
min = 1
max = 16777216
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 16777216
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16777216
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 64
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 16777216
default = 16

[derived]
pack0 = "2 - in0_d3 % 2"
pack1 = "2 - in1_d3 % 2"
packout = "2 - out0_d3 % 2"
rows = "out0_d0 * out0_d1 * (out0_d3 // packout)"
active = "ds(out0_d2 * packout)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3 // pack0", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "in1_d3 // pack1", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
rows = "CR8"
active = "CR9"

[golden]
tolerance = { e1 = "EXACT", e2 = "EXACT" }
[cases.default]
