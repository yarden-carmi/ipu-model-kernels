[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 32768
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 2
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 32
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 512
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 2
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 512
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 32

[derived]
inrows = "in0_d0 * in0_d1 * ceil(in0_d2 / 128)"
outrows = "out0_d0 * out0_d1 * ceil(out0_d2 / 128)"
stride = "ceil(in0_d2 / 128)"
batchrows = "in0_d1 * stride"
chunks = "ceil(in0_d1 / 128)"
features = "in0_d0 * in0_d2"
full = "ds(128)"
last = "ds(in0_d1 - 128 * (chunks - 1))"

[inputs.in0]
shape = ["inrows", 128]
range = [-1.0, 1.0]
[outputs.out0]
shape = ["outrows", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
stride = "CR6"
chunks = "CR7"
features = "CR8"
in0_d1 = "CR9"
in0_d2 = "CR10"
batchrows = "CR11"
last = "CR12"
full = "CR15"
[cases.default]
formats = ["e1", "e2"]
