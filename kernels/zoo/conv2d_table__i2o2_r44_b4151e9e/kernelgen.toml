formats = ["e2"]
chain = ["conv2d"]
chain_in = ["in0"]
chain_out = ["out0"]

[layout.in0]
lanes = 2
rows = [1, 0, 3]
pack = "min(d3, max(1, 128 // d2))"
[view.in0]
kind = "whole"

[layout.out0]
lanes = 2
rows = [0, 1, 3]
pack = "max(1, (128 // d2) // (1 + (stride - 1) * (3 - 2 * min(1, d2 // 64))))"

[lut.out0]
range_mode = 2
range_exp = 40
