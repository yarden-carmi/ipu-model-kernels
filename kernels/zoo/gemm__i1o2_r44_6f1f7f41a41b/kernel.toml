[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 512
[params.m]
type = "int"
min = 1
max = 65536
default = 64
[params.n]
type = "int"
min = 1
max = 65536
default = 160
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 512
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 160
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 8

[derived]
chunks = "ceil(k / 128)"
ystep = "in0_d3 * chunks"
batch_rows = "in0_d2 * ystep"
full = "ds(128)"
active = "ds(out0_d2)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * ceil(in0_d1 / 128)", 128]
[inputs.w]
shape = ["n * (2 + 2 * chunks)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d3", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
active = "CR8"
chunks = "CR9"
ystep = "CR10"
out0_d2 = "CR11"
out0_d3 = "CR12"
n = "CR13"
batch_rows = "CR14"
out0_d0 = "CR15"

[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}
[cases.default]
