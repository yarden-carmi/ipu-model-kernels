[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu", "hardswish", "hardsigmoid"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 96
[params.m]
type = "int"
min = 1
max = 1048576
default = 1024
[params.n]
type = "int"
min = 1
max = 4096
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 96
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 384
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 32
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 32

[derived]
in_capacity = "min(in0_d2, 128 // in0_d3)"
in_pack = "1 + (in_capacity - 1) * (1 - min(1, in0_d2 % in_capacity))"
capacity = "128 // out0_d3"
out_pack = "1 + (capacity - 1) * (1 - min(1, out0_d1 % capacity))"
input_rows = "ceil(in0_d0 * in0_d1 * in0_d2 / in_pack)"
tiles = "n // out_pack"
active = "ds(in_pack * in0_d3)"
out_active = "ds(out_pack * out0_d3)"
height = "in0_d2 // in_pack"
stripes = "in0_d0 * height"
batch_skip = "(in0_d1 - 1) * height"
full_blocks = "(k - 1) // 32"
src_lo = "50462976"
src_hi = "117835012"
transpose_qf = "312"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * (4 + 2 * full_blocks) + 1", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.spatial]
shape = ["n * stripes", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * tiles", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
lut = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
spatial = "CR8"
active = "CR9"
src_lo = "CR10"
src_hi = "CR11"
n = "CR12"
height = "CR13"
transpose_qf = "CR14"
batch_skip = "LR3"
stripes = "LR15"
out_active = "CR15"
full_blocks = "LR12"

[cases.default]
