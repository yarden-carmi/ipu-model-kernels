[kernel]
op = "reflected_corner_contract"
formats = ["e2"]

[params]
oh = { type = "int", min = 2, max = 8192, default = 16 }
ow = { type = "int", min = 2, max = 8192, default = 16 }
in0_d0 = { type = "int", min = 1, max = 65536, default = 1 }
in0_d1 = { type = "int", min = 1, max = 128, default = 64 }
in0_d2 = { type = "int", min = 1, max = 4096, default = 8 }
in0_d3 = { type = "int", min = 1, max = 42, default = 8 }
out0_d0 = { type = "int", min = 1, max = 65536, default = 1 }
out0_d1 = { type = "int", min = 1, max = 128, default = 64 }
out0_d2 = { type = "int", min = 2, max = 8192, default = 16 }
out0_d3 = { type = "int", min = 2, max = 8192, default = 16 }

[derived]
input_rows = "in0_d0 * in0_d1 * ceil(in0_d2 / 3)"
channel_span = "ceil(in0_d2 / 3)"
single = "ds(1)"
active = "ds(out0_d1)"
k9 = "0x137e02"
k3 = "0x137c08"
k1 = "0x137b00"
f3 = "0x3e400000"
f1 = "0x3d800000"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
single = "CR6"
active = "CR7"
channel_span = "CR8"
in0_d3 = "CR9"
in0_d1 = "CR10"
oh = "LR11"
ow = "CR12"
f1 = "CR13"
k3 = "CR14"
k1 = "CR15"
f3 = "CR11"

[cases.default]
