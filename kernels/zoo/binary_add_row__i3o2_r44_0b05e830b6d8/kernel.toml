[kernel]
op = "binary_add_row"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["row"]
default = "row"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 1
max = 2147483647
default = 4096
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 32768
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 8
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 8
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 64
[derived]
in_rows = "in0_d0 * in0_d1 * in0_d2"
out_rows = "out0_d0 * out0_d3 * out0_d1"
per_group = "min(1, (in0_d2 * in0_d3) % inner)"
operand_rows = "in0_d3 * (1 + per_group * (in0_d0 * in0_d1 - 1))"
remaining = "in0_d2 - 1"
valid = "ds(out0_d2)"

[inputs.in0]
shape = ["in_rows", 128]
range = [-2, 2]
[inputs.operand]
shape = ["operand_rows", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_operand = "CR6"
qf_out0 = "CR7"
in0_d1 = "CR8"
in0_d3 = "CR9"
in0_d2 = "CR10"
remaining = "CR11"
per_group = "CR12"
out_rows = "CR13"
valid = "CR14"

[cases.default]
