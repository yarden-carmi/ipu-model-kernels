[kernel]
op = "binary_add_row"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["row"], default = "row" }
const = { type = "int", min = 1, max = 1, default = 1 }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 1, max = 2147483647, default = 4096 }
numel = { type = "int", min = 1, max = 2147483647, default = 32768 }
in0_d0 = { type = "int", min = 1, max = 2147483647, default = 1 }
in0_d1 = { type = "int", min = 1, max = 2147483647, default = 8 }
in0_d2 = { type = "int", min = 1, max = 2147483647, default = 64 }
in0_d3 = { type = "int", min = 1, max = 2147483647, default = 64 }
out0_d0 = { type = "int", min = 1, max = 2147483647, default = 1 }
out0_d1 = { type = "int", min = 1, max = 2147483647, default = 8 }
out0_d2 = { type = "int", min = 1, max = 2147483647, default = 64 }
out0_d3 = { type = "int", min = 1, max = 2147483647, default = 64 }

[derived]
ic = "(in0_d3 + 127) // 128"
oc = "(out0_d2 + 127) // 128"
plane_rows = "in0_d2 * ic"
batch_skip = "in0_d1 * plane_rows - (ic - 1)"
operand_rows = "out0_d3 * oc"
last = "(out0_d2 - 1) % 128 + 1"
ds_pair = "ds(last) + ds(128) * 65536"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * plane_rows", 128]
range = [-2, 2]

[inputs.operand]
shape = ["operand_rows", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out0_d0 * out0_d1 * operand_rows", 128]

[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_operand = "CR6"
qf_out0 = "CR7"
ic = "CR8"
oc = "CR9"
in0_d0 = "CR10"
in0_d1 = "CR11"
plane_rows = "CR12"
batch_skip = "CR13"
operand_rows = "CR14"
ds_pair = "CR15"
last = "LR15"

[cases.default]
