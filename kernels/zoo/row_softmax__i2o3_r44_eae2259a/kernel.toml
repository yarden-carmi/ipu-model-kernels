[kernel]
op = "row_softmax"
formats = ["e1", "e2"]

[params.n]
type = "int"
min = 1
max = 4096
default = 257
[params.rows]
type = "int"
min = 1
max = 32768
default = 1542
[params.in0_d0]
type = "int"
default = 1
[params.in0_d1]
type = "int"
default = 6
[params.in0_d2]
type = "int"
default = 257
[params.in0_d3]
type = "int"
default = 257
[params.out0_d0]
type = "int"
default = 1
[params.out0_d1]
type = "int"
default = 6
[params.out0_d2]
type = "int"
default = 257
[params.out0_d3]
type = "int"
default = 257

[derived]
K = "ceil(n / 128)"
active = "ds(128)"
part = "ds(n - (K - 1) * 128)"
tail = "n - (K - 1) * 128"
rootq = "qf(1, 2, 8, 0) * 65536 + qf(0, 2, 8, 0)"
groups = "ceil(in0_d2 / 128)"
pitch = "groups * in0_d1"
head_groups = "in0_d1 * 65536 + groups"

[inputs.in0]
shape = ["in0_d0", "in0_d3", "in0_d1", "groups", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3 / 128)", 128]
[scratch.tmp]
shape = [12, 128]
[scratch.roots]
shape = ["K", 128]
[scratch.transposed]
shape = ["rows", "2 * K + 1", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
rootq = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
K = "CR7"
head_groups = "CR8"
n = "CR9"
qf_out0 = "CR10"
roots = "CR11"
pitch = "CR12"
transposed = "CR13"
part = "CR14"
active = "CR15"
in0_d0 = "LR15"
in0_d2 = "LR14"
tail = "LR12"

[cases.default]
