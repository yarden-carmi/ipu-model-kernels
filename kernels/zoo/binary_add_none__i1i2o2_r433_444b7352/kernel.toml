[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 147456
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 129
max = 256
default = 144
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 4096
default = 32
[params.in1_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in1_d2]
type = "int"
min = 129
max = 256
default = 144
[params.out0_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.out0_d2]
type = "int"
min = 129
max = 256
default = 144

[derived]
phase_rows = "ceil(out0_d1 * out0_d2 / 128)"
tail = "ds(1 + (out0_d1 * out0_d2 - 1) % 128)"
patch_step = "2 * out0_d0"
one = "ds(1)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * 2", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * 2", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * phase_rows", 128]
[scratch.zero]
shape = [1, 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
out0_d2 = "CR8"
phase_rows = "CR9"
tail = "CR10"
patch_step = "CR11"
out0_d0 = "CR12"
zero = "CR13"
one = "CR14"

[cases.default]
