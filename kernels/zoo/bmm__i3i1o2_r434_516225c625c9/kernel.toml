[kernel]
op = "bmm"
formats = ["e3"]

[params]
b = {type="int", min=1, max=65536, default=8}
k = {type="int", min=1, max=128, default=64}
m = {type="int", min=1, max=128, default=64}
n = {type="int", min=1, max=65536, default=64}
in0_d0 = {type="int", min=1, max=65536, default=1}
in0_d1 = {type="int", min=1, max=65536, default=8}
in0_d2 = {type="int", min=1, max=128, default=64}
in0_d3 = {type="int", min=1, max=128, default=64}
in1_d0 = {type="int", min=1, max=65536, default=1}
in1_d1 = {type="int", min=1, max=128, default=64}
in1_d2 = {type="int", min=1, max=65536, default=512}
out0_d0 = {type="int", min=1, max=65536, default=1}
out0_d1 = {type="int", min=1, max=65536, default=8}
out0_d2 = {type="int", min=1, max=128, default=64}
out0_d3 = {type="int", min=1, max=65536, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", 128]

[derived]
ds = "ds(k) + ds(m)*65536"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
k = "CR6"
m = "CR7"
n = "CR8"
ds = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
b = "LR15"

[cases.default]
