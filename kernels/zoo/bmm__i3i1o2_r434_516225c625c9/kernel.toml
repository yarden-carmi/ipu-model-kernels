[kernel]
op = "bmm"
formats = ["e3"]

[params]
b = {type="int", min=1, max=65535, default=8}
k = {type="int", min=1, max=65535, default=64}
m = {type="int", min=1, max=65535, default=64}
n = {type="int", min=1, max=65535, default=64}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=8}
in0_d2 = {type="int", min=1, max=65535, default=64}
in0_d3 = {type="int", min=1, max=65535, default=64}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=65535, default=64}
in1_d2 = {type="int", min=1, max=65535, default=512}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=8}
out0_d2 = {type="int", min=1, max=65535, default=64}
out0_d3 = {type="int", min=1, max=65535, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ak*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "bk*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]

[derived]
ak = "ceil(in0_d3/128)"
bk = "ceil(in1_d1/128)"
kfull = "(k-1)//128"
dsk = "ds(128)+65536*ds((k-1)%128+1)"
dsm = "ds(128)+65536*ds((m-1)%128+1)"
bgroup = "in1_d2*bk*min(in1_d0-1,1)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
m = "CR8"
n = "CR9"
ak = "CR10"
kfull = "CR11"
dsk = "CR12"
dsm = "CR13"
in0_d1 = "CR14"
bgroup = "CR15"
b = "LR15"

[cases.default]
