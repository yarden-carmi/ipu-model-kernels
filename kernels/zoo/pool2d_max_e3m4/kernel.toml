[kernel]
op = "pool2d"
formats = ["e3"]

[params.channels]
type = "int"
min = 1
max = 128
default = 64
[params.h]
type = "int"
min = 2
max = 112
multiple_of = 2
default = 8
[params.w]
type = "int"
min = 2
max = 112
multiple_of = 2
default = 8
[params.k]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [2]
default = 2
[params.kind]
type = "str"
choices = ["max"]
default = "max"

[derived]
qf = "case_qf"
ds_channels = "ds(channels)"
oh = "h // 2"
ow = "w // 2"
twow = "w * 2"

[inputs.in0]
shape = [1, "h", "w", 128]
range = [-10, 10]
[outputs.out0]
shape = [1, "oh", "ow", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf = "CR4"
ds_channels = "CR5"
w = "CR6"
oh = "CR7"
ow = "CR8"
twow = "CR9"

[golden]
tolerance = { e3 = "EXACT" }
[cases.default]
[cases.small]
h = 2
w = 2
channels = 7
