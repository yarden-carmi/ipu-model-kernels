[kernel]
op = "row_softmax"
formats = ["e2"]

[params.n]
type = "int"
default = 256
[params.rows]
type = "int"
default = 4096
[params.in0_d0]
type = "int"
default = 4
[params.in0_d1]
type = "int"
default = 4
[params.in0_d2]
type = "int"
default = 256
[params.in0_d3]
type = "int"
default = 256
[params.out0_d0]
type = "int"
default = 4
[params.out0_d1]
type = "int"
default = 4
[params.out0_d2]
type = "int"
default = 256
[params.out0_d3]
type = "int"
default = 256

[derived]
K = "ceil(n / 128)"
M = "rows * K"
active = "ds(128)"
part = "ds(n - (K - 1) * 128)"
[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ceil(in0_d3 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3 / 128)", 128]
[scratch.tmp]
shape = [12, 128]
[scratch.exps]
shape = ["K", 128]
[scratch.roots]
shape = ["K", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
tmp = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR10"
K = "CR7"
M = "CR8"
exps = "CR9"
roots = "CR11"
part = "CR14"
active = "CR15"

[cases.default]
