[kernel]
op = "row_softmax"
formats = ["e3"]
[params.n]
type = "int"
min = 1
max = 4096
multiple_of = 1
default = 256
[params.rows]
type = "int"
min = 1
max = 8192
default = 4
[derived]
K = "ceil(n / 128)"
M = "rows * K"
active = "ds(128)"
part = "ds(min(128, n - (K - 1) * 128))"
[inputs.in0]
shape = ["rows", "K", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", "K", 128]
[scratch.exps]
shape = ["K", 128]
[scratch.tmp]
shape = [11, 128]
fill = 1
[abi]
in0 = "CR2"
out0 = "CR3"
tmp = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR10"
K = "CR7"
M = "CR8"
exps = "CR9"
part = "CR14"
active = "CR15"
[golden]
tolerance = { e3 = "NX8_STEP" }
[cases.default]
n = 50
rows = 600
[cases.single]
n = 256
rows = 1
[cases.small_call]
n = 64
rows = 4
[cases.task_call0]
n = 257
rows = 4112
[cases.task_call1]
n = 64
rows = 768
