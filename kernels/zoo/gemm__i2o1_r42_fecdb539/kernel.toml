[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 1024
[params.m]
type = "int"
min = 1
max = 65536
default = 1
[params.n]
type = "int"
min = 1
max = 65536
default = 1000
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 1024
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 1
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 1000

[derived]
tiles = "ceil(n / 128)"
full = "ds(128)"
tail = "ds((n - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d3", 128]
range = [-2, 2]
[inputs.w]
shape = ["4 * tiles * (k + 1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_w = "CR6"
qf_out0 = "CR7"
k = "CR8"
m = "CR9"
tiles = "CR10"
full = "CR11"
tail = "CR12"
in0_d2 = "CR13"
in0_d3 = "CR14"

[cases.default]
