[kernel]
op = "pack_sites_deadband"
formats = ["e2"]

[params]
cin = { type = "int", min = 1, default = 96 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 96 }
in0_d2 = { type = "int", min = 1, default = 16 }
in0_d3 = { type = "int", min = 1, default = 16 }
out0_d0 = { type = "int", min = 1, default = 256 }
out0_d1 = { type = "int", min = 1, default = 96 }

[derived]
channel_stride = "in0_d0 * in0_d2 * ceil(in0_d3 / 128)"
batch_stride = "in0_d2 * ceil(in0_d3 / 128)"
channel_ds = "ds(out0_d1)"

[inputs.in0]
shape = ["in0_d1 * channel_stride", 128]

[outputs.out0]
shape = ["out0_d0 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
channel_stride = "CR6"
batch_stride = "CR7"
in0_d0 = "CR8"
in0_d2 = "CR9"
in0_d3 = "CR10"
cin = "CR11"
channel_ds = "CR12"

[cases.default]
