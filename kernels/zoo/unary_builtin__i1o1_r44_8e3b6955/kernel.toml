[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 128
max = 2147483647
multiple_of = 128
default = 4096

[params.in0_d1]
type = "int"
min = 64
max = 64
default = 64

[params.out0_d1]
type = "int"
min = 64
max = 64
default = 64

[derived]
rows = "numel // in0_d1"
pairs = "numel // (2 * out0_d1)"
loop_limit = "rows - 3"
before_first = "-1"
half = "ds(in0_d1)"
full = "ds(2 * out0_d1)"

[inputs.in0]
shape = ["rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["pairs", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
loop_limit = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
half = "CR7"
before_first = "CR8"
full = "CR15"

[cases.default]
