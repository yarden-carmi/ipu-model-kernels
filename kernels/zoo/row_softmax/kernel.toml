# row_softmax: y[r, :] = softmax(x[r, :]) over each row of a (rows, n) matrix.
#
# One parameterised program for every (rows, n): the row loop is dynamic and the
# row's 128-lane chunks are rendered per call, so the shape reaches the program
# only through CRs and one launch takes a whole (rows, n) call. The host only
# launches (and tiles `rows` when a call's two regions would not fit XMEM).
#
# Hardware-clean NX8 (formats = ["dynamic"], the chip's one NX8 type): every
# store is an ACTIVATE.QUANTIZE -- relu for the row's max, exp2 for the
# numerators, reciprocal for the row's 1/sum, identity for the output -- the
# accumulator is FP32, and no emulator-only instruction appears.
#
# Four passes over the row (max, exp2, sum, reciprocal), one word per chunk
# where the slot allows: 9 words per row at one chunk, 14 at two. R_CYCLIC holds
# the row's x chunks in slots 0 and 1 and its numerator chunks in slots 2 and 3
# at once, so each row is read from XMEM exactly the minimum number of times.
#
# Memory: x is rows*tiles rows and y is rows*tiles (tiles = ceil(n / 128)), and
# that is all the program owns -- 2 * rows * tiles <= 16384 is exactly what the
# widest call (4096 rows at n = 256) uses, so there is no separate numerator
# region: pass 2 stores the numerators INTO y and pass 4 overwrites them with
# the probabilities. The one scratch row the two scalars (the row's max, then
# its 1/sum) round-trip through is y's own last row, which is written last of
# all; and every chunk of the row is already resident in its own R_CYCLIC slot
# when a scalar lands there (tiles <= 2, i.e. n <= 256). A call must therefore
# fit 2 * rows * ceil(n / 128) <= 16384 rows.
#
# The row-common shift subtracted before exp2 is 2 * max(x, 0), not max(|x|):
# the store that saves the max is a `relu` store, which floors it at 0 for free
# (a row of all-negative logits must shift by 0, not by a negative number), and
# 2 * max(x, 0) >= log2(e) * max(x) in every lane, which is exactly what keeps
# the exp2 argument <= 0 (exp2 of a positive input is an AaQ error). The factor
# 2 leaves 0.56 * max of slack, vastly more than the scalar row's own 2^-7
# relative quantization.
#
# log2(e) enters as a sum of two dyadic terms (1.4375 + 0.00518798828125,
# 1.2e-5 from it) because an NX8 MULT constant holds at most 7 significant bits
# and a single one of them would move the softmax temperature -- and every
# probability with it -- by 4e-2 relative.

[kernel]
op = "row_softmax"
formats = ["dynamic"]

[params]
rows    = { type = "int", min = 1, max = 4096 }   # softmax along each row
n       = { type = "int", min = 1, max = 256 }    # row length: 128 lanes per chunk
# The program's constants, all binary fractions so the NX8 constant layout
# holds them exactly (its value field is 8 bits with its own scale and type).
c1      = { type = "float", choices = [1.4375], default = 1.4375 }
c2      = { type = "float", choices = [0.00518798828125], default = 0.00518798828125 }
two     = { type = "float", choices = [2.0], default = 2.0 }

[derived]
tiles     = "ceil(n / 128)"                          # CR12: chunks per row
slot2     = "256"                                    # CR4:  R_CYCLIC's slot 2 index
slot3     = "384"                                    # CR5:  R_CYCLIC's slot 3 index
rows_m1   = "rows - 1"                               # CR6:  the row loop's bound
scratch   = "rows * tiles - 1"                       # CR11: y's last row, the scalar's home
qf        = "case_qf"                                # CR14: the case's QF half
ds_all    = "halves(ds(128), ds(n - 128 * (tiles - 1)))"  # CR15: L full chunk, H the last one
ds1_128   = "halves(ds(1), 128)"                     # CR13: L one lane (the scalar rows), H 128

[inputs.x]
shape = ["rows", "n"]
range = { nx8 = [-8, 8] }                            # logits: the shift is range-free

[outputs.y]
shape = ["rows", "n"]

[abi]
x        = "CR2"
y        = "CR3"
slot2    = "CR4"
slot3    = "CR5"
rows_m1  = "CR6"
c1       = "CR7"
c2       = "CR8"
two      = "CR9"
scratch  = "CR11"
tiles    = "CR12"
ds1_128  = "CR13"
qf       = "CR14"
ds_all   = "CR15"

[golden]
reference = "reference.py:reference"
# Beyond the golden's own quantization the probabilities pass through two NX8
# rows: pass 2's numerator row (the dynamic format's own choice of 5 or 6
# mantissa bits, so up to 2^-5 relative per element) and pass 4's output row.
# The two other round trips -- the row's max and its 1/sum -- are factors common
# to the whole row, and a row's scale comes from its own largest element, so
# they cancel. Two element steps and their row-average is the floor: measured 2
# ulps worst over every case and the whole sweep, 5 over the 4096 x 256 call's
# million elements.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 8, why = "the probabilities are quantized twice: pass 2 stores the exp2 numerators as an NX8 row (the dynamic format's own choice, 5 or 6 mantissa bits, so up to 2^-5 relative per element) and pass 4 re-quantizes num * rinv into the output row. The 1/sum's and the 2*max's own quantizations are row-common factors and cancel in the output row's scale, so two element steps plus their row-average is the floor; measured max 2 ulps over every case and 5 on the 4096 x 256 call (a million elements), 8 of margin" } }

[cases.default]
rows = 8
n = 64

[cases.one]                                      # the narrowest call
rows = 1
n = 1

[cases.full_row]                                 # exactly one 128-lane chunk
rows = 4
n = 128

[cases.two_chunks]                               # two full chunks, no tail
rows = 4
n = 256

[cases.tail]                                     # a short last chunk
rows = 6
n = 200

[cases.n16]                                      # mobilevit_s's 16-wide row, whole
rows = 256
n = 16

[cases.n64]                                      # ... its 64-wide row, one launch's tile
rows = 128
n = 64

[cases.n256]                                     # ... its 256-wide row, one launch's tile
rows = 64
n = 256

[cases.long]                                     # the whole mobilevit_s attention row set
rows = 1024
n = 64
tier = "nightly"

[cases.wide]                                     # the widest call: 4096 x 256
rows = 4096
n = 256
tier = "nightly"

[cases.sweep]                                    # the structure of the domain
rows = [1, 3, 129]
n = [1, 16, 64, 128, 129, 200, 256]
