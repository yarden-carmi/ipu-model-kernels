[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["scalar"], default = "scalar" }
const = { type = "int", min = 1, max = 1, default = 1 }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["mul"], default = "mul" }
numel = { type = "int", min = 1, max = 2147483647, default = 30000 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 12 }
in0_d2 = { type = "int", min = 1, default = 50 }
in0_d3 = { type = "int", min = 1, max = 64, default = 50 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 12 }
out0_d2 = { type = "int", min = 1, default = 50 }
out0_d3 = { type = "int", min = 1, max = 64, default = 50 }

[derived]
items = "in0_d0 * in0_d1 * in0_d2"
out_items = "out0_d0 * out0_d1 * out0_d2"
pairs = "items // 2"
odd = "items % 2"
widths = "ds(2 * out0_d3) + 65536 * ds(out0_d3)"
full = "ds(128)"
fp_hi = "0x43012080"
fp_lo = "0x43010080"
nx_scale = "0x00017c00"

[inputs.in0]
shape = ["ceil(items / 2)", 128]
range = [-2, 2]

[outputs.out0]
shape = ["ceil(out_items / 2)", 128]

[scratch.scalar]
shape = [1, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
widths = "CR6"
full = "CR7"
fp_hi = "CR8"
fp_lo = "CR9"
nx_scale = "CR10"
scalar = "CR11"
pairs = "CR12"
odd = "CR13"

[cases.default]
