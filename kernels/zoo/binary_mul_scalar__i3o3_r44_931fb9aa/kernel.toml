[kernel]
op = "binary_mul_scalar"
formats = ["e2"]

[params]
broadcast = { type = "str", choices = ["scalar"], default = "scalar" }
const = { type = "int", min = 1, max = 1, default = 1 }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["mul"], default = "mul" }
numel = { type = "int", min = 1, max = 2147483647, default = 32768 }
in0_d0 = { type = "int", min = 1, max = 2147483647, default = 1 }
in0_d1 = { type = "int", min = 1, max = 2147483647, default = 8 }
in0_d2 = { type = "int", min = 1, max = 2147483647, default = 64 }
in0_d3 = { type = "int", min = 1, max = 64, default = 64 }
out0_d0 = { type = "int", min = 1, max = 2147483647, default = 1 }
out0_d1 = { type = "int", min = 1, max = 2147483647, default = 8 }
out0_d2 = { type = "int", min = 1, max = 2147483647, default = 64 }
out0_d3 = { type = "int", min = 1, max = 64, default = 64 }

[inputs.in0]
shape = ["ceil(src_rows / 2)", 128]
range = [-2.0, 2.0]

[outputs.out0]
shape = ["ceil(dst_items / 2)", 128]

[scratch.scalar]
shape = [1, 128]

[derived]
src_rows = "in0_d0 * in0_d1 * in0_d2"
dst_items = "out0_d0 * out0_d1 * out0_d2"
pairs = "src_rows // 2"
odd = "src_rows % 2"
store_ds = "ds(2 * out0_d3) + ds(out0_d3) * 65536"
full_ds = "ds(128)"
fp_lo = "0x43010080"
fp_hi = "fp_lo + 8192"
nx_scale = "0x00017c00"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
scalar = "CR6"
full_ds = "CR7"
store_ds = "CR8"
fp_lo = "CR9"
fp_hi = "CR10"
nx_scale = "CR11"
pairs = "CR12"
odd = "CR13"

[cases.default]
