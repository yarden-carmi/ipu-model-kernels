[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 1
default = 65536

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
default = 64

[params.in0_d2]
type = "int"
min = 1
default = 32

[params.in0_d3]
type = "int"
min = 1
max = 128
default = 32

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
default = 64

[params.out0_d2]
type = "int"
min = 1
default = 32

[params.out0_d3]
type = "int"
min = 1
max = 128
default = 32

[derived]
rows = "in0_d0 * in0_d1 * in0_d2"
out_rows = "out0_d0 * out0_d1 * out0_d2"
penultimate = "rows - 2"
active = "ds(in0_d3)"
out_active = "ds(out0_d3)"

[inputs.in0]
shape = ["rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
penultimate = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
active = "CR7"
out_active = "CR8"

[cases.default]
