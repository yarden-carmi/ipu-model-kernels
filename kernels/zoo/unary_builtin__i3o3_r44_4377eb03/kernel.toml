[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.numel]
type = "int"
min = 1
default = 4096
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 64
[params.in0_d2]
type = "int"
min = 1
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 8
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 64
[params.out0_d2]
type = "int"
min = 1
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 8

[derived]
input_rows = "in0_d0 * in0_d1 * in0_d2"
output_rows = "out0_d0 * out0_d1 * out0_d2"
penultimate = "input_rows - 2"
input_active = "ds(in0_d3)"
output_active = "ds(out0_d3)"
[inputs.in0]
shape = ["input_rows", 128]
range = [-1.0, 1.0]
[outputs.out0]
shape = ["output_rows", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
penultimate = "CR6"
input_active = "CR7"
output_active = "CR8"
[cases.default]
