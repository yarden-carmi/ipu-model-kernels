[kernel]
op = "integer_significand_square_lane"
formats = ["e3"]

[params.numel]
type = "int"
min = 1
default = 512

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
default = 512

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
default = 512

[inputs.in0]
shape = ["in0_d0", "ceil(in0_d1 / 128) * 128"]

[outputs.out0]
shape = ["out0_d0", "ceil(out0_d1 / 128) * 128"]

[derived]
rows = "in0_d0 * ceil(in0_d1 / 128)"
full = "in0_d1 // 128"
tail_ds = "ds(in0_d1 - (ceil(in0_d1 / 128) - 1) * 128)"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
rows = "CR6"
full = "CR7"
tail_ds = "CR8"

[golden]
tolerance = { nx8 = "EXACT" }

[cases.default]
numel = 512
