[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 1
default = 4096

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
default = 64

[params.in0_d2]
type = "int"
min = 1
default = 8

[params.in0_d3]
type = "int"
min = 1
default = 8

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
default = 64

[params.out0_d2]
type = "int"
min = 1
default = 8

[params.out0_d3]
type = "int"
min = 1
default = 8

[derived]
in_plane = "in0_d2 * in0_d3"
out_plane = "out0_d2 * out0_d3"
in_chunks = "ceil(in_plane / 128)"
out_chunks = "ceil(out_plane / 128)"
in_rows = "in0_d0 * in0_d1 * in_chunks"
out_rows = "out0_d0 * out0_d1 * out_chunks"
last_chunk = "out_chunks - 1"
full = "ds(128)"
tail = "ds((out_plane - 1) % 128 + 1)"

[inputs.in0]
shape = ["in_rows", 128]
range = [-1, 1]

[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
last_chunk = "CR6"
out_rows = "CR7"
full = "CR8"
tail = "CR9"

[cases.default]
