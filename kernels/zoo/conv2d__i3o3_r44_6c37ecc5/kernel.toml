[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.groups]
type = "int"
choices = [1]
default = 1
[params.cin]
type = "int"
min = 1
max = 1024
default = 64
[params.cout]
type = "int"
min = 1
max = 1024
default = 64
[params.h]
type = "int"
min = 1
max = 1024
default = 64
[params.w]
type = "int"
choices = [8, 16, 32, 64, 128]
default = 64
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1024
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 1024
default = 64
[params.in0_d3]
type = "int"
choices = [8, 16, 32, 64, 128]
default = 64
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 1024
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 1024
default = 64
[params.out0_d3]
type = "int"
choices = [4, 8, 16, 32, 64, 128]
default = 64

[derived]
tiles = "in0_d2"
pitch = "tiles + 1"
rewind = "cout * out0_d2 - 1"
weight_rows = "2 * ceil(cin / 14)"
weight_end = "1 + cout * weight_rows"
full = "ds(128)"
out_ds = "ds(out0_d3) + 65536 * ((stride - 1) * (8448 + out0_d3) + (2 - stride) * ds(in0_d3))"
scratch_rows = "in0_d1 * pitch + 1"

[inputs.in0]
shape = ["in0_d1", "tiles", 128]
range = [-2, 2]
[inputs.weights]
shape = ["weight_end", 128]
range = [-1, 1]
[scratch.even_odd]
shape = ["scratch_rows", 128]
[outputs.out0]
shape = ["out0_d2", "out0_d1", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
pitch = "CR8"
weight_rows = "CR9"
cout = "CR10"
cin = "CR11"
even_odd = "CR12"
out_ds = "CR13"
rewind = "CR14"
full = "CR15"

[cases.default]
