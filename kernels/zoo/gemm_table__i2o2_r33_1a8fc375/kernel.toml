[kernel]
op = "gemm_table"
formats = ["e2"]

[params.k]
type = "int"
min = 1
max = 4096
default = 192
[params.n]
type = "int"
min = 1
max = 4096
default = 384
[params.m]
type = "int"
min = 1
max = 65535
default = 256
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 192
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 384

[derived]
IR = "in0_d0 * ceil(in0_d1 * in0_d2 / 128)"
O = "ceil(out0_d2 / 128)"
OR = "out0_d0 * out0_d1 * O"
W = "ceil(n / 128) * (k + 1)"
full = "ds(128)"
tail = "ds(n - 128 * (ceil(n / 128) - 1))"

[inputs.in0]
shape = ["IR", 128]
[inputs.coeff]
shape = ["W", 128]
[inputs.lut]
shape = [5, 128]
[outputs.out0]
shape = ["OR", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
lut = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
k = "CR8"
O = "CR9"
m = "CR10"
tail = "CR11"
full = "CR12"
in0_d1 = "CR13"

[cases.default]
