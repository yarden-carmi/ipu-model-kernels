[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]
[params]
act_out0 = {type="str", choices=["hardswish"], default="hardswish"}
bias = {type="bool", default=true}
cin = {type="int", min=2, max=640, default=120}
cout = {type="int", min=2, max=640, default=120}
groups = {type="int", min=2, max=640, default=120}
h = {type="int", min=1, max=32, default=14}
w = {type="int", choices=[7,14,28], default=14}
kh = {type="int", choices=[5], default=5}
kw = {type="int", choices=[5], default=5}
padding = {type="int", choices=[2], default=2}
stride = {type="int", choices=[1,2], default=1}
in0_d0 = {type="int", choices=[1], default=1}
in0_d1 = {type="int", min=2, max=640, default=120}
in0_d2 = {type="int", min=1, max=32, default=14}
in0_d3 = {type="int", choices=[7,14,28], default=14}
out0_d0 = {type="int", choices=[1], default=1}
out0_d1 = {type="int", min=2, max=640, default=120}
out0_d2 = {type="int", min=1, max=32, default=14}
out0_d3 = {type="int", min=1, max=28, default=14}
[derived]
weight_rows = "cout * 78"
ds128 = "ds(128)"
ds_width = "ds(in0_d3)"
ds_out = "ds(out0_d3)"
opack = "min(out0_d3, 128 // (out0_d2 + 4))"
otiles = "ceil(out0_d3 / opack)"
ds_packed = "ds(opack * out0_d2)"
ds_packed_tail = "ds((1 + (out0_d3 - 1) % opack) * out0_d2)"
[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2 / (128 // in0_d3))", 128]
range = [-2,2]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1,1]
[inputs.lut]
shape = [5,128]
range = [0,0]
[scratch.pad]
shape = ["(in0_d2 + 4) * stride",128]
[scratch.tmp]
shape = ["out0_d2",128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "otiles",128]
[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
pad = "CR6"
tmp = "CR7"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
ds_width = "CR12"
ds_out = "CR13"
ds_packed = "CR14"
ds_packed_tail = "CR15"
[golden]
tolerance = {e1="NX8_STEP", e2="NX8_STEP"}
[cases.default]
