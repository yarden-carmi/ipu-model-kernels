[kernel]
op = "conv2d"
formats = ["e2"]

[params.bias]
type = "bool"
default = true

[params.cin]
type = "int"
min = 3
max = 3
default = 3

[params.cout]
type = "int"
min = 384
max = 384
multiple_of = 128
default = 384

[params.groups]
type = "int"
min = 1
max = 1
default = 1

[params.h]
type = "int"
min = 1
max = 224
default = 28

[params.w]
type = "int"
min = 1
max = 224
default = 28

[params.kh]
type = "int"
min = 14
max = 14
default = 14

[params.kw]
type = "int"
min = 14
max = 14
default = 14

[params.padding]
type = "int"
min = 0
max = 0
default = 0

[params.stride]
type = "int"
min = 14
max = 14
default = 14

[derived]
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
blocks = "cout // 128"
full = "ds(128)"

[inputs.in0]
shape = ["h", "w", 128]
range = [-2, 2]

[inputs.weights]
shape = ["blocks", "1 + kh * kw * cin", 128]
range = [-1, 1]

[inputs.cls]
shape = ["blocks", 128]
range = [-1, 1]

[outputs.out0]
shape = [1, "ho * wo + 1", "cout"]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
cls = "CR7"
blocks = "CR8"
h = "CR9"
w = "CR10"
full = "CR15"

[cases.default]

[golden]
tolerance = { e2 = "NX8_STEP" }
