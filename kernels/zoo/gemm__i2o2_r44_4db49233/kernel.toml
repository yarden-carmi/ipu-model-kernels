[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 72
[params.m]
type = "int"
min = 1
max = 65536
default = 784
[params.n]
type = "int"
min = 1
max = 65536
default = 24
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 72
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 28
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 24
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 28

[derived]
spatial = "ceil(in0_d2 * in0_d3 / 128)"
batchstride = "k * spatial"
weightstride = "2 * ceil(k / 128) + 1"
full = "ds(128)"
tail = "ds((out0_d2 * out0_d3 - 1) % 128 + 1)"
laneend = "127"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * spatial", 128]
[inputs.w]
shape = ["n * weightstride", 128]
[outputs.out0]
shape = ["out0_d1 * out0_d0 * spatial", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
spatial = "CR7"
batchstride = "CR8"
weightstride = "CR9"
full = "CR10"
tail = "CR11"
k = "CR12"
out0_d0 = "CR13"
n = "CR14"
laneend = "CR15"

[cases.default]
