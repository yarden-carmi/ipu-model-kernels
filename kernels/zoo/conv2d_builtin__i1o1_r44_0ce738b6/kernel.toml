[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
choices = [16, 32, 64, 128]
default = 64
[params.cout]
type = "int"
min = 1
max = 128
default = 64
[params.groups]
type = "int"
min = 1
max = 128
default = 1
[params.h]
type = "int"
min = 1
max = 224
default = 16
[params.w]
type = "int"
min = 8
max = 224
multiple_of = 8
default = 16
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1

[derived]
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
pack = "128 // cin"
packed_width = "w // pack"
segments = "(3 * cin + 127) // 128"
oc_end = "((cout - 1) // 16) * 16 - 1"
tap_rows = "2 * segments * cout"
phase_end = "128 - cin"
full = "ds(128)"
last = "ds((3 * cin - 1) % 128 + 1)"
tail = "ds(cout)"

[inputs.in0]
shape = ["in0_d0", "h", "packed_width", 128]
range = [-2, 2]
[inputs.weights]
shape = ["3 + kh * tap_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["in0_d0", "ho", "wo", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
in0_d0 = "LR10"
tail = "CR7"
packed_width = "CR8"
h = "CR9"
phase_end = "CR10"
w = "CR11"
last = "CR12"
oc_end = "CR13"
tap_rows = "CR14"
full = "CR15"

[cases.default]

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
