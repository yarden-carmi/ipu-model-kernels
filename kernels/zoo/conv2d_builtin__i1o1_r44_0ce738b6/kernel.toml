[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
choices = [16, 32, 64, 128]
default = 64
[params.cout]
type = "int"
min = 1
max = 128
default = 64
[params.groups]
type = "int"
min = 1
max = 128
default = 1
[params.h]
type = "int"
min = 1
max = 224
default = 16
[params.w]
type = "int"
min = 8
max = 224
multiple_of = 8
default = 16
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
choices = [16, 32, 64, 128]
default = 64
[params.in0_d2]
type = "int"
min = 1
default = 16
[params.in0_d3]
type = "int"
min = 8
multiple_of = 8
default = 16
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64

[derived]
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
pack = "128 // in0_d1"
packed_width = "in0_d3 // pack"
segments = "(3 * in0_d1 + 127) // 128"
packed_pair = "min(in0_d1 // 64, 1) - in0_d1 // 128"
panel = "32 - 16 * packed_pair"
oc_end = "((out0_d1 - 1) // panel) * panel - 1"
last_packed_column = "packed_width - 1"
last_x = "in0_d3 - 1"
column_limit = "last_x * packed_pair + last_packed_column * (1 - packed_pair)"
tap_rows = "2 * (segments - packed_pair) * out0_d1"
weight_rows = "3 + 2 * out0_d1 * (3 * segments - packed_pair)"
phase_end = "128 - in0_d1"
pack_or_pair = "base(pair) * packed_pair + phase_end * (1 - packed_pair)"
full = "ds(128)"
last = "ds((3 * in0_d1 - 1) % 128 + 1)"
tail = "ds(out0_d1)"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "packed_width", 128]
range = [-2, 2]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["in0_d0", "ho", "wo", 128]

[scratch.pair]
shape = [1, 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
in0_d0 = "LR10"
tail = "CR7"
column_limit = "CR8"
in0_d2 = "CR9"
pack_or_pair = "CR10"
in0_d3 = "CR11"
last = "CR12"
oc_end = "CR13"
tap_rows = "CR14"
full = "CR15"

[cases.default]

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
