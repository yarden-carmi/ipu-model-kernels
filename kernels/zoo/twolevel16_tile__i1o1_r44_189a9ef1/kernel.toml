[kernel]
op = "twolevel16_tile"
formats = ["e2"]

[params.cin]
type = "int"
min = 16
max = 128
multiple_of = 16
default = 96
[params.cout]
type = "int"
min = 1
max = 128
default = 96
[params.h]
type = "int"
min = 1
default = 16
[params.w]
type = "int"
min = 1
default = 16
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 16
max = 128
multiple_of = 16
default = 96
[params.in0_d2]
type = "int"
min = 1
default = 16
[params.in0_d3]
type = "int"
min = 1
default = 16
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 96
[params.out0_d2]
type = "int"
min = 2
default = 32
[params.out0_d3]
type = "int"
min = 2
default = 32

[inputs.in0]
shape = ["pixels", 128]
range = [-1, 1]
[inputs.coeff]
shape = ["8 * (cin + 1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3", 128]

[derived]
pixels = "in0_d0 * in0_d2 * in0_d3"
valid = "ds(out0_d1)"

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
valid = "CR7"
cin = "CR8"
pixels = "CR9"
out0_d3 = "CR10"
in0_d3 = "CR11"

[cases.default]
