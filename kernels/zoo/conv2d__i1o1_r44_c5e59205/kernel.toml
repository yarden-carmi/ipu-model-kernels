[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = false
[params.cin]
type = "int"
min = 1
max = 1024
default = 48
[params.cout]
type = "int"
min = 1
max = 2048
default = 64
[params.groups]
type = "int"
min = 1
max = 1
default = 1
[params.h]
type = "int"
min = 1
max = 1024
default = 64
[params.w]
type = "int"
min = 1
max = 1024
default = 64
[params.kh]
type = "int"
min = 1
max = 32
default = 3
[params.kw]
type = "int"
min = 1
max = 32
default = 3
[params.padding]
type = "int"
min = 0
max = 16
default = 1
[params.stride]
type = "int"
min = 1
max = 32
default = 1

[derived]
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
pixels = "ho * wo"
pack = "max(1, 128 // cout)"
chunks = "ceil(cin / 128)"
blocks = "ceil(cout / 128)"
lanes = "min(cout, 128)"
packed = "pack * lanes"
tap_rows = "chunks * lanes"
xend = "wo * stride - padding"
yend = "ho * stride - padding"
row_delta = "stride * (w - wo)"
full = "ds(128)"
store_ds = "ds(packed)"
tail_ds = "ds(min(lanes, cout - (blocks - 1) * 128) * (1 + (pixels - 1) % pack))"

[inputs.in0]
shape = ["h", "w", "chunks", 128]
range = [-2, 2]
[inputs.weights]
shape = ["blocks", "1 + kh * kw * tap_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["ceil(pixels / pack) * blocks", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
row_delta = "CR7"
tap_rows = "CR8"
h = "CR9"
w = "CR10"
yend = "CR11"
xend = "CR12"
tail_ds = "CR13"
store_ds = "CR14"
full = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
