[kernel]
op = "gemm__binary_add_none__row_norm_layernorm"
formats = ["e2", "e3"]

[params.s0_bias]
type = "bool"
default = true
[params.s0_k]
type = "int"
min = 1
max = 65536
default = 1536
[params.s0_m]
type = "int"
min = 1
max = 65536
default = 256
[params.s0_n]
type = "int"
min = 1
max = 65536
default = 384
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 1
max = 16777216
default = 98304
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"
[params.s2_channels]
type = "int"
min = 1
max = 65536
default = 384
[params.s2_eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-12
[params.s2_kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.s2_rows]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 1536
[params.in1_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.in1_d2]
type = "int"
min = 1
max = 65536
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 384

[derived]
tiles = "ceil(s2_channels / 128)"
last = "(s2_channels - 1) % 128 + 1"
tail = "ds(last)"
blocks = "ceil(in0_d1 / 128)"
half = "1277440"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "blocks * 128"]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "ceil(in1_d1 / 128) * 128"]
[inputs.w]
shape = ["3 * (s0_k + 1) * tiles", 128]
[inputs.coeff]
shape = ["4 + 6 * tiles", 128]
[scratch.tmp]
shape = ["24 + 4 * tiles", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / 128)", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
w = "CR5"
coeff = "CR6"
tmp = "CR7"
qf_in0 = "CR8"
qf_in1 = "CR9"
qf_out0 = "CR10"
tiles = "CR11"
tail = "CR12"
blocks = "CR13"
half = "CR14"
last = "LR8"
s2_rows = "LR14"
s0_k = "LR12"

[cases.default]
