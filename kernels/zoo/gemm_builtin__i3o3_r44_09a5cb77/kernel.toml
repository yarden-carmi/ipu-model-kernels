[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 16
[params.n]
type = "int"
min = 1
max = 4096
default = 72
[params.m]
type = "int"
min = 1
max = 2147483647
default = 3136
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 72
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[derived]
capacity = "min(in0_d2, 128 // in0_d3)"
pack = "1 + (capacity - 1) * (1 - min(1, in0_d2 % capacity)) - (1 - min(1, max(in0_d3 - 32, 32 - in0_d3) + in0_d2 % 4 + max(0, k - 96)))"
groups = "in0_d2 // pack"
batch_skip = "(in0_d1 - 1) * groups"
packed_width = "pack * in0_d3"
chunks = "ceil(k / 128)"
row_ds = "ds(out0_d3)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * groups", 128]
[inputs.w]
shape = ["2 * n * (1 + chunks)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d1", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
row_ds = "CR7"
groups = "CR8"
n = "CR9"
out0_d0 = "CR10"
batch_skip = "CR11"
in0_d3 = "CR12"
packed_width = "CR13"

[cases.default]
