[kernel]
op = "binary_add"
formats = ["e1", "e2"]
[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 7840
[params.in0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 40
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 14
default = 14
[params.in1_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 40
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 14
[params.in1_d3]
type = "int"
min = 1
max = 14
default = 14
[params.out0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 40
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 14
default = 14
[derived]
rows = "out0_d0 * out0_d1 * ceil(out0_d2 / 9)"
bound = "rows - 2"
last = "rows - 1"
neg_one = "0 - 1"
full = "ds(9 * out0_d3)"
tail = "ds((out0_d2 - 9 * (ceil(out0_d2 / 9) - 1)) * out0_d3)"
last_start = "rows - ceil(out0_d2 / 9)"
channel_bound = "last_start - 1"
full_bound = "ceil(out0_d2 / 9) - 2"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / 9)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 / 9)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
neg_one = "CR9"
last = "CR10"
full = "CR11"
tail = "CR12"
last_start = "CR13"
channel_bound = "CR14"
full_bound = "CR8"
[cases.default]
