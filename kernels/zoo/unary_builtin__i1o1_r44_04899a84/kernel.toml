[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 2
multiple_of = 2
default = 16384

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 64
default = 64

[params.in0_d2]
type = "int"
min = 1
default = 16

[params.in0_d3]
type = "int"
min = 2
multiple_of = 2
default = 16

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 64
default = 64

[params.out0_d2]
type = "int"
min = 1
default = 16

[params.out0_d3]
type = "int"
min = 2
multiple_of = 2
default = 16

[derived]
rows = "numel // (2 * in0_d1)"
last_row = "rows - 1"
load_ds = "ds(2 * in0_d1)"
store_ds = "ds(2 * out0_d1)"

[inputs.in0]
shape = ["rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
last_row = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
load_ds = "CR7"
store_ds = "CR8"

[cases.default]
