[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 2
multiple_of = 2
default = 262144

[params.in0_d1]
type = "int"
min = 1
max = 64
default = 64

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d2]
type = "int"
min = 1
default = 64

[params.in0_d3]
type = "int"
min = 1
default = 64

[params.out0_d1]
type = "int"
min = 1
max = 64
default = 64

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d2]
type = "int"
min = 1
default = 64

[params.out0_d3]
type = "int"
min = 1
default = 64

[derived]
input_rows = "in0_d0 * in0_d2 * in0_d3 // 2"
output_rows = "out0_d0 * out0_d2 * out0_d3 // 2"
last_row = "numel // (2 * out0_d1) - 1"
input_active = "ds(2 * in0_d1)"
active = "ds(2 * out0_d1)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
last_row = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
active = "CR7"
input_active = "CR8"

[cases.default]
