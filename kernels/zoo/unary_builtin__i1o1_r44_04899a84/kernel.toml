[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 128
max = 2147483647
multiple_of = 128
default = 4096

# Two channel vectors fill one 128-lane row.
[params.in0_d1]
type = "int"
min = 64
max = 64
default = 64

[params.out0_d1]
type = "int"
min = 64
max = 64
default = 64

[derived]
input_rows = "numel // (2 * in0_d1)"
output_rows = "numel // (2 * out0_d1)"
last_row = "input_rows - 1"
penultimate = "input_rows - 2"
active = "ds(128)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
last_row = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
active = "CR7"
penultimate = "CR8"

[cases.default]
