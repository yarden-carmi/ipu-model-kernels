[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 64
[params.cout]
type = "int"
min = 1
max = 640
default = 64
[params.groups]
type = "int"
min = 1
max = 640
default = 64
[params.h]
type = "int"
min = 1
max = 256
default = 128
[params.w]
type = "int"
min = 1
max = 256
default = 128
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 128
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 256
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 256
default = 128

[derived]
ix = "ceil(in0_d3 / 128)"
ox = "ceil(out0_d3 / 128)"
plane = "cin * kw * ox"
tap_jump = "plane - (kw - 1) * ox"
group_step = "(cin // groups) * kw * ox"
weight_rows = "cout * (3 + 3 * (cin // groups))"
weight_end = "weight_rows - 1"
ds128 = "ds(128)"
ds_in = "ds(1 + (in0_d3 - 1) % 128)"
ds_out = "ds(out0_d3 - 128 * (ox - 1))"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d1", "ix", 128]
range = [-2, 2]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.shifted]
shape = ["1 + (in0_d2 + 2) * plane", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ox", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
shifted = "CR6"
tap_jump = "CR7"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
ds_out = "CR12"
plane = "CR13"
ds_in = "CR14"
weight_end = "CR15"
group_step = "LR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
