[kernel]
op = "gemm_silu__conv2d_silu"
formats = ["e2"]
[params.s0_bias]
type = "bool"
default = true
[params.s0_k]
type = "int"
min = 4
max = 128
default = 16
[params.s0_m]
type = "int"
min = 1
max = 16384
default = 16
[params.s0_n]
type = "int"
min = 1
max = 128
default = 64
[params.s1_bias]
type = "bool"
default = true
[params.s1_cin]
type = "int"
min = 1
max = 128
default = 64
[params.s1_cout]
type = "int"
min = 1
max = 128
default = 64
[params.s1_groups]
type = "int"
min = 1
max = 128
default = 64
[params.s1_h]
type = "int"
min = 1
max = 128
default = 4
[params.s1_w]
type = "int"
min = 1
max = 128
default = 4
[params.s1_kh]
type = "int"
min = 3
max = 3
default = 3
[params.s1_kw]
type = "int"
min = 3
max = 3
default = 3
[params.s1_padding]
type = "int"
min = 1
max = 1
default = 1
[params.s1_stride]
type = "int"
min = 1
max = 1
default = 1
[derived]
qf = "case_qf"
ds0 = "ds(s0_n)"
ds1 = "ds(s1_cout)"
wpr = "s1_w + 2"
c128 = "128"
[inputs.in0]
shape = ["s0_m", 128]
range = [-2, 2]
[inputs.w0]
shape = ["s0_k + 1", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 1]
[inputs.w1]
shape = [10, 128]
range = [-1, 1]
[scratch.pad]
shape = ["(s1_h + 2) * (s1_w + 2)", 128]
[outputs.out0]
shape = ["s1_h * s1_w", 128]
[abi]
in0 = "CR2"
w0 = "CR3"
lut = "CR4"
pad = "CR6"
qf = "CR7"
w1 = "CR8"
ds1 = "CR9"
out0 = "CR10"
s1_h = "CR11"
s1_w = "CR12"
wpr = "CR13"
ds0 = "CR14"
c128 = "CR5"
[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
[cases.small]
s0_m = 6
s1_h = 2
s1_w = 3
