[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 512
[params.cout]
type = "int"
min = 1
max = 640
default = 512
[params.groups]
type = "int"
min = 1
max = 640
default = 512
[params.h]
type = "int"
min = 1
max = 256
default = 16
[params.w]
type = "int"
min = 7
max = 256
default = 16
[params.kh]
type = "int"
choices = [1, 3, 5]
default = 3
[params.kw]
type = "int"
choices = [3, 5]
default = 3
[params.padding]
type = "int"
choices = [1, 2]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 512
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 16
[params.in0_d3]
type = "int"
min = 7
max = 256
default = 16
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 512
[params.out0_d2]
type = "int"
min = 1
max = 260
default = 8
[params.out0_d3]
type = "int"
min = 3
max = 128
default = 8

[derived]
ix = "ceil(in0_d3 / 128)"
full_pack = "min(out0_d2, 128 // out0_d3)"
pack = "1 + (full_pack - 1) * (1 - min(1, out0_d2 % full_pack))"
tiles = "out0_d2 // pack"
plane = "(in0_d2 + 2 * padding) * kw"
gc = "cin // groups"
ds_input = "ds(in0_d3 - (ix - 1) * 128)"
weights_end = "cout * (2 + 2 * gc) - 1"
ds128 = "ds(128)"
ds_width = "ds(out0_d3)"
ds_pack = "ds(out0_d3 * pack)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ix", 128]
range = [-2, 2]
[inputs.weights]
shape = ["cout * (2 + 2 * gc)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "tiles", 128]
[scratch.shifted]
shape = ["1 + cin * plane", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
shifted = "CR6"
ds_input = "CR7"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
ds_width = "CR12"
ds_pack = "CR13"
plane = "CR14"
weights_end = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
