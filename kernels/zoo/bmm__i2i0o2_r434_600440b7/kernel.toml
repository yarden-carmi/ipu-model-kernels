[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=16384, default=16}
k = {type="int", min=1, max=4096, default=64}
m = {type="int", min=1, max=4096, default=64}
n = {type="int", min=1, max=4096, default=48}
in0_d0 = {type="int", min=1, max=128, default=4}
in0_d1 = {type="int", min=1, max=128, default=4}
in0_d2 = {type="int", min=1, max=4096, default=64}
in0_d3 = {type="int", min=1, max=4096, default=64}
in1_d0 = {type="int", min=1, max=128, default=4}
in1_d1 = {type="int", min=1, max=4096, default=64}
in1_d2 = {type="int", min=1, max=1048576, default=576}
out0_d0 = {type="int", min=1, max=128, default=4}
out0_d1 = {type="int", min=1, max=128, default=4}
out0_d2 = {type="int", min=1, max=4096, default=64}
out0_d3 = {type="int", min=1, max=4096, default=48}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "a_tiles*128"]
range = [0, 1]

[inputs.in1]
shape = ["in1_d1", "in1_d2", 128]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "o_tiles*128"]

[derived]
a_tiles = "ceil(in0_d2/128)"
o_tiles = "ceil(out0_d2/128)"
a_head = "in0_d3*a_tiles"
rhs_start = "2*in1_d2//3"
full_ds = "ds(128)"
tail_ds = "ds((m-1)%128+1)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
k = "CR8"
n = "CR9"
a_tiles = "CR10"
in1_d2 = "CR11"
rhs_start = "CR12"
full_ds = "CR13"
tail_ds = "CR14"
out0_d0 = "LR11"
out0_d1 = "LR12"
o_tiles = "LR13"
a_head = "LR14"

[cases.default]
