[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 192
[params.m]
type = "int"
min = 1
max = 65536
default = 256
[params.n]
type = "int"
min = 1
max = 65536
default = 192
[params.in0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 4
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 48
[params.out0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 192

[derived]
full = "ds(128)"
active = "ds(out0_d0)"
weight_rows = "n * (k + 1) + 1"

[inputs.in0]
shape = ["in0_d2 * in0_d1 * in0_d3", 128]
[inputs.w]
shape = ["weight_rows", 128]
[outputs.out0]
shape = ["out0_d2 * out0_d1", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
active = "CR8"
k = "CR9"
n = "CR10"
out0_d1 = "CR11"

[golden]
tolerance = {e2 = "NX8_STEP", e3 = "NX8_STEP"}

[cases.default]
