[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=65536, default=16}
k = {type="int", min=1, max=32767, default=48}
m = {type="int", min=1, max=32767, default=64}
n = {type="int", min=1, max=65536, default=64}
in0_d0 = {type="int", min=1, max=65536, default=4}
in0_d1 = {type="int", min=1, max=63, default=4}
in0_d2 = {type="int", min=1, max=32767, default=64}
in0_d3 = {type="int", min=1, max=32767, default=48}
in1_d0 = {type="int", min=1, max=65536, default=4}
in1_d1 = {type="int", min=1, max=65536, default=64}
in1_d2 = {type="int", min=1, max=65536, default=576}
out0_d0 = {type="int", min=1, max=65536, default=4}
out0_d1 = {type="int", min=1, max=65536, default=4}
out0_d2 = {type="int", min=1, max=65536, default=64}
out0_d3 = {type="int", min=1, max=65536, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "arows*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d2", "ceil(in1_d0*in1_d1/128)*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]
[scratch.panel]
shape = ["max(n,tiles*k) + ceil((k+7)/8)*ceil(n/16)", 128]

[derived]
arows = "ceil(in0_d3/128)"
brows = "ceil(in1_d2/128)"
tiles = "ceil(n/128)"
bconfig = "ceil(in1_d0*in1_d1/128) + ds(min(k,128))*65536"
kconfig = "k + (k-3)%65536*65536"
mconfig = "m + tiles*65536"
astride = "(k*ceil(in1_d0*in1_d1/128)) + (4*k*ceil(in1_d0*in1_d1/128))*65536"
outer = "b//in0_d1"
ds = "ds(128) + ds((n-1)%128+1)*65536"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
panel = "CR5"
kconfig = "CR6"
mconfig = "CR7"
n = "CR8"
bconfig = "CR9"
ds = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
in0_d1 = "CR14"
astride = "CR15"
outer = "LR15"

[cases.default]
