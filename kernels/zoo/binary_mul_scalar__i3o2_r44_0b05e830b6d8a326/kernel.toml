[kernel]
op = "binary_mul_scalar"
formats = ["e2", "e1"]

[params]
broadcast = { type = "str", choices = ["scalar"], default = "scalar" }
const = { type = "int", min = 1, max = 1, default = 1 }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["mul"], default = "mul" }
numel = { type = "int", min = 1, max = 2147483647, default = 786432 }
in0_d0 = { type = "int", min = 1, max = 2147483647, default = 1 }
in0_d1 = { type = "int", min = 1, max = 2147483647, default = 12 }
in0_d2 = { type = "int", min = 1, max = 2147483647, default = 256 }
in0_d3 = { type = "int", min = 1, max = 2147483647, default = 256 }
out0_d0 = { type = "int", min = 1, max = 2147483647, default = 1 }
out0_d1 = { type = "int", min = 1, max = 2147483647, default = 12 }
out0_d2 = { type = "int", min = 1, max = 2147483647, default = 256 }
out0_d3 = { type = "int", min = 1, max = 2147483647, default = 256 }

[inputs.in0]
shape = ["input_rows", 128]
range = [-2.0, 2.0]

[outputs.out0]
shape = ["out0_d0 * batch_rows", 128]

[scratch.scalar]
shape = [1, 128]

[derived]
ic = "ceil(in0_d3 / 128)"
oc = "ceil(out0_d2 / 128)"
plane_rows = "in0_d2 * ic"
column_stride = "out0_d1 * oc"
batch_rows = "out0_d3 * column_stride"
batch_jump = "batch_rows - (out0_d1 - 1) * oc"
input_rows = "in0_d0 * in0_d1 * plane_rows"
last = "(out0_d2 - 1) % 128 + 1"
ds_pair = "ds(last) + ds(128) * 65536"
scale = "0x00017c35"
fp_hi = "0x43012d41"
fp_lo = "0x43010000"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
ic = "CR6"
oc = "CR7"
batch_jump = "LR8"
input_rows = "LR9"
plane_rows = "CR10"
ds_pair = "CR11"
column_stride = "CR12"
scale = "CR13"
out0_d1 = "CR14"
batch_rows = "LR5"
scalar = "CR8"
fp_hi = "CR9"
fp_lo = "CR15"
last = "LR15"

[cases.default]
