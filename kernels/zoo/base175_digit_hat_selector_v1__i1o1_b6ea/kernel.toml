[kernel]
op = "base175_digit_hat_selector_v1"
formats = ["e2"]
[params.tokens]
type = "int"
min = 256
max = 256
default = 256
[params.vocab]
type = "int"
min = 30522
max = 30522
default = 30522
[inputs.in0]
shape = [1, "tokens"]
range = [0, 30521]
[inputs.hi]
shape = ["ceil(vocab / 128)", 128]
range = [0, 0]
[inputs.lo]
shape = ["ceil(vocab / 128)", 128]
range = [0, 0]
[inputs.ones]
shape = [128]
range = [1, 1]
[outputs.out0]
shape = ["tokens", "ceil(vocab / 128) * 128"]
[scratch.tmp]
shape = [128]
[derived]
chunks = "ceil(vocab / 128)"
lastds = "ds(vocab % 128)"
one28 = "128"
[abi]
in0 = "CR2"
out0 = "CR3"
hi = "CR4"
lo = "CR5"
ones = "CR6"
tmp = "CR7"
qf_in0 = "CR8"
qf_hi = "CR9"
qf_lo = "CR10"
qf_out0 = "CR11"
chunks = "CR12"
tokens = "CR13"
lastds = "CR14"
one28 = "LR14"
[cases.default]
[golden]
tolerance = { e2 = "EXACT" }
