[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.numel]
type = "int"
min = 1
default = 4096
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 64
[params.in0_d2]
type = "int"
min = 1
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 8
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 64
[params.out0_d2]
type = "int"
min = 1
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 8

[derived]
candidate = "min(in0_d2, 128 // in0_d3)"
pack = "1 + (candidate - 1) * (1 - min(1, in0_d2 % candidate))"
rows = "in0_d0 * in0_d1 * in0_d2 // pack"
penultimate = "rows - 1"
out_candidate = "min(out0_d2, 128 // out0_d3)"
out_pack = "1 + (out_candidate - 1) * (1 - min(1, out0_d2 % out_candidate))"
out_rows = "out0_d0 * out0_d1 * out0_d2 // out_pack"
active = "ds(pack * in0_d3)"

[inputs.in0]
shape = ["rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out_rows", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
penultimate = "CR6"
active = "CR7"
[cases.default]
