[kernel]
op = "reduce_rows_mean"
formats = ["e1"]

[params.kind]
type = "str"
choices = ["mean"]
default = "mean"
[params.n]
type = "int"
min = 1
max = 65536
default = 49
[params.rows]
type = "int"
min = 1
max = 16384
default = 288
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 288
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 7
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 7
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 288
[params.out0_d2]
type = "int"
choices = [1]
default = 1
[params.out0_d3]
type = "int"
choices = [1]
default = 1

[derived]
cap = "min(in0_d2, 128 // in0_d3)"
fits = "1 - min(1, in0_d2 % cap)"
pack2 = "(1 - in0_d2 % 2) * min(1, 64 // in0_d3)"
pack = "cap * fits + (1 - fits) * (1 + pack2)"
spatial = "in0_d2 // pack"
packed_width = "pack * in0_d3"
active = "ds(packed_width)"
one = "ds(1)"
work = "ds(33)"
tail_slot = "32"
vec_width = "8"
ilp_end = "n // 32 * 32"
vec_end = "n // 8 * 8"
# Normalize 1/n before rounding to the scalar multiply format.
shift = "min(1, (n-1)//1) + min(1, (n-1)//2) + min(1, (n-1)//4) + min(1, (n-1)//8) + min(1, (n-1)//16) + min(1, (n-1)//32) + min(1, (n-1)//64) + min(1, (n-1)//128) + min(1, (n-1)//256) + min(1, (n-1)//512) + min(1, (n-1)//1024) + min(1, (n-1)//2048) + min(1, (n-1)//4096) + min(1, (n-1)//8192) + min(1, (n-1)//16384) + min(1, (n-1)//32768)"
factor = "1 + min(1, (n-1)//1) + 2*min(1, (n-1)//2) + 4*min(1, (n-1)//4) + 8*min(1, (n-1)//8) + 16*min(1, (n-1)//16) + 32*min(1, (n-1)//32) + 64*min(1, (n-1)//64) + 128*min(1, (n-1)//128) + 256*min(1, (n-1)//256) + 512*min(1, (n-1)//512) + 1024*min(1, (n-1)//1024) + 2048*min(1, (n-1)//2048) + 4096*min(1, (n-1)//4096) + 8192*min(1, (n-1)//8192) + 16384*min(1, (n-1)//16384) + 32768*min(1, (n-1)//32768)"
inv = "65536 + 256 * (127 - shift) + min(127, (256 * factor + n) // (2 * n) - 128)"
inv_fp32 = "8388608 * (127 - shift) + (8388608 * factor + n // 2) // n - 8388608"

[inputs.in0]
shape = ["in0_d1", "spatial", 128]
[outputs.out0]
shape = ["out0_d1", 128]
[scratch.partial]
shape = [1, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
spatial = "CR6"
active = "CR7"
out0_d1 = "CR8"
inv = "CR9"
inv_fp32 = "CR10"
one = "CR12"
partial = "CR13"
packed_width = "CR14"
work = "CR15"
tail_slot = "CR11"
vec_width = "LR8"
ilp_end = "LR9"
vec_end = "LR10"

[cases.default]
