[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 65536
default = 1024
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 32
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 32

[derived]
pitch = "in0_d0 * in0_d2"
full_blocks = "(k - 1) // 32"
active = "ds(out0_d3)"
lanes = "128"

[inputs.in0]
shape = ["pitch * in0_d1", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * (4 + 2 * full_blocks)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d1", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
n = "CR7"
active = "CR9"
lanes = "CR10"
full_blocks = "CR11"
pitch = "CR12"

[cases.default]
