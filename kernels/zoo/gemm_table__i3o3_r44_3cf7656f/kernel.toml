[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.n]
type = "int"
min = 1
max = 4096
default = 256
[params.m]
type = "int"
min = 1
max = 65536
default = 4096
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 64

[derived]
candidate = "min(out0_d1, 128 // out0_d3)"
pack = "1 + (candidate - 1) * (1 - min(1, out0_d1 % candidate))"
groups = "out0_d1 // pack"
in_candidate = "128 // in0_d3"
in_pack = "1 + (in_candidate - 1) * (1 - min(1, 128 % in0_d3)) * (1 - min(1, in0_d1 % in_candidate))"
rotations = "in_pack + (pack - 1) * (1 - min(1, in_pack - 1))"
input_groups = "k // in_pack"
stripes = "in0_d0 * in0_d2"
out_stripes = "out0_d0 * out0_d2"
in_rows = "stripes * (in0_d1 // in_pack)"
active = "ds(pack * out0_d3)"
groups_before_last = "input_groups - 1"

[inputs.in0]
shape = ["in_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["1 + groups * 2 * (input_groups * rotations + 1)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out_stripes * groups", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
active = "CR8"
stripes = "CR11"
groups = "CR12"
input_groups = "CR13"
groups_before_last = "CR14"
rotations = "CR15"

[cases.default]
