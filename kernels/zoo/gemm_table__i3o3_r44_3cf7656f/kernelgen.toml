chain = ["gemm"]
chain_in = ["in0"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [0, 2, 1]
pack = "1 + (128 // d3 - 1) * (1 - min(1, 128 % d3)) * (1 - min(1, d1 % (128 // d3)))"

[view.in0]
kind = "whole"

[layout.out0]
lanes = 3
rows = [0, 2, 1]
pack = "1 + (min(d1, 128 // d3) - 1) * (1 - min(1, d1 % min(d1, 128 // d3)))"

[lut.out0]
range_mode = 2
range_exp = 40
