[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 2
max = 2147483647
default = 262144

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
default = 64

[params.in0_d2]
type = "int"
min = 2
multiple_of = 2
default = 64

[params.in0_d3]
type = "int"
min = 1
max = 64
default = 64

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
default = 64

[params.out0_d2]
type = "int"
min = 2
multiple_of = 2
default = 64

[params.out0_d3]
type = "int"
min = 1
max = 64
default = 64

[derived]
input_rows = "in0_d0 * in0_d1 * (in0_d2 // 2)"
batch_stride = "out0_d1 * out0_d2"
output_rows = "out0_d0 * batch_stride"
batch_gap = "batch_stride - out0_d2"
last_batch = "in0_d0 - 1"
last_channel = "in0_d1 - 1"
last_pair = "in0_d2 // 2 - 1"
active = "ds(out0_d3)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
active = "CR6"
in0_d3 = "CR7"
last_pair = "CR8"
last_batch = "CR9"
last_channel = "CR10"
batch_gap = "CR11"
out0_d2 = "CR12"

[cases.default]
