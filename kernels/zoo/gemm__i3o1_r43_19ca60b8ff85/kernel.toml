[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params]
bias = {type = "bool", default = true}
k = {type = "int", min = 1, max = 65536, default = 240}
m = {type = "int", min = 1, max = 65536, default = 64}
n = {type = "int", min = 1, max = 65536, default = 240}
in0_d0 = {type = "int", min = 1, max = 65536, default = 4}
in0_d1 = {type = "int", min = 1, max = 65536, default = 4}
in0_d2 = {type = "int", min = 1, max = 65536, default = 16}
in0_d3 = {type = "int", min = 1, max = 128, default = 60}
out0_d0 = {type = "int", min = 1, max = 65536, default = 4}
out0_d1 = {type = "int", min = 1, max = 128, default = 16}
out0_d2 = {type = "int", min = 1, max = 65536, default = 240}

[derived]
full = "ds(128)"
tail = "ds(out0_d1)"
chunks = "(k - k % 128) / 128"
last_full = "125"
last_tail = "(k - 1) % 128 - 2"
minusone = "-1"
rowstep = "ceil(k / in0_d3)"
batchstride = "in0_d1 * in0_d2"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2", 128]
[inputs.w]
shape = ["n * (1 + ceil(k / 128))", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2", 128]
[scratch.tmp]
shape = ["2 * k", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
n = "CR7"
full = "CR8"
tail = "CR9"
chunks = "CR10"
last_full = "CR11"
last_tail = "CR12"
minusone = "CR13"
tmp = "CR14"
rowstep = "CR15"

[golden]
tolerance = {e2 = "NX8_STEP", e3 = "NX8_STEP"}
[cases.default]
