[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 240
[params.m]
type = "int"
min = 1
max = 65536
default = 64
[params.n]
type = "int"
min = 1
max = 4096
default = 160
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 240
[params.in1_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 4096
default = 160
[params.in1_d2]
type = "int"
min = 1
max = 65536
default = 8
[params.in1_d3]
type = "int"
min = 1
max = 128
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 8192
default = 320
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 8

[derived]
chunks = "ceil(in0_d2 / 128)"
pack = "1 + (min(in1_d2, 128 // in1_d3) - 1) * (1 - min(1, in1_d2 % min(in1_d2, 128 // in1_d3)))"
span = "pack * in1_d3"
groups = "in1_d2 // pack"
tiles = "ceil(out0_d1 / 128)"
gt = "tiles - n // 128"
full_ds = "ds(128)"
tail_ds = "ds((out0_d1 - 1) % 128 + 1)"
row_step = "(m // in0_d2) * chunks"
lane_step = "m % in0_d2"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * chunks", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * groups", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["2 * (k + 1) * gt + 1", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * tiles", 128]
[scratch.mixed]
shape = ["m", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
coeff = "CR4"
lut = "CR5"
out0 = "CR6"
mixed = "CR7"
qf_in0 = "CR8"
qf_in1 = "CR9"
qf_out0 = "CR10"
full_ds = "CR11"
tail_ds = "CR12"
row_step = "CR13"
lane_step = "CR14"
in0_d2 = "CR15"
m = "LR15"
k = "LR14"
gt = "LR13"
groups = "LR12"
span = "LR11"

[cases.default]
