[kernel]
op = "static_integer_equal_rows__gemm__row_norm"
formats = ["e2"]
[params.s0_tokens]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128
[params.s0_vocab]
type = "int"
min = 1
max = 50264
default = 9
[params.s1_k]
type = "int"
min = 1
max = 50264
default = 9
[params.s1_m]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128
[params.s1_n]
type = "int"
min = 128
max = 1024
multiple_of = 128
default = 128
[params.s2_channels]
type = "int"
min = 128
max = 1024
multiple_of = 128
default = 128
[params.s2_rows]
type = "int"
min = 128
max = 256
multiple_of = 128
default = 128
[params.s2_kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.s2_eps]
type = "float"
default = 0.00001
[params.sharp]
type = "float"
default = 1024.0
[params.half]
type = "float"
default = 0.5
[derived]
qf = "case_qf"
ntb = "s0_tokens // 128"
ke = "min(s0_vocab, 8)"
[inputs.in0]
shape = [1, "s0_tokens"]
range = [0, 7]
[inputs.w]
shape = ["s1_k", "s1_n"]
range = [-2, 2]
[inputs.gamma]
shape = ["s2_channels"]
range = [-2, 2]
[inputs.beta]
shape = ["s2_channels"]
range = [-2, 2]
[scratch.tmp]
shape = [32, 128]
fill = 1
[scratch.selectors]
shape = ["ntb", "ke", 128]
[scratch.x]
shape = ["s1_m", "s1_n"]
[scratch.c]
shape = [128]
fill = "1 / s2_channels"
[scratch.eps]
shape = [128]
fill = "s2_eps"
[outputs.out0]
shape = [1, "s2_rows", "s2_channels"]
[abi]
in0 = "CR2"
w = "CR3"
tmp = "CR4"
selectors = "CR5"
x = "CR6"
out0 = "CR7"
gamma = "CR8"
beta = "CR9"
qf = "CR10"
sharp = "CR11"
c = "CR12"
eps = "CR13"
half = "CR14"
[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
[cases.wide]
s1_n = 1024
s2_channels = 1024
[cases.two_blocks]
s0_tokens = 256
s1_m = 256
s2_rows = 256
s1_n = 256
s2_channels = 256
