[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
default = 256
[params.m]
type = "int"
min = 1
default = 1024
[params.n]
type = "int"
min = 1
default = 96
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 256
[params.in0_d2]
type = "int"
min = 1
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 32
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 96
[params.out0_d2]
type = "int"
min = 1
default = 32
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 32

[derived]
chunks = "ceil(k / 128)"
input_chunks = "ceil(in0_d1 / 128)"
pack = "min(out0_d2, 128 // out0_d3)"
tiles = "ceil(out0_d2 / pack)"
pixels = "pack * out0_d3"
tail = "((out0_d2 - 1) % pack + 1) * out0_d3"
full = "ds(128)"
tile_ds = "ds(pixels)"
tail_ds = "ds(tail)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * input_chunks", 128]
[inputs.w]
shape = ["n * (2 * chunks + 2)", 128]
when = "bias"
[inputs.w_unbiased]
shape = ["n * 2 * chunks", 128]
when = "not bias"
[outputs.out0]
shape = ["out0_d0 * out0_d1 * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
w_unbiased = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tile_ds = "CR8"
chunks = "CR9"
input_chunks = "CR10"
tiles = "CR11"
n = "CR12"
pixels = "CR13"
tail_ds = "CR14"
tail = "CR15"
out0_d0 = "LR14"

[cases.default]
