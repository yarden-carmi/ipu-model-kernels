[kernel]
op = "binary_add"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 49152 }
in0_d0 = { type = "int", min = 1, max = 128, default = 4 }
in0_d1 = { type = "int", min = 1, max = 16384, default = 64 }
in0_d2 = { type = "int", min = 1, max = 16384, default = 192 }
in1_d0 = { type = "int", min = 1, max = 16384, default = 4 }
in1_d1 = { type = "int", min = 1, max = 16384, default = 64 }
in1_d2 = { type = "int", min = 1, max = 16384, default = 192 }
out0_d0 = { type = "int", min = 1, max = 16384, default = 4 }
out0_d1 = { type = "int", min = 1, max = 16384, default = 64 }
out0_d2 = { type = "int", min = 1, max = 16384, default = 192 }

[derived]
plane = "out0_d0 * out0_d1"
width = "ceil(plane / 128)"
rows = "width * out0_d2"
full = "width - 1"
tail = "ds((plane - 1) % 128 + 1)"
in_width = "ceil(in0_d0 * in0_d1 / 128)"
in_plane = "in0_d0 * in0_d1"
in_span = "in_width * in0_d2"
tail_count = "(plane - 1) % 128 + 1"
row_size = "128"

[inputs.in0]
shape = ["in0_d2", "ceil(in0_d0 * in0_d1 / 128)", 128]

[inputs.in1]
shape = ["in1_d2", "ceil(in1_d0 * in1_d1 / 128)", 128]

[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
rows = "CR8"
full = "CR9"
tail = "CR10"
in_width = "CR11"
in_plane = "CR12"
in_span = "CR13"
tail_count = "CR14"
row_size = "LR15"

[cases.default]
