[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 16384
default = 640
[params.m]
type = "int"
min = 1
max = 16384
default = 1
[params.n]
type = "int"
min = 1
max = 16384
default = 1000
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 640
[params.in0_d2]
type = "int"
choices = [1]
default = 1
[params.in0_d3]
type = "int"
choices = [1]
default = 1
[params.out0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 1000
[derived]
chunks = "ceil(in0_d1 / 128)"
tiles = "ceil(out0_d1 / 128)"
full = "ds(128)"
tail = "ds((out0_d1 - 1) % 128 + 1)"
rows = "out0_d0"
tail_end = "(k - 1) % 128"
width = "128"
full_end = "127"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * chunks", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * (k + 1) * 3", 128]
range = [-1, 1]
[outputs.out0]
shape = ["rows * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
rows = "CR10"
chunks = "CR11"
tail_end = "CR12"
width = "CR13"
full_end = "CR14"

[cases.default]
