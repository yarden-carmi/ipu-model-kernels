[kernel]
op = "binary_add"
formats = ["e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 98688 }
in0_d0 = { type = "int", min = 1, max = 4096, default = 1 }
in0_d1 = { type = "int", min = 1, max = 16384, default = 257 }
in0_d2 = { type = "int", min = 1, max = 16384, default = 384 }
in1_d0 = { type = "int", min = 1, max = 4096, default = 1 }
in1_d1 = { type = "int", min = 1, max = 16384, default = 257 }
in1_d2 = { type = "int", min = 1, max = 16384, default = 384 }
out0_d0 = { type = "int", min = 1, max = 4096, default = 1 }
out0_d1 = { type = "int", min = 1, max = 16384, default = 257 }
out0_d2 = { type = "int", min = 1, max = 16384, default = 384 }

[derived]
pitch0 = "ceil(in0_d2 / 128)"
pitch1 = "ceil(in1_d2 / 128)"
tiles = "ceil(out0_d1 / 128)"
tail = "ds((out0_d1 - 1) % 128 + 1) + 65536 * ds(128)"
batch = "in0_d1 * pitch0"
batch1 = "in1_d1 * pitch1"
count = "(out0_d1 - 1) % 128 + 1 + 65536 * tiles"
scalar = "ds(1)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * pitch0", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * pitch1", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * tiles", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
scalar = "CR8"
pitch0 = "CR9"
pitch1 = "CR10"
out0_d2 = "CR11"
count = "CR12"
tail = "CR13"
batch = "CR14"
batch1 = "CR15"
out0_d0 = "LR15"

[cases.default]
