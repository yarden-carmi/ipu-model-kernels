[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 1
max = 2147483647
default = 16384

[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 64

[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 16

[params.in0_d3]
type = "int"
min = 1
max = 2147483647
default = 16

[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 64

[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 16

[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 16

[derived]
in_candidate = "min(in0_d2, max(1, 128 // in0_d3))"
out_candidate = "min(out0_d2, max(1, 128 // out0_d3))"
in_pack = "1 + (in_candidate - 1) * (1 - min(1, in0_d2 % in_candidate))"
out_pack = "1 + (out_candidate - 1) * (1 - min(1, out0_d2 % out_candidate))"
in_rows = "in0_d0 * in0_d1 * (in0_d2 // in_pack) * ceil(in0_d3 * in_pack / 128)"
out_rows = "out0_d0 * out0_d1 * (out0_d2 // out_pack) * ceil(out0_d3 * out_pack / 128)"
penultimate = "out_rows - 2"
active = "ds(min(128, out0_d3 * out_pack))"

[inputs.in0]
shape = ["in_rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
penultimate = "CR6"
active = "CR15"

[cases.default]
