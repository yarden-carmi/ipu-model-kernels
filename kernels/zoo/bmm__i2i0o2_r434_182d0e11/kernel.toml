[kernel]
op = "bmm"
formats = ["e2"]
[params]
b = {type="int", min=1, max=2147483647, default=8}
k = {type="int", min=1, max=65535, default=512}
m = {type="int", min=1, max=65535, default=512}
n = {type="int", min=1, max=65535, default=64}
in0_d0 = {type="int", min=1, max=65535, default=2}
in0_d1 = {type="int", min=1, max=65535, default=4}
in0_d2 = {type="int", min=1, max=65535, default=512}
in0_d3 = {type="int", min=1, max=65535, default=512}
in1_d0 = {type="int", min=1, max=65535, default=2}
in1_d1 = {type="int", min=1, max=65535, default=512}
in1_d2 = {type="int", min=1, max=2147483647, default=256}
out0_d0 = {type="int", min=1, max=65535, default=2}
out0_d1 = {type="int", min=1, max=65535, default=4}
out0_d2 = {type="int", min=1, max=65535, default=512}
out0_d3 = {type="int", min=1, max=65535, default=64}
[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "ceil(in0_d2/128)*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d2", "ceil(in1_d0*in1_d1/128)*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]
[derived]
chunks = "ceil(m/128)"
bstride = "ceil(in1_d0*in1_d1/128)"
ds = "ds(128)+65536*ds((m-1)%128+1)"
a_finish = "k*chunks"
a_gap = "(min(1,in0_d0-1)*in0_d1*in0_d3-out0_d1*k)*chunks"
b_gap = "in1_d0"
heads_rows = "chunks+65536*out0_d1"
cols = "n"
depth = "k"
astride = "chunks"
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
heads_rows = "CR6"
qf_out0 = "CR7"
astride = "CR8"
bstride = "CR9"
ds = "CR10"
a_finish = "CR11"
depth = "CR12"
cols = "CR13"
a_gap = "CR14"
b_gap = "CR15"
out0_d0 = "LR3"
[cases.default]
