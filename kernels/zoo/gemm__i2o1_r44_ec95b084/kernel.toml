[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 16

[derived]
hchunks = "ceil(in0_d2 / 128)"
pitch = "in0_d3 * hchunks"
batch_pitch = "in0_d1 * pitch"
tiles = "ceil(n / 128)"
full = "ds(128)"

[inputs.in0]
shape = ["in0_d0 * batch_pitch", 128]
[inputs.coeff]
shape = ["tiles * 2 * (k + 1)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
qf_coeff = "CR7"
k = "CR8"
in0_d0 = "CR9"
in0_d2 = "CR10"
in0_d3 = "CR11"
hchunks = "CR12"
pitch = "CR13"
batch_pitch = "CR14"
full = "CR15"
tiles = "LR15"

[cases.default]
