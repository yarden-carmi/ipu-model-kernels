[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 1024
default = 384
[params.cout]
type = "int"
min = 1
max = 1024
default = 384
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 1
max = 1024
default = 16
[params.w]
type = "int"
min = 1
max = 128
default = 16
[params.kh]
type = "int"
min = 1
max = 3
default = 3
[params.kw]
type = "int"
min = 1
max = 3
default = 3
[params.padding]
type = "int"
choices = [0, 1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1024
default = 384
[params.in0_d2]
type = "int"
min = 1
max = 1024
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 1024
default = 384
[params.out0_d2]
type = "int"
min = 1
max = 1026
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 8

[derived]
pack = "128 // in0_d3"
logical_rows = "in0_d1 * in0_d2"
input_rows = "in0_d1 * ceil(in0_d2 / pack)"
patch_rows = "logical_rows * kw"
slot_end = "128 + pack * in0_d3"
filter_rows = "out0_d1 * (1 + 2 * kh * kw * ceil(in0_d1 / 128))"
full = "ds(128)"
width = "ds(out0_d3)"
y_end = "out0_d2 * stride - padding"
channel_step = "in0_d2 * kw"
out_pack = "128 // out0_d3"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1, 1]
[inputs.weights]
shape = ["filter_rows", 128]
range = [-1, 1]
[inputs.masks]
shape = ["kw + 1", 128]
range = [0, 4294967296]
[scratch.patches]
shape = ["patch_rows + 1 + out0_d2 * out0_d1", 128]
[outputs.out0]
shape = ["ceil(out0_d2 / out_pack) * out0_d1", 128]

[abi]
in0 = "CR2"
weights = "CR3"
masks = "CR4"
patches = "CR5"
out0 = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
full = "CR9"
width = "CR10"
in0_d2 = "CR11"
y_end = "CR12"
channel_step = "CR13"
filter_rows = "CR14"
patch_rows = "CR15"
slot_end = "LR14"

[cases.default]
