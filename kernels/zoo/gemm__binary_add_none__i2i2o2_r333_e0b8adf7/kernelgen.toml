chain = ["gemm", "binary"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

[layout.in0]
lanes = 2
rows = [0, 1]
[view.in0]
kind = "whole"

[layout.in1]
lanes = 2
rows = [0, 1]
pack = "1 + (d1 - 1) * (1 - min(1, s0_m % 64 + (d1 * d2) % 128 + d2 % 2))"
[view.in1]
kind = "other"

[layout.out0]
lanes = 2
rows = [0, 1]
