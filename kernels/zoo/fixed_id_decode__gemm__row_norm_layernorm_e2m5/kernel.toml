[kernel]
op = "fixed_id_decode__gemm__row_norm"
formats = ["e2"]
[params]
s0_tokens = {type="int", min=128, max=256, multiple_of=128, default=128}
s0_vocab = {type="int", min=1, max=30522, default=9}
s1_k = {type="int", min=1, max=30522, default=9}
s1_m = {type="int", min=128, max=256, multiple_of=128, default=128}
s1_n = {type="int", min=128, max=768, multiple_of=128, default=128}
s1_bias = {type="bool", default=false}
s2_rows = {type="int", min=128, max=256, multiple_of=128, default=128}
s2_channels = {type="int", min=128, max=768, multiple_of=128, default=128}
s2_kind = {type="str", choices=["layernorm"], default="layernorm"}
s2_eps = {type="float", default=1e-12}
sharp = {type="float", default=1024.0}
six = {type="float", default=6.0}
neg1 = {type="float", default=-1.0}
[derived]
qf = "case_qf"
[inputs]
in0 = {shape=[1,"s0_tokens"], range=[0,7]}
weights = {shape=["s1_k","s1_n"], range=[-1,1]}
add0 = {shape=[1,"s1_m","s1_n"], range=[-1,1]}
add1 = {shape=[1,"s1_m","s1_n"], range=[-1,1]}
gamma = {shape=["s2_channels"], range=[-2,2]}
beta = {shape=["s2_channels"], range=[-2,2]}
bias = {shape=["s1_n"], range=[-1,1], when="s1_bias"}
[scratch]
ones = {shape=[128], fill=1}
scr = {shape=[64,128]}
work = {shape=[64,128], fill="s2_eps"}
recip = {shape=[128], fill="1 / s2_channels"}
channel = {shape=[128], fill="s2_channels"}
half = {shape=[128], fill=0.5}
[outputs]
out0 = {shape=[1,"s2_rows","s2_channels"]}
[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
scr = "CR5"
add0 = "CR6"
add1 = "CR7"
qf = "CR8"
sharp = "CR9"
six = "CR10"
neg1 = "CR11"
bias = "CR12"
ones = "CR13"
work = "CR14"
gamma = "LR14"
beta = "LR15"
recip = "LR13"
channel = "LR12"
half = "LR11"
[golden]
tolerance = {e2="NX8_STEP"}
[cases.default]
[cases.wide]
s1_n = 768
s2_channels = 768
[cases.two_blocks]
s0_tokens = 256
s1_m = 256
s2_rows = 256
s0_vocab = 3
s1_k = 3
s1_n = 256
s2_channels = 256
s1_bias = true
