[kernel]
op = "conv2d"
formats = ["e2"]

[params.bias]
type = "bool"
default = false
[params.cin]
type = "int"
min = 1
max = 512
default = 96
[params.cout]
type = "int"
min = 1
max = 2048
default = 64
[params.groups]
type = "int"
min = 1
max = 2048
default = 1
[params.h]
type = "int"
min = 1
max = 512
default = 32
[params.w]
type = "int"
min = 1
max = 864
default = 32
[params.kh]
type = "int"
min = 1
max = 32
default = 3
[params.kw]
type = "int"
min = 1
max = 32
default = 3
[params.padding]
type = "int"
min = 0
max = 16
default = 1
[params.stride]
type = "int"
min = 1
max = 32
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 96
[params.in0_d2]
type = "int"
min = 1
max = 512
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 864
default = 32
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2048
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 544
default = 32
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 32

[derived]
chunks = "ceil(in0_d1 / 128)"
pack_max = "min(out0_d2, 128 // out0_d3)"
pack = "1 + (pack_max - 1) * (1 - min(1, out0_d2 % pack_max))"
lanes = "pack * out0_d3"
weight_stride = "1 + kh * kw * chunks"
weight_rows = "out0_d1 * weight_stride"
dimensions = "in0_d2 + 65536 * in0_d3"
line_step = "in0_d3 * chunks"
skip_line = "kw * chunks"
full_ds = "ds(128) + 65536 * ds(1)"
out_ds = "ds(lanes) + 65536 * lanes"
x_end = "out0_d3 * stride - padding"
y_end = "out0_d2 * stride - padding"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * chunks", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d1 * out0_d0 * (out0_d2 // pack)", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full_ds = "CR7"
out_ds = "CR8"
dimensions = "CR9"
line_step = "CR10"
skip_line = "CR11"
x_end = "CR12"
y_end = "CR13"
weight_stride = "CR14"
weight_rows = "CR15"

[cases.default]
