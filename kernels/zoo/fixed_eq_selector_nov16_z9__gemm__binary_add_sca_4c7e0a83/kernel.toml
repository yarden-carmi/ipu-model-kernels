[kernel]
op="dual_selectors_gemms_singleton"
formats=["e2"]
[params]
s0_tokens={type="int",min=128,max=256,multiple_of=128,default=256}
s0_vocab={type="int",min=1,max=250002,default=250002}
s1_bias={type="bool",default=false}
s1_k={type="int",min=1,max=250002,default=250002}
s1_m={type="int",min=128,max=256,multiple_of=128,default=256}
s1_n={type="int",min=128,max=768,multiple_of=128,default=768}
s2_broadcast={type="str",choices=["scalar"],default="scalar"}
s2_inner={type="int",min=0,max=0,default=0}
s2_numel={type="int",min=128,max=256,multiple_of=128,default=256}
s2_op={type="str",choices=["add"],default="add"}
s3_numel={type="int",min=128,max=256,multiple_of=128,default=256}
s4_tokens={type="int",min=128,max=256,multiple_of=128,default=256}
s4_vocab={type="int",min=1,max=514,default=514}
s5_k={type="int",min=1,max=514,default=514}
s5_m={type="int",min=128,max=256,multiple_of=128,default=256}
s5_n={type="int",min=128,max=768,multiple_of=128,default=768}
s6_numel={type="int",min=128,max=256,multiple_of=128,default=256}
s6_sel={type="int",min=1,max=1,default=1}
s7_tokens={type="int",min=128,max=256,multiple_of=128,default=256}
s7_vocab={type="int",min=1,max=1,default=1}
s8_bias={type="bool",default=false}
s8_k={type="int",min=1,max=1,default=1}
s8_m={type="int",min=128,max=256,multiple_of=128,default=256}
s8_n={type="int",min=128,max=768,multiple_of=128,default=768}
sharp={type="float",default=1024.0}
[inputs]
in0={shape=[1,"s0_tokens"],range=[0,7]}
in1={shape=[1,"s2_numel"],range=[0,7]}
w0={shape=["s1_k","s1_n"],range=[-2,2]}
w1={shape=["s5_k","s5_n"],range=[-2,2]}
v={shape=[1,"s8_n"],range=[-2,2]}
b0={shape=[1,"s1_n"],range=[-2,2],when="s1_bias"}
b2={shape=[1,"s8_n"],range=[-2,2],when="s8_bias"}
[outputs]
out0={shape=[1,"s1_m","s1_n"]}
out1={shape=[1,"s5_m","s5_n"]}
out2={shape=[1,"s8_m","s8_n"]}
[scratch]
ones={shape=[128],fill=1}
work={shape=[2,128]}
selectors={shape=[2,9,128]}
[derived]
qf="case_qf"
[abi]
in0="CR2"
w0="CR3"
b0="CR4"
ones="CR5"
work="CR6"
selectors="CR7"
out0="CR8"
sharp="CR9"
qf="CR10"
in1="CR11"
w1="CR12"
out1="CR13"
v="CR14"
out2="LR15"
b2="LR10"
[golden]
tolerance={e2="EXACT"}
[cases.default]
s0_tokens=128
s0_vocab=9
s1_k=9
s1_m=128
s1_n=128
s2_numel=128
s3_numel=128
s4_tokens=128
s4_vocab=10
s5_k=10
s5_m=128
s5_n=128
s6_numel=128
s7_tokens=128
s8_m=128
s8_n=128
[cases.two_blocks]
s0_vocab=9
s1_k=9
s1_n=256
s5_n=256
s8_n=256
