[kernel]
op = "binary_add_row"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["row"]
default = "row"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 1
max = 2147483647
default = 4096
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 32768
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 8
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 8
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 64

[derived]
height = "in0_d2"
width = "in0_d3"
groups = "in0_d0 * in0_d1"
input_rows = "groups * width"
area = "height * width"
operand_groups = "1 + (groups - 1) * min(1, area % inner)"
operand_rows = "operand_groups * height"
output_ds = "ds(out0_d3)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]
[inputs.operand]
shape = ["operand_rows", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", 128]

[abi]
in0 = "CR2"
