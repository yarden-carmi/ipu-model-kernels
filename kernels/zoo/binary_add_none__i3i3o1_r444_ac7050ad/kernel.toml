[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
numel = { type = "int", min = 1, max = 16777216, default = 4096 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, max = 128, default = 64 }
in0_d2 = { type = "int", min = 1, default = 8 }
in0_d3 = { type = "int", min = 1, max = 128, default = 8 }
in1_d0 = { type = "int", min = 1, default = 1 }
in1_d1 = { type = "int", min = 1, max = 128, default = 64 }
in1_d2 = { type = "int", min = 1, default = 8 }
in1_d3 = { type = "int", min = 1, max = 128, default = 8 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, max = 128, default = 64 }
out0_d2 = { type = "int", min = 1, default = 8 }
out0_d3 = { type = "int", min = 1, max = 128, default = 8 }

[derived]
p0 = "1 + (128 // in0_d3 - 1) * (1 - min(1, in0_d2 % (128 // in0_d3)))"
p1 = "1 + (128 // in1_d3 - 1) * (1 - min(1, in1_d2 % (128 // in1_d3)))"
channel_stride = "in0_d0 * in0_d2 // p0"
in1_stride = "in1_d0 * in1_d2 // p1"
packed_last = "p0 * in0_d3 - 1"
channel_last = "out0_d1 - 1"
rows = "out0_d0 * out0_d2 * out0_d3"
ds_pair = "ds(1) + 65536 * ds(out0_d1)"

[inputs.in0]
shape = ["in0_d1 * channel_stride", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d1 * in1_stride", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
channel_stride = "CR8"
channel_last = "CR9"
packed_last = "CR10"
rows = "CR11"
ds_pair = "CR12"

[cases.default]
