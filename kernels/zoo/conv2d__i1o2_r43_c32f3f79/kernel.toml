[kernel]
op = "conv2d"
formats = ["e2"]

[params.bias]
type = "bool"
default = true

[params.cin]
type = "int"
min = 1
max = 128
default = 3

[params.cout]
type = "int"
min = 128
max = 1024
multiple_of = 128
default = 384

[params.groups]
type = "int"
min = 1
max = 1
default = 1

[params.h]
type = "int"
min = 1
max = 1024
default = 512

[params.w]
type = "int"
min = 1
max = 1024
default = 864

[params.kh]
type = "int"
min = 1
max = 32
default = 16

[params.kw]
type = "int"
min = 1
max = 32
default = 16

[params.padding]
type = "int"
min = 0
max = 16
default = 0

[params.stride]
type = "int"
min = 1
max = 32
default = 16

[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 128
default = 3

[params.in0_d2]
type = "int"
min = 1
max = 1024
default = 512

[params.in0_d3]
type = "int"
min = 1
max = 1024
default = 864

[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 1115136
default = 1829

[params.out0_d2]
type = "int"
min = 128
max = 1024
multiple_of = 128
default = 384

[derived]
ho = "(h + 2 * padding - kh) // stride + 1"
wo = "(w + 2 * padding - kw) // stride + 1"
blocks = "cout // 128"
token_rows = "(out0_d1 - ho * wo) * blocks"
y_end = "ho * stride - padding"
x_end = "wo * stride - padding"
y_base = "-padding * in0_d3"
y_advance = "stride * in0_d3"
full = "ds(128)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3", 128]
range = [-1, 1]

[inputs.weights]
shape = ["blocks", "1 + kh * kw * cin", 128]
range = [-1, 1]

[inputs.tokens]
shape = ["max(1, token_rows)", 128]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2"]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
tokens = "CR5"
qf_in0 = "CR6"
qf_weights = "CR7"
qf_tokens = "CR8"
qf_out0 = "CR9"
in0_d2 = "CR10"
in0_d3 = "CR11"
y_end = "CR12"
x_end = "CR13"
y_advance = "CR14"
full = "CR15"
y_base = "LR1"
token_rows = "LR12"

[cases.default]

[golden]
tolerance = { e2 = "NX8_STEP" }
