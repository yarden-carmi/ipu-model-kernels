[kernel]
op="embedding_chain"
formats=["e2"]
[params]
s0_tokens={type="int",min=128,max=256,multiple_of=128,default=128}
s0_vocab={type="int",min=8,max=50265,default=8}
s1_k={type="int",min=8,max=50265,default=8}
s1_m={type="int",min=128,max=256,multiple_of=128,default=128}
s1_n={type="int",min=128,max=768,multiple_of=128,default=128}
s2_numel={type="int",min=128,max=256,multiple_of=128,default=128}
s3_tokens={type="int",min=128,max=256,multiple_of=128,default=128}
s3_vocab={type="int",min=9,max=514,default=9}
s4_bias={type="bool",default=false}
s4_k={type="int",min=9,max=514,default=9}
s4_m={type="int",min=128,max=256,multiple_of=128,default=128}
s4_n={type="int",min=128,max=768,multiple_of=128,default=128}
s5_numel={type="int",min=128,max=256,multiple_of=128,default=128}
s5_sel={type="int",min=1,max=1,default=1}
s6_dim={type="int",min=128,max=768,multiple_of=128,default=128}
s6_tokens={type="int",min=128,max=256,multiple_of=128,default=128}
s6_vocab={type="int",min=1,max=1,default=1}
sharp={type="float",default=1024.0}
[inputs]
in0={shape=[1,"s0_tokens"],range=[0,7]}
in1={shape=[1,"s2_numel"],range=[0,7]}
w0={shape=["s1_k","s1_n"],range=[-2,2]}
w1={shape=["s4_k","s4_n"],range=[-2,2]}
b={shape=["s4_n"],range=[-2,2],when="s4_bias"}
table={shape=[1,"s6_dim"],range=[-2,2]}
v={shape=[1,"s6_dim"],range=[-2,2]}
[outputs]
out0={shape=[1,"s1_m","s1_n"]}
out1={shape=[1,"s4_m","s4_n"]}
out2={shape=[1,"s6_tokens","s6_dim"]}
[scratch]
ones={shape=[128],fill=1}
work={shape=[2,128]}
selectors={shape=[2,8,128]}
[derived]
qf="case_qf"
valid="ds(128)"
[abi]
in0="CR2"
in1="CR3"
w0="CR4"
w1="CR5"
v="CR6"
out0="CR7"
out1="CR8"
out2="CR9"
ones="CR10"
work="CR11"
selectors="CR12"
sharp="CR13"
qf="CR14"
valid="CR15"
table="LR15"
b="LR14"
[golden]
tolerance={e2="EXACT"}
[cases.default]
[cases.wide]
s0_tokens=256
s1_m=256
s1_n=256
s2_numel=256
s3_tokens=256
s4_m=256
s4_n=256
s5_numel=256
s6_tokens=256
s6_dim=256
