[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65535
default = 16
[params.n]
type = "int"
min = 1
max = 65535
default = 72
[params.m]
type = "int"
min = 1
max = 2147483647
default = 3136
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 72
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[derived]
capacity = "128 // in0_d3"
pack = "1 + (capacity - 1) * max(1 - min(1, in0_d2 % capacity), 1 - min(1, max(in0_d2 * in0_d3 - 64, 64 - in0_d2 * in0_d3) + 128 % in0_d3)) - (1 - min(1, max(in0_d3 - 32, 32 - in0_d3) + in0_d2 % 4 + max(0, k - 96)))"
plane = "ceil(in0_d2 / pack)"
batch_stride = "in0_d1 * plane"
chunks = "ceil(k / 128)"
width_ds = "ds(out0_d3)"
packed_width = "pack * in0_d3"
out_batch_skip = "out0_d1 * (out0_d2 - 1)"

[inputs.in0]
shape = ["in0_d0 * batch_stride", 128]
[inputs.w]
shape = ["2 * n * (1 + chunks)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d1", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
width_ds = "CR7"
packed_width = "CR8"
plane = "CR9"
batch_stride = "CR10"
n = "CR11"
out0_d0 = "CR12"
in0_d3 = "CR13"
out0_d2 = "CR14"
out_batch_skip = "CR15"

[cases.default]
