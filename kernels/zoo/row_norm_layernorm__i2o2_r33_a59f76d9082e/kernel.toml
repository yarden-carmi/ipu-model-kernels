[kernel]
op = "row_norm"
formats = ["e2"]
[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 384
max = 384
default = 384
[params.rows]
type = "int"
min = 1
max = 65536
default = 1500
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-5
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 1500
[params.in0_d2]
type = "int"
min = 384
max = 384
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 1500
[params.out0_d2]
type = "int"
min = 384
max = 384
default = 384
[derived]
K = "(channels + 127) // 128"
M = "rows * K"
ds_pair = "ds(channels - 128 * (K - 1)) + 65536 * ds(128)"
half = "1277440"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * ((in0_d2 + 127) // 128)", 128]
[inputs.gamma]
shape = ["3 * K", 128]
[inputs.beta]
shape = ["3 * K", 128]
[inputs.scalars]
shape = [4, 128]
[scratch.tmp]
shape = [32, 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ((out0_d2 + 127) // 128)", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
gamma = "CR6"
beta = "CR7"
scalars = "CR8"
tmp = "CR9"
qf_gamma = "CR10"
ds_pair = "CR11"
M = "CR14"
half = "CR15"
rows = "LR11"
channels = "LR14"
[cases.default]
