[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 16384
default = 384
[params.m]
type = "int"
min = 128
max = 65536
multiple_of = 128
default = 256
[params.n]
type = "int"
min = 1
max = 16384
default = 48
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d2]
type = "int"
min = 128
max = 16384
multiple_of = 128
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 48
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 16

[derived]
pitch = "m // 128"
tiles = "ceil(n / 128)"
full = "ds(128)"
tail = "ds((n - 1) % 128 + 1)"
width = "128"
batch_stride = "k * pitch"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * (in0_d2 // 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * (k + 1) * 3", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
pitch = "CR10"
out0_d0 = "CR11"
m = "CR12"
k = "CR13"
width = "CR14"
batch_stride = "CR15"

[cases.default]
