[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
numel = { type = "int", min = 1, default = 4096 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 64 }
in0_d2 = { type = "int", min = 1, default = 8 }
in0_d3 = { type = "int", min = 1, max = 128, default = 8 }
in1_d0 = { type = "int", min = 1, default = 1 }
in1_d1 = { type = "int", min = 1, default = 64 }
in1_d2 = { type = "int", min = 1, default = 8 }
in1_d3 = { type = "int", min = 1, max = 128, default = 8 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 64 }
out0_d2 = { type = "int", min = 1, default = 8 }
out0_d3 = { type = "int", min = 1, max = 128, default = 8 }

[derived]
rows = "out0_d0 * out0_d1 * out0_d2"
last = "rows - 1"
prefetch_limit = "rows - 2"
active_in0 = "ds(in0_d3)"
active_in1 = "ds(in1_d3)"
active_out0 = "ds(out0_d3)"

[inputs.in0]
shape = ["in0_d1 * in0_d0 * in0_d2", 128]
range = [-2, 2]

[inputs.in1]
shape = ["in1_d1 * in1_d0 * in1_d2", 128]
range = [-2, 2]

[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
last = "CR8"
active_in0 = "CR9"
active_in1 = "CR10"
active_out0 = "CR11"
prefetch_limit = "CR12"

[cases.default]
