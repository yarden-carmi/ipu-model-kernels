[kernel]
op = "fixed_eq_selector_1152__gemm"
formats = ["e2"]

[params.s0_tokens]
type = "int"
min = 1
max = 1
default = 1
[params.s0_vocab]
type = "int"
min = 1
max = 1001
default = 1001
[params.s1_k]
type = "int"
min = 1
max = 1001
default = 1001
[params.s1_m]
type = "int"
min = 1
max = 1
default = 1
[params.s1_n]
type = "int"
min = 128
max = 1152
multiple_of = 128
default = 1152
[params.sharp]
type = "float"
default = 1024.0

[derived]
qf = "case_qf"
ked = "min(min(s0_vocab, s1_k), 8)"
ds1 = "ds(1)"
c127 = "127"

[inputs.in0]
shape = [1]
range = [0, 7]
[inputs.w]
shape = ["s1_k", "s1_n"]
range = [-2, 2]

[scratch.ones]
shape = [128]
fill = 1
[scratch.half]
shape = [128]
fill = 0.5
[scratch.work]
shape = [3, 128]
[scratch.selectors]
shape = ["ked", 128]
[scratch.sent]
shape = [128]

[outputs.out0]
shape = ["s1_m", "s1_n"]

[abi]
in0 = "CR2"
w = "CR3"
ones = "CR4"
half = "CR5"
work = "CR6"
selectors = "CR7"
out0 = "CR8"
sharp = "CR9"
qf = "CR10"
sent = "CR11"
c127 = "CR12"
ds1 = "CR13"

[golden]
tolerance = { e2 = "EXACT" }

[cases.default]
s0_vocab = 9
s1_k = 9
s1_n = 256
[cases.short_vocab]
s0_vocab = 7
s1_k = 7
s1_n = 128
[cases.full_vocab]
s0_vocab = 1001
s1_k = 1001
s1_n = 128
[cases.wide_out]
s0_vocab = 5
s1_k = 5
s1_n = 1152
[cases.vocab1]
s0_vocab = 1
s1_k = 1
s1_n = 128
