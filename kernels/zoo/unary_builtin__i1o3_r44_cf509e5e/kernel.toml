[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 1
default = 16384

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 64
default = 64

[params.in0_d2]
type = "int"
min = 2
multiple_of = 2
default = 16

[params.in0_d3]
type = "int"
min = 1
max = 64
default = 16

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 64
default = 64

[params.out0_d2]
type = "int"
min = 2
multiple_of = 2
default = 16

[params.out0_d3]
type = "int"
min = 1
max = 64
default = 16

[derived]
height_pairs = "in0_d2 // 2"
input_rows = "in0_d0 * height_pairs * in0_d3"
output_rows = "out0_d0 * out0_d1 * (out0_d2 // 2)"
full = "ds(128)"
output_active = "ds(2 * out0_d3)"
source_pair = "16777216 * in0_d1"
dest_pair = "16777216"
source_step = "16842752"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
in0_d0 = "CR6"
in0_d1 = "CR7"
height_pairs = "CR8"
in0_d3 = "CR9"
full = "CR10"
output_active = "CR11"
source_pair = "CR12"
dest_pair = "CR13"
source_step = "CR14"

[cases.default]
