[kernel]
op = "gemm_table"
formats = ["e1"]

[params.act_out0]
type = "str"
choices = ["hardswish"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 128
default = 40
[params.m]
type = "int"
min = 1
max = 65535
default = 196
[params.n]
type = "int"
min = 1
max = 4096
default = 240
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 40
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 14
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 240
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 14

[derived]
ip = "min(2, 128 // in0_d1)"
opack = "128 // out0_d3"
groups = "ceil(n / opack)"
stripes = "out0_d0 * out0_d2"
span = "ip * k"
dot_ds = "ds(k)"
store_ds = "ds(opack * out0_d3)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * ceil(in0_d3 / ip)", 128]
range = [-2, 2]
[inputs.weights]
shape = ["3 * n", 128]
range = [-1, 1]
[inputs.bias_rows]
shape = ["2 * groups", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["stripes * groups", 128]

[abi]
in0 = "CR2"
weights = "CR3"
bias_rows = "CR4"
lut = "CR5"
out0 = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
dot_ds = "CR9"
store_ds = "CR10"
k = "CR11"
opack = "CR12"
n = "CR13"
out0_d3 = "CR14"
stripes = "CR15"
span = "LR15"

[cases.default]
