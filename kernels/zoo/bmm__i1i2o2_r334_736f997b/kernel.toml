[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=65536, default=6}
k = {type="int", min=1, max=65536, default=64}
m = {type="int", min=1, max=65536, default=257}
n = {type="int", min=1, max=65536, default=257}
in0_d0 = {type="int", min=1, max=65536, default=1}
in0_d1 = {type="int", min=1, max=65536, default=257}
in0_d2 = {type="int", min=1, max=65536, default=384}
in1_d0 = {type="int", min=1, max=65536, default=1}
in1_d1 = {type="int", min=1, max=65536, default=257}
in1_d2 = {type="int", min=1, max=65536, default=384}
out0_d0 = {type="int", min=1, max=65536, default=1}
out0_d1 = {type="int", min=1, max=65536, default=6}
out0_d2 = {type="int", min=1, max=65536, default=257}
out0_d3 = {type="int", min=1, max=65536, default=257}

[inputs.in0]
shape = ["in0_d0", "in0_d2", "tiles*128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "bc*128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]
[derived]
bc = "ceil(in1_d2/128)"
tiles = "ceil(m/128)"
ds = "ds(128) + 65536*ds((m-1)%128+1)"
features = "out0_d1*k"
a_delta = "(in0_d2*min(in0_d0-1,1)-features)*tiles"
b_delta = "in1_d1*bc*min(in1_d0-1,1) - features//128"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
k = "CR9"
a_delta = "CR10"
n = "CR11"
bc = "CR13"
tiles = "CR14"
ds = "CR15"
out0_d0 = "LR4"
features = "LR5"
b_delta = "LR7"

[cases.default]
