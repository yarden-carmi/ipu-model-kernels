[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=65536, default=6}
k = {type="int", min=1, max=512, default=64}
m = {type="int", min=1, max=4096, default=257}
n = {type="int", min=1, max=4096, default=257}
in0_d0 = {type="int", min=1, max=65536, default=1}
in0_d1 = {type="int", min=1, max=4096, default=257}
in0_d2 = {type="int", min=1, max=65536, default=384}
in1_d0 = {type="int", min=1, max=65536, default=1}
in1_d1 = {type="int", min=1, max=4096, default=257}
in1_d2 = {type="int", min=1, max=65536, default=384}
out0_d0 = {type="int", min=1, max=65536, default=1}
out0_d1 = {type="int", min=1, max=65536, default=6}
out0_d2 = {type="int", min=1, max=4096, default=257}
out0_d3 = {type="int", min=1, max=4096, default=257}

[inputs.in0]
shape = ["in0_d0", "in0_d2", "achunks*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "bchunks*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]

[derived]
achunks = "ceil(in0_d1/128)"
bchunks = "ceil(in1_d2/128)"
astrides = "achunks + 65536*k*achunks"
agroup = "in0_d2*achunks*min(in0_d0-1,1)"
bgroup = "in1_d1*bchunks*min(in1_d0-1,1)"
bspan = "n*bchunks"
km = "k + 65536*m"
ds = "ds(128) + 65536*ds((m-1)%128+1)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
astrides = "CR8"
bchunks = "CR9"
agroup = "CR10"
bgroup = "CR11"
km = "CR12"
bspan = "CR13"
out0_d1 = "CR14"
ds = "CR15"
out0_d0 = "LR3"

[cases.default]
