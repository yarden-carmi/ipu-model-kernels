[kernel]
op = "bmm"
formats = ["e1", "e2"]

[params]
b = {type="int", min=1, max=32767, default=6}
k = {type="int", min=1, max=2048, default=64}
m = {type="int", min=1, max=2048, default=257}
n = {type="int", min=1, max=2048, default=257}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=2048, default=257}
in0_d2 = {type="int", min=1, max=2048, default=384}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=2048, default=257}
in1_d2 = {type="int", min=1, max=2048, default=384}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=2048, default=6}
out0_d2 = {type="int", min=1, max=2048, default=257}
out0_d3 = {type="int", min=1, max=2048, default=257}

[inputs.in0]
shape = ["in0_d0", "in0_d2", "ceil(in0_d1/128)*128"]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "ceil(in1_d2/128)*128"]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]
[derived]
brows = "ceil(in1_d2/128)"
ds_pair = "ds(128) + ds((m-1)%128+1)*65536"
sizes = "m + n*65536"
heads_tiles = "out0_d1 + ceil(m/128)*65536"
rhs_group = "brows*in1_d1"
rhs_end = "out0_d0*brows*in1_d1"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
brows = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
ds_pair = "CR9"
sizes = "CR10"
k = "CR11"
heads_tiles = "CR12"
rhs_group = "CR14"
rhs_end = "CR15"

[golden]
tolerance = {e1="EXACT", e2="EXACT"}
[cases.default]
