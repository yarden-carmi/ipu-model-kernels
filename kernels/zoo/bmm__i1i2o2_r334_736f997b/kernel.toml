[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=65535, default=3}
k = {type="int", min=64, max=64, default=64}
m = {type="int", min=1, max=65535, default=1829}
n = {type="int", min=1, max=65535, default=1829}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=1829}
in0_d2 = {type="int", min=1, max=65535, default=384}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=65535, default=1829}
in1_d2 = {type="int", min=1, max=65535, default=384}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=3}
out0_d2 = {type="int", min=1, max=65535, default=1829}
out0_d3 = {type="int", min=1, max=65535, default=1829}

[inputs.in0]
shape = ["in0_d0", "in0_d2", "ceil(in0_d1/128)*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "ceil(in1_d2/128)*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]
[derived]
strides = "ceil(in1_d2/128)+65536*ceil(in0_d1/128)"
sizes = "m+65536*n"
dses = "ds(128)+65536*ds((m-1)%128+1)"
outds = "2"
heads = "b"
headstep = "64*ceil(in0_d1/128)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
strides = "CR8"
sizes = "CR9"
dses = "CR10"
outds = "CR11"
heads = "CR12"
headstep = "CR13"

[cases.default]
