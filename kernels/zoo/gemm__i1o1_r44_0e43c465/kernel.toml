[kernel]
op = "gemm"
formats = ["e1", "e2"]
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 128
default = 120
[params.m]
type = "int"
min = 1
max = 65536
default = 196
[params.n]
type = "int"
min = 1
max = 128
default = 48
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 120
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 14
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 48
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 14
[derived]
pack = "1 + min(1, 64 // out0_d1) * min(1, (out0_d1 - 1) // 16) * (1 - (out0_d0 * out0_d2 * out0_d3) % 2)"
rows = "ceil(out0_d0 * out0_d2 * out0_d3 / pack)"
full = "ds(128)"
valid = "ds(n * pack)"
minusone = "-1"
slot = "128"
[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3", 128]
[inputs.w]
shape = ["3 * (1 + k * pack) + 1", 128]
[outputs.out0]
shape = ["rows", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
rows = "CR7"
k = "CR8"
full = "CR9"
valid = "CR10"
minusone = "CR11"
slot = "CR12"
[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}
[cases.default]
