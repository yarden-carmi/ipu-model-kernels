[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["hardswish"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 3
[params.cout]
type = "int"
min = 1
max = 640
default = 16
[params.groups]
type = "int"
min = 1
max = 640
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 8
[params.w]
type = "int"
min = 1
max = 256
default = 8
[params.kh]
type = "int"
min = 1
max = 5
default = 3
[params.kw]
type = "int"
min = 1
max = 5
default = 3
[params.padding]
type = "int"
min = 1
max = 2
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 3
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 8
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 260
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 260
default = 8

[derived]
ic = "ceil(in0_d1 / 128)"
oc = "ceil(out0_d1 / 128)"
dw = "1 - min(1, max(cin - groups, groups - cin, cout - groups, groups - cout))"
packed = "(1 // groups) * min(1, cin - 1) * (4 // max(4, cin)) * (16 // max(16, cout)) * (1 - min(1, max(kh - 3, 3 - kh, kw - 3, 3 - kw)))"
pc = "dw + (1 - dw) * ic"
weight_block = "2 + 2 * kh * kw * (dw + (1 - dw) * cin - packed * (cin - 1))"
ds128 = "ds(128)"
ds_short = "ds(min(16, cout))"
window_jump = "(in0_d3 + 2 * padding - kw) * pc"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "ic", 128]
range = [-2, 2]
[inputs.weights]
shape = ["oc * weight_block", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.pad]
shape = ["(in0_d2 + 2 * padding) * (in0_d3 + 2 * padding) * pc", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", "oc", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
pad = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
ds_short = "CR11"
window_jump = "CR12"
out0_d2 = "CR13"
weight_block = "CR14"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
