kind = "approximation"
method = "newton-reciprocal"
task = "binary_div_row"
hw_clean = true                       # no emulator-only instruction; stores are ACTIVATE.QUANTIZE
host_steps = []
chain_in = "a"
chain_out = "y"
unsupported = [
  "{\"broadcast\": \"row\", \"inner\": 256, \"numel\": 32768, \"op\": \"div\"}: more than one b row: the row loop keeps r and its correction e resident in R1 and R0, and rotating them per b row needs a third load per two-word row pair (the other two are the next a row and nothing -- the datapath has one LOAD slot per word). A 2-row unrolled loop with cyclic double buffering would render it; declared out rather than half-rendered.",
  "{\"broadcast\": \"none\", \"inner\": 0, \"numel\": 15360, \"op\": \"div\"}: elementwise division would need a per-lane exact reciprocal: the AaQ `reciprocal` result lands in an 8-bit block row before the multiply that uses it, so the quotient would carry a per-lane error (binary_add_none's `unsupported` says the same). This kernel's row broadcast is what the split can hold.",
  "{\"broadcast\": \"row\", \"inner\": 16, \"numel\": 256, \"op\": \"min\"}: the accumulator has ADD, MAX and SUB only, and the AaQ activation set (identity, relu, relu6, reciprocal, rsqrt, exp2, generic) holds no min; ACC.MAX of the negated operands would cost a row round trip through XMEM to negate back.",
  "{\"broadcast\": \"row\", \"inner\": 16, \"numel\": 256, \"op\": \"add\"}: this kernel renders div by a row only; the other ops belong to binary_add_none's family (which takes broadcast none) and the row-broadcast add is binary_add_row's.",
  "{\"broadcast\": \"row\", \"inner\": 240, \"numel\": 256, \"op\": \"div\"}: inner must be a power of two: then and only then does inner divide 128 * ceil(inner/128), so b's tiled rows repeat the values lane-aligned and no lane rotation is needed.",
  "{\"broadcast\": \"row\", \"inner\": 128, \"numel\": 0, \"op\": \"div\"}: an empty call: numel starts at 1 (rows - 1 would underflow).",
  "{\"broadcast\": \"row\", \"inner\": 128, \"numel\": 262272, \"op\": \"div\"}: above the declared numel maximum (262144 = 2048 rows); a, y and the five one-row scratches take 2*2049+6 = 4104 of the 16384 addressable NX8 rows, so the maximum is a size choice, not a limit of the program.",
  "{\"broadcast\": \"scalar\", \"inner\": 0, \"numel\": 256, \"op\": \"div\"}: a scalar b is binary_div_scalar's task (its split is one lane wide, so its correction row keeps even more precision).",
]
notes = """One parameterised program for every (numel, inner <= 128): y[i] = a[i] / b[i mod inner]
with b broadcast as a row, inner a power of two so b's tiled rows (pack.py: row j lane l holds
b[(128j + l) mod inner]) repeat the values lane-aligned -- a's row r combines with b's one row,
no rotation. The shape reaches the program only through CRs and the row loop is dynamic, so a
whole call is one launch: 32768 elements is 256 iterations of the same two words. Dataflow: the
only way into R_ACC is a multiply result and the only route from R_ACC back into a multiply is a
store and a load, which in NX8 quantizes to the row's grid -- so 1/b cannot be carried at full
precision through a register, and the quotient is split once per call. r = the ACTIVATE.QUANTIZE
reciprocal of the tiled b row (resident in R1); u = 2 - b*r from an exact product and an exact
FP32 subtract seeded by a stored 2s row (a power of two, held exactly, in R_CYCLIC's second
slot); e = r*u - r, computed in the accumulator (ACC.SUB against an exact MULT.VE of resident
r by the CR constant 1.0) and stored tight -- e's row scale is max|r*(1-b*r)|, at most b*(one
step of r's row) ~ 6% of a lane's magnitude, so e's own store costs ~2^-8 of a lane instead of
the ~2^-5 a full-magnitude s = r*u row would. Because the split is exact Newton for the RESIDENT
r, r + e = (1/b)(1 - eps^2) with eps = b*r - 1 whatever r's own store did: r's quantization
costs nothing and the residual is eps^2. The row loop is then two words per a row -- word A
multiplies the a row resident in R_CYCLIC slot 0 by r and initialises R_ACC (ACC.ADD.FIRST),
word B multiplies the same a row by e (R0), accumulates (ACC.ADD) and stores the row
(ACTIVATE.QUANTIZE identity), also loading the next a row (rule 2) and carrying the branch --
and the last row is short and emitted straight-line with its own DS half, the row before it
straight-line too, so nothing loads past a's region. The measured distance over the
sweep is at most 2 steps of the output row's grid (tolerance NX8_STEP 3, one step of
margin); cost: 17 prologue words once per call, two words per row --
32768 elements in 532 cycles. Domain: numel
1..262144, op div, broadcast row with inner 16..128 (a power of two; inner > 128 and the other
ops/broadcasts are in `unsupported`, each for a stated reason); b's generator range [0.25, 4]
keeps the reciprocal finite -- the program itself is scale-invariant, only b = 0 (an infinity,
not a value) is out. There is no FP32 variant: dynamic is the chip's NX8 type and the program
is format-transparent. Every LR the program reads is set by it, R_ACC is initialised by the
ACC.ADD.FIRST of every row and R_MASK is loaded from its own scratch row, so it runs after
another kernel as well as from reset (the verifier's chain run)."""
