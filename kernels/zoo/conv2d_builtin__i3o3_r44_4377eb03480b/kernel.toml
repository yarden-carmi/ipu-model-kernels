[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 64
[params.cout]
type = "int"
min = 1
max = 512
default = 64
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 1
max = 224
default = 56
[params.w]
type = "int"
min = 1
max = 224
default = 56
[params.kh]
type = "int"
choices = [3, 7]
default = 3
[params.kw]
type = "int"
choices = [3, 7]
default = 3
[params.padding]
type = "int"
min = 0
max = 3
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 224
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 224
default = 56
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 512
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 228
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[derived]
chunks = "ceil(in0_d3 / 128)"
lines = "in0_d1 * in0_d2"
pitch = "chunks * stride"
weight_rows = "1 + 3 * out0_d1 * in0_d1"
full = "ds(128)"
in_tail = "ds((in0_d3 - 1) % 128 + 1)"
out_tail = "ds(out0_d3)"
src_lo = "100925952"
src_hi = "235670024"
dst_lo = "50462976"
dst_hi = "117835012"

[inputs.in0]
shape = ["lines", "chunks", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[scratch.clean]
shape = ["lines", "pitch", 128]
[outputs.out0]
shape = ["out0_d1", "out0_d2", 128]

[abi]
in0 = "CR2"
weights = "CR3"
clean = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
in_tail = "CR9"
out_tail = "CR10"
weight_rows = "CR11"
src_lo = "CR12"
src_hi = "CR13"
dst_lo = "CR14"
dst_hi = "CR15"
lines = "LR13"

[cases.default]
