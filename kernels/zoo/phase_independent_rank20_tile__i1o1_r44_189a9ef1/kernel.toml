[kernel]
op = "phase_independent_rank20_tile"
formats = ["e2"]

[params.cin]
type = "int"
min = 3
max = 128
default = 48
[params.cout]
type = "int"
min = 3
max = 128
default = 48
[params.h]
type = "int"
min = 1
max = 4096
default = 16
[params.w]
type = "int"
min = 1
max = 4096
default = 16
[params.kh]
type = "int"
min = 1
max = 128
default = 4
[params.kw]
type = "int"
min = 1
max = 128
default = 4
[params.in0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.in0_d1]
type = "int"
min = 3
max = 128
default = 48
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 4096
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.out0_d1]
type = "int"
min = 3
max = 128
default = 48
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 16384
default = 64

[derived]
rank = "min(cin, cout) * 5 // 12"
full = "ds(128)"
outds = "ds(out0_d1)"
height = "in0_d0 * in0_d2"
row_skip = "(kh - 1) * out0_d3"

[inputs.in0]
shape = ["height * in0_d3", 128]
range = [-1, 1]
[inputs.coeff]
shape = ["2 * (1 + kh * kw * (cin + rank))", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3", 128]
[scratch.tmp]
shape = [2, 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
cin = "CR8"
rank = "CR9"
full = "CR10"
in0_d3 = "CR11"
out0_d3 = "CR12"
height = "CR13"
outds = "CR14"
row_skip = "CR15"

[cases.default]
