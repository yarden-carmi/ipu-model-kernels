[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 16
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 65536
default = 16384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 128

[derived]
stripes = "in0_d0 * in0_d2"
narrow = "1 - min(1, max(0, in0_d3 - 32))"
compact = "min(1, max(0, in0_d3 - 64)) * min(1, max(0, k - 16)) * (1 - min(1, max(0, k - 32)))"
full_blocks = "(k - 2 * compact - 1) // 32"
dot_blocks = "(k + 127) // 128"
pair = "1 - min(1, max(in0_d3 - 64, 64 - in0_d3))"
full = "ds(128) + pair * 16777216"
aux = "(1 - pair) * dot_blocks + pair * k"
bias_rows = "2 * min(1, max(0, k - 64))"
active = "ds(out0_d3)"

[inputs.in0]
shape = ["stripes * in0_d1", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["narrow * n * (2 + 2 * dot_blocks) + (1 - narrow) * (n * (2 * (1 + full_blocks) + bias_rows + compact) + 1)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d1", 128]

[scratch.pixels]
shape = ["max(1, narrow * 2 * in0_d3 * dot_blocks, pair * (k + 2))", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
k = "CR8"
n = "CR9"
stripes = "CR10"
active = "CR11"
pixels = "CR12"
full_blocks = "CR13"
full = "CR14"
aux = "CR15"

[cases.default]
