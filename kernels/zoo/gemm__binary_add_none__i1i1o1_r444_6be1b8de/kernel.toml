[kernel]
op = "gemm__binary_add_none"
formats = ["e2"]

[params]
s0_bias = {type = "bool", default = true}
s0_k = {type = "int", min = 1, max = 4096, default = 256}
s0_m = {type = "int", min = 1, max = 65536, default = 4096}
s0_n = {type = "int", min = 1, max = 64, default = 64}
s1_broadcast = {type = "str", choices = ["none"], default = "none"}
s1_inner = {type = "int", min = 0, max = 0, default = 0}
s1_numel = {type = "int", min = 1, max = 4194304, default = 262144}
s1_op = {type = "str", choices = ["add"], default = "add"}
in0_d0 = {type = "int", min = 1, max = 256, default = 1}
in0_d1 = {type = "int", min = 1, max = 4096, default = 256}
in0_d2 = {type = "int", min = 1, max = 1024, default = 64}
in0_d3 = {type = "int", min = 2, max = 1024, multiple_of = 2, default = 64}
in1_d0 = {type = "int", min = 1, max = 256, default = 1}
in1_d1 = {type = "int", min = 1, max = 64, default = 64}
in1_d2 = {type = "int", min = 1, max = 1024, default = 64}
in1_d3 = {type = "int", min = 2, max = 1024, multiple_of = 2, default = 64}
out0_d0 = {type = "int", min = 1, max = 256, default = 1}
out0_d1 = {type = "int", min = 1, max = 64, default = 64}
out0_d2 = {type = "int", min = 1, max = 1024, default = 64}
out0_d3 = {type = "int", min = 2, max = 1024, multiple_of = 2, default = 64}

[derived]
chunks = "ceil(in0_d1 / 128)"
pairs = "out0_d0 * out0_d2 * out0_d3 // 2"
output_ds = "ds(2 * out0_d1)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * chunks", 128]
[inputs.in1]
shape = ["in1_d0 * in1_d2 * in1_d3 // 2", 128]
[inputs.w]
shape = ["2 + 4 * s0_k", 128]
[outputs.out0]
shape = ["pairs", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR6"
qf_in0 = "CR7"
qf_in1 = "CR8"
qf_out0 = "CR9"
chunks = "CR10"
pairs = "CR11"
output_ds = "CR13"

[cases.default]
