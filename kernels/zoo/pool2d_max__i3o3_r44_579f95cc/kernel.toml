[kernel]
op = "pool2d"
formats = ["e1"]

[params.channels]
type = "int"
min = 1
max = 4096
default = 64

[params.h]
type = "int"
min = 1
max = 4096
default = 112

[params.w]
type = "int"
min = 1
max = 128
default = 112

[params.k]
type = "int"
min = 1
max = 31
default = 3

[params.kind]
type = "str"
choices = ["max"]
default = "max"

[params.padding]
type = "int"
min = 0
max = 15
default = 1

[params.stride]
type = "int"
min = 1
max = 32
default = 2

[params.in0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64

[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 112

[params.in0_d3]
type = "int"
min = 1
max = 128
default = 112

[params.out0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64

[params.out0_d2]
type = "int"
min = 1
max = 8192
default = 56

[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d1", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d1", 128]

[derived]
vertical_step = "stride * in0_d1"
initial_row = "-padding * in0_d1"
batch_delta = "(in0_d2 - out0_d2 * stride) * in0_d1"
output_rows = "out0_d0 * out0_d2 * out0_d1"
interior_end = "min(out0_d3, (in0_d3 + padding - k) // stride + 1)"
window_ds = "ds(k)"
scalar_ds = "ds(1)"
output_ds = "ds(out0_d3)"

[abi]
in0 = "CR2"
out0 = "CR3"
in0_d3 = "CR4"
in0_d2 = "CR5"
in0_d1 = "CR6"
out0_d2 = "CR7"
output_rows = "CR8"
out0_d3 = "CR9"
interior_end = "CR10"
window_ds = "CR11"
scalar_ds = "CR12"
output_ds = "CR13"
qf_in0 = "CR14"
qf_out0 = "CR15"
vertical_step = "LR1"
initial_row = "LR2"
batch_delta = "LR15"

[cases.default]
