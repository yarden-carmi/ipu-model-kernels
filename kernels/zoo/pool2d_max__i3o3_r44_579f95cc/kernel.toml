[kernel]
op = "pool2d"
formats = ["e1"]

[params.channels]
type = "int"
min = 1
max = 4096
default = 64

[params.h]
type = "int"
min = 1
max = 4096
default = 112

[params.w]
type = "int"
min = 1
max = 128
default = 112

[params.k]
type = "int"
min = 1
max = 128
default = 3

[params.kind]
type = "str"
choices = ["max"]
default = "max"

[params.padding]
type = "int"
min = 0
max = 64
default = 1

[params.stride]
type = "int"
min = 1
max = 128
default = 2

[params.in0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64

[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 112

[params.in0_d3]
type = "int"
min = 1
max = 128
default = 112

[params.out0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64

[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 56

[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d1", 128]

[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d1", 128]

[derived]
window_and_width = "k + 65536 * in0_d3"
output_dims = "out0_d3 + 65536 * out0_d2"
step_and_pad = "stride + 65536 * padding"
reduce_ds = "ds(k) + 65536 * ds(1)"
store_ds = "ds(out0_d3)"
step_rows = "stride * in0_d1"
pad_rows = "padding * in0_d1"
window_rows = "k * in0_d1"
batch_rows = "in0_d2 * in0_d1"
interior_begin = "min(out0_d3, ceil(padding / stride))"
interior_last_pre = "max(interior_begin, min(out0_d3, (in0_d3 + padding - k) // stride + 1)) - 2"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
window_and_width = "CR6"
output_dims = "CR7"
step_and_pad = "CR8"
reduce_ds = "CR9"
store_ds = "CR10"
in0_d1 = "CR11"
step_rows = "CR12"
pad_rows = "CR13"
window_rows = "CR14"
batch_rows = "CR15"
interior_begin = "LR13"
interior_last_pre = "LR14"
out0_d0 = "LR15"

[cases.default]
