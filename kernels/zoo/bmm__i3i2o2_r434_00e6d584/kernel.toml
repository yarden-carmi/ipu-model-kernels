[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=65535, default=16}
k = {type="int", min=1, max=128, default=48}
m = {type="int", min=1, max=32767, default=64}
n = {type="int", min=1, max=32767, default=64}
in0_d0 = {type="int", min=1, max=32767, default=4}
in0_d1 = {type="int", min=1, max=32767, default=4}
in0_d2 = {type="int", min=1, max=32767, default=64}
in0_d3 = {type="int", min=1, max=65535, default=48}
in1_d0 = {type="int", min=1, max=32767, default=4}
in1_d1 = {type="int", min=1, max=32767, default=64}
in1_d2 = {type="int", min=1, max=65535, default=576}
out0_d0 = {type="int", min=1, max=32767, default=4}
out0_d1 = {type="int", min=1, max=32767, default=4}
out0_d2 = {type="int", min=1, max=32767, default=64}
out0_d3 = {type="int", min=1, max=32767, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ac*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "bc*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]

[derived]
ac = "ceil(in0_d3/128)"
bc = "ceil(in1_d2/128)"
abc = "ac+65536*bc"
groups = "b//out0_d1"
bstart = "in1_d2//3"
askip = "(in0_d2-1)*in0_d1*ac"
astride = "in0_d1*ac"
ds = "ds(128)+65536*ds((m-1)%128+1)"
mh = "m+65536*out0_d1"
bstride = "in1_d1*bc"
kd = "ds(k)+65536*k"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
mh = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
ds = "CR9"
bstart = "CR10"
abc = "CR11"
kd = "CR12"
n = "CR13"
astride = "CR14"
bstride = "CR15"
askip = "LR13"
groups = "LR15"

[cases.default]
