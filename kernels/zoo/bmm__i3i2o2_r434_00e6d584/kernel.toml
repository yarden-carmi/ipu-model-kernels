[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=65535, default=16}
k = {type="int", min=1, max=128, default=48}
m = {type="int", min=1, max=32767, default=64}
n = {type="int", min=1, max=65535, default=64}
in0_d0 = {type="int", min=1, max=65535, default=4}
in0_d1 = {type="int", min=1, max=65535, default=4}
in0_d2 = {type="int", min=1, max=32767, default=64}
in0_d3 = {type="int", min=1, max=128, default=48}
in1_d0 = {type="int", min=1, max=65535, default=4}
in1_d1 = {type="int", min=1, max=65535, default=64}
in1_d2 = {type="int", min=1, max=8388480, default=576}
out0_d0 = {type="int", min=1, max=65535, default=4}
out0_d1 = {type="int", min=1, max=65535, default=4}
out0_d2 = {type="int", min=1, max=32767, default=64}
out0_d3 = {type="int", min=1, max=65535, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "brows*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "tiles*128"]
[derived]
brows = "ceil(in1_d2/128)"
tiles = "ceil(m/128)"
ds = "ds(k) + ds(128)*65536"
tail_ds = "ds((m-1)%128+1)"
km = "k + m*65536"
nh = "n + in0_d1*65536"
strides = "brows"
a_group = "in0_d1*in0_d2"
b_group = "in1_d1*brows"
offset = "in0_d1*k"
groups = "b//in0_d1"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
tail_ds = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
ds = "CR9"
km = "CR10"
nh = "CR11"
strides = "CR12"
a_group = "CR13"
b_group = "CR14"
offset = "CR15"
groups = "LR12"

[cases.default]
