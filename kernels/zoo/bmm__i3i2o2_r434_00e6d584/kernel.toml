[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=256, default=16}
k = {type="int", min=1, max=128, default=48}
m = {type="int", min=1, max=4096, default=64}
n = {type="int", min=1, max=4096, default=64}
in0_d0 = {type="int", min=1, max=256, default=4}
in0_d1 = {type="int", min=1, max=256, default=4}
in0_d2 = {type="int", min=1, max=4096, default=64}
in0_d3 = {type="int", min=1, max=4096, default=48}
in1_d0 = {type="int", min=1, max=256, default=4}
in1_d1 = {type="int", min=1, max=4096, default=64}
in1_d2 = {type="int", min=1, max=1048576, default=576}
out0_d0 = {type="int", min=1, max=256, default=4}
out0_d1 = {type="int", min=1, max=256, default=4}
out0_d2 = {type="int", min=1, max=4096, default=64}
out0_d3 = {type="int", min=1, max=4096, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "arows*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "brows*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "tiles*128"]

[derived]
arows = "ceil(in0_d3/128)"
brows = "ceil(in1_d2/128)"
tiles = "ceil(out0_d2/128)"
astride = "in0_d1*arows"
ds = "ds(128) + ds((m-1)%128+1)*65536"
geometry = "arows + in0_d1*65536"
bc = "brows + n*65536"
mk = "m + k*65536"
groups = "b//in0_d1"
width = "128"
k_ds = "ds(k)"
b_group = "in1_d1*brows"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b_group = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
ds = "CR9"
astride = "CR10"
geometry = "CR11"
bc = "CR12"
mk = "CR13"
width = "CR14"
k_ds = "CR15"
groups = "LR15"

[cases.default]
