[kernel]
op = "quarter_grid_expand"
formats = ["e1", "e2"]

[params]
channels = { type = "int", min = 1, max = 65536, default = 1 }
h = { type = "int", min = 1, max = 4096, default = 16 }
w = { type = "int", min = 1, max = 42, default = 16 }
in0_d0 = { type = "int", min = 1, max = 65536, default = 1 }
in0_d1 = { type = "int", min = 1, max = 128, default = 64 }
in0_d2 = { type = "int", min = 1, max = 4096, default = 16 }
in0_d3 = { type = "int", min = 1, max = 42, default = 16 }
out0_d0 = { type = "int", min = 1, max = 65536, default = 1 }
out0_d1 = { type = "int", min = 1, max = 128, default = 64 }
out0_d2 = { type = "int", min = 1, max = 16386, default = 66 }
out0_d3 = { type = "int", min = 1, max = 16386, default = 66 }

[derived]
active = "ds(out0_d1)"
four = "4"
stride = "ceil(in0_d2 / 3)"
batch_extra = "(in0_d1 - 1) * stride"
three_w = "3 * w"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2 / 3)", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
active = "CR6"
h = "CR7"
w = "CR8"
out0_d3 = "CR9"
four = "CR10"
in0_d0 = "CR11"
in0_d1 = "CR12"
stride = "CR13"
batch_extra = "CR14"
three_w = "CR15"

[cases.default]
