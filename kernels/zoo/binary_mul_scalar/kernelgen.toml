kind = "exact"
method = "exact"
task = "binary_mul_scalar"
hw_clean = true
host_steps = []
chain_in = "a"
chain_out = "y"
unsupported = [
  "{\"broadcast\": \"scalar\", \"inner\": 0, \"numel\": 40960, \"op\": \"div\"}: no exact reciprocal: the AaQ stage's `reciprocal` is a hardware approximation and its result lands in an 8-bit block row before the multiply that uses it, so a quotient would carry an error the kernel's `exact` kind does not allow.",
  "{\"broadcast\": \"scalar\", \"inner\": 0, \"numel\": 40960, \"op\": \"min\"}: the accumulator has ADD, MAX and SUB only, so min needs a negation, and the AaQ stage's activation set (identity, relu, relu6, reciprocal, rsqrt, exp2, generic) holds none; a row round trip through XMEM to negate would be a different kernel.",
  "{\"broadcast\": \"none\", \"inner\": 0, \"numel\": 40960, \"op\": \"mul\"}: b is numel values here, one per lane; this kernel's datapath keeps b resident as one scalar (R1[0]) and takes the scalar broadcast only -- the same-shape case is another kernel's.",
  "{\"broadcast\": \"row\", \"inner\": 240, \"numel\": 40960, \"op\": \"mul\"}: b's row pointer would have to cycle over ceil(inner/128) rows while a's runs on; the LR stage has no non-power-of-two wrap and the multiply stage cannot build the lane rotation.",
  "{\"broadcast\": \"col\", \"inner\": 64, \"numel\": 40960, \"op\": \"mul\"}: one scalar per row of a, repeated along it, is this kernel's scalar path only when b is one value; a per-row scalar would need b's rows kept aligned with a's, which only works while inner divides numel.",
  "{\"broadcast\": \"scalar\", \"inner\": 1, \"numel\": 40960, \"op\": \"mul\"}: `inner` is 0 for a scalar (b is one value); a declared inner of 1 is not a shape this signature produces.",
  "{\"broadcast\": \"scalar\", \"inner\": 0, \"numel\": 45000001, \"op\": \"mul\"}: above the declared numel maximum (45000000). The program loops any number of rows; the maximum is a size choice.",
  "{\"broadcast\": \"scalar\", \"inner\": 0, \"numel\": 0, \"op\": \"mul\"}: an empty call: numel starts at 1.",
]
notes = """One parameterised program for every (op, numel): y[i] = a[i] op b[0] for op in
add, sub, mul, max, broadcast = scalar (b is one value, `inner` 0). a and y are the chip's
activation layout (row i holds elements 128i .. 128i+127, lanes past numel zero), so the kernel
reads the rows the previous kernel wrote and leaves rows the next one reads, with no repack and no
host step between them; b is one row, the scalar in lane 0. The shape reaches the program through
CRs only and the row loop is dynamic, so a whole call is one launch: 45000000 elements is 351563
iterations of the same one-word loop (~351567 cycles) and the host tiles nothing but numel.
Dataflow: the scalar is loaded ONCE into R1 and selected by an LR src of 128 (R1[0]), so a row of
`mul` is ONE word -- it loads the next a row into R_CYCLIC (LD.MULT.CYCLIC, read by MULT at cycle
start, written after), multiplies the resident row by the scalar (MULT.RC.VE), initialises the
accumulator with the product (ACC.ADD.FIRST) and stores it (ACTIVATE.QUANTIZE identity): 128 lanes
busy in every loop word, 40960 elements in 325 cycles. add/sub/max need the scalar as a second
product and broadcast: word A multiplies the resident a row by the CR constant 1.0 (MULT.RC.VE
against CR1) and initialises the accumulator, word B broadcasts b (MULT.EE of R1[0] by 1.0),
accumulates it (ACC.ADD / ACC.SUB / ACC.MAX) and stores the row -- two words per row, the
multiplier busy in both. The last row of a call is short (numel - 128*(rows-1) lanes) and is
emitted straight-line with its own DS half; the loop's last load brings exactly that row into
R_CYCLIC, nothing ever loads row `rows`, and its store names exactly the live lanes so the row's
scale never sees a lane past numel and those lanes are written 0. Every LR the program reads is
set by it, R_ACC is initialised by the .FIRST accumulate of every row and R_MASK is loaded from
its own scratch row, so it runs after another kernel as well as from reset. Limits: numel
1..45000000, op add|sub|mul|max, broadcast scalar with inner 0 (div/min and the other broadcast
modes are in `unsupported`, each for a stated reason); there is no FP32 variant -- dynamic is the
chip's NX8 type. Accuracy: the products and the accumulator adds are exact in FP32 and only the
store rounds, so the golden (float64, quantized row by row like the store) matches at max |err| 0
on every case, tolerance NX8_STEP 1 ulp."""
