[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 1024
default = 64
[params.cout]
type = "int"
min = 1
max = 1024
default = 64
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 1
max = 1024
default = 64
[params.w]
type = "int"
choices = [8, 16, 32, 64, 128]
default = 64
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1024
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 1024
default = 64
[params.in0_d3]
type = "int"
choices = [8, 16, 32, 64, 128]
default = 64
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 1024
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 1024
default = 64
[params.out0_d3]
type = "int"
choices = [4, 8, 16, 32, 64, 128]
default = 64
[derived]
tiles = "ceil(in0_d2 / (128 // in0_d3))"
out_tiles = "ceil(out0_d2 / (128 // out0_d3))"
last = "tiles - 1"
narrow = "1 - min(1, in0_d3 - 8)"
weight_rows = "3 * narrow * (1 + 9 * cin) + 2 * (1 - narrow) * ceil(cin / 14)"
weight_end = "1 + cout * weight_rows"
parts = "min(8, 128 // in0_d3)"
partition_code = "min(1, parts - 1) + min(1, max(0, parts - 2)) + min(1, max(0, parts - 4))"
full = "ds(128) + 65536 * (4096 * parts + 256 * partition_code + 128 // parts)"
out_tail = "ds(out0_d2 * out0_d3 - 128 * (out_tiles - 1))"
input_tail = "ds(in0_d2 * in0_d3 - 128 * last)"

[inputs.in0]
shape = ["in0_d1", "tiles", 128]
range = [-2, 2]
[inputs.weights]
shape = ["weight_end", 128]
range = [-1, 1]
[scratch.decimate]
shape = ["1 + (stride - 1) * last", 128]
[outputs.out0]
shape = ["out0_d1", "out_tiles", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
last = "CR8"
weight_rows = "CR9"
weight_end = "CR10"
cin = "CR11"
decimate = "CR12"
out_tail = "CR13"
input_tail = "CR14"
full = "CR15"

[cases.default]
