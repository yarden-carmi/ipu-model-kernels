[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params]
act_out0 = {type = "str", choices = ["silu"], default = "silu"}
bias = {type = "bool", default = true}
k = {type = "int", min = 1, max = 4096, default = 64}
m = {type = "int", min = 1, max = 65535, default = 4096}
n = {type = "int", min = 16, max = 4096, multiple_of = 16, default = 256}
in0_d0 = {type = "int", min = 1, max = 4096, default = 1}
in0_d1 = {type = "int", min = 1, max = 4096, default = 64}
in0_d2 = {type = "int", min = 1, max = 65535, default = 64}
in0_d3 = {type = "int", choices = [8, 16, 32, 64, 128], default = 64}
out0_d0 = {type = "int", min = 1, max = 4096, default = 1}
out0_d1 = {type = "int", min = 16, max = 4096, multiple_of = 16, default = 256}
out0_d2 = {type = "int", min = 1, max = 65535, default = 64}
out0_d3 = {type = "int", choices = [8, 16, 32, 64, 128], default = 64}

[derived]
pack = "128 // out0_d3"
groups = "n // pack"
stripes = "out0_d0 * out0_d2"
input_rows = "in0_d0 * in0_d2 * in0_d1"
active = "ds(128)"
index_lo = "50462976"
index_hi = "117835012"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["groups * (2 * k + 2)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["stripes * groups", 128]
[scratch.broadcast]
shape = ["input_rows", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
lut = "CR4"
out0 = "CR5"
broadcast = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
active = "CR9"
input_rows = "CR10"
groups = "CR11"
stripes = "CR12"
index_lo = "CR13"
index_hi = "CR14"
k = "CR15"

[cases.default]
