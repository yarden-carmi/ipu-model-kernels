[kernel]
op = "binary_add"
formats = ["e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 128, max = 16777216, default = 15360 }
in0_d0 = { type = "int", min = 1, max = 1, default = 1 }
in0_d1 = { type = "int", min = 16, max = 16384, multiple_of = 16, default = 240 }
in0_d2 = { type = "int", min = 1, max = 16384, default = 8 }
in0_d3 = { type = "int", min = 1, max = 16384, default = 8 }
in1_d0 = { type = "int", min = 1, max = 1024, default = 4 }
in1_d1 = { type = "int", min = 8, max = 16384, multiple_of = 8, default = 16 }
in1_d2 = { type = "int", min = 16, max = 16384, multiple_of = 16, default = 240 }
out0_d0 = { type = "int", min = 1, max = 1024, default = 4 }
out0_d1 = { type = "int", min = 8, max = 16384, multiple_of = 8, default = 16 }
out0_d2 = { type = "int", min = 16, max = 16384, multiple_of = 16, default = 240 }

[derived]
blocks = "ceil(in0_d1 / 128)"
spatial_step = "out0_d0 * blocks"
phase_rows = "out0_d1 * out0_d2 // 128"
rows = "out0_d0 * phase_rows"
lane_limit = "128"
segments = "8"
src_lo = "50462976"
src_hi = "117835012"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "blocks * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1 * in1_d2"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "phase_rows * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
out0_d2 = "CR8"
spatial_step = "CR9"
phase_rows = "CR10"
rows = "CR11"
blocks = "CR12"
lane_limit = "CR13"
segments = "CR14"
src_lo = "LR14"
src_hi = "LR15"

[cases.default]
