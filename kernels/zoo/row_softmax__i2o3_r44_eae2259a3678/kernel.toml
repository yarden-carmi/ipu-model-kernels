[kernel]
op = "row_softmax"
formats = ["e1", "e2", "e3"]

[params]
n = { type = "int", min = 1, max = 4096, default = 64 }
rows = { type = "int", min = 1, default = 512 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 8 }
in0_d2 = { type = "int", min = 1, default = 64 }
in0_d3 = { type = "int", min = 1, default = 64 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 8 }
out0_d2 = { type = "int", min = 1, default = 64 }
out0_d3 = { type = "int", min = 1, default = 64 }

[derived]
pitch = "ceil(in0_d2 / 128)"
stride = "in0_d1 * pitch"
batch_skip = "(in0_d3 - 1) * stride"
count = "ceil(n / 128)"
tail_count = "n - (count - 1) * 128"
end = "rows * count"
tail = "ds(tail_count) + 65536 * pitch"
full = "ds(128) + 65536 * ds(1)"
scratch_formats = "56 + 65536 * 312"

[inputs.in0]
shape = ["in0_d0", "in0_d3", "in0_d1", "pitch", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3 / 128)", 128]

[scratch.tiles]
shape = [4, "count", 128]

[scratch.tmp]
shape = [8, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
tiles = "CR6"
tmp = "CR7"
stride = "CR8"
in0_d1 = "CR9"
in0_d2 = "CR10"
end = "CR11"
scratch_formats = "CR12"
batch_skip = "CR13"
full = "CR14"
tail = "CR15"
count = "LR14"
tail_count = "LR15"

[cases.default]
