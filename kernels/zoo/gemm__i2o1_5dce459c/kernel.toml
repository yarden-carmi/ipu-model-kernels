[kernel]
op = "gemm"
formats = ["e2", "e3"]
[params.m]
type = "int"
min = 1
max = 65536
default = 64
[params.k]
type = "int"
min = 1
max = 4096
default = 240
[params.n]
type = "int"
min = 1
max = 4096
default = 720
[params.bias]
type = "bool"
default = true
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 240
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 720
[derived]
chunks = "ceil(in0_d2 / 128)"
group_stride = "in0_d1 * chunks"
count = "out0_d1"
width = "128"
groups = "out0_d0"
channels = "out0_d2"
tail = "ds(1 + (out0_d1 - 1) % 128)"
[inputs.in0]
shape = ["in0_d0 * group_stride", 128]
range = [-2, 2]
[inputs.w]
shape = ["n * chunks * 3", 128]
range = [-2, 2]
[inputs.b]
shape = ["3 * n", 128]
range = [-2, 2]
when = "bias"
[outputs.out0]
shape = ["out0_d0 * out0_d2 * ceil(out0_d1 / 128)", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
count = "CR6"
chunks = "CR7"
channels = "CR8"
qf_in0 = "CR9"
qf_out0 = "CR10"
width = "CR11"
groups = "CR12"
group_stride = "CR13"
tail = "CR14"
[golden]
tolerance = { e2 = "NX8_STEP", e3 = "NX8_STEP" }
[cases.default]
