[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 240
[params.m]
type = "int"
min = 1
max = 65536
default = 64
[params.n]
type = "int"
min = 1
max = 4096
default = 720
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 240
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 720

[derived]
chunks = "ceil(k / 128)"
full = "ds(128)"
one = "ds(1)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * chunks", 128]
range = [-2, 2]
[inputs.w]
shape = ["5 * n * (chunks + 1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
chunks = "CR7"
full = "CR8"
one = "CR9"
out0_d0 = "CR10"
out0_d1 = "CR11"
n = "CR12"

[cases.default]
