[kernel]
op = "gemm_builtin"
formats = ["e1", "e4"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 32
[params.n]
type = "int"
min = 1
max = 4096
default = 1
[params.m]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 32
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 4
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 4
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 1
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 4
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 4

[derived]
chunks = "ceil(k / 128)"
in_pitch = "ceil(in0_d1 / 128)"
tiles = "ceil(n / 128)"
full_chunks = "chunks - 1"
full = "ds(128)"
tail_k = "ds((k - 1) % 128 + 1)"
tail_n = "ds((n - 1) % 128 + 1)"
one = "ds(1)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * in_pitch", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * (1 + 2 * chunks)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_coeff = "CR6"
qf_out0 = "CR7"
full = "CR8"
tail_k = "CR9"
tail_n = "CR10"
one = "CR11"
m = "CR12"
in_pitch = "CR13"
full_chunks = "CR14"

[cases.default]
