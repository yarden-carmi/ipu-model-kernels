[kernel]
op = "gemm"
formats = ["e3"]

[params.m]
type = "int"
min = 1
max = 3136
default = 1
[params.k]
type = "int"
min = 32
max = 4096
multiple_of = 16
default = 128
[params.n]
type = "int"
min = 4
max = 50264
default = 128
[params.bias]
type = "bool"
default = false

[derived]
qf = "case_qf"
K = "ceil(k / 128)"
full_k = "k // 128"
NB = "ceil(n / 128)"
c128 = "128"
tail = "ds(n - (NB - 1) * 128)"

[inputs.in0]
shape = ["m * K", 128]
range = [-2.0, 2.0]
[inputs.w]
shape = ["k * NB", 128]
range = [-2.0, 2.0]
[inputs.b]
shape = ["NB * 128"]
range = [-2.0, 2.0]
when = "bias"
[outputs.out0]
shape = ["m * NB", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
K = "CR7"
NB = "CR8"
qf = "CR9"
tail = "CR10"
c128 = "CR11"
full_k = "CR12"

[golden]
tolerance = { e3 = "NX8_STEP" }

[cases.default]
m = 1
k = 256
n = 256
bias = true
[cases.nobias]
m = 2
k = 704
n = 256
bias = false

[cases.k32]
m = 3
k = 32
n = 48
bias = false
[cases.k336]
m = 3
k = 336
n = 64
bias = false
[cases.k192]
m = 2
k = 192
n = 192
bias = false
