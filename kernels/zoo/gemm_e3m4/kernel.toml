[kernel]
op = "gemm"
formats = ["e3"]

[params.m]
type = "int"
min = 1
max = 256
default = 1
[params.k]
type = "int"
min = 128
max = 4096
multiple_of = 128
default = 128
[params.n]
type = "int"
min = 128
max = 50264
default = 128
[params.bias]
type = "bool"
default = false

[derived]
qf = "case_qf"
K = "k // 128"
NB = "ceil(n / 128)"
c128 = "128"
tail = "ds(n - (NB - 1) * 128)"

[inputs.in0]
shape = ["m * K", 128]
range = [-2.0, 2.0]
[inputs.w]
shape = ["k * NB", 128]
range = [-2.0, 2.0]
[inputs.b]
shape = ["NB * 128"]
range = [-2.0, 2.0]
when = "bias"
[outputs.out0]
shape = ["m * NB", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
K = "CR7"
NB = "CR8"
qf = "CR9"
tail = "CR10"
c128 = "CR11"

[golden]
tolerance = { e3 = "NX8_STEP" }

[cases.default]
m = 1
k = 128
n = 128
bias = true
[cases.nobias]
m = 2
k = 256
n = 256
bias = false
[cases.bias_multitile]
m = 2
k = 384
n = 256
bias = true
[cases.tail]
m = 2
k = 256
n = 200
bias = false
