[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 3
[params.cout]
type = "int"
min = 1
max = 640
default = 16
[params.groups]
type = "int"
min = 1
max = 640
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 8
[params.w]
type = "int"
min = 1
max = 256
default = 8
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 3
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 8
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 256
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 8

[derived]
ix = "ceil(in0_d3 / 128)"
pack = "1 + (1 - min(1, max(out0_d3 - 64, 64 - out0_d3) + out0_d2 % 2))"
yb = "out0_d2 // pack"
full = "ds(128)"
valid = "ds(out0_d3 * pack)"
input_tail = "ds(1 + (in0_d3 - 1) % 128)"
plane = "9 * yb"
gc = "cin // groups"
wrows = "2 * (1 + gc) * cout"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ix", 128]
range = [-2, 2]
[inputs.weights]
shape = ["wrows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.windows]
shape = ["2 + cin * plane", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "yb", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
windows = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
full = "CR10"
valid = "CR11"
plane = "CR12"
gc = "CR13"
yb = "CR14"
input_tail = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
