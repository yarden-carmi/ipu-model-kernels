[kernel]
op = "conv2d_builtin"
formats = ["e1"]

[params]
act_out0 = {type = "str", choices = ["relu"], default = "relu"}
bias = {type = "bool", default = true}
cin = {type = "int", min = 1, default = 1}
cout = {type = "int", min = 1, default = 64}
groups = {type = "int", min = 1, default = 1}
h = {type = "int", min = 1, default = 224}
w = {type = "int", min = 1, default = 224}
kh = {type = "int", choices = [3, 7], default = 3}
kw = {type = "int", choices = [3, 7], default = 3}
padding = {type = "int", choices = [1, 3], default = 1}
stride = {type = "int", choices = [1], default = 1}
in0_d0 = {type = "int", choices = [1], default = 1}
in0_d1 = {type = "int", min = 1, default = 1}
in0_d2 = {type = "int", min = 1, default = 224}
in0_d3 = {type = "int", min = 1, default = 224}
out0_d0 = {type = "int", choices = [1], default = 1}
out0_d1 = {type = "int", min = 1, default = 64}
out0_d2 = {type = "int", min = 1, default = 224}
out0_d3 = {type = "int", min = 1, default = 224}

[derived]
chunks = "ceil(in0_d3 / 128)"
pitch = "in0_d2 * chunks"
group_rows = "pitch * (cin // groups)"
group_weights = "2 * (cin // groups) * (cout // groups)"
weight_rows = "1 + 2 * cout * (cin // groups)"
tail = "ds((out0_d3 - 1) % 128 + 1) + 65536 * ds((in0_d3 - 1) % 128 + 1)"
full = "ds(128)"
heights = "in0_d2"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "chunks", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
[scratch.clean]
shape = ["in0_d1 * pitch", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3 / 128)", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
pitch = "CR9"
group_rows = "CR10"
group_weights = "CR11"
weight_rows = "CR12"
chunks = "CR13"
heights = "CR14"
clean = "CR15"
qf_weights = "LR4"

[cases.default]
