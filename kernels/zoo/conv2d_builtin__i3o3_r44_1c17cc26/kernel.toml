[kernel]
op = "conv2d_builtin"
formats = ["e1"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 1
default = 1
[params.cout]
type = "int"
min = 1
max = 128
default = 64
[params.groups]
type = "int"
min = 1
max = 1
default = 1
[params.h]
type = "int"
min = 1
max = 224
default = 224
[params.w]
type = "int"
min = 1
max = 224
default = 224
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d2]
type = "int"
min = 1
max = 224
default = 224
[params.in0_d3]
type = "int"
min = 1
max = 224
default = 224
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 224
default = 224
[params.out0_d3]
type = "int"
min = 1
max = 224
default = 224

[derived]
input_pitch = "128 * ceil(in0_d3 / 128)"
output_pitch = "128 * ceil(out0_d3 / 128)"
full = "ds(128)"
tail = "ds((out0_d3 - 1) % 128 + 1)"
last_y = "in0_d2 - 1"
weight_rows = "1 + 2 * out0_d1"
last_weight = "2 * out0_d1"
input_rows = "in0_d0 * in0_d2 * ceil(in0_d3 / 128)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "input_pitch"]
range = [-2, 2]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "output_pitch"]

[scratch.clean]
shape = ["input_rows", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
in0_d0 = "LR10"
tail = "CR7"
full = "CR13"
last_y = "CR8"
last_weight = "CR9"
clean = "CR10"
input_rows = "CR11"

[cases.default]
[golden]
tolerance = { e1 = "NX8_STEP" }
