[kernel]
op = "reduce_rows_mean"
formats = ["e1", "e2"]

[params.kind]
type = "str"
choices = ["mean"]
default = "mean"
[params.n]
type = "int"
min = 1
max = 65535
default = 49
[params.rows]
type = "int"
min = 1
max = 16384
default = 576
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 576
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 7
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 7
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 576
[params.out0_d2]
type = "int"
choices = [1]
default = 1
[params.out0_d3]
type = "int"
choices = [1]
default = 1
[derived]
fit = "min(in0_d2, 128 // in0_d3)"
half_fit = "min(1, 256 // (in0_d2 * in0_d3)) * (1 - in0_d2 % 2) * min(1, in0_d2 - fit)"
pack = "max(1 + (fit - 1) * (1 - min(1, in0_d2 % fit)), 1 + half_fit * (in0_d2 // 2 - 1))"
spatial_rows = "in0_d2 // pack"
lanes = "in0_d3 * pack"
active = "ds(lanes)"
scalar = "ds(1)"
vec = "ds(33)"
width = "8"
fold_ds = "ds(9)"
fold_end = "9"
main_end = "n // 32 * 32"
vector_end = "n // 8 * 8"
# The reciprocal is normalized against the next power of two.
shift = "min(1, (n-1)//1) + min(1, (n-1)//2) + min(1, (n-1)//4) + min(1, (n-1)//8) + min(1, (n-1)//16) + min(1, (n-1)//32) + min(1, (n-1)//64) + min(1, (n-1)//128) + min(1, (n-1)//256) + min(1, (n-1)//512) + min(1, (n-1)//1024) + min(1, (n-1)//2048) + min(1, (n-1)//4096) + min(1, (n-1)//8192) + min(1, (n-1)//16384) + min(1, (n-1)//32768)"
factor = "1 + min(1, (n-1)//1) + 2*min(1, (n-1)//2) + 4*min(1, (n-1)//4) + 8*min(1, (n-1)//8) + 16*min(1, (n-1)//16) + 32*min(1, (n-1)//32) + 64*min(1, (n-1)//64) + 128*min(1, (n-1)//128) + 256*min(1, (n-1)//256) + 512*min(1, (n-1)//512) + 1024*min(1, (n-1)//1024) + 2048*min(1, (n-1)//2048) + 4096*min(1, (n-1)//4096) + 8192*min(1, (n-1)//8192) + 16384*min(1, (n-1)//16384) + 32768*min(1, (n-1)//32768)"
mantissa = "(256 * factor + n) // (2 * n) - 128"
carry = "mantissa // 128"
inv = "65536 + 256 * (127 - shift + carry) + mantissa % 128"
inv_fp32 = "8388608 * (127 - shift) + (8388608 * factor + n // 2) // n - 8388608"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * spatial_rows", 128]
[outputs.out0]
shape = ["out0_d1", 128]
[scratch.sum_row]
shape = ["n // 512 + 1", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
active = "CR6"
spatial_rows = "CR7"
lanes = "CR8"
inv = "CR9"
inv_fp32 = "CR10"
out0_d1 = "CR11"
scalar = "CR12"
sum_row = "CR13"
vec = "CR14"
width = "LR13"
main_end = "LR10"
vector_end = "LR11"
fold_ds = "CR15"
fold_end = "LR12"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
