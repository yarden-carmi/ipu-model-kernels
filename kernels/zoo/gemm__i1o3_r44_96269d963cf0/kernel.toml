[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
default = 64
[params.m]
type = "int"
min = 1
default = 16384
[params.n]
type = "int"
min = 1
default = 64
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 64
[params.in0_d2]
type = "int"
min = 1
default = 128
[params.in0_d3]
type = "int"
min = 1
default = 128
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 64
[params.out0_d2]
type = "int"
min = 1
default = 128
[params.out0_d3]
type = "int"
min = 1
default = 128

[derived]
chunks = "ceil(k / 128)"
input_chunks = "ceil(in0_d1 / 128)"
skip = "input_chunks - chunks"
stripes = "out0_d0 * out0_d2"
tiles = "ceil(out0_d3 / 128)"
tail_count = "(out0_d3 - 1) % 128 + 1"
full = "ds(128)"
tail = "ds(tail_count)"
lanes = "128"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * input_chunks", 128]
[inputs.coeff]
shape = ["n * (2 + 2 * chunks)", 128]
[outputs.out0]
shape = ["out0_d1 * stripes * tiles", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
stripes = "CR9"
tiles = "CR10"
chunks = "CR11"
tail_count = "CR12"
lanes = "CR13"
skip = "CR14"
n = "CR15"

[cases.default]
