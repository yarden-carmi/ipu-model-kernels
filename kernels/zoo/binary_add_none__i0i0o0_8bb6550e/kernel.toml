[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 16777216
default = 147456
[params.in0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 144
[params.in1_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 144
[params.out0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 144

[derived]
active = "ds(out0_d0)"
in0_rows = "in0_d1 * in0_d2"
in1_rows = "in1_d1 * in1_d2"
out_rows = "out0_d1 * out0_d2"

[inputs.in0]
shape = ["in0_rows", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_rows", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
active = "CR8"
in0_rows = "CR9"
out0_d1 = "CR10"
out0_d2 = "CR11"
out0_d0 = "CR12"

[cases.default]
[golden]
tolerance = { e2 = "EXACT" }
