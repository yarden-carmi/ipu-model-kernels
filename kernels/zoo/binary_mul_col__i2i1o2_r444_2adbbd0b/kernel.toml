[kernel]
op = "binary_mul_col"
formats = ["e1"]

[params.broadcast]
type = "str"
choices = ["col"]
default = "col"
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.inner]
type = "int"
default = 16
[params.numel]
type = "int"
default = 50176
[params.in0_d2]
type = "int"
default = 56
[params.in0_d3]
type = "int"
default = 56

[derived]
capacity = "min(in0_d3, 128 // in0_d2)"
candidate = "max(1, in0_d3 // ((in0_d3 + capacity - 1) // capacity))"
pack = "1 + (candidate - 1) * (1 - min(1, in0_d3 % candidate))"
plane = "in0_d3 // pack"
last_prefetch = "plane - 1"
valid = "ds(in0_d2 * pack)"

[inputs.in0]
shape = ["inner * plane", 128]
range = [-2, 2]
[inputs.in1]
shape = ["(inner + 127) // 128", 128]
range = [-2, 2]
[outputs.out0]
shape = ["inner * plane", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
inner = "CR8"
plane = "CR9"
last_prefetch = "CR10"
valid = "CR15"

[cases.default]
numel = 50176
