chain = ["binary"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

[layout.in0]
lanes = 2
rows = [0, 1, 3]
pack = "1 + (max(1, d3 // ceil(d3 / min(d3, 128 // d2))) - 1) * (1 - min(1, d3 % max(1, d3 // ceil(d3 / min(d3, 128 // d2)))))"
[view.in0]
kind = "whole"

[layout.in1]
lanes = 1
rows = [0, 2, 3]
[view.in1]
kind = "whole"

[layout.out0]
lanes = 2
rows = [0, 1, 3]
pack = "1 + (max(1, d3 // ceil(d3 / min(d3, 128 // d2))) - 1) * (1 - min(1, d3 % max(1, d3 // ceil(d3 / min(d3, 128 // d2)))))"
