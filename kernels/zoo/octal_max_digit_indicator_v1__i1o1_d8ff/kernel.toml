[kernel]
op = "octal_max_digit_indicator_v1"
formats = ["e2"]
[params.tokens]
type = "int"
min = 1
default = 256
[params.vocab]
type = "int"
min = 1
default = 30522
[inputs.in0]
shape = [1, "ceil(tokens / 128) * 128"]
[outputs.out0]
shape = ["tokens", "ceil(vocab / 128) * 128"]
[inputs.indices]
shape = ["ceil(vocab / 128)", 2, 128]
[inputs.ones]
shape = [1, 128]
[scratch.diff]
shape = [2, 128]
[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
indices = "CR7"
ones = "CR8"
diff = "CR9"
qf_indices = "CR10"
qf_ones = "CR11"
qf_diff = "CR12"
chunks = "CR6"
endds = "CR13"
width = "LR8"
fullds = "CR14"
tokens = "CR15"
[derived]
chunks = "ceil(vocab / 128)"
endds = "ds((vocab - 1) % 128 + 1)"
width = "128"
fullds = "ds(128)"
[cases.default]
tokens = 256
vocab = 30522
