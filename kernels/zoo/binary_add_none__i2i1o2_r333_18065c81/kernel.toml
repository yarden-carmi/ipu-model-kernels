[kernel]
op = "binary_add"
formats = ["e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
numel = { type = "int", min = 1, max = 16777216, default = 15360 }
in0_d0 = { type = "int", min = 1, max = 4096, default = 4 }
in0_d1 = { type = "int", min = 1, max = 16384, default = 16 }
in0_d2 = { type = "int", min = 1, max = 16384, default = 240 }
in1_d0 = { type = "int", min = 1, max = 4096, default = 4 }
in1_d1 = { type = "int", min = 1, max = 16384, default = 16 }
in1_d2 = { type = "int", min = 1, max = 16384, default = 240 }
out0_d0 = { type = "int", min = 1, max = 4096, default = 4 }
out0_d1 = { type = "int", min = 1, max = 16384, default = 16 }
out0_d2 = { type = "int", min = 1, max = 16384, default = 240 }

[derived]
width = "ceil(in0_d2 / 128)"
blocks = "ceil(in1_d1 / 128)"
rows = "out0_d0 * out0_d1 * ceil(out0_d2 / 128)"
tail = "ds((out0_d2 - 1) % 128 + 1) + ds(1) * 65536"
batch_stride = "in1_d2 * blocks"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "width * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "blocks * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "ceil(out0_d2 / 128) * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
rows = "CR8"
in0_d2 = "CR9"
tail = "CR10"
blocks = "CR11"
out0_d2 = "CR12"
out0_d1 = "CR13"
batch_stride = "CR14"

[cases.default]
