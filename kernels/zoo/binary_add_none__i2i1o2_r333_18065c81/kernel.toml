[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 49152
[params.in0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.in0_d1]
type = "int"
min = 4
max = 256
multiple_of = 4
default = 64
[params.in0_d2]
type = "int"
min = 16
max = 352
multiple_of = 16
default = 192
[params.in1_d0]
type = "int"
min = 4
max = 4
default = 4
[params.in1_d1]
type = "int"
min = 4
max = 256
multiple_of = 4
default = 64
[params.in1_d2]
type = "int"
min = 16
max = 352
multiple_of = 16
default = 192
[params.out0_d0]
type = "int"
min = 4
max = 4
default = 4
[params.out0_d1]
type = "int"
min = 4
max = 256
multiple_of = 4
default = 64
[params.out0_d2]
type = "int"
min = 16
max = 352
multiple_of = 16
default = 192

[derived]
width = "ceil(out0_d2 / 128)"
in_width = "ceil(in0_d2 / 128)"
valid = "out0_d2 - (width - 1) * 128"
tail = "ds(valid) + 65536 * ds(64)"
scratch_format = "ds(1) + 65536 * 312"
tile_dest = "807407616"
seq_lo = "50462976"
seq_hi = "117835012"
in1_span = "ceil(in1_d1 / 128)"
limits = "(out0_d1 - 4) + 65536 * (out0_d0 - 1)"
num_tiles = "ceil(out0_d2 / 16)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in_width * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "in1_span * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "width * 128"]

[scratch.tiles]
shape = ["1 + ceil(out0_d2 / 16)", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
tiles = "CR8"
tile_dest = "CR9"
tail = "CR10"
seq_lo = "CR11"
seq_hi = "CR12"
limits = "CR13"
scratch_format = "CR14"
num_tiles = "LR14"

[cases.default]
