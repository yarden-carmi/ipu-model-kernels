[kernel]
op = "binary_add"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 64, max = 1048576, default = 147456 }
in0_d0 = { type = "int", min = 4, max = 4, default = 4 }
in0_d1 = { type = "int", min = 8, max = 256, multiple_of = 8, default = 256 }
in0_d2 = { type = "int", min = 32, max = 256, multiple_of = 16, default = 144 }
in1_d0 = { type = "int", min = 4, max = 4, default = 4 }
in1_d1 = { type = "int", min = 8, max = 256, multiple_of = 8, default = 256 }
in1_d2 = { type = "int", min = 32, max = 256, multiple_of = 16, default = 144 }
out0_d0 = { type = "int", min = 4, max = 4, default = 4 }
out0_d1 = { type = "int", min = 8, max = 256, multiple_of = 8, default = 256 }
out0_d2 = { type = "int", min = 32, max = 256, multiple_of = 16, default = 144 }

[derived]
width = "ceil(out0_d2 / 128)"
fast = "1 // (1 + (out0_d2 - 144) * (out0_d2 - 144))"
tail = "ds(out0_d2 - (width - 1) * 128) + 65536 * (out0_d2 // 16 + 1)"
seq_lo = "50462976"
seq_hi = "117835012"
dest_gap = "1077952576"
limits = "fast * 807407616 + (1 - fast) * ((out0_d1 - 8) + 65536 * (out0_d2 // 16 - 1))"
scratch_format = "312 + 65536 * 328"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2 / 128) * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "ceil(in1_d1 / 128) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "width * 128"]
[scratch.tiles]
shape = ["2 + fast + 2 * (out0_d2 // 16)", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
tiles = "CR8"
dest_gap = "CR9"
tail = "CR10"
seq_lo = "CR11"
seq_hi = "CR12"
limits = "CR13"
scratch_format = "CR14"

[cases.default]
