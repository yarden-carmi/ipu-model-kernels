[kernel]
op = "base107_l1_indicator_new"
formats = ["e2"]
[params.tokens]
type = "int"
min = 1
default = 256
[params.vocab]
type = "int"
min = 1
default = 30522
[inputs.in0]
shape = ["ceil(tokens / 128)", 128]
range = [0, 100]
[inputs.idx]
shape = ["3*vocab+1", 128]
[outputs.out0]
shape = ["vocab", "ceil(tokens / 128)", 128]
[scratch.tmp]
shape = [1, 128]
[derived]
blocks = "ceil(tokens / 128)"
tail = "ds((tokens - 1) % 128 + 1)"
full = "ds(128)"
unitrow = "3*vocab"
[abi]
in0 = "CR2"
idx = "CR3"
unitrow = "CR4"
out0 = "CR5"
tmp = "CR6"
qf_in0 = "CR7"
qf_idx = "CR8"
qf_tmp = "CR10"
qf_out0 = "CR11"
vocab = "CR12"
blocks = "CR13"
tail = "CR14"
full = "CR15"
[cases.default]
[golden]
tolerance = { e2 = "EXACT" }
