[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 256
default = 64
[params.cout]
type = "int"
min = 1
max = 256
default = 16
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 16
[params.w]
type = "int"
min = 1
max = 256
default = 16
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 256
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 16
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 256
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 256
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 256
default = 16

[derived]
pack = "1 + (max(1, 128 // in0_d3) - 1) * (1 - min(1, in0_d2 % max(1, 128 // in0_d3)))"
chunks = "ceil(in0_d3 / 128)"
blocks = "in0_d2 // pack"
plane = "blocks * chunks"
input_end = "plane * in0_d1"
full = "ds(128)"
head = "ds(min(128, pack * in0_d3))"
tail = "ds((pack * in0_d3 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d1", "plane", 128]
range = [-2, 2]
[inputs.weights]
shape = ["chunks", "out0_d1", "min(3, blocks)", "3 * (1 + 9 * in0_d1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d1", "plane", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
head = "CR8"
tail = "CR9"
plane = "CR10"
input_end = "CR11"
out0_d1 = "CR12"

[cases.default]
[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
