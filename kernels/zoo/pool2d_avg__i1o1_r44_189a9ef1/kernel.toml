[kernel]
op = "pool2d"
formats = ["e3"]

[params.channels]
type = "int"
min = 128
max = 1024
multiple_of = 128
default = 256
[params.h]
type = "int"
min = 2
max = 56
multiple_of = 2
default = 4
[params.w]
type = "int"
min = 2
max = 56
multiple_of = 2
default = 6
[params.k]
type = "int"
choices = [2]
default = 2
[params.padding]
type = "int"
choices = [0]
default = 0
[params.stride]
type = "int"
choices = [2]
default = 2
[params.kind]
type = "str"
choices = ["avg"]
default = "avg"

[derived]
ds_full = "ds(128)"
blocks = "channels // 128"
row_step = "w * blocks"
oh = "h // 2"
ow = "w // 2"

[inputs.in0]
shape = [1, "h", "w", "channels"]
range = [-10, 10]
[inputs.scale]
shape = [1, 128]
range = [0.25, 0.25]
[outputs.out0]
shape = [1, "oh", "ow", "channels"]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR11"
ds_full = "CR5"
blocks = "CR6"
row_step = "CR7"
oh = "CR8"
ow = "CR9"
scale = "CR10"

[golden]
tolerance = { e3 = "EXACT" }
[cases.default]
[cases.single]
channels = 128
h = 2
w = 2
[cases.blocks]
channels = [512, 1024]
h = 6
w = 4
