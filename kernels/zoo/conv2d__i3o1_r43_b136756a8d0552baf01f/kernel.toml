[kernel]
op = "conv2d"
formats = ["e2"]

[params.bias]
type = "bool"
default = false
[params.cin]
type = "int"
min = 1
max = 512
default = 3
[params.cout]
type = "int"
min = 1
max = 1024
default = 768
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 1
max = 1024
default = 224
[params.w]
type = "int"
min = 1
max = 1024
default = 224
[params.kh]
type = "int"
min = 1
max = 128
default = 32
[params.kw]
type = "int"
min = 1
max = 128
default = 32
[params.stride]
type = "int"
min = 1
max = 128
default = 32
[params.padding]
type = "int"
choices = [0]
default = 0
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 3
[params.in0_d2]
type = "int"
min = 1
max = 1024
default = 224
[params.in0_d3]
type = "int"
min = 1
max = 1024
default = 224
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 1048577
default = 50
[params.out0_d2]
type = "int"
min = 1
max = 1024
default = 768

[derived]
chunks = "ceil(in0_d3 / 128)"
ystep = "stride * chunks"
channel_gap = "(in0_d2 - kh) * chunks"
wo = "(w - kw) // stride + 1"
patches = "((h - kh) // stride + 1) * wo"
tiles = "ceil(out0_d1 / 128)"
prefix = "min(1, max(0, out0_d1 - patches))"
conv_tiles = "ceil((patches + prefix) / 128)"
taps = "cin * kh * kw"
panels = "ceil(taps / 128)"
full = "ds(128)"
tail = "ds(1 + (out0_d1 - 1) % 128)"
out_rows = "out0_d2 * tiles"
gather_src_lo = "stride * (256 + 2 * 65536 + 3 * 16777216)"
gather_src_hi = "stride * (4 + 5 * 256 + 6 * 65536 + 7 * 16777216)"
packed = "1 - min(1, max(wo - 16, 16 - wo) + max(chunks - 2, 2 - chunks) + max(0, kw + 15 * stride - 256) + max(0, stride - 16) + max(0, 128 - 15 * stride) + patches % 128 + max(out0_d1 - patches - 1, patches + 1 - out0_d1))"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2 * chunks", 128]
range = [-1, 1]
[inputs.weights]
shape = ["cout * panels", 128]
range = [-1, 1]
[inputs.seed]
shape = ["out_rows", 128]
range = [-1, 1]
[inputs.aux]
shape = ["2 * (1 - packed) + packed * cout * cin * kh", 128]
range = [-1, 1]
[scratch.gathered]
shape = ["taps * conv_tiles", 128]
[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
weights = "CR3"
seed = "CR4"
aux = "CR5"
gathered = "CR6"
out0 = "CR7"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_seed = "CR10"
qf_aux = "CR11"
qf_out0 = "CR12"
full = "CR13"
tail = "CR14"
patches = "CR15"
channel_gap = "LR15"
wo = "LR13"
ystep = "LR14"

[cases.default]
