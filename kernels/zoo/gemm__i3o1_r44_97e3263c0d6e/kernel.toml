[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 384
[params.m]
type = "int"
min = 1
max = 65536
default = 257
[params.n]
type = "int"
min = 1
max = 65536
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 6
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 384
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 8
[derived]
tiles = "ceil(n / 128)"
full = "ds(128)"
tail = "ds((n - 1) % 128 + 1)"
height = "in0_d0 * in0_d2"
width = "in0_d3"
pack = "max(1, 128 // in0_d3)"
channel_rows = "ceil(in0_d1 / pack)"
minusone = "-1"

[inputs.in0]
shape = ["height * channel_rows", 128]
[inputs.w]
shape = ["tiles * (k + 1) * 3 + 1", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
height = "CR10"
width = "CR11"
k = "CR12"
pack = "CR13"
channel_rows = "CR14"
minusone = "CR15"

[golden]
tolerance = {e2 = "NX8_STEP", e3 = "NX8_STEP"}

[cases.default]
