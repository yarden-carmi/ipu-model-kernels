[kernel]
op = "binary_mul_scalar"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["scalar"], default = "scalar" }
const = { type = "int", min = 1, max = 1, default = 1 }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["mul"], default = "mul" }
numel = { type = "int", min = 1, max = 2147483647, default = 49152 }
in0_d0 = { type = "int", min = 1, max = 65536, default = 4 }
in0_d1 = { type = "int", min = 1, max = 65536, default = 64 }
in0_d2 = { type = "int", min = 1, max = 65536, default = 576 }
out0_d0 = { type = "int", min = 1, max = 65536, default = 4 }
out0_d1 = { type = "int", min = 1, max = 65536, default = 4 }
out0_d2 = { type = "int", min = 1, max = 65536, default = 64 }
out0_d3 = { type = "int", min = 2, max = 126, multiple_of = 2, default = 48 }

[derived]
chunks = "ceil(2 * in0_d1 / 128)"
input_batch = "ceil(in0_d2 / 2) * chunks"
output_pairs = "out0_d1 * out0_d3 // 2"
output_batch = "output_pairs * chunks"
ds_pair = "ds(2 * out0_d2 - 128 * (chunks - 1)) + 65536 * ds(128)"
fp_base = "0x4b010080"
fp_top = "fp_base + out0_d3"
head_width = "0x18600 + out0_d3 + 128"

[inputs.in0]
shape = ["in0_d0 * input_batch", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out0_d0 * output_batch", 128]

[scratch.scalar]
shape = [1, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
ds_pair = "CR6"
scalar = "CR7"
fp_top = "CR8"
fp_base = "CR9"
head_width = "CR10"
chunks = "CR11"
input_batch = "CR12"
output_batch = "CR13"
out0_d0 = "LR6"

[cases.default]
