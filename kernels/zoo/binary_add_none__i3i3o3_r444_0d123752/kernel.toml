[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
numel = { type = "int", min = 1, default = 65536 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 64 }
in0_d2 = { type = "int", min = 1, default = 32 }
in0_d3 = { type = "int", min = 1, max = 128, default = 32 }
in1_d0 = { type = "int", min = 1, default = 1 }
in1_d1 = { type = "int", min = 1, default = 64 }
in1_d2 = { type = "int", min = 1, default = 32 }
in1_d3 = { type = "int", min = 1, max = 128, default = 32 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 64 }
out0_d2 = { type = "int", min = 1, default = 32 }
out0_d3 = { type = "int", min = 1, max = 128, default = 32 }

[derived]
w = "out0_d3"
h = "out0_d2"
capacity = "128 // w"
pack = "1 + (capacity - 1) * max(1 - min(1, h % capacity), 1 - min(1, max(h * w - 64, 64 - h * w) + 128 % w)) - (1 - min(1, max(w - 32, 32 - w) + h % 4))"
plane_rows = "ceil(h / pack)"
full_rows = "plane_rows - 1"
rows = "out0_d0 * out0_d1 * plane_rows"
active = "ds(w * pack)"
tail = "ds(w * (h - full_rows * pack))"

[inputs.in0]
shape = ["rows", 128]
range = [-2, 2]

[inputs.in1]
shape = ["rows", 128]
range = [-2, 2]

[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
rows = "CR8"
active = "CR9"
tail = "CR10"
full_rows = "CR11"

[cases.default]
