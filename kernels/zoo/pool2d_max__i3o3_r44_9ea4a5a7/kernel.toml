[kernel]
op = "pool2d"
formats = ["e1"]

[params.channels]
type = "int"
min = 1
max = 128
default = 64

[params.h]
type = "int"
min = 1
max = 4096
default = 112

[params.w]
type = "int"
min = 1
max = 4096
default = 112

[params.k]
type = "int"
min = 3
max = 3
default = 3

[params.kind]
type = "str"
choices = ["max"]
default = "max"

[params.padding]
type = "int"
min = 1
max = 1
default = 1

[params.stride]
type = "int"
min = 2
max = 2
default = 2

[params.in0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 128
default = 64

[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 112

[params.in0_d3]
type = "int"
min = 1
max = 128
default = 112

[params.out0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64

[params.out0_d2]
type = "int"
min = 2
max = 4096
multiple_of = 2
default = 56

[params.out0_d3]
type = "int"
min = 1
max = 64
default = 56

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2 / 2", 128]

[derived]
planes = "out0_d0 * out0_d1"
valid = "ds(out0_d3 * 2)"
two = "ds(2)"
three = "ds(3)"
bulk = "1 + ((out0_d3 - 1) // 4) * 4"

[abi]
in0 = "CR2"
out0 = "CR3"
in0_d2 = "CR4"
out0_d3 = "CR5"
out0_d2 = "CR6"
planes = "CR7"
two = "CR8"
three = "CR9"
valid = "CR10"
bulk = "CR11"
qf_in0 = "CR14"
qf_out0 = "CR15"

[cases.default]
