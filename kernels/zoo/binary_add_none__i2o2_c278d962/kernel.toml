[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.const]
type = "float"
min = -448.0
max = 448.0
default = 1.0
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 786432
default = 384
[params.op]
type = "str"
choices = ["add"]
default = "add"

[params.in0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 1024
[derived]
rows = "in0_d0 * in0_d1 * ceil(in0_d2 / 128)"
last = "ceil(in0_d2 / 128) - 1"
ds_tail = "ds(in0_d2 - (ceil(in0_d2 / 128) - 1) * 128)"
[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2 / 128) * 128"]
range = [-2.0, 2.0]
[inputs.operand]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2 / 128) * 128"]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2 / 128) * 128"]
[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_operand = "CR9"
qf_out0 = "CR10"
rows = "CR6"
last = "CR7"
ds_tail = "CR8"
[golden]
tolerance = { e2 = "EXACT" }
[cases.default]
numel = 384
[cases.tiny]
numel = 1
[cases.tail]
numel = 257
[cases.partial]
numel = 513
