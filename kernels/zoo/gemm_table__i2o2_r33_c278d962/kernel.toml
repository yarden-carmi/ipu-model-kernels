[kernel]
op = "gemm_table"
formats = ["e2", "e3"]

[params.k]
type = "int"
min = 1
max = 4096
default = 768
[params.m]
type = "int"
min = 1
max = 65535
default = 256
[params.n]
type = "int"
min = 1
max = 4096
default = 3072
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["gelu_tanh"]
default = "gelu_tanh"
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 768
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 3072

[derived]
I = "ceil(in0_d2 / 128)"
O = "ceil(out0_d2 / 128)"
IR = "in0_d0 * in0_d1 * I"
OR = "out0_d0 * out0_d1 * O"
W = "O * (k + 1)"
full = "ds(128)"
tail = "ds(out0_d2 - 128 * (O - 1))"

[inputs.in0]
shape = ["IR", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["W", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["OR", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
I = "CR8"
O = "CR9"
m = "CR10"
full = "CR14"
tail = "CR15"

[cases.default]
k = 257
m = 3
n = 257
in0_d1 = 3
in0_d2 = 257
out0_d1 = 3
out0_d2 = 257
