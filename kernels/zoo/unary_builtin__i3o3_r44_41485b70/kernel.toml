[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 1
default = 262144

[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64

[derived]
rows = "numel // in0_d3"
last_row = "rows - 1"
penultimate = "rows - 2"
active = "ds(in0_d3)"

[inputs.in0]
shape = ["rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
last_row = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
active = "CR7"
penultimate = "CR8"

[cases.default]
