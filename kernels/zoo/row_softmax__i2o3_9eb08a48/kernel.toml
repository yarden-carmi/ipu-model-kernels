[kernel]
op = "row_softmax"
formats = ["e2", "e3", "e4"]
[params.n]
type = "int"
min = 1
max = 4096
default = 196
[params.rows]
type = "int"
min = 1
max = 1048576
default = 2352
[params.in0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 196
[params.in0_d3]
type = "int"
min = 1
max = 4096
default = 196
[params.out0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 12
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 196
[params.out0_d3]
type = "int"
min = 1
max = 4096
default = 196
[derived]
K = "ceil(n / 128)"
M = "rows * K"
active = "ds(128)"
part = "ds(min(128, n - (K - 1) * 128))"
batchadvance = "in0_d3 * ceil(in0_d2 / 128) - in0_d2 // 128"
[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "ceil(in0_d2 / 128) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3 / 128) * 128"]
[scratch.trans]
shape = ["rows", "K", 128]
[scratch.exps]
shape = ["K", 128]
[scratch.tmp]
shape = [19, 128]
[abi]
in0 = "CR2"
out0 = "CR3"
trans = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
K = "CR7"
M = "CR8"
exps = "CR9"
qf_out0 = "CR10"
batchadvance = "CR11"
in0_d2 = "CR12"
part = "CR14"
active = "CR15"
[golden]
tolerance = { e2 = "NX8_STEP", e3 = "NX8_STEP", e4 = "NX8_STEP" }
[cases.default]
n = 196
rows = 2352
