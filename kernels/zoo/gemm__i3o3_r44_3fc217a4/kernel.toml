[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 72
[params.m]
type = "int"
min = 1
max = 65536
default = 784
[params.n]
type = "int"
min = 1
max = 65536
default = 24
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 72
[params.in0_d2]
type = "int"
min = 4
max = 65536
multiple_of = 4
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 32
default = 28
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 24
[params.out0_d2]
type = "int"
min = 4
max = 65536
multiple_of = 4
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 32
default = 28

[derived]
groups = "ceil(in0_d2 / 4) * in0_d0"
inrows = "in0_d1 * groups"
outrows = "out0_d1 * ceil(out0_d2 / 4) * out0_d0"
full = "ds(128)"
valid = "ds(out0_d3 * 4)"

[inputs.in0]
shape = ["inrows", 128]
[inputs.w]
shape = ["n * (k + 1) * 3 + 1", 128]
[outputs.out0]
shape = ["outrows", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
groups = "CR7"
k = "CR8"
n = "CR9"
full = "CR10"
valid = "CR11"

[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}

[cases.default]
