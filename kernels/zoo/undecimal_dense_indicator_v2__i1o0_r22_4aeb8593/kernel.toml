[kernel]
op = "undecimal_dense_indicator_v2"
formats = ["e2"]
[params.tokens]
type = "int"
min = 256
max = 256
default = 256
[params.vocab]
type = "int"
min = 50265
max = 50265
default = 50265
[inputs.in0]
shape = [1, "tokens"]
[inputs.indices]
shape = ["vocab",3,128]
range = [0, 1]
[inputs.ones]
shape = [128]
range = [1,1]
[outputs.out0]
shape = ["vocab", "tokens"]
[scratch.tmp]
shape = [2,128]
[derived]
chunks = "tokens // 128"
[abi]
in0 = "CR2"
indices = "CR3"
ones = "CR4"
out0 = "CR5"
tmp = "CR6"
qf_in0 = "CR7"
qf_indices = "CR8"
qf_ones = "CR9"
qf_out0 = "CR10"
vocab = "CR11"
chunks = "CR12"
[cases.default]
tokens = 256
vocab = 50265
