[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 72
[params.cout]
type = "int"
min = 1
max = 512
default = 72
[params.groups]
type = "int"
min = 1
max = 512
default = 72
[params.h]
type = "int"
min = 1
max = 224
default = 56
[params.w]
type = "int"
min = 1
max = 128
default = 56
[params.kh]
type = "int"
choices = [3, 7]
default = 3
[params.kw]
type = "int"
choices = [3, 7]
default = 3
[params.padding]
type = "int"
min = 0
max = 3
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 72
[params.in0_d2]
type = "int"
min = 1
max = 224
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 512
default = 72
[params.out0_d2]
type = "int"
min = 1
max = 228
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 28

[derived]
group_in = "cin // groups"
blocks = "ceil(out0_d2 * out0_d3 / 128)"
alignment = "1 + (1-min(1,out0_d3%2)) + 2*(1-min(1,out0_d3%4)) + 4*(1-min(1,out0_d3%8)) + 8*(1-min(1,out0_d3%16)) + 16*(1-min(1,out0_d3%32)) + 32*(1-min(1,out0_d3%64)) + 64*(1-min(1,out0_d3%128))"
segments = "out0_d2 + blocks - 1 - ((out0_d2 - 1) * alignment // 128)"
weight_rows = "1 + 3 * cout * (blocks + segments * group_in * kh * kw)"
full = "ds(128) + 65536 * ds((out0_d2 * out0_d3 - 1) % 128 + 1)"
src_lo = "100925952"
src_hi = "235670024"
dst_lo = "50462976"
dst_hi = "117835012"

[inputs.in0]
shape = ["in0_d2", "in0_d1", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[scratch.rows]
shape = ["in0_d2", "in0_d1", 128]
[outputs.out0]
shape = ["out0_d1", "blocks", 128]

[abi]
in0 = "CR2"
weights = "CR3"
rows = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
group_in = "CR9"
in0_d2 = "CR10"
cin = "CR11"
src_lo = "CR12"
src_hi = "CR13"
dst_lo = "CR14"
dst_hi = "CR15"

[cases.default]
