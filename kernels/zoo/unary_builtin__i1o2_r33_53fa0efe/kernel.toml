[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 1
max = 2147483647
default = 65536

[params.in0_d0]
type = "int"
min = 1
max = 2
default = 2

[params.in0_d1]
type = "int"
min = 1
max = 512
default = 64

[params.in0_d2]
type = "int"
min = 1
max = 512
default = 512

[params.out0_d0]
type = "int"
min = 1
max = 2
default = 2

[params.out0_d1]
type = "int"
min = 1
max = 512
default = 512

[params.out0_d2]
type = "int"
min = 1
max = 512
default = 64

[derived]
input_rows = "in0_d0 * in0_d2 * ceil(in0_d1 / 128)"
output_rows = "out0_d0 * out0_d1 * ceil(out0_d2 / 128)"
penultimate = "input_rows - 2"
active = "ds(min(in0_d1, 128))"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
penultimate = "CR6"
active = "CR7"

[cases.default]
