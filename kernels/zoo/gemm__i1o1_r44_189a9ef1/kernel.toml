[kernel]
op = "gemm"
formats = ["e1", "e2"]
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 256
[params.m]
type = "int"
min = 1
max = 65536
default = 1024
[params.n]
type = "int"
min = 1
max = 4096
default = 96
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 96
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 32
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 32

[derived]
chunks = "ceil(k / 128)"
tiles = "ceil(n / 128)"
full = "ds(128)"
tail = "ds(n - 128 * (tiles - 1))"
tail_count = "n - 128 * (tiles - 1)"
lanes128 = "128"
weight_rows = "2 * tiles + 2 * chunks * n"
[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * ceil(in0_d1 / 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["weight_rows", 128]
range = [-1, 1]
when = "bias"
[inputs.w_unbiased]
shape = ["2 * chunks * n", 128]
range = [-1, 1]
when = "not bias"
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
w_unbiased = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
chunks = "CR7"
tiles = "CR8"
full = "CR9"
tail = "CR10"
m = "CR11"
lanes128 = "CR12"
tail_count = "CR13"

[cases.default]
