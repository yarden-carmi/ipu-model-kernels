[kernel]
op = "bmm"
formats = ["e2", "e3", "e4"]

[params]
b = {type="int", min=1, max=32767, default=8}
k = {type="int", min=1, max=64, default=64}
m = {type="int", min=1, max=32767, default=64}
n = {type="int", min=1, max=32767, default=64}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=32767, default=8}
in0_d2 = {type="int", min=1, max=32767, default=64}
in0_d3 = {type="int", min=1, max=64, default=64}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=64, default=64}
in1_d2 = {type="int", min=1, max=65534, default=512}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=8}
out0_d2 = {type="int", min=1, max=32767, default=64}
out0_d3 = {type="int", min=1, max=32767, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "ac*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "ceil(in1_d2/2)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]
[scratch.query]
shape = [128]

[derived]
ac = "ceil(in0_d2/128)"
strides = "ac + in0_d3*ac*65536"
kwidth = "k + ds(k)*65536"
width = "ds(128) + ds((n-1)%128+1)*65536"
rhs_group = "ceil(in1_d2/2)*min(1,in1_d0-1)"
gather_step = "16777216"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
query = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
kwidth = "CR9"
width = "CR10"
strides = "CR11"
m = "CR12"
n = "CR13"
out0_d1 = "CR14"
rhs_group = "CR15"
out0_d0 = "LR1"
gather_step = "LR0"

[cases.default]
