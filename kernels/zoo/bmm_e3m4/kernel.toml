[kernel]
op = "bmm"
formats = ["e3"]

[params.b]
type = "int"
min = 1
max = 16
default = 1
[params.k]
type = "int"
min = 1
max = 1024
default = 64
[params.m]
type = "int"
min = 1
max = 1024
default = 2
[params.n]
type = "int"
min = 1
max = 1024
default = 50

[inputs.in0]
shape = ["b", "m", "kchunks", 128]
range = [-2, 2]
[inputs.in1]
shape = ["b", "kchunks", "n", 128]
range = [-2, 2]
[outputs.out0]
shape = ["b", "m", "nchunks", 128]

[derived]
qf = "case_qf"
kchunks = "ceil(k / 128)"
nchunks = "ceil(n / 128)"
kcn = "ceil(k / 128) * n"
kfull = "ds(128)"
klast = "ds(k - (kchunks - 1) * 128)"
w0 = "min(n, 128)"
w1 = "n - (nchunks - 1) * 128"
od0 = "ds(w0)"
od1 = "ds(w1)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
n = "CR7"
kfull = "CR8"
klast = "CR9"
w0 = "CR10"
w1 = "CR11"
od0 = "CR12"
od1 = "CR13"
qf = "CR14"
kchunks = "CR15"

[golden]
tolerance = { e3 = "EXACT" }

[cases.default]
b = 1
m = 2
k = 64
n = 50
[cases.wide]
b = 2
m = 3
k = 64
n = 256
[cases.partial]
b = 2
m = 2
k = 300
n = 137

[cases.oddwide]
b = 2
m = 3
k = 64
n = 257

[cases.oddlong]
b = 2
m = 3
k = 257
n = 64
