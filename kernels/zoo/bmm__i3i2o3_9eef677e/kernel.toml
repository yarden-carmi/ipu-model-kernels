[kernel]
op = "bmm"
formats = ["e3"]
[params.b]
type = "int"
min = 1
max = 256
default = 12
[params.k]
type = "int"
min = 1
max = 4096
default = 50
[params.m]
type = "int"
min = 1
max = 4096
default = 50
[params.n]
type = "int"
min = 64
max = 128
multiple_of = 64
default = 64
[params.in1_d2]
type = "int"
min = 1
max = 32768
default = 768
[inputs.in0]
shape = [1, "b", "m", "kc * 128"]
range = [-2, 2]
[inputs.in1]
shape = [1, "k", "brows * 128"]
range = [-2, 2]
[outputs.out0]
shape = [1, "b", "m", 128]
[derived]
kc = "ceil(k / 128)"
brows = "ceil(in1_d2 / 128)"
dsout = "ds(n)"
dsfull = "ds(128)"
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
k = "CR6"
m = "CR7"
n = "CR8"
brows = "CR9"
kc = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
dsout = "CR14"
dsfull = "CR15"
[golden]
tolerance = { e3 = "EXACT" }
[cases.default]
b = 12
k = 50
m = 50
n = 64
