[kernel]
op = "gemm__binary_add_none"
formats = ["e2", "e3"]

[params.s0_bias]
type = "bool"
default = true
[params.s0_k]
type = "int"
min = 1
max = 8192
default = 1536
[params.s0_m]
type = "int"
min = 1
max = 65536
default = 256
[params.s0_n]
type = "int"
min = 1
max = 8192
default = 384
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 1
max = 16777216
default = 98304
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"

[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 8192
default = 1536
[params.in1_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.in1_d2]
type = "int"
min = 1
max = 8192
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 8192
default = 384

[derived]
blocks = "ceil(in0_d1 / 128)"
tiles = "ceil(out0_d2 / 128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
full = "ds(128)"
slot = "128"
positions = "out0_d0 * out0_d1"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "blocks * 128"]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 / 128)", 128]
[inputs.w]
shape = ["3 * (s0_k + 1) * tiles", 128]
[outputs.out0]
shape = ["positions * tiles", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
blocks = "CR9"
tiles = "CR10"
tail = "CR11"
slot = "CR12"
full = "CR15"
s0_k = "LR12"
positions = "LR14"
in0_d1 = "LR15"

[cases.default]
