[kernel]
op = "gemm_table"
formats = ["e1"]

[params]
act_out0 = {type = "str", choices = ["hardswish"], default = "hardswish"}
bias = {type = "bool", default = true}
k = {type = "int", min = 1, max = 65535, default = 40}
m = {type = "int", min = 1, max = 65535, default = 196}
n = {type = "int", min = 1, max = 65535, default = 120}
in0_d0 = {type = "int", min = 1, max = 65535, default = 1}
in0_d1 = {type = "int", min = 1, max = 65535, default = 40}
in0_d2 = {type = "int", min = 1, max = 65535, default = 14}
in0_d3 = {type = "int", min = 1, max = 128, default = 14}
out0_d0 = {type = "int", min = 1, max = 65535, default = 1}
out0_d1 = {type = "int", min = 1, max = 65535, default = 120}
out0_d2 = {type = "int", min = 1, max = 65535, default = 14}
out0_d3 = {type = "int", min = 1, max = 128, default = 14}

[derived]
chunks = "ceil(k / 128)"
pitch = "ceil(in0_d1 / 128)"
in_pack = "1 + 1 // (1 + max(0, in0_d1 - 64))"
pixels = "in0_d0 * in0_d2 * in0_d3"
coeff_rows = "2 * chunks + 2"
stripes = "out0_d0 * out0_d2"
pack = "128 // out0_d3"
slot_end = "pack * out0_d3"
full = "ds(128)"
packed = "ds(slot_end)"
tail = "ds(max(1, (out0_d1 % pack) * out0_d3))"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * ceil(in0_d3 / in_pack) * pitch", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["stripes * ceil(out0_d1 / pack)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
lut = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
packed = "CR9"
tail = "CR10"
n = "CR11"
out0_d3 = "CR12"
stripes = "CR13"
chunks = "CR14"
slot_end = "CR15"
pitch = "LR13"
in0_d1 = "LR12"

[cases.default]
