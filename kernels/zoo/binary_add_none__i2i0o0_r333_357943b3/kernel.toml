[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 16777216
default = 49152
[params.in0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 192
[params.in1_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 192
[params.out0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 192

[derived]
width = "ceil(in0_d2 / 128)"
plane = "out0_d0 * out0_d1"
x_step = "plane % in0_d2 + 65536 * ((plane // in0_d2) * width % 65536)"
y_step = "out0_d0 % in0_d2 + 65536 * ((out0_d0 // in0_d2) * width)"
limits = "in0_d2 + 65536 * width"
columns_lanes = "out0_d2 + 65536 * out0_d0"
rows_ds = "out0_d1 + 65536 * ds(out0_d0)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "width * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d1", "in1_d2", "ceil(in1_d0 / 128) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d1", "out0_d2", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
x_step = "CR8"
y_step = "CR9"
limits = "CR10"
columns_lanes = "CR11"
rows_ds = "CR12"

[cases.default]
