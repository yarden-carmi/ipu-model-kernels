[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params]
bias = {type = "bool", default = true}
k = {type = "int", min = 1, max = 4096, default = 192}
m = {type = "int", min = 1, max = 65536, default = 256}
n = {type = "int", min = 1, max = 65536, default = 576}
in0_d0 = {type = "int", min = 1, max = 65536, default = 4}
in0_d1 = {type = "int", min = 1, max = 256, default = 64}
in0_d2 = {type = "int", min = 1, max = 4096, default = 192}
out0_d0 = {type = "int", min = 1, max = 65536, default = 4}
out0_d1 = {type = "int", min = 1, max = 256, default = 64}
out0_d2 = {type = "int", min = 1, max = 65536, default = 576}

[derived]
chunks = "ceil(k / 128)"
outrows = "ceil(2 * out0_d1 / 128)"
full = "ds(128)"
tail = "ds((2 * out0_d1 - 1) % 128 + 1)"
pairs = "ceil(n / 2)"
batchstride = "in0_d1 * ceil(in0_d2 / 128)"
pairstride = "ceil(2 * out0_d1 / 128) + 2 * ceil(k / 128)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / 128)", 128]
[inputs.w]
shape = ["pairs * pairstride", 128]
[outputs.out0]
shape = ["out0_d0 * ceil(out0_d2 / 2) * outrows", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
pairs = "CR9"
chunks = "CR10"
batchstride = "CR11"
pairstride = "CR12"
out0_d0 = "CR13"

[golden]
tolerance = {e2 = "NX8_STEP", e3 = "NX8_STEP"}
[cases.default]
