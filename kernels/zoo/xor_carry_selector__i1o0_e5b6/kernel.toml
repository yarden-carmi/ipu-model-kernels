[kernel]
op = "xor_carry_selector"
formats = ["e2"]
[params.tokens]
type = "int"
min = 256
max = 256
default = 256
[params.vocab]
type = "int"
min = 50265
max = 50265
default = 50265
[inputs.in0]
shape = [1, "tokens"]
[inputs.ramp]
shape = ["vocab", 3, 128]
[inputs.ones]
shape = [128]
range = [1, 1]
[outputs.out0]
shape = ["vocab", "tokens"]
[scratch.tmp]
shape = [128]
[derived]
blocks = "tokens // 128"
ramprows = "vocab * 3"
[abi]
in0 = "CR2"
ramp = "CR3"
out0 = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
qf_ramp = "CR7"
qf_out0 = "CR8"
blocks = "CR9"
ramprows = "CR10"
ones = "CR11"
qf_ones = "CR12"
[cases.default]
tokens = 256
vocab = 50265
