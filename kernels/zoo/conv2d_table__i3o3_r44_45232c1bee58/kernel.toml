[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]
[params]
act_out0 = {type="str", choices=["hardswish"], default="hardswish"}
bias = {type="bool", default=true}
cin = {type="int", min=1, max=640, default=3}
cout = {type="int", min=1, max=640, default=16}
groups = {type="int", min=1, max=640, default=1}
h = {type="int", min=1, max=256, default=14}
w = {type="int", min=1, max=256, default=14}
kh = {type="int", min=1, max=5, default=3}
kw = {type="int", min=1, max=5, default=3}
padding = {type="int", min=0, max=2, default=1}
stride = {type="int", min=1, max=2, default=1}
in0_d0 = {type="int", choices=[1], default=1}
in0_d1 = {type="int", min=1, max=640, default=3}
in0_d2 = {type="int", min=1, max=256, default=14}
in0_d3 = {type="int", min=1, max=256, default=14}
out0_d0 = {type="int", choices=[1], default=1}
out0_d1 = {type="int", min=1, max=640, default=16}
out0_d2 = {type="int", min=1, max=260, default=14}
out0_d3 = {type="int", min=1, max=128, default=14}
[derived]
ix = "ceil(in0_d3 / 128)"
full = "min(out0_d2, 128 // out0_d3)"
pack = "max(1 + (full - 1) * (1 - min(1, out0_d2 % full)), 1 + min(1, 256 // (out0_d2 * out0_d3)) * (1 - out0_d2 % 2) * min(1, out0_d2 - full) * (out0_d2 // 2 - 1))"
tiles = "out0_d2 // pack"
span = "(in0_d2 + 2 * padding + stride * (pack - 1)) * kw"
mac_span = "span * (1 + min(1, pack - 1))"
ds_input = "ds(1 + (in0_d3 - 1) % 128)"
gc = "cin // groups"
ds128 = "ds(128)"
ds_line = "ds(out0_d3)"
ds_out = "ds(pack * out0_d3)"
[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ix", 128]
range = [-2, 2]
[inputs.weights]
shape = ["cout * (2 + 2 * gc)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.shifted]
shape = ["1 + cin * span", 128]
[scratch.packed]
shape = ["1 + 2 * cin * span * min(1, pack - 1)", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "tiles", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
shifted = "CR6"
packed = "CR7"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
ds_line = "CR12"
ds_out = "CR13"
mac_span = "CR14"
ds_input = "CR15"
[golden]
tolerance = {e1="NX8_STEP", e2="NX8_STEP"}
[cases.default]
