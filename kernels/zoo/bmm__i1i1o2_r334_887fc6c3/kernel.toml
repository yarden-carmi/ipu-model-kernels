[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=32767, default=12}
k = {type="int", min=1, max=2048, default=64}
m = {type="int", min=1, max=1920, default=50}
n = {type="int", min=1, max=1920, default=50}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=1920, default=50}
in0_d2 = {type="int", min=1, max=32767, default=768}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=1920, default=50}
in1_d2 = {type="int", min=1, max=32767, default=768}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=12}
out0_d2 = {type="int", min=1, max=1920, default=50}
out0_d3 = {type="int", min=1, max=1920, default=50}

[inputs.in0]
shape = ["in0_d0", "in0_d2", "mt*128"]
range = [-1, 1]

[inputs.in1]
shape = ["in1_d0", "in1_d2", "nt*128"]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d3", "out0_d1", "ceil(out0_d2/128)*128"]

[derived]
mt = "ceil(in0_d1/128)"
nt = "ceil(in1_d1/128)"
tiles = "mt+65536*nt"
head_steps = "k*mt+65536*k*nt"
columns_heads = "n+65536*out0_d1"
ds = "ds(128)+65536*ds((m-1)%128+1)"
groups = "b//out0_d1"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
k = "CR8"
columns_heads = "CR9"
tiles = "CR10"
head_steps = "CR11"
ds = "CR12"
groups = "LR15"

[cases.default]
