[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 16
[params.n]
type = "int"
min = 1
max = 4096
default = 72
[params.m]
type = "int"
min = 1
max = 65535
default = 3136
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 72
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[derived]
batch_stride = "in0_d1 * in0_d2"
chunks = "ceil(k / 128)"
width_ds = "ds(in0_d3)"

[inputs.in0]
shape = ["in0_d0 * batch_stride", 128]
[inputs.w]
shape = ["2 * n * (1 + chunks)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
width_ds = "CR7"
in0_d1 = "CR8"
in0_d2 = "CR9"
batch_stride = "CR10"
n = "CR11"
out0_d0 = "CR12"

[cases.default]
