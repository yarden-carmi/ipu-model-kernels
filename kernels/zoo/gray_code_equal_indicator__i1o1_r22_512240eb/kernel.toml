[kernel]
op = "gray_code_equal_indicator"
formats = ["e2"]
[params.tokens]
type = "int"
min = 1
max = 256
default = 256
[params.vocab]
type = "int"
min = 128
max = 151936
multiple_of = 128
default = 151936
[inputs.in0]
shape = [1, "tokens"]
range = [-1, 1]
[inputs.bounds]
shape = [2, "vocab"]
range = [0, 1]
[inputs.coeff]
shape = [4, 128]
range = [0, 1]
[scratch.tmp]
shape = [2, 128]
[outputs.out0]
shape = ["tokens", "vocab"]
[derived]
chunks = "vocab // 128"
width = "128"
[abi]
in0 = "CR2"
out0 = "CR3"
bounds = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
qf_bounds = "CR8"
coeff = "CR9"
qf_coeff = "CR10"
tokens = "CR11"
chunks = "CR12"
qf_tmp = "CR13"
width = "CR14"
[cases.default]
[golden]
tolerance = { e2 = "EXACT" }
