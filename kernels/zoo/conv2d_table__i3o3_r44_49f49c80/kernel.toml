[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 3
[params.cout]
type = "int"
min = 1
max = 640
default = 16
[params.groups]
type = "int"
min = 1
max = 640
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 16
[params.w]
type = "int"
min = 1
max = 256
default = 16
[params.kh]
type = "int"
choices = [1, 3, 5]
default = 3
[params.kw]
type = "int"
choices = [3, 5]
default = 3
[params.padding]
type = "int"
choices = [1, 2]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 3
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 16
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 260
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 256
default = 16

[derived]
ix = "ceil(in0_d3 / 128)"
ox = "ceil(out0_d3 / 128)"
full = "min(out0_d2, max(1, 128 // out0_d3))"
pack = "1 + (full - 1) * (1 - min(1, out0_d2 % full))"
tiles = "out0_d2 // pack"
span = "(in0_d2 + 2 * padding + stride * (pack - 1)) * kw * ox"
gc = "cin // groups"
ds_input = "ds(1 + (in0_d3 - 1) % 128)"
ds128 = "ds(128)"
ds_line = "ds(out0_d3 - 128 * (ox - 1))"
ds_out = "ds(pack * out0_d3 - 128 * (ox - 1))"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ix", 128]
range = [-2, 2]
[inputs.weights]
shape = ["cout * (2 + 2 * gc)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.shifted]
shape = ["1 + cin * span", 128]
[scratch.packed]
shape = ["1 + cin * span * min(1, pack - 1)", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "tiles", "ox", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
shifted = "CR6"
packed = "CR7"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
ds_line = "CR12"
ds_out = "CR13"
span = "CR14"
ds_input = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
