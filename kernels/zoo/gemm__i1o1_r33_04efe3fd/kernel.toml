[kernel]
op = "gemm"
formats = ["e2", "e3"]
[params.m]
type = "int"
min = 1
max = 65536
default = 257
[params.k]
type = "int"
min = 1
max = 4096
default = 1024
[params.n]
type = "int"
min = 1
max = 4096
default = 1024
[params.bias]
type = "bool"
default = true
[derived]
MB = "ceil(m / 128)"
K = "ceil(k / 128)"
tail_ds = "ds((m - 1) % 128 + 1)"
full_pipe_bound = "126"
tail_pipe_bound = "(k - 1) % 128 - 1"
[inputs.in0]
shape = [1, "k", "MB * 128"]
range = [-2, 2]
[inputs.w]
shape = ["n", "K * 128"]
range = [-2, 2]
[inputs.b]
shape = ["n", 128]
range = [-2, 2]
when = "bias"
[outputs.out0]
shape = [1, "n", "MB * 128"]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
full_pipe_bound = "CR6"
n = "CR7"
MB = "CR8"
K = "CR9"
qf_in0 = "CR10"
qf_out0 = "CR11"
tail_pipe_bound = "CR12"
tail_ds = "CR13"
[golden]
tolerance = { e2 = "NX8_STEP", e3 = "NX8_STEP" }
[cases.default]
m = 3
k = 17
n = 5
