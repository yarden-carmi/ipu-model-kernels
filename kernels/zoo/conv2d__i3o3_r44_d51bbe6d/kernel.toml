[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = false
[params.groups]
type = "int"
choices = [1]
default = 1
[params.cin]
type = "int"
min = 1
max = 1024
default = 192
[params.cout]
type = "int"
min = 1
max = 2048
default = 64
[params.h]
type = "int"
min = 1
max = 1024
default = 16
[params.w]
type = "int"
min = 1
max = 128
default = 16
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
min = 0
max = 1
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 1024
default = 192
[params.in0_d2]
type = "int"
min = 1
max = 1024
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2048
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 1056
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 16

[derived]
pack = "128 // in0_d3"
full = "ds(128)"
out_pack = "1 + (min(1, max(0, 65 - out0_d3)) + 2 * min(1, max(0, 33 - out0_d3))) * (2 - stride)"
width = "ds(out0_d3 * out_pack) + 65536 * ds(out0_d3 * max(1, out0_d2 % out_pack))"
out_rows = "ceil(out0_d2 / out_pack)"
yend = "out0_d2 * stride - padding + 65536 * out_rows"
channel_rows = "ceil(in0_d2 / pack)"
taps = "9 * in0_d1"
panels = "ceil(taps / 128)"
weight_rows = "out0_d1 * (panels + 1)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * channel_rows", 128]
[inputs.weights]
shape = ["weight_rows", 128]
[inputs.masks]
shape = ["1 + 3 * out_pack", 128]
[scratch.patches]
shape = ["taps", 128]
[outputs.out0]
shape = ["out0_d0 * out_rows * out0_d1", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
width = "CR8"
in0_d2 = "CR9"
in0_d1 = "CR11"
channel_rows = "CR12"
masks = "CR13"
patches = "CR14"
yend = "CR15"
weight_rows = "CR10"
panels = "LR15"

[cases.default]
