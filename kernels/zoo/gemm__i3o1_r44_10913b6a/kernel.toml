[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 96
[params.m]
type = "int"
min = 1
max = 65536
default = 196
[params.n]
type = "int"
min = 1
max = 128
default = 40
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 96
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 14
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 40
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 14

[derived]
ipack = "128 // in0_d3"
opack = "min(2, 128 // out0_d1)"
plane = "ceil(in0_d2 / ipack)"
limit = "ipack * in0_d3"
orows = "out0_d0 * ceil(out0_d2 * out0_d3 / opack)"
full = "ds(opack * out0_d1)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * plane", 128]
[inputs.w]
shape = ["2 + k * opack * 2", 128]
[outputs.out0]
shape = ["orows", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
plane = "CR7"
limit = "CR8"
orows = "CR9"
full = "CR10"
k = "CR11"
opack = "CR12"

[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}
[cases.default]
