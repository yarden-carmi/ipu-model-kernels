[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 32
[params.m]
type = "int"
min = 1
max = 2147483647
default = 50176
[params.n]
type = "int"
min = 1
max = 4096
default = 1
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 32
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 224
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 224
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 1
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 224
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 224

[derived]
tiles = "ceil(in0_d3 / 128)"
out_tiles = "ceil(out0_d3 / 128)"
batch_stride = "in0_d2 * in0_d1 * tiles"
spatial_row_stride = "(in0_d1 - min(1, tiles - 1)) * tiles"
pair_rows = "in0_d2 // 2"
tile_or_pair_span = "tiles + pair_rows * in0_d1 * (1 - min(1, (in0_d3 - 1) // 64))"
chunks = "ceil(k / 128)"
full_ds = "ds(128)"
tail_ds = "ds(out0_d3 - (out_tiles - 1) * 128)"

[inputs.in0]
shape = ["in0_d0 * batch_stride", 128]
[inputs.w]
shape = ["2 * n * (1 + chunks)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2 * out_tiles", 128]
[scratch.packed]
shape = ["1 + in0_d0 * batch_stride * (1 - min(1, (in0_d3 - 1) // 64))", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full_ds = "CR7"
tile_or_pair_span = "CR8"
in0_d2 = "CR9"
batch_stride = "CR10"
n = "CR11"
out0_d0 = "CR12"
packed = "CR13"
spatial_row_stride = "CR14"
tail_ds = "CR15"

[cases.default]
