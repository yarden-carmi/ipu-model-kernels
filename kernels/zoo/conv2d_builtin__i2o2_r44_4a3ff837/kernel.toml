[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 32
[params.cout]
type = "int"
min = 1
max = 512
default = 32
[params.groups]
type = "int"
min = 1
default = 1
[params.h]
type = "int"
min = 2
max = 256
default = 8
[params.w]
type = "int"
min = 2
max = 256
default = 8
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1

[derived]
chunks = "(h + 127) // 128"
in_pitch = "cin * chunks"
out_pitch = "cout * chunks"
output_rows = "in0_d0 * w * out_pitch"
last_x = "w - 1"
last_chunk = "chunks - 1"
full = "ds(128)"
tail = "ds((h - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0", "w", "cin", "chunks", 128]
range = [-2, 2]
[inputs.weights]
shape = ["chunks", "cout", "2 + 18 * cin", 128]
range = [-1, 1]
[outputs.out0]
shape = ["in0_d0", "w", "cout", "chunks", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
in_pitch = "CR7"
out_pitch = "CR8"
output_rows = "CR9"
last_x = "CR10"
last_chunk = "CR11"
cin = "CR12"
cout = "CR13"
full = "CR14"
tail = "CR15"

[cases.default]
