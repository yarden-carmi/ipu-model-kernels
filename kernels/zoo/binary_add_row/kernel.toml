# binary_add_row: y = a (op) b elementwise, b broadcast as a ROW, one
# parameterised program.
#
#   op        : add | sub | mul | max
#   broadcast : row   -- b holds `inner` values, repeated over the rows of a
#                        (a bias): y[i] = a[i] op b[i mod inner]
#   inner     : a multiple of 128 whose row count ceil(inner/128) is a power
#               of two, so b's row pointer wraps with INC.MODP2 and the
#               repetition is lane-aligned (no rotation).
#
# The other broadcast modes (none, col, scalar) are out of this kernel's domain
# (binary_add_none covers none), and `div` and `min` are out too: the AaQ stage
# has no exact reciprocal and the accumulator no min.
#
# Every tensor is the layout every activation on the chip uses: a and y are
# ceil(numel/128) rows, row i holding elements 128i .. 128i+127, lanes past
# numel zero. b is ceil(inner/128) rows, row j holding 128j .. 128j+127, and it
# repeats: a's row r is combined with b's row (r mod b_rows) -- exact, no lane
# rotation, because inner is a multiple of 128. y is the next kernel's input
# with no repack.
#
# Dataflow, per 128-lane row of a: two words, both running the multiplier
# (word A: b row in R1 times the constant 1.0, ACC.*.FIRST; word B: a row in
# R0 times 1.0, accumulate and store) -- the floor one LOAD and one MULT slot
# per word allows for a two-operand elementwise op. `mul` is one product per
# row and its second word carries only the b load. The b row pointer LR2 wraps
# with INC.MODP2 (mod 2^k, k = log2(b_rows)); the a pointer and the store index
# run on. The row loop is dynamic: a whole call is one launch.
#
# XMEM: a and y are ceil(numel/128) rows each, b ceil(inner/128), plus the mask
# row -- the largest surveyed call takes 2*256+32+1 = 545 of the 16384 rows.

[kernel]
op = "binary"
formats = ["dynamic"]

[params]
op = { type = "str", choices = ["add", "sub", "mul", "max"], default = "add" }
numel = { type = "int", min = 1, max = 262144 }                # elements of a and of y
inner = { type = "int", choices = [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 262144], default = 128 }  # b's row length: a multiple of 128 with a power-of-two row count
broadcast = { type = "str", choices = ["row"], default = "row" }

[derived]
qf = "case_qf"                                  # CR14: the case's QF half
rows = "ceil(numel / 128)"                      # a's and y's rows: the loop's trips
tail = "numel - 128 * (rows - 1)"               # the last row's active lanes
ds = "halves(ds(128), ds(tail))"                # CR15: full row / last row
slot1 = "128"                                   # CR12: R1's element offset in Ra
bound = "rows - ceil((128 - tail) / 127) - 1"   # CR13: the row loop's bound

[inputs.a]
shape = ["numel"]
range = [-1, 1]

[inputs.b]
shape = ["inner"]                               # one row of `inner` values, repeated
range = [-1, 1]

[outputs.y]
shape = ["numel"]

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"                     # LD.MASK: every lane active, whatever a previous kernel left

[abi]
a = "CR2"
b = "CR3"
y = "CR4"
maskr = "CR5"
slot1 = "CR12"
bound = "CR13"
qf = "CR14"
ds = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: only the store rounds; the golden is quantized the same way, so the
# kernel's own datapath is two exact products and an exact accumulator add.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 1, why = "the store's row quantization, measured exact; one step of margin for a row scale that moves" } }

[cases.default]                                 # google-t5/t5-small + clip-vit-base-patch32 bias add, x18 per forward
op = "add"
broadcast = "row"
inner = 4096
numel = 32768

[cases.whisper]                                 # openai/whisper-large-v3 bias add, x32 per forward
op = "add"
broadcast = "row"
inner = 1024
numel = 20480

[cases.one_row]                                 # b is a single row; the pointer never moves
op = "add"
broadcast = "row"
inner = 128
numel = 128

[cases.rows_lt_brows]                           # fewer a rows than b rows: the pointer wraps unused
op = "add"
broadcast = "row"
inner = 256
numel = 100

[cases.tail]                                    # a short last row, mid-cycle in b
op = "add"
broadcast = "row"
inner = 256
numel = 1000

[cases.sub]
op = "sub"
broadcast = "row"
inner = 256
numel = 1000

[cases.mul]                                     # the one-product loop
op = "mul"
broadcast = "row"
inner = 256
numel = 1000

[cases.max]
op = "max"
broadcast = "row"
inner = 256
numel = 1000

[cases.mul_wide]                                # the one-product loop over many b cycles
op = "mul"
broadcast = "row"
inner = 512
numel = 24576

[cases.sweep]                                   # the structure of the calls, scaled down
op = ["add", "sub", "mul", "max"]
broadcast = "row"
inner = [128, 256, 1024]
numel = [1, 2, 5, 127, 128, 129, 130, 255, 256, 257, 1000, 4096, 5000]
