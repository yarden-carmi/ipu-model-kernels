[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=65535, default=16}
k = {type="int", min=1, max=65535, default=36}
m = {type="int", min=1, max=65535, default=256}
n = {type="int", min=1, max=65535, default=256}
in0_d0 = {type="int", min=1, max=65535, default=4}
in0_d1 = {type="int", min=1, max=65535, default=4}
in0_d2 = {type="int", min=1, max=65535, default=256}
in0_d3 = {type="int", min=1, max=65535, default=36}
in1_d0 = {type="int", min=1, max=65535, default=4}
in1_d1 = {type="int", min=1, max=65535, default=256}
in1_d2 = {type="int", min=1, max=65535, default=432}
out0_d0 = {type="int", min=1, max=65535, default=4}
out0_d1 = {type="int", min=1, max=65535, default=4}
out0_d2 = {type="int", min=1, max=65535, default=256}
out0_d3 = {type="int", min=1, max=65535, default=256}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "arows*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "brows*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "tiles*128"]

[derived]
arows = "ceil(in0_d2/128)"
brows = "ceil(in1_d1/128)"
tiles = "ceil(out0_d3/128)"
stride = "arows + brows*65536"
ds = "ds(128) + ds((n-1)%128+1)*65536"
head_rows = "in0_d3*arows"
key_offset = "(in1_d2//3)*brows"
key_gap = "(in1_d2-in0_d1*k)*brows"
query_group_rows = "in0_d1*head_rows"
tile_chunks = "tiles + arows*65536"
heads_lanes = "in0_d1 + 128*65536"
unaligned = "m%128 + 128%in0_d1 + k%2 + max(0, 2-k) + max(m-in0_d2, in0_d2-m)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
k = "CR6"
m = "CR7"
tile_chunks = "CR8"
stride = "CR9"
ds = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
heads_lanes = "CR14"
head_rows = "CR15"
key_offset = "LR1"
query_group_rows = "LR13"
key_gap = "LR14"
unaligned = "LR6"

[cases.default]
