[kernel]
op = "vocab_bounded_floor_indicator_v1"
formats = ["e2"]
[params.tokens]
type = "int"
min = 1
default = 256
[params.vocab]
type = "int"
min = 1
default = 250002
[inputs.in0]
shape = [1, "ceil(tokens/128)*128"]
[inputs.idx]
shape = ["3*ceil(vocab/128)+1", 128]
[outputs.out0]
shape = ["tokens", "ceil(vocab/128)*128"]
[scratch.tmp]
shape = [1,128]
[derived]
chunks = "ceil(vocab/128)"
twice = "2*chunks"
ones = "3*chunks"
tail = "ds((vocab-1)%128+1)"
full = "ds(128)"
[abi]
in0 = "CR2"
idx = "CR3"
out0 = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
qf_idx = "CR7"
qf_tmp = "CR8"
qf_out0 = "CR9"
chunks = "CR10"
twice = "CR11"
ones = "CR12"
tokens = "CR13"
tail = "CR14"
full = "CR15"
[cases.default]
tokens = 256
vocab = 250002
[golden]
tolerance = { e2 = "EXACT" }
