max = 262144
default = 49152
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"
[params.s2_channels]
type = "int"
min = 144
max = 256
multiple_of = 16
default = 192
[params.s2_eps]
type = "float"
min = 0.0
max = 1.0
default = 0.00001
[params.s2_kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.s2_rows]
type = "int"
min = 8
max = 1024
multiple_of = 8
default = 256
[params.in0_d0]
type = "int"
min = 1
max = 4
default = 4
[params.in0_d1]
type = "int"
min = 8
max = 1024
multiple_of = 8
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 512
default = 384
[params.in1_d0]
type = "int"
min = 1
max = 4
default = 4
[params.in1_d1]
type = "int"
min = 8
max = 1024
multiple_of = 8
default = 64
[params.in1_d2]
type = "int"
min = 144
max = 256
multiple_of = 16
default = 192
[params.out0_d0]
type = "int"
min = 1
max = 4
