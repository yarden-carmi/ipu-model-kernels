[kernel]
op = "gemm__binary_add_none__row_norm_layernorm"
formats = ["e2"]
[params.s0_bias]
type = "bool"
default = true
[params.s0_k]
type = "int"
min = 1
max = 512
default = 384
[params.s0_m]
type = "int"
min = 64
max = 1024
multiple_of = 64
default = 256
[params.s0_n]
type = "int"
min = 144
max = 256
multiple_of = 16
default = 192
[params.s1_broadcast]
