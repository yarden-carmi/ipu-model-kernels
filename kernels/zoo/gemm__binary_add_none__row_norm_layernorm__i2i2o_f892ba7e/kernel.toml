min = 144
max = 256
multiple_of = 16
default = 192

[derived]
stride = "ceil(s0_m / 128)"
paired = "max(1, 128 // s0_m) - 1"
scalar = "ds(64) + 65536 * (104 - 48 * paired)"
work_config = "stride + 65536 * (360 - 48 * paired)"
tiles = "s0_n // max(1, 128 // s0_m)"
tile_config = "tiles + 65536 * 312"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / 128)", 128]
[inputs.in1]
shape = ["ceil(in1_d0 * in1_d1 * in1_d2 / 128)", 128]
[inputs.w]
shape = ["s0_n * ceil(s0_k / 128) + (2 - paired) * tiles", 128]
[inputs.affine]
shape = ["4 * tiles", 128]
[inputs.crow]
shape = ["4 - paired", 128]
[scratch.tmp]
shape = ["49 + (4 - 2 * paired) * tiles", 128]
[outputs.out0]
shape = ["s0_n * stride", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
affine = "CR5"
crow = "CR6"
tmp = "CR8"
out0 = "CR9"
qf_in0 = "CR10"
qf_in1 = "CR11"
qf_out0 = "CR12"
work_config = "CR13"
scalar = "CR14"
tile_config = "CR7"

