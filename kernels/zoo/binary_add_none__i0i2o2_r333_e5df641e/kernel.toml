[kernel]
op = "binary_add"
formats = ["e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 15360 }
in0_d0 = { type = "int", min = 4, max = 4, default = 4 }
in0_d1 = { type = "int", min = 1, max = 1024, default = 16 }
in0_d2 = { type = "int", min = 1, max = 4096, default = 240 }
in1_d0 = { type = "int", min = 4, max = 4, default = 4 }
in1_d1 = { type = "int", min = 1, max = 1024, default = 16 }
in1_d2 = { type = "int", min = 1, max = 4096, default = 240 }
out0_d0 = { type = "int", min = 4, max = 4, default = 4 }
out0_d1 = { type = "int", min = 1, max = 1024, default = 16 }
out0_d2 = { type = "int", min = 1, max = 4096, default = 240 }

[derived]
column_span = "in0_d2 * ceil(in0_d1 / 64) * 2"
batch_lanes = "4 * in0_d1"
rows = "out0_d0 * out0_d1 * ceil(out0_d2 / 128)"
tail = "ds(out0_d2 - (ceil(out0_d2 / 128) - 1) * 128)"
full = "ds(128) + 65536 * (in0_d2 - 1)"
pack_dims = "128 * 65536 + in0_d1"
step = "(4 * in0_d1) % in0_d2 + 65536 * 4 * (ceil((4 * in0_d1 + 1) / in0_d2) - 1)"

[inputs.in0]
shape = ["in0_d2 * ceil(in0_d1 / 64) * 2", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
in0_d2 = "CR8"
pack_dims = "CR9"
column_span = "CR10"
step = "CR11"
batch_lanes = "CR12"
rows = "CR13"
tail = "CR14"
full = "CR15"

[cases.default]
