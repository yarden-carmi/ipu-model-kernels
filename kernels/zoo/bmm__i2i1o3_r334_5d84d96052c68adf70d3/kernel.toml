[kernel]
op = "bmm"
formats = ["e1"]

[params]
b = {type="int", min=1, max=2147483647, default=8}
k = {type="int", min=1, max=32767, default=64}
m = {type="int", min=1, max=32767, default=512}
n = {type="int", min=1, max=65535, default=512}
in0_d0 = {type="int", min=1, max=65535, default=2}
in0_d1 = {type="int", min=1, max=65535, default=512}
in0_d2 = {type="int", min=1, max=65535, default=256}
in1_d0 = {type="int", min=1, max=65535, default=2}
in1_d1 = {type="int", min=1, max=65535, default=512}
in1_d2 = {type="int", min=1, max=65535, default=256}
out0_d0 = {type="int", min=1, max=65535, default=2}
out0_d1 = {type="int", min=1, max=32767, default=4}
out0_d2 = {type="int", min=1, max=65535, default=512}
out0_d3 = {type="int", min=1, max=65535, default=512}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "a_stride*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "ceil(in1_d1/128)*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[derived]
a_stride = "ceil(in0_d2/128)"
a_rewind = "(m-1)*a_stride"
rhs_head = "k*ceil(in1_d1/128)"
ds = "ds(128)+65536*ds((n-1)%128+1)"
keys_heads = "k+65536*out0_d1"
rows_tiles = "m+65536*ceil(n/128)"
a_gap = "min(1,in0_d0-1)*in0_d1*a_stride-ceil((out0_d1*k-127)/128)"
b_gap = "ceil(in1_d1/128)*(min(1,in1_d0-1)*in1_d2-out0_d1*k)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
ds = "CR8"
keys_heads = "CR9"
rows_tiles = "CR10"
a_stride = "CR11"
rhs_head = "CR12"
a_rewind = "CR13"
a_gap = "CR14"
b_gap = "CR15"
out0_d0 = "LR3"

[cases.default]
