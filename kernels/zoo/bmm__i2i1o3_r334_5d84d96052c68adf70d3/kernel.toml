[kernel]
op = "bmm"
formats = ["e2", "e4"]
[params.b]
type = "int"
min = 1
max = 256
default = 12
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 4096
default = 196
[params.n]
type = "int"
min = 1
max = 128
default = 64
[params.in0_d0]
type = "int"
min = 1
max = 256
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 196
[params.in0_d2]
type = "int"
min = 1
max = 1048576
default = 768
[inputs.in0]
shape = ["in0_d0", "in0_d1", "achunks*128"]
range = [-2, 2]
[inputs.in1]
shape = [1, "b*k", "ceil(n/128)*128"]
range = [-2, 2]
[outputs.out0]
shape = [1, "b", "m", "n"]
[derived]
achunks = "ceil(in0_d2/128)"
heads = "in0_d2//k"
agroup = "in0_d1*achunks"
bend = "b*k"
dsout = "ds(n)"
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
bend = "CR5"
k = "CR6"
m = "CR7"
heads = "CR8"
achunks = "CR9"
dsout = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
agroup = "CR14"
[cases.default]
b = 12
k = 64
m = 196
n = 64
