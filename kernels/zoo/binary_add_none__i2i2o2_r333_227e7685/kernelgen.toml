chain = ["binary"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

[layout.in0]
lanes = 2
rows = [0, 1]
pack = "d1"
[prefer.in0]
lanes = 2
rows = [0, 1]
pack = "d1"
[view.in0]
kind = "other"

[layout.in1]
lanes = 2
rows = [0, 1]
[view.in1]
kind = "whole"

[layout.out0]
lanes = 2
rows = [0, 1]
pack = "1 + (d1 - 1) * min(1, max(0, d2 - 144))"
