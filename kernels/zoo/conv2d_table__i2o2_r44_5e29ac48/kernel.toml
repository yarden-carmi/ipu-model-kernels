[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 3
[params.cout]
type = "int"
min = 1
max = 640
default = 16
[params.groups]
type = "int"
min = 1
max = 640
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 256
[params.w]
type = "int"
min = 1
max = 256
default = 256
[params.kh]
type = "int"
choices = [3, 5]
default = 3
[params.kw]
type = "int"
choices = [3, 5]
default = 3
[params.padding]
type = "int"
choices = [1, 2]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 3
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 256
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 258
default = 128

[derived]
iy = "ceil(in0_d2 / 128)"
ds128 = "ds(128)"
ds_out = "ds(out0_d2)"
ds_in = "ds(1 + (in0_d2 - 1) % 128)"
plane = "(2 - stride) * in0_d3 * iy + (stride - 1) * (in0_d3 + 2 * padding) * kh"
gcin = "cin // groups"
parts = "6 - 2 * stride"
rewind = "out0_d3 * ((2 - stride) * iy + (stride - 1) * stride * kh)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "iy", 128]
range = [-2, 2]
[inputs.weights]
shape = ["cout * parts * (1 + gcin)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.pad]
shape = ["1 + cin * plane", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
pad = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
ds_out = "CR11"
plane = "CR12"
gcin = "CR13"
cout = "CR14"
ds_in = "CR15"
rewind = "LR14"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
