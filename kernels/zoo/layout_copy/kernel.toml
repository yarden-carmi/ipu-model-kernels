# layout_copy: layout = data movement (transpose / permute / concat / slice
# copy), one parameterised program.
#
#   kind  : copy    -- y[i] = x[i], numel values, x and y the same shape
#           (transpose and concat are declared unsupported: see
#           kernelgen.toml -- the datapath moves whole rows and cannot
#           permute lanes across them).
#   numel : elements of x and of y; the host tiles only this.
#
# x and y are the layout every activation on the chip uses: entity e holds its
# features in ceil(F/128) consecutive rows, row e*chunks + c holding features
# 128c..128c+127, lanes past F zero. Here F is numel and the whole tensor is
# one entity, so x and y are rows 0..ceil(numel/128)-1 of their regions -- the
# kernel reads what the previous kernel wrote and leaves what the next one
# reads, with no repack between them.
#
# Dataflow: the only way into R_ACC is a multiply result, so each row of x is
# multiplied by the CR constant 1.0 and stored with ACTIVATE.QUANTIZE identity
# -- a copy at the store's exact quantization, the same rounding the next
# kernel's input would get anyway. One word per row: the row being multiplied
# is resident in R1 (MULT.VE reads Ra, R1's elements at Ra offset 128) and the
# next row's load rides in the same word, so the multiplier runs in every
# word of the loop.
#
# The shape reaches the program only through CRs and the row loop is dynamic,
# so the whole of a call is one launch: 262144 elements is 2048 iterations of
# the same word. `numel` is the only dimension the host tiles.
#
# XMEM: x and y are ceil(numel/128) rows each and the mask row is the only
# scratch, so the declared corner takes 2*2048+1 = 4097 of the 16384
# addressable NX8 rows and a chain has room for a second launch. There is no
# FP32 variant: it addresses 4096 rows only, and dynamic is the chip's type.

[kernel]
op = "layout"
formats = ["dynamic"]

[params]
kind = { type = "str", choices = ["copy"], default = "copy" }
numel = { type = "int", min = 1, max = 262144 }          # elements of x and of y

[derived]
qf = "case_qf"                    # CR14: the case's QF half
rows = "ceil(numel / 128)"        # x's and y's rows: the loop's trips
tail = "numel - 128 * (rows - 1)" # the last row's active lanes
ds = "halves(ds(128), ds(tail))"  # CR15: full row / last row
slot1 = "128"                     # CR12: R1's element offset in Ra
loopb = "rows - 2"                # CR5: the row loop's bound (the last row the loop stores)
last = "rows - 1"                 # CR6: the last row's index (the straight-line word's store)

[inputs.x]
shape = ["numel"]
range = [-1, 1]

[outputs.y]
shape = ["numel"]

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"       # LD.MASK: every lane active, whatever a previous kernel left

[abi]
x = "CR2"
y = "CR3"
maskr = "CR4"
loopb = "CR5"
last = "CR6"
slot1 = "CR12"
qf = "CR14"
ds = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: only the store rounds; the golden is quantized the same way, so the
# kernel's own datapath is one exact product by 1.0.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 1, why = "the store's row quantization, measured exact; one step of margin for a row scale that moves" } }

[cases.default]                   # openai/whisper-large-v3: x1 per forward
kind = "copy"
numel = 32

[cases.one]                       # the narrowest call: one lane, one row
kind = "copy"
numel = 1

[cases.tile]                      # exactly one 128-lane row
kind = "copy"
numel = 128

[cases.tail]                      # one row and a lane
kind = "copy"
numel = 129

[cases.two_rows]                  # the loop's shortest trip
kind = "copy"
numel = 200

[cases.medium]                    # a real layer's copy, one launch
kind = "copy"
numel = 15360

[cases.large]                     # the declared maximum, one launch
kind = "copy"
numel = 262144
tier = "nightly"

[cases.sweep]                     # the structure of the calls, scaled down
kind = "copy"
numel = [1, 2, 5, 127, 128, 129, 130, 255, 256, 257, 1000, 4096, 5000]
