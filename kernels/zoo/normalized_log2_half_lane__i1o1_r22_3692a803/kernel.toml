[kernel]
op = "normalized_log2_half_lane"
formats = ["e3"]

[params.numel]
type = "int"
min = 1
default = 1

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
default = 1

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
default = 1

[inputs.in0]
shape = ["in0_d0", "128 * ceil(in0_d1 / 128)"]
range = [0, 4]

[outputs.out0]
shape = ["out0_d0", "128 * ceil(out0_d1 / 128)"]

[scratch.inverse_root]
shape = [3, 128]

[derived]
tail = "ds((out0_d1 - 1) % 128 + 1)"
full_chunks = "ceil(out0_d1 / 128) - 1"
half = "0x137e00"

[abi]
in0 = "CR2"
out0 = "CR3"
inverse_root = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tail = "CR7"
full_chunks = "CR8"
out0_d0 = "CR9"
half = "CR10"

[cases.default]
