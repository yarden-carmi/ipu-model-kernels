[kernel]
op = "gemm_binary_add"
formats = ["e2", "e3"]

[params.s0_bias]
type = "bool"
default = true
[params.s0_k]
type = "int"
min = 1
max = 8192
default = 480
[params.s0_m]
type = "int"
min = 1
max = 65536
default = 64
[params.s0_n]
type = "int"
min = 1
max = 4096
default = 240
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 1
max = 268435456
default = 15360
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"
[params.in0_d0]
type = "int"
min = 1
max = 255
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 8192
default = 480
[params.in1_d0]
type = "int"
min = 1
max = 255
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.in1_d2]
type = "int"
min = 1
max = 4096
default = 240
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 240

[derived]
blocks = "ceil(s0_n / 128)"
chunks = "ceil(s0_k / 128)"
full = "ds(128)"
tail = "ds((s0_n - 1) % 128 + 1)"
weights = "blocks * (s0_k + 1)"

[inputs.in0]
shape = ["s0_m * chunks", 128]
range = [-2, 2]
[inputs.in1]
shape = ["s0_m * blocks", 128]
range = [-2, 2]
[inputs.w]
shape = ["weights", 128]
[outputs.out0]
shape = ["s0_m * blocks", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
s0_m = "CR9"
s0_k = "CR10"
blocks = "CR11"
chunks = "CR12"
full = "CR13"
tail = "CR14"

[cases.default]
