[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 96
[params.m]
type = "int"
min = 1
max = 65536
default = 196
[params.n]
type = "int"
min = 1
max = 4096
default = 40
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 96
[params.in0_d2]
type = "int"
min = 1
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 14
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 40
[params.out0_d2]
type = "int"
min = 1
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 14

[derived]
pack = "min(in0_d2, max(1, 128 // in0_d3))"
pitch = "ceil(in0_d2 / pack)"
outpack = "min(out0_d2, max(1, 128 // out0_d3))"
outpitch = "ceil(out0_d2 / outpack)"
batch_stride = "k * pitch"
batches = "in0_d0"
full = "ds(128)"
active = "ds(pack * in0_d3)"
tail = "ds(((in0_d2 - 1) % pack + 1) * in0_d3)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * pitch", 128]
[inputs.w]
shape = ["n * (k + 1) * 2 + 1", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * outpitch", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
k = "CR7"
n = "CR8"
pitch = "CR9"
batch_stride = "CR10"
batches = "CR11"
full = "CR12"
active = "CR13"
tail = "CR14"

[cases.default]
