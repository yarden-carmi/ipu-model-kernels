[kernel]
op = "bmm"
formats = ["e1", "e2", "e3"]

[params]
b = {type="int", min=1, max=32767, default=12}
k = {type="int", min=1, max=4096, default=64}
m = {type="int", min=1, max=128, default=50}
n = {type="int", min=1, max=64, default=50}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=128, default=50}
in0_d2 = {type="int", min=1, max=32767, default=768}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=64, default=50}
in1_d2 = {type="int", min=1, max=32767, default=768}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=12}
out0_d2 = {type="int", min=1, max=128, default=50}
out0_d3 = {type="int", min=1, max=64, default=50}

[inputs.in0]
shape = ["in0_d0", "in0_d2", "ceil(in0_d1/128)*128"]
range = [-1, 1]

[inputs.in1]
shape = ["in1_d0", "in1_d2", "ceil(in1_d1/128)*128"]
range = [-1, 1]

[outputs.out0]
shape = ["ceil(out0_d0*out0_d1*out0_d2/2)*ceil(out0_d3/64)", 128]

[scratch.clean_b]
shape = ["b*k", 128]

[derived]
keys = "b*k"
dskey = "ds(n)"
rows = "b*m"
shift = "128-n"
width = "128"
dsfull = "ds(128)"
dspair = "ds(2*n)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
k = "CR8"
m = "CR9"
dsfull = "CR10"
dspair = "CR11"
width = "CR12"
clean_b = "CR13"
dskey = "CR14"
keys = "CR15"
rows = "LR2"
shift = "LR9"

[cases.default]
