[kernel]
op = "quarter_grid_expand"
formats = ["e1", "e2"]

[params]
channels = { type = "int", min = 1, default = 1 }
h = { type = "int", min = 1, default = 16 }
w = { type = "int", min = 1, default = 16 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, max = 128, default = 64 }
in0_d2 = { type = "int", min = 1, default = 16 }
in0_d3 = { type = "int", min = 1, default = 16 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, max = 128, default = 64 }
out0_d2 = { type = "int", min = 1, default = 66 }
out0_d3 = { type = "int", min = 1, default = 66 }

[derived]
active = "ds(out0_d1)"
four = "4"
eight = "8 * in0_d3"
channel_stride = "in0_d2 // 8"
batch_skip = "(in0_d1 - 1) * in0_d2 // 8"
total_rows = "in0_d0 * in0_d1 * in0_d2 // 8"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2 // 8", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
active = "CR6"
h = "CR7"
w = "CR8"
out0_d3 = "CR9"
four = "CR10"
batch_skip = "CR11"
channel_stride = "CR12"
out0_d1 = "CR13"
eight = "CR14"
total_rows = "CR15"

[cases.default]
