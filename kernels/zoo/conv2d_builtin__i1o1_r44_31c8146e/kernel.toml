[kernel]
op = "conv2d_builtin"
formats = ["e1"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 1
[params.cout]
type = "int"
min = 1
max = 128
default = 64
[params.groups]
type = "int"
min = 1
max = 128
default = 1
[params.h]
type = "int"
min = 1
default = 224
[params.w]
type = "int"
min = 1
default = 224
[params.kh]
type = "int"
min = 1
max = 7
default = 3
[params.kw]
type = "int"
min = 1
max = 7
default = 3
[params.padding]
type = "int"
min = 0
max = 3
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 1
[params.in0_d2]
type = "int"
min = 1
default = 224
[params.in0_d3]
type = "int"
min = 1
default = 224
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d2]
type = "int"
min = 1
default = 224
[params.out0_d3]
type = "int"
min = 1
default = 224

[derived]
weight_rows = "2 * (1 + kh * kw * in0_d1)"
channels = "in0_d1"
full = "ds(128)"
tail = "ds(out0_d1)"
x_end = "out0_d3 * stride"
y_end = "out0_d2 * stride"
row_fix = "stride * in0_d3 - x_end"
batch_fix = "(in0_d2 - y_end) * in0_d3"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
in0_d2 = "CR9"
in0_d3 = "CR10"
x_end = "CR11"
y_end = "CR12"
row_fix = "CR13"
batch_fix = "CR14"
channels = "CR15"
in0_d0 = "LR10"

[cases.default]
h = 5
w = 7
in0_d2 = 5
in0_d3 = 7
out0_d2 = 5
out0_d3 = 7
