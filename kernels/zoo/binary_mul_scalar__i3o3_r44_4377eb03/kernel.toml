range = [0.0, 2.0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2 * ceil(out0_d3 / 128)", 128]

[derived]
groups = "in0_d0 * in0_d1 * in0_d2"
chunks = "ceil(in0_d3 / 128)"
total_rows = "groups * chunks"
ds_pair = "ds((in0_d3 - 1) % 128 + 1) + ds(128) * 65536"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
