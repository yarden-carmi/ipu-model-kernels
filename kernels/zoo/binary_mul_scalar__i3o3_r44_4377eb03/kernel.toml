[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 786432
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 12
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 256
[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 256

[inputs.in0]
shape = ["rows", 128]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2 * oc", 128]
[scratch.scalar]
shape = [1, 128]

[derived]
groups = "in0_d0 * in0_d1 * in0_d2"
chunks = "ceil(in0_d3 / 128)"
rows = "groups * chunks"
last_group = "groups - 1"
last_chunk = "chunks - 1"
last_row = "rows - 1"
penultimate_row = "rows - 2"
remainder = "in0_d3 % 128"
oc = "ceil(out0_d3 / 128)"
last = "(out0_d3 - 1) % 128 + 1"
ds_pair = "ds(last) + ds(128) * 65536"
fp_hi = "0x43012d41"
fp_lo = "0x43010000"
nx_scale = "0x00017c35"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
last_group = "CR6"
chunks = "CR7"
last_chunk = "CR8"
last_row = "CR9"
penultimate_row = "CR10"
ds_pair = "CR11"
scalar = "CR12"
fp_hi = "CR13"
fp_lo = "CR14"
nx_scale = "CR15"
remainder = "LR15"

[cases.default]
