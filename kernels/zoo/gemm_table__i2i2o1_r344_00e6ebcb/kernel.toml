[kernel]
op = "gemm_table"
formats = ["e2"]
[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 16384
default = 240
[params.m]
type = "int"
min = 1
max = 16384
default = 64
[params.n]
type = "int"
min = 1
max = 16384
default = 160
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 240
[params.in1_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 160
[params.in1_d2]
type = "int"
min = 1
max = 128
default = 8
[params.in1_d3]
type = "int"
min = 1
max = 128
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 2
max = 32768
default = 320
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 16384
default = 8
[derived]
chunks = "ceil(in0_d2 / 128)"
tiles = "ceil((n + n % 128) / 128)"
stride = "(m // in0_d2) * chunks"
full = "ds(128)"
tail = "ds(1 + (out0_d1 - 1) % 128)"
skip_tail = "ds(1 + (n - 1) % 128)"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * chunks", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 * in1_d3 / 128)", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["tiles * (2 + 2 * k)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.tmp]
shape = ["2 + m * ceil(n / 128)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * ceil(out0_d1 / 128)", 128]
[abi]
in0 = "CR2"
in1 = "CR3"
coeff = "CR4"
lut = "CR5"
tmp = "CR6"
out0 = "CR7"
qf_in0 = "CR8"
qf_in1 = "CR9"
qf_out0 = "CR10"
full = "CR11"
tail = "CR12"
in0_d2 = "CR13"
stride = "CR14"
skip_tail = "CR15"
m = "LR9"
[cases.default]
[golden]
tolerance = { e2 = "NX8_STEP" }
