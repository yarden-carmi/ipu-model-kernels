[kernel]
op = "row_softmax"
formats = ["e1", "e2"]

[params.n]
type = "int"
min = 1
max = 128
default = 50
[params.rows]
type = "int"
min = 1
default = 600
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 12
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 50
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 50
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 12
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 50
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 50

[derived]
full = "344 * 65536 + ds(128)"
tail_qf = "328 * 65536 + ds(n)"
out_tail_qf = "40 * 65536 + ds(out0_d2)"
scratch_qf = "312 * 65536 + 40"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d3", "out0_d1", 128]
[scratch.tmp]
shape = [12, 128]
[scratch.roots]
shape = [1, 128]
[scratch.norm]
shape = [3, "rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
scratch_qf = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
rows = "CR8"
norm = "CR9"
qf_out0 = "CR10"
roots = "CR11"
out0_d1 = "CR12"
out_tail_qf = "CR13"
tail_qf = "CR14"
full = "CR15"
out0_d2 = "LR14"
n = "LR15"

[cases.default]
