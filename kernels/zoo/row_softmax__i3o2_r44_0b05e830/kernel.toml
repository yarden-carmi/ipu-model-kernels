[kernel]
op = "row_softmax"
formats = ["e1", "e2", "e3"]

[params.n]
type = "int"
min = 1
max = 4096
default = 50
[params.rows]
type = "int"
min = 1
default = 600
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 12
[params.in0_d2]
type = "int"
min = 1
default = 50
[params.in0_d3]
type = "int"
min = 1
default = 50
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 12
[params.out0_d2]
type = "int"
min = 1
default = 50
[params.out0_d3]
type = "int"
min = 1
default = 50

[derived]
K = "ceil(n / 128)"
M = "rows * K"
batch_span = "out0_d1 * out0_d2 * K"
out_k = "ceil(out0_d2 / 128)"
full = "72 * 65536 + ds(128)"
tail = "ds(n - (K - 1) * 128)"
out_tail = "312 * 65536 + ds(out0_d2 - (out_k - 1) * 128)"
scratch_qf = "312 * 65536 + 56"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ceil(in0_d3 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d3", "out0_d1", "out_k", 128]
[scratch.tmp]
shape = [11, 128]
[scratch.roots]
shape = [8, "K", 128]
[scratch.probs]
shape = [2, "M", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
scratch_qf = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
K = "CR7"
M = "CR8"
qf_out0 = "CR10"
roots = "CR11"
batch_span = "CR12"
out_tail = "CR13"
tail = "CR14"
full = "CR15"
out0_d2 = "LR14"
n = "LR15"
probs = "LR7"

[cases.default]
