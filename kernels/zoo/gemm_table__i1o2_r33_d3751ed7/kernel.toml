[kernel]
op = "gemm_table"
formats = ["e2"]

[params.k]
type = "int"
min = 1
max = 4096
default = 384
[params.n]
type = "int"
min = 1
max = 4096
default = 1536
[params.m]
type = "int"
min = 1
max = 65535
default = 257
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["gelu"]
default = "gelu"
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 257
[params.in0_d2]
type = "int"
min = 1
max = 4096
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 257
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 1536

[derived]
tiles = "ceil(in0_d1 / 128)"
batch_stride = "tiles * in0_d2"
I = "in0_d0 * batch_stride"
O = "ceil(out0_d2 / 128)"
R = "out0_d0 * out0_d1 * O"
W = "O * (k + 1)"
G = "k // 16"
full = "ds(128)"
tail = "ds(out0_d2 - 128 * (O - 1))"

[inputs.in0]
shape = ["I", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["W", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["R", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
O = "CR8"
I = "CR9"
in0_d1 = "CR10"
batch_stride = "CR11"
G = "CR12"
tiles = "CR13"
full = "CR14"
tail = "CR15"

[cases.default]
