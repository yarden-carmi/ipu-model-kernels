[kernel]
op = "binary_mul_scalar"
formats = ["e1"]
[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 1048576
default = 384
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[inputs.in0]
shape = ["numel"]
range = [-2.0, 2.0]
[inputs.operand]
shape = [1]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["numel"]
[derived]
qf = "case_qf"
rows = "ceil(numel / 128)"
last = "ceil(numel / 128) - 1"
ds_tail = "ds(numel - (ceil(numel / 128) - 1) * 128)"
[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf = "CR5"
rows = "CR6"
last = "CR7"
ds_tail = "CR8"
[golden]
tolerance = { e1 = "EXACT" }
[cases.default]
numel = 384
[cases.tail]
numel = 257
[cases.tiny]
numel = 1
