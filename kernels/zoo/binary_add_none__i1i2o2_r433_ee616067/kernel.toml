[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 147456
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 144
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 16384
default = 32
[params.in1_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 256
default = 256
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 144
[params.out0_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 256
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 144

[derived]
blocks = "ceil(out0_d2 / 128)"
skip0 = "out0_d0 * blocks"
batch1 = "out0_d1 * blocks"
scalar = "ds(1)"
half0 = "ds(min(out0_d1, 128))"
half1 = "ds(max(1, out0_d1 - 128))"
channels = "out0_d2"
positions = "out0_d1"
tail_valid = "ds(max(1, (out0_d1 * out0_d2) % 128)) + 65536 * ds(0)"
pad_rows = "2 * out0_d2 - ceil(out0_d1 * out0_d2 / 128)"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d3", "ceil(in0_d1 / 128) * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "ceil(in1_d2 / 128) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "ceil(out0_d1 / 256)", "out0_d2 * 256"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
blocks = "CR8"
skip0 = "CR9"
batch1 = "CR10"
scalar = "CR11"
tail_valid = "CR12"
positions = "CR13"
channels = "CR14"
out0_d0 = "LR11"
pad_rows = "LR15"

[cases.default]
