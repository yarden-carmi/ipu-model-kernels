[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65535
default = 64
[params.m]
type = "int"
min = 1
max = 65535
default = 4096
[params.n]
type = "int"
min = 1
max = 65535
default = 256
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65535
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 64

[derived]
pack = "128 // out0_d3"
groups = "ceil(n / pack)"
stripes = "m // out0_d3"
blocks = "(k - 1) // 16"
active = "ds(pack * out0_d3)"
tail = "ds((1 + (n - 1) % pack) * out0_d3)"
input_width = "ds(in0_d3)"
input_rows = "in0_d0 * in0_d2 * in0_d1"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d1", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["groups * (4 + pack * 4 * (1 + blocks))", 128]
range = [0, 0]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["stripes * groups", 128]
[scratch.spatial]
shape = ["input_rows", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_coeff = "CR7"
qf_out0 = "CR8"
input_width = "CR9"
groups = "CR10"
pack = "CR11"
in0_d1 = "CR12"
spatial = "CR13"
active = "CR14"
tail = "CR15"
stripes = "LR11"
input_rows = "LR14"
blocks = "LR15"

[cases.default]
