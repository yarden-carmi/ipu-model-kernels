[kernel]
op = "binary_add"
formats = ["e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
numel = { type = "int", min = 1, max = 16777216, default = 49152 }
in0_d0 = { type = "int", min = 1, max = 1, default = 1 }
in0_d1 = { type = "int", min = 1, max = 16777216, default = 192 }
in0_d2 = { type = "int", min = 1, max = 16777216, default = 16 }
in0_d3 = { type = "int", min = 4, max = 128, default = 16 }
in1_d0 = { type = "int", min = 1, max = 4, default = 4 }
in1_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
in1_d2 = { type = "int", min = 1, max = 16777216, default = 192 }
out0_d0 = { type = "int", min = 1, max = 4, default = 4 }
out0_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
out0_d2 = { type = "int", min = 1, max = 16777216, default = 192 }

[derived]
p = "128 // in0_d3"
pack = "1 + (p - 1) * max(1 - min(1, in0_d2 % p), 1 - min(1, max(in0_d2 * in0_d3 - 64, 64 - in0_d2 * in0_d3) + 128 % in0_d3))"
pitch = "ceil(in0_d2 / pack)"
packed_width = "pack * in0_d3"
chunks = "ceil(out0_d2 / 128)"
tail_lanes = "(out0_d2 - 1) % 128 + 1"
tail_ds = "ds(tail_lanes)"
full_ds = "ds(128)"
dest_step = "16777216"
full_end = "128 * dest_step"
tail_end = "tail_lanes * dest_step"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * pitch", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * chunks", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
pitch = "CR8"
packed_width = "CR9"
out0_d1 = "CR10"
out0_d0 = "CR11"
full_end = "CR12"
tail_end = "CR13"
tail_ds = "CR14"
full_ds = "CR15"
dest_step = "LR14"
chunks = "LR15"

[cases.default]
