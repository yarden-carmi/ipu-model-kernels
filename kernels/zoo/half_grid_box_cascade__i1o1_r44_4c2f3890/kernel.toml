[kernel]
op = "half_grid_box_cascade"
formats = ["e2"]

[params.channels]
type = "int"
choices = [64]
default = 64
[params.oh]
type = "int"
min = 1
max = 65536
default = 64
[params.ow]
type = "int"
min = 2
max = 65536
default = 64
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
choices = [64]
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 32768
default = 32
[params.in0_d3]
type = "int"
min = 2
max = 32768
default = 32
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
choices = [64]
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d3]
type = "int"
min = 2
max = 65536
default = 64

[inputs.in0]
shape = ["(in0_d0 * in0_d2 * in0_d3 + 1) // 2", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3", 128]

[derived]
valid = "ds(out0_d1)"
pairs = "in0_d3 // 2"
# NX8 scalar encodings of 9/16, 3/16, and 1/16.
w9 = "19 * 65536 + 126 * 256 + 2"
w3 = "19 * 65536 + 124 * 256 + 8"
w1 = "19 * 65536 + 123 * 256"
f9 = "126 * 8388608 + 1048576"
f3 = "124 * 8388608 + 4194304"
f1 = "123 * 8388608"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
valid = "CR6"
pairs = "CR7"
in0_d2 = "CR8"
w9 = "CR9"
w3 = "CR10"
w1 = "CR11"
f9 = "CR12"
f3 = "CR13"
f1 = "CR14"

[cases.default]
