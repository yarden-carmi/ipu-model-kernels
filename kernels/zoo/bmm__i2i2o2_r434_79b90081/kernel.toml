[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=32767, default=16}
k = {type="int", min=1, max=128, default=48}
m = {type="int", min=1, max=32767, default=64}
n = {type="int", min=1, max=32767, default=64}
in0_d0 = {type="int", min=1, max=32767, default=4}
in0_d1 = {type="int", min=1, max=127, default=4}
in0_d2 = {type="int", min=1, max=32767, default=64}
in0_d3 = {type="int", min=1, max=128, default=48}
in1_d0 = {type="int", min=1, max=32767, default=4}
in1_d1 = {type="int", min=1, max=32767, default=64}
in1_d2 = {type="int", min=1, max=4194176, default=576}
out0_d0 = {type="int", min=1, max=32767, default=4}
out0_d1 = {type="int", min=1, max=127, default=4}
out0_d2 = {type="int", min=1, max=32767, default=64}
out0_d3 = {type="int", min=1, max=32767, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "query_tiles*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "brows*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d3", "out0_d1", "tiles*128"]

[scratch.query]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]

[derived]
query_tiles = "ceil(in0_d2/128)"
query_pitch = "query_tiles*in0_d3"
arows = "ceil(in0_d3/128)"
brows = "ceil(in1_d2/128)"
tiles = "ceil(out0_d2/128)"
offset = "in0_d1*k"
start_lane = "offset%128"
bbase = "base(in1)+offset//128"
pitch = "arows + 65536*brows"
# The query view interleaves heads in the stored row stream. The high
# half backs up from the last head to the next group's first head.
a_view = "in0_d1*arows + 65536*(in0_d1-1)*arows"
mn = "m + 65536*n"
kh = "k + 65536*(in0_d1+128*start_lane)"
out_pitch = "tiles + 65536*out0_d1*tiles"
ds_k = "ds(1)+65536*ds((k-1)%128+1)"
ds_m = "ds(128)+65536*ds((m-1)%128+1)"
b_next_group = "in1_d1*brows - (start_lane+in0_d1*k)//128"
a_end = "b*in0_d2*arows"

[abi]
query = "CR2"
in0 = "LR0"
query_tiles = "LR1"
query_pitch = "LR2"
in0_d2 = "LR3"
bbase = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
# The two operands share a format; the vector multiply uses CR5 for both.
qf_in1 = "LR15"
a_view = "CR6"
qf_out0 = "CR7"
pitch = "CR8"
mn = "CR9"
kh = "CR10"
out_pitch = "CR11"
ds_k = "CR12"
ds_m = "CR13"
b_next_group = "CR14"
a_end = "CR15"

[cases.default]
