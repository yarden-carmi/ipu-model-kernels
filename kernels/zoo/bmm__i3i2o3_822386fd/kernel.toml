[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=32767, default=16}
k = {type="int", min=1, max=128, default=36}
m = {type="int", min=1, max=32767, default=256}
n = {type="int", min=1, max=32767, default=256}
in0_d0 = {type="int", min=1, max=32767, default=4}
in0_d1 = {type="int", min=1, max=32767, default=4}
in0_d2 = {type="int", min=1, max=32767, default=256}
in0_d3 = {type="int", min=1, max=128, default=36}
in1_d0 = {type="int", min=1, max=32767, default=4}
in1_d1 = {type="int", min=1, max=32767, default=256}
in1_d2 = {type="int", min=1, max=4194176, default=432}
out0_d0 = {type="int", min=1, max=32767, default=4}
out0_d1 = {type="int", min=1, max=32767, default=4}
out0_d2 = {type="int", min=1, max=32767, default=256}
out0_d3 = {type="int", min=1, max=32767, default=256}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "brows*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[derived]
brows = "ceil(in1_d2/128)"
bsteps = "brows + (brows-1)*65536"
asteps = "in0_d1 + (in0_d1-1)*65536"
nk = "n + k*65536"
outrows = "b*m*ceil(n/128)"
key_offset = "in1_d2//3"
key_row = "key_offset//128"
key_lane = "key_offset%128"
heads_lane = "in0_d1 + key_lane*65536"
dsk = "ds(k)"
dsn = "ds(128) + ds((n-1)%128+1)*65536"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
bsteps = "CR8"
asteps = "CR9"
nk = "CR10"
m = "CR11"
outrows = "CR12"
heads_lane = "CR13"
dsk = "CR14"
dsn = "CR15"
key_row = "LR6"
key_lane = "LR8"

[cases.default]
