[kernel]
op = "gemm_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 24
[params.m]
type = "int"
min = 1
max = 65535
default = 784
[params.n]
type = "int"
min = 1
max = 4096
default = 88
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 24
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 28
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 88
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 28

[derived]
chunks = "ceil(k / 128)"
parts = "2 + 2 * (1 // chunks)"
in_chunks = "ceil(in0_d1 / 128)"
row_stride = "in0_d3 * in_chunks"
in_batch = "in0_d2 * row_stride"
full_ds = "ds(128)"
out_ds = "ds(out0_d2)"

[inputs.in0]
shape = ["in0_d0 * in_batch", 128]
range = [-2, 2]
[inputs.w]
shape = ["n * parts * (1 + chunks)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d3", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full_ds = "CR7"
out_ds = "CR8"
chunks = "CR9"
row_stride = "CR10"
out0_d2 = "CR11"
out0_d3 = "CR12"
n = "CR13"
out0_d0 = "CR14"
in_batch = "CR15"

[cases.default]
