kind = "estimation"
method = "tanh_exp2"
task = "unary_gelu"
hw_clean = true                       # every store is ACTIVATE.QUANTIZE; no ACTIVATE.EXACT, no BREAK
host_steps = []                       # one launch per call: the row loop is dynamic, the shape is CRs
chain_in = "x"                        # the activation input the previous kernel's output feeds
chain_out = "y"                       # the activation output the next kernel reads
unsupported = [
  "{\"fn\": \"gelu\", \"numel\": 525312}: above the declared maximum. numel <= 524160 = 4095 rows: x, y and the two row registers (x^2/m/e/w and |x|/q) take one row each per 128 lanes, so a call is 4*rows + 2 = 16382 of the 16384 addressable NX8 rows. The program loops any number of rows; the maximum is the memory a single launch fits in.",
  "{\"fn\": \"gelu\", \"numel\": 0}: an empty call: numel starts at 1 (rows would be 0 and every loop's bound negative).",
]
notes = """One parameterised program for every numel: y = gelu(x) elementwise, x and y the
plain activation layout (row r holds lanes 128r .. 128r+127, lanes past numel zero), so the
kernel reads the rows the previous kernel wrote and writes the rows the next one reads, with
no repack and no host step between them. Hardware-clean NX8: formats = ["dynamic"], every
store an ACTIVATE.QUANTIZE (identity, exp2 or reciprocal), no ACTIVATE.EXACT and no BREAK.
The must-cover call (gelu at 393216 elements, sentence-transformers/all-MiniLM-L6-v2, x6 per
forward) is one launch: the row loop's bound is a CR, so 3072 iterations of the same words.
Dataflow: gelu is x * sigmoid(z) with z = c (x + 0.044715 x^3), c = 2 sqrt(2/pi) -- the tanh
form, kind estimation because its deviation from the erf form is at most ~3.4e-4 absolute
(around |x| ~ 2); the kernel's own constants hold the tanh form to 5e-6 relative. The sigmoid
goes through -|z| (exp2 of a positive input is an AaQ error): s = x^2 (one MULT.RC.VS),
m = -(log2 e) c - (log2 e) c 0.044715 s (two MULT.RC.VE and two MULT.EE of the ones row's
element 0 -- the row is the program's own exp2(0) store, the host prepares no constant;
each MULT constant is an 8-bit NX8 element, so each coefficient is the sum of two dyadic
parts), t = |x| (ACC.MAX of x*1.0 and its negation), e = ACTIVATE.QUANTIZE exp2 of the
MULT.RC.VV product t*m stored in the same word (the argument is <= 0 in every lane),
q = AaQ reciprocal of 1 + e stored into t's rows, w = e q (one MULT.RC.VV) stored into e's
rows, and the two signed branches joined by y = ACC.MAX of x q and x w -- for x >= 0 the
larger is x q, for x < 0 both are negative and the smaller magnitude x w = x sigmoid(z) wins,
so no compare and no sign test exists in the program. Two row registers serve all four
intermediates (s: x^2, m, e, w; t: |x|, q), so a call is 4*rows + 2 XMEM rows and 16 words
per row, 13 of them multiplying -- 393216 elements in 49182 cycles. The short last row of a
call is emitted straight-line in every pass with the DS half that names exactly its live
lanes, so its row scale comes from real data and the lanes past numel are written 0; the
last full row is emitted straight-line too, which keeps every one-row-ahead prefetch inside
the regions. Every LR the program reads is set by it, R_MASK is loaded from its own all-ones
scratch row, every accumulation is seeded with a .FIRST form and each pass's prologue primes
the registers its MULTs read, so it runs after another kernel as well as from reset.
Limits: fn = gelu and numel 1..524160 (4095 rows: 4*rows + 2 of the 16384 addressable NX8
rows); there is no FP32 variant (dynamic is the chip's NX8 type and FP32 addresses 4096 rows
only). Input range [-8, 8]: the exp2 argument is -(|z| log2 e) and stays <= 0, reaching
about -74 at x = 8, which underwrites e to 0 and the output to +-x exactly. Accuracy: seven
8-bit row round-trips (x^2, m, |x|, e, q, w and the output store), so the tolerance is
NX8_STEP 3 ulps; measured within 3 steps of the output row's grid over every case."""
