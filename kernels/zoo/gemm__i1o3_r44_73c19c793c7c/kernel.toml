[kernel]
op = "gemm"
formats = ["e1"]
[params]
bias = { type = "bool", default = true }
k = { type = "int", min = 1, max = 128, default = 64 }
m = { type = "int", min = 1, max = 65536, default = 4096 }
n = { type = "int", min = 1, max = 65536, default = 64 }
in0_d0 = { type = "int", min = 1, max = 1, default = 1 }
in0_d1 = { type = "int", min = 1, max = 128, default = 64 }
in0_d2 = { type = "int", min = 1, max = 65536, default = 64 }
in0_d3 = { type = "int", min = 64, max = 64, default = 64 }
out0_d0 = { type = "int", min = 1, max = 1, default = 1 }
out0_d1 = { type = "int", min = 1, max = 65536, default = 64 }
out0_d2 = { type = "int", min = 1, max = 65536, default = 64 }
out0_d3 = { type = "int", min = 64, max = 64, default = 64 }
[derived]
groups = "ceil(out0_d2 / 3)"
width = "groups * 2"
full = "ds(128)"
half = "ds(64)"
zero = "ds(0)"
kds = "ds(k)"
one = "ds(1)"
c128 = "128"
c64 = "64"
[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * ceil(in0_d1 / 128)", 128]
[inputs.w]
shape = ["n * 2", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * width", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
groups = "CR7"
n = "CR8"
full = "CR9"
half = "CR10"
zero = "CR11"
kds = "CR12"
one = "CR13"
c128 = "CR14"
c64 = "CR15"
[cases.default]
