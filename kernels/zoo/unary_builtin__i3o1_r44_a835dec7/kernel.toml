[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 16384
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 16

[derived]
heights = "in0_d0 * in0_d2"
in_rows = "heights * in0_d1"
out_rows = "out0_d0 * out0_d2 * out0_d3"
active = "ds(out0_d1)"
full = "ds(128)"

[inputs.in0]
shape = ["in_rows", 128]
range = [-1.0, 1.0]
[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
in0_d1 = "CR7"
in0_d3 = "CR9"
heights = "CR10"
active = "CR11"
full = "CR12"

[cases.default]
