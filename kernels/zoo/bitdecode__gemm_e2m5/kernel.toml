[kernel]
op = "bitdecode__gemm_e2m5"
formats = ["e2"]
[params]
s0_tokens = {type="int", min=128, max=256, multiple_of=128, default=128}
s0_vocab = {type="int", min=8, max=30522, default=9}
s1_m = {type="int", min=128, max=256, multiple_of=128, default=128}
s1_k = {type="int", min=8, max=30522, default=9}
s1_n = {type="int", min=128, max=1024, multiple_of=128, default=128}
s1_bias = {type="bool", choices=[false], default=false}
sharp = {type="float", default=1024.0}
eight = {type="float", default=8.0}
five = {type="float", default=5.0}
[inputs]
in0 = {shape=[1,"s0_tokens"], range=[0,7]}
w = {shape=["s1_k","s1_n"], range=[-2,2]}
[scratch]
ones = {shape=[128], fill=1}
work = {shape=[2,128]}
sel = {shape=["s0_tokens // 128","ke",128]}
[outputs]
out0 = {shape=[1,"s1_m","s1_n"]}
[derived]
qf = "case_qf"
ke = "min(s0_vocab,8)"
[abi]
in0 = "CR2"
w = "CR3"
ones = "CR4"
work = "CR5"
sel = "CR6"
out0 = "CR7"
qf = "CR8"
sharp = "CR9"
eight = "CR10"
five = "CR11"
[golden]
tolerance = {e2="EXACT"}
[cases.default]
[cases.wide]
s0_tokens = 256
s1_m = 256
s1_n = 256
s0_vocab = 20
s1_k = 20
[cases.short]
s0_vocab = 8
s1_k = 8
