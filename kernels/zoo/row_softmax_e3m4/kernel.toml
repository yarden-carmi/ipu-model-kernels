[kernel]
op = "row_softmax"
formats = ["e3"]
[params.n]
type = "int"
min = 1
max = 128
default = 50
[params.rows]
type = "int"
min = 1
max = 8192
default = 4
[inputs.in0]
shape = ["ceil(rows * n / 128)", 128]
range = [-2, 2]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["ceil(rows * n / 128)", 128]
[scratch.results]
shape = ["rows", 128]
[scratch.tmp]
shape = [8, 128]
fill = 1
[derived]
qf = "case_qf"
active = "ds(n)"
total = "rows * n"
full = "ds(128)"
tail = "ds(max((rows * n) % 128, 1))"
memrows = "ceil(rows * n / 128)"
width = "128"
[abi]
in0 = "CR2"
out0 = "CR3"
lut = "CR4"
tmp = "CR5"
qf = "CR6"
active = "CR15"
rows = "CR7"
results = "CR8"
n = "CR9"
total = "CR10"
full = "CR11"
tail = "CR12"
memrows = "CR13"
width = "CR14"
[golden]
tolerance = { e3 = "NX8_STEP" }
[cases.default]
n = 50
rows = 4
[cases.full]
n = 64
rows = 4
