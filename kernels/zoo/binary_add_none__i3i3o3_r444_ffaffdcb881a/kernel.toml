[kernel]
op = "binary_add"
formats = ["e1", "e2"]
[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 16384 }
in0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in0_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
in0_d2 = { type = "int", min = 1, max = 16777216, default = 16 }
in0_d3 = { type = "int", min = 1, max = 16777216, default = 16 }
in1_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in1_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
in1_d2 = { type = "int", min = 1, max = 16777216, default = 16 }
in1_d3 = { type = "int", min = 1, max = 16777216, default = 16 }
out0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
out0_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
out0_d2 = { type = "int", min = 1, max = 16777216, default = 16 }
out0_d3 = { type = "int", min = 1, max = 16777216, default = 16 }
[derived]
rows = "ceil(out0_d0 * out0_d1 * out0_d2 / 8) * ceil(8 * out0_d3 / 128)"
last_row = "rows - 1"
loop_bound = "rows - 2"
active = "ds(min(128, 8 * out0_d3))"
[inputs.in0]
shape = ["ceil(in0_d0 * in0_d1 * in0_d2 / 8) * ceil(8 * in0_d3 / 128)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["ceil(in1_d0 * in1_d1 * in1_d2 / 8) * ceil(8 * in1_d3 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
active = "CR8"
last_row = "CR9"
loop_bound = "CR11"
[cases.default]
