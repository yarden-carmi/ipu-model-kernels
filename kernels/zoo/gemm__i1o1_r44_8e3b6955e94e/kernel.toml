[kernel]
op = "gemm"
formats = ["e1"]
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 128
default = 64
[params.n]
type = "int"
min = 1
max = 64
default = 64
[params.m]
type = "int"
min = 1
max = 65536
default = 4096
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d3]
type = "int"
min = 2
max = 65536
multiple_of = 2
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 64
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d3]
type = "int"
min = 2
max = 65536
multiple_of = 2
default = 64
[derived]
full = "ds(2 * n)"
tail = "ds(n)"
groups = "in0_d0 * in0_d2"
pairs = "ceil(in0_d3 / 2)"
slot = "128"
minusone = "-1"
[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3", 128]
[inputs.w]
shape = ["2 * k + 2", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * ceil(out0_d3 / 2)", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
groups = "CR9"
pairs = "CR10"
k = "CR11"
slot = "CR12"
minusone = "CR13"
[golden]
tolerance = {e1 = "NX8_STEP"}
[cases.default]
