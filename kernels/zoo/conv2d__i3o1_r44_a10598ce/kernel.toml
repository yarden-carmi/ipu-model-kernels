[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = false
[params.cin]
type = "int"
min = 1
max = 512
default = 192
[params.cout]
type = "int"
min = 1
max = 768
default = 64
[params.groups]
type = "int"
min = 1
max = 1
default = 1
[params.h]
type = "int"
min = 3
max = 128
default = 16
[params.w]
type = "int"
min = 3
max = 128
default = 16
[params.kh]
type = "int"
min = 3
max = 3
default = 3
[params.kw]
type = "int"
min = 3
max = 3
default = 3
[params.padding]
type = "int"
min = 0
max = 1
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 1

[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 192
[params.in0_d2]
type = "int"
min = 3
max = 128
default = 16
[params.in0_d3]
type = "int"
min = 3
max = 128
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 768
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 16

[derived]
pack = "128 // in0_d3"
input_rows = "in0_d0 * in0_d1 * ((in0_d2 + pack - 1) // pack)"
blocks = "(out0_d1 + 127) // 128"
weight_rows = "1 + kh * kw * cin"
full = "ds(128)"
tail = "ds((out0_d1 - 1) % 128 + 1)"
y_end = "out0_d2 * stride - padding"
x_end = "out0_d3 * stride - padding"
panel = "kw * cin"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1, 1]
[inputs.weights]
shape = ["blocks", "weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d3", "blocks", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_weights = "CR6"
qf_out0 = "CR7"
full = "CR8"
tail = "CR9"
cin = "CR10"
in0_d2 = "CR11"
in0_d3 = "CR12"
y_end = "CR13"
x_end = "CR14"
panel = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
