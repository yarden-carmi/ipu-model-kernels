[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 384
[params.m]
type = "int"
min = 1
max = 65536
default = 257
[params.n]
type = "int"
min = 1
max = 65536
multiple_of = 128
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 6
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 384
[params.in1_d0]
type = "int"
min = 1
max = 128
default = 2
[params.in1_d1]
type = "int"
min = 1
max = 65536
default = 512
[params.in1_d2]
type = "int"
min = 1
max = 65536
multiple_of = 128
default = 256
[derived]
tiles = "ceil(n / 128)"
full = "ds(128)"
tail = "ds((n - 1) % 128 + 1)"
rows = "out0_d0 * out0_d1"
last_lane = "in0_d3 - 2 + (1 - min(1, max(m - 257, 257 - m) + max(k - 384, 384 - k)))"
slot = "128"
minusone = "-1"
groups = "ceil(in1_d1 / (128 // in1_d0))"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2", 128]
[inputs.w]
shape = ["tiles * (k + 1) + 1", 128]
[inputs.in1]
shape = ["in1_d2 * groups", 128]
[outputs.out0]
shape = ["rows * ceil(out0_d2 / 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
qf_in1 = "CR10"
rows = "CR11"
k = "CR12"
in0_d3 = "CR13"
in1 = "CR14"
slot = "CR15"
groups = "LR13"
in1_d1 = "LR14"
in1_d0 = "LR15"

[golden]
tolerance = {e2 = "NX8_STEP", e3 = "NX8_STEP"}

[cases.default]
