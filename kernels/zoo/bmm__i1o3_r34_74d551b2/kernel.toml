[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=32767, default=12}
k = {type="int", min=1, max=32767, default=64}
m = {type="int", min=1, max=32767, default=256}
n = {type="int", min=1, max=32767, default=256}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=32767, default=256}
in0_d2 = {type="int", min=1, max=65535, default=2304}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=12}
out0_d2 = {type="int", min=1, max=32767, default=256}
out0_d3 = {type="int", min=1, max=32767, default=256}

[inputs.in0]
shape = ["in0_d0", "in0_d2", "stride*128"]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "tiles*128"]

[derived]
stride = "ceil(in0_d1/128)"
tiles = "ceil(out0_d3/128)"
group_step = "in0_d2*stride"
head_step = "k*stride"
key_offset = "out0_d1*head_step"
widths = "ds(128)+65536*ds((n-1)%128+1)"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
stride = "CR6"
tiles = "CR7"
group_step = "CR8"
head_step = "CR9"
key_offset = "CR10"
widths = "CR11"
k = "CR12"
m = "CR13"
out0_d1 = "CR14"
out0_d0 = "LR14"

[cases.default]
