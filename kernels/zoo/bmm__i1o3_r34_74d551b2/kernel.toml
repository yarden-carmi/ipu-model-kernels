[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=65536, default=12}
k = {type="int", min=1, max=65536, default=64}
m = {type="int", min=1, max=65536, default=256}
n = {type="int", min=1, max=65536, default=256}
in0_d0 = {type="int", min=1, max=65536, default=1}
in0_d1 = {type="int", min=1, max=65536, default=256}
in0_d2 = {type="int", min=1, max=65536, default=2304}
out0_d0 = {type="int", min=1, max=65536, default=1}
out0_d1 = {type="int", min=1, max=65536, default=12}
out0_d2 = {type="int", min=1, max=65536, default=256}
out0_d3 = {type="int", min=1, max=65536, default=256}

[inputs.in0]
shape = ["in0_d0", "in0_d2", "stride*128"]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[derived]
stride = "ceil(in0_d1/128)"
head_rows = "k*stride"
key_offset = "out0_d1*head_rows"
group_gap = "in0_d2*stride-key_offset"
tiles = "ceil(n/128)"
ds = "ds(128)+65536*ds((n-1)%128+1)"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
stride = "CR6"
k = "CR7"
m = "CR8"
tiles = "CR9"
ds = "CR10"
out0_d1 = "CR11"
head_rows = "CR12"
key_offset = "CR13"
group_gap = "CR14"
out0_d0 = "LR4"

[cases.default]
