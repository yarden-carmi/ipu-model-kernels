[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
default = 64
[params.cout]
type = "int"
min = 1
default = 32
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 1
default = 64
[params.w]
type = "int"
min = 1
max = 256
default = 64
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 64
[params.in0_d2]
type = "int"
min = 1
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 64
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 32
[params.out0_d2]
type = "int"
min = 1
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 256
default = 64

[derived]
max_pack = "min(in0_d2, max(1, 128 // in0_d3))"
pack = "1 + (max_pack - 1) * (1 - min(1, in0_d2 % max_pack))"
chunks = "ceil(in0_d3 / 128)"
pitch = "in0_d2 * chunks"
input_rows = "pitch * in0_d1"
packed_rows = "input_rows // pack"
weight_rows = "1 + 2 * in0_d1 * out0_d1"
full = "ds(128)"
tail = "ds((out0_d3 - 1) % 128 + 1)"
last_y = "in0_d2 - 1"
unpack_end = "128 + pack * in0_d3"

[inputs.in0]
shape = ["packed_rows", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d1", "out0_d2", "chunks", 128]
[scratch.clean]
shape = ["input_rows", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
last_y = "CR9"
pitch = "CR10"
packed_rows = "CR11"
weight_rows = "CR12"
input_rows = "CR13"
clean = "CR14"
unpack_end = "CR15"

[cases.default]
