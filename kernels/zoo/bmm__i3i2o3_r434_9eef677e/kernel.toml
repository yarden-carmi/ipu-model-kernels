[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=65535, default=6}
k = {type="int", min=1, max=65535, default=1829}
m = {type="int", min=1, max=65535, default=1829}
n = {type="int", min=1, max=65535, default=64}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=6}
in0_d2 = {type="int", min=1, max=65535, default=1829}
in0_d3 = {type="int", min=1, max=65535, default=1829}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=65535, default=1829}
in1_d2 = {type="int", min=1, max=8388480, default=384}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=6}
out0_d2 = {type="int", min=1, max=65535, default=1829}
out0_d3 = {type="int", min=1, max=65535, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "arows*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "brows*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[derived]
arows = "ceil(in0_d3/128)"
brows = "ceil(in1_d2/128)"
stride = "brows + arows*65536"
ds = "ds(128) + ds((n-1)%128+1)*65536"
mh = "m + in0_d1*65536"
group_rows = "in1_d1*brows"
all_group_rows = "in1_d0*group_rows"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
all_group_rows = "CR5"
k = "CR6"
n = "CR7"
mh = "CR8"
stride = "CR9"
ds = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
group_rows = "CR14"

[cases.default]
b = 4
k = 16
m = 2
n = 64
in0_d0 = 2
in0_d1 = 2
in0_d2 = 2
in0_d3 = 16
in1_d0 = 2
in1_d1 = 16
in1_d2 = 128
out0_d0 = 2
out0_d1 = 2
out0_d2 = 2
out0_d3 = 64

[cases.split_heads]
b = 3
k = 129
m = 2
n = 191
in0_d0 = 1
in0_d1 = 3
in0_d2 = 2
in0_d3 = 129
in1_d0 = 1
in1_d1 = 129
in1_d2 = 573
out0_d0 = 1
out0_d1 = 3
out0_d2 = 2
out0_d3 = 191
