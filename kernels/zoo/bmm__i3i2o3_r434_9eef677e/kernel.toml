[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=65535, default=6}
k = {type="int", min=1, max=32767, default=1829}
m = {type="int", min=1, max=32767, default=1829}
n = {type="int", min=1, max=128, default=64}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=32767, default=6}
in0_d2 = {type="int", min=1, max=32767, default=1829}
in0_d3 = {type="int", min=1, max=32767, default=1829}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=32767, default=1829}
in1_d2 = {type="int", min=1, max=4194176, default=384}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=32767, default=6}
out0_d2 = {type="int", min=1, max=32767, default=1829}
out0_d3 = {type="int", min=1, max=128, default=64}

[derived]
arows = "ceil(in0_d3/128)"
brows = "ceil(in1_d2/128)"
offset = "in1_d2-out0_d1*n"
vbase = "base(in1)+offset//128"
lane = "offset%128"
group_rows = "in1_d1*brows"
total_rows = "in1_d0*group_rows"
counts = "out0_d1 + 65536*m"
ds = "ds(n)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "arows*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "brows*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", 128]

[abi]
in0 = "CR2"
vbase = "CR3"
out0 = "CR4"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
brows = "CR9"
group_rows = "CR10"
total_rows = "CR11"
lane = "CR12"
counts = "CR13"
ds = "CR14"
k = "CR15"

[cases.default]
