chain = ["bmm"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [0, 1, 2]
[view.in0]
kind = "whole"

[layout.in1]
lanes = 2
rows = [0, 1]
[view.in1]
kind = "heads"

[layout.out0]
lanes = 3
rows = [0, 1, 2]

[format.in0]
format = "e2"
scale = 1

[format.in1]
format = "e2"
scale = 3
