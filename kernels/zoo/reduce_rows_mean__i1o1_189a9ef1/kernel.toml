[kernel]
op = "reduce_rows_mean"
formats = ["e1", "e2"]
[params.kind]
type = "str"
choices = ["mean"]
default = "mean"
[params.n]
type = "int"
min = 1
max = 65535
default = 12
[params.rows]
type = "int"
min = 1
max = 65535
default = 16
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 3
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 4
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 16
[params.out0_d2]
type = "int"
choices = [1]
default = 1
[params.out0_d3]
type = "int"
choices = [1]
default = 1
[derived]
cb = "ceil(in0_d1 / 128)"
cbm1 = "ceil(in0_d1 / 128) - 1"
valid = "ds(128)"
lastv = "ds(in0_d1 - 128 * (ceil(in0_d1 / 128) - 1))"
[inputs.in0]
shape = ["n", "cb * 128"]
[inputs.rinv]
shape = [2, 128]
range = [0, 1]
[scratch.tmp]
shape = ["cb", 128]
[outputs.out0]
shape = ["cb", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
rinv = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
n = "CR7"
cb = "CR8"
cbm1 = "CR9"
valid = "CR15"
lastv = "CR14"
tmp = "CR10"
[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
n = 12
