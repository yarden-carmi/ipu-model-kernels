chain = ["conv2d"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [0, 1, 2]
pack = "d2"
[view.in0]
kind = "whole"

[layout.in1]
lanes = 3
rows = [0, 1, 2]
pack = "min(d2, 128 // d3)"
[view.in1]
kind = "whole"

[prefer.in1]
lanes = 3
rows = [0, 1, 2]
pack = "min(d2, 128 // d3)"

[layout.out0]
lanes = 3
rows = [0, 1, 2]
pack = "min(d2, 128 // d3)"

[lut.out0]
range_mode = 2
range_exp = 40
