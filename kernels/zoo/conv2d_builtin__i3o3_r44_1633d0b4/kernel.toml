[kernel]
op = "conv2d_builtin"
formats = ["e1"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
default = 64
[params.cout]
type = "int"
min = 1
default = 8
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 1
default = 224
[params.w]
type = "int"
min = 1
max = 256
default = 224
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 64
[params.in0_d2]
type = "int"
min = 1
default = 224
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 224
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 8
[params.out0_d2]
type = "int"
min = 1
default = 224
[params.out0_d3]
type = "int"
min = 1
max = 256
default = 224

[derived]
chunks = "ceil(in0_d3 / 128)"
out_chunks = "ceil(out0_d3 / 128)"
channel_pitch = "in0_d2 * chunks"
batch_pitch = "channel_pitch * in0_d1"
next_batch = "batch_pitch - channel_pitch"
out_rows = "out0_d0 * out0_d2 * out0_d1 * out_chunks"
weight_rows = "1 + 2 * in0_d1 * out0_d1"
full = "ds(128)"
tail = "ds((out0_d3 - 1) % 128 + 1)"
input_rows = "in0_d0 * batch_pitch"
last_y = "in0_d2 - 1"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "chunks", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out_rows", 128]

[scratch.clean]
shape = ["input_rows", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
last_y = "CR9"
channel_pitch = "CR10"
batch_pitch = "CR11"
next_batch = "CR12"
out_rows = "CR13"
weight_rows = "CR14"
clean = "CR15"
input_rows = "LR5"

[cases.default]
cin = 3
cout = 2
h = 3
w = 129
in0_d0 = 2
in0_d1 = 3
in0_d2 = 3
in0_d3 = 129
out0_d0 = 2
out0_d1 = 2
out0_d2 = 3
out0_d3 = 129

[cases.single_chunk]
bias = false
cin = 2
cout = 2
h = 1
w = 7
in0_d1 = 2
in0_d2 = 1
in0_d3 = 7
out0_d1 = 2
out0_d2 = 1
out0_d3 = 7
