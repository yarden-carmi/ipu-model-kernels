batches = "in0_d0"
[inputs.in0]
shape = ["in0_d0", "in0_d1", "spatial", 128]
[inputs.w]
shape = ["n * (2 + 2 * ceil(k / 16))", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "ceil(out0_d2 / pack)", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
spatial = "CR7"
full = "CR8"
