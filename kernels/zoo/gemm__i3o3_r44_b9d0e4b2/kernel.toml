[derived]
pack = "128 // in0_d3"
spatial = "ceil(in0_d2 / pack)"
batch_stride = "in0_d1 * spatial"
full = "ds(pack * in0_d3)"
tail = "ds(((out0_d2 - 1) % pack + 1) * out0_d3)"
