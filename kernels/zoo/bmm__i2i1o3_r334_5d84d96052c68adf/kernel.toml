[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=65536, default=2}
k = {type="int", min=1, max=65536, default=32}
m = {type="int", min=1, max=65536, default=16}
n = {type="int", min=1, max=65536, default=48}
in0_d0 = {type="int", min=1, max=65536, default=1}
in0_d1 = {type="int", min=1, max=65536, default=16}
in0_d2 = {type="int", min=1, max=65536, default=64}
in1_d0 = {type="int", min=1, max=65536, default=1}
in1_d1 = {type="int", min=1, max=65536, default=48}
in1_d2 = {type="int", min=1, max=65536, default=64}
out0_d0 = {type="int", min=1, max=65536, default=1}
out0_d1 = {type="int", min=1, max=65536, default=2}
out0_d2 = {type="int", min=1, max=65536, default=16}
out0_d3 = {type="int", min=1, max=65536, default=48}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2/128)*128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "ceil(in1_d1/128)*128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[derived]
ds = "ds(128)+65536*ds((n-1)%128+1)"
tiles = "ceil(n/128)"
a_stride = "ceil(in0_d2/128)"
b_stride = "ceil(in1_d1/128)"
a_wrap = "in0_d1*a_stride-(out0_d1*k)//128"
b_wrap = "(in1_d2-out0_d1*k)*b_stride"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
k = "CR6"
m = "CR7"
tiles = "CR8"
a_stride = "CR9"
ds = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
b_stride = "CR14"
out0_d1 = "CR15"
a_wrap = "LR14"
b_wrap = "LR13"

[cases.default]
