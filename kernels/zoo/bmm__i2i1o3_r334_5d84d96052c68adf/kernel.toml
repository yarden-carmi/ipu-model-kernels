[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=2147483647, default=12}
k = {type="int", min=1, max=2147483647, default=32}
m = {type="int", min=1, max=32767, default=256}
n = {type="int", min=1, max=4194176, default=256}
in0_d0 = {type="int", min=1, max=2147483647, default=1}
in0_d1 = {type="int", min=1, max=2147483647, default=256}
in0_d2 = {type="int", min=1, max=4194176, default=384}
in1_d0 = {type="int", min=1, max=2147483647, default=1}
in1_d1 = {type="int", min=1, max=4194176, default=256}
in1_d2 = {type="int", min=1, max=2147483647, default=384}
out0_d0 = {type="int", min=1, max=2147483647, default=1}
out0_d1 = {type="int", min=1, max=32767, default=12}
out0_d2 = {type="int", min=1, max=2147483647, default=256}
out0_d3 = {type="int", min=1, max=4194176, default=256}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "arows*128"]
range = [-1, 1]

[inputs.in1]
shape = ["in1_d0", "in1_d2", "tiles*128"]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3/128)*128"]

[derived]
k_tail16 = "k%16+64*65536"
dsfull = "ds(128) + ds((n-1)%128+1)*65536"
arows = "ceil(in0_d2/128)"
tiles = "ceil(n/128)"
features = "out0_d1*k"
agap = "min(1,in0_d0-1)*in0_d1*arows-features//128"
bgap = "(min(1,in1_d0-1)*in1_d2-features)*tiles"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
k = "CR6"
m = "CR7"
tiles = "CR8"
arows = "CR9"
dsfull = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
k_tail16 = "CR14"
out0_d1 = "CR15"
agap = "LR14"
bgap = "LR13"

[cases.default]
b = 12
k = 32
m = 256
n = 256
in0_d0 = 1
in0_d1 = 256
in0_d2 = 384
in1_d0 = 1
in1_d1 = 256
in1_d2 = 384
out0_d0 = 1
out0_d1 = 12
out0_d2 = 256
out0_d3 = 256
