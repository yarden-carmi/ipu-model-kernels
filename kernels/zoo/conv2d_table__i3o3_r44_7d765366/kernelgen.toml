formats = ["e2"]
chain = ["conv2d"]
chain_in = ["in0"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [1, 0, 2]
pack = "d2"
pad = "(-d2 * d3) % 256"
[view.in0]
kind = "whole"

[layout.out0]
lanes = 3
rows = [1, 0, 2]
pack = "min(d2, max(1, 128 // d3))"

[lut.out0]
range_mode = 2
range_exp = 40
