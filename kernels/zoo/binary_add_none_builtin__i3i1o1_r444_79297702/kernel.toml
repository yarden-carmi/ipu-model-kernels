[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
act_out0 = { type = "str", choices = ["relu"], default = "relu" }
numel = { type = "int", min = 1, max = 16777216, default = 200704 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, max = 128, default = 64 }
in0_d2 = { type = "int", min = 2, multiple_of = 2, default = 56 }
in0_d3 = { type = "int", min = 1, max = 64, default = 56 }
in1_d0 = { type = "int", min = 1, default = 1 }
in1_d1 = { type = "int", min = 1, max = 128, default = 64 }
in1_d2 = { type = "int", min = 1, default = 56 }
in1_d3 = { type = "int", min = 1, default = 56 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, max = 128, default = 64 }
out0_d2 = { type = "int", min = 1, default = 56 }
out0_d3 = { type = "int", min = 1, default = 56 }

[derived]
channel_stride = "in0_d2 // 2"
batch_stride = "channel_stride * in0_d1"
pair_lanes = "2 * in0_d3"
mask = "ds(out0_d1)"
pixels = "out0_d0 * out0_d2 * out0_d3"

[inputs.in0]
shape = ["in0_d0 * batch_stride", 128]
range = [-2, 2]

[inputs.in1]
shape = ["in1_d0 * in1_d2 * in1_d3", 128]
range = [-2, 2]

[outputs.out0]
shape = ["pixels", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
channel_stride = "CR8"
batch_stride = "CR9"
pair_lanes = "CR10"
mask = "CR11"
pixels = "CR12"
out0_d1 = "CR13"

[cases.default]
