[kernel]
op = "gemm"
formats = ["e2", "e3"]
[params.m]
type = "int"
min = 1
max = 65536
default = 2
[params.k]
type = "int"
min = 1
max = 4096
default = 128
[params.n]
type = "int"
min = 1
max = 4096
default = 128
[params.bias]
type = "bool"
default = true
[derived]
K = "ceil(k / 128)"
c128 = "128"
[inputs.in0]
shape = [1, "m", "k"]
range = [-2, 2]
[inputs.w]
shape = ["n * K * 3", 128]
range = [-2, 2]
[inputs.b]
shape = ["3 * n", 128]
range = [-2, 2]
when = "bias"
[outputs.out0]
shape = ["n * ceil(m / 128)", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
K = "CR7"
n = "CR8"
qf_in0 = "CR9"
qf_out0 = "CR10"
c128 = "CR11"
[golden]
tolerance = { e2 = "NX8_STEP", e3 = "NX8_STEP" }
[cases.default]
m = 2
k = 129
n = 3
bias = true
