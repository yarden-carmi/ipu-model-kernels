[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=65535, default=16}
k = {type="int", min=1, max=256, default=64}
m = {type="int", min=2, max=65534, multiple_of=2, default=64}
n = {type="int", min=1, max=64, default=48}
in0_d0 = {type="int", min=1, max=65535, default=4}
in0_d1 = {type="int", min=1, max=65535, default=4}
in0_d2 = {type="int", min=2, max=65534, multiple_of=2, default=64}
in0_d3 = {type="int", min=1, max=256, default=64}
in1_d0 = {type="int", min=1, max=65535, default=4}
in1_d1 = {type="int", min=1, max=256, default=64}
in1_d2 = {type="int", min=1, max=4194176, default=576}
out0_d0 = {type="int", min=1, max=65535, default=4}
out0_d1 = {type="int", min=1, max=65535, default=4}
out0_d2 = {type="int", min=2, max=65534, multiple_of=2, default=64}
out0_d3 = {type="int", min=1, max=64, default=48}

[derived]
arows = "ceil(in0_d3/128)"
brows = "ceil(in1_d2/128)"
chunks = "ceil(k/128)"
tile_config = "brows + 65536*max(0,n*chunks + 2*(k//16)-2)"
head_pairs = "out0_d1 + (m//2)*65536"
offset = "in1_d2-out0_d1*n"
vbase = "base(in1)+offset//128"
lane = "offset%128 + 65536*ds(128)"
group_rows = "in1_d1*brows"
total_rows = "in1_d0*group_rows"
dots = "ds(min(k,128)+(n-min(k,128))*max(0,1-min(1,max(k-16,16-k)+max(n-60,60-n)))) + 65536*ds((k-1)%128+1)"
emit = "ds(2*n) + 65536*ds(1)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "arows*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "brows*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2//2", 128]
[scratch.panel]
shape = ["n*chunks+32", 128]

[abi]
in0 = "CR2"
vbase = "CR3"
out0 = "CR4"
panel = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
tile_config = "CR9"
group_rows = "CR10"
total_rows = "CR11"
lane = "CR12"
head_pairs = "CR13"
dots = "CR14"
emit = "CR15"

[cases.default]
