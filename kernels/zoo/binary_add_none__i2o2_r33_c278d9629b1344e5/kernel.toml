[kernel]
op = "binary_add"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
const = { type = "float", min = 1, max = 1, default = 1 }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 196608 }
in0_d0 = { type = "int", min = 1, max = 4096, default = 1 }
in0_d1 = { type = "int", min = 1, max = 16384, default = 256 }
in0_d2 = { type = "int", min = 1, max = 16384, default = 768 }
out0_d0 = { type = "int", min = 1, max = 4096, default = 1 }
out0_d1 = { type = "int", min = 1, max = 16384, default = 256 }
out0_d2 = { type = "int", min = 1, max = 16384, default = 768 }

[derived]
chunks = "ceil(in0_d2 / 128)"
rows = "in0_d0 * in0_d1 * chunks"
last_chunk = "chunks - 1"
full = "ds(128)"
tail = "ds(out0_d2 - last_chunk * 128)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "chunks * 128"]
range = [-2, 2]

[inputs.operand]
shape = ["in0_d0", "in0_d1", "chunks * 128"]
range = [-2, 2]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "ceil(out0_d2 / 128) * 128"]

[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_operand = "CR6"
qf_out0 = "CR7"
rows = "CR8"
last_chunk = "CR9"
full = "CR10"
tail = "CR11"

[cases.default]
