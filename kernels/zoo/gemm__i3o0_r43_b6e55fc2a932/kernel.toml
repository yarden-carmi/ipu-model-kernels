[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 144
[params.m]
type = "int"
min = 1
max = 65536
default = 1024
[params.n]
type = "int"
min = 1
max = 65536
default = 144
[params.in0_d0]
type = "int"
min = 1
max = 128
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 4
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 36
[params.out0_d0]
type = "int"
choices = [1, 2, 4, 8, 16, 32, 64, 128]
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 144

[derived]
blocks = "ceil(k / in0_d3)"
batch_stride = "out0_d1 * blocks"
tokens = "128 // out0_d0"
tiles = "ceil(out0_d1 / tokens)"
tail_tokens = "(out0_d1 - 1) % tokens + 1"
dot_ds = "ds(in0_d3)"
full = "ds(128)"
tail = "ds(tail_tokens * out0_d0)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2", 128]
range = [-2, 2]
[inputs.w]
shape = ["n * (blocks + 1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d2 * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
blocks = "CR7"
n = "CR8"
tiles = "CR9"
tokens = "CR10"
out0_d0 = "CR11"
full = "CR12"
tail = "CR13"
dot_ds = "CR14"
batch_stride = "LR14"
tail_tokens = "LR15"

[cases.default]
