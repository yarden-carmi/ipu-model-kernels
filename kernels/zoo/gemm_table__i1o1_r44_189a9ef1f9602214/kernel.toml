[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu", "hardsigmoid", "hardswish"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 32
[params.n]
type = "int"
min = 1
max = 4096
default = 128
[params.m]
type = "int"
min = 1
max = 65535
default = 64
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 32
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 128
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 8

[derived]
chunks = "ceil(k / 128)"
blocks = "ceil(n / 128)"
split = "18 + 6 * min(1, 16 // k) + 4 * (min(1, 32 // k) - min(1, 16 // k)) + min(1, 127 // k) - min(1, 32 // k)"
fast = "min(1, 128 // k) * max(min(1, 128 // n), 1 - min(1, n % 128))"
legacy = "1 - min(1, m - 1)"
middle = "min(1, 127 // k) - min(1, 32 // k)"
digits = "(k * split + 31) // 32 + fast * middle * ((37 * k) // 64 - (k * split + 31) // 32)"
tile_coeff = "2 + k + digits"
ktail = "1 + (k - 1) % 128"
large = "min(1, k // 128)"
correction = "4 * (ktail // 32 * (1 - large) + large * min(1, ktail // 4))"
before_last = "max(0, 8 * ((ktail - correction - 1) // 8) - 1)"
spatial = "min(1, m - 1)"
legacy_tile = "(1 + k) * (1 + spatial) - ((k // 4) - ((ktail // 4) - (max(0, ktail - correction) // 4))) * spatial"
coeff_rows = "blocks * (legacy * legacy_tile + (1 - legacy) * tile_coeff)"
input_rows = "m * chunks"
active = "ds(128)"
tail_ds = "ds(1 + (n - 1) % 128)"
r8 = "legacy * active + (1 - legacy) * blocks"
r9 = "legacy * tail_ds + (1 - legacy) * input_rows"
r10 = "legacy * (chunks - 1) + (1 - legacy) * chunks"
r11 = "legacy * input_rows + (1 - legacy) * active"
r12 = "legacy * chunks + (1 - legacy) * tile_coeff"
r15 = "-legacy + (1 - legacy) * tail_ds"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["m * blocks", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
r8 = "CR8"
r9 = "CR9"
r10 = "CR10"
r11 = "CR11"
r12 = "CR12"
blocks = "CR13"
before_last = "CR14"
r15 = "CR15"

[cases.default]
