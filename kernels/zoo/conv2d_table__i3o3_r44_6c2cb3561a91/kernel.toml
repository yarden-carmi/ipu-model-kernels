[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 3
[params.cout]
type = "int"
min = 1
max = 640
default = 16
[params.groups]
type = "int"
min = 1
max = 640
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 8
[params.w]
type = "int"
min = 1
max = 256
default = 8
[params.kh]
type = "int"
min = 1
max = 5
default = 3
[params.kw]
type = "int"
min = 1
max = 5
default = 3
[params.padding]
type = "int"
min = 1
max = 2
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 3
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 8
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 260
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 260
default = 8

[derived]
dw = "min(1, groups - 1) * (1 // (1 + cin - groups)) * (1 // (1 + cout - groups)) * (1 // (1 + max(w - 128, 0))) * (1 // (1 + max((2 * padding - kw) // stride + 1, -((2 * padding - kw) // stride + 1)))) * (1 - w % stride)"
ip = "1 + dw * (128 // min(128, w) - 1)"
op = "1 + dw * (ip * stride - 1) + (128 // min(128, w) - 1) * (1 // groups) * (2 - stride) * (1 // (1 + max(w - out0_d3, out0_d3 - w)))"
ni = "ceil(cin / ip)"
no = "ceil(cout / op)"
ix = "ceil(in0_d3 / 128)"
ox = "ceil(out0_d3 / 128)"
gc = "cin // groups"
gc_last = "gc - 1"
plane = "(in0_d2 + 2 * padding) * (dw * stride + (1 - dw) * (1 + (kw * ox - 1) * (1 // op)))"
single = "(1 // groups) * (2 - stride) * (1 // (1 + max(w - out0_d3, out0_d3 - w))) * (1 // (1 + max(w - 16, 16 - w)))"
weight_block = "3 + (2 * kh * kw - single * (kh - 1) * kw) * gc - dw"
ds128 = "ds(128)"
ds_tail = "ds((1 + (out0_d3 - 1) % 128) * op)"
ds_width = "ds(min(128, in0_d3))"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "ni", "ix", 128]
range = [-2, 2]
[inputs.weights]
shape = ["no * weight_block", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.pad]
shape = ["(dw * no + (1 - dw) * cin) * plane", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "no", "ox", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
pad = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
ds_tail = "CR11"
plane = "CR12"
ds_width = "CR13"
no = "CR14"
gc_last = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
