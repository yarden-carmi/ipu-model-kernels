[kernel]
op = "binary_add_row"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["row"]
default = "row"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 1
max = 2147483647
default = 4096
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 32768
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 8
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 8
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 64

[derived]
ic = "ceil(in0_d3 / 128)"
capacity = "max(1, 128 // in0_d3)"
pack = "1 + (capacity - 1) * (1 - min(1, in0_d2 % capacity))"
plane_rows = "in0_d2 // pack * ic"
rows = "in0_d0 * in0_d1 * plane_rows"
tail = "ds((out0_d3 * pack - 1) % 128 + 1)"
mixed_width = "min(1, ic - 1) * (out0_d3 % 128)"
last_chunk = "ic - 1"
last_row = "plane_rows - 1"
penultimate_plane = "in0_d0 * in0_d1 - 2"
last_output = "rows - 1"

[inputs.in0]
shape = ["rows", 128]
range = [-2, 2]
[inputs.operand]
shape = ["plane_rows", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_operand = "CR6"
qf_out0 = "CR7"
last_chunk = "CR8"
last_output = "CR9"
last_row = "CR10"
plane_rows = "CR11"
mixed_width = "CR12"
tail = "CR13"
penultimate_plane = "CR14"

[cases.default]
