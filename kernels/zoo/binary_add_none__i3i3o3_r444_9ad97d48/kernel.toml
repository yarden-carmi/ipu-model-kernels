[kernel]
op = "binary_add"
formats = ["e1", "e2"]
[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 65536 }
in0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in0_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
in0_d2 = { type = "int", min = 1, max = 16777216, default = 32 }
in0_d3 = { type = "int", min = 1, max = 64, default = 32 }
in1_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in1_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
in1_d2 = { type = "int", min = 1, max = 16777216, default = 32 }
in1_d3 = { type = "int", min = 1, max = 64, default = 32 }
out0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
out0_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
out0_d2 = { type = "int", min = 1, max = 16777216, default = 32 }
out0_d3 = { type = "int", min = 1, max = 64, default = 32 }
[derived]
rows = "out0_d0 * out0_d1 * ceil(out0_d2 / 3) * ceil(3 * out0_d3 / 128)"
groups = "ceil(out0_d2 / 3)"
last_group = "groups - 1"
planes = "out0_d0 * out0_d1 - 1"
blocks = "ceil(3 * out0_d3 / 128)"
full0 = "ds(min(128, 3 * out0_d3))"
full1 = "ds(max(0, 3 * out0_d3 - 128))"
tail0 = "ds(min(128, (out0_d2 - 3 * (groups - 1)) * out0_d3))"
tail1 = "ds(max(0, (out0_d2 - 3 * (groups - 1)) * out0_d3 - 128))"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / 3) * ceil(3 * in0_d3 / 128)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 / 3) * ceil(3 * in1_d3 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
last_group = "CR8"
planes = "CR9"
blocks = "CR10"
full0 = "CR11"
full1 = "CR12"
tail0 = "CR13"
tail1 = "CR14"
[cases.default]
