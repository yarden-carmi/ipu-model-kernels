[kernel]
op = "quarter_grid_average"
formats = ["e1"]

[params.h]
type = "int"
min = 4
max = 4096
default = 66

[params.w]
type = "int"
min = 4
max = 67
default = 66

[params.in0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 64

[params.in0_d2]
type = "int"
min = 4
max = 4096
default = 66

[params.in0_d3]
type = "int"
min = 4
max = 67
default = 66

[params.out0_d0]
type = "int"
min = 1
max = 64
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64

[params.out0_d2]
type = "int"
min = 1
max = 2048
default = 32

[params.out0_d3]
type = "int"
min = 1
max = 32
default = 32

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["ceil(planes * out0_d2 / 4)", 128]

[derived]
planes = "out0_d0 * out0_d1"
reduce4 = "ds(4)"
full = "ds(4 * out0_d3)"
tail = "ds(max(1, (planes * out0_d2 % 4) * out0_d3))"
weight = "19 * 65536 + 123 * 256"
weight_fp32 = "123 * 8388608"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
reduce4 = "CR6"
full = "CR7"
tail = "CR8"
weight = "CR9"
weight_fp32 = "CR10"
out0_d2 = "CR11"
out0_d3 = "CR12"
h = "CR13"
planes = "LR15"

[cases.default]
