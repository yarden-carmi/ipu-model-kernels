[kernel]
op = "quarter_grid_average"
formats = ["e1"]

[params.h]
type = "int"
min = 4
default = 66

[params.w]
type = "int"
min = 4
max = 128
default = 66

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
default = 64

[params.in0_d2]
type = "int"
min = 4
default = 66

[params.in0_d3]
type = "int"
min = 4
max = 128
default = 66

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
default = 64

[params.out0_d2]
type = "int"
min = 1
default = 32

[params.out0_d3]
type = "int"
min = 1
max = 32
default = 32

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["ceil(out0_d0 * out0_d1 * out0_d2 / 4)", 128]

[derived]
planes = "out0_d0 * out0_d1"
reduce_ds = "ds(4)"
packed_width = "4 * out0_d3"
store_ds = "ds(packed_width)"
tail_ds = "ds(max(1, (planes * out0_d2 % 4) * out0_d3))"
weight = "19 * 65536 + 123 * 256"
weight_fp32 = "123 * 8388608"
slot1 = "128"
slot3 = "384"

[abi]
in0 = "CR2"
out0 = "CR3"
out0_d3 = "CR4"
out0_d2 = "CR5"
planes = "CR6"
in0_d2 = "CR7"
reduce_ds = "CR8"
store_ds = "CR9"
qf_in0 = "CR10"
qf_out0 = "CR11"
weight = "CR12"
packed_width = "CR13"
tail_ds = "CR14"
weight_fp32 = "CR15"
slot1 = "LR13"
slot3 = "LR15"

[cases.default]
