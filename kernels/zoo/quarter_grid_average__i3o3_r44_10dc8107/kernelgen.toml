chain = ["quarter_grid_average"]
chain_in = ["in0"]
chain_out = ["out0"]
notes = "Width-contiguous input lets the four cyclic slots hold the four source scanlines; reductions go straight into packed output lanes without a transpose or intermediate quantization."

[layout.in0]
lanes = 3
rows = [0, 1, 2]

[view.in0]
kind = "whole"

[layout.out0]
lanes = 3
rows = [0, 1, 2]
pack = 4
