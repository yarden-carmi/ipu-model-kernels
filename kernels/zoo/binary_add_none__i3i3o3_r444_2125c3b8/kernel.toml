[kernel]
op = "binary_add"
formats = ["e1", "e2"]
[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 16384
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 512
default = 16
[params.in1_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 16
[params.in1_d3]
type = "int"
min = 1
max = 512
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 512
default = 16
[derived]
rem = "out0_d0 * out0_d1 * out0_d2 % 8"
grows = "ceil(8 * out0_d3 / 128)"
groups = "out0_d0 * out0_d1 * out0_d2 // 8"
rows = "groups * grows + ceil(rem * out0_d3 / 128)"
last_group = "groups - 1"
row_bound = "grows * (groups - 2)"
gtail = "ds(8 * out0_d3 % 128)"
ttail = "ds(rem * out0_d3 % 128)"
neg_one = "0 - 1"
[inputs.in0]
shape = ["ceil(in0_d0 * in0_d1 * in0_d2 / 8) * ceil(8 * in0_d3 / 128)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["ceil(in1_d0 * in1_d1 * in1_d2 / 8) * ceil(8 * in1_d3 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
groups = "CR8"
row_bound = "CR9"
gtail = "CR10"
ttail = "CR11"
last_group = "CR12"
neg_one = "CR13"
[cases.default]
