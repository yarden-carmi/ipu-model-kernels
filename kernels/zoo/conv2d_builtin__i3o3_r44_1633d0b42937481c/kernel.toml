[kernel]
op = "conv2d_builtin"
formats = ["e1"]

[params]
act_out0 = {type = "str", choices = ["relu"], default = "relu"}
bias = {type = "bool", default = true}
cin = {type = "int", min = 1, max = 512, default = 64}
cout = {type = "int", min = 1, max = 512, default = 64}
groups = {type = "int", min = 1, max = 512, default = 1}
h = {type = "int", min = 1, max = 224, default = 56}
w = {type = "int", min = 1, max = 224, default = 56}
kh = {type = "int", choices = [3, 7], default = 3}
kw = {type = "int", choices = [3, 7], default = 3}
padding = {type = "int", min = 0, max = 3, default = 1}
stride = {type = "int", choices = [1, 2], default = 1}
in0_d0 = {type = "int", min = 1, default = 1}
in0_d1 = {type = "int", min = 1, max = 512, default = 64}
in0_d2 = {type = "int", min = 1, max = 224, default = 56}
in0_d3 = {type = "int", min = 1, max = 224, default = 56}
out0_d0 = {type = "int", min = 1, default = 1}
out0_d1 = {type = "int", min = 1, max = 512, default = 64}
out0_d2 = {type = "int", min = 1, max = 230, default = 56}
out0_d3 = {type = "int", min = 1, max = 230, default = 56}

[derived]
chunks = "ceil(in0_d3 / 128)"
out_chunks = "ceil(out0_d3 / 128)"
input_lines = "in0_d0 * in0_d1 * in0_d2"
clean_pitch = "chunks * stride"
weight_rows = "1 + 3 * cout * (cin // groups)"
full = "ds(128)"
in_tail = "ds((in0_d3 - 1) % 128 + 1)"
out_tail = "ds((out0_d3 - 1) % 128 + 1)"
src_lo = "100925952"
src_hi = "235670024"
dst_lo = "50462976"
dst_hi = "117835012"

[inputs.in0]
shape = ["input_lines", "chunks", 128]
range = [-1, 1]
[inputs.weights]
shape = ["weight_rows", 128]
[scratch.clean]
shape = ["input_lines", "clean_pitch", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d1", "out_chunks", 128]

[abi]
in0 = "CR2"
weights = "CR3"
clean = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
in_tail = "CR9"
out_tail = "CR10"
weight_rows = "CR11"
src_lo = "CR12"
src_hi = "CR13"
dst_lo = "CR14"
dst_hi = "CR15"
input_lines = "LR13"
out0_d0 = "LR15"

[cases.default]
