[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
default = 16
[params.m]
type = "int"
min = 1
default = 3136
[params.n]
type = "int"
min = 1
default = 16
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 16
[params.in0_d2]
type = "int"
min = 1
default = 56
[params.in0_d3]
type = "int"
min = 1
default = 56
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 16
[params.out0_d2]
type = "int"
min = 1
default = 56
[params.out0_d3]
type = "int"
min = 1
default = 56
[derived]
tiles = "ceil(in0_d2 * in0_d3 / 128)"
batch_pitch = "in0_d1 * tiles"
groups = "ceil(k / 32)"
last = "(k - 1) % 32 + 1"
full = "ds(128)"
tail = "ds((out0_d2 * out0_d3 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0 * batch_pitch", 128]
range = [-2, 2]
[inputs.w]
shape = ["n * (2 * groups + 2)", 128]
range = [-1, 1]
when = "bias"
[inputs.w_unbiased]
shape = ["n * 2 * groups", 128]
range = [-1, 1]
when = "not bias"
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 * out0_d3 / 128)", 128]

[abi]
in0 = "CR2"
w = "CR3"
w_unbiased = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
tiles = "CR9"
batch_pitch = "CR10"
in0_d0 = "CR11"
n = "CR12"
groups = "CR13"
last = "CR14"

[cases.default]
