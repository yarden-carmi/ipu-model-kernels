[kernel]
op = "binary_add"
formats = ["e2", "e3", "e4"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 16777216
default = 147456
[params.in0_d0]
type = "int"
min = 1
max = 16777216
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 16777216
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 16777216
default = 144
[params.in1_d0]
type = "int"
min = 1
max = 16777216
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 16777216
default = 256
[params.in1_d2]
type = "int"
min = 1
max = 16777216
default = 144
[params.out0_d0]
type = "int"
min = 1
max = 16777216
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16777216
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 16777216
default = 144
[derived]
batch_elements = "in0_d1 * in0_d2"
batch_rows = "ceil(batch_elements / 128)"
view_stride = "in0_d0 * in0_d1"
stride_rows = "(in0_d0 * in0_d1) // 128"
one = "ds(1)"
tail = "ds((out0_d1 * out0_d2 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0 * ceil(in0_d1 * in0_d2 / 128)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * ceil(out0_d1 * out0_d2 / 128)", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
in0_d0 = "CR8"
in0_d1 = "CR9"
in0_d2 = "CR10"
