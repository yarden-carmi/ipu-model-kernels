[kernel]
op = "binary_add"
formats = ["e2"]
[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.const]
type = "float"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 32768
[params.in0_d0]
type = "int"
min = 1
max = 16777216
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16777216
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 16777216
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 16777216
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16777216
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 16777216
default = 128

[derived]
blocks = "ceil(in0_d1 / 128)"
width = "ceil(out0_d2 / 128)"
rows = "out0_d0 * out0_d1 * width"
ds_pair = "ds(out0_d2 - (width - 1) * 128) + ds(128) * 65536"
batch_stride = "in0_d2 * blocks"
[inputs.in0]
shape = ["in0_d0", "in0_d2", "blocks * 128"]
range = [-2, 2]
[inputs.operand]
shape = ["out0_d0", "out0_d1", "width * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "width * 128"]
[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_operand = "CR6"
qf_out0 = "CR7"
rows = "CR8"
blocks = "CR9"
ds_pair = "CR10"
in0_d1 = "CR11"
in0_d2 = "CR12"
batch_stride = "CR13"
[golden]
tolerance = { e2 = "EXACT" }
[cases.default]
