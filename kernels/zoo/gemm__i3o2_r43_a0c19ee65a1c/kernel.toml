[kernel]
op = "gemm"
formats = ["e2", "e3"]
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 2048
default = 192
[params.m]
type = "int"
min = 2
max = 65536
default = 256
[params.n]
type = "int"
min = 1
max = 65536
default = 192
[params.in0_d0]
type = "int"
min = 1
max = 4
default = 4
[params.in0_d1]
type = "int"
min = 2
max = 32
multiple_of = 2
default = 4
[params.in0_d2]
type = "int"
min = 2
max = 65536
multiple_of = 2
default = 64
[params.in0_d3]
type = "int"
min = 43
max = 64
default = 48
[params.out0_d0]
type = "int"
min = 1
max = 4
default = 4
[params.out0_d1]
type = "int"
min = 2
max = 65536
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 192
[derived]
full = "ds(128)"
active = "ds((n - 1) % 128 + 1)"
depth = "in0_d3 - 2"
end2 = "in0_d3 * 2 - 2"
pairs = "in0_d2 / 2"
batches = "in0_d0"
[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2 / 2", 128]
[inputs.w]
shape = ["ceil(n / 128) * (k + 1) + 1", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 / 128)", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
active = "CR8"
depth = "CR9"
pairs = "CR10"
n = "CR11"
end2 = "CR12"
batches = "CR13"
[golden]
tolerance = {e2 = "NX8_STEP", e3 = "NX8_STEP"}
[cases.default]
