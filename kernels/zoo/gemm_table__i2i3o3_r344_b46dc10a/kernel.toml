[kernel]
op = "gemm_table"
formats = ["e2"]

[params.m]
type = "int"
min = 64
max = 16384
multiple_of = 64
default = 64
[params.k]
type = "int"
min = 16
max = 16384
multiple_of = 16
default = 240
[params.n]
type = "int"
min = 1
max = 16384
default = 160
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 4
[params.in0_d1]
type = "int"
min = 8
max = 16384
multiple_of = 8
default = 16
[params.in0_d2]
type = "int"
min = 16
max = 16384
multiple_of = 16
default = 240
[params.in1_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 160
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 8
[params.in1_d3]
type = "int"
min = 1
max = 16384
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 2
max = 32768
default = 320
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 16384
default = 8

[derived]
full = "ds(128)"
tail = "ds((m - 1) % 128 + 1)"
tiles = "ceil(m / 128)"
groups = "k // 16"
channels = "n"

[inputs.in0]
shape = ["in0_d0 * ceil(in0_d1 * in0_d2 / 128)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 * in1_d3 / 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["n", "2 + 2 * groups", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ceil(out0_d2 * out0_d3 / 128)", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
w = "CR5"
tiles = "CR6"
lut = "CR7"
groups = "CR8"
qf_in0 = "CR9"
qf_in1 = "CR10"
qf_out0 = "CR11"
full = "CR12"
channels = "CR13"
tail = "CR15"

[cases.default]

[golden]
tolerance = { e2 = "NX8_STEP" }
