[kernel]
op = "gemm_table"
formats = ["e1"]

[params.act_out0]
type = "str"
choices = ["hardswish", "hardsigmoid"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 48
[params.m]
type = "int"
min = 1
max = 65536
default = 196
[params.n]
type = "int"
min = 1
max = 4096
default = 144
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 48
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 14
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 144
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 14

[derived]
chunks = "ceil(k / 128)"
pack = "1 + (128 // out0_d3 - 1) * (1 - min(1, n % (128 // out0_d3)))"
groups = "n // pack"
active = "pack * out0_d3"
strip_step = "out0_d3 * chunks"
strip_last = "strip_step - 1"
last_slot = "active - 1 - (1 - min(1, out0_d3 - 1)) * (2 - min(2, chunks))"
input_rows = "m * chunks"
dot_parts = "2 + min(1, out0_d3 - 1) * (1 - min(1, pack - 1)) * (2 - min(2, chunks))"
coeff_rows = "2 * groups + dot_parts * n * chunks"
dot_ds = "ds(128)"
store_ds = "ds(active)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * groups", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
lut = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
dot_ds = "CR8"
store_ds = "CR9"
strip_step = "CR10"
input_rows = "CR11"
chunks = "CR12"
last_slot = "CR13"
coeff_rows = "CR14"
strip_last = "CR15"

[cases.default]
