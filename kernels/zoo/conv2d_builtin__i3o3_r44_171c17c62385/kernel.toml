[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
default = 72
[params.cout]
type = "int"
min = 1
default = 72
[params.groups]
type = "int"
min = 1
default = 72
[params.h]
type = "int"
min = 1
default = 56
[params.w]
type = "int"
min = 1
max = 128
default = 56
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 72
[params.in0_d2]
type = "int"
min = 1
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 72
[params.out0_d2]
type = "int"
min = 1
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 28

[derived]
cap = "128 // in0_d3"
pack = "1 + (cap - 1) * (1 - min(1, in0_d2 % cap))"
plane = "in0_d2 // pack"
group_pitch = "plane * (cin // groups)"
weight_rows = "1 + out0_d1 * (2 + 18 * (cin // groups))"
constant_rows = "weight_rows + stride - 1"
full = "ds(128)"
wide = "ds(in0_d3)"
tail = "ds(out0_d3)"
last_y = "in0_d2 - 1"
phase_end = "128 + pack * in0_d3"

[inputs.in0]
shape = ["in0_d1", "in0_d0", "plane", 128]
range = [-1, 1]
[inputs.weights]
shape = ["constant_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d1", "out0_d0", "out0_d2", 128]
[scratch.evens]
shape = [1, 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
evens = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
wide = "CR9"
tail = "CR10"
last_y = "CR11"
phase_end = "CR12"
plane = "CR13"
weight_rows = "CR14"
group_pitch = "CR15"

[cases.default]
