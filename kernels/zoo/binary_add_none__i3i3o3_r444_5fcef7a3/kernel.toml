[kernel]
op = "binary_add"
formats = ["e1"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
numel = { type = "int", min = 1, default = 7840 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 40 }
in0_d2 = { type = "int", min = 1, default = 14 }
in0_d3 = { type = "int", min = 1, max = 128, default = 14 }
in1_d0 = { type = "int", min = 1, default = 1 }
in1_d1 = { type = "int", min = 1, default = 40 }
in1_d2 = { type = "int", min = 1, default = 14 }
in1_d3 = { type = "int", min = 1, max = 128, default = 14 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 40 }
out0_d2 = { type = "int", min = 1, default = 14 }
out0_d3 = { type = "int", min = 1, max = 128, default = 14 }

[derived]
pack = "128 // out0_d3"
group_rows = "ceil(out0_d2 / pack)"
rows = "out0_d0 * out0_d1 * group_rows"
last = "group_rows - 1"
active = "ds(pack * out0_d3)"
tail = "ds((out0_d2 - last * pack) * out0_d3)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / (128 // in0_d3))", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 / (128 // in1_d3))", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
last = "CR8"
active = "CR9"
tail = "CR10"
rows = "CR11"

[cases.default]
