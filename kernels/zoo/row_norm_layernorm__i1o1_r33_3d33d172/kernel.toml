[kernel]
op = "row_norm"
formats = ["e2"]

[params.kind]
type = "str"
choices = ["layernorm"]
default = "layernorm"
[params.channels]
type = "int"
min = 4
max = 256
default = 144
[params.rows]
type = "int"
min = 1
max = 65536
default = 1024
[params.eps]
type = "float"
min = 0.0
max = 1.0
default = 1e-5
[params.in0_d0]
type = "int"
min = 1
max = 4
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 256
default = 256
[params.in0_d2]
type = "int"
min = 2
max = 4096
default = 144
[params.out0_d0]
type = "int"
min = 1
max = 4
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.out0_d2]
type = "int"
min = 2
max = 4096
default = 144

[derived]
nch = "ceil(in0_d1 / 128)"
K = "ceil(channels / 128)"
dsf = "ds(min(in0_d1, 128))"
rows0 = "in0_d0 * channels * nch"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * nch", 128]
[inputs.gamma]
shape = ["K", 128]
[inputs.beta]
shape = ["K", 128]
[inputs.crow]
shape = [5, 128]
[inputs.ind]
shape = ["nch + min(in0_d1, 128)", 128]
[scratch.tmp]
shape = ["2 * channels + 7", 128]
[scratch.staged]
shape = ["2 * in0_d0 * channels * nch", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * nch", 128]

[abi]
in0 = "CR2"
gamma = "CR3"
beta = "CR4"
out0 = "CR5"
crow = "CR6"
ind = "CR7"
tmp = "CR8"
qf_gamma = "CR9"
qf_in0 = "CR10"
qf_out0 = "CR11"
dsf = "CR12"
channels = "CR13"
staged = "CR14"
rows0 = "CR15"

[golden]
tolerance = { e2 = "NX8_STEP" }

[cases.default]
