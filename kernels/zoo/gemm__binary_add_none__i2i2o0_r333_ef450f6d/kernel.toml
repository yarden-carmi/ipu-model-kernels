[kernel]
op = "gemm_binary_add"
formats = ["e2"]

[params.s0_bias]
type = "bool"
default = true
[params.s0_k]
type = "int"
min = 1
max = 8192
default = 384
[params.s0_m]
type = "int"
min = 1
max = 2080800
default = 256
[params.s0_n]
type = "int"
min = 1
max = 4096
default = 192
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 1
max = 8522956800
default = 49152
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"
[params.in0_d0]
type = "int"
min = 1
max = 255
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 8160
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 8192
default = 384
[params.in1_d0]
type = "int"
min = 1
max = 255
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 8160
default = 64
[params.in1_d2]
type = "int"
min = 1
max = 4096
default = 192
[params.out0_d0]
type = "int"
min = 1
max = 255
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 8160
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 192

[derived]
blocks = "ceil(s0_m / 128)"
chunks = "ceil(s0_k / 128)"
slot = "128"
full = "ds(128)"
tail = "ds((s0_m - 1) % 128 + 1)"
outputs = "s0_n"
quotient = "s0_m // 128"

[inputs.in0]
shape = ["s0_m * chunks", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * ceil(in1_d1 * in1_d2 / 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["s0_n * (chunks + 1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["s0_n * blocks", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
full = "CR9"
tail = "CR10"
blocks = "CR11"
outputs = "CR12"
quotient = "CR13"
chunks = "CR14"
slot = "CR15"

[cases.default]
