[kernel]
op = "binary_add_row"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["row"]
default = "row"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 1
max = 2147483647
default = 4096
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 32768
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 8
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 2147483647
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 8
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 64
[derived]
chunks = "ceil(in0_d2 / 128)"
planes = "in0_d0 * in0_d1"
plane_size = "in0_d2 * in0_d3"
rows = "planes * in0_d3 * chunks"
operand_planes = "1 + (planes - 1) * min(1, plane_size % inner)"
operand_rows = "operand_planes * in0_d3 * chunks"
column_stride = "out0_d1 * chunks"
batch_stride = "out0_d3 * column_stride"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"

[inputs.in0]
shape = ["rows", 128]
range = [-2, 2]
[inputs.operand]
shape = ["operand_rows", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * batch_stride", 128]

[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_operand = "CR6"
qf_out0 = "CR7"
chunks = "CR8"
rows = "CR9"
operand_rows = "CR10"
full = "CR11"
tail = "CR12"
column_stride = "CR13"
in0_d1 = "CR14"
in0_d3 = "CR15"
batch_stride = "LR11"

[cases.default]
