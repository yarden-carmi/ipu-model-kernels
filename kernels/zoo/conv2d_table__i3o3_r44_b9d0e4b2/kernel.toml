[kernel]
op = "conv2d_table"
formats = ["e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 128
[params.cout]
type = "int"
min = 1
max = 640
default = 128
[params.groups]
type = "int"
min = 1
max = 640
default = 128
[params.h]
type = "int"
min = 1
max = 256
default = 128
[params.w]
type = "int"
choices = [16, 32, 64, 128, 256]
default = 128
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 128
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 128
[params.in0_d3]
type = "int"
choices = [16, 32, 64, 128, 256]
default = 128
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 128
[params.out0_d2]
type = "int"
min = 1
max = 256
default = 64
[params.out0_d3]
type = "int"
choices = [8, 16, 32, 64, 128, 256]
default = 64

[derived]
ip = "ceil(in0_d2 * in0_d3 / 128)"
op = "ceil(out0_d2 * out0_d3 / 128)"
gcin = "cin // groups"
plane = "9 * op"
groupstep = "gcin * plane"
ds128 = "ds(128)"
tail = "ds(1 + (out0_d2 * out0_d3 - 1) % 128)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "ip", 128]
range = [-2, 2]
[inputs.weights]
shape = ["3 + 2 * cout * (1 + gcin)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.guard]
shape = ["op * stride * stride + 6", 128]
[scratch.patch]
shape = ["cin * plane", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "op", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
guard = "CR6"
patch = "CR7"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
tail = "CR12"
plane = "CR13"
gcin = "CR14"
groupstep = "CR15"

[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
