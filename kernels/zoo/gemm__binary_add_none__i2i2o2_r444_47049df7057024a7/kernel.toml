[kernel]
op = "gemm__binary_add_none"
formats = ["e2"]

[params]
s0_bias = {type = "bool", default = true}
s0_k = {type = "int", min = 1, max = 4096, default = 88}
s0_m = {type = "int", min = 1, max = 65536, default = 784}
s0_n = {type = "int", min = 1, max = 65536, default = 24}
s1_broadcast = {type = "str", choices = ["none"], default = "none"}
s1_inner = {type = "int", min = 0, max = 0, default = 0}
s1_numel = {type = "int", min = 1, max = 4194304, default = 18816}
s1_op = {type = "str", choices = ["add"], default = "add"}
in0_d0 = {type = "int", min = 1, max = 65536, default = 1}
in0_d1 = {type = "int", min = 1, max = 4096, default = 88}
in0_d2 = {type = "int", min = 1, max = 65536, default = 28}
in0_d3 = {type = "int", min = 1, max = 65536, default = 28}
in1_d0 = {type = "int", min = 1, max = 65536, default = 1}
in1_d1 = {type = "int", min = 1, max = 65536, default = 24}
in1_d2 = {type = "int", min = 1, max = 65536, default = 28}
in1_d3 = {type = "int", min = 1, max = 65536, default = 28}
out0_d0 = {type = "int", min = 1, max = 65536, default = 1}
out0_d1 = {type = "int", min = 1, max = 65536, default = 24}
out0_d2 = {type = "int", min = 1, max = 65536, default = 28}
out0_d3 = {type = "int", min = 1, max = 65536, default = 28}

[derived]
block_tail = "(s0_k - 1) % 32 + 1"
weight_rows = "2 + 2 * ceil(s0_k / 8)"
tiles = "ceil(out0_d2 * out0_d3 / 128)"
batch_tiles = "out0_d0 * tiles"
stride = "in0_d0 * ceil(in0_d2 * in0_d3 / 128)"
irows = "in0_d1 * stride"
rrows = "in1_d1 * in1_d0 * ceil(in1_d2 * in1_d3 / 128)"
orows = "out0_d1 * batch_tiles"
groups = "(s0_k - 1) // 32"
group_stride = "8 * stride"
full = "ds(128)"
tail = "ds((out0_d2 * out0_d3 - 1) % 128 + 1)"

[inputs.in0]
shape = ["irows", 128]
range = [-2, 2]
[inputs.in1]
shape = ["rrows", 128]
range = [-2, 2]
[inputs.w]
shape = ["s0_n * weight_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["orows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
full = "CR9"
tail = "CR10"
tiles = "CR11"
stride = "CR12"
groups = "CR13"
s0_n = "CR14"
out0_d0 = "CR15"
group_stride = "LR13"

[golden]
tolerance = {e2 = "NX8_STEP"}
[cases.default]
