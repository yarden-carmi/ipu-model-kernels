max = 2147483647
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 2147483647
default = 8
[params.out0_d2]
type = "int"
min = 1
max = 2147483647
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 2147483647
default = 64

[derived]
ic = "ceil(in0_d2 / 128)"
stride = "in0_d1 * ic"
batch_stride = "in0_d3 * stride"
oc = "ceil(out0_d3 / 128)"
tail = "(out0_d3 - 1) % 128 + 1"
ds_pair = "ds(128) * 65536 + ds(tail)"
rows = "out0_d0 * out0_d1 * out0_d2 * oc"

[inputs.in0]
shape = ["in0_d0 * batch_stride", 128]
range = [-2, 2]
[inputs.operand]
shape = ["rows", 128]
range = [-2, 2]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
operand = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
qf_operand = "CR7"
stride = "CR8"
ic = "CR9"
oc = "CR10"
tail = "CR11"
ds_pair = "CR12"
out0_d1 = "CR13"
