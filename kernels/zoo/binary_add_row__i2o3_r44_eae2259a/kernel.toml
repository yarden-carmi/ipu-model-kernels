[params.inner]
type = "int"
min = 1
max = 2147483647
default = 4096
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 32768
[params.in0_d0]
type = "int"
min = 1
max = 16777215
default = 1
[params.in0_d1]
