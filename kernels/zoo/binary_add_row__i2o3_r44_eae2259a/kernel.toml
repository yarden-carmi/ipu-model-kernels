[kernel]
op = "binary_add_row"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["row"]
default = "row"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.inner]
type = "int"
min = 1
max = 2147483647
default = 4096
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 32768
[params.in0_d0]
type = "int"
min = 1
max = 2147483647
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 2147483647
default = 8
[params.in0_d2]
type = "int"
min = 1
max = 2147483647
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 2147483647
default = 64
[params.out0_d0]
type = "int"
