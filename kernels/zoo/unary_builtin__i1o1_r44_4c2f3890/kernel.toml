[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params]
act_out0 = { type = "str", choices = ["relu"], default = "relu" }
numel = { type = "int", min = 1, default = 65536 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, max = 64, default = 64 }
in0_d2 = { type = "int", min = 1, default = 32 }
in0_d3 = { type = "int", min = 2, multiple_of = 2, default = 32 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, max = 64, default = 64 }
out0_d2 = { type = "int", min = 1, default = 32 }
out0_d3 = { type = "int", min = 2, multiple_of = 2, default = 32 }

[derived]
in_rows = "in0_d0 * in0_d2 * in0_d3 // 2"
out_rows = "out0_d0 * out0_d2 * out0_d3"
active = "ds(out0_d1)"
next_slot = "128"

[inputs.in0]
shape = ["in_rows", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
active = "CR6"
in_rows = "CR7"
in0_d1 = "LR3"
next_slot = "LR4"

[cases.default]
