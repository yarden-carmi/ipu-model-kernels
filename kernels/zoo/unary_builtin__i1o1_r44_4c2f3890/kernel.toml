[kernel]
op = "unary_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"

[params.numel]
type = "int"
min = 1
max = 2147483647
default = 65536

[params.in0_d0]
type = "int"
min = 1
default = 1

[params.in0_d1]
type = "int"
min = 1
max = 64
default = 64

[params.in0_d2]
type = "int"
min = 1
default = 32

[params.in0_d3]
type = "int"
min = 2
multiple_of = 2
default = 32

[params.out0_d0]
type = "int"
min = 1
default = 1

[params.out0_d1]
type = "int"
min = 1
max = 64
default = 64

[params.out0_d2]
type = "int"
min = 1
default = 32

[params.out0_d3]
type = "int"
min = 2
multiple_of = 2
default = 32

[derived]
input_rows = "in0_d0 * in0_d2 * (in0_d3 // 2)"
output_rows = "out0_d0 * out0_d2 * out0_d3"
last_pair = "input_rows - 1"
input_active = "ds(in0_d1)"
output_active = "ds(out0_d1)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-1.0, 1.0]

[outputs.out0]
shape = ["output_rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
last_pair = "CR6"
input_active = "CR7"
output_active = "CR8"
in0_d1 = "LR1"

[cases.default]
