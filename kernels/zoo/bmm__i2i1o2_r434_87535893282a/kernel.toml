[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=2147483647, default=12}
k = {type="int", min=1, max=2147483647, default=256}
m = {type="int", min=1, max=2147483647, default=256}
n = {type="int", min=1, max=2147483647, default=64}
in0_d0 = {type="int", min=1, max=2147483647, default=1}
in0_d1 = {type="int", min=1, max=2147483647, default=12}
in0_d2 = {type="int", min=1, max=4194176, default=256}
in0_d3 = {type="int", min=1, max=2147483647, default=256}
in1_d0 = {type="int", min=1, max=2147483647, default=1}
in1_d1 = {type="int", min=1, max=4194176, default=256}
in1_d2 = {type="int", min=1, max=2147483647, default=768}
out0_d0 = {type="int", min=1, max=2147483647, default=1}
out0_d1 = {type="int", min=1, max=2147483647, default=12}
out0_d2 = {type="int", min=1, max=2147483647, default=256}
out0_d3 = {type="int", min=1, max=2147483647, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d3", "in0_d1", "ac*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "bc*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "oc*128"]

[derived]
ac = "ceil(in0_d2/128)"
bc = "ceil(in1_d1/128)"
oc = "ceil(out0_d2/128)"
groups = "b//out0_d1"
ds = "ds(128)+65536*ds((m-1)%128+1)"
a_key = "ac*in0_d1"
a_gap = "a_key*in0_d3-ac*out0_d1"
b_gap = "(in1_d2*min(in1_d0-1,1)-out0_d1*n)*bc"
two = "2"
chunks = "ac+65536*bc"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
ds = "CR8"
a_key = "CR9"
chunks = "CR10"
two = "CR11"
k = "CR12"
n = "CR13"
m = "CR14"
out0_d1 = "CR15"
groups = "LR1"
a_gap = "LR11"
b_gap = "LR14"

[cases.default]
