[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["scalar"], default = "scalar" }
const = { type = "int", min = 1, max = 1, default = 1 }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["mul"], default = "mul" }
numel = { type = "int", min = 1, max = 2147483647, default = 30000 }
in0_d0 = { type = "int", min = 1, max = 2147483647, default = 1 }
in0_d1 = { type = "int", min = 1, max = 2147483647, default = 12 }
in0_d2 = { type = "int", min = 1, max = 2147483647, default = 50 }
in0_d3 = { type = "int", min = 1, max = 64, default = 50 }
out0_d0 = { type = "int", min = 1, max = 2147483647, default = 1 }
out0_d1 = { type = "int", min = 1, max = 2147483647, default = 12 }
out0_d2 = { type = "int", min = 1, max = 2147483647, default = 50 }
out0_d3 = { type = "int", min = 1, max = 64, default = 50 }

[inputs.in0]
shape = ["rows", 128]
range = [-2.0, 2.0]

[outputs.out0]
shape = ["ceil(out0_d0 * out0_d1 * out0_d2 / 2)", 128]

[scratch.scalar]
shape = [1, 128]

[derived]
rows = "in0_d0 * in0_d1 * in0_d2"
blocks = "ceil(in0_d3 / 8)"
ds_full = "ds(128)"
ds_out = "ds(2 * out0_d3) + 65536 * ds(out0_d3)"
fp_hi = "0x43012080"
fp_lo = "0x43010080"
nx_scale = "0x00017c00"
lanes_lo = "0x03020100"
lanes_hi = "0x07060504"

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
scalar = "CR6"
ds_full = "CR7"
ds_out = "CR8"
rows = "CR9"
fp_hi = "CR10"
fp_lo = "CR11"
nx_scale = "CR12"
lanes_lo = "CR13"
lanes_hi = "CR14"
in0_d3 = "CR15"
blocks = "LR15"

[cases.default]
