[kernel]
op = "row_softmax"
formats = ["e1", "e2", "e3"]

[params]
n = { type = "int", min = 1, max = 64, default = 64 }
rows = { type = "int", min = 1, default = 512 }
in0_d0 = { type = "int", min = 1, default = 1 }
in0_d1 = { type = "int", min = 1, default = 8 }
in0_d2 = { type = "int", min = 1, default = 64 }
in0_d3 = { type = "int", min = 1, max = 64, default = 64 }
out0_d0 = { type = "int", min = 1, default = 1 }
out0_d1 = { type = "int", min = 1, default = 8 }
out0_d2 = { type = "int", min = 1, default = 64 }
out0_d3 = { type = "int", min = 1, max = 64, default = 64 }

[derived]
active = "ds(n)"
full = "ds(128)"
scalar = "ds(1)"
scratch_qf = "40"

[inputs.in0]
shape = ["ceil(in0_d0 * in0_d1 * in0_d2 / 2)", 128]
range = [-2, 2]

[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", 128]

[scratch.tmp]
shape = [12, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
scratch_qf = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
rows = "CR7"
n = "CR8"
qf_out0 = "CR10"
scalar = "CR13"
active = "CR14"
full = "CR15"

[cases.default]
