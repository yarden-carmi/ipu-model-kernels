[kernel]
op = "bounded_distance_bucket_selector_v1"
formats = ["e2"]
[params.tokens]
type = "int"
min = 1
max = 256
default = 256
[params.vocab]
type = "int"
min = 1
max = 250002
default = 250002
[inputs.in0]
shape = [1, "ceil(tokens / 128) * 128"]
range = [0, 250001]
[inputs.ramp]
shape = ["ceil(vocab / 128)", 3, 128]
range = [0, 1]
[inputs.ones]
shape = [128]
range = [1, 1]
[outputs.out0]
shape = ["tokens", "ceil(vocab / 128) * 128"]
[scratch.diff]
shape = [128]
[scratch.hit]
shape = [128]
[derived]
dsfull = "ds(128)"
dstail = "ds((vocab - 1) % 128 + 1)"
chunks = "ceil(vocab / 128)"
ntokens = "tokens"
one28 = "128"
[abi]
in0 = "CR2"
ramp = { register = "CR3", offset = -1 }
ones = "CR4"
out0 = { register = "CR5", offset = -1 }
diff = "CR6"
hit = "CR7"
qf_in0 = "CR8"
qf_ramp = "CR9"
qf_ones = "CR10"
qf_out0 = "CR11"
qf_diff = "CR12"
qf_hit = "CR13"
dsfull = "CR14"
dstail = "CR15"
chunks = "LR10"
ntokens = "LR11"
one28 = "LR12"
[cases.default]
[golden]
tolerance = { e2 = "EXACT" }
