[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 16
[params.m]
type = "int"
min = 1
max = 65536
default = 3136
[params.n]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 56
[derived]
ipack = "min(in0_d2, 7, 128 // in0_d3)"
opack = "min(4, 128 // out0_d2)"
groups = "ceil(out0_d1 / opack)"
height = "in0_d2"
width = "in0_d3"
batchrows = "in0_d1 * ceil(in0_d2 / ipack)"
batches = "in0_d0"
full = "ds(128)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d2 / min(in0_d2, 7, 128 // in0_d3))", 128]
[inputs.w]
shape = ["groups * (1 + k * in0_d2) + 1", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d3 * ceil(out0_d1 / min(4, 128 // out0_d2))", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
groups = "CR7"
full = "CR8"
height = "CR9"
width = "CR10"
ipack = "CR11"
k = "CR12"
batchrows = "CR13"
batches = "CR14"

[golden]
tolerance = {e2 = "NX8_STEP", e3 = "NX8_STEP"}

[cases.default]
