[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["silu", "hardsigmoid", "hardswish"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 32
[params.n]
type = "int"
min = 1
max = 4096
default = 128
[params.m]
type = "int"
min = 1
max = 65535
default = 64
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 32
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 128
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 8

[derived]
pack = "1 + min(1, 64 // in0_d1)"
chunks = "ceil(k / 128)"
blocks = "ceil(n / 128)"
input_rows = "ceil(m / pack) * chunks"
preceding = "chunks - 1"
full = "ds(128)"
tail = "ds(1 + (n - 1) % 128)"
sum_ds = "ds(127)"
shift = "127 * min(1, m - 1) + (1 - min(1, m - 1)) * max(0, (k - 1) % 128 - 1)"
triple = "min(1, max(0, k - 32)) * (1 - min(1, k // 128))"
short = "min(1, 16 // k)"
corrections = "short * k + (1 - short) * ((1 - triple) * (6 * (k // 16) + min(6, (k % 16) // 2)) + triple * (5 * (k // 16) + (k % 16) // 3))"
fork = "max(1 - min(1, m - 1), min(1, m - 1) * min(1, 64 // in0_d1) * min(1, 32 // k) * min(1, 128 // n))"
split_start = "2 * (1 - min(1, n // 128))"
fork_rows = "blocks * (1 + k + min(1, m - 1) * (1 + (16 - split_start) * (k // 16) + max(0, k % 16 - split_start)))"
coeff_rows = "fork * fork_rows + (1 - fork) * (blocks * (2 + k + corrections) + 1)"

[inputs.in0]
shape = ["input_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["m * blocks", 128]
[scratch.sums]
shape = ["input_rows", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
tail = "CR9"
preceding = "CR10"
sums = "CR11"
chunks = "CR12"
blocks = "CR13"
shift = "CR14"
sum_ds = "CR15"
input_rows = "LR8"
m = "LR14"
k = "LR15"

[cases.default]
