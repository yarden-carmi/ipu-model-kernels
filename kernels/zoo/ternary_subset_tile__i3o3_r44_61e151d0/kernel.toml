[kernel]
op = "ternary_subset_tile"
formats = ["e2"]

[params]
cin = {type = "int", default = 48, min = 1}
cout = {type = "int", default = 48, min = 1}
h = {type = "int", default = 16, min = 1}
w = {type = "int", default = 16, min = 1}
kh = {type = "int", default = 4, min = 1}
kw = {type = "int", default = 4, min = 1}
in0_d0 = {type = "int", default = 1, min = 1}
in0_d1 = {type = "int", default = 48, min = 1}
in0_d2 = {type = "int", default = 16, min = 1}
in0_d3 = {type = "int", default = 16, min = 1}
out0_d0 = {type = "int", default = 1, min = 1}
out0_d1 = {type = "int", default = 48, min = 1}
out0_d2 = {type = "int", default = 64, min = 1}
out0_d3 = {type = "int", default = 64, min = 1}

[inputs.in0]
shape = ["(in0_d0 * in0_d1 * in0_d2 + 7) // 8", 128]
range = [-1, 1]
[inputs.weights]
shape = ["cout * kh * 4 * (cin + 1)", 128]
range = [-1, 1]
[scratch.expanded]
shape = ["in0_d0 * in0_d1 * in0_d2", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", 128]

[derived]
sizes = "in0_d2 + 65536 * (in0_d1 * in0_d2)"
strides = "kh + 65536 * (out0_d0 * out0_d2)"
totals = "in0_d0 * in0_d1 * in0_d2"
widths = "in0_d3 + 65536 * (8 * in0_d3)"
ds_out = "ds(out0_d3)"
filter_rows = "4 * (cin + 1) + 65536 * cin"
phases = "cout * kh"

[abi]
in0 = "CR2"
weights = "CR3"
expanded = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
qf_weights = "CR8"
sizes = "CR9"
strides = "CR10"
totals = "CR11"
widths = "CR12"
ds_out = "CR13"
filter_rows = "CR14"
phases = "CR15"
kw = "LR15"

[cases.default]
