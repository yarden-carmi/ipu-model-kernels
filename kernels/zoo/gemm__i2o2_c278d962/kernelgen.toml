chain = ["gemm"]
chain_in = ["in0"]
chain_out = ["out0"]
notes = "Input dimension 2 (k) occupies lanes, row order [0,1]; output dimension 2 (n) occupies lanes, row order [0,1]. Fold transposes weights to [k, n] packed into 128-lane rows. FP32 accumulation, identity store."
