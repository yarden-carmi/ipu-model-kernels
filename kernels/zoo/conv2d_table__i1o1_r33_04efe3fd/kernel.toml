[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]
[params]
act_out0 = {type="str", choices=["gelu"], default="gelu"}
bias = {type="bool", default=true}
cin = {type="int", min=1, max=640, default=80}
cout = {type="int", min=1, max=640, default=384}
groups = {type="int", min=1, max=640, default=1}
h = {type="int", choices=[1], default=1}
w = {type="int", min=1, max=4096, default=3000}
kh = {type="int", choices=[1], default=1}
kw = {type="int", min=1, max=5, default=3}
padding = {type="int", min=0, max=2, default=1}
stride = {type="int", min=1, max=2, default=1}
in0_d0 = {type="int", choices=[1], default=1}
in0_d1 = {type="int", min=1, max=640, default=80}
in0_d2 = {type="int", min=1, max=4096, default=3000}
out0_d0 = {type="int", choices=[1], default=1}
out0_d1 = {type="int", min=1, max=640, default=384}
out0_d2 = {type="int", min=1, max=4100, default=3000}
[derived]
ic = "ceil(in0_d1 / 128)"
oc = "ceil(out0_d1 / 128)"
dw = "1 - min(1, max(cin - groups, groups - cin, cout - groups, groups - cout))"
pc = "dw + (1 - dw) * ic"
pair = "(1 - dw) * (1 - min(1, max(kw - 3, 3 - kw) + max(padding - 1, 1 - padding) + out0_d2 % (6 - 2 * stride))) * min(1, max(0, cin - 128) + max(0, cout - 384))"
weight_block = "2 + 2 * (kw + 2 * pair) * (dw + (1 - dw) * cin)"
pair_end = "ceil(out0_d2 / (6 - 2 * stride)) - 1"
ds128 = "ds(128)"
copy_end = "in0_d2 * pc - 2"
pixel_end = "out0_d2 - 1"
[inputs.in0]
shape = ["in0_d0", "in0_d2", "ic", 128]
range = [-2, 2]
[inputs.weights]
shape = ["oc * weight_block", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.pad]
shape = ["(in0_d2 + 2 * padding) * pc", 128]
[scratch.diff]
shape = ["2 + pair * in0_d2 * ic", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "oc", 128]
[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
pad = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
weight_block = "CR14"
copy_end = "CR11"
pixel_end = "CR12"
diff = "CR13"
pair_end = "CR15"
[golden]
tolerance = {e1="NX8_STEP", e2="NX8_STEP"}
[cases.default]
