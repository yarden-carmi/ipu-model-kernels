[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=32767, default=8}
k = {type="int", min=1, max=32767, default=64}
m = {type="int", min=1, max=32767, default=64}
n = {type="int", min=1, max=64, default=64}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=32767, default=64}
in0_d2 = {type="int", min=1, max=32767, default=512}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=64, default=64}
in1_d2 = {type="int", min=1, max=32767, default=512}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=8}
out0_d2 = {type="int", min=1, max=32767, default=64}
out0_d3 = {type="int", min=1, max=64, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "arows*128"]
range = [-1, 1]

[inputs.in1]
shape = ["in1_d0", "brows", 128]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", 128]

[derived]
arows = "ceil(in0_d2/128)"
brows = "ceil(in1_d2/2)"
ds = "ds(n)"
abatch = "arows*in0_d1"
width = "in1_d1 + 65536*brows"
total = "b*m"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
abatch = "CR5"
k = "CR6"
m = "CR7"
width = "CR8"
arows = "CR9"
ds = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
total = "CR14"
out0_d1 = "CR15"

[cases.default]
