[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=32767, default=8}
k = {type="int", min=1, max=128, default=64}
m = {type="int", min=1, max=32767, default=64}
n = {type="int", min=1, max=64, default=64}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=32767, default=64}
in0_d2 = {type="int", min=1, max=65535, default=512}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=64, default=64}
in1_d2 = {type="int", min=1, max=65535, default=512}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=8}
out0_d2 = {type="int", min=1, max=32767, default=64}
out0_d3 = {type="int", min=1, max=64, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "a_rows", 128]
range = [-1, 1]
[inputs.in1]
shape = ["ceil(in1_d0*in1_d2/2)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", 128]

[derived]
a_rows = "ceil(in0_d2/128)"
a_group = "in0_d1*a_rows*min(1,in0_d0-1)"
b_group = "in1_d2*min(1,in1_d0-1)"
sizes = "k + n*65536"
outer = "m + out0_d1*65536"
packing = "in1_d1 + (128-k)*65536"
width = "ds(n)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
width = "CR9"
sizes = "CR10"
outer = "CR11"
packing = "CR12"
a_rows = "CR13"
a_group = "CR14"
b_group = "CR15"
out0_d0 = "LR14"

[cases.default]
