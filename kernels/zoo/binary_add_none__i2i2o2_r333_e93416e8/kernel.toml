[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 49152
[params.in0_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 192
[params.in1_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 192
[params.out0_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 192

[derived]
width = "ceil(out0_d2 / 128)"
in_width = "ceil(in0_d2 / 128)"
valid = "out0_d2 - (width - 1) * 128"
tail = "ds(valid) + 65536 * valid"
width_batch = "width + 65536 * out0_d0"
batch_rows = "out0_d1 * width"
jump = "batch_rows - width"
stride_rows = "(in0_d0 * in0_d1 // in0_d2) * in_width"
stride_cols = "in0_d0 * in0_d1 % in0_d2"
col_step = "stride_cols + 65536 * (in0_d2 - stride_cols)"
col_limit = "in0_d2 + 65536 * 128"
packed_tail_end = "max(0, valid - 3) * 16843009"
packed_full_end = "125 * 16843009"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in_width * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "ceil(in1_d2 / 128) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "width * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
batch_rows = "CR8"
width_batch = "CR9"
tail = "CR10"
stride_rows = "CR11"
col_step = "CR12"
col_limit = "CR13"
jump = "CR14"
in_width = "LR11"
packed_tail_end = "LR8"
packed_full_end = "LR14"

[cases.default]
