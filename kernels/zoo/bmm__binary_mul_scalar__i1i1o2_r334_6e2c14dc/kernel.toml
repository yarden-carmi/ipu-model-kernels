[kernel]
op = "bmm__binary_mul_scalar"
formats = ["e2"]

[params]
s0_b = {type="int", min=1, max=65535, default=12}
s0_k = {type="int", min=1, max=65535, default=32}
s0_m = {type="int", min=1, max=65535, default=256}
s0_n = {type="int", min=1, max=65535, default=256}
s1_broadcast = {type="str", choices=["scalar"], default="scalar"}
s1_const = {type="int", min=1, max=1, default=1}
s1_inner = {type="int", min=0, max=0, default=0}
s1_numel = {type="int", min=1, max=2147483647, default=786432}
s1_op = {type="str", choices=["mul"], default="mul"}
in0_d0 = {type="int", min=1, max=1, default=1}
in0_d1 = {type="int", min=1, max=65535, default=256}
in0_d2 = {type="int", min=1, max=65535, default=384}
in1_d0 = {type="int", min=1, max=1, default=1}
in1_d1 = {type="int", min=1, max=65535, default=256}
in1_d2 = {type="int", min=1, max=65535, default=384}
out0_d0 = {type="int", min=1, max=1, default=1}
out0_d1 = {type="int", min=1, max=65535, default=12}
out0_d2 = {type="int", min=1, max=65535, default=256}
out0_d3 = {type="int", min=1, max=65535, default=256}

[inputs.in0]
shape = ["in0_d0*in0_d2*ac", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0*in1_d2*bc", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0*out0_d1*out0_d3*ceil(out0_d2/128)", 128]
[scratch.tmp]
shape = [3, 128]

[derived]
ac = "ceil(in0_d1/128)"
bc = "ceil(in1_d1/128)"
strides = "ac + 65536*bc"
ds_pair = "ds(128)+65536*ds((s0_m-1)%128+1)"
fp_hi = "0x43012d41"
fp_lo = "0x43010000"
nx_scale = "0x00017c35"
tiny_anchor = "0x0d011b00"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
strides = "CR9"
ds_pair = "CR10"
tiny_anchor = "CR11"
s0_n = "CR12"
fp_hi = "CR13"
fp_lo = "CR14"
nx_scale = "CR15"
s0_b = "LR14"
s0_k = "LR15"

[cases.default]
