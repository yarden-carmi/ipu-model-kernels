[kernel]
op = "gemm"
formats = ["e1"]
[params.m]
type = "int"
min = 1
max = 3136
default = 2
[params.k]
type = "int"
min = 64
max = 768
multiple_of = 64
choices = [64, 128, 256, 384, 512, 640, 768]
default = 64
[params.n]
type = "int"
min = 1
max = 128
default = 64
[params.bias]
type = "bool"
default = true
[derived]
qf = "case_qf"
K = "ceil(k / 128)"
c128 = "128"
tail = "ds(n)"
[inputs.in0]
shape = ["m * K", 128]
range = [-2, 2]
[inputs.w]
shape = ["k", 128]
range = [-2, 2]
[inputs.b]
shape = [128]
range = [-2, 2]
when = "bias"
[outputs.out0]
shape = ["m", 128]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
K = "CR7"
qf = "CR9"
tail = "CR10"
c128 = "CR11"
[golden]
tolerance = { e1 = "NX8_STEP" }
[cases.default]
m = 3
k = 64
n = 64
bias = true
[cases.long]
m = 2
k = 768
n = 18
bias = true
[cases.nobias]
m = 2
k = 128
n = 33
bias = false
