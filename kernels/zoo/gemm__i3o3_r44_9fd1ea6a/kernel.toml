[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 127
default = 64
[params.m]
type = "int"
min = 1
max = 65536
default = 4096
[params.n]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 127
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d3]
type = "int"
choices = [32, 64, 128]
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d3]
type = "int"
choices = [32, 64, 128]
default = 64

[derived]
spatial = "in0_d0 * ceil(in0_d2 / (128 / in0_d3))"
outspatial = "out0_d0 * ceil(out0_d2 / (128 / out0_d3))"
full = "ds(128)"
end = "k - 2"

[inputs.in0]
shape = ["in0_d1 * spatial", 128]
[inputs.w]
shape = ["n", 128]
[outputs.out0]
shape = ["out0_d1 * outspatial", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
spatial = "CR7"
full = "CR8"
k = "CR9"
n = "CR10"
end = "CR11"

[cases.default]
