[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.k]
type = "int"
min = 1
max = 4096
default = 24
[params.n]
type = "int"
min = 1
max = 4096
default = 88
[params.m]
type = "int"
min = 1
max = 65536
default = 784
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 24
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 28
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 88
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 28

[derived]
full_ds = "ds(128)"
chunks = "ceil(k / 128)"
in_pack = "min(2, -ceil(-128 / in0_d3))"
in_stride = "ceil(in0_d2 / in_pack)"
batch_stride = "in0_d1 * in_stride"
width_ds = "ds(out0_d3)"

[inputs.in0]
shape = ["in0_d0 * batch_stride", 128]
[inputs.coeff]
shape = ["2 * n * (1 + chunks)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d1", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full_ds = "CR7"
in_stride = "CR8"
in0_d2 = "CR9"
batch_stride = "CR10"
n = "CR11"
out0_d0 = "CR12"
width_ds = "CR15"

[cases.default]
