[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
choices = [true]
default = true
[params.cin]
type = "int"
min = 1
max = 256
default = 16
[params.cout]
type = "int"
min = 1
max = 256
default = 16
[params.groups]
type = "int"
min = 1
max = 256
default = 16
[params.h]
type = "int"
min = 1
default = 112
[params.w]
type = "int"
min = 1
max = 128
default = 112
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 256
default = 16
[params.in0_d2]
type = "int"
min = 1
default = 112
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 112
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 256
default = 16
[params.out0_d2]
type = "int"
min = 1
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 56

[derived]
full = "ds(128)"
tail = "ds(out0_d3)"
last_y = "in0_d2 - 1"
pitch = "stride * in0_d1"
batch_fix = "(out0_d2 * stride - in0_d2) * in0_d1"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d1", 128]
range = [-1, 1]
[inputs.weights]
shape = ["out0_d1", 10, 3, 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d1", 128]
[scratch.taps]
shape = [9, 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
taps = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full = "CR8"
tail = "CR9"
last_y = "CR10"
in0_d1 = "CR11"
in0_d0 = "CR12"
in0_d2 = "CR13"
pitch = "CR14"
batch_fix = "CR15"

[cases.default]
