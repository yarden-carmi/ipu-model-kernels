[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 64
[params.cout]
type = "int"
min = 1
max = 128
default = 64
[params.groups]
type = "int"
min = 1
max = 128
default = 1
[params.h]
type = "int"
min = 1
default = 8
[params.w]
type = "int"
min = 1
max = 256
default = 8
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.in0_d2]
type = "int"
min = 1
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 8
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d2]
type = "int"
min = 1
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 256
default = 8

[derived]
chunks = "ceil(in0_d3 / 128)"
out_chunks = "ceil(out0_d3 / 128)"
row_stride = "in0_d1 * chunks"
out_rows = "out0_d0 * out0_d2 * out0_d1 * out_chunks"
tap_rows = "9 * in0_d1"
tile_rows = "3 + 3 * tap_rows"
channel_rows = "chunks * tile_rows"
full = "ds(128)"
tail = "ds(out0_d3 - 128 * (out_chunks - 1))"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d1", "chunks", 128]
range = [-1, 1]
[inputs.weights]
shape = ["1 + out0_d1 * channel_rows", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out_rows", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
in0_d2 = "CR9"
in0_d1 = "CR10"
out0_d1 = "CR11"
row_stride = "CR12"
tap_rows = "CR13"
channel_rows = "CR14"
out_rows = "CR15"

[cases.default]
