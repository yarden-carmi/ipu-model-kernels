# gemm: y = a @ w (+ b): one parameterised program for every (m, k, n).
#
# a is token-major (token i's k elements in rows i * chunks + c) and w is
# *input-major*: row t * wtiles + tt holds the n+1 weights of input channel t for
# the output-channel tile tt (wtiles = ceil((n + 1) / 128)), so one word
# multiplies that 128-lane row by the scalar a[i][t] (MULT.RC.VE) and adds the
# products into the 128 R_ACC slots of the tile (ACC.ADD). One word therefore
# does 128 useful MACs; a tile's k inputs chain through R_ACC, so nothing leaves
# XMEM between chunks.
#
# Everything is a loop in this one program: the token loop (m rows) and the input
# loop inside a chunk are dynamic; the output-channel tile loop (n / 128 tiles,
# R_ACC is one tile wide) and the k chunk loop (a's 128-lane rows) are rendered
# per call around the same input loop. The shape reaches the program only through
# CRs, so a whole layer -- 4096 tokens x 1024 channels -- is one call, not one
# call per tile.
#
# No FP32 variant: FP32 addresses only 4096 XMEM rows (512 B each) and a tile's
# a + w + y needs more from k = 600 up. The variants below all keep the FP32
# accumulator and quantize only at the store, and their goldens are float64, so
# the datapath is checked exactly. A call must also fit in the 16384 NX8 rows:
# m * chunks + (k + 1) * ceil((n + 1) / 128) + m * ceil(n / 128) + ceil(n / 128).

[kernel]
op = "gemm"
formats = ["e4", "e5", "dynamic"]

[params]
m    = { type = "int", min = 1, max = 4096 }          # tokens: rows of a and of y
k    = { type = "int", min = 1, max = 2944 }          # contraction: 128 lanes per chunk
n    = { type = "int", min = 1, max = 1024 }          # output channels: 128 per R_ACC tile
act  = { type = "str", choices = ["none"], default = "none" }  # no fused activation
bias = { type = "bool", default = false }             # add b[j] to every output row

[derived]
qf            = "case_qf"                 # CR14: the QF half of the case's variant
ds            = "halves(ds(128), ds(n - 128 * (ceil(n / 128) - 1)))"
wtiles        = "ceil((n + 1) / 128)"     # CR6:  w rows per input (the input loop's row stride)
chunks        = "ceil(k / 128)"           # CR7:  a rows per token
lanes_full_m2 = "126"                     # CR9:  a full chunk's input loop bound (128 - 2)
lanes_tail_m2 = "k - 128 * (chunks - 1) - 2"  # CR10: the last, short chunk's bound
rows_bound    = "m - 2"                     # CR11: the token loop's bound (its branch reads pre-DEC)
slot1         = "128"                     # CR12: Ra's R1 element offset (the resident bias row)
y_stride      = "ceil(n / 128)"           # CR13: output rows per token (one per channel tile)

[inputs.a]
shape = ["m", "k"]
range = [-1, 1]

[inputs.w]
shape = ["k + 1", "n + 1"]                # row k pads the prefetch, column n the last tile
range = [-1, 1]

[inputs.b]
shape = [1, "n"]
range = [-1, 1]
when = "bias"

[outputs.y]
shape = ["m", "n"]

[abi]
a            = "CR2"
w            = "CR3"
y            = "CR4"
b            = { register = "CR5", when = "bias" }
wtiles       = "CR6"
chunks       = "CR7"
lanes_full_m2 = "CR9"
lanes_tail_m2 = "CR10"
rows_bound   = "CR11"
slot1        = "CR12"
y_stride     = "CR13"
qf           = "CR14"
ds           = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: the store quantizes the row to the case's grid and the golden is
# quantized the same way (measured max |err| 0 on every case); one step of
# margin for a row whose largest value moves across a rounding edge between the
# float64 golden's quantization and the kernel's accumulation. The FP32
# accumulator lane rounds once per input (~1 ulp of the partial, ~1e-5 at
# k = 2880 with inputs in [-1, 1]): far inside one step of any row's grid.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 1, why = "the store's row quantization, measured exact (max |err| 0); one step of margin for a row scale that moves" } }

[cases.default]
m = 32
k = 64
n = 32

