# gemm: y = act(a @ w (+ b)): one parameterised program for every call.
#
# a is token-major (token i's k elements in rows i * chunks + c) and w is
# *input-major*: row t * ytiles + tt holds the weights of input channel t for
# the output-channel tile tt (ytiles = ceil(n / 128)), so one word multiplies
# that 128-lane row by the scalar a[i][t] (MULT.RC.VE) and adds the products
# into the 128 R_ACC slots of the tile (ACC.ADD). One word therefore does 128
# useful MACs; a tile's k inputs chain through R_ACC, so nothing leaves XMEM
# between chunks. Row k of w is padding: the input loop's last prefetch reads it
# and no multiply uses it. Lanes past n of every w and b row are the packer's
# zeros, so a short last tile's extra lanes multiply zeros and its store (DS .L,
# all 128 lanes) writes zeros there -- no DS half depends on the shape.
#
# Every loop is dynamic (the token loop, the output-channel tile loop, the k
# chunk loop and the input loop inside a chunk), so the program is a fixed ~15
# words and the whole of k is contracted inside the kernel: a layer -- 51866
# channels, 5120 inputs, 1500 tokens -- is one launch, and the host tiles only
# m if a call is too large for one.
#
# No FP32 variant: dynamic is the chip's NX8 type and the FP32 mode addresses
# only 4096 rows of 512 B. The variants keep the FP32 accumulator and quantize
# only at the store; the golden is float64 and the only rounding is the store's.

[kernel]
op = "gemm"
formats = ["dynamic"]

[params]
m    = { type = "int", min = 1, max = 4096 }             # tokens: host-tiled if a call is larger
k    = { type = "int", min = 1, max = 5120 }             # contraction: 128 lanes per chunk
n    = { type = "int", min = 1, max = 51866 }            # output channels: 128 per R_ACC tile
act  = { type = "str", choices = ["none", "relu"], default = "none" }  # fused at the store
bias = { type = "bool", default = false }                # add b[tt] to every output row of tile tt
x_from = { type = "str", choices = ["direct"], default = "direct" }    # the row layout
y_to   = { type = "str", choices = ["direct"], default = "direct" }    # the row layout

[derived]
qf             = "case_qf"                               # CR14: the QF half of the case's variant
ds             = "halves(ds(128), ds(n - 128 * (ceil(n / 128) - 1)))"
chunks         = "ceil(k / 128)"                         # a's rows per token
cfull          = "k // 128"                              # (template only)
cbound         = "(k // 128) * 128"                      # CR7:  the chunk loop's BNE: inputs after all full chunks
lanes_full     = "126"                                   # CR9:  a full chunk's input loop bound
lanes_tail     = "k - 128 * (k // 128) - 2"              # CR10: the short last chunk's bound
mbound         = "m - 1"                                 # CR8:  the token loop's bound (its branch reads pre-INC)
ytiles         = "ceil(n / 128)"                         # w's rows per input, y's rows per token
stride         = "ceil(n / 128)"                         # CR13: w's row step per input, y's per token
ytiles_m1      = "ceil(n / 128) - 1"                     # CR11: the tile loop's bound
slot1          = "128"                                   # CR12: R1's element offset in Ra

[inputs.a]
shape = ["m", "k"]
range = [-1, 1]

[inputs.w]
shape = ["k + 1", "n"]                    # row k pads the prefetch; lanes past n are the packer's zeros
range = [-1, 1]

[inputs.b]
shape = ["n"]                             # the n biases; RowMajor zero-pads lanes past n per tile row
range = [-1, 1]
when = "bias"

[outputs.y]
shape = ["m", "n"]

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"               # LD.MASK: every lane active, whatever a previous kernel left

[abi]
a             = "CR2"
w             = "CR3"
y             = "CR4"
b             = { register = "CR5", when = "bias" }
maskr        = "CR6"
cbound         = "CR7"
mbound        = "CR8"
lanes_full    = "CR9"
lanes_tail    = "CR10"
ytiles_m1     = "CR11"
slot1         = "CR12"
stride        = "CR13"
qf            = "CR14"
ds            = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: the store quantizes the row to the case's grid and the golden is
# quantized the same way (measured max |err| 0 on every case); one step of
# margin for a row whose largest value moves across a rounding edge between the
# float64 golden's quantization and the kernel's accumulation. The FP32
# accumulator lane rounds once per input (~1 ulp of the partial): far inside
# one step of any row's grid. relu is the AaQ's own, exact on both sides of 0.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 1, why = "the store's row quantization, measured exact (max |err| 0); one step of margin for a row scale that moves" } }

