[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=32767, default=16}
k = {type="int", min=1, max=128, default=48}
m = {type="int", min=1, max=32767, default=64}
n = {type="int", min=1, max=32767, default=64}
in0_d0 = {type="int", min=1, max=32767, default=4}
in0_d1 = {type="int", min=1, max=32767, default=4}
in0_d2 = {type="int", min=1, max=32767, default=64}
in0_d3 = {type="int", min=1, max=128, default=48}
in1_d0 = {type="int", min=1, max=32767, default=4}
in1_d1 = {type="int", min=1, max=32767, default=64}
in1_d2 = {type="int", min=1, max=4194176, default=576}
out0_d0 = {type="int", min=1, max=32767, default=4}
out0_d1 = {type="int", min=1, max=32767, default=4}
out0_d2 = {type="int", min=1, max=32767, default=64}
out0_d3 = {type="int", min=1, max=32767, default=64}

[derived]
ar = "ceil(in0_d2/128)"
agroups = "in0_d0*in0_d1"
br = "ceil(in1_d2/128)"
offset = "(in1_d2-out0_d1*k)//2"
bbase = "base(in1)+offset//128"
blane = "offset%128"
bgroup = "in1_d1*br"
bend = "out0_d0*bgroup"
sizes = "m+out0_d1*65536"
steps = "br+k*65536"
dot = "ds(k)+ds(128)*65536"
tail = "ds((m-1)%128+1)+ds(1)*65536"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "ar*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "br*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]
[scratch.avec]
shape = ["agroups*in0_d2*2", 128]

[abi]
in0 = "CR2"
bbase = "CR3"
out0 = "CR4"
sizes = "CR5"
steps = "CR6"
dot = "CR7"
tail = "CR8"
n = "CR9"
qf_in0 = "CR10"
qf_in1 = "CR11"
qf_out0 = "CR12"
bgroup = "CR13"
bend = "CR14"
avec = "CR15"
agroups = "LR8"
ar = "LR13"
blane = "LR15"

[cases.default]
