[kernel]
op = "binary_mul_scalar"
formats = ["e2", "e3"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.numel]
type = "int"
min = 1
max = 2147483647
default = 49152
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 576
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 4
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 48

[derived]
chunks = "ceil(2 * in0_d1 / 128)"
batch_stride = "ceil(in0_d2 / 2) * chunks"
packed_steps = "chunks + 65536 * (in0_d1 // 128)"
odd_threshold = "128 - in0_d1 % 128"
ds_pair = "ds(out0_d3) + 65536 * ds(128)"
fp_base = "0x4b010080"
fp_top = "fp_base + out0_d3"
head_width = "0x18600 + out0_d3 + 128 * (1 - out0_d3 // 128) - 128 * (out0_d3 // 128)"

[inputs.in0]
shape = ["in0_d0 * batch_stride", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * out0_d2", 128]
[scratch.scalar]
shape = [1, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
ds_pair = "CR6"
scalar = "CR7"
fp_top = "CR8"
fp_base = "CR9"
head_width = "CR10"
packed_steps = "CR11"
out0_d1 = "CR12"
out0_d2 = "CR13"
out0_d3 = "CR14"
batch_stride = "CR15"
odd_threshold = "LR13"
out0_d0 = "LR14"

[cases.default]
