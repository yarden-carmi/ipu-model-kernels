# softmax_exp2_nx8_e4: y = softmax(x) along the last axis of a (rows, n)
# matrix, as exp2(c (x - max)) / SUM with c = log2(e), built from the
# hardware's exp2 and reciprocal (the .asm header has the dataflow).
# Hardware-clean: every store is ACTIVATE.QUANTIZE; in e4 the numerators,
# 1 / sum and y each round to e4.
[kernel]
op = "softmax"
formats = ["e4", "fp32"]

[params]
dim_last = { type = "bool", choices = [true], default = true }  # along each row only
# A row is ceil(n / 128) XMEM rows. NX8 addresses 16384 rows: x and y take
# rows * ceil(n / 128) each and the scratch 1. The domain is a box, so its
# corner (n = 384, rows = 2730) must fit: 2 * 2730 * 3 + 1 = 16381.
n        = { type = "int", min = 1, max = 384 }
rows     = { type = "int", min = 1, max = 2730 }
# log2(e) = log2e_hi + log2e_lo, two MULT constants each NX8 holds exactly.
log2e_hi = { type = "float", choices = [1.4375], default = 1.4375 }
log2e_lo = { type = "float", choices = [0.00518798828125], default = 0.00518798828125 }

[derived]
cpr   = "ceil(n / 128)"                      # chunks (XMEM rows) per row
full  = "cpr - 1"                            # full chunks; the last is chunk full
dsx   = "halves(ds(n - 128 * full), ds(1))"  # LOW: the last chunk's DS; HIGH: one element (m, 1 / sum)
slot1 = "128"                                # LR1: R1[0] in R0 ++ R1
ym1   = "base(y) - 1"                        # y - 1: loop stores see the pointer after its INC
qf    = "case_qf"                            # the case's QF half (0 in FP32)

[inputs.x]
shape = ["rows", "n"]                        # ceil(n / 128) rows per row, zero-padded
range = [-8, 8]

[outputs.y]
shape = ["rows", "n"]                        # holds the numerators until pass 4 overwrites them

[scratch.s]                                  # m, then 1 / sum: one element
shape = [1, 128]

[abi]
x        = "CR2"
y        = "CR3"
s        = "CR4"
rows     = "CR5"
cpr      = "CR6"
full     = "CR7"
dsx      = "CR8"
log2e_hi = "CR9"
log2e_lo = "CR10"
slot1    = "CR11"
ym1      = "CR12"
qf       = "CR14"

[golden]
reference = "reference.py:reference"
# FP32: only the FP32 chain differs (measured max |err| 1.9e-8 on default).
# e4: the numerator and 1 / sum each round to e4 before y does; measured worst
# 2 steps of y's grid (1 fails on 9 of the 30 e4 cases), on every tier.
tolerance = { fp32 = "FP32_ORDER", nx8 = { tier = "NX8_STEP", ulps = 2, why = "two intermediate e4 roundings (the numerator, 1 / sum) before y rounds: measured 2 steps" } }

[cases.default]                              # Qwen3-8B, Phi-3.5, granite: n = 257
n = 257
rows = 8

[cases.small]                                # Mixtral router (n = 8, rows = 1), one element, one full chunk, 128 + 1
n = [1, 8, 100, 128, 129]
rows = 1

[cases.shapes]                               # signature shapes at a few rows each
n = [8, 32, 64, 99, 256, 257, 384]
rows = 3

[cases.router]                               # Mixtral: n = 8, rows = 256
n = 8
rows = 256

[cases.negative]                             # every row max negative: the padding lanes stay out of exp2
n = [8, 99, 257]
rows = 4
generator = "gen.py:negative"

[cases.wide]                                 # probabilities over many octaves
n = [64, 257]
rows = 4
generator = "gen.py:wide"

[cases.constant]                             # y = 1 / n
n = [32, 257]
rows = 2
generator = "gen.py:constant"

[cases.mid]                                  # n = 257: SmolLM2, gpt2, Qwen3-0.6B, Qwen2.5-7B, Qwen3-8B, Qwen2.5-72B
n = 257
rows = [9, 12, 16, 28, 32, 64]
formats = ["e4"]

# The real signature shapes (whisper, t5 / clip, bart / siglip, hubert,
# gemma-3, t5 / gemma-2, SmolLM2).
[cases.whisper_n32]
n = 32
rows = 640
formats = ["e4"]
tier = "nightly"

[cases.n64]
n = 64
rows = [512, 768]
formats = ["e4"]
tier = "nightly"

[cases.hubert_n99]
n = 99
rows = 1188
formats = ["e4"]
tier = "nightly"

[cases.n256]
n = 256
rows = [1024, 2048, 2304]
formats = ["e4"]
tier = "nightly"

[cases.corner]                               # the domain's corner: all 16384 NX8 rows but 3
n = 384
rows = 2730
formats = ["e4"]
tier = "nightly"
