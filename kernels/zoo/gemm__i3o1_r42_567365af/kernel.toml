[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = false
[params.k]
type = "int"
min = 1
max = 65536
default = 48
[params.m]
type = "int"
min = 1
max = 65536
default = 256
[params.n]
type = "int"
min = 1
max = 65536
default = 768
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 48
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 768

[derived]
tiles = "ceil(out0_d1 / 128)"
full = "ds(128)"
tail = "ds((out0_d1 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2", 128]
[inputs.w]
shape = ["tiles * (k + 1) * 3", 128]
[outputs.out0]
shape = ["out0_d0 * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
in0_d3 = "CR9"
tiles = "CR11"
k = "CR12"
out0_d0 = "CR13"

[cases.default]
