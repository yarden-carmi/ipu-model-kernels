[kernel]
op = "gemm__binary_add_none"
formats = ["e2"]

[params.s0_bias]
type = "bool"
default = true
[params.s0_k]
type = "int"
min = 1
max = 65536
default = 144
[params.s0_m]
type = "int"
min = 1
max = 65536
default = 1024
[params.s0_n]
type = "int"
min = 1
max = 4096
default = 144
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 1
max = 268435456
default = 147456
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 4
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 256
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 36
[params.in1_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 65536
default = 144
[params.in1_d2]
type = "int"
min = 1
max = 65536
default = 32
[params.in1_d3]
type = "int"
min = 1
max = 65536
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 144
[derived]
tiles = "ceil(out0_d2 / 128)"
rows = "out0_d0 * out0_d1"
krows = "ceil(s0_k / 128)"
addstep = "(out0_d0 - 1) * tiles + 1"
tail = "ds((out0_d2 - 1) % 128 + 1)"
full = "ds(128)"
slot = "128"

[inputs.in0]
shape = ["rows * krows", 128]
range = [-2, 2]
[inputs.in1]
shape = ["rows * tiles", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * (s0_k + 1) * 6", 128]
range = [-1, 1]
[outputs.out0]
shape = ["rows * tiles", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
tiles = "CR9"
rows = "CR10"
s0_k = "CR11"
tail = "CR12"
full = "CR13"
slot = "CR14"
addstep = "LR12"
out0_d1 = "LR13"

[golden]
tolerance = {e2 = "NX8_STEP"}
[cases.default]
