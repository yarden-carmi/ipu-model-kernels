[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=65536, default=8}
k = {type="int", min=1, max=32767, default=64}
m = {type="int", min=1, max=32767, default=64}
n = {type="int", min=1, max=64, default=64}
in0_d0 = {type="int", min=1, max=32767, default=1}
in0_d1 = {type="int", min=1, max=32767, default=64}
in0_d2 = {type="int", min=1, max=65536, default=512}
in1_d0 = {type="int", min=1, max=32767, default=1}
in1_d1 = {type="int", min=1, max=64, default=64}
in1_d2 = {type="int", min=1, max=65536, default=512}
out0_d0 = {type="int", min=1, max=32767, default=1}
out0_d1 = {type="int", min=1, max=32767, default=8}
out0_d2 = {type="int", min=1, max=32767, default=64}
out0_d3 = {type="int", min=1, max=64, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d2", "arows*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "bgroup", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "ceil(out0_d2/128)*128"]

[derived]
arows = "ceil(in0_d1/128)"
agroup = "in0_d2*arows"
ahead = "k*arows"
steps = "arows + 65536*(k//2)"
bgroup = "ceil(in1_d2/2)"
sizes = "k + 65536*ceil(m/128)"
columns = "n + 65536*in1_d1"
groups = "out0_d1 + 65536*out0_d0"
ds_main = "ds(128) + 65536*ds((m-1)%128+1)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
ahead = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
ds_main = "CR9"
sizes = "CR10"
columns = "CR11"
groups = "CR12"
steps = "CR13"
agroup = "CR14"
bgroup = "CR15"

[cases.default]
