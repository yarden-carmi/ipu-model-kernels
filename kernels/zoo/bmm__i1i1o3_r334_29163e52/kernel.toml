[kernel]
op = "bmm"
formats = ["e1", "e2", "e3"]

[params]
b = {type="int", min=1, max=256, default=8}
k = {type="int", min=1, max=4096, default=64}
m = {type="int", min=1, max=128, default=64}
n = {type="int", min=1, max=128, default=64}
in0_d0 = {type="int", min=1, max=256, default=1}
in0_d1 = {type="int", min=1, max=128, default=64}
in0_d2 = {type="int", min=1, max=32767, default=512}
in1_d0 = {type="int", min=1, max=256, default=1}
in1_d1 = {type="int", min=1, max=128, default=64}
in1_d2 = {type="int", min=1, max=32767, default=512}
out0_d0 = {type="int", min=1, max=256, default=1}
out0_d1 = {type="int", min=1, max=256, default=8}
out0_d2 = {type="int", min=1, max=128, default=64}
out0_d3 = {type="int", min=1, max=128, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d2", 128]
range = [-1, 1]

[inputs.in1]
shape = ["in1_d0", "in1_d2", 128]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", 128]

[derived]
dsfull = "ds(128)"
dstail = "ds(n)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
b = "CR8"
k = "CR9"
m = "CR10"
dsfull = "CR11"
dstail = "CR12"

[cases.default]
