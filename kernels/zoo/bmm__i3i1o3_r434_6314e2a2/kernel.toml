[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=2147483647, default=8}
k = {type="int", min=1, max=64, default=64}
m = {type="int", min=1, max=32767, default=64}
n = {type="int", min=1, max=128, default=64}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=32767, default=8}
in0_d2 = {type="int", min=1, max=32767, default=64}
in0_d3 = {type="int", min=1, max=64, default=64}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=64, default=64}
in1_d2 = {type="int", min=1, max=8388608, default=512}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=32767, default=8}
out0_d2 = {type="int", min=1, max=32767, default=64}
out0_d3 = {type="int", min=1, max=128, default=64}

[derived]
brows = "ceil(in1_d2/2)"
skip = "in1_d2-out0_d1*n"
vbase = "base(in1)+skip//2"
geometry = "m+65536*out0_d1"
ds = "ds(k)+65536*ds(n)"
packing = "in1_d1+65536*(skip%2)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [0, 1]

[inputs.in1]
shape = ["in1_d0", "brows", 128]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", 128]

[abi]
in0 = "CR2"
vbase = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
geometry = "CR8"
ds = "CR9"
packing = "CR10"
brows = "CR11"
n = "CR12"
out0_d0 = "LR14"

[cases.default]
