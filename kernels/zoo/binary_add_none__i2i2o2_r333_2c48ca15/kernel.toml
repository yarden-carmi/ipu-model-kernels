[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 768000
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 1500
[params.in0_d2]
type = "int"
min = 128
max = 16384
multiple_of = 128
default = 512
[params.in1_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 1500
[params.in1_d2]
type = "int"
min = 128
max = 16384
multiple_of = 128
default = 512
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 1500
[params.out0_d2]
type = "int"
min = 128
max = 16384
multiple_of = 128
default = 512

[derived]
blocks = "out0_d2 / 128"
rows = "out0_d1 * blocks"
packed_rows = "ceil(out0_d1 / 256) * 256 * blocks"
step_rows = "out0_d1 // 128"
step_lane = "out0_d1 % 128"
empty = "ds(0)"

[inputs.in0]
shape = ["ceil(in0_d1 / 256) * 256", "in0_d2"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d1", "in1_d2"]
range = [-2, 2]
[outputs.out0]
shape = ["ceil(out0_d1 / 256) * 256", "out0_d2"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
blocks = "CR8"
rows = "CR9"
packed_rows = "CR10"
step_rows = "CR11"
step_lane = "CR12"
out0_d1 = "CR13"
empty = "CR14"

[cases.default]
