[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=2147483647, default=8}
k = {type="int", min=1, max=128, default=64}
m = {type="int", min=2, max=65536, multiple_of=2, default=64}
n = {type="int", min=1, max=64, default=64}
in0_d0 = {type="int", min=1, max=65536, default=1}
in0_d1 = {type="int", min=2, max=65536, default=64}
in0_d2 = {type="int", min=1, max=65536, default=512}
in1_d0 = {type="int", min=1, max=65536, default=1}
in1_d1 = {type="int", min=1, max=64, default=64}
in1_d2 = {type="int", min=1, max=65536, default=512}
out0_d0 = {type="int", min=1, max=65536, default=1}
out0_d1 = {type="int", min=1, max=65536, default=8}
out0_d2 = {type="int", min=2, max=65536, multiple_of=2, default=64}
out0_d3 = {type="int", min=1, max=64, default=64}

[derived]
arows = "ceil(in0_d2 / 128)"
agroup = "in0_d1 * arows * min(1, in0_d0 - 1)"
brows = "ceil(in1_d2 / 128)"
bgroup = "in1_d1 * brows * min(1, in1_d0 - 1)"
pairs = "m // 2"
outdesc = "ds(2 * n)"
kdesc = "ds(k)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "arows * 128"]
range = [-1, 1]

[inputs.in1]
shape = ["in1_d0", "in1_d1", "brows * 128"]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2 // 2", 128]

[scratch.panel]
shape = ["n", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
panel = "CR8"
outdesc = "CR9"
k = "CR10"
arows = "CR11"
kdesc = "CR12"
out0_d1 = "CR13"
agroup = "CR14"
brows = "CR15"
out0_d0 = "LR4"
bgroup = "LR2"
n = "LR3"
pairs = "LR0"

[cases.default]
