[kernel]
op = "bmm"
formats = ["e2", "e3"]
[params]
b = {type="int", min=1, max=512, default=12}
k = {type="int", choices=[1,2,4,8,16,32,64,128], default=64}
m = {type="int", min=2, max=2048, multiple_of=2, default=50}
n = {type="int", min=1, max=64, default=50}
in0_d0 = {type="int", min=1, max=1, default=1}
in0_d1 = {type="int", min=2, max=2048, multiple_of=2, default=50}
in0_d2 = {type="int", min=1, max=65536, default=768}
in1_d0 = {type="int", min=1, max=1, default=1}
in1_d1 = {type="int", min=1, max=2048, default=50}
in1_d2 = {type="int", min=1, max=65536, default=768}
out0_d0 = {type="int", min=1, max=1, default=1}
out0_d1 = {type="int", min=1, max=512, default=12}
out0_d2 = {type="int", min=2, max=2048, multiple_of=2, default=50}
out0_d3 = {type="int", min=1, max=64, default=50}
[inputs.in0]
shape = ["in0_d0", "in0_d1", "ceil(in0_d2/128)*128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "ceil(in1_d2/128)*128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2//2", 128]
[scratch.packed]
shape = ["b*n", 128]
[derived]
outds = "ds(128) + ds(2*n)*65536"
dotds = "ds(k)"
arows = "ceil(in0_d2/128)"
brows = "ceil(in1_d2/128)"
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
k = "CR6"
m = "CR7"
n = "CR8"
arows = "CR9"
outds = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
dotds = "CR14"
packed = "CR15"
brows = "LR15"
[cases.default]
