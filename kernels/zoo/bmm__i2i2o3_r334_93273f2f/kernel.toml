[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, max=65535, default=12}
k = {type="int", choices=[1,2,4,8,16,32,64,128], default=64}
m = {type="int", min=2, max=65534, multiple_of=2, default=50}
n = {type="int", min=1, max=64, default=50}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=2, max=65534, multiple_of=2, default=50}
in0_d2 = {type="int", min=1, max=8388480, default=768}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=64, default=50}
in1_d2 = {type="int", min=1, max=8388480, default=768}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=12}
out0_d2 = {type="int", min=2, max=65534, multiple_of=2, default=50}
out0_d3 = {type="int", min=1, max=64, default=50}

[derived]
arows = "ceil(in0_d2/128)"
brows = "ceil(in1_d2/128)"
strides = "arows + 65536*brows"
pair_heads = "m//2 + 65536*out0_d1"
widths = "k + 65536*n"
active = "ds(k) + 65536*ds(2*n)"
group_a = "in0_d1*arows"
group_b = "in1_d1*brows"
groups = "b//out0_d1"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "arows*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "brows*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2//2", 128]
[scratch.panel]
shape = ["n", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
panel = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
strides = "CR9"
pair_heads = "CR10"
widths = "CR11"
active = "CR12"
group_a = "CR13"
group_b = "CR14"
groups = "LR14"

[cases.default]
