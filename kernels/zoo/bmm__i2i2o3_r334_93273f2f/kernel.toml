[kernel]
op = "bmm"
formats = ["e1", "e2", "e3"]

[params]
b = {type="int", min=1, max=65535, default=12}
k = {type="int", min=1, max=32767, default=64}
m = {type="int", min=2, max=32766, multiple_of=2, default=50}
n = {type="int", min=1, max=64, default=50}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=50}
in0_d2 = {type="int", min=1, max=4194176, default=768}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=128, default=50}
in1_d2 = {type="int", min=1, max=4194176, default=768}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=12}
out0_d2 = {type="int", min=2, max=32766, multiple_of=2, default=50}
out0_d3 = {type="int", min=1, max=64, default=50}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "astride*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "bstride*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2//2", 128]

[derived]
astride = "ceil(in0_d2/128)"
bstride = "ceil(in1_d2/128)"
strides = "astride + bstride*65536"
agroup = "in0_d1*astride*min(in0_d0-1,1)"
bgroup = "in1_d1*bstride*min(in1_d0-1,1)"
groups = "b//out0_d1"
mn = "m+n*65536"
ds = "ds(1)+ds(2*n)*65536"
head_config = "out0_d1+ds(min(k,128))*65536"
width = "128"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
width = "CR5"
k = "CR6"
mn = "CR7"
strides = "CR8"
ds = "CR9"
qf_in0 = "CR10"
qf_in1 = "CR11"
qf_out0 = "CR12"
head_config = "CR13"
agroup = "CR14"
bgroup = "CR15"
groups = "LR6"

[cases.default]
