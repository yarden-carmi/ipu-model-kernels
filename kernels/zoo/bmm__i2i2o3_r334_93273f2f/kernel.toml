[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=2, max=128, multiple_of=2, default=12}
k = {type="int", min=64, max=64, default=64}
m = {type="int", min=2, max=65534, multiple_of=2, default=50}
n = {type="int", min=2, max=64, default=50}
in0_d0 = {type="int", min=1, max=1, default=1}
in0_d1 = {type="int", min=2, max=65534, default=50}
in0_d2 = {type="int", min=128, max=8192, multiple_of=128, default=768}
in1_d0 = {type="int", min=1, max=1, default=1}
in1_d1 = {type="int", min=1, max=64, default=50}
in1_d2 = {type="int", min=128, max=8192, multiple_of=128, default=768}
out0_d0 = {type="int", min=1, max=1, default=1}
out0_d1 = {type="int", min=2, max=128, default=12}
out0_d2 = {type="int", min=2, max=65534, default=50}
out0_d3 = {type="int", min=1, max=64, default=50}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "in1_d2"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "ceil(out0_d2/2)", 128]
[scratch.tmp]
shape = [2, 128]
[derived]
astride = "in0_d2/128"
bstride = "in1_d2/128"
ds = "ds(64)+65536*ds(2*n)"
heads = "out0_d1"
rows = "m"
cols = "n"
colend = "2*n"
sixtyfour = "n"
full = "128"
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
astride = "CR9"
bstride = "CR10"
ds = "CR11"
heads = "CR12"
rows = "CR13"
cols = "CR14"
colend = "CR15"
sixtyfour = "LR14"
full = "LR13"
[cases.default]
