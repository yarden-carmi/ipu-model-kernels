[kernel]
op = "bmm"
formats = ["e2", "e3"]

[params]
b = {type="int", min=1, default=8}
k = {type="int", choices=[1,2,4,8,16,32,64,128], default=64}
m = {type="int", min=2, max=32766, multiple_of=2, default=64}
n = {type="int", min=1, max=64, default=64}
in0_d0 = {type="int", min=1, default=1}
in0_d1 = {type="int", min=2, max=32766, multiple_of=2, default=64}
in0_d2 = {type="int", min=1, max=4194176, default=512}
in1_d0 = {type="int", min=1, default=1}
in1_d1 = {type="int", min=1, max=64, default=64}
in1_d2 = {type="int", min=1, max=4194176, default=512}
out0_d0 = {type="int", min=1, default=1}
out0_d1 = {type="int", min=1, max=32767, default=8}
out0_d2 = {type="int", min=2, max=32766, multiple_of=2, default=64}
out0_d3 = {type="int", min=1, max=64, default=64}

[inputs.in0]
shape = ["in0_d0", "in0_d1", "a_stride*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "b_stride*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2//2", 128]
[scratch.rotated]
shape = [2, 128]

[derived]
a_stride = "ceil(in0_d2/128)"
b_stride = "ceil(in1_d2/128)"
strides = "a_stride+65536*b_stride"
sizes = "m+65536*n"
heads = "k+65536*out0_d1"
a_gap = "in0_d1*a_stride-(out0_d1*k)//128"
b_gap = "in1_d1*b_stride-(out0_d1*k)//128"
widths = "ds(128)+65536*ds(k)"
out_width = "ds(2*n)"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
strides = "CR8"
sizes = "CR9"
heads = "CR10"
a_gap = "CR11"
b_gap = "CR12"
widths = "CR13"
out_width = "CR14"
rotated = "CR15"
out0_d0 = "LR13"

[cases.default]
