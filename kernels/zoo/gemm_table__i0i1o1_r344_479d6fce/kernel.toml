[kernel]
op = "gemm_table"
formats = ["e2"]

[params.m]
type = "int"
min = 1
max = 4096
default = 256
[params.k]
type = "int"
min = 4
max = 1024
multiple_of = 4
default = 192
[params.n]
type = "int"
min = 1
max = 4096
default = 128
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.in0_d0]
type = "int"
min = 1
max = 4
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 1024
default = 192
[params.in1_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 4096
default = 128
[params.in1_d2]
type = "int"
min = 1
max = 4096
default = 16
[params.in1_d3]
type = "int"
min = 1
max = 4096
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 2
max = 8192
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 4096
default = 16

[derived]
pack = "min(in0_d1, 128 // in0_d0)"
chunks = "ceil(in0_d1 / pack)"
blocks = "ceil(out0_d1 / 128) - n // 128"
copy_width = "ceil(in1_d1 / 128)"
out_width = "ceil(out0_d1 / 128)"
lane_limit = "pack * in0_d0 - ((m // in0_d2) % pack) * in0_d0 + in0_d0 - 1"
full = "ds(128) + 65536 * lane_limit"
copy_tail = "ds((n - 1) % 128 + 1) + 65536 * (lane_limit - in0_d0)"
row_period = "in0_d2 + 65536 * (in0_d2 * chunks)"
pixel_step = "m + 65536 * ((m // in0_d2) // pack + (m % in0_d2) * chunks)"

[inputs.in0]
shape = ["in0_d2 * chunks", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d2 * in1_d3 * copy_width", 128]
range = [-2, 2]
[inputs.w]
shape = ["blocks", "k", 2, 128]
range = [-1, 1]
[inputs.b]
shape = ["blocks", 2, 128]
range = [-1, 1]
when = "bias"
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.copy]
shape = [1, 128]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3 * out_width", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
w = "CR5"
b = "CR6"
lut = "CR7"
copy = "CR8"
qf_in0 = "CR9"
qf_in1 = "CR10"
qf_out0 = "CR11"
full = "CR12"
pixel_step = "CR13"
row_period = "CR14"
copy_tail = "CR15"

[cases.default]

[golden]
tolerance = { e2 = "NX8_STEP" }
