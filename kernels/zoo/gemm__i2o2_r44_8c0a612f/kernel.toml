[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 16
[params.m]
type = "int"
min = 1
max = 65536
default = 3136
[params.n]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.in0_d2]
type = "int"
min = 1
max = 64
default = 56
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 56
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 64
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 56

[derived]
pairs = "ceil(in0_d3 / 2)"
wrows = "1 + 2 * ceil(k / 128)"
full = "ds(128)"
active = "ds(2 * out0_d2)"
last = "ds(out0_d2)"
c127 = "127"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ceil(in0_d3 / 2)", 128]
[inputs.w]
shape = ["n * (1 + 2 * ceil(k / 128))", 128]
[outputs.out0]
shape = ["out0_d1 * out0_d0 * ceil(out0_d3 / 2)", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
pairs = "CR7"
k = "CR8"
n = "CR9"
full = "CR10"
c127 = "CR11"
wrows = "CR12"
active = "CR13"
last = "CR14"

[golden]
tolerance = {e1 = "NX8_STEP", e2 = "NX8_STEP"}

[cases.default]
