[kernel]
op = "binary_mul_col"
formats = ["e1"]

[params.broadcast]
type = "str"
choices = ["col"]
default = "col"
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.inner]
type = "int"
default = 576
[params.numel]
type = "int"
default = 28224
[params.in0_d0]
type = "int"
default = 1
[params.in0_d1]
type = "int"
default = 576
[params.in0_d2]
type = "int"
default = 7
[params.in0_d3]
type = "int"
default = 7
[params.in1_d0]
type = "int"
default = 1
[params.in1_d1]
type = "int"
default = 576
[params.in1_d2]
type = "int"
default = 1
[params.in1_d3]
type = "int"
default = 1
[params.out0_d0]
type = "int"
default = 1
[params.out0_d1]
type = "int"
default = 576
[params.out0_d2]
type = "int"
default = 7
[params.out0_d3]
type = "int"
default = 7

[derived]
last_channel = "inner - 1"
capacity = "min(in0_d2, 128 // in0_d3)"
remainder = "min(1, in0_d2 % capacity)"
pack = "1 + (capacity - 1) * (1 - remainder) + (1 - in0_d2 % 2) * remainder * min(1, 64 // in0_d3)"
plane = "in0_d2 // pack"
last_prefetch = "plane - 1"
valid = "ds(in0_d3 * pack)"

[inputs.in0]
shape = ["inner * plane", 128]
range = [-2, 2]
[inputs.in1]
shape = ["inner", 128]
range = [-2, 2]
[outputs.out0]
shape = ["inner * plane", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
last_channel = "CR8"
plane = "CR9"
last_prefetch = "CR10"
valid = "CR15"

[cases.default]
numel = 28224
