# binary_sub_col: y = a (op) b, broadcast = col, one parameterised program.
#
#   op        : add | sub | mul | max
#   broadcast : col    -- b holds `inner` values, one per row of a, each
#                         repeated along its row: a is [inner, numel / inner]
#                         (entities = rows of a, e.g. a per-channel NCHW
#                         scale) and y[r][j] = a[r][j] op b[r]
#   inner     : 1..128 -- the rows of a: b's values, resident in R1 (the
#                         scalar element 128 + r of Ra must stay in range)
#
# The call this kernel serves (facebook/sam-vit-base, x24 per forward) is
# broadcast = col, op = sub, inner = 14, numel = 196 -- 14 rows of 14 lanes;
# add/mul/max come with the same datapath and are declared with it. `div` and
# `min` are out: the AaQ stage has no exact reciprocal and the accumulator no
# min (see kernelgen.toml's `unsupported`).
#
# Every tensor is the layout every activation on the chip uses: an entity
# holds its features in ceil(F/128) consecutive rows, lanes past F zero.
# Here an entity is one row of a and holds numel / inner features, so the
# domain needs numel / inner <= 128 (one memory row per entity -- the DS
# half refuses more): a and y are [inner, numel / inner], row r holding
# entity r's features in lanes 0..numel/inner-1, and b is `inner` values in
# the lanes of one row, one per row of a. The kernel reads what the previous
# kernel wrote and leaves what the next one reads, with no repack between
# them; the host tiles only `numel`.
#
# Dataflow, per row r: y[r] = a[r] (op) b[r] is two products (the only way
# into R_ACC is MULT_RES), so a row is two words for add/sub/max -- word A
# multiplies the a row resident in R_CYCLIC by the CR constant 1.0 and
# initialises the accumulator, word B broadcasts b[r] (MULT.RC.VE of the
# resident ones row, the scalar element of the resident b row R1 selected by
# an LR), accumulates it and stores the row; word A carries the load of the
# row the next word A multiplies. `mul` is one product, so its row is ONE
# word: load the next a row, multiply the resident one by b[r], accumulate
# (.FIRST) and store. The shape reaches the program only through CRs and the
# row loop is dynamic, so a whole call is one launch.
#
# The domain needs `inner` to divide `numel` (a row holds numel / inner
# features): the quotient in `ds` refuses a non-whole division, and a row
# longer than 128 lanes an invalid DS, when the case is planned.

[kernel]
op = "binary"
formats = ["dynamic"]

[params]
op = { type = "str", choices = ["add", "sub", "mul", "max"], default = "sub" }
numel = { type = "int", min = 1, max = 16384 }           # elements of a and of y (rows of a x row length <= 128 x 128)
inner = { type = "int", min = 1, max = 128 }             # the rows of a: b's values, resident in R1
broadcast = { type = "str", choices = ["col"], default = "col" }

[derived]
rowlen = "numel / inner"          # a row's features (refuses a non-whole division, and ds() a length > 128)
bound = "inner - 1"               # the row loop's bound: the last row is emitted straight-line
qf = "case_qf"                    # CR14: the case's QF half
ds = "halves(ds(numel / inner), 0)"  # CR15: every row names its live lanes
slot1m1 = "127"                   # CR11: b's element index in Ra, minus one (INC'd before use)
slot128 = "128"                   # CR12: the a rows' R_CYCLIC slot

[inputs.a]
shape = ["inner", "numel / inner"]
range = [-1, 1]

[inputs.b]
shape = ["inner"]                 # one value per row of a
range = [-1, 1]

[outputs.y]
shape = ["inner", "numel / inner"]

[scratch.ones]
shape = [1, 128]
fill = 1.0                        # the resident ones row: MULT.RC.VE's vector for the b broadcast

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"       # LD.MASK: every lane active, whatever a previous kernel left

[abi]
a = "CR2"
b = "CR3"
y = "CR4"
ones = "CR5"
maskr = "CR6"
slot1m1 = "CR11"
slot128 = "CR12"
bound = "CR13"
qf = "CR14"
ds = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: only the store rounds; the golden is quantized the same way, so the
# kernel's own datapath is exact products and an exact accumulator op.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 1, why = "the store's row quantization, measured exact; one step of margin for a row scale that moves" } }

[cases.default]                                   # facebook/sam-vit-base, x24 per forward
op = "sub"
broadcast = "col"
inner = 14
numel = 196

[cases.one]                                       # the narrowest call: one lane, one row
op = "sub"
broadcast = "col"
inner = 1
numel = 1

[cases.one_wide]                                  # one row of 128 lanes
op = "sub"
broadcast = "col"
inner = 1
numel = 128

[cases.two_rows]                                  # the loop's shortest trip
op = "sub"
broadcast = "col"
inner = 2
numel = 28

[cases.many_rows]                                 # the scalar index's top: 128 rows of one lane
op = "sub"
broadcast = "col"
inner = 128
numel = 128

[cases.wide]                                      # the two-word loop, full 128-lane rows
op = "sub"
broadcast = "col"
inner = 14
numel = 1792

[cases.sweep]                                     # the structure of the calls, scaled down
op = ["add", "sub", "mul", "max"]
broadcast = "col"
inner = [1, 14]
numel = [14, 28, 112]
