[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 16384
default = 192
[params.m]
type = "int"
min = 1
max = 16384
default = 256
[params.n]
type = "int"
min = 1
max = 16384
default = 576
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 192
[params.out0_d0]
type = "int"
min = 1
max = 16384
default = 4
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 576

[derived]
tiles = "ceil(out0_d1 / 128)"
full = "ds(128)"
tail = "ds((out0_d1 - 1) % 128 + 1)"
row_tiles = "tiles * out0_d0"
groups = "ceil(k / 127)"
group_end = "126"
tail_end = "(k - 1) % 127"
width = "128"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * ceil(in0_d1 / 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["n * groups * 4", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
row_tiles = "CR10"
groups = "CR11"
group_end = "CR12"
tail_end = "CR13"
width = "CR14"
n = "CR15"

[cases.default]
