[kernel]
op = "conv2d_table"
formats = ["e2", "e1"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 192
[params.cout]
type = "int"
min = 1
max = 640
default = 96
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 32
[params.w]
type = "int"
choices = [1, 2, 4, 8, 16, 32, 64, 128]
default = 32
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 192
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 32
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 32
[params.in1_d0]
type = "int"
choices = [1]
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 640
default = 192
[params.in1_d2]
type = "int"
min = 1
max = 256
default = 32
[params.in1_d3]
type = "int"
choices = [1, 2, 4, 8, 16, 32, 64, 128]
default = 32
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 96
[params.out0_d2]
type = "int"
min = 1
max = 256
default = 32
[params.out0_d3]
type = "int"
choices = [1, 2, 4, 8, 16, 32, 64, 128]
default = 32

[derived]
full_pack = "min(out0_d2, 128 // out0_d3)"
pack = "1 + (full_pack - 1) * (1 - min(1, out0_d2 % full_pack))"
tiles = "out0_d2 // pack"
ds128 = "ds(128)"
ds_pack = "ds(out0_d3 * pack)"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "in0_d1", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "tiles", 128]
range = [-2, 2]
[inputs.weights]
shape = ["1 + cout * (4 + 36 * cin)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "tiles", 128]
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
weights = "CR5"
lut = "CR6"
qf_in0 = "CR8"
qf_in1 = "CR9"
qf_weights = "CR10"
qf_out0 = "CR11"
ds128 = "CR12"
ds_pack = "CR14"
tiles = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }

[cases.default]
