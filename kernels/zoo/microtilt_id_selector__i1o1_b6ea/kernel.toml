[kernel]
op = "microtilt_id_selector"
formats = ["e2"]
[params.tokens]
type = "int"
min = 1
max = 256
default = 256
[params.vocab]
type = "int"
min = 128
max = 32128
multiple_of = 128
default = 32128
[inputs.in0]
shape = [1, "tokens"]
[inputs.ramp]
shape = ["vocab // 128", 128]
[inputs.high]
shape = ["vocab // 128", 128]
[inputs.ones]
shape = [128]
[outputs.out0]
shape = ["tokens", "vocab"]
[scratch.tmp]
shape = [128]
[derived]
chunks = "vocab // 128"
ds = "ds(128)"
[abi]
in0 = "CR2"
ramp = "CR3"
out0 = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
qf_ramp = "CR7"
qf_out0 = "CR8"
tokens = "CR9"
chunks = "CR10"
high = "CR11"
ones = "CR12"
qf_high = "CR13"
qf_ones = "CR14"
ds = "CR15"
[cases.default]
tokens = 256
vocab = 32128
