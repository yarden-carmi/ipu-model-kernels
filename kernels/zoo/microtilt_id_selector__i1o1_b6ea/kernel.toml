[kernel]
op = "microtilt_id_selector"
formats = ["e2", "s0e1w8"]
[params.tokens]
type = "int"
min = 1
max = 256
default = 256
[params.vocab]
type = "int"
min = 128
max = 32128
multiple_of = 128
default = 32128
[inputs.in0]
shape = [1, "tokens"]
[inputs.thresholds]
shape = [2, 4, "vocab // 128", 128]
[inputs.sixth]
shape = [128]
[inputs.big]
shape = [128]
[outputs.out0]
shape = ["tokens", "vocab"]
[scratch.steps]
shape = [3, 128]
[derived]
chunks = "vocab // 128"
ds = "ds(128)"
[abi]
in0 = "CR2"
thresholds = "CR3"
out0 = "CR4"
steps = "CR5"
qf_in0 = "CR6"
qf_thresholds = "CR7"
qf_steps = "CR8"
qf_out0 = "CR9"
chunks = "LR10"
qf_big = "CR10"
big = "CR11"
sixth = "CR12"
qf_sixth = "CR14"
ds = "CR15"
tokens = "LR8"
[cases.default]
tokens = 256
vocab = 32128
