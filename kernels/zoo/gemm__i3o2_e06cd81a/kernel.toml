[kernel]
op = "gemm"
formats = ["e2", "e3"]
[params.m]
type = "int"
min = 1
max = 65536
default = 257
[params.k]
type = "int"
min = 1
max = 4096
default = 384
[params.n]
type = "int"
min = 1
max = 4096
default = 384
[params.bias]
type = "bool"
default = true
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 6
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 64
[derived]
NB = "ceil(n / 128)"
c128 = "128"
WS = "4 * NB - 4"
IR = "in0_d0 * in0_d1 * in0_d2 * ceil(in0_d3 / 128)"
[inputs.in0]
shape = ["IR", 128]
range = [-2, 2]
[inputs.w]
shape = ["k * NB * 4", 128]
range = [-2, 2]
[inputs.b]
shape = ["NB * 4", 128]
range = [-2, 2]
when = "bias"
[outputs.out0]
shape = [1, "m", "NB * 128"]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
k = "CR7"
NB = "CR8"
qf_in0 = "CR9"
qf_out0 = "CR10"
c128 = "CR11"
in0_d3 = "CR12"
WS = "CR13"
[golden]
tolerance = { e2 = "NX8_STEP", e3 = "NX8_STEP" }
[cases.default]
