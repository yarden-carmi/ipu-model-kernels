[kernel]
op = "gemm"
formats = ["e3"]
[params.m]
type = "int"
min = 1
max = 65536
default = 2
[params.k]
type = "int"
min = 1
max = 65536
default = 128
[params.n]
type = "int"
min = 128
max = 65536
multiple_of = 128
default = 128
[params.bias]
type = "bool"
default = true
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 4
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[derived]
NB = "n / 128"
last_lane = "in0_d3 - 1"
[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", 128]
range = [-2, 2]
[inputs.w]
shape = ["k * NB", 128]
range = [-2, 2]
[inputs.b]
shape = ["n"]
range = [-2, 2]
when = "bias"
[outputs.out0]
shape = [1, "m", "n"]
[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
k = "CR7"
NB = "CR8"
qf_in0 = "CR9"
qf_out0 = "CR10"
last_lane = "CR11"
[golden]
tolerance = { e3 = "NX8_STEP" }
[cases.default]
