[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, max=2147483647, default=12}
k = {type="int", min=1, max=65535, default=64}
m = {type="int", min=1, max=65535, default=256}
n = {type="int", min=1, max=65535, default=256}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=65535, default=256}
in0_d2 = {type="int", min=1, max=65535, default=768}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=65535, default=256}
in1_d2 = {type="int", min=1, max=65535, default=768}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=65535, default=12}
out0_d2 = {type="int", min=1, max=65535, default=256}
out0_d3 = {type="int", min=1, max=65535, default=256}

[derived]
ar = "ceil(in0_d1/128)"
bc = "ceil(in1_d1/128)"
mc = "ceil(out0_d2/128)"
features = "out0_d1*k"
agap = "(in0_d2-features)*ar"
bgap = "(in1_d2-features)*bc"
ds = "ds(128)+65536*ds((m-1)%128+1)"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "ar*128"]
range = [-1, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "bc*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "mc*128"]
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
k = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
ar = "CR9"
bc = "CR10"
bgap = "CR11"
n = "CR12"
mc = "CR13"
out0_d1 = "CR14"
ds = "CR15"
agap = "LR12"
out0_d0 = "LR15"

[cases.default]
