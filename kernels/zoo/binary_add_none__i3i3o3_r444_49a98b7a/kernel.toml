[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 262144 }
in0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in0_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
in0_d2 = { type = "int", min = 1, max = 16777216, default = 64 }
in0_d3 = { type = "int", min = 1, max = 128, default = 64 }
in1_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in1_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
in1_d2 = { type = "int", min = 1, max = 16777216, default = 64 }
in1_d3 = { type = "int", min = 1, max = 128, default = 64 }
out0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
out0_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
out0_d2 = { type = "int", min = 1, max = 16777216, default = 64 }
out0_d3 = { type = "int", min = 1, max = 128, default = 64 }

[derived]
cap0 = "128 // in0_d3"
cap1 = "128 // in1_d3"
capout = "128 // out0_d3"
pack0 = "1 + (cap0 - 1) * (1 - min(1, in0_d2 % cap0))"
pack1 = "1 + (cap1 - 1) * (1 - min(1, in1_d2 % cap1))"
packout = "1 + (capout - 1) * (1 - min(1, out0_d2 % capout))"
rows = "out0_d1 * out0_d0 * (out0_d2 // packout)"
active = "ds(out0_d3 * packout)"

[inputs.in0]
shape = ["in0_d1", "in0_d0", "in0_d2 // pack0", 128]
range = [-2, 2]

[inputs.in1]
shape = ["in1_d1", "in1_d0", "in1_d2 // pack1", 128]
range = [-2, 2]

[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
rows = "CR8"
active = "CR9"

[cases.default]
