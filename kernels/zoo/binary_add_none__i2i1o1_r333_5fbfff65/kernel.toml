[kernel]
op = "binary_add"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 49152 }
in0_d0 = { type = "int", min = 1, max = 4096, default = 1 }
in0_d1 = { type = "int", min = 1, max = 16384, default = 1500 }
in0_d2 = { type = "int", min = 1, max = 16384, default = 512 }
in1_d0 = { type = "int", min = 1, max = 4096, default = 1 }
in1_d1 = { type = "int", min = 1, max = 16384, default = 1500 }
in1_d2 = { type = "int", min = 1, max = 16384, default = 512 }
out0_d0 = { type = "int", min = 1, max = 4096, default = 1 }
out0_d1 = { type = "int", min = 1, max = 16384, default = 1500 }
out0_d2 = { type = "int", min = 1, max = 16384, default = 512 }

[derived]
width = "ceil(out0_d1 / 128)"
rows = "out0_d0 * out0_d2 * width"
fast_limit = "rows - 2"
minus_one = "-1"
valid = "(out0_d1 - 1) % 128 + 1"
tail = "ds(valid)"

[inputs.in0]
shape = ["in0_d0", "ceil(in0_d1 * in0_d2 / 128) * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "ceil(in1_d1 / 128) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "width * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
rows = "CR8"
width = "CR9"
valid = "CR10"
tail = "CR11"
fast_limit = "CR12"
minus_one = "CR13"

[cases.default]
