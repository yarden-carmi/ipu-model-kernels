[kernel]
op = "conv2d"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 128
[params.cout]
type = "int"
min = 1
max = 128
default = 128
[params.groups]
type = "int"
choices = [1]
default = 1
[params.h]
type = "int"
min = 1
max = 512
default = 28
[params.w]
type = "int"
min = 1
max = 128
default = 28
[params.kh]
type = "int"
min = 1
max = 3
default = 3
[params.kw]
type = "int"
min = 1
max = 3
default = 3
[params.padding]
type = "int"
choices = [0, 1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 128
[params.in0_d2]
type = "int"
min = 1
max = 512
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 28
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d2]
type = "int"
min = 1
max = 514
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 130
default = 28
[derived]
full = "ds(128)"
tail = "ds(out0_d1)"
batch_rows = "in0_d1 * in0_d2"
tap_rows = "3 * kw * in0_d1"
y_end = "out0_d2 * stride - padding"
x_end = "out0_d3 * stride - padding"
zero_row = "3 + kh * tap_rows"
y_step = "stride * in0_d1"
batch_fix = "batch_rows - out0_d2 * y_step"

[inputs.in0]
shape = ["in0_d0 * batch_rows", 128]
range = [-1, 1]
[inputs.weights]
shape = ["zero_row + 1", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d2 * out0_d3", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
in0_d2 = "CR9"
in0_d1 = "CR10"
tap_rows = "CR11"
y_step = "CR12"
y_end = "CR13"
x_end = "CR14"
in0_d3 = "CR15"
zero_row = "LR14"
out0_d0 = "LR3"
batch_fix = "LR15"

[cases.default]
