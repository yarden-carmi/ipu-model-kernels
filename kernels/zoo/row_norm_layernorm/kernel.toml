# row_norm: per-row normalisation over `channels`, one parameterised program.
#
#   layernorm  y[r, j] = (x[r, j] - mean_r) * A_r * gamma[j] + beta[j]
#   rmsnorm    y[r, j] =  x[r, j]           * A_r * gamma[j]
#   layernorm  A_r = rsqrt(max(mean_j x[r,j]^2 - mean_j^2 x[r,j], eps))
#   rmsnorm    A_r = rsqrt(max(mean_j x[r,j]^2, eps))
#
# Every row is one entity of ceil(channels / 128) consecutive XMEM rows (row
# r * chunks + c holds channels 128c .. 128c + 127, lanes past `channels` zero),
# which is both what the harness packs and reads and the layout every activation
# on the chip uses: the kernel is chainable, its y is the next kernel's x.
#
# The shape reaches the program only through CRs and the row loop is dynamic, so
# a whole layer -- 1024 rows x 144 channels -- is one launch. `rows` is the only
# dimension the host tiles; `channels` up to 512 is the kernel's own chunk loop
# (rendered per call, since a call's `channels` is known when it is assembled).
#
# The program runs per group of up to 128 rows -- the R_ACC lanes are the
# bookkeeping, one lane per row of the group, which is what bounds a group at
# 128 rows:
#   pass 1  reduce  one word per (row, chunk) per reduction: MULT.RC.VV of the
#                   row against the resident 1/channels row and AGG.SUM into the
#                   row's R_ACC lane (so the mean reduces directly, with no
#                   quantized sum in front of it), the next row's load riding in
#                   the same word; then the same loop with MULT.RC.VS for the
#                   squares. Each is stored once, as a row of the `sca` scratch.
#   pass 2  scalars A = rsqrt(max(squares*(1/channels) - mean^2, eps)) with the
#                   hardware rsqrt of ACTIVATE.QUANTIZE, floored at eps by
#                   ACC.MAX, and D = -(mean * A). Straight-line, ~10 words.
#   pass 3  p       p[r] = A_r * x[r] + D_r. A_r is Ra[R0][r] and D_r is
#                   Ra[R1][r], both element-selected scalars, so the group's A
#                   and D rows serve every row without leaving XMEM. rmsnorm
#                   needs no D, so its pass 3 is one word per row.
#   pass 4  y       y[r] = p[r] * gamma + beta: MULT.RC.VV against the resident
#                   gamma in R0, then the resident beta read out of R1.
# Every constant the case needs (1/channels, eps) is a scratch row read through
# R0, never a CR constant: in NX8 a CR constant is an 8-bit element, so only
# CR0 = 0.0 and CR1 = 1.0 stay exact.
#
# The store's DS names 128 lanes for a full chunk and channels - 128*(chunks-1)
# for the last one, so a row's scale never sees a lane past `channels` and those
# lanes are written 0 for whatever kernel reads y next. The reductions always
# use 128 lanes: the packer's (and our own store's) zeros cannot move a sum.
#
# `channels` has a floor, and it is the datapath's, not the program's: an NX8
# row is a block format, one scale for the row's largest lane and 6-7 bits of
# mantissa, so a value carries an absolute error of (its row's max)/128. The
# group's A and D rows hold one value per row of the group, and their spread is
# 1/sqrt(var_r) over the group; reducing over fewer than ~32 lanes leaves room
# for a row that is nearly constant, whose A is then 100x its neighbours' and
# drags the whole row's scale (and every other lane's error) with it. Measured:
# max |err| is 1-2 steps of the output row's grid from channels 32 up and blows
# past the tolerance below it. Real normalisation widths (144 .. 1024 here) sit
# far inside the floor.
#
# The domain is a rectangle the XMEM budget really holds: three matrices of
# rows * ceil(channels/128) rows (x, p, y) plus gamma, beta and the constants,
# inside the 16384 addressable NX8 rows (the declared maximum takes 12303).
# There is no FP32 variant for that reason: FP32 addresses only 4096 rows.

[kernel]
op = "row_norm"
formats = ["dynamic"]

[params]
kind     = { type = "str", choices = ["layernorm", "rmsnorm"], default = "layernorm" }
rows     = { type = "int", min = 1, max = 1024 }              # entities, 128 per group
channels = { type = "int", min = 32, max = 512 }              # the reduction axis, 128 per chunk
eps      = { type = "float", default = 0.00001, min = 0.00000001 }  # the rsqrt's floor

[derived]
qf = "case_qf"                                    # CR14: the case's QF half
ds = "halves(ds(128), ds(channels - 128 * (ceil(channels / 128) - 1)))"  # CR15
# The group bounds a call's `rows` fixes at render time: CR11.L is the rows the
# full-group loop runs (128 * (rows // 128)), CR11.H the short last group's
# (rows % 128); CR12.L is that group's first row in x/p/y row numbers and
# CR12.H the DS its A store uses -- an NX8 row takes its scale from its largest
# ACTIVE lane, so a group's unused bookkeeping lanes (rsqrt(eps) = 316 against a
# real A of ~1.7) must be inactive or they flush every real A of the row to 0.
gb = "halves(128 * (rows // 128), rows % 128)"
gt = "halves(128 * (rows // 128) * ceil(channels / 128), ds(rows % 128))"

[inputs.x]
shape = ["rows", "channels"]
range = [-1, 1]

[inputs.gamma]
shape = ["channels"]                              # one row per chunk, kept as prepared
range = [-1, 1]

[inputs.beta]
shape = ["channels"]                              # rmsnorm ignores it
range = [-1, 1]

[outputs.y]
shape = ["rows", "channels"]

[scratch.p]
shape = ["rows", "channels"]                      # A_r * x + D_r, one row per entity and chunk

[scratch.sca]
shape = [4, 128]                                  # the group's means, squares, A, D: one lane per row

[scratch.invn]
shape = [1, 128]
fill = "1 / channels"

[scratch.epsr]
shape = [1, 128]
fill = "eps"

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"                       # LD.MASK: every lane active, whatever a previous kernel left

[abi]
x      = "CR2"
gamma  = "CR3"
beta   = "CR4"
y      = "CR5"
p      = "CR6"
sca    = "CR7"
invn   = "CR8"
epsr   = "CR9"
maskr  = "CR10"
gb     = "CR11"
gt     = "CR12"
qf     = "CR14"
ds     = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: the store quantizes the row to the case's grid and the golden is quantized
# the same way, so what is left is the kernel's own datapath: the four rows the
# group's bookkeeping passes through (the means, the squares, A and D) and the p
# row, each one an 8-bit row quantization of a value R_ACC holds in FP32. The
# squares' and A's relative error is the largest term; the rows they land in
# hold one value per row of the group, all of them within a couple of binades of
# each other (which is what the channels >= 32 floor of the header guarantees).
# Measured max |err| 1-2 steps of the output row's grid on every case.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 3, why = "five 8-bit row round-trips in the datapath (means, squares, A, D, p); measured max 2 steps of the output row's grid" } }

[cases.default]                          # mobilevit_s cvnets_in1k, x7 per forward
kind = "layernorm"
rows = 64
channels = 240

[cases.mobilevit_192]                    # x9 per forward
kind = "layernorm"
rows = 256
channels = 192

[cases.mobilevit_144_s]                  # x5 per forward, one quarter of the rows
kind = "layernorm"
rows = 256
channels = 144

[cases.mobilevit_144]                    # x5 per forward, the whole call
kind = "layernorm"
rows = 1024
channels = 144
tier = "nightly"

[cases.rms_small]
kind = "rmsnorm"
rows = 32
channels = 64

[cases.rms_wide]                          # several chunks and a short last one
kind = "rmsnorm"
rows = 100
channels = 300

[cases.one_row]                           # the narrowest call: one row, the domain's floor
kind = "layernorm"
rows = 1
channels = 32

[cases.one_lane_rms]                      # one lane in the last chunk, a 3-row group
kind = "rmsnorm"
rows = 3
channels = 33

[cases.narrow_ln]                         # the domain's floor, over three groups
kind = "layernorm"
rows = 300
channels = 32

[cases.narrow_rms]
kind = "rmsnorm"
rows = 300
channels = 32

[cases.full_tile]                         # exactly one 128-lane chunk
kind = "layernorm"
rows = 128
channels = 128

[cases.group_boundary]                    # one full group plus a partial one
kind = "layernorm"
rows = 129
channels = 130

[cases.wide]                              # four chunks, a 16-lane last one
kind = "layernorm"
rows = 16
channels = 500

[cases.floored]                           # the eps floor binds: every A is 1/sqrt(eps)
kind = "layernorm"
rows = 40
channels = 96
eps = 1.0

[cases.tall]                              # several groups of rows, rmsnorm
kind = "rmsnorm"
rows = 300
channels = 40

[cases.tall_ln]                           # ... and layernorm over many groups
kind = "layernorm"
rows = 257
channels = 40
tier = "nightly"

[cases.sweep]                             # the structure of the calls, scaled down
kind = ["layernorm", "rmsnorm"]
rows = [1, 5, 128, 129, 300]
channels = [32, 40, 64, 100, 128, 129, 144, 240, 512]
tier = "nightly"
