[kernel]
op = "reduce_rows_mean"
formats = ["e1"]

[params.kind]
type = "str"
choices = ["mean"]
default = "mean"
[params.n]
type = "int"
min = 1
max = 65536
default = 196
[params.rows]
type = "int"
min = 1
max = 16384
default = 144
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 144
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 14
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 144
[params.out0_d2]
type = "int"
choices = [1]
default = 1
[params.out0_d3]
type = "int"
choices = [1]
default = 1

[derived]
capacity = "min(in0_d2, 98 // min(98, in0_d3))"
pack = "max(1, max(capacity * (1 - min(1, in0_d2 % capacity)), 2 * (1 - in0_d2 % 2) * min(1, 64 // in0_d3)))"
spatial = "in0_d2 // pack"
width = "in0_d3 * pack"
active = "ds(width)"
groups = "n // 32"
left = "n % 32"
one = "ds(1) + 65536 * ds(32)"
# Normalize 1/n to a CR scalar with dynamic exponent and unsigned mantissa.
shift = "min(1, (n-1)//1) + min(1, (n-1)//2) + min(1, (n-1)//4) + min(1, (n-1)//8) + min(1, (n-1)//16) + min(1, (n-1)//32) + min(1, (n-1)//64) + min(1, (n-1)//128) + min(1, (n-1)//256) + min(1, (n-1)//512) + min(1, (n-1)//1024) + min(1, (n-1)//2048) + min(1, (n-1)//4096) + min(1, (n-1)//8192) + min(1, (n-1)//16384) + min(1, (n-1)//32768)"
factor = "1 + min(1, (n-1)//1) + 2*min(1, (n-1)//2) + 4*min(1, (n-1)//4) + 8*min(1, (n-1)//8) + 16*min(1, (n-1)//16) + 32*min(1, (n-1)//32) + 64*min(1, (n-1)//64) + 128*min(1, (n-1)//128) + 256*min(1, (n-1)//256) + 512*min(1, (n-1)//512) + 1024*min(1, (n-1)//1024) + 2048*min(1, (n-1)//2048) + 4096*min(1, (n-1)//4096) + 8192*min(1, (n-1)//8192) + 16384*min(1, (n-1)//16384) + 32768*min(1, (n-1)//32768)"
inv = "65536 + 256 * (127 - shift) + min(127, (256 * factor + n) // (2 * n) - 128)"
inv_fp32 = "8388608 * (127 - shift) + (8388608 * factor + n // 2) // n - 8388608"

[inputs.in0]
shape = ["in0_d1 * spatial", 128]
[outputs.out0]
shape = ["out0_d1", 128]
[scratch.sum_row]
shape = [1, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
spatial = "CR6"
active = "CR7"
out0_d1 = "CR8"
inv = "CR9"
inv_fp32 = "CR10"
sum_row = "CR11"
width = "CR12"
groups = "CR13"
left = "CR14"
one = "CR15"

[cases.default]
