[kernel]
op = "row_softmax"
formats = ["e1"]

[params.n]
type = "int"
min = 1
max = 128
default = 50
[params.rows]
type = "int"
min = 1
default = 600
[params.in0_d0]
type = "int"
min = 1
default = 1
[params.in0_d1]
type = "int"
min = 1
default = 12
[params.in0_d2]
type = "int"
min = 1
default = 50
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 50
[params.out0_d0]
type = "int"
min = 1
default = 1
[params.out0_d1]
type = "int"
min = 1
default = 12
[params.out0_d2]
type = "int"
min = 1
default = 50
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 50

[derived]
pack = "1 + 64 // in0_d3"
width = "pack * in0_d3"
full = "ds(128)"
row_ds = "ds(n) + 328 * 65536"
out_k = "ceil(out0_d2 / 128)"
out_ds = "ds(out0_d2 - (out_k - 1) * 128) + 56 * 65536"
scratch_qf = "312 * 65536 + 56"

[inputs.in0]
shape = ["ceil(in0_d0 * in0_d1 * in0_d2 / pack)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d3", "out_k", 128]
[scratch.tmp]
shape = [12, 128]
[scratch.roots]
shape = [1, 128]
[scratch.norm]
shape = [3, "rows", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
scratch_qf = "CR4"
tmp = "CR5"
qf_in0 = "CR6"
width = "CR7"
rows = "CR8"
norm = "CR9"
qf_out0 = "CR10"
roots = "CR11"
out0_d2 = "CR12"
out_ds = "CR13"
row_ds = "CR14"
full = "CR15"
n = "LR15"
out0_d3 = "LR14"

[cases.default]
