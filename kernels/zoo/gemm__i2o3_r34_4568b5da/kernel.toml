[kernel]
op = "gemm"
formats = ["e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 384
[params.m]
type = "int"
min = 128
max = 65536
multiple_of = 128
default = 256
[params.n]
type = "int"
min = 1
max = 65536
default = 192
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 257
[params.in0_d2]
type = "int"
min = 128
max = 65536
multiple_of = 128
default = 384
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 192
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 16
[params.out0_d3]
type = "int"
choices = [1, 2, 4, 8, 16, 32, 64, 128]
default = 16
[derived]
blocks = "ceil(k / 32)"
full_blocks = "(k - 1) // 32"
pitch = "m // 128"
pack = "128 // out0_d3"
lanes = "128"
batch = "out0_d0"
height = "out0_d2"
width = "out0_d3"
active = "ds(out0_d3)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * (in0_d2 // 128)", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * (blocks + 1) * 2", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d1 * out0_d0 * out0_d2", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
pitch = "CR7"
pack = "CR8"
lanes = "CR9"
active = "CR10"
width = "CR11"
n = "CR12"
full_blocks = "CR13"
batch = "CR14"
height = "CR15"

[cases.default]
