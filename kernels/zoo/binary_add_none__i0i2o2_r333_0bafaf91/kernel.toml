[kernel]
op = "binary_add"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
op = { type = "str", choices = ["add"], default = "add" }
inner = { type = "int", min = 0, max = 0, default = 0 }
numel = { type = "int", min = 1, max = 16777216, default = 15360 }
in0_d0 = { type = "int", min = 1, max = 128, default = 4 }
in0_d1 = { type = "int", min = 1, max = 16384, default = 16 }
in0_d2 = { type = "int", min = 1, max = 16384, default = 240 }
in1_d0 = { type = "int", min = 1, max = 128, default = 4 }
in1_d1 = { type = "int", min = 1, max = 16384, default = 16 }
in1_d2 = { type = "int", min = 1, max = 16384, default = 240 }
out0_d0 = { type = "int", min = 1, max = 128, default = 4 }
out0_d1 = { type = "int", min = 1, max = 16384, default = 16 }
out0_d2 = { type = "int", min = 1, max = 16384, default = 240 }

[derived]
plane = "in0_d0 * in0_d1"
width = "ceil(plane / 128)"
c_limit = "width * in0_d2"
out_rows = "out0_d0 * out0_d1"
c_step = "(out_rows % in0_d2) * width"
ab_step = "(out_rows // in0_d2) * in0_d0"
ds_pair = "ds(128) + 65536 * ds((out0_d2 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d2", "width", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "ceil(in1_d2 / 128) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "ceil(out0_d2 / 128) * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
width = "CR8"
c_limit = "CR9"
c_step = "CR10"
ab_step = "CR11"
plane = "CR12"
in0_d0 = "CR13"
out0_d1 = "CR14"
ds_pair = "CR15"
out0_d2 = "LR15"

[cases.default]
