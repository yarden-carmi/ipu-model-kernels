[kernel]
op = "gemm_table__binary_mul_col"
formats = ["e1"]

[params.act_s0]
type = "str"
choices = ["hardsigmoid"]
default = "hardsigmoid"
[params.s0_bias]
type = "bool"
default = true
[params.s0_m]
type = "int"
choices = [1]
default = 1
[params.s0_k]
type = "int"
min = 1
max = 4096
default = 8
[params.s0_n]
type = "int"
min = 1
max = 4096
default = 16
[params.s1_broadcast]
type = "str"
choices = ["col"]
default = "col"
[params.s1_op]
type = "str"
choices = ["mul"]
default = "mul"
[params.s1_inner]
type = "int"
min = 1
max = 4096
default = 16
[params.s1_numel]
type = "int"
min = 1
max = 16777216
default = 50176

[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 8
[params.in0_d2]
type = "int"
choices = [1]
default = 1
[params.in0_d3]
type = "int"
choices = [1]
default = 1
[params.in1_d0]
type = "int"
choices = [1]
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.in1_d2]
type = "int"
min = 1
max = 65535
default = 56
[params.in1_d3]
type = "int"
min = 1
max = 65535
default = 56
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 56
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 56

[derived]
ic = "ceil(in0_d1 / 128)"
cb = "ceil(out0_d1 / 128)"
full_chunks = "ic - 1"
tail = "s0_k - 128 * full_chunks"
rows = "out0_d0 * out0_d2 * out0_d3"
rows_m1 = "rows - 1"
valid = "ds(128)"
lastv = "ds(out0_d1 - 128 * (cb - 1))"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * ic", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d2 * in1_d3 * ceil(in1_d1 / 128)", 128]
range = [0, 2]
[inputs.coeff]
shape = ["2 * cb * (s0_k + 1)", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.s0]
shape = [1, 128]
[outputs.out0]
shape = ["rows * cb", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
coeff = "CR4"
lut = "CR5"
s0 = "CR6"
out0 = "CR7"
qf_in0 = "CR8"
qf_in1 = "CR9"
qf_out0 = "CR10"
valid = "CR11"
lastv = "CR12"
full_chunks = "LR12"
tail = "LR13"
cb = "LR14"
rows_m1 = "LR15"

[cases.default]
