[kernel]
op = "bmm"
formats = ["e2"]

[params]
b = {type="int", min=1, default=8}
k = {type="int", min=1, default=64}
m = {type="int", min=2, multiple_of=2, default=64}
n = {type="int", min=1, max=64, default=64}
in0_d0 = {type="int", min=1, default=1}
in0_d1 = {type="int", min=1, default=8}
in0_d2 = {type="int", min=2, multiple_of=2, default=64}
in0_d3 = {type="int", min=1, default=64}
in1_d0 = {type="int", min=1, default=1}
in1_d1 = {type="int", min=1, default=64}
in1_d2 = {type="int", min=1, default=512}
out0_d0 = {type="int", min=1, default=1}
out0_d1 = {type="int", min=1, default=8}
out0_d2 = {type="int", min=2, multiple_of=2, default=64}
out0_d3 = {type="int", min=1, max=64, default=64}

[derived]
a_stride = "ceil(in0_d3/128)"
b_stride = "ceil(in1_d1/128)"
strides = "a_stride+65536*b_stride"
chunks = "ceil(k/128)"
rhs_start = "base(in1)+(in1_d2-out0_d1*n)*b_stride"
group_stride = "in1_d2*b_stride"
head_stride = "n*b_stride"
rhs_end = "in1_d0*group_stride"
widths = "ds(128)+65536*ds((k-1)%128+1)"
out_width = "ds(2*n)"
col_limit = "n-2"
rows_heads = "m+65536*out0_d1"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "a_stride*128"]
range = [0, 1]

[inputs.in1]
shape = ["in1_d0", "in1_d2", "b_stride*128"]
range = [-1, 1]

[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2//2", 128]

[abi]
in0 = "CR2"
rhs_start = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
widths = "CR8"
n = "CR9"
rows_heads = "CR10"
head_stride = "CR11"
group_stride = "CR12"
rhs_end = "CR13"
strides = "CR14"
out_width = "CR15"
chunks = "LR14"
col_limit = "LR15"

[cases.default]
