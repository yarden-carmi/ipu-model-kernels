[kernel]
op = "gemm_binary_add"
formats = ["e1", "e2", "e3"]

[params.s0_bias]
type = "bool"
default = true
[params.s0_m]
type = "int"
min = 1
max = 65536
default = 196
[params.s0_k]
type = "int"
min = 1
max = 16384
default = 240
[params.s0_n]
type = "int"
min = 1
max = 16384
default = 40
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 1
max = 1073741824
default = 7840
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 240
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 16384
default = 14
[params.in1_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 65536
default = 40
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 14
[params.in1_d3]
type = "int"
min = 1
max = 16384
default = 14
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 40
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 16384
default = 14

[derived]
tiles = "ceil(out0_d2 * out0_d3 / 128)"
batchstride = "in0_d1 * ceil(in0_d2 * in0_d3 / 128)"
chunks = "ceil(s0_k / 128)"
full = "ds(128)"
tail = "ds((out0_d2 * out0_d3 - 1) % 128 + 1)"
full_end = "125"
end = "(s0_k - 1) % 128 - 2"

[inputs.in0]
shape = ["in0_d0 * batchstride", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ceil(in1_d2 * in1_d3 / 128)", 128]
range = [-2, 2]
[inputs.w]
shape = ["s0_n * (chunks + 1)", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * tiles", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
full = "CR9"
tail = "CR10"
chunks = "CR11"
tiles = "CR12"
batchstride = "CR13"
full_end = "CR14"
end = "CR15"
out0_d0 = "LR14"
s0_n = "LR15"

[cases.default]
