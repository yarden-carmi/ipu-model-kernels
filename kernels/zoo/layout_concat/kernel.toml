# layout_concat: y = the leading rows of a followed by the leading rows of b,
# one parameterised program for every (kind, numel).
#
#   kind = concat : y's first rows/2 rows are a's first rows/2 rows and y's
#                   last rows/2 rows are b's first rows/2 rows -- a channel-axis
#                   concat of two C-channel tensors into one 2C-channel tensor,
#                   the layout every activation on the chip uses.
#   kind = copy   : y is a's rows, row for row (b contributes nothing) -- the
#                   slice-copy every layer needs to move a tile.
#
# numel is the element count of y and of each source region, so rows = numel/128
# rows each. A concat's two operands hold rows/2 rows of real data at their base
# (a producer that wrote a numel/2-element tensor left exactly that), and the
# copy reads all of a's; nothing here interprets what is inside a row, so the
# kernel reads the rows the previous kernel wrote and leaves rows the next one
# reads, with no repack and no host step between them.
#
# Hardware-clean NX8 (formats = ["dynamic"], the chip's one NX8 type): every
# store is an ACTIVATE.QUANTIZE identity, the accumulator is FP32, and no
# emulator-only instruction appears. There is no FP32 variant: dynamic is the
# chip's NX8 type and FP32 addresses 4096 rows only.
#
# Dataflow, per row: the only way into R_ACC is a multiply result and a word has
# one LOAD, one MULT, one ACC and one AAQ slot, so a copied row is exactly one
# word: it multiplies the row resident in R0 by the CR constant 1.0, initialises
# R_ACC with the product (ACC.ADD.FIRST) and stores the row, while the same word
# loads the row the *next* word multiplies (LOAD reads LRs after the word's own
# writes, MULT reads R0 at cycle start) and moves the three counters. One word
# per row, the multiplier issuing in every word of both loops (its lane
# occupancy is 100%; the MAC utilization a run prints is 0%, because every
# multiply here is the identity by 1.0 -- a copy retires no MACs); the last row
# of a pass is peeled straight-line without its prefetch, so no load ever
# leaves a region, and a pass of no rows (a copy's second) is skipped by its
# guard word, which is what lets one program serve both kinds.
#
# The shape reaches the program only through CRs and both passes are dynamic
# loops, so a whole call is one launch: 20480 elements is 160 iterations of the
# same word in 173 cycles, 196608 is 1549 and the declared corner of 698880 is
# 5473. numel is the only dimension the host tiles.
#
# Memory: a, b and y are numel/128 rows each and the mask row is the only
# scratch, so the declared corner takes 3*5460+1 = 16381 of the 16384
# addressable NX8 rows; hence the numel maximum of 698880.

[kernel]
op = "layout"
formats = ["dynamic"]

[params]
kind  = { type = "str", choices = ["concat", "copy"], default = "concat" }
numel = { type = "int", min = 256, max = 698880, multiple_of = 256 }  # elements of y (and of each source region)

[derived]
qf        = "case_qf"                          # CR14: the case's QF half
ds        = "ds(128)"                          # CR15: every lane of every row active
rows      = "numel / 128"                      # y's rows, and each region's: the loop's trips
half      = "rows / 2"                         # CR6: a concat's rows per operand, and pass B's y offset
loop_a    = "half - 1"                         # CR8: a concat pass's loop trips (the last row is peeled)
zero      = "0"                                # CR9: the copy pass's empty second pass
loop_copy = "rows - 1"                         # CR10: the copy pass's loop trips

[inputs.a]
shape = ["numel"]
range = [-1, 1]

[inputs.b]
shape = ["numel"]                              # a concat's second operand, the copy ignores it
range = [-1, 1]

[outputs.y]
shape = ["numel"]

[scratch.maskr]
shape = [1, 128]
bytes = "pack.py:mask_ones"                     # LD.MASK: every lane active, whatever a previous kernel left

[abi]
a         = "CR2"
b         = "CR3"
y         = "CR4"
maskr     = "CR5"
half      = "CR6"
rows      = "CR7"
loop_a    = "CR8"
zero      = "CR9"
loop_copy = "CR10"
qf        = "CR14"
ds        = "CR15"

[golden]
reference = "reference.py:reference"
# NX8: a copy moves a row through one exact multiply by 1.0 and one exact
# accumulator write, so only the store rounds, and it rounds to the grid the
# row was packed with: max |err| 0 measured on every case, the domain's corners
# included. One step of margin is kept for a row whose largest lane sits on a
# rounding edge, where the kernel's scale and the golden's can differ by a step.
tolerance = { nx8 = { tier = "NX8_STEP", ulps = 1, why = "the store's row quantization, measured exact (max |err| 0 on every case); one step of margin for a row scale that moves" } }

[cases.default]                                # mobilevit_s cvnets_in1k transformer concat, 8x8x160: cat((x, out), dim=1)
kind = "concat"
numel = 20480

[cases.surveyed_65536]                         # the same model, 16x16x128
kind = "concat"
numel = 65536

[cases.surveyed_196608]                        # the same model, 32x32x96, the largest
kind = "concat"
numel = 196608

[cases.copy]                                   # the slice copy: y is a's rows
kind = "copy"
numel = 20480

[cases.two_rows]                               # the narrowest call: two rows, one per operand
kind = "concat"
numel = 256

[cases.four_rows]                              # two rows from each operand
kind = "concat"
numel = 512

[cases.copy_two_rows]                          # the copy at its narrowest
kind = "copy"
numel = 256

[cases.odd_half]                               # an odd number of rows per operand
kind = "concat"
numel = 1280

[cases.sweep]                                  # the structure of the calls, scaled down
kind = ["concat", "copy"]
numel = [256, 512, 768, 1024, 1280, 4096, 20480]

[cases.max_numel]                              # the declared maximum: 3*5460+1 XMEM rows
kind = "concat"
numel = 698880
tier = "nightly"

[cases.max_copy]                               # the declared maximum as a copy
kind = "copy"
numel = 698880
tier = "nightly"
