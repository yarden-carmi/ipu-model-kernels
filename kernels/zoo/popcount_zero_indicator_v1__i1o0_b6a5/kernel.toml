[kernel]
op = "popcount_zero_indicator_v1"
formats = ["e2"]
[params.tokens]
type = "int"
min = 256
max = 256
default = 256
[params.vocab]
type = "int"
min = 30522
max = 30522
default = 30522
[inputs.in0]
shape = [1, "tokens"]
[inputs.bounds]
shape = ["vocab", 2, 4, 128]
[inputs.ones]
shape = [128]
[inputs.gainvec]
shape = [128]
[inputs.gaininput]
shape = [128]
[outputs.out0]
shape = ["vocab", "tokens"]
[scratch.lo]
shape = [128]
[scratch.hi]
shape = [128]
[derived]
tiles = "ceil(tokens / 128)"
boundrows = "vocab * 8"
[abi]
in0 = "CR2"
bounds = "CR3"
ones = "CR4"
out0 = "CR5"
lo = "CR6"
hi = "CR7"
qf_in0 = "CR8"
qf_bounds = "CR9"
qf_ones = "CR10"
qf_out0 = "CR11"
gainvec = "CR12"
tiles = "CR13"
boundrows = "LR14"
gaininput = "CR14"
[golden]
tolerance = { e2 = "EXACT" }
[cases.default]
tokens = 256
vocab = 30522
