[kernel]
op = "binary_add_none"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 15360 }
in0_d0 = { type = "int", min = 1, max = 4, default = 4 }
in0_d1 = { type = "int", min = 16, max = 16384, multiple_of = 16, default = 16 }
in0_d2 = { type = "int", min = 8, max = 65536, multiple_of = 8, default = 240 }
in1_d0 = { type = "int", min = 1, max = 16777216, default = 4 }
in1_d1 = { type = "int", min = 1, max = 16777216, default = 16 }
in1_d2 = { type = "int", min = 1, max = 16777216, default = 240 }
out0_d0 = { type = "int", min = 1, max = 16777216, default = 4 }
out0_d1 = { type = "int", min = 1, max = 16777216, default = 16 }
out0_d2 = { type = "int", min = 1, max = 16777216, default = 240 }

[derived]
plane_rows = "(out0_d1 * out0_d2 + 127) // 128"
rows = "out0_d0 * plane_rows"
step = "(in0_d0 * in0_d1) // 128 + 65536 * ((in0_d0 * in0_d1) % 128)"
width = "in0_d2"
height = "in0_d1"
batches = "in0_d0"
batch_step = "in0_d0"
lanes = "128"

[inputs.in0]
shape = ["in0_d0 * ((in0_d1 * in0_d2 + 127) // 128)", 128]
[inputs.in1]
shape = ["in1_d0 * ((in1_d1 * in1_d2 + 127) // 128)", 128]
[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
rows = "CR8"
step = "CR9"
width = "CR10"
height = "CR11"
batches = "CR12"
batch_step = "CR13"
lanes = "CR14"

[cases.default]
