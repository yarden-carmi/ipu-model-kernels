[kernel]
op = "binary_add"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 147456 }
in0_d0 = { type = "int", min = 1, max = 4096, default = 4 }
in0_d1 = { type = "int", min = 8, max = 16384, multiple_of = 8, default = 256 }
in0_d2 = { type = "int", min = 16, max = 16384, multiple_of = 16, default = 144 }
in1_d0 = { type = "int", min = 1, max = 4096, default = 4 }
in1_d1 = { type = "int", min = 1, max = 16384, default = 256 }
in1_d2 = { type = "int", min = 1, max = 16384, default = 144 }
out0_d0 = { type = "int", min = 1, max = 4096, default = 4 }
out0_d1 = { type = "int", min = 1, max = 16384, default = 256 }
out0_d2 = { type = "int", min = 1, max = 16384, default = 144 }

[derived]
width = "ceil(out0_d1 * out0_d2 / 128)"
rows = "out0_d0 * width"
tail = "ds(out0_d1 * out0_d2 - (width - 1) * 128)"
single = "ds(1)"
step_rows = "(out0_d0 * out0_d1) // 128"
step_lanes = "(out0_d0 * out0_d1) % 128"
a_rows = "out0_d0 // 128"
a_lanes = "out0_d0 % 128"

[inputs.in0]
shape = ["in0_d0", "ceil(in0_d1 * in0_d2 / 128)", 128]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "ceil(in1_d1 * in1_d2 / 128)", 128]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "width", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
rows = "CR8"
width = "CR9"
tail = "CR10"
single = "CR11"
out0_d1 = "CR12"
out0_d2 = "CR13"
step_rows = "CR14"
step_lanes = "LR14"
a_rows = "LR15"
a_lanes = "LR12"

[cases.default]
