[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.m]
type = "int"
min = 1
max = 65536
default = 2
[params.k]
type = "int"
min = 1
max = 256
default = 32
[params.n]
type = "int"
min = 1
max = 16384
default = 64
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 2
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 2
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 64

[derived]
tiles = "ceil(out0_d2 / 128)"
chunks = "ceil(in0_d2 / 128)"
pitch_rows = "(in0_d1 // in0_d2) * chunks"
pitch_lanes = "in0_d1 % in0_d2"
batch_rows = "in0_d1 * chunks"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"

[inputs.in0]
shape = ["in0_d0 * batch_rows", 128]
range = [-2, 2]
[inputs.w]
shape = ["3 * tiles * (k + 1) + 1", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
k = "CR10"
m = "CR11"
pitch_rows = "CR12"
pitch_lanes = "CR13"
in0_d2 = "CR14"
in0_d1 = "CR15"
batch_rows = "LR12"
chunks = "LR14"

[cases.default]
