[kernel]
op = "gemm_table"
formats = ["e2"]

[params.m]
type = "int"
min = 1
max = 16384
default = 64
[params.k]
type = "int"
min = 16
max = 16384
multiple_of = 16
default = 240
[params.n]
type = "int"
min = 1
max = 16384
default = 160
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.in0_d0]
type = "int"
min = 1
max = 1024
default = 4
[params.in0_d1]
type = "int"
min = 8
max = 16384
multiple_of = 8
default = 16
[params.in0_d2]
type = "int"
min = 16
max = 16384
multiple_of = 16
default = 240
[params.in1_d0]
type = "int"
min = 1
max = 1
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 160
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 8
[params.in1_d3]
type = "int"
min = 1
max = 128
default = 8
[params.out0_d0]
type = "int"
min = 1
max = 1
default = 1
[params.out0_d1]
type = "int"
min = 2
max = 32768
default = 320
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 8

[derived]
groups = "k // 16"
width_ds = "ds(in1_d3)"
last_lane = "128 - in1_d3"
pack = "min(4 + 124 * max(0, 2 - m), 128 // in1_d3)"
skip_rows = "ceil(in1_d1 / pack)"
skip_span = "pack * in1_d3"

[inputs.in0]
shape = ["in0_d0 * ceil(in0_d1 * in0_d2 / 128)", 128]
[inputs.in1]
shape = ["in1_d0", "in1_d2", "skip_rows", 128]
[inputs.w]
shape = ["n", "2 + 2 * groups", 128]
[inputs.lut]
shape = [5, 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d1", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
w = "CR5"
lut = "CR6"
qf_in0 = "CR7"
qf_in1 = "CR8"
qf_out0 = "CR9"
width_ds = "CR10"
n = "CR11"
in1_d2 = "CR12"
groups = "CR13"
last_lane = "CR14"
skip_span = "CR15"

[cases.default]
