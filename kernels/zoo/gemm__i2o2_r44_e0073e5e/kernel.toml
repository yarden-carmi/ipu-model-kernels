[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 64
[params.m]
type = "int"
min = 1
max = 65536
default = 16384
[params.n]
type = "int"
min = 1
max = 65536
default = 32
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 128
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 128
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 32
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 128
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 128

[derived]
blocks = "ceil(k / 32)"
full_blocks = "(k - 1) // 32"
pack = "1 + (1 - min(1, out0_d3 % 2 + max(0, out0_d2 - 64)))"
active = "ds(out0_d2 * pack)"
batch_stride = "in0_d1 * in0_d3"
coeff_stride = "2 * (blocks + 1)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d3 * ceil(in0_d2 / 128)", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * coeff_stride", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * (out0_d3 // pack)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
qf_coeff = "CR7"
active = "CR8"
in0_d3 = "CR9"
batch_stride = "CR10"
coeff_stride = "CR11"
full_blocks = "CR12"
n = "CR13"
out0_d0 = "CR14"
out0_d3 = "CR15"

[cases.default]
