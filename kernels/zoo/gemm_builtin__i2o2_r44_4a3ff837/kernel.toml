[kernel]
op = "gemm_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 32
[params.n]
type = "int"
min = 1
max = 4096
default = 1
[params.m]
type = "int"
min = 1
max = 1048576
default = 50176
[params.in0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 32
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 224
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 224
[params.out0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 1
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 224
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 224

[derived]
chunks = "ceil(in0_d2 / 128)"
pixels = "in0_d0 * in0_d3"
pitch = "in0_d1 * chunks"
last_chunk = "chunks - 1"
full = "ds(128)"
tail = "ds(1 + (out0_d2 - 1) % 128)"

[inputs.in0]
shape = ["pixels * pitch", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["n * 2 * (k + 1)", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0 * out0_d3 * out0_d1 * ceil(out0_d2 / 128)", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
qf_coeff = "CR7"
k = "CR8"
n = "CR9"
chunks = "CR10"
pixels = "CR11"
pitch = "CR12"
last_chunk = "CR13"
full = "CR14"
tail = "CR15"

[cases.default]
