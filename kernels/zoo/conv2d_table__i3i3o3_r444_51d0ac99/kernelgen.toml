chain = ["conv2d"]
chain_in = ["in0", "in1"]
chain_out = ["out0"]

[layout.in0]
lanes = 3
rows = [0, 1, 2]

[layout.in1]
lanes = 3
rows = [0, 2, 1]
pack = "1 + min(1, groups - 1) * (max(1, 128 // w) - 1)"

[view.in0]
kind = "whole"

[view.in1]
kind = "whole"

[layout.out0]
lanes = 3
rows = [0, 2, 1]
pack = "min(1, groups - 1) * max(1, 128 // d3) + (1 // groups) * max(1, (128 // w) * (2 - stride))"

[lut.out0]
range_mode = 2
range_exp = 40
