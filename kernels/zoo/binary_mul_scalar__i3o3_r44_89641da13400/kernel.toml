[kernel]
op = "binary_mul_scalar"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["scalar"]
default = "scalar"
[params.const]
type = "int"
min = 1
max = 1
default = 1
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["mul"]
default = "mul"
[params.numel]
type = "int"
min = 1
max = 268435456
default = 32768
[params.in0_d0]
type = "int"
min = 1
max = 268435456
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 268435456
default = 8
[params.in0_d2]
type = "int"
min = 1
max = 268435456
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 268435456
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 268435456
default = 8
[params.out0_d2]
type = "int"
min = 1
max = 268435456
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 64

[derived]
ip = "1 + 64 // in0_d3"
opack = "1 + 64 // out0_d3"
irows = "ceil(in0_d0 * in0_d1 * in0_d2 / ip)"
orows = "ceil(out0_d0 * out0_d1 * out0_d2 / opack)"
valid = "ds(opack * out0_d3)"
tail = "ds((out0_d0 * out0_d1 * out0_d2 - (orows - 1) * opack) * out0_d3)"
full = "ds(128)"
last = "orows - 1"
penultimate = "orows - 2"
fp_hi = "0x43012080"
fp_lo = "0x43010080"
nx_scale = "0x00017c00"
initial_store = "0 - 1"

[inputs.in0]
shape = ["irows", 128]
range = [-2, 2]
[outputs.out0]
shape = ["orows", 128]
[scratch.scalar]
shape = [1, 128]

[abi]
in0 = "CR2"
out0 = "CR3"
qf_in0 = "CR4"
qf_out0 = "CR5"
valid = "CR6"
tail = "CR7"
full = "CR8"
last = "CR9"
penultimate = "CR10"
scalar = "CR11"
fp_hi = "CR12"
fp_lo = "CR13"
nx_scale = "CR14"
initial_store = "LR2"

[cases.default]
