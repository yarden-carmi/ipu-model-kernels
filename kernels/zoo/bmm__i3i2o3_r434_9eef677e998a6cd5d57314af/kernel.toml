[kernel]
op = "bmm"
formats = ["e2", "e3"]
[params]
b = {type="int", min=1, max=65535, default=8}
k = {type="int", min=1, max=32767, default=64}
m = {type="int", min=1, max=32767, default=64}
n = {type="int", min=1, max=128, default=64}
in0_d0 = {type="int", min=1, max=65535, default=1}
in0_d1 = {type="int", min=1, max=32767, default=8}
in0_d2 = {type="int", min=1, max=32767, default=64}
in0_d3 = {type="int", min=1, max=32767, default=64}
in1_d0 = {type="int", min=1, max=65535, default=1}
in1_d1 = {type="int", min=1, max=32767, default=64}
in1_d2 = {type="int", min=1, max=4194176, default=512}
out0_d0 = {type="int", min=1, max=65535, default=1}
out0_d1 = {type="int", min=1, max=32767, default=8}
out0_d2 = {type="int", min=1, max=32767, default=64}
out0_d3 = {type="int", min=1, max=128, default=64}
[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "arows*128"]
range = [0, 1]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "brows*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", 128]
[derived]
arows = "ceil(in0_d3/128)"
brows = "ceil(in1_d2/128)"
group_rows = "in1_d1*brows"
total_rows = "in1_d0*group_rows"
offset = "in1_d2-out0_d1*n"
vbase = "base(in1)+offset//128"
n_lane = "n + (offset%128)*65536"
mh = "m + out0_d1*65536"
stride = "brows + arows*65536"
panel_cols = "min(out0_d1*n,16383)"
k_count = "k + panel_cols*65536"
ds = "ds(128) + 65536*ds(n)"
[scratch.panel]
shape = ["16+2*panel_cols", 128]
[abi]
in0 = "CR2"
vbase = "CR3"
out0 = "CR4"
panel = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
stride = "CR9"
group_rows = "CR10"
total_rows = "CR11"
n_lane = "CR12"
mh = "CR13"
k_count = "CR14"
ds = "CR15"
[cases.default]
