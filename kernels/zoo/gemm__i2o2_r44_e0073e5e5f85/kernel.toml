[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 128
[params.n]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 65536
default = 4096
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 128
[params.in0_d2]
type = "int"
min = 1
max = 128
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 64

[derived]
chunks = "ceil(k / 128)"
pack = "1 + (1 - out0_d3 % 2) * min(1, 64 // out0_d2)"
width = "ds(out0_d2 * pack)"
columns = "out0_d3 // pack"
batch_stride = "in0_d1 * in0_d3"
shift = "128 - out0_d2"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d3", 128]
[inputs.w]
shape = ["2 * n * (1 + chunks)", 128]
[outputs.out0]
shape = ["out0_d0 * columns * out0_d1", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
width = "CR7"
in0_d3 = "CR8"
batch_stride = "CR9"
n = "CR10"
in0_d0 = "CR11"
chunks = "CR12"
columns = "CR13"
shift = "CR14"

[cases.default]
