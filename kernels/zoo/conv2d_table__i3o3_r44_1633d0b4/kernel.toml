[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["hardswish"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 3
[params.cout]
type = "int"
min = 1
max = 640
default = 16
[params.groups]
type = "int"
min = 1
max = 640
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 224
[params.w]
type = "int"
min = 1
max = 256
default = 224
[params.kh]
type = "int"
choices = [1, 3, 5]
default = 3
[params.kw]
type = "int"
choices = [1, 3, 5]
default = 3
[params.padding]
type = "int"
choices = [0, 1, 2]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 2
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 3
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 224
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 224
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 260
default = 112
[params.out0_d3]
type = "int"
min = 1
max = 260
default = 112

[derived]
ix = "ceil(in0_d3 / 128)"
ox = "ceil(out0_d3 / 128)"
plane = "(in0_d2 + 2 * padding) * kw * ox"
gcin = "cin // groups"
group_plane = "plane * gcin"
weights_end = "cout * (3 + 3 * gcin) - 1"
y_last = "(out0_d2 - 1) * stride * kw * ox"
ds128 = "ds(128)"
ds_in = "ds(1 + (in0_d3 - 1) % 128)"
ds_out = "ds(1 + (out0_d3 - 1) % 128)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ix", 128]
range = [-2, 2]
[inputs.weights]
shape = ["weights_end + 1", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.shifted]
shape = ["1 + cin * plane", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "out0_d1", "ox", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
shifted = "CR6"
y_last = "CR7"
qf_in0 = "CR8"
qf_weights = "CR9"
qf_out0 = "CR10"
ds128 = "CR11"
ds_in = "CR12"
ds_out = "CR13"
plane = "CR14"
weights_end = "CR15"
group_plane = "LR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
