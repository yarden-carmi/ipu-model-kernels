[kernel]
op = "gemm"
formats = ["e1", "e2"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 65536
default = 72
[params.m]
type = "int"
min = 1
max = 65536
default = 784
[params.n]
type = "int"
min = 1
max = 65536
default = 24
[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 65536
default = 72
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 28
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 65536
default = 24
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 28

[derived]
chunks = "ceil(k / 128)"
strips = "out0_d0 * out0_d2"
pack = "min(4 + 124 * max(0, 2 - m), 128 // out0_d3)"
groups = "ceil(out0_d1 / pack)"
tail = "out0_d1 - (groups - 1) * pack"
full_ds = "ds(128)"
group_ds = "ds(pack * out0_d3)"
tail_ds = "ds(tail * out0_d3)"

[inputs.in0]
shape = ["in0_d0 * in0_d2 * in0_d3 * ceil(in0_d1 / 128)", 128]
[inputs.coeff]
shape = ["4 * (groups + n * chunks)", 128]
[outputs.out0]
shape = ["strips * groups", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
chunks = "CR7"
strips = "CR8"
groups = "CR9"
pack = "CR10"
tail = "CR11"
out0_d3 = "CR12"
full_ds = "CR13"
group_ds = "CR14"
tail_ds = "CR15"

[cases.default]
