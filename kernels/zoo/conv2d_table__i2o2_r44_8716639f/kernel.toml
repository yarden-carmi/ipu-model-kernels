[kernel]
op = "conv2d_table"
formats = ["e2"]

[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 512
default = 16
[params.cout]
type = "int"
min = 1
max = 512
default = 16
[params.groups]
type = "int"
min = 1
max = 512
default = 1
[params.h]
type = "int"
min = 8
max = 256
default = 8
[params.w]
type = "int"
min = 4
max = 256
multiple_of = 4
default = 8
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 512
default = 16
[params.in0_d2]
type = "int"
min = 3
max = 256
default = 8
[params.in0_d3]
type = "int"
min = 3
max = 256
default = 8
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 512
default = 16
[params.out0_d2]
type = "int"
choices = [8, 16, 24, 32, 40, 48, 56, 64, 128]
default = 8
[params.out0_d3]
type = "int"
min = 2
max = 256
multiple_of = 2
default = 8

[derived]
iyrows = "ceil(in0_d2 / 128)"
oyrows = "ceil(2 * out0_d2 / 128)"
tiles = "(out0_d3 // 2) * oyrows"
ic = "cin // groups"
group_rows = "ic * in0_d3 * iyrows"
active = "ds(2 * out0_d2 // oyrows)"
wrows = "cout * (2 + 2 * ceil(ic / 14))"
src_a = "50462976 * stride"
src_b = "117835012 * stride"
dst_a = "50462976"
dst_b = "117835012"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d3", "iyrows", 128]
range = [-2, 2]
[inputs.weights]
shape = ["wrows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d1", "out0_d0", "ceil(out0_d3 / 2)", "ceil(2 * out0_d2 / 128)", 128]
[scratch.pad]
shape = ["2 + tiles * ic * 18", 128]

[abi]
in0 = "CR2"
pad = "CR3"
weights = "CR4"
lut = "CR5"
out0 = "CR6"
qf_in0 = "CR7"
qf_out0 = "CR8"
active = "CR9"
src_a = "CR10"
src_b = "CR11"
dst_a = "CR12"
dst_b = "CR13"
in0_d3 = "CR14"
group_rows = "CR15"

[golden]
tolerance = { e2 = "NX8_STEP" }
[cases.default]
