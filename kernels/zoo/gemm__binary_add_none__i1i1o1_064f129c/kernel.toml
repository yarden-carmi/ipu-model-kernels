[kernel]
op = "gemm__binary_add_none"
formats = ["e2"]

[params.s0_bias]
type = "bool"
default = true
[params.s0_k]
type = "int"
min = 1
max = 4096
default = 256
[params.s0_m]
type = "int"
min = 1
max = 65536
default = 4096
[params.s0_n]
type = "int"
min = 1
max = 128
default = 64
[params.s1_broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.s1_inner]
type = "int"
min = 0
max = 0
default = 0
[params.s1_numel]
type = "int"
min = 1
max = 8388608
default = 262144
[params.s1_op]
type = "str"
choices = ["add"]
default = "add"

[params.in0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.in0_d3]
type = "int"
min = 1
max = 65536
default = 64
[params.in1_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 128
default = 64
[params.in1_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.in1_d3]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 65536
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 65536
default = 64
[params.out0_d3]
type = "int"
min = 1
max = 65536
default = 64

[derived]
irows = "in0_d0 * in0_d2 * in0_d3 * ceil(in0_d1 / 128)"
rrows = "in1_d0 * in1_d2 * in1_d3"
orows = "out0_d0 * out0_d2 * out0_d3"
chunks = "ceil(s0_k / 128)"
nm1 = "s0_n - 1"
width = "128"
valid = "ds(out0_d1)"
full = "ds(128)"

[inputs.in0]
shape = ["irows", 128]
range = [-2, 2]
[inputs.in1]
shape = ["rrows", 128]
range = [-2, 2]
[inputs.w]
shape = ["2 * chunks * s0_n + 3", 128]
range = [-1, 1]
[outputs.out0]
shape = ["orows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
w = "CR4"
out0 = "CR5"
qf_in0 = "CR6"
qf_in1 = "CR7"
qf_out0 = "CR8"
valid = "CR9"
s0_m = "CR10"
chunks = "CR11"
nm1 = "CR12"
width = "CR13"
full = "CR14"

[golden]
tolerance = {e2 = "NX8_STEP"}
[cases.default]
s0_k = 144
s0_m = 6
s0_n = 16
s1_numel = 96
in0_d1 = 144
in0_d2 = 2
in0_d3 = 3
in1_d1 = 16
in1_d2 = 2
in1_d3 = 3
out0_d1 = 16
out0_d2 = 2
out0_d3 = 3
