[kernel]
op = "binary_add"
formats = ["e2", "e3"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 49152 }
in0_d0 = { type = "int", min = 1, max = 4096, default = 4 }
in0_d1 = { type = "int", min = 1, max = 16384, default = 64 }
in0_d2 = { type = "int", min = 1, max = 16384, default = 192 }
in1_d0 = { type = "int", min = 1, max = 4096, default = 4 }
in1_d1 = { type = "int", min = 1, max = 16384, default = 64 }
in1_d2 = { type = "int", min = 1, max = 16384, default = 192 }
out0_d0 = { type = "int", min = 1, max = 4096, default = 4 }
out0_d1 = { type = "int", min = 1, max = 16384, default = 64 }
out0_d2 = { type = "int", min = 1, max = 16384, default = 192 }

[derived]
pack = "1 + (in0_d1 - 1) * min(1, max(0, in0_d2 - 144))"
span = "pack * in0_d2"
span_rows = "ceil(span / 128)"
pad = "span_rows * 128 - span"
stride = "out0_d0 * out0_d1"
step_rows = "stride // span * span_rows + stride % span // 128"
step_lane = "stride % span % 128"
lane_batch = "step_lane + 65536 * out0_d0"
step_span = "stride % span"
one = "ds(1)"
batch_items = "out0_d1 * out0_d2"
batch_rows = "ceil(out0_d0 * batch_items / 128)"
empty_rows = "batch_rows - ceil(batch_items / 128)"
full = "ds(128) + 65536 * empty_rows"
tail = "ds((batch_items - 1) % 128 + 1) + 65536 * ds(0)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 // pack", "span_rows * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d0", "in1_d1", "ceil(in1_d2 / 128) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d0", "batch_rows * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
one = "CR8"
tail = "CR9"
span = "CR10"
span_rows = "CR11"
step_rows = "CR12"
lane_batch = "CR13"
step_span = "CR14"
pad = "LR14"
full = "CR15"
out0_d1 = "LR15"
out0_d2 = "LR12"

[cases.default]
