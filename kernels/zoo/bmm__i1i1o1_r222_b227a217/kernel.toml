[kernel]
op = "bmm"
formats = ["e3"]

[params]
b = {type="int", min=1, max=32767, default=1}
k = {type="int", min=1, max=4194176, default=512}
m = {type="int", min=1, max=32767, default=1}
n = {type="int", min=1, max=32767, default=1}
in0_d0 = {type="int", min=1, max=1073676289, default=1}
in0_d1 = {type="int", min=1, max=4194176, default=512}
in1_d0 = {type="int", min=1, max=1073676289, default=1}
in1_d1 = {type="int", min=1, max=4194176, default=512}
out0_d0 = {type="int", min=1, max=1073676289, default=1}
out0_d1 = {type="int", min=1, max=32767, default=1}

[inputs.in0]
shape = ["in0_d0", "ceil(in0_d1/128)*128"]
range = [-1, 1]
[inputs.in1]
shape = ["b*n", "chunks*128"]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "ceil(out0_d1/128)*128"]

[derived]
chunks = "ceil(k/128)"
rhs_batch = "n*chunks"
out_prev = "-1"
last_lane = "127"
ds = "ds(128) + ds((n-1)%128+1)*65536"

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
m = "CR6"
n = "CR7"
chunks = "CR8"
rhs_batch = "CR9"
out_prev = "CR10"
ds = "CR11"
qf_in0 = "CR12"
qf_in1 = "CR13"
qf_out0 = "CR14"
last_lane = "CR15"

[cases.default]
