[kernel]
op = "gemm_table"
formats = ["e2"]

[params.k]
type = "int"
min = 8
max = 4096
multiple_of = 8
default = 144
[params.m]
type = "int"
min = 8
max = 65535
multiple_of = 8
default = 1024
[params.n]
type = "int"
min = 1
max = 4096
default = 96
[params.bias]
type = "bool"
default = true
[params.act_out0]
type = "str"
choices = ["silu"]
default = "silu"
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 4
[params.in0_d1]
type = "int"
min = 1
max = 65535
default = 256
[params.in0_d2]
type = "int"
min = 8
max = 4096
multiple_of = 8
default = 144
[params.in1_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 4096
default = 96
[params.in1_d2]
type = "int"
min = 1
max = 4096
default = 32
[params.in1_d3]
type = "int"
choices = [8, 16, 32, 64, 128]
default = 32
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 8192
default = 192
[params.out0_d2]
type = "int"
min = 1
max = 4096
default = 32
[params.out0_d3]
type = "int"
choices = [8, 16, 32, 64, 128]
default = 32

[derived]
ir = "in0_d0 * in0_d1 * ceil(in0_d2 / 128)"
blocks = "ceil(m / 128)"
copy_rows = "in1_d0 * in1_d1 * ceil(in1_d2 / max(1, 128 // in1_d3))"
out_rows = "out0_d0 * out0_d1 * ceil(out0_d2 / max(1, 128 // out0_d3))"
chunks = "ceil(k / 128)"
coeff_rows = "n * (2 * chunks + 1)"
stage_rows = "k * blocks"
full = "ds(128)"
tail = "ds(m - 128 * (blocks - 1))"
idx_lo = "50462976"
idx_hi = "117835012"
row_step = "(in0_d0 - 1) * ceil(in0_d2 / 128) + 1"

[inputs.in0]
shape = ["ir", 128]
range = [-2, 2]
[inputs.in1]
shape = ["copy_rows", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_rows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out_rows", 128]
[scratch.stage]
shape = ["stage_rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
coeff = "CR4"
lut = "CR5"
out0 = "CR6"
stage = "CR7"
qf_in0 = "CR8"
qf_in1 = "CR9"
qf_out0 = "CR10"
full = "CR11"
tail = "CR12"
idx_lo = "CR13"
idx_hi = "CR14"
ir = "CR15"
k = "LR11"
in0_d2 = "LR12"
blocks = "LR13"
copy_rows = "LR14"
row_step = "LR15"

[cases.default]
