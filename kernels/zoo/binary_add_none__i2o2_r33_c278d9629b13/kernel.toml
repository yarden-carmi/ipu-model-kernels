[kernel]
op = "binary_add"
formats = ["e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.const]
type = "float"
default = 1.0
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.numel]
type = "int"
min = 1
max = 786432
default = 196608
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.in0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 768
[params.out0_d0]
type = "int"
min = 1
max = 4096
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 256
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 768

[derived]
chunks = "ceil(in0_d2 / 128)"
rows = "in0_d0 * in0_d1 * chunks"
last_chunk = "chunks - 1"
ds_tail = "ds(in0_d2 - last_chunk * 128)"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "chunks * 128"]
range = [-2.0, 2.0]
[inputs.operand]
shape = ["in0_d0", "in0_d1", "chunks * 128"]
range = [-2.0, 2.0]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "ceil(out0_d2 / 128) * 128"]

[abi]
in0 = "CR2"
operand = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
rows = "CR6"
last_chunk = "CR7"
ds_tail = "CR8"
qf_operand = "CR9"
qf_out0 = "CR10"

[golden]
tolerance = { e2 = "EXACT" }
[cases.default]
