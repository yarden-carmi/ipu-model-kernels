[kernel]
op = "bmm"
formats = ["e2"]
[params.b]
type = "int"
min = 1
max = 256
default = 12
[params.k]
type = "int"
min = 1
max = 4096
default = 64
[params.m]
type = "int"
min = 1
max = 4096
default = 197
[params.n]
type = "int"
min = 1
max = 4096
default = 197
[inputs.in0]
shape = [1, "m", "b*k"]
range = [-2, 2]
[inputs.in1]
shape = [1, "b*k", "ceil(n/128)*128"]
range = [-2, 2]
[outputs.out0]
shape = [1, "b", "m", "n"]
[derived]
arows = "ceil(b*k/128)"
nchunks = "ceil(n/128)"
total = "b*k"
dsfull = "ds(128)"
dstail = "ds(n-(nchunks-1)*128)"
[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
b = "CR5"
k = "CR6"
m = "CR7"
nchunks = "CR8"
arows = "CR9"
dsfull = "CR10"
qf_in0 = "CR11"
qf_in1 = "CR12"
qf_out0 = "CR13"
dstail = "CR14"
[cases.default]
b = 12
k = 64
m = 197
n = 197
