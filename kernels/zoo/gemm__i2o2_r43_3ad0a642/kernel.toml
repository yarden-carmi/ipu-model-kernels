[kernel]
op = "gemm"
formats = ["e2", "e3"]

[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 16384
default = 384
[params.m]
type = "int"
min = 1
max = 16384
default = 257
[params.n]
type = "int"
min = 1
max = 16384
default = 384
[params.in0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 6
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 257
[params.in0_d3]
type = "int"
min = 1
max = 16384
default = 64
[params.out0_d0]
type = "int"
min = 1
max = 16384
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 257
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 384

[derived]
chunks = "ceil(in0_d2 / 128)"
tiles = "ceil(out0_d2 / 128)"
full = "ds(128)"
tail = "ds((out0_d2 - 1) % 128 + 1)"
rows = "out0_d0 * out0_d1"
wrap = "(in0_d3 - 1) * chunks + 1"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d3 * chunks", 128]
range = [-2, 2]
[inputs.w]
shape = ["tiles * (k + 1) * 4", 128]
range = [-1, 1]
[outputs.out0]
shape = ["rows * tiles", 128]

[abi]
in0 = "CR2"
w = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
tiles = "CR7"
full = "CR8"
tail = "CR9"
rows = "CR10"
in0_d2 = "CR11"
in0_d3 = "CR12"
in0_d1 = "CR13"
chunks = "CR14"
wrap = "CR15"

[cases.default]
k = 6
m = 257
n = 384
in0_d1 = 2
in0_d2 = 257
in0_d3 = 3
out0_d1 = 257
out0_d2 = 384
