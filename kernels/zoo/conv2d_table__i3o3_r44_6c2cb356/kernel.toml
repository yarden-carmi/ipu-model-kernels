[kernel]
op = "conv2d_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["hardswish"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 640
default = 3
[params.cout]
type = "int"
min = 1
max = 640
default = 16
[params.groups]
type = "int"
min = 1
max = 640
default = 1
[params.h]
type = "int"
min = 1
max = 256
default = 8
[params.w]
type = "int"
min = 1
max = 256
default = 8
[params.kh]
type = "int"
choices = [3, 5]
default = 3
[params.kw]
type = "int"
choices = [3, 5]
default = 3
[params.padding]
type = "int"
choices = [1, 2]
default = 1
[params.stride]
type = "int"
min = 1
max = 2
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 640
default = 3
[params.in0_d2]
type = "int"
min = 1
max = 256
default = 8
[params.in0_d3]
type = "int"
min = 1
max = 256
default = 8
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 640
default = 16
[params.out0_d2]
type = "int"
min = 1
max = 256
default = 8
[params.out0_d3]
type = "int"
min = 1
max = 256
default = 8

[derived]
ix = "ceil(in0_d3 / 128)"
ox = "ceil(out0_d3 / 128)"
ds128 = "ds(128)"
ds_tail = "ds(1 + (out0_d3 - 1) % 128)"
pack = "1 + min(1, groups - 1) * (1 // (1 + cin - groups)) * (1 // (1 + cout - groups)) * (1 // (1 + max((2 * padding - kw) // stride + 1, -((2 * padding - kw) // stride + 1)))) * (1 - w % stride) * (128 // min(128, w) - 1)"
ilen = "ceil(in0_d1 / pack)"
packed = "min(1, pack - 1)"
olen = "ceil(out0_d1 / (pack * (1 + packed * (stride - 1))))"
plane = "(in0_d2 + 2 * padding) * (packed * stride + (1 - packed) * kw * ox)"
gcin = "cin // groups"
wrows = "(2 + 2 * (packed * kh * kw + (1 - packed) * gcin)) * olen"

[inputs.in0]
shape = ["in0_d0", "in0_d2", "ilen", "ix", 128]
range = [-2, 2]
[inputs.weights]
shape = ["wrows", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[scratch.pad]
shape = ["(packed * olen + (1 - packed) * ilen) * plane", 128]
[outputs.out0]
shape = ["out0_d0", "out0_d2", "olen", "ox", 128]

[abi]
in0 = "CR2"
out0 = "CR3"
weights = "CR4"
lut = "CR5"
pad = "CR6"
qf_in0 = "CR7"
qf_weights = "CR8"
qf_out0 = "CR9"
ds128 = "CR10"
ds_tail = "CR11"
plane = "CR12"
gcin = "CR13"
cout = "CR14"
out0_d2 = "CR15"

[golden]
tolerance = { e1 = "NX8_STEP", e2 = "NX8_STEP" }
[cases.default]
