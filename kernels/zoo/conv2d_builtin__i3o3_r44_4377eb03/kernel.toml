[kernel]
op = "conv2d_builtin"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["relu"]
default = "relu"
[params.bias]
type = "bool"
default = true
[params.cin]
type = "int"
min = 1
max = 128
default = 88
[params.cout]
type = "int"
min = 1
max = 128
default = 88
[params.groups]
type = "int"
choices = [16, 72, 88]
default = 88
[params.h]
type = "int"
min = 1
max = 224
default = 28
[params.w]
type = "int"
min = 1
max = 128
default = 28
[params.kh]
type = "int"
choices = [3]
default = 3
[params.kw]
type = "int"
choices = [3]
default = 3
[params.padding]
type = "int"
choices = [1]
default = 1
[params.stride]
type = "int"
choices = [1, 2]
default = 1
[params.in0_d0]
type = "int"
choices = [1]
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 128
default = 88
[params.in0_d2]
type = "int"
min = 1
max = 224
default = 28
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 28
[params.out0_d0]
type = "int"
choices = [1]
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 128
default = 88
[params.out0_d2]
type = "int"
min = 1
max = 224
default = 28
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 28

[derived]
full = "ds(128)"
tail = "ds(out0_d3)"
nrows = "in0_d1 * in0_d2 - 1"

[inputs.in0]
shape = ["in0_d0", "in0_d1", "in0_d2", "ceil(in0_d3 / 128)", 128]
range = [-1, 1]
[inputs.weights]
shape = ["cout * 30", 128]
range = [-1, 1]
[outputs.out0]
shape = ["out0_d0", "out0_d1", "out0_d2", "ceil(out0_d3 / 128)", 128]
[scratch.staged]
shape = ["in0_d1 * in0_d2 * 3", 128]

[abi]
in0 = "CR2"
weights = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_out0 = "CR6"
full = "CR7"
tail = "CR8"
nrows = "CR9"
staged = "CR15"

[cases.default]
