# layernorm_rsqrt_nx8: y = (x - mean) / sqrt(var + eps) * gamma + beta over
# the channels of each token, x [tokens, channels] (channels last), built from
# the hardware's rsqrt (the .asm header has the dataflow). Hardware-clean:
# every store is ACTIVATE.QUANTIZE. In e4 every vector the program multiplies
# again (the centered and normalized values) and every per-token scalar (the
# mean, the variance, rsqrt) is kept as a hi + lo pair of e4 rows.
[kernel]
op = "layernorm"
formats = ["e4", "fp32"]

[params]
# A token is ceil(channels / 128) XMEM rows (chunks). NX8 addresses 16384
# rows: x and y take tokens * cpr each, gamma and beta cpr each, the work rows
# 3 * cpr and the constant and scalar rows 6. The domain is a box, so its
# corner (2560 channels, cpr 20, 406 tokens) must fit: 40 * 406 + 106 = 16346.
channels = { type = "int", min = 1, max = 2560 }
tokens   = { type = "int", min = 1, max = 406 }
layout   = { type = "str", choices = ["channels_last"], default = "channels_last" }
# A MULT constant both modes hold exactly: 21 * 2^-21 (1e-5 to 0.14 %),
# 67 * 2^-26 (1e-6 to 0.17 %) or 0.
eps      = { type = "float", choices = [1.0013580322265625e-05, 9.98377799987793e-07, 0.0], default = 1.0013580322265625e-05 }

[derived]
cpr   = "ceil(channels / 128)"                 # chunks (XMEM rows) per token
nlast = "channels - 128 * (cpr - 1)"           # valid lanes of a token's last chunk
# 2^floor(log2(channels)), for channels < 4096: one factor 2 per power of two
# that channels reaches.
p2    = "(1 + min(1, channels // 2)) * (1 + min(1, channels // 4)) * (1 + min(1, channels // 8)) * (1 + min(1, channels // 16)) * (1 + min(1, channels // 32)) * (1 + min(1, channels // 64)) * (1 + min(1, channels // 128)) * (1 + min(1, channels // 256)) * (1 + min(1, channels // 512)) * (1 + min(1, channels // 1024)) * (1 + min(1, channels // 2048))"
dsx   = "halves(ds(nlast), ds(1))"             # LOW: the last chunk's DS; HIGH: one element (scalar rows)
qf    = "halves(case_qf, qf(0, 1))"            # LOW: the case's QF; HIGH: unsigned e1, 8 significant bits (rsqrt)

[inputs.x]
shape = ["tokens", "channels"]                 # cpr rows per token, zero-padded
range = [-4, 4]

[inputs.gamma]
shape = ["channels"]                           # cpr rows, zero past channels
range = [-2, 2]

[inputs.beta]
shape = ["channels"]
range = [-1, 1]

[outputs.y]
shape = ["tokens", "channels"]

# 1 / channels = kh + kl. kh is 1 / channels rounded to 4 significant bits
# (16 p2 / channels rounded half up, over 16 p2), which e4 holds exactly; kl
# is the rest, rounded by the store to the variant (e4: 4 more bits).
[scratch.kh]
shape = [1, 128]
fill = "(32 * p2 + channels) // (2 * channels) / (16 * p2)"

[scratch.kl]
shape = [1, 128]
fill = "1 / channels - (32 * p2 + channels) // (2 * channels) / (16 * p2)"

# Rows [0, cpr): 1.0 on each chunk's valid lanes (the program zeroes the last
# chunk's padding lanes once); [cpr, 2 cpr): d_hi, then n_hi; [2 cpr, 3 cpr):
# d_lo, then n_lo, of the token in progress.
[scratch.work]
shape = ["3 * cpr", 128]
fill = 1.0

[scratch.sc]                                   # per-token scalars, one element each
shape = [4, 128]

[abi]
x      = "CR2"
y      = "CR3"
gamma  = "CR4"
beta   = "CR5"
kh     = "CR6"
kl     = "CR7"
work   = "CR8"
sc     = "CR9"
cpr    = "CR10"
tokens = "CR11"
dsx    = "CR12"
eps    = "CR13"
qf     = "CR14"

[golden]
reference = "reference.py:reference"
# FP32: kl holds 1 / channels - kh to float32, every hi + lo split leaves
# lo = 0, so only the FP32 chain differs.
# e4: an absolute bound, not NX8 steps. y = n gamma + beta cancels near 0,
# where the grid of y's row is far finer than the error of the 8-bit hi + lo
# intermediates (measured up to 70 steps there), so NX8_STEP cannot hold.
# rtol 0.125 is one step of y's grid in the element's own binade (y rounds
# to e4 near a boundary of the golden's grid); atol 2^-7 covers the
# intermediates, each hi + lo pair good to about 2^-9 of |n gamma| (at most
# 3.5 with these ranges). Measured: the worst element needs atol 0.0029 in
# the default tier (0.0016 for a constant token) and 0.0053 in the nightly
# tier (1152 x 256); 0.004 failed 4 of the 13 nightly cases.
tolerance = { fp32 = "FP32_ORDER", e4 = { tier = "TRANSCENDENT", rtol = 0.125, atol = 0.0078125, why = "one e4 step of y (rtol), plus the 8-bit hi + lo intermediates near y = 0 (atol 2^-7): measured 0.0053 at most" } }

[cases.default]                                # distilbert, bart, opt, pythia: 768 channels
channels = 768
tokens = 4

[cases.small]                                  # one channel, part of a chunk, one chunk, 128 + 1, two chunks
channels = [1, 8, 100, 128, 129, 200]
tokens = 2

[cases.shapes]                                 # every signature's channel count, a few tokens each
channels = [96, 192, 384, 512, 1024, 1152, 1280, 2560]
tokens = 3

[cases.offset]                                 # mean six standard deviations from 0
channels = [96, 768]
tokens = 3
generator = "gen.py:offset"

[cases.residual]                               # outlier channels at +-20
channels = [384, 768]
tokens = 3
generator = "gen.py:residual"

[cases.constant]                               # zero variance: y = beta
channels = [8, 768]
tokens = 2
generator = "gen.py:constant"

[cases.eps]                                    # the other eps values
channels = 192
tokens = 2
eps = [9.98377799987793e-07, 0.0]

[cases.sig_tokens]                             # 768 channels at the signatures' small token counts
channels = 768
tokens = [1, 49, 50, 64, 99]
formats = ["e4"]

# The real signature shapes with more tokens.
[cases.c384]                                   # convnext, swin, deit
channels = 384
tokens = [196, 197]
formats = ["e4"]
tier = "nightly"

[cases.c512]                                   # hubert, wav2vec2, clip
channels = 512
tokens = [64, 99]
formats = ["e4"]
tier = "nightly"

[cases.c768]                                   # bart, siglip, vit, distilbert, opt, pythia
channels = 768
tokens = [196, 197, 256]
formats = ["e4"]
tier = "nightly"

[cases.c1024]                                  # roberta-large
channels = 1024
tokens = 256
formats = ["e4"]
tier = "nightly"

[cases.c1152]                                  # DiT-XL-2-256
channels = 1152
tokens = 256
formats = ["e4"]
tier = "nightly"

[cases.c1280]                                  # whisper-large-v3
channels = 1280
tokens = 32
formats = ["e4"]
tier = "nightly"

[cases.c2560]                                  # phi-2
channels = 2560
tokens = [1, 256]
formats = ["e4"]
tier = "nightly"

[cases.corner]                                 # the domain's corner: all 16384 NX8 rows but 39
channels = 2560
tokens = 406
formats = ["e4"]
tier = "nightly"
