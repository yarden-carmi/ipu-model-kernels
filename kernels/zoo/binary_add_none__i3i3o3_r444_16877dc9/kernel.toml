[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params]
broadcast = { type = "str", choices = ["none"], default = "none" }
inner = { type = "int", min = 0, max = 0, default = 0 }
op = { type = "str", choices = ["add"], default = "add" }
numel = { type = "int", min = 1, max = 16777216, default = 4096 }
in0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in0_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
in0_d2 = { type = "int", min = 1, max = 16777216, default = 8 }
in0_d3 = { type = "int", min = 1, max = 128, default = 8 }
in1_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
in1_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
in1_d2 = { type = "int", min = 1, max = 16777216, default = 8 }
in1_d3 = { type = "int", min = 1, max = 128, default = 8 }
out0_d0 = { type = "int", min = 1, max = 16777216, default = 1 }
out0_d1 = { type = "int", min = 1, max = 16777216, default = 64 }
out0_d2 = { type = "int", min = 1, max = 16777216, default = 8 }
out0_d3 = { type = "int", min = 1, max = 128, default = 8 }

[derived]
pack = "128 // out0_d3"
tiles = "ceil(out0_d2 / pack)"
rows = "out0_d1 * out0_d0 * tiles"
before_tail = "tiles - 1"
active = "ds(pack * out0_d3)"
tail = "ds((out0_d2 - before_tail * pack) * out0_d3)"

[inputs.in0]
shape = ["in0_d1", "in0_d0", "ceil(in0_d2 / (128 // in0_d3))", 128]
range = [-2, 2]

[inputs.in1]
shape = ["in1_d1", "in1_d0", "ceil(in1_d2 / (128 // in1_d3))", 128]
range = [-2, 2]

[outputs.out0]
shape = ["rows", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
rows = "CR8"
before_tail = "CR9"
active = "CR10"
tail = "CR11"

[cases.default]
