[kernel]
op = "binary_add"
formats = ["e1", "e2"]

[params.broadcast]
type = "str"
choices = ["none"]
default = "none"
[params.inner]
type = "int"
min = 0
max = 0
default = 0
[params.op]
type = "str"
choices = ["add"]
default = "add"
[params.numel]
type = "int"
min = 1
max = 16777216
default = 16384
[params.in0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in0_d2]
type = "int"
min = 1
max = 16384
default = 16
[params.in0_d3]
type = "int"
min = 1
max = 128
default = 16
[params.in1_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.in1_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.in1_d2]
type = "int"
min = 1
max = 16384
default = 16
[params.in1_d3]
type = "int"
min = 1
max = 128
default = 16
[params.out0_d0]
type = "int"
min = 1
max = 1024
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 16384
default = 64
[params.out0_d2]
type = "int"
min = 1
max = 16384
default = 16
[params.out0_d3]
type = "int"
min = 1
max = 128
default = 16

[derived]
rows = "out0_d1 * out0_d0 * ceil(out0_d2 / (128 // out0_d3)) - 1"
row_group = "ceil(out0_d2 / (128 // out0_d3))"
full_mask = "ds((128 // out0_d3) * out0_d3)"
tail_mask = "ds(((out0_d2 - 1) % (128 // out0_d3) + 1) * out0_d3)"
fast_limit = "rows - 1"
minus_one = "-1"

[inputs.in0]
shape = ["in0_d1", "in0_d0", "ceil(in0_d2 / (128 // in0_d3)) * 128"]
range = [-2, 2]
[inputs.in1]
shape = ["in1_d1", "in1_d0", "ceil(in1_d2 / (128 // in1_d3)) * 128"]
range = [-2, 2]
[outputs.out0]
shape = ["out0_d1", "out0_d0", "ceil(out0_d2 / (128 // out0_d3)) * 128"]

[abi]
in0 = "CR2"
in1 = "CR3"
out0 = "CR4"
qf_in0 = "CR5"
qf_in1 = "CR6"
qf_out0 = "CR7"
rows = "CR8"
row_group = "CR9"
full_mask = "CR10"
tail_mask = "CR11"
fast_limit = "CR12"
minus_one = "CR13"

[cases.default]
