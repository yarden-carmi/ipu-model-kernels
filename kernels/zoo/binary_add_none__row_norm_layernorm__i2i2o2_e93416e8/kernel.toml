[kernel]
op = "binary_add_none__row_norm_layernorm"
formats = ["e2"]

[params.s0_broadcast]
type = "str"
default = "none"
choices = ["none"]
[params.s0_inner]
type = "int"
default = 0
[params.s0_numel]
type = "int"
default = 147456
[params.s0_op]
type = "str"
default = "add"
choices = ["add"]
[params.s1_channels]
type = "int"
default = 144
choices = [144, 192, 240]
[params.s1_eps]
type = "float"
default = 0.00001
[params.s1_kind]
type = "str"
default = "layernorm"
choices = ["layernorm"]
[params.s1_rows]
type = "int"
default = 1024
min = 1
[params.in0_d0]
type = "int"
default = 4
min = 1
max = 128
[params.in0_d1]
type = "int"
default = 256
min = 1
[params.in0_d2]
type = "int"
default = 144
choices = [144, 192, 240]
[params.in1_d0]
type = "int"
default = 4
[params.in1_d1]
type = "int"
default = 256
[params.in1_d2]
type = "int"
default = 144
[params.out0_d0]
type = "int"
default = 4
[params.out0_d1]
type = "int"
default = 256
[params.out0_d2]
type = "int"
default = 144
[derived]
dsl = "ds(s1_channels - 128)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * ((in0_d2 + 127) // 128)", 128]
range = [-2.0, 2.0]
[inputs.in1]
shape = ["in1_d0 * in1_d1 * ((in1_d2 + 127) // 128)", 128]
range = [-2.0, 2.0]
[inputs.gamma]
shape = [6, 128]
[inputs.beta]
shape = [6, 128]
[inputs.crow]
shape = [3, 128]
[inputs.epsilon]
shape = [128]
[scratch.tmp]
shape = [40, 128]
[scratch.sum]
shape = ["4 * s1_rows", 128]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * ((out0_d2 + 127) // 128)", 128]

[abi]
in0 = "CR2"
in1 = "CR3"
qf_in0 = "CR4"
qf_in1 = "CR5"
qf_out0 = "CR6"
sum = "CR7"
tmp = "CR8"
out0 = "CR9"
gamma = "CR10"
beta = "CR11"
crow = "CR12"
epsilon = "CR13"
dsl = "CR14"

[golden]
tolerance = { e2 = "NX8_STEP" }

[cases.default]
