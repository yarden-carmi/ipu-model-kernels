[kernel]
op = "gemm_table"
formats = ["e1", "e2"]

[params.act_out0]
type = "str"
choices = ["hardswish", "hardsigmoid"]
default = "hardswish"
[params.bias]
type = "bool"
default = true
[params.k]
type = "int"
min = 1
max = 4096
default = 40
[params.n]
type = "int"
min = 1
max = 4096
default = 240
[params.m]
type = "int"
min = 1
max = 65535
default = 196
[params.in0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.in0_d1]
type = "int"
min = 1
max = 4096
default = 40
[params.in0_d2]
type = "int"
min = 1
max = 65535
default = 14
[params.in0_d3]
type = "int"
min = 1
max = 65535
default = 14
[params.out0_d0]
type = "int"
min = 1
max = 65535
default = 1
[params.out0_d1]
type = "int"
min = 1
max = 4096
default = 240
[params.out0_d2]
type = "int"
min = 1
max = 65535
default = 14
[params.out0_d3]
type = "int"
min = 1
max = 65535
default = 14

[derived]
width_tiles = "ceil(out0_d3 / 128)"
plane = "out0_d2 * width_tiles"
batch_stride = "k * plane"
parts = "2 + min(1, m - 1)"
scalar_bank = "128"
coeff_stride = "parts * ceil(k / 127)"
coeff_end = "n * coeff_stride"
full_ds = "ds(128)"
tail_ds = "ds(1 + (out0_d3 - 1) % 128)"

[inputs.in0]
shape = ["in0_d0 * in0_d1 * in0_d2 * ceil(in0_d3 / 128)", 128]
range = [-2, 2]
[inputs.coeff]
shape = ["coeff_end", 128]
range = [-1, 1]
[inputs.lut]
shape = [5, 128]
range = [0, 0]
[outputs.out0]
shape = ["out0_d0 * out0_d1 * plane", 128]

[abi]
in0 = "CR2"
coeff = "CR3"
out0 = "CR4"
lut = "CR5"
qf_in0 = "CR6"
qf_out0 = "CR7"
full_ds = "CR8"
tail_ds = "CR9"
plane = "CR10"
batch_stride = "CR11"
coeff_stride = "CR12"
coeff_end = "CR13"
width_tiles = "CR14"
scalar_bank = "CR15"
out0_d0 = "LR15"

[cases.default]
